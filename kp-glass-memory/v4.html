<!DOCTYPE html>
<html lang="ru">
<!--
  GLASS-MEMORY · Генератор КП v4 · каркас + модули · встроенный редактор
  Структура: 12 фиксированных блоков (по эталону КП GENGLASS) + модули по типам изделий.
  Один JSON (kp) описывает клиента, контакты, позиции, режим цены, видимость блоков и модулей.
  Редактор: кнопка справа сверху. Панель не печатается и не попадает в экспорт HTML.
  Фото: 1.jpg..5.jpg рядом с файлом; при отсутствии слот показывает брендовый градиент.
  Правила: стекло не режется лазером (лазер только металл); гарантия разведена по объёму;
  цифры только из каталога и партнёрского дека; em dash запрещён.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Memory · Коммерческое предложение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#082821; --dark-2:#0C3127; --green:#1F895A; --green-d:#166B45; --forest:#31513A;
  --cream:#F6F7ED; --bg:#FFFFFF; --ink:#15241C; --muted:#56635A; --line:#E3E5DB; --line-dark:#1C4034;
  --serif:'Lora',Georgia,serif; --sans:'Inter','Helvetica Neue',Arial,sans-serif;
  --panel-w:400px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{ outline:2px solid var(--green); outline-offset:3px; border-radius:4px; }
.wrap{ max-width:1120px; margin:0 auto; padding:0 44px; }
h1,h2,h3{ font-family:var(--serif); font-weight:500; line-height:1.22; letter-spacing:-.01em; }
.eyebrow{ font-weight:600; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--green); }
.muted{color:var(--muted)}
.sec{ padding:62px 0; }
.sec h2{ font-size:30px; margin-bottom:14px; }
.sec .intro{ font-size:18px; color:var(--muted); max-width:64ch; margin-bottom:36px; }
.sec.cream{ background:var(--cream); }
svg.ic{ width:26px; height:26px; stroke:var(--green); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
[hidden]{display:none !important}

/* top bar */
.topbar{ background:var(--dark); color:#EAF1ED; }
.topbar .wrap{ display:flex; align-items:center; justify-content:space-between; height:70px; }
.brand{ display:flex; align-items:center; gap:11px; }
.brand .logo{ width:28px; height:35px; }
.brand .name{ font-family:var(--serif); font-weight:600; font-size:20px; color:#fff; }
.topbar .site{ font-size:14px; color:#9DB5A9; }

/* title */
.title{ background:var(--dark); color:#EAF1ED; padding:8px 0 54px; }
.title h1{ color:#fff; font-size:38px; max-width:24ch; }
.title .date{ color:#9DB5A9; font-size:15px; margin-top:16px; }
.contacts{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:32px; max-width:900px; }
.mgr{ display:flex; align-items:center; gap:15px; background:var(--dark-2); border:1px solid var(--line-dark); border-radius:12px; padding:18px 22px; }
.mgr .av{ width:50px; height:50px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:22px; font-weight:600; flex:none; }
.mgr .who b{ color:#fff; font-size:16px; display:block; }
.mgr .who .role{ color:#9DB5A9; font-size:13.5px; }
.mgr .who .c{ color:#CFE0D6; font-size:14px; margin-top:5px; }

/* value cards */
.vals{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.vcard{ border:1px solid var(--line); border-radius:14px; padding:30px 28px; background:#fff; }
.vcard .ico{ width:52px; height:52px; border-radius:12px; background:rgba(31,137,90,.10); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
.vcard h3{ font-size:20px; font-weight:600; }
.vcard p{ font-size:15.5px; color:var(--muted); margin-top:11px; line-height:1.55; }

/* positions */
.pos{ border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.pos .row{ display:grid; grid-template-columns:120px 1fr 140px 64px 140px; gap:24px; padding:22px 26px; border-bottom:1px solid var(--line); align-items:center; }
.pos .row:last-child{ border-bottom:0; }
.pos .head-row{ background:var(--cream); }
.pos .thumb{ width:120px; height:92px; border-radius:9px; object-fit:cover; border:1px solid var(--line); background:linear-gradient(135deg,#EAF1ED,#F6F7ED); }
.pos .nm{ font-weight:600; font-size:16.5px; }
.pos .meta{ font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
.pos .col-h{ font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.pos .unit{ font-size:14px; color:var(--muted); }
.pos .qty{ font-size:15px; text-align:center; }
.pos .sum{ font-family:var(--serif); font-size:19px; font-weight:600; text-align:right; }
.totals{ display:grid; grid-template-columns:1fr 360px; gap:30px; margin-top:24px; align-items:start; }
.tnote{ font-size:13.5px; color:var(--muted); line-height:1.6; background:var(--cream); border-radius:12px; padding:20px 22px; }
.tbox{ border:1px solid var(--line); border-radius:14px; padding:22px 26px; }
.tbox .t{ display:flex; justify-content:space-between; font-size:15px; padding:8px 0; }
.tbox .t span:last-child{ color:var(--green); font-weight:600; }
.tbox .grand{ display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line); margin-top:8px; padding-top:15px; }
.tbox .grand .l{ font-size:15px; color:var(--muted); }
.tbox .grand .v{ font-family:var(--serif); font-size:29px; font-weight:600; color:var(--green); }
.tbox .fine{ font-size:12px; color:var(--muted); margin-top:9px; line-height:1.5; }

/* terms */
.info{ display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.info .i{ padding:24px; border-right:1px solid var(--line); }
.info .i:last-child{ border-right:0; }
.info .h{ font-size:13px; color:var(--green); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.info .d{ font-size:14.5px; margin-top:10px; line-height:1.5; }

/* split */
.split{ display:grid; grid-template-columns:1.05fr .95fr; gap:54px; align-items:center; }
.split .ph{ border-radius:14px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(135deg,#EAF1ED,#F6F7ED); min-height:420px; }
.split .ph img{ width:100%; height:520px; object-fit:cover; }
.split h2{ font-size:32px; margin-bottom:0; }
.split p{ margin-top:18px; }
.split .note{ margin-top:20px; font-size:15px; color:var(--muted); border-left:3px solid var(--green); padding-left:18px; }

/* mount list */
.mlist{ list-style:none; margin-top:22px; display:flex; flex-direction:column; gap:18px; }
.mlist li b{ display:block; }
.mlist li span{ color:var(--muted); font-size:15px; }

/* gallery */
.g3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.g3 .ph{ border-radius:12px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(135deg,#EAF1ED,#F6F7ED); min-height:300px; }
.g3 .ph img{ width:100%; height:300px; object-fit:cover; }
.g3 .cap{ font-size:13.5px; color:var(--muted); padding:12px 4px 0; }

/* materials */
.mats{ display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
.mats h3{ font-size:18px; font-weight:600; margin-bottom:18px; }
.sw{ display:flex; gap:14px; flex-wrap:wrap; }
.sw .s{ text-align:center; font-size:12.5px; color:var(--muted); width:76px; }
.sw .chip{ width:76px; height:58px; border-radius:9px; border:1px solid var(--line); margin-bottom:8px; }

/* process tiles */
.proc{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.ptile{ background:var(--dark); color:#EAF1ED; border-radius:12px; padding:26px 24px; min-height:178px; display:flex; flex-direction:column; justify-content:space-between; }
.ptile .n{ font-family:var(--serif); font-size:22px; color:var(--green); }
.ptile .t{ font-size:16.5px; font-weight:600; color:#fff; }
.ptile .d{ font-size:13.5px; color:#A9C1B4; margin-top:8px; line-height:1.5; }

/* dark */
.dark{ background:var(--dark); color:#EAF1ED; }
.dark h2{ color:#fff; }
.steps{ display:grid; grid-template-columns:repeat(5,1fr); gap:20px; }
.step .n{ font-family:var(--serif); font-size:28px; color:var(--green); }
.step .t{ font-size:16px; font-weight:600; color:#fff; margin-top:10px; }
.step .d{ font-size:13px; color:#A9C1B4; margin-top:7px; line-height:1.5; }
.step .w{ font-size:12px; color:var(--green); font-weight:600; margin-top:9px; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.stat{ background:var(--dark-2); border:1px solid var(--line-dark); border-radius:12px; padding:26px 24px; }
.stat .v{ font-family:var(--serif); font-size:29px; color:#fff; font-weight:600; }
.stat .l{ font-size:13.5px; color:#A9C1B4; margin-top:10px; line-height:1.5; }

/* cost */
.cost{ display:grid; grid-template-columns:330px 1fr; gap:50px; align-items:center; }
.donut{ width:280px; height:280px; border-radius:50%; position:relative; margin:0 auto; }
.donut::after{ content:""; position:absolute; inset:64px; background:var(--cream); border-radius:50%; }
.donut .mid{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:1; }
.donut .mid b{ font-family:var(--serif); font-size:22px; }
.donut .mid span{ font-size:12px; color:var(--muted); }
.legend{ display:flex; flex-direction:column; gap:14px; }
.legend .li{ display:flex; align-items:center; gap:13px; font-size:15px; }
.legend .dot{ width:14px; height:14px; border-radius:4px; flex:none; }
.legend .li b{ margin-left:auto; font-weight:600; }
.path{ margin-top:28px; }
.path .h{ font-weight:600; font-size:16px; margin-bottom:14px; }
.pgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.pg{ font-size:13px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:12px 14px; }
.pg b{ color:var(--green); font-family:var(--serif); font-size:15px; }

/* QC */
.qc{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
.qc .q{ display:flex; align-items:center; gap:13px; font-size:15.5px; font-weight:600; }
.qc .ok{ width:34px; height:34px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; flex:none; }
.qc .ok svg{ width:18px; height:18px; stroke:#fff; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* CTA */
.cta .wrap{ padding:64px 44px; text-align:center; }
.cta h2{ color:#fff; font-size:34px; max-width:24ch; margin:0 auto; }
.cta p{ color:#A9C1B4; margin-top:16px; max-width:50ch; margin-left:auto; margin-right:auto; }
.cta .price{ font-family:var(--serif); font-size:48px; color:var(--green); font-weight:600; margin-top:24px; }
.cta .price small{ font-size:19px; color:#A9C1B4; font-weight:400; }
.cta .btns{ margin-top:26px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
.btn{ display:inline-flex; align-items:center; gap:9px; font-weight:600; font-size:16px; padding:16px 30px; border-radius:10px; text-decoration:none; cursor:pointer; transition:transform .15s ease, background .2s ease; border:0; font-family:var(--sans); }
.btn.p{ background:var(--green); color:#fff; }
.btn.p:hover{ background:var(--green-d); transform:translateY(-1px); }
.btn.g{ background:transparent; color:#EAF1ED; border:1px solid #2C5A48; }
.btn.g:hover{ background:#0E3A2C; }
footer{ background:var(--dark); color:#9DB5A9; padding:28px 0; }
footer .wrap{ display:flex; justify-content:space-between; font-size:13.5px; }

/* dealer value */
.dv{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.dv .card{ border:1px solid var(--line); border-radius:12px; padding:24px; background:#fff; }
.dv .card .v{ font-family:var(--serif); font-size:30px; color:var(--green); font-weight:600; }
.dv .card .l{ font-size:14.5px; color:var(--muted); margin-top:8px; line-height:1.5; }

/* scenario */
.scen{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.scen .card{ border:1px solid var(--line); border-radius:14px; padding:28px; background:#fff; }
.scen .card h3{ font-size:22px; font-weight:600; }
.scen .card p{ color:var(--muted); font-size:15.5px; margin-top:10px; }
.scen .card .tags{ margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
.scen .card .tags span{ font-size:12.5px; background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:5px 11px; }

/* ================= EDITOR ================= */
#edToggle{ position:fixed; top:16px; right:16px; z-index:60; background:var(--green); color:#fff; border:0; border-radius:10px; padding:11px 16px; font:600 14px var(--sans); cursor:pointer; box-shadow:0 6px 20px rgba(8,40,33,.25); display:inline-flex; align-items:center; gap:8px; }
#edToggle svg{ width:16px; height:16px; stroke:#fff; stroke-width:2; fill:none; }
#editor{ position:fixed; top:0; right:0; height:100vh; width:var(--panel-w); background:#fff; border-left:1px solid var(--line); z-index:50; overflow:auto; transform:translateX(100%); transition:transform .25s ease; font-size:13.5px; box-shadow:-10px 0 30px rgba(0,0,0,.08); }
body.ed-open #editor{ transform:none; }
body.ed-open{ padding-right:var(--panel-w); }
#editor .ehead{ position:sticky; top:0; background:var(--dark); color:#fff; padding:16px 18px; z-index:2; }
#editor .ehead b{ font-family:var(--serif); font-size:17px; display:block; }
#editor .ehead span{ color:#9DB5A9; font-size:12px; }
#editor details{ border-bottom:1px solid var(--line); }
#editor summary{ cursor:pointer; padding:13px 18px; font-weight:600; font-size:14px; background:var(--cream); list-style:none; display:flex; justify-content:space-between; align-items:center; }
#editor summary::-webkit-details-marker{display:none}
#editor summary::after{ content:"+"; color:var(--green); font-weight:700; }
#editor details[open] summary::after{ content:"\2212"; }
#editor .ebody{ padding:12px 18px 16px; display:flex; flex-direction:column; gap:10px; }
#editor label{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
#editor label.row{ flex-direction:row; align-items:center; gap:8px; color:var(--ink); font-size:13px; }
#editor input[type=text],#editor input[type=number],#editor input[type=date],#editor select,#editor textarea{ font:13px var(--sans); padding:7px 9px; border:1px solid var(--line); border-radius:7px; width:100%; color:var(--ink); background:#fff; }
#editor textarea{ min-height:56px; resize:vertical; }
#editor .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
#editor .seg{ display:flex; gap:6px; }
#editor .seg button{ flex:1; padding:7px 6px; border:1px solid var(--line); background:#fff; border-radius:7px; font:600 12px var(--sans); cursor:pointer; color:var(--muted); }
#editor .seg button.on{ background:var(--green); color:#fff; border-color:var(--green); }
#editor .item{ border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; background:#FAFBF7; }
#editor .item .ih{ display:flex; justify-content:space-between; align-items:center; font-weight:600; }
#editor .item .ih button{ background:none; border:0; color:#B44; cursor:pointer; font-size:12px; }
#editor .ebtn{ padding:9px 12px; border:1px solid var(--green); background:#fff; color:var(--green); border-radius:8px; font:600 13px var(--sans); cursor:pointer; }
#editor .ebtn.solid{ background:var(--green); color:#fff; }
#editor .ebtn:hover{ filter:brightness(.96); }
#editor .btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
#editor .modrow{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
#editor .modrow .mn{ font-size:13px; }
#editor .modrow .mn small{ display:block; color:var(--muted); font-size:11.5px; }
#editor .tri{ display:flex; gap:3px; }
#editor .tri button{ padding:4px 7px; border:1px solid var(--line); background:#fff; border-radius:6px; font:600 11px var(--sans); cursor:pointer; color:var(--muted); }
#editor .tri button.on{ background:var(--dark); color:#fff; border-color:var(--dark); }
#editor .hint{ font-size:11.5px; color:var(--muted); line-height:1.45; }
#editor .warn{ font-size:12px; color:#8A4B00; background:#FFF6E5; border:1px solid #F1D9A8; border-radius:8px; padding:8px 10px; line-height:1.45; }

@media print{ #editor,#edToggle{display:none !important} body.ed-open{padding-right:0} .sec{break-inside:avoid} }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
@media(max-width:900px){
  .wrap{padding:0 20px}
  .vals,.pos .row,.totals,.info,.contacts,.split,.g3,.mats,.proc,.steps,.stats,.cost,.qc,.pgrid,.dv,.scen{grid-template-columns:1fr}
  .title h1{font-size:28px}
  body.ed-open{padding-right:0}
  #editor{width:100vw}
}
</style>
</head>
<body>

<button id="edToggle" type="button" aria-controls="editor" aria-expanded="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
  Редактор
</button>

<aside id="editor" aria-label="Редактор КП">
  <div class="ehead"><b>Редактор КП</b><span>изменения применяются сразу и сохраняются в браузере</span></div>

  <details open><summary>Пресеты и файлы</summary><div class="ebody">
    <div class="btnrow">
      <button class="ebtn" data-preset="A" type="button">A · Портрет</button>
      <button class="ebtn" data-preset="B" type="button">B · Стела + цветник + ограда</button>
      <button class="ebtn" data-preset="C" type="button">C · Комплекс</button>
    </div>
    <div class="hint">Пресеты B и C - черновики: цены ориентировочные, состав примерный. Через Step 12.5 прошёл только каркас и кейс A.</div>
    <div class="btnrow">
      <button class="ebtn" id="btnJsonDown" type="button">Скачать kp.json</button>
      <label class="ebtn" style="display:inline-block">Загрузить kp.json<input id="jsonUp" type="file" accept="application/json" hidden></label>
    </div>
    <div class="btnrow">
      <button class="ebtn solid" id="btnHtml" type="button">Скачать HTML без панели</button>
      <button class="ebtn" id="btnPrint" type="button">Печать / PDF</button>
      <button class="ebtn" id="btnReset" type="button">Сбросить к A</button>
    </div>
  </div></details>

  <details open><summary>Клиент и режим</summary><div class="ebody" id="edClient"></div></details>
  <details><summary>Контакты</summary><div class="ebody" id="edContacts"></div></details>
  <details open><summary>Позиции</summary><div class="ebody" id="edItems"></div></details>
  <details><summary>Блоки каркаса</summary><div class="ebody" id="edBlocks"></div></details>
  <details><summary>Модули</summary><div class="ebody" id="edModules"></div></details>
  <details><summary>Фото и подписи</summary><div class="ebody" id="edPhotos"></div></details>
</aside>

<main id="kp"></main>

<script>
/* ============================ СПРАВОЧНИКИ ============================ */
const GLASS = ['бесцветное','осветлённое (Crystalvision, +25%)','матовое','тонированное','фактурное'];

const LS = 'gm-kp-v4';
let kp = load() || clone(PRESETS.A);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){ try{ const s=localStorage.getItem(LS); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(kp)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return (Math.round(Number(n)||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' ₽'; }
function itemName(it){ return it.name && it.name.trim() ? it.name : TYPES[it.type].label; }
function itemMeta(it){
  const t=TYPES[it.type]; const parts=[];
  t.fields.forEach(f=>{ if(it[f]) parts.push(FIELD_LABEL[f]+': '+it[f]); });
  return parts.join('. ') + (parts.length?'.':'');
}
function activeTypes(){ return [...new Set(kp.items.map(i=>i.type))]; }
function routeOf(){ const r=new Set(activeTypes().map(t=>TYPES[t].route)); if(r.has('both')||(r.has('glass')&&r.has('metal'))) return 'both'; return r.has('metal')?'metal':'glass'; }
function termOf(){ return activeTypes().some(t=>t==='complex') ? '45-90' : '30'; }
function isOn(mod){
  const ov = kp.modules[mod]; if(ov==='on') return true; if(ov==='off') return false;
  const m=VALUE_MODULES[mod]; if(m && m.auto) return !!m.auto(kp);
  return activeTypes().some(t=>TYPES[t].value.includes(mod));
}
function mountsOn(){
  const types=activeTypes(); const set=new Set();
  if(types.includes('complex')) set.add('mount_complex'); else types.forEach(t=>{ if(TYPES[t].mount) set.add(TYPES[t].mount); });
  Object.keys(MOUNTS).forEach(k=>{ const ov=kp.modules[k]; if(ov==='on') set.add(k); if(ov==='off') set.delete(k); });
  return [...set];
}
function blockOn(b){ return kp.blocks[b]!==false; }
function priceCell(n){
  n=Number(n)||0;
  if(n===0 && kp.price_mode!=='dealer') return 'по смете';
  if(kp.price_mode==='orientir') return 'от '+money(n);
  return money(n);
}

function renderProcess(){
  const r=routeOf();
  const glass=[['Раскрой стекла','Фигурная резка, обработка кромки и отверстия под крепёж.'],['Керамическая печать','Портрет наносим керамическими красками.'],['Закалка 600 °C и триплекс','Краски впекаются, два стекла соединяем плёнкой EVA.'],['Сборка и ОТК','Крепёж, проверка, упаковка.']];
  const metal=[['Лазерная резка металла','Труболазер и листовой лазер, точность 0,1 мм.'],['Гибка и сварка','Гибка на ЧПУ, сварка TIG для видимых швов.'],['Порошковая окраска','Грунт плюс краска по RAL, 160-200 °C.'],['Сборка и ОТК','Монтаж узлов, проверка, упаковка.']];
  const both=[['Раскрой стекла','Фигурная резка, кромка, отверстия под крепёж.'],['Керамическая печать','Портрет красками, впекается при закалке.'],['Закалка 600 °C и триплекс','Краски впекаются, два стекла соединяем плёнкой EVA.'],['Металл и сборка','Лазерная резка стали 0,1 мм, окраска RAL, монтаж узлов.']];

function renderCost(){
  const r=routeOf();

            : r==='metal' ? [['Металл и лазерная резка',44,'var(--green)'],['Гибка и сварка',18,'var(--forest)'],['Порошковая окраска',20,'#6FA98C'],['Монтаж и доставка',18,'#B7CBBE']]
            : [['Стекло и керамическая печать',38,'var(--green)'],['Металл и лазерная резка',26,'var(--forest)'],['Закалка и триплекс',20,'#6FA98C'],['Монтаж и доставка',16,'#B7CBBE']];
  let acc=0; const grad = seg.map(s=>{ const a=acc; acc+=s[1]; return `${s[2]} ${a}% ${acc}%`; }).join(', ');
  const path = r==='metal' ? ['Макет 3D','Лазерная резка','Гибка','Сварка','Окраска','Сборка','ОТК','Доставка'] : r==='glass' ? ['Макет 3D','Раскрой','Печать','Закалка','Триплекс','Сборка','ОТК','Доставка'] : ['Макет 3D','Раскрой стекла','Печать','Закалка','Лазер по металлу','Сборка','ОТК','Доставка'];
  return section('cream', `<h2>Из чего складывается стоимость</h2><p class="intro">Доли ориентировочные, показывают состав сметы, а не точный расчёт.</p><div class="cost">
    <div class="donut" style="background:conic-gradient(${grad})"><div class="mid"><b>100%</b><span>состав сметы</span></div></div>
    <div><div class="legend">${seg.map(s=>`<div class="li"><span class="dot" style="background:${s[2]}"></span>${s[0]} <b>${s[1]}%</b></div>`).join('')}</div>

  </div>`);
}

    const t = dealer ? 'Запросите бесплатный образец и дилерский прайс' : 'Подтвердите состав, и мы покажем изделие в 3D';
    const p = dealer ? 'Образец 380×380 мм, каталог, обучение продавцов и страница на сайте с поддоменом вашего города входят в стартовый пакет.' : 'Производство начинаем только после Вашего одобрения макета. Так Вы видите результат заранее и решаете спокойно.';
    const price = pm==='dealer' ? '' : (grand>0 ? `<div class="price">${priceCell(grand)} ${pm==='orientir'?'<small>ориентировочно</small>':''}</div>` : `<p style="margin-top:22px;color:#EAF1ED;font-family:var(--serif);font-size:24px">Смету подтвердим после замера и 3D-макета</p>`);
    h.push(`<section class="cta dark"><div class="wrap"><h2>${t}</h2><p>${p}</p>${price}<div class="btns"><a class="btn p" href="mailto:${esc(kp.contacts[0].email)}">${dealer?'Запросить образец':'Отправить фото и размеры'}</a><a class="btn g" href="tel:${esc((kp.contacts[0].phone||'').replace(/[^\d+]/g,''))}">Позвонить · ${esc(kp.contacts[0].phone)}</a></div></div></section>`);
  }
  h.push(`<footer><div class="wrap"><span>Glass Memory · производство с 2016 года, Домодедово</span><span>${dealer?'Предложение для партнёра':'Персональное предложение'} · ${esc(c.name)} · ${c.date?c.date.slice(0,4):''}</span></div></footer>`);
  document.getElementById('kp').innerHTML = h.join('');
  document.querySelectorAll('#kp img').forEach(im=>{ im.addEventListener('error',()=>{ im.style.visibility='hidden'; }); });
  save();
}

/* ============================ РЕДАКТОР ============================ */
const $=s=>document.querySelector(s);
function inp(label, val, on, type='text'){ const l=document.createElement('label'); l.innerHTML=`${label}<input type="${type}" value="${esc(val)}">`; l.querySelector('input').addEventListener('input',e=>{ on(e.target.value); render(); }); return l; }
function sel(label, opts, val, on){ const l=document.createElement('label'); l.innerHTML=`${label}<select>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; l.querySelector('select').addEventListener('change',e=>{ on(e.target.value); render(); }); return l; }
function seg(opts, val, on){ const d=document.createElement('div'); d.className='seg'; opts.forEach(([k,lab])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=lab; if(k===val) b.classList.add('on'); b.addEventListener('click',()=>{ on(k); buildEditor(); render(); }); d.appendChild(b); }); return d; }

function buildEditor(){
  /* клиент */
  const ec=$('#edClient'); ec.innerHTML='';
  ec.appendChild(Object.assign(document.createElement('div'),{className:'hint',textContent:'Тип клиента'}));
  ec.appendChild(seg([['person','Физлицо'],['dealer','Дилер'],['complex','Комплекс']], kp.client.type, v=>{ kp.client.type=v; }));
  ec.appendChild(inp('Кому (в родительном падеже)', kp.client.name, v=>kp.client.name=v));
  ec.appendChild(inp('Заголовок предложения', kp.client.subject, v=>kp.client.subject=v));
  ec.appendChild(inp('Дата', kp.client.date, v=>kp.client.date=v, 'date'));
  ec.appendChild(Object.assign(document.createElement('div'),{className:'hint',textContent:'Режим цены'}));
  ec.appendChild(seg([['orientir','Ориентир'],['smeta','Смета'],['dealer','Дилерский']], kp.price_mode, v=>{ kp.price_mode=v; }));
  if(kp.price_mode!=='dealer'){ const w=document.createElement('div'); w.className='warn'; w.textContent='Розничного прайса для физлица в каноне нет. Суммы ниже - ориентир; перед отправкой подставьте реальные.'; ec.appendChild(w); }

  /* контакты */
  const ek=$('#edContacts'); ek.innerHTML='';
  kp.contacts.slice(0,2).forEach((p,i)=>{ const box=document.createElement('div'); box.className='item'; box.innerHTML=`<div class="ih">Контакт ${i+1}</div>`; box.appendChild(inp('Имя',p.name,v=>p.name=v)); box.appendChild(inp('Роль',p.role,v=>p.role=v)); const g=document.createElement('div'); g.className='grid2'; g.appendChild(inp('Телефон',p.phone,v=>p.phone=v)); g.appendChild(inp('Email',p.email,v=>p.email=v)); box.appendChild(g); ek.appendChild(box); });

  /* позиции */
  const ei=$('#edItems'); ei.innerHTML='';
  kp.items.forEach((it,idx)=>{
    const box=document.createElement('div'); box.className='item';
    const ih=document.createElement('div'); ih.className='ih'; ih.innerHTML=`<span>Позиция ${idx+1}</span>`; const del=document.createElement('button'); del.type='button'; del.textContent='удалить'; del.addEventListener('click',()=>{ kp.items.splice(idx,1); if(!kp.items.length) kp.items.push(clone(PRESETS.A.items[0])); buildEditor(); render(); }); ih.appendChild(del); box.appendChild(ih);
    box.appendChild(sel('Тип изделия', Object.keys(TYPES).map(k=>TYPES[k].label), TYPES[it.type].label, v=>{ const key=Object.keys(TYPES).find(k=>TYPES[k].label===v); it.type=key; const d=TYPES[key].def||{}; TYPES[key].fields.forEach(f=>{ if(f==='glass') it.glass=it.glass||GLASS[0]; else if(f==='form') it.form=it.form||FORMS[0]; else if(f==='mount') it.mount=MOUNTS[TYPES[key].mount][0]; else it[f]=d[f]||it[f]||''; }); buildEditor(); }));
    box.appendChild(inp('Название (пусто = по типу)', it.name||'', v=>it.name=v));
    const t=TYPES[it.type];
    t.fields.forEach(f=>{
      if(f==='glass') box.appendChild(sel('Стекло', GLASS, it.glass||GLASS[0], v=>it.glass=v));
      else if(f==='form') box.appendChild(sel('Форма', FORMS, it.form||FORMS[0], v=>it.form=v));
      else if(f==='mount') box.appendChild(sel('Крепление', MOUNTS[t.mount], it.mount||MOUNTS[t.mount][0], v=>it.mount=v));
      else box.appendChild(inp(FIELD_LABEL[f], it[f]||'', v=>it[f]=v));
    });
    const g=document.createElement('div'); g.className='grid2'; g.appendChild(inp('Кол-во', it.qty||1, v=>it.qty=Number(v)||1,'number')); g.appendChild(inp('Цена, ₽', it.price||0, v=>it.price=Number(v)||0,'number')); box.appendChild(g);
    ei.appendChild(box);
  });
  const add=document.createElement('button'); add.type='button'; add.className='ebtn'; add.textContent='+ Добавить позицию'; add.addEventListener('click',()=>{ kp.items.push(clone(PRESETS.A.items[0])); buildEditor(); render(); }); ei.appendChild(add);
  const exh=document.createElement('div'); exh.className='hint'; exh.textContent='Дополнительные строки итога'; ei.appendChild(exh);
  kp.extras.forEach((e,i)=>{ const g=document.createElement('div'); g.className='grid2'; g.appendChild(inp('Строка',e[0],v=>e[0]=v)); g.appendChild(inp('Сумма (число или текст)', e[1], v=>{ const n=Number(v); e[1]=(v.trim()!==''&&!isNaN(n))?n:v; })); ei.appendChild(g); });

  /* блоки */
  const eb=$('#edBlocks'); eb.innerHTML='';
  BLOCKS.forEach(([k,lab])=>{ const l=document.createElement('label'); l.className='row'; const c=document.createElement('input'); c.type='checkbox'; c.checked=blockOn(k); c.addEventListener('change',()=>{ kp.blocks[k]=c.checked; render(); }); l.appendChild(c); l.appendChild(document.createTextNode(lab)); eb.appendChild(l); });

  /* модули */
  const em=$('#edModules'); em.innerHTML='';
  const hint=document.createElement('div'); hint.className='hint'; hint.textContent='Авто = модуль включается по типам изделий в позициях. Принудительно: вкл / выкл.'; em.appendChild(hint);
  const addMod=(key,name,sub)=>{ const row=document.createElement('div'); row.className='modrow'; row.innerHTML=`<div class="mn">${esc(name)}<small>${esc(sub)}</small></div>`; const tri=document.createElement('div'); tri.className='tri'; [['auto','авто'],['on','вкл'],['off','выкл']].forEach(([v,l])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=l; const cur=kp.modules[key]||'auto'; if(cur===v) b.classList.add('on'); b.addEventListener('click',()=>{ if(v==='auto') delete kp.modules[key]; else kp.modules[key]=v; buildEditor(); render(); }); tri.appendChild(b); }); row.appendChild(tri); em.appendChild(row); };
  Object.keys(VALUE_MODULES).forEach(k=>addMod(k, VALUE_MODULES[k].name, isOn(k)?'сейчас: показан':'сейчас: скрыт'));
  Object.keys(MOUNTS).forEach(k=>addMod(k, 'Монтаж: '+k.replace('mount_',''), mountsOn().includes(k)?'сейчас: показан':'сейчас: скрыт'));

  /* фото */
  const ep=$('#edPhotos'); ep.innerHTML='';
  const ph=document.createElement('div'); ph.className='hint'; ph.textContent='Файлы кладутся рядом с HTML. При отсутствии слот показывает градиент.'; ep.appendChild(ph);
  kp.photos.forEach((p,i)=>{ const g=document.createElement('div'); g.className='grid2'; g.appendChild(inp('Файл',p[0],v=>p[0]=v)); g.appendChild(inp('Подпись',p[1],v=>p[1]=v)); ep.appendChild(g); });

  $('#edToggle').setAttribute('aria-expanded', document.body.classList.contains('ed-open')?'true':'false');
}

/* кнопки */
$('#edToggle').addEventListener('click',()=>{ document.body.classList.toggle('ed-open'); buildEditor(); });
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{ kp=clone(PRESETS[b.dataset.preset]); buildEditor(); render(); }));
$('#btnReset').addEventListener('click',()=>{ kp=clone(PRESETS.A); try{localStorage.removeItem(LS);}catch(e){} buildEditor(); render(); });
$('#btnPrint').addEventListener('click',()=>window.print());
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
$('#btnJsonDown').addEventListener('click',()=>download('kp.json', JSON.stringify(kp,null,2), 'application/json'));
$('#jsonUp').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ kp=JSON.parse(r.result); buildEditor(); render(); }catch(err){ alert('Не удалось прочитать JSON'); } }; r.readAsText(f); e.target.value=''; });
$('#btnHtml').addEventListener('click',()=>{
  const doc=document.documentElement.cloneNode(true);
  doc.querySelector('#editor').remove(); doc.querySelector('#edToggle').remove(); doc.querySelectorAll('script').forEach(s=>s.remove());
  doc.querySelector('body').classList.remove('ed-open');
  const fb=document.createElement('script'); fb.textContent="document.querySelectorAll('img').forEach(function(im){im.addEventListener('error',function(){im.style.visibility='hidden';});});"; doc.querySelector('body').appendChild(fb);
  const slug=(kp.client.name||'kp').toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'');
  download(`kp-glass-memory-${slug||'kp'}.html`, '<!DOCTYPE html>\n'+doc.outerHTML, 'text/html');
});

render();
</script>
</body>
</html>
