name: OZON snapshots (прямой, без n8n)

# Ночной пайплайн OZON БЕЗ n8n: прямые клиенты src/scripts/ozon/* + connector. ЗАМЕНЯЕТ
# update-snapshots.yml (n8n, расписание отключено). Делает всё, что делал n8n-синк: снимки
# (pnl-sku/skus/pnl/ads + ads_periods 7/30/90), дневную историю (backfill, прямой Seller),
# пересборку сайта и коммит. Креды: GitHub Secrets, либо (временно, решение владельца)
# workflow_dispatch input с маскировкой (::add-mask:: в guard-шаге). Каждый снимок проходит
# дельта-гейт перед заменой (FENIX G3): просадка ключевой метрики >40% -> снимок НЕ заменяется.

on:
  schedule:
    - cron: "0 6 * * *" # ~09:00 МСК; работает после добавления OZON_* в Secrets
  workflow_dispatch:
    inputs:
      ozon_seller_client_id:
        description: "OZON Seller Client-Id (пусто = из секрета)"
        required: false
      ozon_seller_api_key:
        description: "OZON Seller Api-Key (пусто = из секрета)"
        required: false
      ozon_perf_client_id:
        description: "OZON Performance client_id (пусто = из секрета)"
        required: false
      ozon_perf_secret:
        description: "OZON Performance secret (пусто = из секрета)"
        required: false
      finance_months:
        description: "yes = собрать ТОЛЬКО финансы по SKU за июнь/июль 2026 (для Excel), ночной пайплайн пропустить"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ozon-data # общий с update-snapshots/sync - не гонимся за один data/
  cancel-in-progress: false

env:
  OZON_SELLER_CLIENT_ID: ${{ secrets.OZON_SELLER_CLIENT_ID || github.event.inputs.ozon_seller_client_id }}
  OZON_SELLER_API_KEY: ${{ secrets.OZON_SELLER_API_KEY || github.event.inputs.ozon_seller_api_key }}
  OZON_PERF_CLIENT_ID: ${{ secrets.OZON_PERF_CLIENT_ID || github.event.inputs.ozon_perf_client_id }}
  OZON_PERF_SECRET: ${{ secrets.OZON_PERF_SECRET || github.event.inputs.ozon_perf_secret }}

jobs:
  # Разовый сбор финансов по SKU за конкретные месяцы (для Excel-выгрузки по артикулам).
  # Только при ручном запуске с finance_months=yes; ночной cron его не трогает. Пишет
  # data/pnl_sku_2026-06.json и data/pnl_sku_2026-07.json (разбивка комиссии на составляющие).
  finance-months:
    if: ${{ github.event.inputs.finance_months == 'yes' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Маскировать креды и проверить наличие
        run: |
          set -euo pipefail
          echo "::add-mask::$OZON_SELLER_API_KEY"; echo "::add-mask::$OZON_SELLER_CLIENT_ID"
          if [ -z "${OZON_SELLER_API_KEY:-}" ] || [ -z "${OZON_SELLER_CLIENT_ID:-}" ]; then
            echo "::error::OZON Seller креды не заданы (ни Secrets, ни input)."; exit 1
          fi
          echo "Seller-креды на месте."
      - name: "PROBE v4: заказы по SKU (свежее окно, CSV, CPO)"
        run: |
          set +e
          npm run ads:orders:probe || echo "::warning::probe с ошибкой"
      - name: Рекламная статистика по дням (показы/клики/корзина -> ads_daily)
        run: |
          set -euo pipefail
          # data/ads_daily.ndjson: показы(vw)/клики(cl)/корзина(ca). Разовый полный пересбор, если
          # полей ещё нет; дальше инкрементально. Идёт ПЕРЕД тяжёлыми шагами и коммитится сразу, чтобы
          # рекламная статистика попала в дашборд быстро, не дожидаясь всего бэкофилла.
          npx tsx src/scripts/ozon/ads-daily.ts || echo "::warning::реклама по дням не обновлена (OZON Performance недоступен)"
      - name: Commit рекламной статистики по дням (ранний)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/data/ads_daily.ndjson
          if git diff --staged --quiet; then echo "ads_daily без изменений"; exit 0; fi
          git commit -m "data: рекламная статистика по дням (показы/клики/корзина) $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1
      - name: Финансы по SKU за июнь и июль (с разбивкой комиссии)
        run: |
          set -euo pipefail
          npx tsx src/scripts/ozon/pnl-sku-breakdown.ts 2026-06-01 2026-06-30 data/pnl_sku_2026-06.json
          npx tsx src/scripts/ozon/pnl-sku-breakdown.ts 2026-07-01 2026-07-31 data/pnl_sku_2026-07.json
      - name: Полный бэкфилл per-SKU финансов по дням (для раздела «Аналитика по SKU»)
        run: |
          set -euo pipefail
          npm run pnl:sku:daily
      - name: Полный бэкфилл сборов уровня заказа/кабинета по дням
        run: |
          set -euo pipefail
          npm run pnl:account:daily
      - name: Полный бэкфилл месячной реализации по SKU (УПД)
        run: |
          set -euo pipefail
          npm run pnl:realization
      - name: Каталожный маппинг SKU -> артикул (offer_id)
        run: |
          set -euo pipefail
          # data/sku_offer.json: SKU -> артикул по всему каталогу (product/info/stocks, накопительно).
          # Чтобы у старых/неактивных SKU в дашборде был артикул, а не числовой ID. Без кредов - пропуск.
          npm run offer:sku || echo "::warning::маппинг артикулов не обновлён"
      - name: Бэкфилл рекламы по SKU (все кампании CPC+CPO, большой бюджет)
        env:
          ADS_SKU_BUDGET_MIN: "40"
        run: |
          set -euo pipefail
          # data/ads_sku_daily.ndjson: расход рекламы по SKU по дням из Performance API (все кампании).
          # Отчёты OZON медленные - самовосстанавливающийся ряд, недобранное догрузит ночной синк.
          npm run ads:sku:daily || echo "::warning::реклама по SKU не обновлена"
      - name: Commit финансовых JSON (если есть изменения)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/data/
          if git diff --staged --quiet; then echo "финансы без изменений"; exit 0; fi
          git commit -m "data: финансы по SKU июнь/июль 2026 (для Excel)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1

  snapshots:
    if: ${{ github.event.inputs.finance_months != 'yes' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Маскировать креды и проверить наличие
        run: |
          set -euo pipefail
          echo "::add-mask::$OZON_SELLER_API_KEY"; echo "::add-mask::$OZON_SELLER_CLIENT_ID"
          echo "::add-mask::$OZON_PERF_SECRET"; echo "::add-mask::$OZON_PERF_CLIENT_ID"
          if [ -z "${OZON_SELLER_API_KEY:-}" ] || [ -z "${OZON_SELLER_CLIENT_ID:-}" ]; then
            echo "::error::OZON Seller креды не заданы (ни Secrets, ни input)."; exit 1
          fi
          echo "Seller-креды на месте. Perf-креды: ${OZON_PERF_CLIENT_ID:+есть}${OZON_PERF_CLIENT_ID:-нет (реклама пропустится)}"

      - name: Снимки напрямую (с дельта-гейтом перед заменой)
        run: |
          set -euo pipefail
          # validate-snapshot 3-м аргументом получает прошлый снимок -> дельта-гейт (FENIX G3).
          # Пишем в data/ И fixtures/ (сборка читает то одно, то другое; точное выравнивание
          # read-путей - часть cutover, Этап 3). put = validate+разложить в оба места.
          put () { # tmp, type, name
            local tmp="$1" type="$2" name="$3"
            npx tsx src/scripts/validate-snapshot.ts "$type" "$tmp" "fixtures/$name"
            cp "$tmp" "data/$name"; cp "$tmp" "fixtures/$name"; rm -f "$tmp"
          }
          npx tsx src/scripts/ozon/pnl-sku.ts "" "" /tmp/pnlsku.json; put /tmp/pnlsku.json pnlsku pnl_sku_30d.json
          npx tsx src/scripts/ozon/skus.ts 30 /tmp/skus.json;        put /tmp/skus.json   skus   skus_live_30d.json
          # P&L канал: сырой -> snapshot-pnl пишет data/pnl_30d.json, дублируем в fixtures
          npx tsx src/scripts/ozon/pnl.ts "" "" /tmp/pnl_raw.json
          npx tsx src/scripts/snapshot-pnl.ts /tmp/pnl_raw.json
          cp data/pnl_30d.json fixtures/pnl_30d.json
          # Реклама - "мягкая": если Performance не авторизовал (401 invalid_client) или
          # OZON_PERF_* пусты - warning и продолжаем (продажи/финансы уже собраны). Под set -e
          # команда в условии if НЕ валит скрипт, поэтому битая реклама не рушит весь синк.
          if [ -n "${OZON_PERF_CLIENT_ID:-}" ] && npx tsx src/scripts/ozon/ads.ts 30 /tmp/ads.json; then
            put /tmp/ads.json ads ads_30d.json
            # Реклама по периодам 7/30/90 - период-точность снимка без живого запроса.
            # Заменяем только при валидном p30 (есть id), иначе прошлый файл не трогаем.
            AP=/tmp/ads_periods.json; echo '{}' > "$AP"
            for d in 7 30 90; do
              t=$(mktemp); prev=$(mktemp)
              # Прошлый p$d как база дельта-гейта (FENIX G4): просадка spend >40% -> снимок не берём.
              node -e "try{const a=require('./data/ads_periods.json');const p=a['p$d'];if(p)require('fs').writeFileSync('$prev',JSON.stringify(p));}catch(e){}"
              [ -s "$prev" ] || prev=""
              if ! npx tsx src/scripts/ozon/ads.ts "$d" "$t"; then
                echo "::warning::ads_periods p$d: OZON не отдал снимок (прошлый p$d не трогаем)"
              elif ! npx tsx src/scripts/validate-snapshot.ts ads "$t" $prev; then
                echo "::warning::ads_periods p$d: дельта-гейт отсёк просадку >40% или снимок невалиден (прошлый p$d сохранён)"
              else
                node -e "const fs=require('fs');const o=JSON.parse(fs.readFileSync('$AP'));o['p$d']=JSON.parse(fs.readFileSync('$t'));fs.writeFileSync('$AP',JSON.stringify(o));"
              fi
            done
            if node -e "const a=require('$AP');process.exit((a.p30&&((a.p30.top_spend||[])[0]||{}).id!==undefined)?0:1)"; then
              cp "$AP" data/ads_periods.json; cp "$AP" fixtures/ads_periods.json; echo "ads_periods обновлён"
            else echo "::warning::ads_periods не обновлён (нет id в p30)"; fi
          else
            echo "::warning::реклама пропущена: OZON Performance не авторизовал (401 invalid_client) или OZON_PERF_* пусты - проверь секреты OZON_PERF_CLIENT_ID/OZON_PERF_SECRET. Продажи и финансы собраны."
          fi

      - name: Дневная история (прямой Seller, догрузка недостающих дней)
        run: |
          set -euo pipefail
          # backfill сам тянет от последнего дня истории до вчера (самовосстановление после простоя).
          npm run backfill

      - name: Канальный дневной ряд воронки/тоталов (прямой OZON, без n8n)
        run: |
          set -euo pipefail
          # daily_totals.ndjson напрямую из OZON (dimension=day). Раньше писал n8n (удалён),
          # из-за чего воронка/тоталы замораживались. Догрузка от последнего дня до вчера.
          npm run totals:daily || echo "::warning::daily-totals не собрался (OZON Seller недоступен)"

      - name: Per-SKU показы/воронка по дням (прямой OZON, без n8n)
        run: |
          set -euo pipefail
          # sku_views.ndjson напрямую из OZON (dimension=sku). Раньше писал n8n (удалён),
          # из-за чего «Воронка по категориям» замораживалась. Догрузка от последнего дня до вчера.
          npm run views:daily || echo "::warning::sku-views не собрался (OZON Seller недоступен)"

      - name: per-SKU attribution по дням (основная/объединённая, любой период)
        run: |
          set -euo pipefail
          # Дневной ряд per-SKU атрибуции (groupBy=DATE) -> data/ads_attr_daily.ndjson:
          # продажи в продвижении основной карточки + модели ПО ДНЯМ. Дашборд агрегирует
          # любой выбранный период точно. Догрузка от последнего дня (самовосстановление).
          # Async-отчёты генерятся минутами -> шаг небыстрый; мягкий (не валит синк).
          # OZON: максимум 1 активный запрос отчёта -> строго последовательно (внутри скрипта).
          npx tsx src/scripts/ozon/ad-attribution-daily.ts || echo "::warning::attribution по дням не собрался (OZON Performance недоступен)"
          # Снимок ads_reports.json (RCACHE) остаётся запасным источником из прошлых прогонов;
          # ночью не пересобираем (двухфазный запрос упирался бы в лимит 1 активного отчёта).

      - name: Реклама по дням (для произвольного периода)
        run: |
          set -euo pipefail
          # dailyStats по дням -> догрузка в data/ads_daily.ndjson (от последнего дня до вчера).
          # Без PERF-кредов сам пропускается; не валит синк.
          npx tsx src/scripts/ozon/ads-daily.ts || echo "::warning::реклама по дням не обновлена (OZON Performance недоступен)"

      - name: Финансы по дням (для произвольного периода)
        run: |
          set -euo pipefail
          # Транзакции по дням -> data/pnl_daily.ndjson (весь ряд от 01.02 до вчера; финоперации
          # до-постируются задним числом, поэтому перезапись). Без Seller-кредов синк уже упал выше.
          npx tsx src/scripts/ozon/pnl-daily.ts || echo "::warning::финансы по дням не обновлены"

      - name: Per-SKU финансы по дням (раздел «Аналитика по SKU», перетяжка хвоста)
        run: |
          set -euo pipefail
          # data/pnl_sku_daily.ndjson: финансы по SKU по дням с разбивкой сборов. Перетягивает
          # последние 45 дней (доначисления задним числом), старые дни оставляет. Первый прогон -
          # полный бэкфилл от 01.02. Без Seller-кредов синк уже упал выше.
          npm run pnl:sku:daily || echo "::warning::per-SKU финансы по дням не обновлены"

      - name: Сборы уровня заказа/кабинета по дням (перетяжка хвоста)
        run: |
          set -euo pipefail
          # data/pnl_account_daily.ndjson: реклама/штрафы/realFBS/подписки/доставка от покупателя
          # по дням (операции не с одним SKU). Перетягивает хвост 45 дней. Без Seller-кредов пропуск.
          npm run pnl:account:daily || echo "::warning::сборы уровня заказа не обновлены"

      - name: Месячная реализация по SKU (перетяжка последних месяцев, УПД)
        run: |
          set -euo pipefail
          # data/realization_monthly.ndjson: реализовано/возвращено по SKU за месяц (основа УПД).
          # Перетягивает текущий + предыдущий месяц (доначисления/поздние возвраты). Без кредов - пропуск.
          npm run pnl:realization || echo "::warning::месячная реализация не обновлена"

      - name: "Каталожный маппинг SKU -> артикул (offer_id)"
        run: |
          set -euo pipefail
          # data/sku_offer.json: SKU -> артикул по каталогу (product/info/stocks), НАКОПИТЕЛЬНО.
          # Раз увиденный артикул не теряем. Чтобы старые SKU в дашборде были с артикулом. Без кредов - пропуск.
          npm run offer:sku || echo "::warning::маппинг артикулов не обновлён"

      - name: "Реклама по SKU (накопление, добираем несобранные кампании)"
        env:
          ADS_SKU_BUDGET_MIN: "12"
        run: |
          set -euo pipefail
          # data/ads_sku_daily.ndjson: расход рекламы по SKU (CPC+CPO), НАКОПИТЕЛЬНО. Каждую ночь
          # добираем несобранные кампании (отчёты OZON медленные ~2 мин/кампания), уже собранные не
          # теряются. Бюджет ~12 мин (~5 кампаний/ночь). Без Perf-кредов - пропуск.
          npm run ads:sku:daily || echo "::warning::реклама по SKU не обновлена"

      - name: Пересборка сайта из свежих снимков
        run: |
          set -euo pipefail
          npm run join:cogs
          npm run build:site
          npm run katya # иначе katya-*.html отстают от свежих данных в коммите

      - name: Commit (если есть изменения)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Стейджим весь analytics-mvp: снимки (data/+fixtures/), история, пересобранный сайт.
          git add -A analytics-mvp
          if git diff --staged --quiet; then echo "снимки без изменений"; exit 0; fi
          git commit -m "data: прямые снимки OZON (без n8n) $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1
