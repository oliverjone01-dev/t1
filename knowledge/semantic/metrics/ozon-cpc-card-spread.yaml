# OZON: реклама за клик по атрибуции OZON (свой товар / соседи по объединённой карточке). Заменяет ozon-cpc-card-spread v1.
id: ozon-cpc-card-spread
title: "Реклама за клик, разнесённая по атрибуции OZON на рекламируемый товар и соседей по объединённой карточке"
version: 2.1
status: draft   # v2.1 на подпись Ивану (ФЕНИКС 01.10 return, G1/G2/G7); формула и разнесение денег те же, что в v2
owner: "Иван Раюшкин"
approved_at: "2026-10-01"   # v2: Иван 01.10 «1 отменённый 2 да 3 да»; v2.1 - ждёт подписи
decision: "Какие товары реально продаёт реклама за клик: сам рекламируемый или соседи по карточке; прибыль заказа с честной рекламой."
good_direction: "не применимо (итог расхода не меняется)"
entity: "заказ (posting) в периоде"
key: [order]
type: derived
formula_text: >
  1) Пара = рекламируемый товар x кампания x месяц. Расход пары по дням - data/ads_sku_daily.ndjson (sp), как на «Деньгах».
  2) Доли пары за месяц из атрибуции OZON (data/ads_attr_daily.ndjson): свои штуки (sold) и штуки соседей (soldM) по дням.
  3) Какой сосед: для дня с soldM ищем заказы товаров той же объединённой карточки (data/card_groups.json) в тот же день,
     у которых штуки = soldM и сумма = omM (допуск 1%). Проверка на отчётах кабинета март-июль (лист Union): 21 совпадение из 22.
  4) Расход пары делится по штукам (решение 1 шт): своя доля - на заказы рекламируемого товара за период по штукам (как на «Деньгах»),
     доля каждого найденного соседа - прямо на найденный заказ.
  5) Остаётся на рекламируемом товаре (решение 2): расход пары без продаж; доля соседа, которого не нашли; пары без атрибуции в API.
     Рекламируемый товар без заказов в периоде - строка «Общие расходы», как на «Деньгах».
  6) Доли месяца применяются к дневному расходу, поэтому фильтр периодов работает как на «Деньгах». «Деньги» не меняются (решение 3).
code_module: "analytics-mvp/src/scripts/build-katya.ts - новая страница; блок «Аналитика по заказам» на «Деньгах» побайтно тот же (инвариант сборки)"
filters:
  include_statuses: [delivered, delivering, awaiting_deliver, client_arbitration]
  exclude: ["в веса «своей» доли отменённые не входят; найденный сосед-заказ, который потом отменён, получает свою долю на строку отменённого заказа (Иван 01.10, п.1)"]
cancellations_returns:
  mode: "net по отменам (решение 2 да от 01.10)"
  return_date_basis: order_date
date_field: "расход - дата клика; доли - месяц атрибуции; сосед - дата заказа = дата атрибуции"
mode: period
timezone: Europe/Moscow
interval: "[с, по] - фильтр периодов как на «Деньгах»"
partial_period: mark
additive_over_time: true
empty_value: "нет атрибуции = расход на рекламируемом товаре с пометкой, не 0"
source:
  endpoint: "OZON Performance: statistics/daily/json по SKU (ads_sku_daily), attribution-отчёт по кампании (ads_attr_daily: sold, om, soldM, omM); orders_daily; card_groups"
  limits: "attribution-отчёт отдаёт соседей только итогом (проба 01.10, кампания 40047060, без разбивки по соседу); сборщик берёт не все кампании и не все дни: покрытие по парам август 80%, сентябрь 94%; покрытие ПО ДНЯМ (CPC в днях со строкой атрибуции) август 46,4%, сентябрь 86,8% - на странице показывается за период"
  coverage_display: "плашка #cpc-note: покрытие по дням в %, «без продаж» разделено на «без продаж в дни с атрибуцией» и «дни без атрибуции в нашем сборе», доля соседей в днях без атрибуции помечена оценкой; разнесение денег не меняется (решение 2)"
reconciliation:
  against_family: "documents (выгрузка кабинета с листом Union)"
  document: "отчёты продвижения март-июль 2026, присланы 01.10 (в репо не кладём, решение 5)"
  tolerance: "сосед: совпадение SKU; доли: штуки"
golden_rows:
