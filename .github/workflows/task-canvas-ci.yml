name: Task canvas checks
on:
  pull_request:
    paths: ['task-canvas/**', '.github/workflows/task-canvas-ci.yml']
  push:
    paths: ['task-canvas/**', '.github/workflows/task-canvas-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: task-canvas/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build:background && git diff --exit-code -- background/dist
      - run: npm run build:telegram && git diff --exit-code -- telegram/dist
      - run: npm run build:weekly && git diff --exit-code -- weekly/dist
      - run: npm run build && git diff --exit-code -- public/board-ui.mjs public/board-ui.css public/vendor/fractional-indexing.mjs
      - run: for file in public/*.mjs; do node --check "$file" || exit; done; npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-task-canvas --config firebase.json "npm run test:team"
