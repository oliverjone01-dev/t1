name: "Контур: съём позиций и пересборка дашборда"

# Фиксирует дневную точку по позициям и видимости в ИИ. У сводки домена в keys.so
# нет ретроспективы по топ-50 и ответам ИИ, поэтому пропущенная точка не
# восстанавливается задним числом никогда.
#
# Это урезанная версия: только запись точки в kontur-dashboard/data/history.
# Её вынесли в main отдельно от дашборда (PR #358), потому что задание по
# расписанию запускается только из ветки по умолчанию, и пока бот жил в ветке
# дашборда, он не запускался ни разу. Полная версия (пересборка данных и
# страницы, сторож, тесты) придёт вместе с дашбордом и заменит этот файл.
#
# Данные берутся из выгрузок, которые кладёт harvest.yml (ежедневно, 03:00 МСК).
# Секретов воркфлоу не использует, в сеть не ходит.

on:
  schedule:
    - cron: "0 6 * * 1-5"      # будни, 09:00 МСК, после ночного сбора
  workflow_dispatch:
    inputs:
      seed:
        description: "1 = разово добрать историю из keysso.json"
        default: "0"

permissions:
  contents: write

concurrency:
  group: kontur-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Записать точку в дневной ряд
        working-directory: kontur-dashboard
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.seed }}" = "1" ]; then
            python3 tools/snapshot.py --seed
          fi
          python3 tools/snapshot.py
          python3 tools/snapshot.py --check

      # pull --rebase перед push: пока шёл съём, в main мог прийти коммит сборщика.
      - name: Закоммитить точку съёма
        run: |
          set -euo pipefail
          git config user.name  "kontur-bot"
          git config user.email "kontur-bot@users.noreply.github.com"
          git add kontur-dashboard/data/history
          if git diff --cached --quiet; then
            echo "новой точки нет"
          else
            git commit -m "kontur: точка съёма $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
