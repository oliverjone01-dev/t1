<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<title>GEN-GROUP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23060807'/%3E%3Cpath d='M4 18V6l8 8 8-8v12' fill='none' stroke='%23c7ff39' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B0906; --bg2:#100D09; --card:#181410; --card2:#1F1A14;
  --txt:#F6F3EE; --mut:#B5AC9E; --dim:#8A8074; --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18); --amb:#E9A23B; --ink:#150F04;
  --bad:#E8735A; --ok:#7BC48C;
  --gate-glow:rgba(233,162,59,.10); --gate-mark:#E9A23B;
  --band-h:34px;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --le-accent:#E9A23B; --le-accent-ink:#150F04; --le-safe-top:112px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:52px;z-index:99;background:var(--amb);color:var(--ink);
  padding:10px 16px;border-radius:999px;font-weight:700}

/* Полоса адресата. Её высота и отступ шапки завязаны на одну переменную:
   на узком экране текст переносится на две строки, и раньше шапка садилась
   поверх него, съедая нижнюю строку. */
#band{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--bad);color:#fff;
  font:800 12px/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  padding:9px 16px;text-align:center;min-height:var(--band-h);
  display:flex;align-items:center;justify-content:center}
@media(max-width:560px){
  :root{--band-h:56px}
  #band{font-size:11px;letter-spacing:.08em;padding:7px 12px}
}
#hd{position:fixed;top:var(--band-h);left:0;right:0;z-index:40;background:rgba(11,9,6,.9);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:1120px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:16px}
.lg{font-weight:800;font-size:14.5px;letter-spacing:.02em}
.lg .amp{color:var(--amb)}
.nav{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.nav a{color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;
  padding:8px 12px;border-radius:999px;border:1px solid transparent}
.nav a:hover{color:var(--txt);border-color:var(--line2)}
/* На узком экране навигация не прячется, а листается вбок: без неё длинный
   разбор проходится только скроллом. */
@media(max-width:820px){
  .hd{flex-wrap:wrap;padding:9px 14px;gap:8px}
  .nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:12.5px;border-color:var(--line)}
}

.s{padding:132px 20px 72px;border-bottom:1px solid var(--line)}
.s:first-of-type{padding-top:150px}
@media(max-width:820px){.s{padding-top:168px}.s:first-of-type{padding-top:182px}}
@media(max-width:560px){.s{padding-top:196px}.s:first-of-type{padding-top:210px}}
.w{max-width:1120px;margin:0 auto;width:100%}
.tag{font:700 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--amb);margin:0 0 18px}
.tag i{color:var(--dim);font-style:normal}
h1{font-size:clamp(1.9rem,5vw,3.3rem);line-height:1.06;letter-spacing:-.025em;margin:0 0 20px;font-weight:800}
h2{font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 18px;font-weight:800}
h3{font-size:1.1rem;line-height:1.25;margin:0 0 9px;font-weight:700}
.lead{font-size:clamp(1.02rem,1.7vw,1.2rem);line-height:1.55;color:var(--mut);max-width:70ch;margin:0 0 22px}
.lead b{color:var(--txt);font-weight:700}
p{margin:0 0 13px}
.mut{color:var(--mut)}

.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card.amb{border-color:rgba(233,162,59,.4);background:linear-gradient(160deg,rgba(233,162,59,.09),rgba(233,162,59,.02))}
.card.bad{border-color:rgba(232,115,90,.42)}
.card .n{font:700 11.5px/1 var(--mono);color:var(--amb);letter-spacing:.1em;margin-bottom:11px;display:block}
.card.bad .n{color:var(--bad)}

table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:15px}
th,td{border:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:top}
th{background:var(--card2);font-weight:700;font-size:13.5px;color:var(--txt)}
td{color:var(--mut)}
td b{color:var(--txt)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tw table{min-width:520px}
@media(max-width:620px){.tw::after{content:"таблица прокручивается вбок";display:block;
  font-size:11.5px;color:var(--dim);margin-top:6px}}

.big{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin:0 0 6px}
.big.amb{color:var(--amb)}.big.bad{color:var(--bad)}.big.ok{color:var(--ok)}
.big-l{font-size:13.5px;color:var(--mut);line-height:1.4}

.ul{list-style:none;margin:0;padding:0}
.ul li{position:relative;padding-left:24px;margin-bottom:11px;color:var(--mut)}
.ul li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:2px;background:var(--amb)}
.ul li b{color:var(--txt)}
.ul.no li::before{background:var(--bad)}
.ul.yes li::before{background:var(--ok)}

.note{border-left:3px solid var(--amb);padding:2px 0 2px 16px;color:var(--mut);
  font-size:14.5px;line-height:1.55;margin:20px 0 0;max-width:74ch}
.note.bad{border-color:var(--bad)}
.mk{display:inline-block;font:700 11.5px/1.35 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
/* Длинная метка на узком экране раздвигала документ вбок: nowrap держится
   только там, где он помещается. */
@media(max-width:700px){.mk{white-space:normal;overflow-wrap:anywhere}}
.mk.d{color:var(--ok);border-color:rgba(123,196,140,.4)}
.mk.h{color:var(--mut);border-style:dashed}
.foot{padding:48px 20px 64px;color:var(--dim);font-size:15px;line-height:1.7}
/* На телевизоре текст не масштабировался вместе с панелью. */
@media(min-width:1700px){
  body{font-size:19px}
  .w{max-width:1380px}
  .mk{font-size:13px}
  .foot{font-size:16px}
}
.foot a{color:var(--mut);line-height:2.1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{#band{position:static}#hd{display:none}.s{padding:20px 0;page-break-inside:avoid}}
</style>
<style>
/* ---------- парольный вход ---------- */
/* Свечение берётся из палитры документа. Два документа лежат на одном домене,
   и до ввода пароля их надо различать глазом, а не по памяти. */
#gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 50% 0%,var(--gate-glow,rgba(199,255,57,.07)),transparent 55%),var(--bg)}
#gate .lg svg{color:var(--gate-mark,var(--lime))}
#gate.done{display:none}
.gbox{width:100%;max-width:430px}
.gbox .lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.03em;margin-bottom:30px}
.gbox .lg svg{width:24px;height:24px}
.gbox h1{font-size:clamp(1.5rem,4.4vw,2rem);line-height:1.15;margin-bottom:10px;letter-spacing:-.02em}
.gbox .hint{color:var(--mut);font-size:14.5px;line-height:1.6;margin-bottom:26px}
.gf{display:flex;gap:10px;flex-wrap:wrap}
#gpass{flex:1 1 190px;min-height:48px;padding:12px 16px;border-radius:12px;border:1px solid var(--bd2);
  background:var(--bg2);color:var(--txt);font-family:inherit;font-size:15px;letter-spacing:.08em}
#gpass::placeholder{color:var(--dim);letter-spacing:0}
#gpass:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#gerr{margin-top:14px;font-size:13.5px;color:#ff8f6b;min-height:1.3em}
#gerr.ok{color:var(--mut)}
.gnote{margin-top:34px;padding-top:18px;border-top:1px solid var(--bd);font-size:12px;color:var(--dim);line-height:1.6}
@media print{#gate{display:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs></svg>

<div id="gate">
  <div class="gbox">
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 18V6l8 8 8-8v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/></svg>GEN-GROUP</div>
    <h1>Внутренний документ</h1>
    <p class="hint">Только Богдану и Роману. Не открывать при АВЮ. Введите пароль.</p>
    <form class="gf" id="gform" autocomplete="off">
      <input id="gpass" type="password" placeholder="Пароль" aria-label="Пароль" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button type="submit" class="btn btn-lime" id="gbtn">Открыть</button>
    </form>
    <p id="gerr" role="status" aria-live="polite"></p>
    <p class="gnote">Текст документа хранится на этой странице только в зашифрованном виде и без пароля не читается. Пароль никуда не передаётся: ключ выводится и проверяется в вашем браузере.</p>
  </div>
</div>

<script>
(function(){
  'use strict';
  var ITER = 250000;
  var TITLES = {"own":"Внутренний разбор"};          // ключ документа -> заголовок вкладки браузера
  var gate = document.getElementById('gate');
  var form = document.getElementById('gform');
  var pass = document.getElementById('gpass');
  var btn  = document.getElementById('gbtn');
  var err  = document.getElementById('gerr');
  var key = null;                   // ключ выводим один раз, дальше переключение мгновенное

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

  if (!(window.crypto && window.crypto.subtle)) {
    err.textContent = 'Браузер не поддерживает расшифровку. Откройте в Chrome, Safari или Firefox.';
    pass.disabled = btn.disabled = true;
    return;
  }

  // Один документ в DOM за раз: у разных документов совпадают id разделов,
  // и initDoc начал бы цеплять чужие узлы.
  function open(name, focusTop){
    var el = document.getElementById('payload-' + name);
    if (!el) return Promise.reject(new Error('нет документа ' + name));
    var raw  = b64(el.textContent.trim());
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    return crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, data)
      .then(function(buf){
        var doc = document.getElementById('doc');
        doc.innerHTML = new TextDecoder().decode(buf);
        doc.setAttribute('data-doc', name);
        document.title = TITLES[name] || document.title;
        try { history.replaceState(null, '', '#' + name); } catch(e) {}
        window.scrollTo(0, 0);
        try { initDoc(); } catch(e) { console.error(e); }
        // вкладка перерисовала #doc целиком, патчи надо наложить заново
        if (window.BLOCKEDIT_REFRESH) { try { window.BLOCKEDIT_REFRESH(); } catch(e) { console.error(e); } }
        if (focusTop) {
          var h = document.getElementById('h-top');
          if (h) { h.setAttribute('tabindex','-1'); h.focus(); }
        }
      });
  }
  window.openDoc = open;

  // Переключатель вкладок появляется только после расшифровки, поэтому
  // слушаем делегированно от документа.
  document.addEventListener('click', function(ev){
    var t = ev.target.closest && ev.target.closest('[data-go]');
    if (!t || !key) return;
    ev.preventDefault();
    var name = t.getAttribute('data-go');
    if (document.getElementById('doc').getAttribute('data-doc') === name) return;
    open(name, true).catch(function(e){ console.error(e); });
  });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var p = pass.value;
    if (!p) return;
    btn.disabled = true;
    err.className = 'ok';
    err.textContent = 'Расшифровка...';

    // Соль и вектор берём из первого документа, ключ общий для всех
    var raw = b64(document.getElementById('payload-own').textContent.trim());
    var salt = raw.slice(0, 16);

    crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt: salt, iterations: ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
      })
      .then(function(k){
        key = k;
        var patches = Promise.resolve();
        if (window.LIVEEDIT_KEY) {
          try { patches = window.LIVEEDIT_KEY(k) || Promise.resolve(); } catch(e) { console.error(e); }
        }
        var alts = window.LIVEEDIT_ALT_SALTS || [];
        if (alts.length && window.LIVEEDIT_ALTKEYS) {
          Promise.all(alts.map(function(sb){
            var raw = b64(sb);
            return crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
              .then(function(km){
                return crypto.subtle.deriveKey(
                  { name:'PBKDF2', salt: raw, iterations: ITER, hash:'SHA-256' },
                  km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
              });
          })).then(function(keys){ window.LIVEEDIT_ALTKEYS(keys); }, function(){});
        }
        var want = (location.hash || '').replace('#','');
        if (!document.getElementById('payload-' + want)) want = 'own';
        err.textContent = 'Открываю...';
        return Promise.all([open(want, true), patches]);
      })
      .then(function(){
        gate.classList.add('done');
        gate.remove();            // иначе на странице остаётся второй h1
      })
      .catch(function(){
        key = null;
        err.className = '';
        err.textContent = 'Пароль не подошёл.';
        btn.disabled = false;
        pass.select();
      });
  });

  pass.focus();
})();
</script>
<script>
function initDoc(){

  // Документ читают двое и с телефона тоже. Единственная логика здесь это
  // подсветка текущего раздела: считать тут нечего, все числа статичные.
  var links = [].slice.call(document.querySelectorAll('.nav a'));
  if (!links.length || !window.IntersectionObserver) return;
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) {
        var on = a.getAttribute('href') === '#' + e.target.id;
        a.style.color = on ? 'var(--txt)' : '';
        a.style.borderColor = on ? 'var(--amb)' : '';
        if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
      });
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.s').forEach(function (s) { io.observe(s); });
}
</script>
