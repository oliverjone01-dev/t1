<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>GEN-GROUP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23060807'/%3E%3Cpath d='M4 18V6l8 8 8-8v12' fill='none' stroke='%23c7ff39' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ===== Northline system v3 · автономная сборка, внешних запросов нет ===== */
:root{
  --bg:#060807;--bg2:#0a0d0b;--bg3:#0c120d;--txt:#f2f4ef;--mut:#a1a1aa;--dim:#8a8a93;
  --lime:#c7ff39;--ink:#071008;--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.15);
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
  font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
::selection{background:var(--lime);color:var(--ink)}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:3px}
.noise{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:44px 44px}
.wrap{max-width:1152px;margin:0 auto;padding-left:20px;padding-right:20px}
@media(min-width:768px){.wrap{padding-left:32px;padding-right:32px}}
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--lime);color:var(--ink);padding:12px 20px;font-weight:700;border-radius:0 0 10px 0}
.skip:focus{left:0}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(1.5rem);transition:opacity 700ms var(--ease),transform 700ms var(--ease)}
.reveal.is-visible{opacity:1;transform:translateY(0)}
.stg>*{transition-delay:calc(var(--i,0) * 70ms)}

/* ---------- icons ---------- */
.ic{width:1.05em;height:1.05em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- слот под съёмку ----------
   Фото кладётся поверх схематичного чертежа. Пока файла нет, onerror гасит img
   и остаётся чертёж: страница выглядит законченной на любой стадии готовности. */
.shot{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--bd);background:
  linear-gradient(150deg,rgba(199,255,57,.05),transparent 46%),
  linear-gradient(320deg,rgba(82,188,76,.05),transparent 46%),#070a08}
.shot:has(figcaption)::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,transparent 62%,rgba(6,8,7,.72));opacity:0;transition:opacity .4s}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;
  opacity:0;pointer-events:none;filter:saturate(.96) brightness(1.1) contrast(1.02);
  transition:opacity .6s var(--ease),transform .7s var(--ease)}
.shot.has img{opacity:1}
.shot.has:has(figcaption)::after{opacity:1}
.shot .fb{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.shot .fb svg{width:64%;max-width:220px;height:auto;overflow:visible}
figcaption{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:8px 12px;font-size:11px;color:var(--mut);
  background:linear-gradient(180deg,transparent,rgba(6,8,7,.82) 42%);text-align:right;letter-spacing:.01em}
.r32{aspect-ratio:3/2}
.r169{aspect-ratio:16/9}
a:hover>.shot img,.ccard:hover .shot img{transform:scale(1.035)}

/* ---------- header + progress ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(8,10,9,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-color:var(--bd)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime);transform:scaleX(0);transform-origin:0 50%;opacity:0;transition:opacity .3s}
header.scrolled .prog{opacity:1}
@supports (animation-timeline:scroll()){
  @media(prefers-reduced-motion:no-preference){
    .prog{animation:progGrow linear both;animation-timeline:scroll(root block)}
    @keyframes progGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.03em;font-size:17px;flex:none}
.logo svg{width:24px;height:24px;color:var(--lime)}
.logo .dot{color:var(--lime)}
.logo .v{margin-left:6px;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.2em}
.nav-d{display:none;align-items:center;gap:20px;font-size:13.5px;color:var(--mut);white-space:nowrap}
.nav-d a{transition:color .25s;position:relative;padding-bottom:2px}
.nav-d a:hover{color:#fff}
.nav-d a[aria-current="true"]{color:var(--txt)}
.nav-d a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;white-space:nowrap;
  font-weight:700;min-height:48px;padding:12px 24px;font-size:15px;cursor:pointer;font-family:inherit;
  transition:filter .25s,border-color .25s,color .25s,transform .12s var(--ease)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-lime{background:var(--lime);color:var(--ink);border:1px solid var(--lime)}
.btn-lime:hover{filter:brightness(1.1)}
.btn-ghost{border:1px solid var(--bd2);color:var(--txt);background:none}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn-hd{display:none;min-height:42px;padding:9px 16px;font-size:13.5px}
.mbtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--bd2);border-radius:10px;background:none;color:var(--txt);cursor:pointer}
@media(min-width:1040px){.nav-d{display:flex}.btn-hd{display:inline-flex}.mbtn{display:none}}

/* mobile menu */
#mmenu{position:fixed;inset:0;z-index:60;background:rgba(6,8,7,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;opacity:0;transition:opacity .26s var(--ease),display .26s allow-discrete}
#mmenu.open{display:block;opacity:1}
@starting-style{#mmenu.open{opacity:0}}
.mm-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.mm-nav{display:flex;flex-direction:column;gap:2px;padding:18px 20px}
.mm-nav a{font-size:20px;font-weight:700;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.mm-nav a.lime{color:var(--lime)}
body.lock{overflow:hidden}

/* ---------- spine rail ---------- */
.spine{display:none}
@media(min-width:1300px){
  .spine{display:block;position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40}
  .spine ol{list-style:none;display:flex;flex-direction:column}
  .spine a{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 0;color:var(--dim);font-size:12px;transition:color .25s}
  .spine .lbl{opacity:0;transform:translateX(6px);transition:opacity .25s var(--ease),transform .25s var(--ease);white-space:nowrap}
  .spine .pip{width:13px;height:1px;background:currentColor;opacity:.42;flex:none;transition:width .25s var(--ease),opacity .25s}
  .spine a:hover{color:var(--txt)}
  .spine a:hover .pip{opacity:1;width:20px}
  .spine a:hover .lbl,.spine:hover .lbl{opacity:1;transform:none}
  .spine a[aria-current="true"]{color:var(--lime)}
  .spine a[aria-current="true"] .pip{width:30px;opacity:1}
  .spine a[aria-current="true"] .lbl{opacity:1;transform:none}
}

/* ---------- type ---------- */
.tag{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.tag.lm{color:var(--lime);font-weight:700}
h1{font-size:clamp(1.85rem,4.5vw,2.95rem);font-weight:800;line-height:1.1;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:clamp(1.7rem,5.2vw,2.85rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;max-width:19ch}
.white{color:var(--txt);font-weight:600}
section{padding:76px 0;border-top:1px solid var(--bd);position:relative}
@media(min-width:768px){section{padding:104px 0}}
.lead-after{margin-top:34px;font-size:clamp(1rem,2.6vw,1.1rem);color:var(--mut);line-height:1.7;max-width:46em}
.sub{margin-top:16px;color:var(--mut);line-height:1.7;max-width:46em;font-size:clamp(.98rem,2.4vw,1.08rem)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:120px 0 76px;border-top:none}
@media(min-width:768px){.hero{padding:132px 0 88px}}
.hero-media{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-media img{position:absolute;right:0;top:0;width:72%;height:100%;object-fit:cover;object-position:60% 45%;
  opacity:0;transition:opacity 1.2s var(--ease);filter:saturate(.75) contrast(1.03)}
.hero-media.has img{opacity:.5}
.hero-media::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,var(--bg) 30%,rgba(6,8,7,.72) 58%,rgba(6,8,7,.5)),
             linear-gradient(180deg,var(--bg),transparent 22%,transparent 62%,var(--bg))}
.hero-glow{pointer-events:none;position:absolute;left:50%;top:0;z-index:1;transform:translateX(-32%);height:36rem;width:60rem;border-radius:50%;
  background:radial-gradient(ellipse at 68% 17%,rgba(199,255,57,.14),transparent 60%)}
@supports (animation-timeline:scroll()){
  @media(prefers-reduced-motion:no-preference){
    .hero-glow{animation:glowDrift linear both;animation-timeline:scroll(root block);animation-range:0 70vh}
    @keyframes glowDrift{to{transform:translateX(-32%) translateY(-14%);opacity:.35}}
  }
}
.hero-grid{position:relative;z-index:2;display:grid;gap:44px;align-items:center}
@media(min-width:1024px){.hero-grid{grid-template-columns:1.18fr .82fr;gap:48px}}
.hero p.lead{font-size:clamp(1rem,2.6vw,1.14rem);color:var(--mut);line-height:1.65;max-width:34em;margin:24px 0 32px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}

/* hero TOC card */
.toc{position:relative;border-radius:18px;border:1px solid var(--bd);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  background:linear-gradient(165deg,rgba(199,255,57,.07),transparent 42%),
  linear-gradient(20deg,rgba(82,188,76,.08),transparent 46%),rgba(10,13,11,.88);padding:24px 22px 22px}
.toc .cap{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:16px}
.toc ol{list-style:none;display:flex;flex-direction:column;gap:2px}
.toc li a{display:flex;align-items:baseline;gap:12px;padding:11px 12px;border-radius:11px;font-size:14px;line-height:1.45;
  border:1px solid transparent;transition:border-color .25s,background .25s,transform .25s var(--ease)}
.toc li a:hover{border-color:rgba(199,255,57,.36);background:rgba(6,8,7,.55);transform:translateX(3px)}
.toc li a b{color:var(--lime);font-family:var(--mono);font-size:12.5px;flex:none;width:1.4em}
.toc .foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.toc .foot .big{color:var(--lime);font-size:19px;font-weight:800}
.toc .foot span:last-child{font-size:11.5px;color:var(--mut);text-align:right;max-width:20ch}

/* ---------- stats ---------- */
.stats{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stats-g{display:grid;gap:0;padding-top:0;padding-bottom:0}
@media(min-width:700px){.stats-g{grid-template-columns:repeat(3,1fr)}}
.stat{padding:30px 0;border-bottom:1px solid var(--bd)}
@media(min-width:700px){.stat{padding:36px 28px 36px 0;border-bottom:none;border-right:1px solid var(--bd)}
  .stat:not(:first-child){padding-left:28px}
  .stat:last-child{border-right:none;padding-right:0}}
.stat:last-child{border-bottom:none}
.stat b{display:block;font-size:clamp(2rem,5vw,2.5rem);font-weight:700;color:var(--lime);letter-spacing:-.03em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat p{margin-top:8px;font-size:13.5px;color:var(--mut);line-height:1.55;max-width:30ch}

/* ---------- benefits: три человека ---------- */
.people{display:grid;gap:18px;margin-top:38px}
@media(min-width:900px){.people{grid-template-columns:repeat(3,1fr)}}
.pcard{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:15px;transition:border-color .3s,transform .3s var(--ease)}
.pcard:hover{border-color:var(--bd2);transform:translateY(-2px)}
.pcard.hl{border-color:rgba(199,255,57,.4);background:var(--bg3)}
.pwho{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.pava{width:44px;height:44px;border-radius:50%;border:1px solid rgba(199,255,57,.5);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;letter-spacing:.02em}
.pwho b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.pwho span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.qa .q{color:var(--dim);font-weight:600;font-size:13.5px;line-height:1.45}
.qa .a{margin-top:5px;font-size:14px;color:var(--mut);line-height:1.6}
.qa .a b{color:var(--txt);font-weight:600}
.pfin{margin-top:auto;padding-top:13px;border-top:1px solid var(--bd);font-size:13px;color:var(--txt);font-weight:600;line-height:1.55}
.pfin em{font-style:normal;color:var(--lime)}

/* ---------- cards ---------- */
.grid{display:grid;gap:18px;margin-top:38px}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:26px;transition:border-color .3s,transform .3s var(--ease)}
.card:hover{border-color:rgba(199,255,57,.5);transform:translateY(-2px)}
.card.hl{border-color:rgba(199,255,57,.4);background:var(--bg3)}
.card .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.card h3{font-size:19px;font-weight:700;margin-bottom:10px;line-height:1.3}
.card p{font-size:14.5px;color:var(--mut);line-height:1.62}
.card .ft{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);line-height:1.55}

/* featured part 1 */
.feat{border:1px solid rgba(199,255,57,.4);background:var(--bg3);border-radius:18px;overflow:hidden;margin-top:38px;margin-bottom:18px}
.feat-in{padding:28px}
@media(min-width:768px){.feat-in{padding:34px 38px}}
.feat .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.feat h3{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:800;line-height:1.18;margin:10px 0 14px;max-width:26ch}
.feat p{color:var(--mut);font-size:15px;line-height:1.65;max-width:52em}
.feat .imp{color:var(--txt);font-weight:600;margin-top:14px}
.figs{display:grid;gap:14px;margin:24px 0 4px}
@media(min-width:640px){.figs{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}}
.fig{border:1px solid var(--bd2);border-radius:14px;padding:16px 18px;background:rgba(6,8,7,.5)}
.fig b{display:block;font-size:clamp(1.15rem,3vw,1.4rem);font-weight:700;color:var(--lime);letter-spacing:-.01em}
.fig b i{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.fig span{display:block;margin-top:5px;font-size:12.5px;color:var(--mut);line-height:1.45}

/* ---------- каталог ---------- */
.cat{display:grid;gap:18px;margin-top:36px}
@media(min-width:700px){.cat{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.cat{grid-template-columns:repeat(3,1fr)}}
.ccard{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:18px;display:flex;flex-direction:column;transition:border-color .3s,transform .3s var(--ease)}
.ccard:hover{border-color:rgba(199,255,57,.45);transform:translateY(-3px)}
.ccard h3{font-size:16.5px;font-weight:700;margin:16px 0 8px;line-height:1.3}
.ccard>p{font-size:13.5px;color:var(--mut);line-height:1.58}
.cf{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;line-height:1.45}
.cf b{color:var(--dim);font-weight:600}
.cnote{margin-top:22px;font-size:13.5px;color:var(--mut);line-height:1.6;max-width:60em}
.bonus{border:1px solid rgba(199,255,57,.45);border-radius:18px;padding:28px;margin-top:36px;
  background:linear-gradient(135deg,rgba(199,255,57,.09),transparent 55%),var(--bg3)}
@media(min-width:768px){.bonus{padding:34px 38px}}
.bonus .bt{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.bonus h3{font-size:clamp(1.2rem,2.8vw,1.5rem);font-weight:800;line-height:1.25;margin-bottom:14px;max-width:28ch}
.bonus p{color:var(--mut);font-size:14.5px;line-height:1.65;max-width:56em}
.bonus ul{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:16px}
.bonus li{display:flex;gap:12px;font-size:14.5px;color:var(--mut);line-height:1.6}
.bonus li .m{color:var(--lime);flex:none;font-weight:700}
.bonus li b{color:var(--txt);font-weight:600}

/* checks sequence */
.seq{display:flex;flex-direction:column;margin:22px 0 46px;border:1px solid var(--bd);border-radius:18px;background:var(--bg2);overflow:hidden}
.seq li{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--bd);list-style:none;transition:background .25s}
.seq li:last-child{border-bottom:none}
.seq li:hover{background:rgba(199,255,57,.03)}
.seq .icb{width:38px;height:38px;border:1px solid var(--bd2);border-radius:11px;display:grid;place-items:center;color:var(--lime);flex:none}
.seq p{font-size:14.5px;color:var(--mut);line-height:1.6;padding-top:7px}
.seq p b{color:var(--txt);display:block;margin-bottom:2px;font-weight:600}

/* three deal options */
.opts{display:grid;gap:16px;margin-top:20px}
@media(min-width:900px){.opts{grid-template-columns:1.25fr 1fr 1fr;align-items:start}}
.opt{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:24px;transition:border-color .3s}
.opt:hover{border-color:rgba(199,255,57,.45)}
.opt.pref{border-color:rgba(199,255,57,.45);background:var(--bg3)}
.opt .lab{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
.opt .lab i{font-style:normal;font-family:var(--mono);border:1px solid rgba(199,255,57,.4);border-radius:6px;padding:1px 7px;font-size:11px}
.opt h3{font-size:18px;font-weight:700;margin-bottom:10px;line-height:1.32}
.opt p{font-size:14.5px;color:var(--mut);line-height:1.62}

/* steps ladder */
.lad{display:grid;gap:44px;margin-top:38px;align-items:start}
@media(min-width:1024px){.lad{grid-template-columns:1fr 1fr;gap:52px}}
.lrow{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--bd)}
.lrow:last-child{border-bottom:none}
.lrow .n{color:var(--lime);font-weight:700;font-size:20px;width:42px;flex:none;font-family:var(--mono)}
.lrow h3{font-size:17px;font-weight:700;margin-bottom:6px}
.lrow p{font-size:14.5px;color:var(--mut);line-height:1.6}
.rulebox{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:28px;margin-bottom:22px}
.rulebox .t{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
.rulebox ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.rulebox li{display:flex;gap:12px;font-size:14.5px;color:var(--mut);line-height:1.6}
.rulebox li b.n{color:var(--lime);flex:none;font-family:var(--mono);font-size:13px;padding-top:2px}
.rulebox li b.w{color:var(--txt)}
blockquote{border-left:2px solid var(--lime);padding:4px 0 4px 22px;font-size:clamp(1.05rem,3vw,1.25rem);font-weight:500;line-height:1.55}

/* stages */
.stage{display:grid;gap:14px;border:1px solid var(--bd);background:var(--bg2);border-radius:18px;padding:24px;margin-bottom:16px;transition:border-color .3s}
@media(min-width:768px){.stage{grid-template-columns:168px 1fr;gap:24px;padding:28px}}
.stage:hover{border-color:var(--bd2)}
.stage.hl{border-color:rgba(199,255,57,.4);background:var(--bg3)}
.stage .sn{color:var(--lime);font-weight:700;font-size:16px;font-family:var(--mono)}
.stage .sd{font-size:11.5px;color:var(--mut);margin-top:3px;letter-spacing:.04em}
.stage h3{font-size:17px;font-weight:700;margin-bottom:6px}
.stage p{font-size:14.5px;color:var(--mut);margin-bottom:8px;line-height:1.62}
.stage .pr{font-size:13.5px;font-weight:600;color:var(--lime);margin-bottom:0}

/* table */
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:18px;margin:22px 0 26px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:660px}
caption{text-align:left;padding:16px 18px 0;font-size:12.5px;color:var(--mut)}
th{text-align:left;padding:13px 18px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:700;border-bottom:1px solid var(--bd);background:var(--bg2)}
th.r,td.r{text-align:right}
td{padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px;color:var(--mut);vertical-align:top;line-height:1.55}
td:first-child{color:var(--txt);font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(199,255,57,.025)}
td.sum{white-space:nowrap;color:var(--txt);font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}

/* faq */
.faq{max-width:860px}
.fitem{border:1px solid var(--bd);background:var(--bg2);border-radius:18px;margin-bottom:14px;transition:border-color .3s}
.fitem:hover,.fitem.open{border-color:rgba(199,255,57,.4)}
.fbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;
  padding:20px 24px;font-size:clamp(1rem,2.8vw,1.12rem);font-weight:700;background:none;border:none;color:var(--txt);cursor:pointer;font-family:inherit;line-height:1.35}
.fico{color:var(--lime);transition:transform .3s var(--ease);flex:none}
.fitem.open .fico{transform:rotate(45deg)}
.fbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.fitem.open .fbody{grid-template-rows:1fr}
.fbody>div{overflow:hidden}
.fbody p{padding:0 24px 22px;font-size:14.5px;color:var(--mut);line-height:1.68;max-width:62em}

/* cta */
.cta{position:relative;overflow:hidden;padding:96px 0 110px}
.cta-glow{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(82,188,76,.30),transparent 51%)}
.cta .in{position:relative;max-width:920px;margin:0 auto;text-align:center}
.cta h2{max-width:none;margin-left:auto;margin-right:auto}
.cta3{display:grid;gap:16px;text-align:left;margin:38px 0 42px}
@media(min-width:760px){.cta3{grid-template-columns:repeat(3,1fr)}}
.dec{border:1px solid var(--bd2);background:rgba(10,13,11,.82);border-radius:18px;padding:24px;transition:border-color .3s,transform .3s var(--ease)}
.dec:hover{border-color:rgba(199,255,57,.55);transform:translateY(-3px)}
.dec .big{color:var(--lime);font-weight:700;font-size:22px;margin-bottom:10px;font-family:var(--mono)}
.dec p{font-size:14.5px;color:var(--mut);line-height:1.62}
.dec p b{color:var(--txt);font-weight:600}

footer{border-top:1px solid var(--bd)}
.ft-in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:36px 0;font-size:11.5px;color:var(--mut)}
.ft-in .lg{font-weight:800;font-size:14px;color:var(--txt)}

/* ---------- если читать одну минуту ---------- */
.minute{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:44px 0 40px}
@media(min-width:768px){.minute{padding:56px 0 52px}}
.mgrid{display:grid;gap:26px;margin-top:6px}
@media(min-width:860px){.mgrid{grid-template-columns:1.05fr 1fr 1fr;gap:34px}}
.mcol{display:flex;flex-direction:column}
.mh{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.mlist,.mnum{list-style:none;display:flex;flex-direction:column;gap:11px}
.mlist li{display:flex;gap:11px;font-size:14px;color:var(--mut);line-height:1.5}
.mlist li b{color:var(--lime);font-family:var(--mono);font-size:12.5px;flex:none;padding-top:2px}
.mnum li{display:flex;flex-direction:column;gap:2px}
.mnum li b{color:var(--lime);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mnum li span{font-size:13px;color:var(--mut);line-height:1.5}
.mfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--dim);line-height:1.5}
.mcta{margin-top:28px;padding-top:18px;border-top:1px solid var(--bd);font-size:14px;color:var(--mut);line-height:1.6;max-width:64em}
.mcta a{color:var(--lime);border-bottom:1px solid rgba(199,255,57,.4)}
.mcta a:hover{border-bottom-color:var(--lime)}

/* бейдж макета на карточках каталога */
.mock{position:absolute;top:10px;left:10px;z-index:4;font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txt);background:rgba(6,8,7,.82);border:1px solid var(--bd2);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:5px;padding:3px 8px}

/* ---------- маршрутизация заявок ---------- */
.lanes{display:grid;gap:14px;margin:22px 0 4px}
@media(min-width:820px){.lanes{grid-template-columns:repeat(3,1fr)}}
.lane{border:1px solid var(--bd);border-radius:16px;padding:18px;background:rgba(6,8,7,.5);display:flex;flex-direction:column;gap:10px}
.lane.keep{border-color:rgba(199,255,57,.45);background:rgba(199,255,57,.05)}
.ltag{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--bd2);border-radius:5px;padding:3px 8px;display:inline-block}
.lane.keep .ltag{color:var(--lime);border-color:rgba(199,255,57,.5)}
.lin{font-size:14px;color:var(--txt);font-weight:600;line-height:1.4}
.lin em{display:block;margin-top:3px;font-style:normal;font-weight:400;font-size:12.5px;color:var(--mut)}
.larrow{height:16px;position:relative}
.larrow::before{content:"";position:absolute;left:0;top:7px;width:100%;height:1px;background:var(--bd2)}
.larrow::after{content:"";position:absolute;right:0;top:3.5px;width:7px;height:7px;border-top:1px solid var(--bd2);
  border-right:1px solid var(--bd2);transform:rotate(45deg)}
.lane.keep .larrow::before,.lane.keep .larrow::after{background:rgba(199,255,57,.5);border-color:rgba(199,255,57,.5)}
.lane.keep .larrow::before{background:rgba(199,255,57,.5)}
.lout{margin-top:auto}
.lout b{display:block;font-size:15px;font-weight:700;color:var(--txt)}
.lane.keep .lout b{color:var(--lime)}
.lout span{display:block;margin-top:3px;font-size:12.5px;color:var(--mut);line-height:1.45}

/* обязательство GENTERO */
.pledge{margin-top:22px;border:1px solid var(--bd2);border-radius:16px;padding:22px;background:rgba(6,8,7,.45)}
.pledge .pt{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:14px;line-height:1.45}
.pledge ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.pledge li{display:flex;gap:11px;font-size:14px;color:var(--mut);line-height:1.55}
.pledge li .m{color:var(--lime);flex:none;font-weight:700}
.pledge li b{color:var(--txt);font-weight:600}
.pledge .pf{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--dim);line-height:1.5}

/* ---------- что наше, что закупное ---------- */
.split{display:grid;gap:16px;margin-top:34px;border:1px solid var(--bd);border-radius:18px;padding:24px;background:var(--bg2)}
@media(min-width:760px){.split{grid-template-columns:1fr 1fr;padding:28px 30px}}
.sp-h{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.sp-col.ours .sp-h{color:var(--lime)}
.sp-col.buy .sp-h{color:var(--mut)}
.sp-col ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.sp-col li{display:flex;flex-direction:column;gap:1px}
.sp-col li b{font-size:14.5px;font-weight:600;color:var(--txt)}
.sp-col.buy li b{color:var(--mut)}
.sp-col li span{font-size:12.5px;color:var(--dim);line-height:1.45}
.sp-note{grid-column:1/-1;margin-top:6px;padding-top:16px;border-top:1px solid var(--bd);font-size:13.5px;color:var(--mut);line-height:1.6}

.honest{border-left:2px solid rgba(199,255,57,.5);padding:2px 0 2px 16px;margin:0 0 16px;
  font-size:13.5px;color:var(--mut);line-height:1.6;max-width:56em}
.honest b{color:var(--txt);font-weight:600}

.gate{border:1px solid rgba(199,255,57,.42);border-radius:18px;padding:24px;margin-top:6px;
  background:linear-gradient(135deg,rgba(199,255,57,.07),transparent 58%),var(--bg3)}
@media(min-width:768px){.gate{padding:28px 30px}}
.gate .gt{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
.gate p{font-size:14.5px;color:var(--mut);line-height:1.65;max-width:62em}
.gate p b{color:var(--txt);font-weight:600}

/* ---------- reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{transition:none;opacity:1;transform:none}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- печать ---------- */
@media print{
  @page{margin:14mm}
  :root{--txt:#111;--mut:#3d3d42;--bd:#d4d4d8;--bd2:#d4d4d8;--lime:#3f6212;--bg:#fff;--bg2:#fff;--bg3:#fafafa;--dim:#52525b}
  html,body{background:#fff!important;color:#111!important;font-size:10.5pt}
  header,.spine,#mmenu,.hero-glow,.hero-media,.cta-glow,.mbtn,.btn,.noise{display:none!important}
  .hero{padding:0 0 18pt}
  section{padding:16pt 0;border-top:1px solid #d4d4d8}
  h1,h2,h3{color:#111!important;break-after:avoid}
  .reveal{opacity:1!important;transform:none!important}
  .card,.feat,.opt,.stage,.rulebox,.fitem,.dec,.toc,.seq,.fig,.pcard,.ccard,.bonus,.tblw,.shot{border:1px solid #d4d4d8!important;background:#fff!important;break-inside:avoid}
  .stats,.stat,.seq li{background:#fff!important;border-color:#d4d4d8!important}
  .stat b,.fig b,.dec .big,.lrow .n,.stage .sn,.toc li a b,.stage .pr,.rulebox li b.n,.card .k,.feat .k,.opt .lab,.pava,.pfin em,.bonus .bt,.bonus li .m{color:#3f6212!important}
  .fbody{grid-template-rows:1fr!important}
  .fbody>div{overflow:visible!important}
  .fico{display:none}
  .tblw{overflow:visible} table{min-width:0}
  th{background:#f4f4f5!important;color:#3f6212!important}
  .shot{aspect-ratio:16/7}
  .honest{border-left-color:#3f6212!important}
  .gate{border:1px solid #d4d4d8!important;background:#fafafa!important;break-inside:avoid}
  .gate .gt{color:#3f6212!important}
  .lane,.pledge,.split{border:1px solid #d4d4d8!important;background:#fff!important;break-inside:avoid}
  .lane.keep{background:#f7fbe9!important}
  .ltag,.lout b,.pledge li .m,.sp-col.ours .sp-h{color:#3f6212!important}
  .mock{background:#3f6212!important;color:#fff!important}
  .minute{background:#fff!important;border-color:#d4d4d8!important;break-inside:avoid}
  .mnum li b,.mlist li b,.mcta a{color:#3f6212!important}
  .shot .fb svg [stroke="#c7ff39"]{stroke:#3f6212!important}
  .shot .fb svg [fill="#c7ff39"]{fill:#3f6212!important}
  .shot .fb svg [stroke="#4a5550"],.shot .fb svg [stroke="#3d4a44"]{stroke:#9ca3a0!important}
  figcaption{color:#52525b!important}
  a{color:#111!important}
}

<script>
(function(){
  'use strict';
  var ITER = 250000;
  var gate = document.getElementById('gate');
  var form = document.getElementById('gform');
  var pass = document.getElementById('gpass');
  var btn  = document.getElementById('gbtn');
  var err  = document.getElementById('gerr');

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

  if (!(window.crypto && window.crypto.subtle)) {
    err.textContent = 'Браузер не поддерживает расшифровку. Откройте в Chrome, Safari или Firefox.';
    pass.disabled = btn.disabled = true;
    return;
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var p = pass.value;
    if (!p) return;
    btn.disabled = true;
    err.className = 'ok';
    err.textContent = 'Расшифровка...';

    var raw  = b64(document.getElementById('payload').textContent.trim());
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);

    crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt: salt, iterations: ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, data); })
      .then(function(buf){
        document.getElementById('doc').innerHTML = new TextDecoder().decode(buf);
        gate.classList.add('done');
        gate.remove();            // иначе на странице остаётся второй h1
        document.title = 'ИНТЕГРА 2.0';
        // innerHTML не исполняет вложенные script, инициализацию зовём сами
        try { initDoc(); } catch(e) { console.error(e); }
        var h = document.getElementById('h-top');
        if (h) { h.setAttribute('tabindex','-1'); h.focus(); }
      })
      .catch(function(){
        err.className = '';
        err.textContent = 'Пароль не подошёл.';
        btn.disabled = false;
        pass.select();
      });
  });

  pass.focus();
})();
</script>
<script>
function initDoc(){

  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* --- слоты съёмки: пометить уже загруженные (кэш опережает onload) --- */
  document.querySelectorAll('.shot img, .hero-media img').forEach(function(im){
    if (im.complete && im.naturalWidth > 0) im.parentNode.classList.add('has');
  });

  /* --- scroll reveal --- */
  if ('IntersectionObserver' in window && !reduce) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.14, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }

  /* --- состояние шапки: sentinel вместо слушателя scroll --- */
  var hd = document.getElementById('hd');
  var sentinel = document.createElement('div');
  sentinel.setAttribute('aria-hidden','true');
  sentinel.style.cssText = 'position:absolute;top:100px;left:0;width:1px;height:1px;pointer-events:none';
  document.body.appendChild(sentinel);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(e){
      hd.classList.toggle('scrolled', !e[0].isIntersecting);
    }, { threshold: 0 }).observe(sentinel);
  } else {
    hd.classList.add('scrolled');
  }

  /* --- активный раздел: шапка и рейка --- */
  var ids = ['top','benefits','why','package','catalog','site','sell','stages','faq','decision'];
  var links = {};
  document.querySelectorAll('#spine a, #navd a').forEach(function(a){
    var id = a.getAttribute('href').slice(1);
    (links[id] = links[id] || []).push(a);
  });
  function setActive(id){
    Object.keys(links).forEach(function(k){
      links[k].forEach(function(a){
        if (k === id) a.setAttribute('aria-current','true');
        else a.removeAttribute('aria-current');
      });
    });
  }
  if ('IntersectionObserver' in window) {
    var seen = {};
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ seen[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0; });
      var best = null, bestVal = 0;
      ids.forEach(function(id){ if ((seen[id] || 0) > bestVal) { bestVal = seen[id]; best = id; } });
      if (best) setActive(best);
    }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.01, 1] });
    ids.forEach(function(id){ var el = document.getElementById(id); if (el) spy.observe(el); });
  }

  /* --- мобильное меню: ловушка фокуса и Esc --- */
  var mm = document.getElementById('mmenu');
  var mopen = document.getElementById('mopen');
  var mclose = document.getElementById('mclose');
  var lastFocus = null;

  function openMenu(){
    lastFocus = document.activeElement;
    mm.classList.add('open');
    document.body.classList.add('lock');
    mopen.setAttribute('aria-expanded','true');
    mclose.focus();
  }
  function closeMenu(){
    mm.classList.remove('open');
    document.body.classList.remove('lock');
    mopen.setAttribute('aria-expanded','false');
    if (lastFocus) lastFocus.focus();
  }
  mopen.addEventListener('click', openMenu);
  mclose.addEventListener('click', closeMenu);
  mm.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMenu); });
  document.addEventListener('keydown', function(ev){
    if (!mm.classList.contains('open')) return;
    if (ev.key === 'Escape') { closeMenu(); return; }
    if (ev.key !== 'Tab') return;
    var f = mm.querySelectorAll('a[href], button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  /* --- FAQ --- */
  document.querySelectorAll('.fbtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = btn.closest('.fitem');
      var was = item.classList.contains('open');
      document.querySelectorAll('.fitem.open').forEach(function(i){
        i.classList.remove('open');
        i.querySelector('.fbtn').setAttribute('aria-expanded','false');
      });
      if (!was) { item.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    });
  });

  /* --- печать: раскрыть все ответы --- */
  window.addEventListener('beforeprint', function(){
    document.querySelectorAll('.fitem').forEach(function(i){ i.classList.add('open'); });
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  });

}
</script>
