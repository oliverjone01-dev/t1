<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kostya-AI. Качество работы менеджеров GENGROUP</title>
<style>
/* Два правила для правок в этом блоке.
   1. Запятых в комментариях быть не должно. Стили сводки уезжают в академию
      через scope_css из build-site.py: он режет список селекторов по запятой
      а комментарий перед правилом попадает в этот же список. Запятая внутри
      комментария рвёт селектор и правило молча гибнет.
   2. Комментарий не ставится прямо перед @media. Тот же разбор приклеит его
      к прелюдии селектора и весь блок @media станет невалидным. Пояснение
      к медиазапросу пишется внутри его фигурных скобок. */

:root{
  --bg:#06121a; --panel:#0b1a24; --panel2:#0e2130; --line:#233242; --line2:#2a3a4a;
  --tx:#dfe9f0; --mut:#7b93a6; --note:#dfe9f0; --acc:#22D3EE; --acc2:#0E7490;
  --ok:#34D399; --warn:#f59e0b; --bad:#E05A50; --pink:#ec4899;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:var(--fs,15.5px)/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
header{padding:var(--s5,22px) var(--s4,24px) 0;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a1c27,#06121a)}
h1{margin:0 0 4px;font-size:calc(var(--fs,15.5px) + 6px);letter-spacing:.2px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:calc(var(--fs,15.5px) - 3px);margin-bottom:var(--s4,16px)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);
  padding:11px 18px;font-size:calc(var(--fs,15.5px) - 1px);cursor:pointer;font-family:inherit}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav button{display:inline-flex;align-items:center;gap:7px}
/* Иконка едет за кеглем строки и наследует цвет контекста. */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
h2{display:flex;align-items:center;gap:10px}
h2 .ic{color:var(--acc)}
/* Внутри академии заголовок уезжает в липкую шапку полосы. Собственные
   вертикальные поля сводки её раздувают. Снаружи селектор не совпадает ни с чем. */
.band-head h2{margin:0}
main{padding:0 var(--s4,24px) var(--s6,60px);max-width:1560px;margin:0 auto}
.tabpanel{display:none}.tabpanel.on{display:block}
h2{font-size:calc(var(--fs,15.5px) + 4px);margin:var(--s6,34px) 0 var(--s3,12px);font-weight:650}
h2:first-child{margin-top:0}
h3{font-size:calc(var(--fs,15.5px) + 1px);margin:var(--s5,22px) 0 var(--s2,8px)}
p{margin:var(--s2,8px) 0}
.grid{display:grid;gap:var(--s4,16px)}
.k4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:var(--s4,16px) var(--s5,20px);margin:0}

/* ── полосы вместо квадратов ───────────────────────────────────────────
   Ряд «подпись слева и число справа» читается сверху вниз одним движением
   глаза. Сетка плиток заставляет прыгать зигзагом. На первом экране РОПа
   нужен ровно один проход. Разметка совпадает с .strip дизайн-системы
   академии: в обоих режимах геометрия одна. */
.strips{border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--panel);margin:0 0 var(--s4,16px)}
.strip{display:flex;align-items:baseline;gap:var(--s4,16px);
  padding:var(--s3,13px) var(--s5,20px);border-bottom:1px solid var(--line)}
.strip:last-child{border-bottom:0}
.strip .l{flex:1 1 260px;min-width:0}
.strip .l b{display:block;font-weight:600;font-size:var(--fs,15.5px);line-height:1.35}
.strip .l span{display:block;color:var(--mut);font-size:calc(var(--fs,15.5px) - 3px);
  line-height:1.5;margin-top:3px}
/* Числа стоят колонкой по правому краю. Метка справа держит свою ширину:
   иначе длинная метка сдвигает соседнее число и столбец перестаёт читаться
   одним движением глаза. */
.strip .v{flex:none;min-width:170px;text-align:right;
  font-size:calc(var(--fs,15.5px) + 10px);font-weight:650;
  font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.strip .st{flex:none;min-width:190px;text-align:right}
.strips.big .strip{padding-top:var(--s4,16px);padding-bottom:var(--s4,16px)}
.strips.big .v{font-size:calc(var(--fs,15.5px) + 15px);min-width:250px}

.tag{display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:calc(var(--fs,15.5px) - 3px);line-height:1.45;border:1px solid var(--line2);
  color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#1c5a45} .tag.bad{color:var(--bad);border-color:#5c2320}
.tag.warn{color:var(--warn);border-color:#5e4415} .tag.acc{color:var(--acc);border-color:var(--acc2)}
table{width:100%;border-collapse:collapse;font-size:calc(var(--fs,15.5px) - 2px)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
/* Таблицы сводки показываются целиком: внутренняя прокрутка на десяти строках
   прячет двух последних менеджеров. Именно они внизу ростера. Липкая шапка
   при этом не нужна и выключается: иначе она уезжает поверх шапки полосы. */
.scroll.full{max-height:none}
.scroll.full th{position:static}
th,td{padding:var(--s3,12px) var(--s4,16px);text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:calc(var(--fs,15.5px) - 3px);letter-spacing:0;
  text-transform:none;position:sticky;top:0;background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap,th.wrap{white-space:normal}
/* Вторая строка в ячейке: номер сделки и стадия плюс название счётчика. */
.sub2{display:block;color:var(--mut);font-weight:400;line-height:1.45;margin-top:3px;
  font-size:calc(var(--fs,15.5px) - 3px);white-space:normal}
td.num .sub2{white-space:nowrap}
.nm2{font-weight:600}

/* ── раскрываемая строка светофора ─────────────────────────────────────
   Одиннадцать колонок в один экран не влезают без горизонтальной прокрутки.
   Прокрутка вбок на сводке означает что половину цифр никто не увидит.
   На виду семь. Остальное открывается по строке. */
button.exp{background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--mut);
  font:inherit;font-size:calc(var(--fs,15.5px) - 3px);line-height:1;padding:5px 7px;cursor:pointer;
  flex:none;margin-right:var(--s3,12px)}
button.exp:hover{color:var(--acc);border-color:var(--acc2)}
tr.det{display:none}
tr.det.on{display:table-row}
tr.det>td{background:var(--panel2);white-space:normal;padding:var(--s4,16px) var(--s5,20px)}
.detg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3,12px) var(--s4,16px)}
.detg>div{border-left:2px solid var(--line2);padding-left:var(--s3,12px)}
.detg span{display:block;color:var(--mut);font-size:calc(var(--fs,15.5px) - 3px);line-height:1.45}
.detg b{font-size:calc(var(--fs,15.5px) + 1px);font-variant-numeric:tabular-nums}
.mgrcell{display:flex;align-items:baseline}

.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px;
  max-width:280px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}
.note{background:var(--panel2);border-left:3px solid var(--acc2);padding:var(--s3,12px) var(--s4,16px);
  border-radius:0 8px 8px 0;color:var(--mut);font-size:calc(var(--fs,15.5px) - 2px);
  margin:var(--s3,12px) 0;max-width:100ch}
.note.bad{border-left-color:var(--bad)}

/* Состояние инструмента: одна строка со ссылкой-разворотом. Первым экраном
   стоят деньги а не оговорки про инструмент но и прятать их нельзя. */
.disc{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;margin:0 0 var(--s4,16px);max-width:110ch}
.disc>summary{padding:var(--s3,12px) var(--s4,16px);cursor:pointer;list-style:none;
  color:var(--mut);font-size:calc(var(--fs,15.5px) - 3px);line-height:1.55}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary b{color:var(--tx)}
.disc>summary i{font-style:normal;color:var(--acc);border-bottom:1px dashed var(--acc2)}
.disc[open]>summary i{display:none}
.disc .body{padding:0 var(--s4,16px) var(--s3,12px);color:var(--mut);
  font-size:calc(var(--fs,15.5px) - 3px);line-height:1.6}

.mgr{border:1px solid var(--line);border-radius:10px;margin-bottom:var(--s3,12px);
  background:var(--panel);overflow:hidden}
.mgr>summary{padding:var(--s3,14px) var(--s4,16px);cursor:pointer;list-style:none;display:flex;
  gap:14px;align-items:center;flex-wrap:wrap}
.mgr>summary::-webkit-details-marker{display:none}
.mgr>summary:hover{background:var(--panel2)}
.mgr .nm{font-weight:600;min-width:190px}
.mgr .body{padding:0 var(--s4,16px) var(--s5,18px);border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:var(--s3,13px) var(--s4,16px)}
.mini .v{font-size:calc(var(--fs,15.5px) + 8px);font-weight:650;line-height:1.15;
  font-variant-numeric:tabular-nums}
.mini .l{color:var(--mut);font-size:calc(var(--fs,15.5px) - 3px);margin-top:4px;line-height:1.45}
.q{background:var(--panel2);border-left:3px solid var(--line2);padding:var(--s2,9px) var(--s3,13px);
  margin:var(--s2,7px) 0;border-radius:0 6px 6px 0;font-size:calc(var(--fs,15.5px) - 2px);color:#c3d3de}
.q.bad{border-left-color:var(--bad)}
.q.was{border-left-color:var(--bad)}
.q.now{border-left-color:var(--ok)}

/* ── реестр замечаний ──────────────────────────────────────────────────
   Счётчик слева и утверждение справа. Раскрытие - сделки-доказательства
   с вердиктом AI-Кости. Цвет дублируется словами «Хорошо» и «Плохо»:
   без них при дальтонизме вердикт нечитаем. */
details.reg{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  margin:0 0 var(--s3,12px)}
details.reg>summary{display:flex;align-items:center;gap:var(--s4,16px);
  padding:var(--s3,13px) var(--s5,20px);cursor:pointer;list-style:none}
details.reg>summary::-webkit-details-marker{display:none}
details.reg[open]>summary{border-bottom:1px solid var(--line)}
.rn{flex:none;min-width:84px;text-align:right;font-weight:650;line-height:1.1;
  font-size:calc(var(--fs,15.5px) + 12px);font-variant-numeric:tabular-nums}
.rn.bad{color:var(--bad)}.rn.good{color:var(--ok)}
.rt{flex:1 1 auto;min-width:0}
.reg-b{padding:var(--s3,12px) var(--s5,20px) var(--s4,16px)}
.rev{border:1px solid var(--line);border-radius:10px;background:var(--panel2);
  padding:var(--s3,12px) var(--s4,16px);margin:0 0 var(--s3,10px)}
.rev .q{background:var(--bg)}
.rk{font-size:calc(var(--fs,15.5px) - 2px);margin-top:6px;max-width:80ch}
.rk-g{display:block;color:var(--ok);margin-top:2px}
.rk-b{display:block;color:var(--bad);margin-top:2px}
@media (max-width:700px){
  details.reg>summary{gap:10px;padding:11px 12px}
  .rn{min-width:56px;font-size:calc(var(--fs,15.5px) + 6px)}
  .reg-b{padding:10px 12px 12px}
}
ul{margin:6px 0 6px 18px;padding:0} li{margin:4px 0}
.script{border:1px solid var(--line);border-radius:10px;padding:var(--s4,16px);
  margin-bottom:var(--s3,14px);background:var(--panel)}
.script .when{color:var(--acc);font-size:calc(var(--fs,15.5px) - 3px);margin-bottom:4px}
.script .why{color:var(--mut);font-size:calc(var(--fs,15.5px) - 2px);margin-bottom:10px}
.small{font-size:calc(var(--fs,15.5px) - 3px);color:var(--mut);line-height:1.6}
.hr{height:1px;background:var(--line);margin:var(--s5,22px) 0}
footer{padding:var(--s4,20px) var(--s4,24px);border-top:1px solid var(--line);color:var(--mut);
  font-size:calc(var(--fs,15.5px) - 3px)}
/* ── две колонки полос на широком экране ───────────────────────────────
   Одна полоса на 1600px занимает треть ширины и две трети пустуют. Подпись
   встаёт на свою строку. Число под ней слева. Метка и микрограф справа.
   Получается BI-плитка которая не рвётся ни на одной ширине: подпись всегда
   занимает 100% и числу некуда вылезать. */
.strips.two .strip{flex-wrap:wrap;row-gap:var(--s2,8px)}
.strips.two .strip .l{flex:1 1 100%}
.strips.two .strip .v{margin-right:auto;text-align:left;min-width:0}
.strip .st{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.strip .st .bar{margin-top:0;width:120px;max-width:120px;flex:none}
@media(min-width:1200px){
  .strips.two{display:grid;grid-template-columns:1fr 1fr}
  .strips.two>.strip{border-right:1px solid var(--line)}
  .strips.two>.strip:nth-child(2n){border-right:0}
  /* Полос в блоке всегда чётное число последний ряд снимается парой. */
  .strips.two>.strip:nth-last-child(-n+2){border-bottom:0}
}
/* Первый экран: число крупнее прозы втрое но с потолком. Без потолка на
   ультрашироком мониторе цифра перестаёт помещаться в свою колонку. */
.strips.big .v{font-size:clamp(30px,2.6vw,44px);min-width:0;line-height:1.1}
@media(min-width:1200px){
  /* Десктоп: первый экран читают через комнату. Нижняя граница 36px. */
  .strips.big .v{font-size:clamp(36px,2.9vw,44px)}
}
@media(max-width:900px){
  /* Раскрытие строки светофора пальцем: на планшете и телефоне цель 44px. */
  button.exp{min-width:44px;min-height:44px}
}
.strips.big .strip{padding-top:var(--s4,18px);padding-bottom:var(--s4,18px)}
/* Вкладка это основная навигация сводки и на телефоне тоже. */
nav button{min-height:44px}

@media(max-width:700px){
  main{padding:0 12px 40px}header{padding:16px 12px 0}
  th,td{white-space:normal}
  .strip{flex-wrap:wrap;gap:var(--s2,8px)}
  .strip .v,.strip .st,.strips.big .v{min-width:0;text-align:left}
  .strip .st{align-items:flex-start}
  .strips.big .v{font-size:clamp(28px,8vw,36px)}
  /* Фамилия и подпись под ней не рвутся по слогам: таблица и так уезжает
     в горизонтальную прокрутку внутри своей рамки. Три строки на ячейку
     превращают светофор в простыню. */
  .mgrcell .nm2,.mgrcell .sub2{white-space:nowrap}
}
</style>
</head>
<body>
<header>
  <h1>Kostya-<span>AI</span>. Качество работы менеджеров</h1>
  <div class="sub" id="sub"></div>
  <nav id="nav"></nav>
</header>
<main>
  <div class="tabpanel on" id="t-sum"></div>
  <div class="tabpanel" id="t-mgr"></div>
  <div class="tabpanel" id="t-deal"></div>
  <div class="tabpanel" id="t-scr"></div>
  <div class="tabpanel" id="t-fup"></div>
  <div class="tabpanel" id="t-reg"></div>
</main>
<footer id="foot"></footer>
<script>
const D = /*__DATA__*/null;
/* Нормализация текста, который приезжает данными и правится не здесь.
   Длинное тире меняется на дефис: правило типографики портала одно на все три
   контура. Личное имя руководителя в скриптах меняется на должность: на экране
   менеджера стоит роль, а не подпись живого человека. Имя записано кодами
   символов намеренно, чтобы grep по собранным файлам не находил его в шаблоне.
   Лукахед защищает однокоренные фамилии от превращения в «руководительов». */
const ROLE = {'':'руководитель','а':'руководителя','у':'руководителю','ом':'руководителем','е':'руководителе'};
const norm = v => String(v==null?'':v)
  .replace(/\u2014/g,'-')
  .replace(/\u0418\u0432\u0430\u043d(ом|а|у|е)?(?![А-Яа-яЁё])/g,(_,x)=>ROLE[x||'']);
const E = s => norm(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => (Math.round(n||0)).toLocaleString('ru-RU')+' ₽';
const pc = (v,d=0) => v==null ? 'нет данных' : (v*100).toFixed(d)+'%';
const mins = v => v==null ? 'нет данных' : v<60 ? v+' мин' : v<480 ? Math.floor(v/60)+' ч '+String(Math.round(v%60)).padStart(2,'0') : (v/480).toFixed(1)+' раб.дн';
const url = id => 'https://glassmemory.bitrix24.ru/crm/deal/details/'+id+'/';
const bar = (v,cls='') => `<div class="bar"><i class="${cls}" style="width:${Math.max(0,Math.min(100,v*100)).toFixed(0)}%"></i></div>`;
const dt = s => s ? String(s).slice(0,10).split('-').reverse().join('.') : 'дата не указана';
const num = n => (n==null?0:n).toLocaleString('ru-RU');

/* Индекс качества коммуникации. Веса - гипотеза, калибровка после 2 недель прогонов.
   Компоненты: скорость ответа, доведение диалога, конкретность сроков, квалификация, чистота текста. */
function commIndex(m){
  const r=m.reply||{};
  const speed = r.within60==null?0:r.within60;
  const tail  = r.over240==null?0:1-r.over240;
  const answered = m.in? 1-Math.min(1,m.unansweredCount/Math.max(1,m.dialogs)) : 0;
  const concrete = m.concreteTimeShare==null?0:m.concreteTimeShare;
  const qual = Math.min(1,(m.qualifyRate||0)/1.0);
  const dp = m.defectsPer100Out||{};
  const clean = Math.max(0,1-((dp['T07_ОРФОГРАФИЯ']||0)+(dp['T01_БЕЗ_ПОЯСНЕНИЯ']||0)+(dp['T02_БЕЗ_ПРИВЕТСТВИЯ']||0))/40);
  const v = speed*.25 + tail*.15 + answered*.20 + concrete*.15 + qual*.10 + clean*.15;
  return Math.round(v*100)/10;
}
/* Минимальная выборка та же, что в kostya-audit: 10 сделок. Ниже неё один плохой диалог
   двигает индекс на балл и светофор начинает врать, поэтому полосу не присваиваем. */
const MIN_DEALS = 10;
const band = (i,m) => (m && m.deals < MIN_DEALS) ? ['мало данных','']
  : i>=7.5?['молодец','ok']:i>=5?['норма','acc']:['в разборе','bad'];

/* Полоса дисциплины приезжает из снимка Bitrix (kostya-audit). В контракте нижняя
   полоса до сих пор называется «холодец»: это устный обиход РОПа, а на экране,
   который смотрит отдел, по scoring.md стоит «в разборе». Переименование здесь,
   а не в данных: контракт правит kostya-audit, шаблон только отображает. */
const BCLS  = {'молодец':'ok','норма':'acc','в разборе':'bad','мало данных':'','нет в снимке':''};
const BRANK = {'в разборе':0,'норма':1,'молодец':2,'мало данных':3,'нет в снимке':4};
const KM = D.kostyaManagers || {};
const dband = m => { const k=KM[m.mgr]; return !k ? 'нет в снимке' : (k.band==='холодец' ? 'в разборе' : k.band); };

/* ---------- вкладки ---------- */

   кабинет и сводка рисуют одну и ту же геометрию. aria-hidden: смысл несёт
   подпись рядом. */
const I = n => (D.icons && D.icons[n])
  ? `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${D.icons[n]}</svg>` : '';

const TABS=[['t-sum','Сводка','chart'],['t-mgr','Менеджеры','person'],['t-deal','Сделки','deal'],
  ['t-scr','Скрипты продаж','message'],['t-fup','Дожимы и лид-магниты','dozhim']];
if(D.registry)TABS.push(['t-reg','Реестр замечаний','check']);
document.getElementById('nav').innerHTML = TABS.map(([id,n,icn],i)=>
  `<button data-t="${id}" class="${i?'':'on'}">${I(icn)}<span>${n}</span></button>`).join('');
document.getElementById('nav').onclick = e => {

  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));

const M = D.managers.map(m=>({...m,idx:commIndex(m)}))

  `${D.totals.deals} сделок &middot; ${M.length} менеджеров с объёмом от 25 исходящих`;
document.getElementById('foot').innerHTML =

  `Индекс коммуникации и пороги помечены гипотезой до калибровки.`;

   суммой и днями простоя. Кто требует внимания - светофор по людям.

     на дашборде РОПа превращается в спор о том, откуда она взялась.

  document.getElementById('t-sum').innerHTML = `

  ${strip('Просрочено дел в CRM',

    rate(kc.D03||0,kt.openDeals), 'bad')}
  ${strip('Последнее слово осталось за клиентом',

</div>

  Флаг здесь это повод открыть сделку, а не установленный факт. <i>Развернуть</i></summary>

    return `<details class="mgr">

        <span class="nm">${link(m)}</span>
        <span class="tag ${BCLS[db]}">дисциплина: ${db}${k&&k.index!=null?" "+k.index.toFixed(1):""}</span>

        <span class="small">${m.deals} сделок в переписке &middot; ${m.out.toLocaleString('ru-RU')} исходящих &middot; медиана ${mins(r.medianMin)}</span>
        <span class="chips">
          ${m.unansweredCount?`<span class="tag bad">${m.unansweredCount} без ответа</span>`:''}
          ${m.escalationCount?`<span class="tag bad">${m.escalationCount} эскалаций</span>`:''}
          ${m.priceObjCount?`<span class="tag warn">${m.priceObjCount} «дорого»</span>`:''}
        </span>
      </summary>
      <div class="body">
        <h3>Скорость и доведение</h3>

          <div class="mini"><div class="v">${mins(r.medianMin)}</div><div class="l">медиана ответа</div></div>

          <div class="mini"><div class="v">${pc(r.within60)}</div><div class="l">ответов быстрее часа</div>${bar(r.within60||0,(r.within60||0)>.7?'ok':'warn')}</div>
          <div class="mini"><div class="v">${pc(m.initiatedShare)}</div><div class="l">диалогов начал сам</div></div>
          <div class="mini"><div class="v">${pc(m.concreteTimeShare)}</div><div class="l">обещаний с конкретным сроком</div>${bar(m.concreteTimeShare||0,(m.concreteTimeShare||0)>.3?'ok':'bad')}</div>
          <div class="mini"><div class="v">${(m.qualifyRate||0).toFixed(2)}%</div><div class="l">сообщений с квалификацией</div></div>
          <div class="mini"><div class="v">${m.avgOutChars||'нет данных'}</div><div class="l">средняя длина сообщения, знаков</div></div>
        </div>

        ${k?`<h3>Открытые сделки в снимке Bitrix</h3>
        <div class="grid k4">
          <div class="mini"><div class="v">${money(k.openBudget)}</div><div class="l">портфель на ${k.openDeals} открытых сделках</div></div>
          <div class="mini"><div class="v" style="color:var(--bad)">${k.stuckDeals}</div><div class="l">зависли на стадии, D01</div></div>
          <div class="mini"><div class="v" style="color:var(--bad)">${k.silentDeals}</div><div class="l">без активности дольше лимита, D02</div></div>
          <div class="mini"><div class="v" style="color:var(--bad)">${k.overdueTasks}</div><div class="l">просроченных дел, D03</div></div>
          <div class="mini"><div class="v" style="color:var(--warn)">${k.noNextStep}</div><div class="l">без следующего шага, D04</div></div>
          <div class="mini"><div class="v" style="color:var(--warn)">${k.emptyClassifiers}</div><div class="l">пустые классификаторы, D10</div></div>
          <div class="mini"><div class="v" style="color:var(--warn)">${k.zeroBudget}</div><div class="l">сделки с нулевой суммой, D07</div></div>
          <div class="mini"><div class="v">${k.index==null?'нет индекса':k.index.toFixed(1)}</div><div class="l">индекс дисциплины, полоса «${db}»</div></div>
        </div>`:''}

        <h3>Дефекты текста на 100 исходящих</h3>
        <div class="scroll"><table><thead><tr><th>Дефект</th><th class="num">На 100 сообщений</th><th class="num">Всего</th><th>Уровень</th></tr></thead><tbody>
        ${DEF.filter(([k2])=>dp[k2]!=null).map(([k2,n])=>{const v=dp[k2]||0;const cl=v>15?'bad':v>5?'warn':'ok';
          return `<tr><td>${n}</td><td class="num">${v}</td><td class="num">${(m.defects||{})[k2]||0}</td><td>${bar(Math.min(1,v/40),cl)}</td></tr>`}).join('')}
        </tbody></table></div>

        ${m.escalations&&m.escalations.length?`<h3 style="color:var(--bad)">Эскалации: клиент требовал руководителя или писал претензию</h3>
        ${m.escalations.map(e=>`<div class="q bad"><a href="${url(e.deal)}" target="_blank">Сделка ${E(e.deal)}</a>
          ${e.amount?` &middot; ${money(e.amount)}`:''} &middot; <span class="small">${E((e.at||'').slice(0,16).replace('T',' '))}</span><br>${E(e.text)}</div>`).join('')}`:''}

        ${m.unanswered&&m.unanswered.length?`<h3>Оставлено без ответа (топ по сумме)</h3>
        ${m.unanswered.slice(0,6).map(u=>`<div class="q"><a href="${url(u.deal)}" target="_blank">Сделка ${E(u.deal)}</a>
          ${u.amount?` &middot; ${money(u.amount)}`:''} &middot; <span class="small">${E((u.clientAt||'').slice(0,16).replace('T',' '))}, стадия ${E(u.stage)}</span><br>${E(u.clientText)}</div>`).join('')}`:''}

        ${m.worstReplies&&m.worstReplies.length?`<h3>Самые долгие ответы</h3>
        <div class="scroll"><table><thead><tr><th>Сделка</th><th class="num">Ждал</th><th class="wrap">Клиент написал</th><th class="wrap">Ответ менеджера</th></tr></thead><tbody>
        ${m.worstReplies.slice(0,6).map(w=>`<tr><td><a href="${url(w.deal)}" target="_blank">${E(w.deal)}</a></td>
          <td class="num" style="color:var(--bad)">${mins(w.minutes)}</td>
          <td class="wrap" style="max-width:380px">${E(w.clientText)}</td>
          <td class="wrap" style="max-width:380px">${E(w.reply)}</td></tr>`).join('')}
        </tbody></table></div>`:''}

        ${flags.length?`<h3>Флаги дисциплины по открытым сделкам</h3>
        <div class="scroll"><table><thead><tr><th>Код</th><th>Сделка</th><th class="num">Сумма</th><th class="wrap">Факт</th></tr></thead><tbody>
        ${flags.slice(0,12).map(f=>`<tr><td><span class="tag ${f.severity==='crit'?'bad':f.severity==='high'?'warn':''}">${E(f.code)}</span></td>
          <td><a href="${E(f.url)}" target="_blank">${E(f.deal)}</a></td><td class="num">${money(f.budget)}</td>
          <td class="wrap">${E(f.fact)}</td></tr>`).join('')}
        </tbody></table></div>`:''}

        <h3>Крупнейшие сделки в переписке</h3>
        <div class="scroll"><table><thead><tr><th>Сделка</th><th class="num">Сумма</th><th>Стадия</th>
          <th class="num">Сообщений</th><th class="num">вх/исх</th><th class="num">Дней</th><th>Последнее слово</th></tr></thead><tbody>
        ${deals.slice(0,12).map(d=>`<tr><td><a href="${url(d.id)}" target="_blank">${E(d.id)}</a></td>
          <td class="num">${money(d.amount)}</td><td>${E(d.stage)}</td><td class="num">${d.n}</td>
          <td class="num">${d.in}/${d.out}</td><td class="num">${d.days}</td>
          <td>${d.lastDir==='in'?'<span class="tag bad">за клиентом</span>':'<span class="tag ok">за нами</span>'}</td></tr>`).join('')}
        </tbody></table></div>
      </div></details>`;
  }).join('');
})();

/* ---------- 3. Сделки ---------- */
(function(){
  const rows=[];
  for(const [mgr,ds] of Object.entries(D.dealsByMgr)) for(const d of ds) rows.push({mgr,...d});
  rows.sort((a,b)=>b.amount-a.amount);
  const el=document.getElementById('t-deal');
  el.innerHTML=`
  <h2>${I('search')}Детализация обработки заказов</h2>
  <div class="note">Одна строка на сделку. «Последнее слово за клиентом» означает, что диалог оборвался на его сообщении.</div>
  <div class="card" style="margin-bottom:var(--s3,12px)">
    <input id="q" placeholder="Фильтр: менеджер, стадия, номер сделки, тип изделия"
      style="width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
      padding:11px 14px;border-radius:8px;font:inherit">
  </div>
  <div class="scroll"><table><thead><tr><th>Сделка</th><th>Менеджер</th><th class="num">Сумма</th><th>Стадия</th>
    <th>Тип клиента</th><th>Изделие</th><th class="num">Сообщ.</th><th class="num">вх</th><th class="num">исх</th>
    <th class="num">Дней</th><th>Последнее слово</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="small" id="cnt"></p>`;
  const tb=el.querySelector('#tb'), cnt=el.querySelector('#cnt');
  function draw(f){
    const q=(f||'').toLowerCase().trim();
    const r=q?rows.filter(x=>[x.id,x.mgr,x.stage,x.item,x.client].join(' ').toLowerCase().includes(q)):rows;
    tb.innerHTML=r.slice(0,300).map(d=>`<tr><td><a href="${url(d.id)}" target="_blank">${E(d.id)}</a></td>
      <td>${E(d.mgr)}</td><td class="num">${money(d.amount)}</td><td>${E(d.stage)}</td>
      <td>${E(d.client)}</td><td>${E(d.item)}</td><td class="num">${d.n}</td><td class="num">${d.in}</td>
      <td class="num">${d.out}</td><td class="num">${d.days}</td>
      <td>${d.lastDir==='in'?'<span class="tag bad">за клиентом</span>':'<span class="tag ok">за нами</span>'}</td></tr>`).join('');
    cnt.textContent=`Показано ${Math.min(300,r.length)} из ${r.length}. В карточках менеджеров показаны только их топ-60 сделок по сумме.`;
  }
  el.querySelector('#q').oninput=e=>draw(e.target.value);
  draw('');
})();

/* ---------- 6. Реестр замечаний с доказательствами ---------- */
/* Каждое утверждение методики отвечает на «докажи»: счётчик - все срабатывания
   детектора по переписке, раскрытие - конкретные сделки с цитатами и вердиктом
   AI-Кости по каждой. Имя менеджера ведёт в его кабинет, номер сделки в Bitrix. */
if (D.registry) (function(){
  const R=D.registry, C=R.claims||{};
  const codes=Object.keys(C).sort((a,b)=>C[b].total-C[a].total);
  const defs=codes.filter(c=>C[c].kind==='defect'), strs=codes.filter(c=>C[c].kind==='strong');
  const mglink = m => D.cabinets&&D.cabinets[m] ? `<a href="./${E(D.cabinets[m])}">${E(m)}</a>` : E(m);
  const evi = (e,kind) => `<div class="rev">
    <div class="rev-h"><a href="${url(e.deal)}" target="_blank">Сделка ${E(e.deal)}</a>
      <span class="sub2" style="display:inline;margin-left:8px">${E(e.when)} &middot; ${E(e.stage||'стадия не указана')}</span></div>
    ${e.client?`<div class="q">Клиент: ${E(e.client)}</div>`:''}
    <div class="q ${kind==='defect'?'was':'now'}">Менеджер: ${E(e.manager)}</div>
    <div class="rk"><b>AI-Костя.</b>
      <span class="rk-g">Хорошо: ${E(e.well)}</span>
      ${e.bad?`<span class="rk-b">Плохо: ${E(e.bad)}</span>`:''}
      ${e.should?`<div class="q now" data-copy>Как надо было: ${E(e.should)}</div>`:''}
    </div></div>`;
  const claim = code => { const c=C[code];
    const nev=Object.values(c.byMgr).reduce((s,v)=>s+v.evidence.length,0);
    return `<details class="reg">
    <summary><span class="rn ${c.kind==='defect'?'bad':'good'}">${num(c.total)}</span>
      <span class="rt"><b>${E(c.title)}</b>
      <span class="sub2">${num(c.total)} срабатываний по переписке &middot; в выборке ${num(nev)} сделок,
      ${Object.keys(c.byMgr).length} менеджеров &middot; раскрыть</span></span></summary>
    <div class="reg-b">
    ${c.diag?`<p class="small" style="max-width:75ch">${E(c.diag)}</p>`:''}
    ${Object.entries(c.byMgr).sort((a,b)=>b[1].n-a[1].n).map(([m,v])=>`
      <h3 style="margin-top:14px">${mglink(m)} <span class="tag ${c.kind==='defect'?'bad':'ok'}">${num(v.n)}</span></h3>
      ${v.evidence.map(e=>evi(e,c.kind)).join('')}`).join('')}
    </div>
  </details>`; };
  document.getElementById('t-reg').innerHTML = `
    <div id="reestr"></div>
    <h2>${I('check')}Реестр замечаний с доказательствами</h2>
    <div class="note" style="max-width:85ch">Каждое утверждение методики привязано к сделкам, по которым оно посчитано.
      Счётчик - все срабатывания детектора за период ${E((R.meta||{}).period||'')}.
      ${E((R.meta||{}).note||'')} Нулевые пункты каталога (жаргон, «вы же сами») в письменной
      переписке за период не встретились: они пришли из ручного разбора Кости и остаются в методике.</div>
    <h2 style="margin-top:20px">Что чинить</h2>
    ${defs.map(claim).join('')}
    <h2>Что уже получается</h2>
    ${strs.map(claim).join('')}`;
  /* Прямой заход по якорю #reestr: оболочка академии показывает секцию сводки,
     а вкладку внутри неё переключаем сами. */
  function openReg(){ if(location.hash.indexOf('reestr')<0) return;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==='t-reg'));
    document.querySelectorAll('.tabpanel').forEach(s=>s.classList.toggle('on',s.id==='t-reg')); }
  window.addEventListener('hashchange',openReg); openReg();
})();

// Раскрытие строки светофора. Обработчик один на документ и переживает
// перерисовку вкладок, как и сортировка ниже.
document.addEventListener('click', e => {
  const b = e.target.closest('button.exp');
  if (!b) return;
  const det = b.closest('tr') && b.closest('tr').nextElementSibling;
  if (!det || !det.classList.contains('det')) return;
  const on = det.classList.toggle('on');
  b.setAttribute('aria-expanded', on ? 'true' : 'false');
  b.innerHTML = on ? '&#9662;' : '&#9656;';
});

// Сортировка по клику на заголовок: разборы выкатываются всем сразу, но читать их
// скопом нельзя, нужен вход по одному столбцу. Обработчик один на документ и
// переживает перерисовку вкладок.
document.addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const table = th.closest('table'), tb = table && table.tBodies[0];
  if (!tb || !tb.rows.length) return;
  const col = [...th.parentNode.children].indexOf(th);
  const dir = th.dataset.dir === 'asc' ? -1 : 1;
  for (const h of th.parentNode.children) { delete h.dataset.dir; h.textContent = h.textContent.replace(/ [▲▼]$/, ''); }
  th.dataset.dir = dir === 1 ? 'asc' : 'desc';
  th.textContent += dir === 1 ? ' ▲' : ' ▼';
  // Значение берётся из data-v, а не из текста ячейки. Текст врёт: «1.5 раб.дн»
  // после вычистки нецифр превращалась в 1.5 и вставала ниже «12 мин», а одна
  // ячейка «нет данных» роняла всю колонку в алфавитную сортировку.
  const val = r => {
    const c = r.cells[col];
    if (!c || c.dataset.v === undefined) return null;
    const n = parseFloat(c.dataset.v);
    return Number.isNaN(n) ? null : n;
  };
  // Раскрываемая строка едет за своей. Без этого первая же сортировка светофора
  // перемешивает подробности с чужими фамилиями.
  const det = new Map(), rows = [];
  for (const r of [...tb.rows]) {
    if (r.classList.contains('det')) { if (rows.length) det.set(rows[rows.length - 1], r); }
    else rows.push(r);
  }
  // Текстовый ключ берётся из data-k, если он есть. Иначе значок раскрытия
  // строки попадает в начало innerText, и раскрытая строка уезжает в конец
  // алфавита.
  const txt = r => { const c = r.cells[col];
    return !c ? '' : (c.dataset.k !== undefined ? c.dataset.k : c.innerText); };
  const numeric = rows.every(r => val(r) !== null);
  rows.sort((a, b) => numeric
    ? (val(a) - val(b)) * dir
    : txt(a).localeCompare(txt(b), 'ru') * dir);
  for (const r of rows) { tb.append(r); const d = det.get(r); if (d) tb.append(d); }
});
document.addEventListener('mouseover', e => {
  const th = e.target.closest('thead th');
  if (th && !th.style.cursor) { th.style.cursor = 'pointer'; th.title = 'Клик - сортировка'; }
});
</script>
