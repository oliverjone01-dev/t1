<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Диалоги по сделкам</title>
<style>
:root{--bg:#0E141A;--card:#141C24;--card2:#0F171E;--border:#243039;--border-soft:#1B242C;--ink:#E7EEF4;--ink-2:#B7C4CE;--ink-3:#8A99A6;--ink-4:#5D6B77;--acc:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
.h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--ink-3);font-size:12px;margin-top:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.bar label{color:var(--ink-3);font-size:11px;margin-right:4px}
select,input{background:var(--card2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none}
input#q{min-width:220px}
#fMode{border-color:#1f6b7d}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--ink-2);font-size:11.5px;cursor:pointer;user-select:none}
.chip.on{background:#12303a;border-color:#1f6b7d;color:#bfeff8}
.cnt{color:var(--ink-4);font-size:11px}
.deal{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.dhead:hover{background:rgba(34,211,238,.04)}
.arw{color:var(--ink-4);width:12px;flex:0 0 12px;font-size:11px}
.did{font-weight:800;flex:0 0 auto}
.link2{color:var(--ink-4);font-weight:600;font-size:11px}
.dttl{color:var(--ink);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmgr{color:var(--ink-2);flex:0 0 auto;white-space:nowrap;font-size:12px}
.dchips{display:flex;gap:4px;flex:0 0 auto}
.dchips i{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.dchips b{width:8px;height:8px;border-radius:2px;display:inline-block}
.dmeta{color:var(--ink-4);font-size:11px;flex:0 0 auto;white-space:nowrap}
.thread{border-top:1px solid var(--border-soft);padding:4px 0;background:var(--card2)}
.ev{display:grid;grid-template-columns:110px 60px 128px 22px 140px 1fr 190px;gap:9px;padding:7px 14px;border-bottom:1px solid var(--border-soft);align-items:start}
.ev:last-child{border-bottom:none}
.ev .t{color:var(--ink-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stg{font-size:9.5px;padding:1px 5px;border-radius:4px;white-space:nowrap}
.stg-lead{background:#3a2a12;color:#d6a45f}.stg-deal{background:#12303a;color:#7fd7e6}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.dir-in{color:#69C7DA}.dir-out{color:#7FD1A6}.dir-n{color:var(--ink-4)}
.who-cli{color:#E8A33D;font-weight:600}
.who-mgr{color:#22d3ee}
.whosub{display:block;color:var(--ink-4);font-size:10px;font-weight:400}
.who{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.body .st{color:var(--ink-4);font-size:10.5px;margin-left:6px}
.body a.rec{margin-left:8px;font-size:11px}
.ev-bad{background:#C2525209;border-left:2px solid #C2525288}
.ev-good{background:#2E9E7407;border-left:2px solid #2E9E7455}
.evtags{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.evtag{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1.5}
.hlq{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 14px;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line)}
.part{padding:1px 7px;border:1px solid var(--line);border-radius:5px;color:var(--ink-2)}
.part b{color:var(--ink);font-weight:600}
.body .ref{display:block;margin-top:2px;color:#C2569B;font-size:10.5px}
.empty{padding:40px;text-align:center;color:var(--ink-4)}
.foot{color:var(--ink-4);font-size:11px;margin-top:10px}

/* рейтинг менеджеров и скоринг сделок */

.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{background:#0000000d;color:var(--ink-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#ffffff06}
.tbl .who2{font-weight:600;font-size:12.5px}
.cellv{display:inline-flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;min-width:52px;padding:2px 4px;border-radius:5px}
.cellv:hover{background:#ffffff10;outline:1px solid var(--line)}
.cellv b{font-weight:600;font-size:12px}
.pbar{display:block;width:46px;height:3px;border-radius:2px;background:#ffffff18;overflow:hidden}
.pbar i{display:block;height:100%}
.rt{font-weight:700;font-size:15px}
.rtst{color:#E8A33D;font-size:10px;letter-spacing:.5px;display:block}
.na2{color:var(--ink-4);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile.on{border-color:var(--acc);background:#22d3ee0f}
.tile .tl{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.tile .tn{font-size:20px;font-weight:700;line-height:1.2}
.tile .tm{color:var(--ink-4);font-size:10.5px}
.qrow{cursor:pointer}
.qrow:hover td{background:#ffffff08}
.qrow td{vertical-align:middle}
.pri{font-weight:700;font-size:12px;white-space:nowrap}
.kind{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap}
.k-deal{color:#22d3ee;border-color:#22d3ee55;background:#22d3ee12}
.k-lead{color:#C2873C;border-color:#C2873C55;background:#C2873C12}
.urg{font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.qexp>td{padding:0 10px 10px 10px;background:#ffffff05}
.qnext{color:var(--ink-2);font-size:11.5px;margin:6px 0 8px 0;line-height:1.5}
.qnext b{color:var(--ink-3)}
.qm{display:inline-block;margin-left:3px;font-size:9px;color:var(--ink-4);border:1px solid var(--line);border-radius:50%;width:11px;height:11px;line-height:11px;text-align:center;cursor:help;vertical-align:top}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:11.5px}
.lgh{padding:8px 12px;cursor:pointer;color:var(--ink-2)}
.lgh i{font-style:normal;color:var(--ink-4);margin-right:5px}
.lgb{padding:0 12px 10px 12px}
.lgi{color:var(--ink-2);margin-bottom:5px;line-height:1.5}
.lgi b{color:var(--ink)}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--acc)}
.sarr{font-size:9px;color:var(--acc)}
.fbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11.5px;color:var(--ink-3)}
.fbar select{background:#0f1720;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px}
.vbadge{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;border:1px solid}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px 34px}
.swcol{}
.swh{font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.swh-g{color:#2E9E74}.swh-b{color:#C25252}
.swi{color:var(--ink-2);font-size:11.5px;line-height:1.6}
.swd{color:var(--ink-4);font-size:10px;margin-left:6px}
.swnone{color:var(--ink-4);font-style:italic}
.fixh{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 6px 0}
.fix{background:#ffffff05;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.fixt{font-size:12px}
.fixn{color:var(--ink-3);font-size:11px;margin-left:6px}
.fixw{color:var(--ink-3);font-size:11px;margin:2px 0 6px 0}
.fixids{display:flex;flex-wrap:wrap;gap:5px}
.fixid{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;cursor:pointer;color:var(--ink-2)}
.fixid:hover{border-color:var(--acc);color:var(--acc)}
.mnode{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.mnode.on{border-color:var(--acc)}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.mhead:hover{background:#ffffff08}
.mname{font-weight:600;font-size:13px;min-width:150px}
.mmeta{color:var(--ink-3);font-size:11.5px}
.mwhy{color:var(--ink-4);font-size:11px;margin-left:auto}
.mbody{border-top:1px solid var(--line);padding:4px 8px 8px 20px}
.dnode{border-bottom:1px solid #ffffff08}
.dnode:last-child{border-bottom:none}
.dnode.on{background:#22d3ee08;border-radius:8px}
.dhead2{display:grid;grid-template-columns:16px 78px 52px 54px 1fr 150px 44px auto;gap:8px;align-items:center;padding:7px 6px;cursor:pointer;font-size:11.5px}
.dhead2:hover{background:#ffffff08}
.dsum{font-weight:700}
.did2{color:var(--ink-4);font-size:10.5px}
.dttl2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dstage{color:var(--ink-3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dprob{font-weight:600;text-align:right}
.dbody{padding:2px 4px 10px 16px;border-left:2px solid var(--line);margin:0 0 8px 8px}
.whyb{color:var(--ink-3);font-size:11px;margin:4px 0 8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wchip{border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.node{margin:8px 0 12px 0}
.nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 0 5px 2px;border-bottom:1px solid var(--line)}
.nhead b{font-size:11.5px;letter-spacing:.02em}
.nhead a{color:inherit}
.ndot{width:8px;height:8px;border-radius:50%;display:inline-block}
.n-lead{background:#C2873C}.n-deal{background:#22d3ee}
.nsub{color:var(--ink-4);font-size:10.5px}
.nbody{border-left:1px solid var(--line);margin-left:3px}
.erow{display:grid;grid-template-columns:74px 132px 1fr 190px;gap:8px;padding:5px 8px;border-bottom:1px solid #ffffff08;align-items:start;font-size:11.5px}
.erow:last-child{border-bottom:none}
.lv-in{}
.lv-out{background:#ffffff04}
.lv-task{opacity:.8}
.e-bad{box-shadow:inset 2px 0 0 #C25252}
.e-good{box-shadow:inset 2px 0 0 #2E9E74}
.etime{color:var(--ink-3);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ewho{font-size:11px;overflow:hidden;text-overflow:ellipsis}
.ebody{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.sysw{color:var(--ink-4);font-size:10.5px}
.arw3{color:var(--ink-4);margin-right:6px;font-size:10px}
.qbar{display:flex;justify-content:space-between;align-items:center;padding:7px 2px 4px 2px;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line);margin-bottom:6px}
.qclose{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:2px 9px;color:var(--ink-3);font-size:11px;margin-left:10px;white-space:nowrap}
.qclose:hover{border-color:var(--acc);color:var(--acc)}
.qrow.open td{background:#22d3ee0c}
.mrow{cursor:pointer}
.mrow.open td{background:#ffffff0a}
.arw2{color:var(--ink-4);margin-right:6px;font-size:10px}
.mexp>td{padding:0 8px 10px 8px;background:#ffffff05}
.expcap{color:var(--ink-3);font-size:11px;margin:6px 0}
.tagbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.tagsec{margin-bottom:7px}
.tagsec .sl{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.tgc{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid;margin:0 5px 5px 0;cursor:pointer}
.tgc:hover{filter:brightness(1.25)}
.tgc.on{outline:2px solid var(--acc)}
.tgc .n{opacity:.7;font-size:10px}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.crumb .x{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:1px 8px;color:var(--ink-3)}
.crumb .x:hover{border-color:var(--acc);color:var(--acc)}
.sc{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 10px 8px 28px;border-top:1px dashed var(--line)}
.pb{font-weight:700;font-size:12.5px;padding:1px 7px;border-radius:5px}
.tg{font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid}
.tg-good{color:#2E9E74;border-color:#2E9E7455;background:#2E9E7415}
.tg-bad{color:#C25252;border-color:#C2525255;background:#C2525215}
.tg-warn{color:#C2873C;border-color:#C2873C55;background:#C2873C15}
.nxt{flex-basis:100%;color:var(--ink-2);font-size:11.5px;margin-top:3px}
.nxt b{color:var(--ink-3);font-weight:600}
.why{flex-basis:100%;color:var(--ink-4);font-size:10.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="h1">GENGLASS · Диалоги</div>
  <div class="sub" id="sub">загрузка…</div>

  <div class="bar">
    <span><label>Смотрим</label><select id="fMode"><option value="tree">менеджеры → сделки → диалог</option><option value="queue">очередь дел</option><option value="mgr">рейтинг (таблица)</option><option value="deal">все сделки</option><option value="lead">все лиды</option></select></span>
    <span><label>Менеджер</label><select id="fMgr"></select></span>
    <span><label>Направление</label><select id="fDir"><option value="">все</option><option value="входящее">входящие</option><option value="исходящее">исходящие</option></select></span>
    <span><label>ID</label><input id="fDeal" placeholder="сделка/лид" style="width:96px"></span>
    <input id="q" placeholder="поиск по тексту / кто / тема">
    <span><label>Порядок</label><select id="fOrd"><option value="desc">свежие сверху</option><option value="asc">старые сверху</option></select></span>
    <span class="chip" id="expAll">развернуть видимые</span>
  </div>
  <div class="cnt" id="typeChips" style="margin-bottom:8px"></div>
  <div class="cnt" id="stat" style="margin-bottom:10px"></div>

  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = __DIALOG_DATA__;
const BAKED_AT = "__BAKED_AT__";
const PORTAL = DATA.portal || "https://glassmemory.bitrix24.ru";
const DEAL_LIMIT = 400;

const TCOL = {'Звонок':'#3DAEC2','Резюме BitrixGPT':'#C2569B','Письмо':'#C2873C','Дело':'#8B7BF0','Задача':'#8B7BF0','Мессенджер ОЛ':'#2E9E74','Комментарий-заметка':'#8794A5','Активность':'#5D6B77'};
const typeColor = t => t && t.indexOf('Сообщение')===0 ? '#2E9E74' : (TCOL[t]||'#5D6B77');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const fmtTime = iso => { const d=new Date(iso); if(isNaN(d)) return ''; return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };
const fmtDay = ts => { const d=new Date(ts); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };

const S = { mode:'tree', sortK:'prio', sortDir:-1, fStage:'', fKind:'', fMin:0, sec:'', tag:'', exp:null, q4:'', tm:'', td:'', mgr:'', dir:'', id:'', q:'', ord:'desc', types:new Set() };
let VIEW = [];

function initControls(){
  const mgr = document.getElementById('fMgr');
  mgr.innerHTML = '<option value="">все менеджеры</option>' + (DATA.managers||[]).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  const chips = document.getElementById('typeChips');
  const order = Object.keys(DATA.counts||{}).sort((a,b)=>DATA.counts[b]-DATA.counts[a]);
  chips.innerHTML = order.map(t=>`<span class="chip" data-t="${esc(t)}"><i style="width:8px;height:8px;border-radius:2px;background:${typeColor(t)};display:inline-block"></i>${esc(t)} <span class="cnt">${DATA.counts[t]}</span></span>`).join('');
  chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ const t=ch.dataset.t; if(S.types.has(t)){S.types.delete(t);ch.classList.remove('on');}else{S.types.add(t);ch.classList.add('on');} render(); });
  document.getElementById('fMode').onchange=e=>{S.mode=e.target.value;render();};
  mgr.onchange=()=>{S.mgr=mgr.value;render();};
  document.getElementById('fDir').onchange=e=>{S.dir=e.target.value;render();};
  document.getElementById('fDeal').oninput=e=>{S.id=e.target.value.trim();render();};
  document.getElementById('fOrd').onchange=e=>{S.ord=e.target.value;render();};
  let qt; document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();render();},180);};
  document.getElementById('expAll').onclick=()=>{ document.querySelectorAll('.deal').forEach(d=>toggle(d,true)); };
  document.getElementById('sub').textContent =
    `${DATA.from?DATA.from.slice(0,10):''} → ${DATA.to?DATA.to.slice(0,10):''} · ${DATA.days} дн · ${DATA.scope||''} · сделок ${DATA.dealCount||0} + лидов ${DATA.leadCount||0} · снимок ${BAKED_AT?BAKED_AT.slice(0,16).replace('T',' '):''}`;
}

function matchEvent(e){
  if(S.dir && e.dir!==S.dir) return false;
  if(S.types.size && !S.types.has(e.type)) return false;
  if(S.q){ const q=S.q; if(!((e.body&&e.body.toLowerCase().indexOf(q)>=0)||(e.who&&e.who.toLowerCase().indexOf(q)>=0)||(e.title&&e.title.toLowerCase().indexOf(q)>=0)||(e.leadT&&e.leadT.toLowerCase().indexOf(q)>=0)||(e.dealT&&e.dealT.toLowerCase().indexOf(q)>=0))) return false; }
  return true;
}
// якорь группировки по режиму: по сделкам -> сделка (лид сливается), по лидам -> лид (сделка сливается)
function anchor(e){
  if(S.mode==='deal') return e.dealId ? {ent:'deal',aid:e.dealId,title:e.dealT,other:e.leadId} : {ent:'lead',aid:e.leadId,title:e.leadT,other:''};
  return e.leadId ? {ent:'lead',aid:e.leadId,title:e.leadT,other:e.dealId} : {ent:'deal',aid:e.dealId,title:e.dealT,other:''};
}
function dealScore(ent,aid,other){ return (SC? (SCD[(ent==='deal'?'D':'L')+aid] || SCD['D'+(other||'')]) : null) || null; }
function passScoreFilter(ent,aid,other){
  if(!S.sec && !S.tag) return true;
  const d = dealScore(ent,aid,other); if(!d) return false;
  if(S.sec) return d.tags.some(t=>t.sec===S.sec && t.tone==='bad');
  const norm = t => t.split(' · ')[0].replace(/[0-9]+/g,'N');
  return d.tags.some(t=>norm(t.t)===S.tag);
}
function group(){
  const map = new Map();
  for(const e of DATA.events){

      const evs=DATA.events.filter(e=>(e.dealId?'D'+e.dealId:'L'+e.leadId)===S.td).sort((a,b)=>a.ts-b.ts);

        +(d.whyProb&&d.whyProb.length?`<div class="whyb">Почему шанс ${d.prob}%: базовая по стадии ${d.base}% `+d.whyProb.map(w=>`<span class="wchip" style="color:${w.bad?'#C25252':'#2E9E74'}">${w.pp>0?'+':''}${w.pp} п.п. ${esc(w.label)}</span>`).join('')+`</div>`:'')
        +treeHTML(evs,d);
    }
  }
  const hot=SC.deals.filter(d=>d.urgency);
  const money2=hot.reduce((s2,d)=>s2+(d.budget||0),0);
  document.getElementById('stat').textContent=`в разборе: ${withP.filter(m=>m.profile.verdict==='в разборе').length} · норма: ${withP.filter(m=>m.profile.verdict==='норма').length} · сильных: ${withP.filter(m=>m.profile.verdict==='сильный').length} · требуют действия ${hot.length} сделок на ${money(money2)} ₽`;
  document.getElementById('foot').textContent=`Клик 1 - менеджер: видно сильные и слабые стороны против отдела. Клик 2 - что чинить: списки сделок под каждую слабость. Клик 3 - сделка: почему шанс такой и вся переписка с разметкой.`;
}
function renderQueue(){
  const list=document.getElementById('list');
  if(!SC){ list.innerHTML='<div class="empty">разбор не посчитан</div>'; return; }
  const tiles = SC.queues.map(q=>`<div class="tile${S.q4===q.key?' on':''}" data-q="${q.key}" title="${esc(q.hint)}">
      <div class="tl">${esc(q.label)}</div><div class="tn" style="color:${urgCol(q.key)}">${q.n}</div>
      <div class="tm">${money(q.money)} ₽ в работе</div></div>`).join('');
  let rows = SC.deals.filter(d=>d.urgency);
  if(S.q4) rows = rows.filter(d=>d.uKey===S.q4);
  if(S.mgr) rows = rows.filter(d=>d.mgr===S.mgr);
  if(S.fStage) rows = rows.filter(d=>(d.stage||'-')===S.fStage);
  if(S.fKind) rows = rows.filter(d=>S.fKind==='lead'? d.isLead : !d.isLead);
  if(S.fMin) rows = rows.filter(d=>(d.budget||0)>=S.fMin);
  if(S.q){ const q=S.q; rows = rows.filter(d=>(d.title||'').toLowerCase().indexOf(q)>=0 || String(d.dealId||d.leadId).indexOf(q)>=0); }
  const val = (d,k) => k==='prio'?(d.budget||0) : k==='prob'?d.prob : k==='mgr'?d.mgr : k==='stage'?(d.stage||'') : k==='urg'?d.urgency : k==='kind'?(d.isLead?1:0) : (d.title||'');
  rows.sort((a,b)=>{ const x=val(a,S.sortK), y=val(b,S.sortK);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*S.sortDir;
    return String(x).localeCompare(String(y))*S.sortDir; });
  const SORTS=[['prio','Под риском',''],['kind','',''],['title','Сделка','l'],['mgr','Менеджер','l'],['stage','Стадия','l'],['prob','Шанс',''],['urg','Что горит','l']];
  const arrow = k => S.sortK===k ? (S.sortDir<0?' ▼':' ▲') : '';
  const head = `<tr>`+SORTS.map(([k,lbl,cls])=>`<th class="${cls} sortable" data-k="${k}">${esc(lbl)}<span class="sarr">${arrow(k)}</span></th>`).join('')+`</tr>`;
  const body = rows.slice(0,200).map(d=>{
    const open = S.exp && S.exp.key===d.key;
    const url = d.dealId ? `${PORTAL}/crm/deal/details/${d.dealId}/` : `${PORTAL}/crm/lead/details/${d.leadId}/`;
    const c = urgCol(d.uKey), pc = probColor(d.prob);
    const r = `<tr class="qrow${open?' open':''}" data-key="${esc(d.key)}">
      <td class="pri"><span class="arw3">${open?'▾':'▸'}</span>${money(d.budget)} ₽</td>
      <td><span class="kind ${d.isLead?'k-lead':'k-deal'}">${d.isLead?'лид':'сделка'}</span></td>
      <td class="l"><a href="${url}" target="_blank" onclick="event.stopPropagation()" style="color:var(--ink-4);font-size:11px">${esc(d.dealId||d.leadId)}</a>
        <span style="margin-left:6px">${esc(d.title.slice(0,46))}</span></td>
      <td class="l">${esc(d.mgr)}</td>
      <td class="l" style="color:var(--ink-3);font-size:11px">${esc(d.stage||'-')}</td>
      <td style="color:${pc};font-weight:600">${d.prob}%</td>
      <td class="l"><span class="urg" style="color:${c};background:${c}18;border:1px solid ${c}44">${esc(d.urgency)}</span></td></tr>`;
    return r + (open ? `<tr class="qexp"><td colspan="7">
      <div class="qbar"><span>Разбор сделки ${esc(d.dealId||d.leadId)}</span><span class="qclose" data-close="1">свернуть ✕</span></div>
      <div class="qnext"><b>Что сделать:</b> ${esc(d.next)}</div><div id="qexp-body"></div></td></tr>` : '');
  }).join('');
  const stages=[...new Set(SC.deals.filter(d=>d.urgency).map(d=>d.stage||'-'))].sort();
  const fbar = `<div class="fbar">
    <span>Стадия <select id="qStage"><option value="">все</option>${stages.map(x=>`<option value="${esc(x)}"${S.fStage===x?' selected':''}>${esc(x)}</option>`).join('')}</select></span>
    <span>Тип <select id="qKind"><option value="">все</option><option value="deal"${S.fKind==='deal'?' selected':''}>сделки</option><option value="lead"${S.fKind==='lead'?' selected':''}>лиды</option></select></span>
    <span>Сумма от <select id="qMin"><option value="0">любая</option><option value="100000"${S.fMin==100000?' selected':''}>100к</option><option value="500000"${S.fMin==500000?' selected':''}>500к</option><option value="1000000"${S.fMin==1000000?' selected':''}>1 млн</option></select></span>
    ${(S.q4||S.fStage||S.fKind||S.fMin||S.mgr)?`<span class="qclose" id="qReset">сбросить фильтры ✕</span>`:''}
  </div>`;
  list.innerHTML = `<div class="tiles">${tiles}</div>` + fbar +
    (rows.length ? `<table class="tbl">${head}${body}</table>` : '<div class="empty">в этой очереди пусто</div>');
  list.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(S.sortK===k) S.sortDir=-S.sortDir; else { S.sortK=k; S.sortDir=(k==='prio'||k==='prob')?-1:1; }
    S.exp=null; renderQueue(); });
  const qs=document.getElementById('qStage'); if(qs) qs.onchange=()=>{ S.fStage=qs.value; S.exp=null; renderQueue(); };
  const qk=document.getElementById('qKind'); if(qk) qk.onchange=()=>{ S.fKind=qk.value; S.exp=null; renderQueue(); };
  const qm=document.getElementById('qMin'); if(qm) qm.onchange=()=>{ S.fMin=+qm.value; S.exp=null; renderQueue(); };
  const qr=document.getElementById('qReset'); if(qr) qr.onclick=()=>{ S.q4=''; S.fStage=''; S.fKind=''; S.fMin=0; S.mgr=''; document.getElementById('fMgr').value=''; S.exp=null; renderQueue(); };
  list.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ S.q4 = S.q4===t.dataset.q ? '' : t.dataset.q; S.exp=null; renderQueue(); });
  list.querySelectorAll('.qrow').forEach(r=>r.onclick=()=>{
    S.exp = (S.exp && S.exp.key===r.dataset.key) ? null : {key:r.dataset.key}; renderQueue(); });
  list.querySelectorAll('.qclose').forEach(b=>b.onclick=e=>{ e.stopPropagation(); S.exp=null; renderQueue(); });
  if(S.exp){
    const host=document.getElementById('qexp-body');
    if(host){
      const d=SCD[S.exp.key];
      const map=new Map();
      for(const e of DATA.events){
        const k=e.dealId?'D'+e.dealId:'L'+e.leadId; if(k!==S.exp.key) continue;
        const a=anchor(e); if(!a.aid) continue;
        const kk=a.ent+':'+a.aid; let g=map.get(kk);
        if(!g){ g={ent:a.ent,aid:a.aid,title:a.title,other:a.other,events:[],chans:{},stages:{},last:0,mgr:e.mgr}; map.set(kk,g); }
        g.events.push(e); if(e.ts>g.last)g.last=e.ts; g.chans[e.type]=(g.chans[e.type]||0)+1; g.stages[e.stage]=1;
      }
      VIEW=[...map.values()]; VIEW.forEach(g=>g.events.sort((a,b)=>a.ts-b.ts));
      const all=VIEW.flatMap(g=>g.events).sort((a,b)=>a.ts-b.ts);
      host.innerHTML = treeHTML(all, d);
    }
  }
  const totMoney = rows.reduce((s2,d)=>s2+(d.budget||0),0);
  document.getElementById('stat').textContent = `в очереди: ${rows.length} (сделок ${rows.filter(d=>!d.isLead).length}, лидов ${rows.filter(d=>d.isLead).length}) · сумма ${money(totMoney)} ₽ · сортировка: ${({prio:'сумма',prob:'шанс',mgr:'менеджер',stage:'стадия',urg:'что горит',title:'название',kind:'тип'})[S.sortK]||S.sortK} ${S.sortDir<0?'по убыванию':'по возрастанию'}${S.q4?' · '+(SC.queues.find(q=>q.key===S.q4)||{}).label:''}`;
  document.getElementById('foot').textContent = `Очередь дел: что требует действия прямо сейчас. Плитка сверху - фильтр по причине. Клик по строке раскрывает переписку и рекомендацию. «Под риском» - сумма сделки; сортировка учитывает сумму, шанс закрыть и срочность причины.`;
}
function renderManagers(){
  const list=document.getElementById('list');
  if(!SC){ list.innerHTML='<div class="empty">разбор не посчитан</div>'; return; }
  const head = `<tr><th class="l">Менеджер</th><th title="${esc(COLHELP.deals[1])}">Диалогов<span class="qm">?</span></th>` +
    SC.sections.map(s=>`<th title="${esc((SECHELP[s.key]||['',''])[1])}">${esc(s.label)}<span class="qm">?</span><div style="font-weight:400;opacity:.6;text-transform:none">вес ${Math.round(s.weight*100)}%</div></th>`).join('') +
    `<th title="${esc(COLHELP.prob[1])}">Вероятность<span class="qm">?</span></th>
     <th title="${esc(COLHELP.alerts[1])}">Тревог<span class="qm">?</span></th>
     <th title="${esc(COLHELP.rating[1])}">Рейтинг<span class="qm">?</span></th></tr>`;
  const rows = SC.managers.map(m=>{
    const secs = SC.sections.map(s=> cellHTML(m, m.sections.find(x=>x.key===s.key))).join('');
    const rt = m.rating!==null
      ? `<span class="rt" style="color:${pctCol(m.rating*20)}">${m.rating.toFixed(1)}</span><span class="rtst">${stars(m.rating)}</span>`
      : `<span class="na2">${esc(m.noRating)}</span>`;
    const open = S.exp && S.exp.mgr===m.mgr;
    const row = `<tr class="mrow${open?' open':''}" data-mgr="${esc(m.mgr)}">
      <td class="l"><span class="arw2">${open?'▾':'▸'}</span><span class="who2">${esc(m.mgr)}</span>${open?'<span class="qclose mclose">свернуть ✕</span>':''}</td><td>${m.deals}</td>${secs}
      <td>${m.probAvg}%</td><td style="color:${m.alerts?'#C25252':'var(--ink-3)'}">${m.alerts}</td><td>${rt}</td></tr>`;
    return row + (open ? `<tr class="mexp"><td colspan="${SC.sections.length+5}"><div id="exp-${esc(m.mgr).replace(/[^a-zA-Zа-яА-Я0-9]/g,'_')}"></div></td></tr>` : '');
  }).join('');
  const bySec={}; for(const [t,v] of Object.entries(SC.tagIndex)) (bySec[v.sec] ||= []).push([t,v]);
  const tagbox = SC.sections.map(s=>{
    const arr=(bySec[s.key]||[]).sort((a,b)=>b[1].n-a[1].n);
    if(!arr.length) return '';
    return `<div class="tagsec"><div class="sl">${esc(s.label)}</div>` + arr.map(([t,v])=>{
      const c=tone2col(v.tone);
      return `<span class="tgc${S.tag===t?' on':''}" data-tag="${esc(t)}" style="color:${c};border-color:${c}55;background:${c}12">${esc(t)}<span class="n">${v.n}</span></span>`;
    }).join('') + `</div>`;
  }).join('');
  const legend = `<div class="legend">
    <div class="lgh" onclick="var b=this.nextElementSibling;b.style.display=b.style.display==='none'?'':'none';this.querySelector('i').textContent=b.style.display==='none'?'▸':'▾';">
      <i>▸</i> Как читать таблицу</div>
    <div class="lgb" style="display:none">
      <div class="lgi"><b>Проценты в разделах</b> - доля диалогов, где раздел отработан без дефекта. 71% в «Отклике» значит: в 71% диалогов отвечали в норматив, в 29% нет. Чем выше, тем лучше.</div>
      <div class="lgi"><b>«нет данных»</b> - раздел встретился меньше чем в 5 сделках. Процент по двум диалогам это не оценка человека, поэтому не показываем.</div>
      ${SC.sections.map(s=>`<div class="lgi"><b>${esc((SECHELP[s.key]||[s.label])[0])}</b> (вес ${Math.round(s.weight*100)}%) - ${esc((SECHELP[s.key]||['',''])[1])}</div>`).join('')}
      <div class="lgi"><b>${esc(COLHELP.prob[0])}</b> - ${esc(COLHELP.prob[1])}</div>
      <div class="lgi"><b>${esc(COLHELP.alerts[0])}</b> - ${esc(COLHELP.alerts[1])}</div>
      <div class="lgi"><b>${esc(COLHELP.rating[0])}</b> - ${esc(COLHELP.rating[1])}</div>
      <div class="lgi" style="color:var(--ink-4)">Клик по строке раскрывает диалоги менеджера, клик по ячейке раздела - только его проблемные сделки, клик по тегу внизу - все сделки с этим тегом.</div>
    </div></div>`;
  list.innerHTML = legend + `<table class="tbl">${head}${rows}</table>
    <div class="tagbox"><div style="color:var(--ink-3);font-size:11px;margin-bottom:7px">Теги по разделам регламента · клик открывает сделки с этим тегом</div>${tagbox}<div id="exp-tag"></div></div>`;
  // Раскрытие прямо в таблице: строка менеджера разворачивается под собой, без ухода на другой экран.
  list.querySelectorAll('.cellv').forEach(c=>c.onclick=ev=>{ ev.stopPropagation();
    const same = S.exp && S.exp.mgr===c.dataset.mgr && S.exp.sec===c.dataset.sec;
    S.exp = same ? null : {mgr:c.dataset.mgr, sec:c.dataset.sec, tag:''}; renderManagers(); });
  list.querySelectorAll('.mclose').forEach(b=>b.onclick=e=>{ e.stopPropagation(); S.exp=null; renderManagers(); });
  list.querySelectorAll('.mrow').forEach(r=>r.onclick=()=>{
    const same = S.exp && S.exp.mgr===r.dataset.mgr && !S.exp.sec;
    S.exp = same ? null : {mgr:r.dataset.mgr, sec:'', tag:''}; renderManagers(); });
  list.querySelectorAll('.tgc').forEach(c=>c.onclick=()=>{
    const same = S.exp && S.exp.tag===c.dataset.tag;
    S.exp = same ? null : {mgr:'', sec:'', tag:c.dataset.tag}; renderManagers(); });
  const tr=SC.trend||[]; const cur=tr[tr.length-1], prev=tr.length>1?tr[tr.length-2]:null;
  if(cur){
    const dlt=(a,b,inv)=>{ if(b===null||b===undefined||a===null) return ''; const d=a-b; if(!d) return ' <span style="color:var(--ink-4)">=</span>';
      const good=inv? d<0 : d>0; return ` <span style="color:${good?'#2E9E74':'#C25252'}">${d>0?'+':''}${Math.round(d*100)/100}</span>`; };
    const t=document.createElement('div'); t.className='tagbox'; t.style.marginTop='0'; t.style.marginBottom='10px';
    t.innerHTML=`<div style="color:var(--ink-3);font-size:11px;margin-bottom:5px">Динамика отдела${prev?` (к ${prev.day.slice(5)})`:' (первый срез)'}</div>
      <span class="tgc" style="cursor:default">средний рейтинг <b>${cur.ratingAvg??'-'}</b>${prev?dlt(cur.ratingAvg,prev.ratingAvg,false):''}</span>
      <span class="tgc" style="cursor:default">мяч у нас <b>${cur.ballOurs}</b>${prev?dlt(cur.ballOurs,prev.ballOurs,true):''}</span>
      <span class="tgc" style="cursor:default">без следующего шага <b>${cur.noNextStep}</b>${prev?dlt(cur.noNextStep,prev.noNextStep,true):''}</span>
      <span class="tgc" style="cursor:default">тишина 4+ дн <b>${cur.silence}</b>${prev?dlt(cur.silence,prev.silence,true):''}</span>
      <span class="tgc" style="cursor:default">медиана ответа <b>${cur.respMed??'-'} мин</b>${prev?dlt(cur.respMed,prev.respMed,true):''}</span>`;
    list.prepend(t);
  }
  fillExpanded();
  const hid=SC.hiddenMgr||[];
  if(hid.length){
    const h=document.createElement('div'); h.style.cssText='color:var(--ink-4);font-size:10.5px;margin-top:6px';
    h.textContent='Не в таблице: '+hid.map(x=>`${x.mgr} (${x.deals}, ${x.why})`).join(' · ');
    list.appendChild(h);
  }
  const rated=SC.managers.filter(m=>m.rating!==null).length;
  document.getElementById('stat').textContent = `менеджеров с рейтингом: ${rated} · разбор ИИ: ${SC.aiReviews? SC.aiReviews+' сделок':'слой выключен (нет ключа)'} · калибровка ${SC.calibratedAt}`;
  document.getElementById('foot').textContent = `Рейтинг - взвешенная доля сделок без дефекта по разделам регламента (отклик 22%, сроки 20%, ведение 20%, квалификация 18%, вежливость 10%, результат 10%). Раздел не оценивается, если затронут меньше чем в 5 сделках; менеджер - меньше чем в ${SC.minSample} диалогах. Пороги - гипотеза, калибруются по факту.`;
}
function scoreHTML(g){
  if(!SC) return '';
  const d = SCD[(g.ent==='deal'?'D':'L')+g.aid] || SCD['D'+(g.other||'')] || null;
  if(!d) return '';
  const c=probColor(d.prob);
  const tags = d.tags.map(t=>`<span class="tg tg-${t.tone}">${esc(t.t)}</span>`).join('');
  const why = d.factors.length ? `базовая по стадии ${d.base}%${d.stage?' («'+esc(d.stage)+'»)':''} × ` + d.factors.map(f=>`${esc(f.label)} ${f.mult}`).join(' × ') : `базовая по стадии ${d.base}%`;
  return `<div class="sc">
    <span class="pb" style="background:${c}22;color:${c};border:1px solid ${c}55">${d.prob}% успех</span>
    ${tags}
    <div class="nxt"><b>Следующий шаг:</b> ${esc(d.next)}</div>
    <div class="why">${esc(why)}</div>
  </div>`;
}
function backToTable(){ S.mode='mgr'; S.mgr=''; S.sec=''; S.tag=''; document.getElementById('fMgr').value=''; document.getElementById('fMode').value='mgr'; render(); }
function clearScoreFilter(){ S.sec=''; S.tag=''; render(); }
function render(){
  if(S.mode==='tree'){ VIEW=[]; renderTree(); return; }
  if(S.mode==='queue'){ VIEW=[]; renderQueue(); return; }
  if(S.mode==='mgr'){ VIEW=[]; renderManagers(); return; }
  VIEW = group();
  const show = VIEW.slice(0, DEAL_LIMIT);
  const list=document.getElementById('list');
  const secL = S.sec && SC ? (SC.sections.find(x=>x.key===S.sec)||{}).label : '';
  const crumb = (S.mgr||S.sec||S.tag) ? `<div class="crumb">
      <span class="x" onclick="backToTable()">← к таблице</span>
      ${S.mgr?`<span>Менеджер: <b>${esc(S.mgr)}</b></span>`:''}
      ${secL?`<span>· дефекты раздела: <b>${esc(secL)}</b></span>`:''}
      ${S.tag?`<span>· тег: <b>${esc(S.tag)}</b></span>`:''}
      <span class="x" onclick="clearScoreFilter()">сбросить фильтр</span></div>` : '';
  list.innerHTML = crumb + (show.length ? show.map((g,i)=>dealHTML(g,i)).join('') : `<div class="empty">по этому фильтру диалогов нет</div>`);
  list.querySelectorAll('.deal').forEach(d=>d.querySelector('.dhead').onclick=()=>toggle(d));
  const totEv = VIEW.reduce((s,g)=>s+g.events.length,0);
  const unit = S.mode==='deal' ? 'сделок/лидов' : 'лидов/сделок';
  document.getElementById('stat').textContent = `${unit}: ${VIEW.length}${VIEW.length>DEAL_LIMIT?` (показаны первые ${DEAL_LIMIT}, сузьте фильтр)`:''} · событий: ${totEv}`;
  document.getElementById('foot').textContent = `Снимок: ${DATA.events.length} событий. «Смотрим по сделкам» - лид сливается в свою сделку; «по лидам» - сделка сливается в лид. Метка «лид»/«сделка» у события - где в пути оно произошло. Клик по ID - карточка в Bitrix24.`;
}
initControls(); render();
</script>
