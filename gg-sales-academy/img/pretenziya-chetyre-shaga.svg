<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img"
     aria-label="Четыре узла цепочки, порядок задан жёстко, обход перекрыт">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#233242" stroke-width="1" opacity=".1"/>
    </pattern>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#22D3EE" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#06121a"/>
  <rect width="1600" height="640" fill="url(#g)"/>

  <!-- ход по порядку: три стрелки между четырьмя узлами -->
  <g fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" marker-end="url(#a)">
    <path d="M424 320H516"/><path d="M744 320H836"/><path d="M1064 320H1156"/>
  </g>

  <!-- обход второго шага: пунктир, перекрытый поперечной планкой -->
  <path d="M320 388C560 512 800 512 1040 388" fill="none" stroke="#E05A50" stroke-width="3"
        stroke-dasharray="12 10" stroke-linecap="round" opacity=".55"/>
  <path d="M636 452L724 452" stroke="#E05A50" stroke-width="7" stroke-linecap="round"/>

  <!-- четыре шага. Цвет закреплён за узлом, а не за порядковым номером -->
  <g fill="#06121a" stroke-width="3">
    <circle cx="320" cy="320" r="52" stroke="#E05A50"/><circle cx="320" cy="320" r="40" stroke="#E05A50"/>
    <circle cx="640" cy="320" r="52" stroke="#f59e0b"/><circle cx="640" cy="320" r="40" stroke="#f59e0b"/>
    <circle cx="960" cy="320" r="52" stroke="#22D3EE"/><circle cx="960" cy="320" r="40" stroke="#22D3EE"/>
    <circle cx="1280" cy="320" r="52" stroke="#34D399"/><circle cx="1280" cy="320" r="40" stroke="#34D399"/>
  </g>
</svg>
