<script>
/* ---------------- данные ----------------
   МАКЕТ. Все числа, клиенты и переписки выдуманы и помечены ДЕМО. Реальных данных Авито здесь нет.
   Неделя: понедельник-воскресенье по МСК. Точка ряда стоит на воскресенье недели. */
const F = KS.F, { nf } = KS.fmt;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const DEMO = 'макет: выдуманные числа';
/* dlg: новых диалогов; lag: медиана первого ответа, мин; noresp: без ответа, %; noprice: спросили цену и не получили, %;
   aband: брошены с вопросом или телефоном клиента, %; rev: разобрано вручную */
const WEEKS = [
  { date:'2026-08-02', from:'27.07', to:'02.08', dlg:118, lag:34, noresp:14, noprice:31, aband:17, rev:4 },
  { date:'2026-08-09', from:'03.08', to:'09.08', dlg:124, lag:29, noresp:12, noprice:29, aband:15, rev:5 },
  { date:'2026-08-16', from:'10.08', to:'16.08', dlg:109, lag:41, noresp:16, noprice:33, aband:19, rev:3 },
  { date:'2026-08-23', from:'17.08', to:'23.08', dlg:131, lag:27, noresp:11, noprice:27, aband:14, rev:5 },
  { date:'2026-08-30', from:'24.08', to:'30.08', dlg:127, lag:25, noresp:10, noprice:26, aband:13, rev:4 },
  { date:'2026-09-06', from:'31.08', to:'06.09', dlg:140, lag:22, noresp:9,  noprice:24, aband:12, rev:5 },
  { date:'2026-09-13', from:'07.09', to:'13.09', dlg:136, lag:19, noresp:8,  noprice:21, aband:11, rev:5 },
  { date:'2026-09-20', from:'14.09', to:'20.09', dlg:131, lag:24, noresp:9,  noprice:26, aband:10, rev:5 }
];
/* текущая неделя не закрыта: 21-27.09, снимок на четверг 24.09 */
const OPEN = { date:'2026-09-24', from:'21.09', to:'27.09', dlg:71, lag:21, noresp:8, noprice:23, aband:9, rev:0 };
const PROBS = ['Без ответа', 'Ответ дольше часа', 'Спросили цену, не назвали', 'Не задали вопрос в ответ', 'Не спросили имя', 'Бросили с телефоном клиента', 'Нет дожима через сутки', 'Пропущенный звонок'];
const HEAT = [ /* доля чатов с проблемой, %, по 8 неделям */
  [14,12,16,11,10,9,8,9], [22,19,26,17,15,13,11,15], [31,29,33,27,26,24,21,26], [38,36,35,33,31,30,28,27],
  [44,43,41,40,40,37,36,35], [9,8,10,7,7,6,6,5], [27,25,28,24,22,21,20,19], [6,7,5,6,4,5,4,4] ];
const CABS = { /* по неделям: [кабинет, диалогов, медиана ответа мин, без ответа %, брошено %, разобрано] */
  '2026-09-20':[['OLD-G', 84, 18, 7, 8, 3], ['NEW-B', 47, 39, 13, 14, 2]],
  '2026-09-13':[['OLD-G', 88, 15, 6, 9, 3], ['NEW-B', 48, 27, 11, 14, 2]]
};
const CARDS = [
  { week:'2026-09-20', cli:'Клиент #7c21', acc:'OLD-G', date:'16.09', sev:'red',
    chat:[['Клиент','Здравствуйте, сколько будет стоить такой вариант, как на фото?','10:14'],
          ['Менеджер','Добрый день! Уточните, пожалуйста, какой размер нужен?','13:52'],
          ['Клиент','Примерно как в объявлении','14:05'],
          ['sys','Дальше ответа нет, клиент больше не писал','']],
    wrong:['Цену не назвали, хотя клиент спросил прямо', 'Первый ответ через 3 ч 38 мин', 'После ответа клиента тишина, дожима нет'],
    right:['Уточнили параметр заказа'],
    fix:'Сразу назвать вилку «от ... до ...» по шаблону «Цена по запросу» и задать один вопрос. Через сутки без ответа отправить дожим.',
    link:'Скрипты и магниты → Цена по запросу' },
  { week:'2026-09-20', cli:'Клиент #a90e', acc:'NEW-B', date:'17.09', sev:'yellow',
    chat:[['Клиент','Добрый вечер, делаете с гравировкой?','21:47'],
          ['Менеджер','Здравствуйте! Да, делаем.','09:12'],
          ['sys','Клиент прочитал, не ответил','']],
    wrong:['Ответ «да» без следующего шага: разговор закончился на менеджере', 'Вечернее сообщение ждало ответа до утра'],
    right:['Ответили в первые минуты рабочего дня'],
    fix:'Ответ на вопрос «делаете ли» всегда с вопросом в ответ: «Да. Для кого и к какой дате нужно?» Вечерние сообщения: автоответ с часами работы.',
    link:'Скрипты и магниты → Первое касание' },
  { week:'2026-09-20', cli:'Клиент #3f58', acc:'OLD-G', date:'18.09', sev:'green',
    chat:[['Клиент','Сколько по времени делаете?','11:20'],
          ['Менеджер','Здравствуйте! Срок зависит от варианта, обычно называем его после согласования макета. Как к вам обращаться?','11:24'],
          ['Клиент','Ольга','11:26'],
          ['Менеджер','Ольга, давайте я позвоню на пару минут и сориентирую по срокам и цене? Удобно сейчас?','11:27'],
          ['sys','Клиент оставил телефон, звонок в 11:40','']],
    wrong:[],
    right:['Первый ответ через 4 минуты', 'Спросили имя и обращались по имени', 'Перевели в звонок и договорились о времени'],
    fix:'Сделать образцом для новичков: вопрос, имя, звонок.',
    link:'Библиотека разборов' }
];
const PREV_STEPS = [ /* что обещали на неделе 07-13.09 и что вышло */
  ['Вилка цены в ответ на «сколько стоит»: доля без цены ниже 20%', 'РОП ОП ГМ', 'не сделано', 'crit', 'стало 26% (было 21%)'],
  ['Дежурный по кабинету NEW-B с 9:00 до 11:00', 'РОП ОП ГМ', 'сделано', 'ok', 'медиана ответа NEW-B 39 мин, план ниже 30 мин']
];

let SEL = WEEKS.length - 1, VIEW = 'week';
const el = id => document.getElementById(id);
const cur = () => SEL === 'open' ? OPEN : WEEKS[SEL];
/* ряд до выбранной недели включительно: сравнение с прошлой неделей = две последние точки за 14 дней */
const series = () => SEL === 'open' ? WEEKS.concat([OPEN]) : WEEKS.slice(0, SEL + 1);
const dyn = f => KS.series.dyn(series(), f, 14);
const fd = (v, what, n) => F(v, 'ДЕМО', DEMO + (what ? ' · ' + what : ''), cur().date, n);

const NAV = [
  { id:'today', t:'Сегодня', i:'check' },
  { id:'pulse', t:'Пульс ОП', i:'grid' },
  { t:'Аналитика Авито', i:'chart', ch:[ { id:'speed2', t:'Скорость ответа' }, { id:'probs', t:'Типовые проблемы' }, { id:'ads', t:'Объявления' }, { id:'calls', t:'Звонки' }, { id:'cold', t:'Холодная рассылка' } ] },
  { t:'Разборы', i:'list', ch:[ { id:'week', t:'Разбор недели' }, { id:'dlg', t:'Все диалоги' }, { id:'lib', t:'Библиотека разборов' } ] },
  { t:'Обучение', i:'doc', ch:[ { id:'scripts', t:'Скрипты и магниты' }, { id:'actions', t:'Что делать дальше' } ] },
  { id:'mgr', t:'Менеджеры (Bitrix)', i:'users' },
  { id:'data', t:'Откуда цифры', i:'info' }
];
const TITLES = { today:'Сегодня', pulse:'Пульс ОП', speed2:'Скорость ответа', probs:'Типовые проблемы', ads:'Объявления', calls:'Звонки',
  cold:'Холодная рассылка', dlg:'Все диалоги', scripts:'Скрипты и магниты', actions:'Что делать дальше', mgr:'Менеджеры (Bitrix)', data:'Откуда цифры' };

function chat(c){
  return '<div class="op-tl">' + c.chat.map(m => m[0] === 'sys'
    ? '<div class="op-bub is-s">' + esc(m[1]) + '</div>'
    : '<div class="op-bub is-' + (m[0] === 'Клиент' ? 'c' : 'm') + '">' + esc(m[1]) + '<span class="op-tm">' + esc(m[0]) + (m[2] ? ' · ' + esc(m[2]) : '') + '</span></div>').join('') + '</div>';
}
const SEV = { red:['потеряли', 'crit'], yellow:['спорно', 'warn'], green:['хороший пример', 'ok'] };
function card(c){
  const s = SEV[c.sev];
  return KS.card({ title:c.cli, sub:c.acc + ' · ' + c.date + ' · ' + KS.kind('ДЕМО').replace(/<[^>]+>/g, '') , actions:KS.status(s[0], s[1]),
    body: chat(c)
      + '<div class="ks-grid-2 op-td"><div><div class="op-td-h">Что не так</div>' + (c.wrong.length ? KS.checks(c.wrong, 'crit') : '<p class="op-muted">нет</p>') + '</div>'
      + '<div><div class="op-td-h">Что хорошо</div>' + (c.right.length ? KS.checks(c.right, 'ok') : '<p class="op-muted">нет</p>') + '</div></div>'
      + '<p class="op-hint"><b>Как надо:</b> ' + esc(c.fix) + ' <span class="op-muted">(' + esc(c.link) + ')</span></p>' });
}

const SCREENS = {
  week(){
    const w = cur(), open = SEL === 'open', s = series();
    const cards = CARDS.filter(c => c.week === w.date);
    const cabs = CABS[w.date] || [];
    const cols = WEEKS.map(x => x.from);
    return KS.head({ title:'Разбор недели ' + w.from + '-' + w.to,
        sub:'Что изменилось в переписках на Авито за неделю и что с этим делать на следующей.',
        src:'Авито API, кабинеты OLD-G и NEW-B · ручной разбор РОП по понедельникам · в макете все данные выдуманы',
        badges:[ KS.kind('ДЕМО'), open ? KS.badge('неделя не закрыта', 'warn', 'Сравнение идёт с теми же днями прошлой недели') : '',
          '<span class="ks-help" tabindex="0" data-tip="Неделя: понедельник-воскресенье по МСК.\nДиалог относится к неделе по первому сообщению клиента.\nСтрелки у плиток: изменение к прошлой неделе.\nДоли проблем считает автоматическая проверка текста, её точность ещё не измерена: класс ГИПОТЕЗА.">?</span>' ],
        lead:'Сделки и выручку Авито не отдаёт, поэтому потери в рублях здесь не считаем: ' + KS.val(F(null, 'ДЕМО', 'нужна связка чатов Авито с Bitrix24 по телефону')) + '.' })
      + '<div class="ks-stack">'
      + KS.card({ title:'Что обещали неделей раньше', sub:'Шаги с разбора недели ' + (WEEKS[Math.max(0, (SEL === 'open' ? WEEKS.length : SEL) - 1)] || w).from + '-' + (WEEKS[Math.max(0, (SEL === 'open' ? WEEKS.length : SEL) - 1)] || w).to,
          body:KS.table([['Шаг'],['Кто'],['Итог'],['Факт']], PREV_STEPS.map(p => [esc(p[0]), esc(p[1]), KS.status(p[2], p[3]), esc(p[4])])) })
      + KS.verdict(s, [['lag','медиана первого ответа, мин',false],['noresp','без ответа, %',false],['aband','брошены с вопросом или телефоном, %',false]], 14, open ? 'те же дни прошлой недели' : 'к прошлой неделе')
      + '<div class="ks-grid-kpi">'
      +   KS.tile({ label:'Новых диалогов с клиентами', f:fd(w.dlg, 'входящие и ответы на рассылку'), slot:3, icon:'list', delta:KS.delta(dyn('dlg')), spark:s.map(r => r.dlg) })
      +   KS.tile({ label:'Медиана первого ответа, мин', f:fd(w.lag, 'по времени первого ответа'), slot:1, icon:'clock', delta:KS.delta(dyn('lag'), false), spark:s.map(r => r.lag) })
      +   KS.tile({ label:'Спросили цену и не получили, %', f:F(w.noprice, 'ДЕМО', 'макет · в бою ГИПОТЕЗА: автопроверка текста', w.date), slot:4, icon:'wallet', delta:KS.delta(dyn('noprice'), false), spark:s.map(r => r.noprice) })
      +   KS.tile({ label:'Брошены с вопросом или телефоном, %', f:F(w.aband, 'ДЕМО', 'макет · в бою ГИПОТЕЗА: автопроверка текста', w.date), slot:2, icon:'loss', delta:KS.delta(dyn('aband'), false), spark:s.map(r => r.aband) })
      + '</div>'
      + KS.card({ title:'Проблема разовая или системная', sub:'Доля чатов с проблемой по неделям, %. Чем темнее, тем чаще',
          body:KS.chart('c-heat', 360),
          table:KS.table([['Проблема']].concat(cols.map(c => [c, true])), PROBS.map((p, i) => [esc(p)].concat(HEAT[i].map(x => nf(x))))) })
      +   KS.card({ title:'По кабинетам', sub:'Неделя ' + w.from + '-' + w.to,
            body: cabs.length ? KS.table([['Кабинет'],['Диалогов',true],['Медиана ответа, мин',true],['Без ответа, %',true],['Брошено, %',true],['Разобрано',true]], cabs.map(r => ['<b class="ks-strong">' + r[0] + '</b>'].concat(r.slice(1).map(x => nf(x)))))
                              : '<div class="ks-muted">В макете таблица заполнена для недель 07-13.09 и 14-20.09.</div>' })
      + '<div class="ks-grid-2">'
      +     KS.note('По менеджерам разбивки нет', 'Авито отдаёт одного отправителя на весь кабинет, поэтому цифры не делятся на людей и рейтинга менеджеров здесь нет. Профили людей в разделе «Менеджеры (Bitrix)», это другой источник.')
      +     KS.note('Покрытие разбора', 'Разобрано вручную ' + nf(w.rev) + ' из ' + nf(w.dlg) + ' диалогов (' + (w.dlg ? Math.round(w.rev / w.dlg * 100) : 0) + '%). Доли проблем считает автоматическая проверка текста: пока её точность не измерена на 50+ размеченных чатах, в бою они идут с классом ГИПОТЕЗА. Имена, телефоны и фото клиентов в карточках скрыты.')
      + '</div>'
      + '<h2 class="ks-h2">Показательные диалоги недели</h2>'
      + (cards.length ? cards.map(card).join('')
         : KS.card({ body: open ? '<p class="op-muted">Неделя не закрыта: карточки появятся в понедельник 28.09 после разбора РОП.</p>'
                                : '<p class="op-muted">В макете карточки есть только у недели 14-20.09. В бою пустая закрытая неделя показывает «разбор не сделан, ответственный, срок».</p>' }))
      + '<h2 class="ks-h2">Что делаем на следующей неделе</h2>'
      + KS.action({ what:'Отвечать вилкой цены на каждый вопрос «сколько стоит»: доля «спросили цену и не получили» ниже 20%', who:'РОП ОП ГМ', when:'проверка пн 28.09', crit:'плитка «Спросили цену и не получили» на неделе 21-27.09' })
      + KS.action({ what:'Автоответ с часами работы на сообщения после 20:00 и дежурный по NEW-B утром', who:'РОП ОП ГМ', when:'проверка пн 28.09', crit:'медиана ответа NEW-B ниже 30 мин' })
      + '<p class="op-mock">Макет раздела. Все числа, клиенты и переписки выдуманы (ДЕМО). Перед боевой сборкой: подключение недельной выгрузки, проверка ФЕНИКСОМ.</p>'
      + '</div>';
  },
  lib(){
    const rows = CARDS.map(c => [esc(c.cli), c.acc, c.date, (WEEKS.find(w => w.date === c.week) || {}).from + '-' + (WEEKS.find(w => w.date === c.week) || {}).to, KS.status(SEV[c.sev][0], SEV[c.sev][1]), esc(c.wrong[0] || c.right[0] || '')]);
    return KS.head({ title:'Библиотека разборов', sub:'Все карточки разбора за все недели. Бывшие «Детальные разборы»: один источник с «Разбором недели», два вида.',
        src:'в макете три выдуманные карточки', badges:[KS.kind('ДЕМО')] })
      + KS.card({ title:'Карточки', sub:'В бою: фильтры по неделе, статусу, кабинету и типу проблемы',
          body:KS.table([['Клиент'],['Кабинет'],['Дата'],['Неделя'],['Статус'],['Главное']], rows) });
  }
};
function stub(v){
  return KS.head({ title:TITLES[v] || 'Экран', sub:'Этот экран в дашборде уже есть. В макете собран только новый раздел «Разбор недели» и переименованная «Библиотека разборов».' })
    + KS.action({ what:'Открыть «Разбор недели»', who:'макет', when:'сейчас' });
}

function draw(){
  if(el('c-heat')) KS.charts.heat('c-heat', { rows:PROBS, cols:WEEKS.map(w => w.from), matrix:HEAT, ranges:[[0,9],[10,19],[20,29],[30,39],[40,60]], h:360 });
}
function weekLabel(i){ const w = WEEKS[i]; return w.from + '-' + w.to; }
function render(){
  el('view').innerHTML = '<div class="ks-fade">' + (SCREENS[VIEW] ? SCREENS[VIEW]() : stub(VIEW)) + '</div>';
  KS.charts.prune();
  el('nav').innerHTML = KS.nav(NAV, VIEW);
  const segVal = SEL === 'open' ? 'open' : String(SEL);
  el('seg').querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === segVal)));
  el('arch').value = segVal;
  el('stamp').textContent = 'неделя ' + (SEL === 'open' ? OPEN.from + '-' + OPEN.to + ', не закрыта' : weekLabel(SEL)) + ' · макет';
  el('foot').textContent = 'Макет раздела «Разбор недели» на Контур DS 1.5.2. Данные выдуманы.';
  el('theme').innerHTML = KS.theme.icon();
  KS.ticker.run(el('view'));
  requestAnimationFrame(draw);
}
KS.charts.onTheme = () => render();
const go = v => KS.vt(() => { VIEW = v; render(); window.scrollTo(0, 0); });
KS.navWire(el('nav'), go);
KS.shell.init({ sidebar:'#sb', backdrop:'#bd', menu:'#menu' });
const last = WEEKS.length - 1;
el('seg').innerHTML = [['open','эта неделя'], [String(last),'прошлая'], [String(last - 1),'2 нед. назад'], [String(last - 2),'3 нед. назад']]
  .map(([k, t]) => '<button type="button" data-w="' + k + '" aria-pressed="false">' + t + '</button>').join('');
KS.seg.wire(el('seg'));
el('arch').innerHTML = '<option value="open">' + OPEN.from + '-' + OPEN.to + ' (не закрыта)</option>' + WEEKS.map((w, i) => '<option value="' + i + '">' + weekLabel(i) + '</option>').reverse().join('');
const pick = v => { SEL = v === 'open' ? 'open' : +v; if(VIEW !== 'week') VIEW = 'week'; render(); };
el('seg').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if(b) pick(b.dataset.w); });
el('arch').addEventListener('change', e => pick(e.target.value));
el('theme').addEventListener('click', () => KS.theme.toggle());
el('cmdkb').outerHTML = KS.cmdk.button();
KS.cmdk.set([
  { group:'Экраны', label:'Разбор недели', icon:'list', run:() => go('week') },
  { group:'Экраны', label:'Прошлая неделя', hint:weekLabel(last - 1), icon:'calendar', run:() => { SEL = last - 1; go('week'); } },
  { group:'Экраны', label:'Библиотека разборов', icon:'doc', run:() => go('lib') },
  { group:'Действия', label:'Сменить тему', icon:'moon', keywords:'тёмная светлая', run:() => KS.theme.toggle() },
  { group:'Действия', label:'Переключить плотность', icon:'rows', keywords:'компактно просторно', run:() => KS.density.toggle() }
]);
KS.theme.init();
render();
const densUi = () => { const b = el('dens'); b.innerHTML = KS.density.icon(); b.setAttribute('data-tip', 'Плотность: ' + KS.density.label().toLowerCase()); };
el('dens').addEventListener('click', () => KS.density.toggle());
document.addEventListener('ks:density', densUi);
densUi();
</script>
</body>
</html>
