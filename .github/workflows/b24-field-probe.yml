name: B24 field probe (разовая диагностика причины отказа)

# Разовая диагностика: найти актуальное поле «причина отказа» в Bitrix24.
# Запуск вручную (workflow_dispatch). Секрет B24_WEBHOOK_URL маскируется в логе.
# Ничего не коммитит - только печатает поля-кандидаты в лог.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Probe reason field
        env:
          B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
        run: |
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::Нет секрета B24_WEBHOOK_URL"; exit 1; fi
          npx tsx src/scripts/b24/probe-reason-field.ts
