name: B24 dialog snapshot (хронология коммуникаций, /dialog/)

# Снимок КОММУНИКАЦИЙ Bitrix24 за окно (7 дней) -> analytics-mvp/dialog/data/dialog.json
# на ветке dialog-export-v1. Звонки, письма, WhatsApp/Telegram/MAX (Wazzup), Открытые линии,
# дела/TODO, заметки - в единой хронологии по сделкам. После снимка дёргает deploy-pages -> /dialog/.
# Живёт на main, чтобы schedule/workflow_dispatch были доступны; код берётся из DATA_BRANCH.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "DIALOG_DAYS (окно в днях, по умолчанию 7)"
        required: false
      ai_limit:
        description: "AI_LIMIT (сколько диалогов разобрать ИИ; пусто = 120). Для теста поставь 5."
        required: false
      ai_batch:
        description: "AI_BATCH (1 = Batch API пакетом, 0 = синхронно/быстрее для теста; пусто = 1)"
        required: false
      ai_enable:
        description: "ИИ-разбор через API. Пусто/0 = НЕ вызывать API (правило Ивана: API только в дашборде). 1 = разрешить разово вручную."
        required: false
  schedule:
    - cron: "37 5 * * *" # ~08:37 МСК (снимок диалогов; ИИ-разбор по API приостановлен, см. шаг ниже)

permissions:
  contents: write
  actions: write # чтобы после снимка дёрнуть deploy-pages (публикация /dialog/)

concurrency:
  group: b24-dialog-data
  cancel-in-progress: true

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
  B24_PORTAL: https://glassmemory.bitrix24.ru
  DATA_BRANCH: dialog-export-v1
  DIALOG_DAYS: ${{ github.event.inputs.days || '7' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Проверить секрет
        run: |
          set -euo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then
            echo "::error::Секрет B24_WEBHOOK_URL не задан (Settings -> Secrets -> Actions)."; exit 1
          fi
          echo "Секрет на месте. Окно=$DIALOG_DAYS дн"

      - name: Снимок коммуникаций Bitrix -> dialog/data/dialog.json
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/fetch-dialog.ts
          echo "Размер: $(du -h dialog/data/dialog.json | cut -f1)"

      # ИИ-разбор через Anthropic API ПРИОСТАНОВЛЕН по правилу Ивана: API вызывается только из
      # дашборда (его ключ, в браузере), никаких авто-вызовов из крона. Шаг не запускается по
      # расписанию и не запускается вручную, пока явно не передан ai_enable=1 (разовый обход).
      # Снимок диалогов (dialog.json) собирается как раньше - он API не трогает.
      - name: ИИ-разбор коммуникаций (по API; приостановлен - только ручной ai_enable=1)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ai_enable == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_LIMIT: ${{ github.event.inputs.ai_limit || '' }}
          AI_BATCH: ${{ github.event.inputs.ai_batch || '' }}
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/ai-review.ts

      - name: Скоринг диалогов (вероятность, теги, рейтинг менеджеров)
        run: |
          set -euo pipefail
          git fetch origin rop-dashboard-v1 --depth=1
          git show origin/rop-dashboard-v1:analytics-mvp/rop/data/rop.json > /tmp/rop.json || echo "rop.json недоступен, скоринг без фактов CRM"
          ROP_JSON=/tmp/rop.json npx tsx src/scripts/b24/score-dialog.ts

      - name: Commit (если есть изменения)
        id: commit
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/dialog/data/
          if git diff --staged --quiet; then echo "снимок без изменений"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(dialog): снимок коммуникаций Bitrix24 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1

      - name: Триггер деплоя /dialog/ (deploy-pages на main)
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # GitHub иногда отвечает 5xx на dispatch. Без --fail-with-body curl молчит, и публикация
          # теряется незаметно: шаг рапортует успех, а данные на сайт не уезжают. Поэтому ретраи.
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
              -d '{"ref":"main"}' || echo 000)
            if [ "$code" = "204" ]; then ok=1; break; fi
            echo "попытка $i: HTTP $code $(cat /tmp/dispatch.out)"; sleep $((5*i))
          done
          if [ "$ok" != "1" ]; then echo "::error::Публикация не запрошена после 5 попыток"; exit 1; fi
          echo "Публикация /dialog/ запрошена (deploy-pages, ref=main)."
