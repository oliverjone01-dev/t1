name: Deploy to GitHub Pages

# Собирает сервис, прогоняет smoke-проверку контролов (gate) и публикует на Pages.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/focused-davinci-tKJCt]
    paths: [analytics-mvp/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:site
      - name: Smoke (контролы)
        run: npm run smoke
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: analytics-mvp/public
      - id: deploy
        uses: actions/deploy-pages@v4
