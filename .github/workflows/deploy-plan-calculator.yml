name: Deploy GENGLASS plan calculator to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/genglass-sales-calculator-8o56u3
    paths:
      - genglass-plan-calculator/**
      - .github/workflows/deploy-plan-calculator.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: genglass-plan-calculator
      - id: deployment
        uses: actions/deploy-pages@v4
