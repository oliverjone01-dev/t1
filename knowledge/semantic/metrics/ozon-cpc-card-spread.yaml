    expected: "8 шт, по 8 079 за шт: 24 237 на заказы GGT-47-3-3-80 за сентябрь; по 8 079 на 37192082-0346-1 (GGT-47-3-5-80), 25046719-0374-1 (GGT-03-3-3-L-90), 64207726-0637-1 (GGT-03-3-3-L-80); 8 079 за 01.09 остаётся на GGT-47-3-3-80; 8 079 на строку отменённого заказа 0210427575-0149-1 (Иван 01.10)"
    confirmed_by: "тест src/scripts/cpc-card-spread.test.ts (срез по 29.09); подпись Ивана - ждём"
  - input: "сентябрь, товар GGT-03-3-3-O-20090 (3564831766), кампания 40015169, расход 105 873; свои 1 шт, соседи 2 шт (12.09 91 471, 13.09 109 308)"
    expected: "по 35 291: на заказы GGT-03-3-3-O-20090, на 0202248461-0011-1 (GGT-03-3-3-E-16080) и 02912987-0407-1 (GGT-03-2-1-O-20090)"
    confirmed_by: "тест src/scripts/cpc-card-spread.test.ts (срез по 29.09); подпись Ивана - ждём"
  - input: "сентябрь, кампания 40047060 (GGT-46), расход 55 737; в нашем сборе атрибуции её нет (проба API 01.10: 1 продажа соседа на 75 900)"
    expected: "весь расход на рекламируемых товарах; ни один из 3 товаров заказов не имеет -> «Общие расходы». Факт сбора (v2.1): у 40047060 22 дня из 26 со строкой атрибуции, все с нулями -> «без продаж» (из них дни без строки - «дни без атрибуции в нашем сборе»), а не «кампании без атрибуции»"
    confirmed_by: "тест src/scripts/cpc-card-spread.test.ts (срез по 29.09); подпись Ивана - ждём"
  - input: "сентябрь целиком"
    expected: "CPC 791 263; с атрибуцией 746 742; на соседей 281 596 (код 281 606, округление по дням); сосед не найден 8 079; без продаж 194 831 (из них дни без атрибуции 35 601); без атрибуции 44 521; покрытие по дням 86,8%"
    confirmed_by: "тест src/scripts/cpc-card-spread.test.ts (срез по 29.09); подпись Ивана - ждём"
