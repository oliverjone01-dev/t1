<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Три узла в ряд: связь с ближним сплошная, дальше пунктирная, прямой путь внизу разорван">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#233242" stroke-width="1" opacity=".1"/>
    </pattern>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#06121a"/>
  <rect width="1600" height="640" fill="url(#g)"/>

  <!-- Мы и дизайнер: канал сплошной, разговор виден -->
  <path d="M352 300H588" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/>
  <!-- Дизайнер и заказчик: канал есть, но идёт без нас -->
  <path d="M712 300H948" fill="none" stroke="#233242" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round"/>
  <!-- Прямого пути к заказчику нет: дуга разорвана посередине -->
  <g fill="none" stroke="#233242" stroke-width="3" stroke-linecap="round">
    <path d="M300 372C420 486 500 496 600 500"/>
    <path d="M1000 500C1100 496 1180 486 1300 372"/>
  </g>
  <g fill="#06121a" stroke-width="3">
    <circle cx="300" cy="300" r="52" stroke="#22D3EE"/>
    <circle cx="650" cy="300" r="62" stroke="#22D3EE"/><circle cx="650" cy="300" r="50" stroke="#22D3EE"/>
    <circle cx="1300" cy="300" r="52" stroke="#233242" stroke-dasharray="12 10"/>
  </g>
</svg>
