# Задачи по расписанию (замена cron в .github/workflows).
# Формат: имя | ветка | расписание systemd OnCalendar | скрипт в jobs/ | lock-группа | пересобрать сайт (yes/no)
#
#  - имя: латиница, цифры, дефис. Таймер: gg-job-<имя>.timer, ручной запуск: gg-job <имя>.
#  - ветка: в чьём релизе (cwd) выполняется скрипт; её данные откатятся, если задача упадёт.
#    «-» = ветка контура: служебная задача без данных (не коммитит и не откатывает данные).
#  - расписание: синтаксис systemd (man systemd.time), время в UTC, как было в GitHub cron.
#    «17 */3 * * *» = «*-*-* 00/3:17:00 UTC». Пропущенный запуск (сервер был выключен)
#    выполнится сразу после старта (Persistent=true) - в GitHub такие запуски терялись.
#  - lock-группа: задачи одной группы не идут параллельно (аналог concurrency в Actions).
#  - после изменения файла таймеры пересоберутся сами (gg-poll -> gg-apply-timers).

rop-snapshot | rop-dashboard-v1 | *-*-* 00/3:17:00 UTC | rop-snapshot.sh | b24-rop | yes
daily-report | - | *-*-* 05:47:00 UTC | daily-report.sh | report | no
rop-digest-plan  | - | Mon..Fri *-*-* 06:00:00 UTC | rop-digest.sh | rop-digest | no
rop-digest-itogi | - | Mon..Fri *-*-* 14:30:00 UTC | rop-digest.sh | rop-digest | no
# Волна 2, экономика: обе задачи пишут данные economics-dashboard-v1 - одна lock-группа
# (откат упавшей задачи чистит данные всей ветки, параллельно их пускать нельзя).
# Снимок дважды, как в economics-cron.yml: 05:47 основной, 10:17 страховочный.
economics-snapshot      | economics-dashboard-v1 | *-*-* 05:47:00 UTC    | economics-snapshot.sh | economics | yes
economics-snapshot-late | economics-dashboard-v1 | *-*-* 10:17:00 UTC    | economics-snapshot.sh | economics | yes
econ-recon              | economics-dashboard-v1 | *-*-* 00/3:37:00 UTC  | econ-recon.sh         | economics | yes
