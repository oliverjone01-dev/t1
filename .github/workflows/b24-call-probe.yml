name: B24 call-transcript probe (разовая диагностика)

# Где Bitrix хранит текст транскрибации звонка. Запуск вручную. Ничего не коммитит.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Окно в днях (по умолчанию 30)"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Probe call transcript
        env:
          B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::Нет секрета B24_WEBHOOK_URL"; exit 1; fi
          npx tsx src/scripts/b24/probe-call-transcript.ts
