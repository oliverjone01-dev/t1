<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Командный центр производства</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e13;--bg-1:#0f141b;--card:#131a22;--card2:#0f151c;--elev:#1a222c;--soft:#182029;
--ink:#eaf1f6;--ink2:#c2ccd6;--ink3:#8593a0;--ink4:#5a6672;--border:#212b36;--border2:#2c3a47;
--accent:#2E9E74;--accent-soft:rgba(46,158,116,.14);--cyan:#22D3EE;--red:#F43F5E;--amber:#F59E0B;--violet:#A78BFA;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:clip}
b{font-weight:700}
/* хедер и блок меню - один-в-один со стилем дашборда РОП */
.hdr{position:sticky;top:0;z-index:60}
.topbar{padding:11px 24px;border-bottom:1px solid #161C24;background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22D3EE,#0E7490);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}
.brand b{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px}.brand span{display:block;font-size:10.5px;color:var(--ink3)}
.brand #fresh{display:block;font-size:10px;font-weight:700;letter-spacing:.02em;margin-top:2px}
.controls{padding:10px 24px;border-bottom:1px solid #161C24;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px);font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:#1A2029;border:1px solid #1F2731;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink3);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:rgba(34,211,238,.10);color:#22D3EE}
.ctl-lbl{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
.rev-toggle{display:flex;align-items:center;gap:7px}
.tb-spacer{flex:1}
.dinp{background:#1A2029;border:1px solid #1F2731;color:var(--ink2);border-radius:7px;padding:5px 8px;font:inherit;font-size:11.5px;color-scheme:dark}
.dbtn{background:rgba(34,211,238,.10);border:1px solid #1F2731;color:#22D3EE;border-radius:7px;padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer}
.qm{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--border);color:var(--ink3);font-size:9px;font-weight:700;line-height:12px;text-align:center;margin-left:5px;cursor:help;font-style:normal;vertical-align:middle}
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:300px}
#tip b{font-family:'Manrope',sans-serif}#tip .tl{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;padding:1px 0}#tip .tr span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.foot{text-align:center;color:var(--ink4);font-size:11px;margin-top:28px}
.tag{font-size:10px;background:var(--elev);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink3)}
.wrap{padding:20px 24px 60px;max-width:1720px;margin:0 auto}
.sec{display:flex;align-items:center;gap:14px;margin:28px 0 14px}
.sec .n{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.sec .hint{font-size:11px;color:var(--ink3)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.card-t{font-size:15px;font-weight:800}
.card-s{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi .bar{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);margin-bottom:8px}
.kpi .v{font-size:25px;font-weight:800;font-family:'Manrope',sans-serif;letter-spacing:-.02em}
.kpi .u{font-size:13px;color:var(--ink3);font-weight:600}
.kpi .sub{font-size:10.5px;color:var(--ink4);margin-top:6px}
.now-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);background:rgba(245,158,11,.12);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:6px;padding:2px 7px;border-radius:6px}
.up{color:#34d399;background:rgba(52,211,153,.12)}.dn{color:#fb7185;background:rgba(251,113,133,.12)}.flat{color:var(--ink4);background:var(--elev)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
/* конвейер */
.conv{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:8px 2px 4px}
.st{flex:1;min-width:104px;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px}
.st .node{width:100%;border-radius:11px;padding:12px 8px;text-align:center;border:1px solid var(--border2);background:var(--elev);position:relative}
.st .cnt{font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;line-height:1}
.st .nm{font-size:11px;font-weight:700;color:var(--ink2);margin-top:5px;line-height:1.15;min-height:26px;display:flex;align-items:center;justify-content:center}
.st .dw{font-size:10px;font-weight:700;margin-top:5px}
.st .thru{font-size:9.5px;color:var(--ink4);margin-top:2px}
.st .arrow{position:absolute;right:-7px;top:34px;color:var(--ink4);font-size:16px;z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;padding:7px 9px;color:var(--ink3);font-weight:600;font-size:11px;border-bottom:1px solid var(--border2);white-space:nowrap;cursor:default}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl td.nm{color:var(--ink);font-weight:600}
.hbar{height:8px;border-radius:4px;background:var(--elev);overflow:hidden;min-width:40px}
.hbar>i{display:block;height:100%;border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;color:var(--ink4);background:var(--soft);border:1px dashed var(--border2);border-radius:8px;padding:8px 11px;margin-top:10px}
/* проходимость участков: центрированная воронка */
.fun-row{display:grid;grid-template-columns:110px 1fr 150px;gap:12px;align-items:center;margin:7px 0}
.fun-dial{display:flex;align-items:center;gap:8px;cursor:help}
.fun-dial b{font-size:11.5px;font-variant-numeric:tabular-nums}
.fun-nm{font-size:12px;font-weight:700;color:var(--ink2);text-align:right}
.fun-tr{position:relative;height:27px;background:repeating-linear-gradient(90deg,transparent,transparent 6px,rgba(255,255,255,.015) 6px,rgba(255,255,255,.015) 12px)}
.fun-bar{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;white-space:nowrap;cursor:help;min-width:0;transition:width .35s var(--ease)}
.fun-st{font-size:11px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
/* профиль конструкторов по чекам */
.pr-row{display:grid;grid-template-columns:150px 1fr 1fr 1fr 150px;gap:10px;align-items:center;margin:7px 0}
.pr-nm{font-size:12px;font-weight:700;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink4)}
.pr-cell{position:relative;height:30px;background:var(--elev);border-radius:7px;overflow:hidden;cursor:help}
.pr-cell>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px}
.pr-cell>span{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pr-tot{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:1100px){.pr-row{grid-template-columns:110px 1fr 1fr 1fr 120px}}
a{color:var(--cyan)}
</style></head><body>
<div class="hdr">
<div class="topbar">
  <div class="logo">GG</div>
  <div class="brand"><b>GENGLASS · Производство</b><span>Командный центр производства · смарт-процесс «Производство GG»</span><span id="fresh" data-tip="Когда данные в последний раз сняты из Bitrix24. Зелёный - свежие (до 30 ч). Жёлтый - стоит проверить (30-48 ч). Красный - данные устарели, ночной сбор не доехал.">.</span></div>
</div>
<div class="controls">
  <div class="rev-toggle"><span class="ctl-lbl">Срез по</span><div class="seg" id="modeSeg"><button data-v="start" class="on">дате запуска</button><button data-v="done">дате готовности</button></div><span class="qm" data-tip="«По дате запуска»: структурные блоки (проходимость, менеджеры, конструкторы, ассортимент) считаются по заказам, ПЕРЕДАННЫМ в производство в выбранном периоде. «По дате готовности»: по заказам, ставшим готовыми в периоде. KPI запуска и выпуска всегда считаются по своей естественной дате.">?</span></div>
  <span class="ctl-lbl">Гранулярность</span><div class="seg" id="granSeg"><button data-v="d">День</button><button data-v="w" class="on">Неделя</button><button data-v="m">Месяц</button></div>
  <span class="ctl-lbl">Направление</span><select id="dirSel" class="dinp" style="max-width:170px"><option value="">Все</option></select>
  <div class="tb-spacer"></div>
  <div class="seg" id="presetSeg"><button data-v="7">7 дн</button><button data-v="30">30 дн</button><button data-v="90">90 дн</button><button data-v="all" class="on">Всё</button></div>
  <input type="date" id="dFrom" class="dinp"><span style="color:var(--ink4)">–</span><input type="date" id="dTo" class="dinp"><button id="applyCustom" class="dbtn">ОК</button>
  <span style="font-size:11px;color:var(--ink3)" id="periodLabel"></span>
</div>
</div>
<div class="wrap" id="root"></div>
<div class="foot">© GENGROUP · GENGLASS · дашборд Производство · живые данные Bitrix24 · MVP</div>
<div id="tip"></div>
<script>
const DATA={"items":[],"refs":{},"generatedAt":null,"b24Portal":"","entityTypeId":1086};
const IT=DATA.items||[], REF=DATA.refs||{}, PORTAL=DATA.b24Portal||'';
const NOWS=(DATA.generatedAt||'2026-07-03').slice(0,10);
const NOW=new Date(NOWS+'T12:00:00');
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fmt=n=>{n=Math.round(n||0);return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const fmtK=n=>{n=n||0;return n>=1e6?(n/1e6).toFixed(2).replace('.',',')+' млн':n>=1e3?Math.round(n/1e3)+' тыс':fmt(n)};
const d1=x=>x==null?'—':(Math.round(x*10)/10).toString().replace('.',',');
const pct=x=>((x||0)*100).toFixed(1).replace('.',',')+'%';
const pct0=x=>Math.round((x||0)*100)+'%';
const D=s=>s?new Date(String(s).slice(0,10)+'T12:00:00'):null;
const iso=dt=>{const p=n=>String(n).padStart(2,'0');return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())};
const days=(a,b)=>{a=D(a);b=D(b);return a&&b?Math.round((b-a)/864e5):null};
const med=a=>{a=a.filter(x=>x!=null).sort((p,q)=>p-q);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
// участки конвейера (агрегация 22 этапов)
const P='DT1086_31:';
const STATIONS=[
 ['Передано',[P+'NEW']],['МДФ',[P+'PREPARATION']],
 ['Заготовка',[P+'CLIENT',P+'UC_PTHHHS',P+'UC_3W4FHW']],
 ['Сварка',[P+'UC_2V855E',P+'UC_BKVWPN',P+'UC_HG65QE']],
 ['Зачистка',[P+'UC_LBFZFL',P+'UC_CS1WNG',P+'UC_UEPDAT']],
 ['Покраска',[P+'UC_5WJH24',P+'UC_B6QDA5',P+'UC_RLOCN3']],
 ['Столярка',[P+'UC_00ETMV',P+'UC_CQP3GA']],
 ['Нержавейка',[P+'UC_RV8EML',P+'UC_ST4EAA',P+'UC_1HAN8T']],
 ['Готовность',[P+'UC_5QF1M7']],['Готово',[P+'SUCCESS']],
];
const REWORK=new Set([P+'UC_3W4FHW',P+'UC_HG65QE',P+'UC_UEPDAT',P+'UC_RLOCN3',P+'UC_1HAN8T']);
const stMap={};STATIONS.forEach(([nm,codes])=>codes.forEach(c=>stMap[c]=nm));
const stationOf=c=>stMap[c]||null;
const isDone=i=>i.sem==='S', isWip=i=>i.sem==='P';
const firstHist=i=>i.hist&&i.hist.length?i.hist[0][1]:i.created;
const successDate=i=>{if(!i.hist)return null;for(const h of i.hist)if(h[0]===P+'SUCCESS')return h[1];return isDone(i)?i.close:null};
const startDate=i=>i.dateToProd||firstHist(i);
const cycleOf=i=>days(startDate(i),successDate(i));
const dwellNow=i=>days(i.moved||firstHist(i),NOWS);
const mgrOf=i=>i.dealMgr||i.sourceMgr||'—';
const moneyOf=i=>i.dealBudget||0;
function tone(dw){return dw>=21?'#F43F5E':dw>=10?'#FB923C':dw>=5?'#F59E0B':'#2E9E74'}
function toneC(c){return c>=40?'#F43F5E':c>=25?'#FB923C':c>=15?'#F59E0B':'#2E9E74'} // полный цикл: медиана цеха ~24 дн

// ===== состояние фильтров =====
const MIND=IT.length?IT.map(startDate).filter(Boolean).sort()[0]:NOWS;
const S={mode:'start',gran:'w',dir:'',from:MIND,to:NOWS,preset:'all'};

// бакеты по гранулярности (локальные компоненты - без TZ-сдвигов)
function bkey(ds){const dt=D(ds);if(!dt)return null;
  if(S.gran==='d')return iso(dt);
  if(S.gran==='m')return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)}
function blabel(k){if(S.gran==='m')return MON[+k.slice(5,7)-1];return k.slice(8,10)+'.'+k.slice(5,7)}
function bkeysInRange(){const keys=[];let dt=D(S.from);const end=D(S.to);if(!dt||!end)return keys;
  let k=bkey(iso(dt));while(k){keys.push(k);
    if(S.gran==='d')dt.setDate(dt.getDate()+1);
    else if(S.gran==='w')dt.setDate(dt.getDate()+7);
    else dt.setMonth(dt.getMonth()+1);
    const nk=bkey(iso(dt));if(nk===k)break;k=nk;if(dt>end&&keys.includes(bkey(iso(end))))break;
    if(keys.length>400)break}
  return keys.filter((v,i,a)=>a.indexOf(v)===i)}
// конец бакета (для точечных метрик «на конец периода»)
function bend(k){if(S.gran==='m'){const dt=new Date(+k.slice(0,4),+k.slice(5,7),0,12);return iso(dt)}
  if(S.gran==='w'){const dt=D(k);dt.setDate(dt.getDate()+6);return iso(dt)}return k}
const inRange=ds=>ds&&ds>=S.from&&ds<=S.to;
const dirOk=i=>!S.dir||i.dir===S.dir;

// когорты: запуск / готовность в выбранном периоде (+направление)
function cohorts(){
  const all=IT.filter(dirOk);
  const started=all.filter(i=>inRange(startDate(i)));
  const finished=all.filter(i=>isDone(i)&&inRange(successDate(i)));
  const cut=S.mode==='start'?started:finished; // срез для структурных блоков
  return {all,started,finished,cut};
}
// предыдущее окно той же длины (для трендов)
function prevWin(){const a=D(S.from),b=D(S.to);const len=Math.round((b-a)/864e5)+1;
  const pb=new Date(a-864e5),pa=new Date(a-len*864e5);return [iso(pa),iso(pb)]}
function trend(cur,prev,inv){if(prev===0)return cur>0?`<span class="trend up">▲ новый</span>`:`<span class="trend flat">—</span>`;const dl=(cur-prev)/prev,up=dl>=0,good=inv?!up:up;const cls=Math.abs(dl)<.005?'flat':good?'up':'dn';return `<span class="trend ${cls}">${Math.abs(dl)<.005?'→':up?'▲':'▼'} ${pct(Math.abs(dl))}</span>`}

// ===== графики =====
// сглаживание линий (Catmull-Rom -> Безье), как в дашборде РОП
function smoothPath(pts){if(!pts.length)return '';if(pts.length<3)return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
  return d}
const esc=s=>String(s).replace(/</g,'&lt;').replace(/"/g,'&quot;'); // для имён из Bitrix
const attr=s=>String(s).replace(/"/g,'&quot;'); // HTML подсказки в data-tip: экранируем только кавычки
function chartSVG(series,keys,opt){
  opt=opt||{};const w=opt.w||640,h=opt.h||190,pl=44,pr=12,pt=12,pb=26;
  let mx=0;series.forEach(s=>s.vals.forEach(v=>{if(v!=null&&v>mx)mx=v}));mx=mx*1.15||1;
  const n=keys.length,X=i=>pl+(w-pl-pr)*(n>1?i/(n-1):.5),Y=v=>h-pb-(h-pt-pb)*v/mx;
  const fv=opt.fmtY||(v=>fmtK(Math.round(v)));
  let grid='';for(let g=0;g<=3;g++){const yy=pt+(h-pt-pb)*g/3;grid+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink4)">${fv(mx*(1-g/3))}</text>`}
  let xl='';keys.forEach((k,i)=>{const step=Math.ceil(n/9);if(i%step===0||i===n-1)xl+=`<text x="${X(i)}" y="${h-pb+14}" text-anchor="middle" font-size="9" fill="var(--ink4)">${blabel(k)}</text>`});
  let body='';
  series.forEach(s=>{
    if(s.type==='bar'){const bw=Math.max(3,(w-pl-pr)/(n*1.6));
      body+=s.vals.map((v,i)=>v==null?'':`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-pb-Y(v)).toFixed(1)}" rx="2" fill="${s.c}" opacity=".85" pointer-events="none"/>`).join('');}
    else{const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]);
      // рвём линию на сегменты по null и сглаживаем каждый
      const segs=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else if(cur.length){segs.push(cur);cur=[]}});if(cur.length)segs.push(cur);
      segs.forEach(sp=>{const dd=smoothPath(sp);
        if(s.area&&sp.length>1)body+=`<path d="${dd} L${sp[sp.length-1][0].toFixed(1)} ${h-pb} L${sp[0][0].toFixed(1)} ${h-pb} Z" fill="${s.c}" opacity=".10" pointer-events="none"/>`;
        body+=`<path d="${dd}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`});
      body+=pts.filter(Boolean).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.3" fill="${s.c}" pointer-events="none"/>`).join('');}
  });
  // ховер: вертикальный пунктир + подсказка по бакету
  const xhair=`<line class="xhair" x1="0" y1="${pt}" x2="0" y2="${h-pb}" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="4 5" opacity="0" pointer-events="none"/>`;
  const bw2=(w-pl-pr)/(n-1||1);let cols='';
  for(let i=0;i<n;i++){
    const rows=series.filter(s=>s.name&&s.vals[i]!=null).map(s=>`<div class='tr'><span><i style='display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:6px'></i>${esc(s.name)}</span><span>${opt.money?fmt(s.vals[i])+' ₽':(opt.fmtY?opt.fmtY(s.vals[i]):fmt(s.vals[i]))}</span></div>`).join('');
    const tipHtml=attr(`<div class='tl'>${blabel(keys[i])}</div>`+rows);
    const x0=Math.max(pl,X(i)-bw2/2),ww=Math.min(bw2,w-pr-x0);
    cols+=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${ww.toFixed(1)}" height="${h-pb-pt}" fill="transparent" data-cx="${X(i).toFixed(1)}" data-tip="${tipHtml}"/>`}
  const leg=series.filter(s=>s.name).map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('');
  return `<div style="overflow-x:auto"><svg class="xh-chart" viewBox="0 0 ${w} ${h}" style="width:100%;min-width:460px">${grid}${xhair}${body}${cols}${xl}</svg></div>${leg?`<div class="legend">${leg}</div>`:''}`;
}
// бублик: сегменты с подсказками, итог в центре (стиль РОП)
function donut(data,total,pal,centerLabel){
  const R=62,r=38,cx=80,cy=80;let a=-Math.PI/2,s='';
  const tot=data.reduce((x,[,c])=>x+c,0)||1;
  data.forEach(([nm,c],i)=>{const frac=c/tot,a2=a+frac*2*Math.PI;
    const laf=frac>.5?1:0,col=pal[i%pal.length];
    const x0=cx+R*Math.cos(a),y0=cy+R*Math.sin(a),x1=cx+R*Math.cos(a2),y1=cy+R*Math.sin(a2);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),x3=cx+r*Math.cos(a),y3=cy+r*Math.sin(a);
    const td=attr(`<div class='tl'>${esc(nm)}</div><div class='tr'><span>Заказов</span><span>${fmt(c)}</span></div><div class='tr'><span>Доля</span><span>${pct(frac)}</span></div>`);
    if(frac>0)s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${laf} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${r} ${r} 0 ${laf} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${col}" opacity=".92" data-tip="${td}" style="cursor:help"/>`;
    a=a2});
  const svg=`<svg viewBox="0 0 160 160" style="width:150px;flex:none">${s}<text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Manrope">${fmt(tot)}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="8.5" fill="var(--ink3)">${centerLabel}</text></svg>`;
  const leg=data.map(([nm,c],i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin:3px 0"><i style="width:9px;height:9px;border-radius:2px;background:${pal[i%pal.length]};flex:none"></i><span style="color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">${nm}</span><b style="margin-left:auto">${fmt(c)}</b><span style="color:var(--ink4);width:44px;text-align:right">${pct(c/(tot||1))}</span></div>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center"><div>${svg}</div><div style="flex:1;min-width:0">${leg}</div></div>`;
}
// серия «сумма по бакетам» для дат
function seriesBy(items,dateFn,keys,valFn){const ki={};keys.forEach((k,i)=>ki[k]=i);const v=keys.map(()=>0);
  items.forEach(i=>{const k=bkey(dateFn(i));if(k in ki)v[ki[k]]+=(valFn?valFn(i):1)});return v}

function render(){
  const {all,started,finished,cut}=cohorts();
  const wip=all.filter(isWip),done=all.filter(isDone);
  const keys=bkeysInRange();
  const [pa,pb]=prevWin();
  const inWinP=(ds)=>ds&&ds>=pa&&ds<=pb;
  const modeLbl=S.mode==='start'?'запущенные в периоде':'готовые в периоде';

  // ===== KPI (за период, кроме помеченных «сейчас») =====
  const startedPrev=IT.filter(dirOk).filter(i=>inWinP(startDate(i))).length;
  const finishedPrev=IT.filter(dirOk).filter(i=>isDone(i)&&inWinP(successDate(i))).length;
  const moneyStarted=sum(started,moneyOf), moneyStartedPrev=sum(IT.filter(dirOk).filter(i=>inWinP(startDate(i))),moneyOf);
  const cyc=finished.map(cycleOf).filter(x=>x!=null&&x>=0);
  const stuck=wip.filter(i=>(dwellNow(i)||0)>14);
  const rewCut=cut.filter(i=>(i.hist||[]).some(h=>REWORK.has(h[0])));
  const kdef=[
    ['Запущено за период',fmt(started.length),'','var(--cyan)','передано в производство',trend(started.length,startedPrev)],
    ['Готово за период',fmt(finished.length),'','var(--accent)','дошли до «Успех»',trend(finished.length,finishedPrev)],
    ['Запущено в деньгах',fmtK(moneyStarted),' ₽','var(--cyan)','сумма сделок запущенных заказов',trend(moneyStarted,moneyStartedPrev)],
    ['Средний срок',d1(med(cyc)),' дн','var(--violet)','медиана готовых за период: запуск → готово',''],
    ['В производстве<span class="now-badge">сейчас</span>',fmt(wip.length),'','var(--amber)','открыто на участках в данный момент',''],
    ['Зависло >14 дн<span class="now-badge">сейчас</span>',fmt(stuck.length),'','var(--red)','без движения по стадии >14 дней',''],
    ['Доля с доработками',cut.length?pct(rewCut.length/cut.length):'—','','var(--amber)',`${fmt(rewCut.length)} из ${fmt(cut.length)} (${modeLbl})`,''],
  ];
  const kpis=`<div class="kpis">`+kdef.map(k=>`<div class="kpi"><div class="bar" style="background:${k[3]}"></div><div class="k">${k[0]}</div><div class="v">${k[1]}<span class="u">${k[2]}</span></div><div class="sub">${k[4]}</div>${k[5]||''}</div>`).join('')+`</div>`;

  // ===== УЗЕЛ СВЕРКИ: Предоплата (CRM) -> Производство (цех) =====
  // Общие цифры с дашбордом РОПа - одна точка истины для разговора продаж и цеха.
  const syncBlock=(()=>{
    const PP=DATA.prepay&&DATA.prepay.deals;
    if(!PP)return `<div class="card"><div class="card-h"><div><div class="card-t">Узел сверки: Предоплата → Производство</div><div class="card-s">появится после ближайшего снимка данных (нужен ночной сбор с обновлённым коннектором)</div></div></div></div>`;
    // сверка глобальная (сделки не несут направление) - считаем по ВСЕМ заказам, без фильтра направления
    const startedAll=IT.filter(i=>inRange(startDate(i)));
    const prepPer=PP.filter(d=>inRange(d.date));
    const prepMoney=sum(prepPer,d=>d.budget||0), startMoney=sum(startedAll,moneyOf);
    const gap=prepPer.length-startedAll.length;
    const linked=new Set(IT.map(i=>i.dealId).filter(Boolean));
    const incoming=PP.filter(d=>d.open&&/EXECUTING/.test(d.stage));
    const incMoney=sum(incoming,d=>d.budget||0);
    const stuckPaid=incoming.filter(d=>!linked.has(String(d.id)));
    const stuckMoney=sum(stuckPaid,d=>d.budget||0);
    const prepVals=(()=>{const ki={};keys.forEach((k,i)=>ki[k]=i);const v=keys.map(()=>0);PP.forEach(d=>{const k=bkey(d.date);if(k in ki)v[ki[k]]++});return v})();
    const startVals=(()=>{const ki={};keys.forEach((k,i)=>ki[k]=i);const v=keys.map(()=>0);IT.forEach(i=>{const k=bkey(startDate(i));if(k in ki)v[ki[k]]++});return v})();
    const chart=chartSVG([{name:'Предоплат получено (CRM)',c:'#A78BFA',vals:prepVals},{name:'Передано в производство (цех)',c:'#22D3EE',vals:startVals}],keys,{fmtY:v=>fmt(v)});
    const box=(lbl,n,money,col)=>`<div style="flex:1;min-width:210px;background:var(--elev);border:1px solid ${col}44;border-radius:11px;padding:12px 14px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3)">${lbl}</div><div style="font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;color:${col};margin-top:4px">${fmt(n)}</div><div style="font-size:11px;color:var(--ink4);margin-top:2px">${fmtK(money)} ₽</div></div>`;
    const pair=`<div style="display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin:6px 0 10px">
      ${box('Предоплат получено · CRM',prepPer.length,prepMoney,'#A78BFA')}
      <div style="display:flex;align-items:center;font-size:22px;color:var(--ink4)">→</div>
      ${box('Передано в производство · цех',startedAll.length,startMoney,'#22D3EE')}
      <div style="flex:1;min-width:210px;background:var(--elev);border:1px solid ${gap>0?'var(--amber)':'var(--accent)'}44;border-radius:11px;padding:12px 14px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3)">Разрыв за период</div><div style="font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;color:${gap>0?'var(--amber)':'var(--accent)'};margin-top:4px">${gap>0?'+'+fmt(gap):fmt(gap)}</div><div style="font-size:11px;color:var(--ink4);margin-top:2px">${gap>0?'оплачено больше, чем запущено':'цех запускает всё оплаченное'}</div></div>
      <div style="flex:1;min-width:210px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.45);border-radius:11px;padding:12px 14px" data-tip="Открытые сделки, стоящие СЕЙЧАС в «Предоплата получена»: деньги взяты, карточки в цех ещё не переданы. Это входящий пакет производства - РОП видит эту же цифру у себя («На подходе к цеху»). Готовься: эти заказы прилетят следующими.">
        <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--amber)">Входящий пакет · на подходе<span class="now-badge">сейчас</span></div>
        <div style="font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;color:var(--amber);margin-top:4px">${fmt(incoming.length)}</div>
        <div style="font-size:11px;color:var(--ink4);margin-top:2px">${fmtK(incMoney)} ₽ оплачено, ждёт передачи</div>
      </div>
    </div>`;
    const stuckNote=stuckPaid.length?`<div class="note" style="border-color:var(--amber)">⚠ <b style="color:var(--amber)">Оплачено, но не в цехе сейчас: ${fmt(stuckPaid.length)} сделок на ${fmtK(stuckMoney)} ₽</b> - открытые сделки в стадии «Предоплата получена» без карточки производства. Первый кандидат на разбор продажи↔цех.</div>`:'';
    return `<div class="card"><div class="card-h"><div><div class="card-t">Узел сверки: Предоплата → Производство</div><div class="card-s">⇄ <b style="color:#2DD4BF">точка стыковки с отделом продаж</b> - те же цифры в <a href="https://oliverjone01-dev.github.io/t1/rop/" target="_blank" rel="noopener">дашборде РОПа</a> · предоплата = вход сделки в «Предоплата получена» · без фильтра направления</div></div></div>${pair}${chart}${stuckNote}</div>`;
  })();

  // ===== КОНВЕЙЕР: сейчас на участке + прошло за период =====
  const conv=(()=>{
    const wipBy={},passBy={},dwBy={};
    STATIONS.forEach(([nm])=>{wipBy[nm]=0;passBy[nm]=0;dwBy[nm]=[]});
    wip.forEach(i=>{const st=stationOf(i.stageCode);if(st){wipBy[st]++;const dw=dwellNow(i);if(dw!=null)dwBy[st].push(dw)}});
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{const st=stationOf(h[0]);if(st&&!seen.has(st)&&inRange(h[1])){seen.add(st);passBy[st]++}})});
    const nodes=STATIONS.map(([nm],idx)=>{
      const isFin=nm==='Готово';
      const c=isFin?passBy[nm]:wipBy[nm],mdw=med(dwBy[nm]);
      const col=isFin?'#2E9E74':(c?tone(mdw||0):'var(--ink4)');
      return `<div class="st"><div class="node" style="border-color:${c?col:'var(--border)'};background:${c?col+'22':'var(--elev)'}">
        <div class="cnt" style="color:${c?col:'var(--ink4)'}">${c}</div>
        <div class="nm">${nm}</div>
        <div class="dw" style="color:${c?col:'var(--ink4)'}">${isFin?'за период':c?(mdw!=null?d1(mdw)+' дн':''):'транзит'}</div>
        <div class="thru">${isFin?'всего готово '+fmt(done.length):'за период: '+fmt(passBy[nm])}</div>
      </div>${idx<STATIONS.length-1?'<div class="arrow">›</div>':''}</div>`}).join('');
    return `<div class="conv">${nodes}</div><div class="legend"><span><i style="background:#2E9E74"></i>до 5 дн</span><span><i style="background:#F59E0B"></i>5-10</span><span><i style="background:#FB923C"></i>10-21</span><span><i style="background:#F43F5E"></i>21+ дн (застряло)</span><span style="color:var(--ink4)">крупное число = заказы на участке СЕЙЧАС · «за период» = входы на участок в выбранных датах · 0 у транзитных участков = сейчас пусто, поток шёл (см. «за период»)</span></div>`;
  })();

  // ===== ДИНАМИКА: запуск vs выпуск =====
  const dynFlow=chartSVG([
    {name:'Передано в производство',c:'#22D3EE',vals:seriesBy(all,startDate,keys)},
    {name:'Готово (выпуск)',c:'#2E9E74',vals:seriesBy(done,successDate,keys)},
  ],keys,{fmtY:v=>fmt(v)});

  // ===== ДИНАМИКА: WIP и зависло на конец бакета =====
  const wipVals=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;
    return all.filter(i=>{const s=startDate(i);if(!s||s>t)return false;const f=successDate(i);return !(f&&f<=t)}).length});
  const stuckVals=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;
    return all.filter(i=>{const s=startDate(i);if(!s||s>t)return false;const f=successDate(i);if(f&&f<=t)return false;
      let last=s;(i.hist||[]).forEach(h=>{if(h[1]&&h[1]<=t&&h[1]>last)last=h[1]});return days(last,t)>14}).length});
  const dynWip=chartSVG([
    {name:'В производстве (на конец периода)',c:'#F59E0B',vals:wipVals,area:true},
    {name:'из них зависло >14 дн',c:'#F43F5E',vals:stuckVals},
  ],keys,{fmtY:v=>fmt(v)});

  // ===== ДИНАМИКА: средний срок готовых =====
  const cycVals=keys.map(k=>{const arr=done.filter(i=>bkey(successDate(i))===k).map(cycleOf).filter(x=>x!=null&&x>=0);return arr.length?med(arr):null});
  const dynCyc=chartSVG([{name:'Медиана срока производства готовых, дн',c:'#A78BFA',vals:cycVals}],keys,{fmtY:v=>d1(v)});

  // ===== ДИНАМИКА: деньги запуска =====
  const dynMoney=chartSVG([{name:'Запущено в производство, ₽ (суммы сделок)',c:'#22D3EE',vals:seriesBy(all,startDate,keys,moneyOf),type:'bar'}],keys,{});

  // ===== ПРОХОДИМОСТЬ УЧАСТКОВ: центрированная воронка =====
  // ширина = доля заказов через участок · цвет = медиана времени НА участке (перегруз краснеет)
  const flowBlock=(()=>{
    const base=cut.length?cut:[];
    const total=base.length||1;
    const stayBy={};STATIONS.forEach(([nm])=>stayBy[nm]=[]);
    base.forEach(i=>{const h=i.hist||[];
      for(let j=0;j<h.length;j++){const st=stationOf(h[j][0]);if(!st)continue;
        const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);
        const dur=end!=null?days(h[j][1],end):null;
        if(dur!=null&&dur>=0)stayBy[st].push(dur)}});
    const rows=STATIONS.map(([nm])=>{
      const passed=base.filter(i=>(i.hist||[]).some(h=>stationOf(h[0])===nm)).length;
      let c=0,dws=[];wip.forEach(i=>{if(stationOf(i.stageCode)===nm){c++;const d=dwellNow(i);if(d!=null)dws.push(d)}});
      return {nm,passed,stay:med(stayBy[nm]),wc:c,wm:med(dws)}});
    const body=rows.map(r=>{
      const share=r.passed/total, isFin=r.nm==='Готово';
      const col=isFin?'#2E9E74':(r.passed?tone(r.stay||0):'#3a4450');
      const wpct=Math.max(share*100,r.passed?6:1.2).toFixed(1);
      const inTxt=share>=0.12?`${fmt(r.passed)} · ${pct0(share)}`:(r.passed?fmt(r.passed):'');
      // циферблат: сегмент = доля медианного времени участка от полного цикла производства
      const cycMed=med(finished.map(cycleOf).filter(x=>x!=null&&x>=0))||1;
      const frac=Math.max(0,Math.min(1,(r.stay||0)/cycMed));
      const RR=12,CC=2*Math.PI*RR,dcol=r.passed?tone(r.stay||0):'#3a4450';
      const dialTd=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Медиана на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Доля полного цикла (${d1(cycMed)} дн)</span><span>${pct(frac)}</span></div>`);
      const dial=`<svg width="30" height="30" viewBox="0 0 30 30" style="flex:none"><circle cx="15" cy="15" r="${RR}" fill="none" stroke="var(--elev)" stroke-width="5"/><circle cx="15" cy="15" r="${RR}" fill="none" stroke="${dcol}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(frac*CC).toFixed(1)} ${CC.toFixed(1)}" transform="rotate(-90 15 15)"/></svg>`;
      const stTxt=isFin?`<span style="color:var(--ink4);font-size:11px">выпуск за период</span>`:(r.passed
        ?`<span class="fun-dial" data-tip="${dialTd}">${dial}<b style="color:${dcol}">${d1(r.stay)} дн</b> <span style="color:var(--ink4)">· ${pct0(frac)} цикла</span></span>`
        :`<span style="color:var(--ink4);font-size:11px">не используется</span>`);
      const td=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Прошло за период</span><span>${fmt(r.passed)} из ${fmt(total)} (${pct(share)})</span></div><div class='tr'><span>Медиана времени на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Сейчас на участке</span><span>${r.wc}${r.wm!=null?' · лежат '+d1(r.wm)+' дн':''}</span></div>`);
      return `<div class="fun-row">
        <div class="fun-nm">${r.nm}</div>
        <div class="fun-tr"><div class="fun-bar" data-tip="${td}" style="width:${wpct}%;background:${col}26;border:1px solid ${col};color:${col}">${inTxt}</div></div>
        <div class="fun-st">${stTxt}</div>
      </div>`}).join('');
    return `${body}<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 5 дн)</span><span><i style="background:#F59E0B"></i>5-10 дн</span><span><i style="background:#FB923C"></i>10-21 дн</span><span><i style="background:#F43F5E"></i>21+ дн (перегруз)</span></div><div class="note">Воронка по участкам: ширина = сколько заказов периода (${modeLbl}: <b>${fmt(total)}</b> шт) проходит через участок, цвет = медиана времени на участке. Широкая и красная = перегруз, время растёт. Узкая = недогруз, участок простаивает. Заказ идёт только по нужным участкам, поэтому ширины не обязаны убывать сверху вниз.</div>`;
  })();

  // ===== УЧАСТКИ таблица =====
  const stTable=(()=>{
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const w=wip.filter(i=>stationOf(i.stageCode)===nm),dws=w.map(dwellNow).filter(x=>x!=null),m=med(dws),mx=dws.length?Math.max(...dws):0;
      let pass=0;all.forEach(i=>{if((i.hist||[]).some(h=>stationOf(h[0])===nm&&inRange(h[1])))pass++});
      return {nm,wip:w.length,m,mx,pass}}).sort((a,b)=>b.wip-a.wip||(b.m||0)-(a.m||0));
    const body=rows.map(r=>`<tr><td class="nm">${r.nm}</td><td>${r.wip}</td><td style="color:${tone(r.m||0)};font-weight:700">${r.m!=null?d1(r.m)+' дн':'—'}</td><td>${r.mx?r.mx+' дн':'—'}</td><td>${fmt(r.pass)}</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Участок</th><th>В работе сейчас</th><th>Медиана срока</th><th>Макс</th><th>Прошло за период</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // ===== ДОРАБОТКИ =====
  const reworkBlock=(()=>{
    const map={};STATIONS.forEach(([nm])=>map[nm]=0);let tot=0;
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{if(REWORK.has(h[0])&&inRange(h[1])){const st=stationOf(h[0]);if(st&&!seen.has(st)){seen.add(st);map[st]++;tot++}}})});
    const rows=Object.entries(map).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
    const mx=rows.length?rows[0][1]:1;
    const body=rows.map(([nm,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><div style="width:110px;font-size:12px;color:var(--ink2);text-align:right">${nm}</div><div class="hbar" style="flex:1"><i style="width:${(c/mx*100).toFixed(0)}%;background:#FB923C"></i></div><div style="width:34px;font-weight:700;font-size:12px">${c}</div></div>`).join('')||'<div class="card-s">возвратов на доработку в выбранном периоде не зафиксировано</div>';
    return `<div>${body}</div><div class="note">Доработка/Перекрас = заказы, возвращавшиеся на участок повторно (в выбранном периоде). Всего событий: <b>${tot}</b>. Высокий столбец = проблемный участок по качеству.</div>`;
  })();

  // ===== МЕНЕДЖЕРЫ: запуски (шт и ₽) + просчёты (потенциал производства) =====
  const mgrBlock=(()=>{
    const m={};cut.forEach(i=>{const n=mgrOf(i);(m[n]=m[n]||{n,tot:0,done:0,wip:0,cyc:[],sum:0});
      m[n].tot++;if(isDone(i))m[n].done++;if(isWip(i))m[n].wip++;
      const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c);
      m[n].sum+=moneyOf(i)});
    // просчёты: открытые сделки на стадиях расчёта (снимок «сейчас», приходит из fetch-prod)
    const QT=(DATA.quotes&&DATA.quotes.deals)||null;
    const q={};let qTot=0,qSum=0;
    if(QT)QT.forEach(d=>{const n=d.mgr||'—';(q[n]=q[n]||{cnt:0,sum:0});q[n].cnt++;q[n].sum+=d.budget||0;qTot++;qSum+=d.budget||0;
      if(!m[n])m[n]={n,tot:0,done:0,wip:0,cyc:[],sum:0}});
    const rows=Object.values(m).sort((a,b)=>b.sum-a.sum||((q[b.n]||{}).sum||0)-((q[a.n]||{}).sum||0));
    const totS=sum(rows,r=>r.sum);
    const body=rows.slice(0,16).map(r=>{const qq=q[r.n];
      return `<tr><td class="nm">${esc(r.n)}</td><td><b>${r.tot}</b></td><td><b>${fmtK(r.sum)} ₽</b></td><td style="color:var(--ink4)">${totS?pct(r.sum/totS):'—'}</td><td>${r.done}</td>
      <td style="color:${tone(med(r.cyc)||0)}">${med(r.cyc)!=null?d1(med(r.cyc))+' дн':'—'}</td>
      <td style="color:${qq?'var(--cyan)':'var(--ink4)'}">${qq?qq.cnt:QT?0:'—'}</td>
      <td style="color:${qq?'var(--cyan)':'var(--ink4)'};font-weight:${qq?700:400}">${qq?fmtK(qq.sum)+' ₽':QT?'0 ₽':'—'}</td></tr>`}).join('');
    const qNote=QT
      ?`Просчёты<span class="now-badge">сейчас</span> = открытые сделки на стадиях Расчёт / Формирование ТЗ / КП отправлено / Принимают решение / Долгострой: потенциал цеха <b>${fmt(qTot)}</b> сделок на <b>${fmtK(qSum)} ₽</b>. Снимок текущего момента, на фильтр периода не реагирует.`
      :`Просчёты появятся после ближайшего снимка данных (нужен ночной сбор с обновлённым коннектором).`;
    return `<table class="tbl"><thead><tr><th>Менеджер</th><th>Запусков</th><th>Запуски ₽</th><th>Доля ₽</th><th>Готово</th><th>Ср.срок</th><th>Просчёты</th><th>Потенциал ₽</th></tr></thead><tbody>${body}</tbody></table><div class="note">Менеджер = ответственный связанной сделки (${modeLbl}). Запуски ₽ = бюджеты сделок, привязанных к заказам производства. Без привязки к сделке: <b>${fmt(cut.filter(i=>!i.dealId).length)}</b> из ${fmt(cut.length)}. ${qNote}</div>`;
  })();

  // ===== ЧТО ПРОИЗВОДИМ: два бублика =====
  const mixBlock=(()=>{
    const base=cut;
    const by=(key)=>{const m={};base.forEach(i=>{const v=i[key]||'не указано';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    const PAL=['#22D3EE','#2E9E74','#A78BFA','#F59E0B','#F43F5E','#38BDF8','#10B981','#FB923C'];
    if(!base.length)return '<div class="card-s">нет заказов в выбранном периоде</div>';
    return `<div class="grid2"><div><div class="card-s" style="margin-bottom:8px">По ассортименту</div>${donut(by('assort'),base.length,PAL,'заказов')}</div><div><div class="card-s" style="margin-bottom:8px">По направлению бренда</div>${donut(by('dir'),base.length,PAL,'заказов')}</div></div>`;
  })();

  // ===== КОНСТРУКТОРЫ =====
  const consTable=(()=>{
    const m={};cut.forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].tot++;if(isDone(i))m[n].done++;const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c);m[n].sum+=moneyOf(i);if((i.hist||[]).some(h=>REWORK.has(h[0])))m[n].rew++});
    const rows=Object.values(m).sort((a,b)=>b.tot-a.tot).slice(0,12);
    const body=rows.map(r=>`<tr><td class="nm">${esc(r.n)}</td><td>${r.tot}</td><td>${r.done}</td><td style="color:${tone(med(r.cyc)||0)}">${med(r.cyc)!=null?d1(med(r.cyc))+' дн':'—'}</td><td>${r.rew}</td><td>${r.tot?fmtK(r.sum/r.tot):'—'} ₽</td><td>${fmtK(r.sum)} ₽</td></tr>`).join('')||'<tr><td colspan="7" class="card-s">нет заказов в периоде</td></tr>';
    return `<table class="tbl"><thead><tr><th>Конструктор</th><th>Заказов</th><th>Готово</th><th>Ср.срок</th><th>Доработок</th><th>Ср.чек</th><th>Сумма</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // ===== КОНСТРУКТОРЫ: профиль по чекам (что берёт и как быстро делает) =====
  const consScatter=(()=>{
    const pts=cut.filter(i=>isDone(i)&&moneyOf(i)>0).map(i=>({b:moneyOf(i),c:cycleOf(i),n:i.constructor||'—'})).filter(p=>p.c!=null&&p.c>=0);
    if(pts.length<5)return '<div class="card-s">мало готовых заказов с чеком в периоде</div>';
    const BK=[['Дешёвые · до 100 тыс',0,1e5],['Средние · 100-300 тыс',1e5,3e5],['Дорогие · от 300 тыс',3e5,Infinity]];
    const bkOf=b=>BK.findIndex(([,a,z])=>b>=a&&b<z);
    const m={};pts.forEach(p=>{(m[p.n]=m[p.n]||{n:p.n,tot:0,sum:0,bk:[[],[],[]]});m[p.n].tot++;m[p.n].sum+=p.b;m[p.n].bk[bkOf(p.b)].push(p)});
    const rows=Object.values(m).sort((a,b)=>b.tot-a.tot).slice(0,10);
    const allRow={n:'Все конструкторы',tot:pts.length,sum:sum(pts,p=>p.b),bk:[[],[],[]]};
    pts.forEach(p=>allRow.bk[bkOf(p.b)].push(p));
    const cell=(r,k)=>{const arr=r.bk[k];if(!arr.length)return `<div class="pr-cell"><span style="color:var(--ink4)">—</span></div>`;
      const share=arr.length/r.tot, mc=med(arr.map(p=>p.c)), col=toneC(mc||0), money=sum(arr,p=>p.b);
      const td=attr(`<div class='tl'>${esc(r.n)} · ${BK[k][0]}</div><div class='tr'><span>Заказов</span><span>${fmt(arr.length)} (${pct(share)} его заказов)</span></div><div class='tr'><span>Медиана срока</span><span>${d1(mc)} дн</span></div><div class='tr'><span>Деньги</span><span>${fmtK(money)} ₽</span></div>`);
      return `<div class="pr-cell" data-tip="${td}"><i style="width:${Math.max(share*100,4).toFixed(1)}%;background:${col}30;border-right:2px solid ${col}"></i><span><b style="color:${col}">${arr.length} шт</b>&nbsp;· ${d1(mc)} дн&nbsp;<span style="color:var(--ink3)">· ${fmtK(money)} ₽</span></span></div>`};
    const row=(r,hl)=>`<div class="pr-row"${hl?' style="border-bottom:1px solid var(--border2);padding-bottom:10px;margin-bottom:4px"':''}>
      <div class="pr-nm"${hl?' style="color:var(--ink3)"':''}>${esc(r.n)}</div>${cell(r,0)}${cell(r,1)}${cell(r,2)}
      <div class="pr-tot"><b>${r.tot}</b> шт · <b>${fmtK(r.sum)}</b> ₽</div></div>`;
    const head=`<div class="pr-row" style="margin-bottom:2px"><div></div>${BK.map(([l])=>`<div class="pr-head">${l}</div>`).join('')}<div class="pr-head" style="text-align:right">Итого</div></div>`;
    return head+row(allRow,true)+rows.map(r=>row(r)).join('')+
      `<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 15 дн)</span><span><i style="background:#F59E0B"></i>15-25 дн</span><span><i style="background:#FB923C"></i>25-40 дн</span><span><i style="background:#F43F5E"></i>40+ дн (возится)</span></div>`+
      `<div class="note">Читается по строке: <b>длина полосы</b> = какую долю своих заказов конструктор берёт в этой ценовой категории (чаще берёт - длиннее), <b>цифра и цвет</b> = сколько штук и медиана срока (краснее - дольше возится). Пример: длинная полоса в «Дешёвых» + красный срок = берёт дешёвые и долго делает; короткая полоса в «Дорогих» + зелёный срок = дорогие делает быстро, но берёт их редко. Деньги в ячейке = сумма сделок этой категории у конструктора: где больше ₽ и краснее срок - туда приоритет, это дорогая очередь. Первая строка - средняя картина по цеху для сравнения.</div>`;
  })();

  const perLbl=`${S.from.split('-').reverse().join('.')} - ${S.to.split('-').reverse().join('.')}`;
  document.getElementById('root').innerHTML=
    `<div class="sec"><div class="n">1</div><h2>Производство</h2><div class="ln"></div><div class="hint">период: <b>${perLbl}</b>${S.dir?' · '+S.dir:''} · метки «сейчас» = моментальный снимок, остальное = за период</div></div>`+kpis+
    syncBlock+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конвейер производства</div><div class="card-s">крупное число = заказы на участке СЕЙЧАС · цвет и «дн» = медиана лежания · «за период» = сколько входов на участок в выбранных датах. Крупный красный узел = узкое горло, туда мощности.</div></div></div>${conv}</div>`+
    `<div class="grid2">`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Запуск vs выпуск</div><div class="card-s">синяя = передано в производство, зелёная = готово. Синяя стабильно выше - незавершёнка копится, цех не успевает.</div></div></div>${dynFlow}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Незавершёнка и заторы</div><div class="card-s">оранжевая = сколько заказов было в производстве на конец каждого периода, красная = из них без движения >14 дн. Рост красной = копятся заторы.</div></div></div>${dynWip}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Средний срок производства</div><div class="card-s">медиана «запуск → готово» по заказам, готовым в каждом периоде. Рост = производим медленнее.</div></div></div>${dynCyc}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Запуск в деньгах</div><div class="card-s">суммы сделок по заказам, переданным в производство в каждом периоде.</div></div></div>${dynMoney}</div>`+
    `</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Проходимость участков</div><div class="card-s">сколько заказов периода проходит через каждый участок - в штуках и долях · справа циферблат: сколько времени (по медиане) заказ тратит на участке и какая это доля полного цикла</div></div></div>${flowBlock}</div>`+
    `<div class="sec"><div class="n">2</div><h2>Участки</h2><div class="ln"></div><div class="hint">где заказы лежат дольше всего и где страдает качество</div></div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Скорость по участкам</div><div class="card-s">в работе сейчас + медиана/макс срока лежания · красное = застряли</div></div></div>${stTable}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Доработки и перекрас (качество)</div><div class="card-s">возвраты на участок повторно в выбранном периоде - индикатор брака</div></div></div>${reworkBlock}</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Что производим</div><div class="card-s">структура заказов (${modeLbl}) · «не указано» = дыра в заполнении карточек</div></div></div>${mixBlock}</div>`+
    `<div class="sec"><div class="n">3</div><h2>Сотрудники</h2><div class="ln"></div><div class="hint">кто заводит объём и кто его производит</div></div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Менеджеры: запуски и просчёты</div><div class="card-s">запуски производства в штуках и деньгах (${modeLbl}) + просчёты как потенциал цеха</div></div></div>${mgrBlock}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конструкторы</div><div class="card-s">объём, готово, срок, доработки, средний чек, сумма (${modeLbl})</div></div></div>${consTable}</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конструкторы: чек vs срок</div><div class="card-s">кто берёт дешёвые заказы и долго возится, а кто делает дорогие быстро · готовые заказы периода</div></div></div>${consScatter}</div>`;
  document.getElementById('periodLabel').textContent=perLbl;
  wireCharts();

  // freshness
  const fr=document.getElementById('fresh');
  if(DATA.generatedAt){const g=new Date(DATA.generatedAt),m=new Date(g.getTime()+3*36e5),p=n=>String(n).padStart(2,'0');
    const ageH=(new Date()-g)/36e5,col=ageH>48?'#F43F5E':ageH>30?'#F59E0B':'#2E9E74';
    fr.textContent='данные на '+p(m.getUTCDate())+'.'+p(m.getUTCMonth()+1)+' '+p(m.getUTCHours())+':'+p(m.getUTCMinutes())+' МСК';fr.style.color=col}
}

// ===== подсказки (как в РОП): плавающий тултип + вертикальный пунктир на графиках =====
const tipEl=document.getElementById('tip');
function tipShow(html,x,y){tipEl.innerHTML=html;tipEl.style.opacity=1;let nx=x+14,ny=y+14;
  if(nx+tipEl.offsetWidth>innerWidth)nx=x-tipEl.offsetWidth-14;if(ny+tipEl.offsetHeight>innerHeight)ny=y-tipEl.offsetHeight-14;
  tipEl.style.left=nx+'px';tipEl.style.top=ny+'px'}
function tipHide(){tipEl.style.opacity=0}
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t)tipShow(t.getAttribute('data-tip'),e.clientX,e.clientY);else tipHide()});
function wireCharts(){document.querySelectorAll('svg.xh-chart').forEach(svg=>{const xh=svg.querySelector('.xhair');if(!xh)return;
  svg.querySelectorAll('rect[data-cx]').forEach(r=>r.addEventListener('mousemove',()=>{const cx=r.getAttribute('data-cx');xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity','0.5')}));
  svg.addEventListener('mouseleave',()=>xh.setAttribute('opacity','0'))})}

// ===== контролы =====
function segWire(id,key){const seg=document.getElementById(id);seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S[key]=b.dataset.v;
  if(key==='preset'){applyPreset(b.dataset.v)}render()})}
function applyPreset(v){if(v==='all'){S.from=MIND;S.to=NOWS}else{const n=+v;const a=new Date(NOW-(n-1)*864e5);S.from=iso(a);S.to=NOWS}
  document.getElementById('dFrom').value=S.from;document.getElementById('dTo').value=S.to}
(function init(){
  // направления из данных
  const dirs=[...new Set(IT.map(i=>i.dir).filter(v=>v&&v!=='не указано'))].sort();
  const sel=document.getElementById('dirSel');
  dirs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});
  sel.addEventListener('change',()=>{S.dir=sel.value;render()});
  segWire('modeSeg','mode');segWire('granSeg','gran');segWire('presetSeg','preset');
  const df=document.getElementById('dFrom'),dt=document.getElementById('dTo');
  df.value=S.from;dt.value=S.to;
  document.getElementById('applyCustom').addEventListener('click',()=>{
    if(df.value)S.from=df.value;if(dt.value)S.to=dt.value;
    if(S.from>S.to){const t=S.from;S.from=S.to;S.to=t;df.value=S.from;dt.value=S.to}
    document.querySelectorAll('#presetSeg button').forEach(x=>x.classList.remove('on'));render()});
  render();
})();
</script></body></html>
