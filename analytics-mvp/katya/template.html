  return `${d.getUTCDate()}.${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCFullYear()).slice(2)}`;
}
// Чип периодов в топбаре (показывается только в режиме сравнения)
function renderCompareChip(){
  const el = $('#cmp-topchip'); if(!el) return;
  const c = state.compare;
  if(!c.active){ el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = `
    <span class="cmp-chip-badge a">А</span><span class="cmp-chip-dates">${fmtDateShort(c.aFrom)}–${fmtDateShort(c.aTo)}</span>
    <span class="cmp-chip-vs">vs</span>
    <span class="cmp-chip-badge b">Б</span><span class="cmp-chip-dates">${fmtDateShort(c.bFrom)}–${fmtDateShort(c.bTo)}</span>`;
  el.classList.add('show');
}

function renderRevenueCompare(){
  const c = state.compare;
  if(!(c.metrics instanceof Set)) c.metrics = new Set(['rev']);
  if(c.metrics.size === 0) c.metrics.add('rev');
  const M = c.metrics;

  // Метрики. rev=столбцы(млн,лево); cost/comm=линии(млн,лево); margin=линия(%,право); ord=линия(шт,право).
  // comm — нет источника → «нет данных».
  const META = {
    rev:    {label:'Выручка',        unit:'млн ₽', axis:'left',  color:'#A78BFA'},
    cost:   {label:'Себестоимость',  unit:'млн ₽', axis:'left',  color:'#F97316'},
    comm:   {label:'Комиссия',       unit:'млн ₽', axis:'left',  color:'#D9A441', noData:true},
    margin: {label:'Рентабельность', unit:'%',     axis:'right', color:'#34D399'},
    ord:    {label:'Заказы',         unit:'шт',    axis:'right', color:'#F43F5E'},
  };

  // Данные по подкатегориям для А и Б
  const cats = [];
  CAT_TREE.forEach(g => { if(g.id === 'g_other') return;   // «Прочее» (услуги/материалы) исключаем из сравнения структуры
    g.children.forEach(sub => {
    const revA = sumRangeDates(DAILY_REV_CAT[sub.id], c.aFrom, c.aTo);
    const revB = sumRangeDates(DAILY_REV_CAT[sub.id], c.bFrom, c.bTo);
    const ordA = sumRangeDates(DAILY_ORD_CAT[sub.id], c.aFrom, c.aTo);
    const ordB = sumRangeDates(DAILY_ORD_CAT[sub.id], c.bFrom, c.bTo);
    const m = SUBCAT_MARGIN[sub.id] ?? 35;
    cats.push({ id:sub.id, full:sub.name, label: sub.name.length>15 ? sub.name.slice(0,14)+'…' : sub.name,
      rev:{A:revA,B:revB}, cost:{A:revA*(1-m/100),B:revB*(1-m/100)}, comm:{A:0,B:0}, margin:{A:m,B:m}, ord:{A:ordA,B:ordB} });
    });
  });
  cats.sort((x,y) => Math.max(y.rev.A,y.rev.B) - Math.max(x.rev.A,x.rev.B));
  const n = cats.length, labels = cats.map(x => x.label);

  const leftKeys  = ['cost'].filter(k => M.has(k));               // линии слева (млн), без rev(столбцы)/comm(нет данных)
  const rightKeys = ['margin','ord'].filter(k => M.has(k));
  const showBars  = M.has('rev');
  const commActive= M.has('comm');

  // геометрия
  const w = 1100, h = 450, padL = 56, padR = 56, padB = 86, padT = 30;
  const cw = w - padL - padR, chH = h - padT - padB, dx = cw / n;

  // левая шкала (млн ₽): учитывает столбцы Выручки и линию Себестоимости
  let leftMax = 0;
  if(showBars) cats.forEach(x => { leftMax = Math.max(leftMax, x.rev.A, x.rev.B); });
  leftKeys.forEach(k => cats.forEach(x => { leftMax = Math.max(leftMax, x[k].A, x[k].B); }));
  const hasLeft = showBars || leftKeys.length > 0;
  leftMax = niceRoundUp(Math.max(leftMax, 0.001) * 1.18);
  const yL = v => padT + chH - (v/leftMax)*chH;

  // правые шкалы — у каждой метрики своя нормировка
  const rMax = {};
  rightKeys.forEach(k => { let mx=0; cats.forEach(x=>{mx=Math.max(mx,x[k].A,x[k].B);});
    rMax[k] = k==='margin' ? Math.max(20, Math.ceil(mx*1.15/10)*10) : niceRoundUp(Math.max(mx,1)*1.18); });
  const yR = (v,k) => padT + chH - (v/(rMax[k]||1))*chH;
  const primaryRight = rightKeys.includes('ord') ? 'ord' : (rightKeys.includes('margin') ? 'margin' : null);

  // сетка + левая ось
  const gridY = [0,1,2,3,4].map(i => {
    const v = leftMax*(1-i/4), y = padT + chH*(i/4);
    return `<line x1="${padL}" y1="${y}" x2="${padL+cw}" y2="${y}" stroke="#1A2029" stroke-width="1"/>`+
      (hasLeft?`<text x="${padL-10}" y="${y+4}" text-anchor="end" font-family="Inter" font-size="11" fill="#6A7484">${fmt(v, v>=10?0:1)}</text>`:'');
  }).join('');
  let rAxis = '';
  if(primaryRight){
    rAxis = [0,0.25,0.5,0.75,1].map(f => {
      const v=(rMax[primaryRight])*f, y=padT+chH-f*chH;
      const lbl = primaryRight==='margin' ? `${Math.round(v)}%` : fmt0(v);
      return `<text x="${padL+cw+8}" y="${y+4}" text-anchor="start" font-family="Inter" font-size="10" fill="${META[primaryRight].color}">${lbl}</text>`;
    }).join('');
  }

  // центры колонок (нужны и столбцам, и линиям)
  const centers = []; for(let i=0;i<n;i++) centers.push(padL + i*dx + dx/2);

  // столбцы Выручки
  let bars = '';
  if(showBars){
    const slotW=dx*0.7, barGap=Math.max(1,dx*0.08), barW=(slotW-barGap)/2;
    bars = cats.map((x,i) => {
      const va=x.rev.A, vb=x.rev.B, cellX=padL+i*dx+(dx-slotW)/2, aX=cellX, bX=cellX+barW+barGap;
      const aTop=yL(va), bTop=yL(vb), aH=Math.max(1,yL(0)-aTop), bH=Math.max(1,yL(0)-bTop);
      const d = va>0.001?(vb/va-1)*100:null, dTxt=d===null?'—':`${d>=0?'+':''}${fmt(d,1)}%`;
      return `<g>
        <rect class="anim-bar" style="animation-delay:${0.18+i*0.025}s" x="${aX}" y="${aTop}" width="${barW}" height="${aH}" rx="2" fill="rgba(167,139,250,.55)" stroke="rgba(167,139,250,.85)" stroke-width="1" data-tip="${x.full}|Выручка А|${fmt(va,1)} млн ₽"/>
        <rect class="anim-bar" style="animation-delay:${0.24+i*0.025}s" x="${bX}" y="${bTop}" width="${barW}" height="${bH}" rx="2" fill="url(#barB)" data-tip="${x.full}|Выручка Б|${fmt(vb,1)} млн ₽|Выручка А|${fmt(va,1)} млн ₽|Δ (Б−А)/А|${dTxt}"/>
        <text x="${(aX+barW/2).toFixed(1)}" y="${(aTop-4).toFixed(1)}" text-anchor="middle" font-family="Manrope" font-size="8" font-weight="700" fill="#C9B6F0" class="anim-fill" style="animation-delay:${0.9+i*0.025}s">${fmt(va,1)}</text>
        <text x="${(bX+barW/2).toFixed(1)}" y="${(bTop-4).toFixed(1)}" text-anchor="middle" font-family="Manrope" font-size="8" font-weight="700" fill="#7DE6F5" class="anim-fill" style="animation-delay:${0.95+i*0.025}s">${fmt(vb,1)}</text>
      </g>`;
    }).join('');
  }
  // подписи категорий
  const xLabels = cats.map((x,i) => { const cx=centers[i], lblY=padT+chH+16;
    return `<text x="${cx}" y="${lblY}" text-anchor="end" font-family="Inter" font-size="9.5" fill="#A0AAB8" transform="rotate(-32, ${cx}, ${lblY})">${labels[i]}</text>`;
  }).join('');

  // линии (А сплошная, Б пунктир)
  const mkLine = (key, dashed, delay) => {
    const meta=META[key], side=meta.axis, yf = v => side==='left' ? yL(v) : yR(v,key);
    const uf = key==='margin' ? (v=>fmt(v,1)+'%') : key==='ord' ? (v=>fmt0(v)+' шт') : (v=>fmt(v,1)+' млн ₽');
    const pts = centers.map((cx,i) => `${cx.toFixed(1)},${yf(cats[i][key][dashed?'B':'A']).toFixed(1)}`).join(' ');
    const dots = centers.map((cx,i) => { const v=cats[i][key][dashed?'B':'A'];
      return `<circle cx="${cx.toFixed(1)}" cy="${yf(v).toFixed(1)}" r="3" fill="${dashed?'#0B0F15':meta.color}" stroke="${meta.color}" stroke-width="${dashed?2:1.4}" data-tip="${cats[i].full}|${meta.label} ${dashed?'Б':'А'}|${uf(v)}"/>`;
    }).join('');
    return `<polyline class="anim-fill" style="animation-delay:${delay}s" points="${pts}" fill="none" stroke="${meta.color}" stroke-width="2.1" ${dashed?'stroke-dasharray="6 4"':''} stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  };
  const lineKeys = [...leftKeys, ...rightKeys]; // cost, margin, ord (comm исключён — нет данных)
  let lines = ''; lineKeys.forEach((k,idx) => { lines += mkLine(k,false,0.85+idx*0.05) + mkLine(k,true,0.92+idx*0.05); });

  // легенда
  const legendItems = [];
  if(showBars) legendItems.push(`<span class="pf-legend-item"><span class="pf-leg-plan"></span>Выручка А</span>`,`<span class="pf-legend-item"><span class="pf-leg-fact"></span>Выручка Б</span>`);
  lineKeys.forEach(k => {
    legendItems.push(`<span class="pf-legend-item"><span style="display:inline-block;width:18px;height:0;border-top:2.4px solid ${META[k].color}"></span>${META[k].label} А</span>`);
    legendItems.push(`<span class="pf-legend-item"><span style="display:inline-block;width:18px;height:0;border-top:2.4px dashed ${META[k].color}"></span>${META[k].label} Б, ${META[k].unit}</span>`);
  });

  // сводка по активным метрикам
  const aggTxt = (key) => {
    if(META[key].noData) return `${META[key].label}: <b style="color:var(--ink-3)">нет данных</b>`;
    let aA,aB,ff;
    if(key==='margin'){ const rA=cats.reduce((s,x)=>s+x.rev.A,0), rB=cats.reduce((s,x)=>s+x.rev.B,0);
      aA=rA>0?cats.reduce((s,x)=>s+x.rev.A*x.margin.A,0)/rA:0; aB=rB>0?cats.reduce((s,x)=>s+x.rev.B*x.margin.B,0)/rB:0; ff=v=>fmt(v,1)+' %';
    } else if(key==='ord'){ aA=cats.reduce((s,x)=>s+x.ord.A,0); aB=cats.reduce((s,x)=>s+x.ord.B,0); ff=v=>fmt0(v)+' шт';
    } else { aA=cats.reduce((s,x)=>s+x[key].A,0); aB=cats.reduce((s,x)=>s+x[key].B,0); ff=v=>fmt(v,1)+' млн ₽'; }
    const d = aA>0?(aB-aA)/aA*100:null;
    const chip = d===null?'':`<span class="cmp-d ${d>=0?'good':'bad'}">${d>=0?'▲':'▼'}${d>=0?'+':'−'}${fmt(Math.abs(d),1)}%</span>`;
    return `${META[key].label}: <b>${ff(aA)}</b> → <b>${ff(aB)}</b> ${chip}`;
  };
  const summary = ['rev','cost','comm','margin','ord'].filter(k=>M.has(k)).map(k=>`<div>${aggTxt(k)}</div>`).join('<div class="cl-summary-sep"></div>');

  const tg = (k) => `<button class="mx-tg ${M.has(k)?'active':''}" data-cmp-metric="${k}">${META[k].label}</button>`;

  $('#planfact').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">Структура продаж</div>
        <div class="card-sub">сравнение А vs Б · переключай метрики — рисуются на одном графике (Выручка — столбцы, остальное — линии: А сплошная, Б пунктир)</div>
        <div class="mx-toggle" style="margin-top:8px">${tg('rev')}${tg('cost')}${tg('comm')}${tg('margin')}${tg('ord')}</div>
      </div>
      <div class="cl-summary" style="flex-wrap:wrap;gap:6px 10px;max-width:580px;justify-content:flex-end">${summary}</div>
    </div>
    <div class="pf-legend" style="flex-wrap:wrap;gap:8px 16px">${legendItems.join('')}</div>
    <svg viewBox="0 0 ${w} ${h}" class="pf-svg" preserveAspectRatio="xMidYMid meet" style="height:${h}px;width:100%">
      <defs><linearGradient id="barB" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0.85"/></linearGradient></defs>
      ${gridY}${rAxis}${bars}${xLabels}${lines}
      ${commActive ? `<text x="${padL+cw/2}" y="${padT+14}" text-anchor="middle" font-family="Inter" font-size="11" fill="#D9A441">Комиссия — нет источника (нет данных)</text>` : ''}
    </svg>
  `;
  ['#drill','#abcxyz','#seasonality','#profitability'].forEach(sel => { const el = $(sel); if(el) el.style.display = 'none'; });
}

function renderPlanFact(){
  if(state.compare.active){ return renderRevenueCompare(); }
  ['#drill','#abcxyz','#seasonality','#profitability'].forEach(sel => { const el = $(sel); if(el) el.style.display = ''; });
  const series = getPlanFactSeries();
  const facts = series.facts;
  const labels = series.labels;
  const planPerPoint = series.planPerPoint;
  const granularity = series.granularity;
  const n = facts.length;

  const totalFact = facts.reduce((s,v) => s + v, 0);
  const totalPlan = planPerPoint * n;

  const w = 1100, h = 280, padL = 56, padR = 30, padB = 56;
  // Верхний паддинг увеличиваем когда подписи повёрнуты (n >= 26)
  const padT = facts.length >= 26 ? 56 : 30;
  const cw = w - padL - padR, chH = h - padT - padB;
  const maxV = Math.max(...facts, planPerPoint) * 1.20;
  const dx = cw / Math.max(n, 1);
  const yScale = v => padT + chH - (v / maxV) * chH;

  // Адаптивная гранулярность: при N≥20 точек — упрощаем подписи и не показываем % над парой
  const dense = n >= 20;
  const veryDense = n >= 30;
  // Сколько подписей по X показывать
  const labelStep = n <= 14 ? 1 : (n <= 30 ? Math.ceil(n/10) : Math.ceil(n/8));

  const gridY = [0,1,2,3,4].map(i => {
    const v = maxV * (1 - i/4);
    const y = padT + chH * (i/4);
    const decimals = granularity === 'day' ? 2 : (granularity === 'week' ? 1 : 0);
    return `<line x1="${padL}" y1="${y}" x2="${padL+cw}" y2="${y}" stroke="#1A2029" stroke-width="1"/><text x="${padL-10}" y="${y+4}" text-anchor="end" font-family="Inter" font-size="11" font-weight="500" fill="#6A7484">${fmt(v, decimals)}</text>`;
  }).join('');

  // Парные бары
  const barGap = Math.max(1, dx * (veryDense ? 0.04 : 0.08));
  const slotW = dx * (veryDense ? 0.88 : 0.7);
  const barW = (slotW - barGap) / 2;
  const decimalsForBar = granularity === 'day' ? 2 : (granularity === 'week' ? 1 : 1);

  const bars = facts.map((v, i) => {
    const cellX = padL + i*dx + (dx - slotW)/2;
    const planX = cellX, factX = cellX + barW + barGap;
    const planTop = yScale(planPerPoint), factTop = yScale(v);
    const planH = Math.max(1, yScale(0) - planTop), factH = Math.max(1, yScale(0) - factTop);
    const deltaPct = planPerPoint > 0 ? ((v/planPerPoint-1)*100) : 0;
    const isAbove = v >= planPerPoint;
    const labelColor = isAbove ? '#10B981' : '#F59E0B';
    const showXLabel = (i % labelStep === 0) || i === n - 1;

    // Значение факта над баром — формат и поворот зависят от плотности
    const factCenterX = factX + barW/2;
    const labelY = factTop - 8;
    const valueText = fmt(v, decimalsForBar);
    let labelEl;
    if(n <= 14){
      // Просторно — крупный текст горизонтально + % отклонения отдельной строкой
      labelEl = `<text x="${cellX + slotW/2}" y="${Math.min(planTop,factTop) - 9}" text-anchor="middle" font-family="Manrope" font-size="10.5" font-weight="700" fill="${labelColor}" class="anim-fill" style="animation-delay:${1.1+i*0.03}s">${deltaPct>0?'+':''}${deltaPct.toFixed(0)}%</text>`;
    } else if(n <= 25){
      // Средняя плотность — значение факта в млн, горизонтально мелким
      labelEl = `<text x="${factCenterX}" y="${labelY}" text-anchor="middle" font-family="Manrope" font-size="9" font-weight="700" fill="${labelColor}" class="anim-fill" style="animation-delay:${1.0+i*0.02}s">${valueText}</text>`;
    } else {
      // Очень плотно (30+) — повёрнутый текст
      labelEl = `<text x="${factCenterX}" y="${labelY}" text-anchor="start" font-family="Manrope" font-size="9" font-weight="700" fill="${labelColor}" transform="rotate(-55, ${factCenterX}, ${labelY})" class="anim-fill" style="animation-delay:${1.0+i*0.02}s">${valueText}</text>`;
    }

    return `<g>
      <rect class="anim-bar" style="animation-delay:${0.20 + i*0.02}s" x="${planX}" y="${planTop}" width="${barW}" height="${planH}" rx="2" fill="rgba(167,139,250,.55)" stroke="rgba(167,139,250,.85)" stroke-width="${dense?0:1}" data-tip="${labels[i]}|План|${fmt(planPerPoint, decimalsForBar)} млн ₽"/>
      <rect class="anim-bar" style="animation-delay:${0.26 + i*0.02}s" x="${factX}" y="${factTop}" width="${barW}" height="${factH}" rx="2" fill="url(#barFact)" data-tip="${labels[i]}|Факт|${fmt(v, decimalsForBar)} млн ₽|План|${fmt(planPerPoint, decimalsForBar)} млн ₽|Отклонение|${deltaPct>0?'+':''}${deltaPct.toFixed(0)}%" style="cursor:pointer"/>
      ${labelEl}
      ${showXLabel ? `<text x="${cellX + slotW/2}" y="${padT+chH+22}" text-anchor="middle" font-family="Inter" font-size="${dense?10.5:12}" font-weight="500" fill="#A0AAB8">${labels[i]}</text>` : ''}
    </g>`;
  }).join('');

  const aboveCnt = facts.filter(v => v >= planPerPoint).length;
  const completionPct = totalPlan > 0 ? (totalFact / totalPlan * 100) : 0;
  const overshoot = totalFact - totalPlan;
  const unitName = series.unitName;
  const planFmt = fmt(planPerPoint, decimalsForBar);

  const subText = granularity === 'month'
    ? `парные столбики · план ${planFmt} млн/мес · над парой % отклонения · ${n} месяцев`
    : granularity === 'week'
      ? `парные столбики · план ${planFmt} млн/нед · ${n} недель в периоде`
      : `парные столбики · план ${planFmt} млн/день · ${n} ${n === 1 ? 'день' : (n < 5 ? 'дня' : 'дней')} в периоде`;

  $('#planfact').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">План vs Факт по ${granularity === 'month' ? 'месяцам' : granularity === 'week' ? 'неделям' : 'дням'}</div>
        <div class="card-sub">${subText}</div>
      </div>
      <div class="pf-stats">
        <div class="pf-stat"><div class="pf-stat-k">Выполнено</div><div class="pf-stat-v ${completionPct>=100?'up':'warn'}">${completionPct.toFixed(0)}%</div><div class="pf-stat-sub">от плана периода (${fmt(totalPlan, decimalsForBar)} млн)</div></div>
        <div class="pf-stat"><div class="pf-stat-k">Опередили</div><div class="pf-stat-v ${overshoot>=0?'up':'warn'}">${overshoot>=0?'+':''}${fmt(overshoot, decimalsForBar)} млн</div><div class="pf-stat-sub">${fmt(totalFact, decimalsForBar)} из ${fmt(totalPlan, decimalsForBar)}</div></div>
        <div class="pf-stat"><div class="pf-stat-k">Точек выше плана</div><div class="pf-stat-v up">${aboveCnt}<span style="font-size:14px;color:var(--ink-3)"> / ${n}</span></div><div class="pf-stat-sub">${n-aboveCnt} ниже плана</div></div>
      </div>
    </div>
    <div class="pf-legend">
      <span class="pf-legend-item"><span class="pf-leg-plan"></span>План (${planFmt} млн/${granularity === 'month' ? 'мес' : granularity === 'week' ? 'нед' : 'день'})</span>
      <span class="pf-legend-item"><span class="pf-leg-fact"></span>Факт за ${unitName}</span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" class="pf-svg" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="barFact" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0E7490" stop-opacity="0.85"/></linearGradient></defs>
      ${gridY}${bars}
    </svg>
  `;
}

/* ============ Drill Treemap ============ */
function colorByYoy(yoy){
  if(yoy <= -20) return 'hsl(347, 76%, 32%)';
  if(yoy <= -10) return 'hsl(347, 62%, 40%)';
  if(yoy <= 0)   return 'hsl(347, 38%, 34%)';
  if(yoy <= 10)  return 'hsl(165, 32%, 30%)';
  if(yoy <= 20)  return 'hsl(165, 48%, 35%)';
  if(yoy <= 35)  return 'hsl(165, 62%, 40%)';
  return 'hsl(165, 78%, 45%)';
}
// Относительный градиент красный→жёлтый→зелёный (внутри текущего набора)
// Приглушённая палитра — вписана в общую тёмную тему дашборда
function colorByRank(yoy, minYoy, maxYoy){
  const range = maxYoy - minYoy;
  if(range < 0.5) return 'hsl(45, 25%, 32%)'; // если все близки — нейтрально-охра
  const t = Math.max(0, Math.min(1, (yoy - minYoy) / range));
  if(t < 0.5){
    // Красный → охра
    const u = t * 2;
    const h = 2 + u * 43;       //   2° → 45°
    const s = 42 - u * 8;        //  42 → 34
    const l = 32 + u * 3;        //  32 → 35
    return `hsl(${h}, ${s}%, ${l}%)`;
  } else {
    // Охра → зелёный
    const u = (t - 0.5) * 2;
    const h = 45 + u * 105;     //  45° → 150°
    const s = 34 + u * 6;        //  34 → 40
    const l = 35 - u * 3;        //  35 → 32
    return `hsl(${h}, ${s}%, ${l}%)`;
  }
}
function layoutTreemap(items, x, y, w, h){
  const sorted = items.slice().sort((a,b)=>b.rev-a.rev);
  const cells = [];
  let cx = x, cy = y, cw = w, ch = h, remaining = sorted.slice();
  while(remaining.length){
    if(remaining.length === 1){ cells.push({...remaining[0], x:cx, y:cy, w:cw, h:ch}); break; }
    const horizontal = cw > ch;
    const sumRem = remaining.reduce((s,i)=>s+i.rev, 0);
    let group = [remaining[0]], groupSum = remaining[0].rev, bestRatio = Infinity;
    for(let i=1; i<remaining.length; i++){
      const newSum = groupSum + remaining[i].rev;
      const stripeArea = (newSum/sumRem) * cw*ch;
      const stripeLen = horizontal ? stripeArea/ch : stripeArea/cw;
      const worst = Math.max(...group.concat(remaining[i]).map(it=>{
        const w_ = horizontal ? (it.rev/newSum)*stripeLen : stripeLen;
        const h_ = horizontal ? ch : (it.rev/newSum)*stripeLen;
        return Math.max(w_/h_, h_/w_);
      }));
      if(worst > bestRatio) break;
      bestRatio = worst; group.push(remaining[i]); groupSum = newSum;
    }
    const stripeArea = (groupSum/sumRem) * cw*ch;
    const stripeLen = horizontal ? stripeArea/ch : stripeArea/cw;
    let offset = 0;
    group.forEach(it=>{
      const portion = it.rev/groupSum;
      if(horizontal){ const cellH = portion*ch; cells.push({...it, x:cx, y:cy+offset, w:stripeLen, h:cellH}); offset += cellH; }
      else          { const cellW = portion*cw; cells.push({...it, x:cx+offset, y:cy, w:cellW, h:stripeLen}); offset += cellW; }
    });
    if(horizontal){ cx += stripeLen; cw -= stripeLen; } else { cy += stripeLen; ch -= stripeLen; }
    remaining = remaining.slice(group.length);
  }
  return cells;
}
function renderDrill(){
  const {startIdx, endIdx} = getDateRange();
  // Маржа для категории/подкатегории: для подкат — из SUBCAT_MARGIN,
  // для группы — взвешенное среднее по выручке подкатегорий
  const marginForId = id => {
    if(SUBCAT_MARGIN[id] !== undefined) return SUBCAT_MARGIN[id];
    const g = CAT_TREE.find(x => x.id === id);
    if(!g) return null;
    const base = g.children.reduce((s,c) => s + c.rev, 0);
    if(base === 0) return null;
    return g.children.reduce((s,c) => s + c.rev * (SUBCAT_MARGIN[c.id] ?? 35), 0) / base;
  };

  // Δ к периоду выбранному в фильтре. Для "Год"/"Всё время" — сравнение с тем же периодом 2024.
  // Для остальных — сдвинутое окно той же длины назад (выходящие за начало 2025 дни берутся из 2024).
  const isYearLike = state.period === 'year' || state.period === 'all';
  const periodLen = endIdx - startIdx + 1;
  const prevEndIdx = startIdx - 1;
  const prevStartIdx = startIdx - periodLen;
  const sumPrevForPeriod = (daily, dailyPrev) => {
    if(isYearLike) return sumRange(dailyPrev, startIdx, endIdx);
    if(prevStartIdx >= 0) return sumRange(daily, prevStartIdx, prevEndIdx);
    if(prevEndIdx < 0) return sumRange(dailyPrev, TOTAL_DAYS + prevStartIdx, TOTAL_DAYS + prevEndIdx);
    return sumRange(dailyPrev, TOTAL_DAYS + prevStartIdx, TODAY_IDX) + sumRange(daily, 0, prevEndIdx);
  };
  const periodDeltaLbl = (PERIOD_DELTAS[state.period] || PERIOD_DELTAS.year).label;

  let items, title, sub, backBtn = '';
  if(state.drillCategory === null){
    items = CAT_TREE.map(g => {
      const rev = sumRange(DAILY_REV_CAT[g.id], startIdx, endIdx);
      const prev = sumPrevForPeriod(DAILY_REV_CAT[g.id], DAILY_REV_CAT_PREV[g.id]);
      return {id:g.id, name:g.name, sub:g.sub, rev, prev, yoy:prev>0?(rev/prev-1)*100:0, drillable:g.children.length>1, childCount:g.children.length, margin:marginForId(g.id)};
    });
    title = 'Структура продаж';
    sub = 'кликни на категорию чтобы увидеть подкатегории · наведи на мелкую ячейку чтобы увидеть подробности';
  } else {
    const g = findGroup(state.drillCategory);
    items = g.children.map(c => {
      const rev = sumRange(DAILY_REV_CAT[c.id], startIdx, endIdx);
      const prev = sumPrevForPeriod(DAILY_REV_CAT[c.id], DAILY_REV_CAT_PREV[c.id]);
      return {id:c.id, name:c.name, sub:c.sub, rev, prev, yoy:prev>0?(rev/prev-1)*100:0, drillable:false, margin:marginForId(c.id)};
    });
    title = `Структура продаж · ${g.name}`;
    sub = 'подкатегории внутри группы';
    backBtn = `<button class="drill-back" id="drill-back"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2L4 6l4 4"/></svg>Все категории</button>`;
  }
  const total = items.reduce((s,i)=>s+i.rev, 0);
  items = items.map(i => ({...i, pct:(i.rev/total*100)}));
  $('#drill').innerHTML = `
    <div class="card-h">
      <div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div>
      <div class="card-actions">${backBtn}<div style="font-size:11.5px;color:var(--ink-3);text-align:right">площадь ≈ выручка (сглажено)<br>цвет: маржа (красный=низкая · зелёный=высокая)</div></div>
    </div>
    <div class="tm-canvas" id="tm-canvas"></div>
  `;
  setTimeout(()=>{
    const el = $('#tm-canvas'); if(!el) return;
    const rect = el.getBoundingClientRect();
    // Степенное сжатие 0.65 — мелкие категории становятся читаемыми, пропорция сохраняется качественно
    const POWER = 0.65;
    const itemsForLayout = items.map(it => ({...it, rev: Math.pow(it.rev, POWER), _origRev: it.rev}));
    const cells = layoutTreemap(itemsForLayout, 0, 0, rect.width - 8, rect.height - 8);
    // Цвет — по РЕАЛЬНОЙ марже (из достоверных строк себестоимости). YoY к 2024 нет источника.
    const margs = cells.map(c => c.margin ?? 0);
    const minM = Math.min(...margs), maxM = Math.max(...margs);
    el.innerHTML = cells.map((c,i)=>{
      const origRev = c._origRev; // реальная выручка для подписи и тултипа
      const sizeClass = c.w*c.h < 5000 ? 'tiny' : c.w*c.h < 14000 ? 'small' : '';
      const narrow = c.w < 110;
      const short = c.h < 55;
      // Слишком мала — только цвет, всё в тултипе
      const empty = c.h < 65 || c.w < 90;
      // Средне-плоская — показываем только имя и сумму (без sub и meta)
      const compact = !empty && c.h < 110;
      const adaptClass = empty
        ? 'empty'
        : compact
          ? `compact ${narrow?'narrow':''}`
          : [sizeClass, narrow?'narrow':'', short?'short':''].filter(Boolean).join(' ');
      const bg = colorByRank(c.margin ?? 0, minM, maxM);
      const drillCls = c.drillable && !empty ? 'drillable' : '';
      const delay = 0.05 + i*0.05;
      const dataAttr = c.drillable ? `data-drill="${c.id}"` : '';
      return `<div class="tm-cell ${adaptClass} ${drillCls}" ${dataAttr} style="left:${c.x+4}px;top:${c.y+4}px;width:${c.w-8}px;height:${c.h-8}px;background:${bg};opacity:0;animation:fadeUp .45s var(--ease-out) ${delay}s forwards" data-tip="${c.name}|Выручка|${fmt(origRev,1)} млн ₽|Доля|${fmt(c.pct,1)}%|Маржа|${c.margin!==null?fmt(c.margin,1)+'%':'—'}${c.childCount>1?'|Подкатегорий|'+c.childCount:''}">
        <div><div class="tm-cell-name">${c.name}</div>${c.sub ? `<div class="tm-cell-sub">${c.sub}</div>` : ''}</div>
        <div><div class="tm-cell-val num">${fmt(origRev,1)}<span class="u">млн</span></div><div class="tm-cell-meta"><span>${fmt(c.pct,1)}%</span><span style="color:rgba(255,255,255,.85)">${c.margin!==null?'маржа '+fmt(c.margin,1)+'%':''}</span></div></div>
      </div>`;
    }).join('');
  }, 30);
}

/* ============ Рентабельность ============ */
// Конвертируем индекс дня года 2025 в метку "ДД.М" (как 20.10, 3.11)
function dayIdxToLabel(idx){
  let m = 0;
  while(m < 11 && idx >= MONTH_START_IDX[m+1]) m++;
  const day = idx - MONTH_START_IDX[m] + 1;
  return `${day}.${m+1}`;
}
// Округление вверх до удобного шага (для верха Y-оси)
function niceRoundUp(v){
  if(v <= 0) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let nice;
  if(norm <= 1)      nice = 1;
  else if(norm <= 1.5) nice = 1.5;
  else if(norm <= 2)   nice = 2;
  else if(norm <= 2.5) nice = 2.5;
  else if(norm <= 3)   nice = 3;
  else if(norm <= 4)   nice = 4;
  else if(norm <= 5)   nice = 5;
  else if(norm <= 7)   nice = 7;
  else nice = 10;
  return nice * mag;
}
// Сглаженная кривая по точкам (catmull-rom-style)
function smoothLinePath(pts){
  if(pts.length < 2) return '';
  if(pts.length === 2) return `M ${pts[0][0]} ${pts[0][1]} L ${pts[1][0]} ${pts[1][1]}`;
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  const t = 0.18;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i-1)];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[Math.min(pts.length-1, i+2)];
    const cp1x = p1[0] + (p2[0] - p0[0]) * t;
    const cp1y = p1[1] + (p2[1] - p0[1]) * t;
    const cp2x = p2[0] - (p3[0] - p1[0]) * t;
    const cp2y = p2[1] - (p3[1] - p1[1]) * t;
    d += ` C ${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
  }
  return d;
}

// % комиссии от выручки по дню — детерминированная демо-вариация (для наглядности).
// ПЛЕЙСХОЛДЕР: заменить на факт из 1С/отчётов площадок. Нормируется в renderProfitability в диапазон 10–40%.
function commPctRaw(dayIdx){
  return Math.sin(dayIdx * 0.21 + 0.5) * 0.62
       + Math.sin(dayIdx * 0.085 + 2.1) * 0.40
       + Math.sin(dayIdx * 0.5 + 1.2) * 0.16;
}

function renderProfitability(){
  const {startIdx, endIdx} = getDateRange();
  const periodLen = endIdx - startIdx + 1;
  // Целевое количество точек графика: ~14-16. Размер бакета адаптируется к окну
  const N_TARGET = 14;
  const bucketSize = Math.max(1, Math.ceil(periodLen / N_TARGET));

  // Готовим бакеты со средней дневной выручкой и себестоимостью (тыс ₽ / день)
  const buckets = [];
  for(let i = startIdx; i <= endIdx; i += bucketSize){
    const bStart = i;
    const bEnd = Math.min(i + bucketSize - 1, endIdx);
    const bLen = bEnd - bStart + 1;
    let revSum = 0, costSum = 0;
    Object.keys(DAILY_REV_CAT).forEach(id => {
      // Берём только подкатегории (у которых задан SUBCAT_MARGIN)
      if(SUBCAT_MARGIN[id] === undefined) return;
      const r = sumRange(DAILY_REV_CAT[id], bStart, bEnd);
      const m = SUBCAT_MARGIN[id];
      revSum += r;
      costSum += r * (1 - m / 100);
    });
    // Среднее в день, переводим из млн ₽ → тыс ₽ (K)
    const revPerDay = (revSum / bLen) * 1000;
    const costPerDay = (costSum / bLen) * 1000;
    buckets.push({
      label: dayIdxToLabel(bStart),
      start: bStart,
      len: bLen,
      rev: revPerDay,
      cost: costPerDay,
      profit: revPerDay - costPerDay
    });
  }

  // Комиссия OZON по подкатегориям (все сборы = accruals − amount, снимок pnl-sku),
  // взвешенная выручкой бакета за период. commPct варьируется с миксом категорий.
  const SUBCAT_COMM = window.__SUBCAT_COMM || {};
  const hasComm = Object.keys(SUBCAT_COMM).length > 0;
  buckets.forEach(b => {
    const bEnd = b.start + b.len - 1;
    let cr = 0, cc = 0; // покрытая выручка и комиссия (млн ₽) по подкат с известной ставкой
    Object.keys(DAILY_REV_CAT).forEach(id => {
      if(SUBCAT_COMM[id] === undefined) return;
      const rv = sumRange(DAILY_REV_CAT[id], b.start, bEnd);
      cr += rv; cc += rv * SUBCAT_COMM[id] / 100;
    });
    b.commPct = cr > 0 ? (cc / cr * 100) : 0;   // % от выручки (по покрытым подкат)
    b.comm = b.rev * b.commPct / 100;            // K ₽/день
  });

  // Y-масштаб: одинаковый для обоих графиков для визуального сопоставления.
  // Берём max по выручке (она всегда ≥ себестоимости) с запасом 12%.
  const maxRev = Math.max(...buckets.map(b => b.rev), 1);
  const yMax = niceRoundUp(maxRev * 1.12);
  const yTicks = 7; // 0, 100K, 200K, ..., 700K — динамически
  const tickStep = yMax / (yTicks - 1);

  // Размеры SVG (адаптивный viewBox)
  const W = 600, H = 320;
  const padL = 46, padR = 34, padT = 14, padB = 30;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const n = buckets.length;
  const yScale = v => padT + innerH - (v / yMax) * innerH;
  const xOf = i => padL + (n > 1 ? (i / (n - 1)) * innerW : innerW / 2);
  const xBarBand = innerW / Math.max(n, 1);
  const xBar = i => padL + i * xBarBand + xBarBand * 0.5;
  const barW = Math.min(28, xBarBand * 0.62);

  // Сетка Y + метки
  let yGrid = '';
  for(let t = 0; t < yTicks; t++){
    const v = tickStep * t;
    const y = yScale(v);
    const lbl = v >= 1000 ? `${(v/1000).toFixed(1).replace('.0','')}M` : `${Math.round(v)}K`;
    yGrid += `<line class="pr-grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    yGrid += `<text class="pr-axis-y" x="${(padL-6).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${lbl}</text>`;
  }

  // Метки X — показываем все, но если их слишком много, прореживаем
  const labelEvery = n > 18 ? Math.ceil(n / 14) : 1;
  let xLabels = '';
  buckets.forEach((b, i) => {
    if(i % labelEvery !== 0 && i !== n - 1) return;
    const x = xOf(i);
    xLabels += `<text class="pr-axis-x" x="${x.toFixed(1)}" y="${(H - padB + 16).toFixed(1)}" text-anchor="middle">${b.label}</text>`;
  });
  let xLabelsBar = '';
  buckets.forEach((b, i) => {
    if(i % labelEvery !== 0 && i !== n - 1) return;
    const x = xBar(i);
    xLabelsBar += `<text class="pr-axis-x" x="${x.toFixed(1)}" y="${(H - padB + 16).toFixed(1)}" text-anchor="middle">${b.label}</text>`;
  });

  // Левый график: 2 линии + areas + точки
  const revPts = buckets.map((b, i) => [xOf(i), yScale(b.rev)]);
  const costPts = buckets.map((b, i) => [xOf(i), yScale(b.cost)]);
  const revLine = smoothLinePath(revPts);
  const costLine = smoothLinePath(costPts);
  const baselineY = yScale(0);
  const revArea = revPts.length > 1 ? revLine + ` L ${revPts[revPts.length-1][0]} ${baselineY} L ${revPts[0][0]} ${baselineY} Z` : '';
  const costArea = costPts.length > 1 ? costLine + ` L ${costPts[costPts.length-1][0]} ${baselineY} L ${costPts[0][0]} ${baselineY} Z` : '';
  const revDots = revPts.map(([x,y]) => `<circle class="pr-dot pr-dot-rev" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`).join('');
  const costDots = costPts.map(([x,y]) => `<circle class="pr-dot pr-dot-cost" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/>`).join('');

  const leftSVG = `
    <svg viewBox="0 0 ${W} ${H}" class="pr-svg" preserveAspectRatio="xMidYMid meet">
      ${yGrid}
      <path class="pr-area-rev" d="${revArea}"/>
      <path class="pr-area-cost" d="${costArea}"/>
      <path class="pr-line pr-line-rev" d="${revLine}"/>
      <path class="pr-line pr-line-cost" d="${costLine}"/>
      ${costDots}
      ${revDots}
      ${xLabels}
    </svg>`;

  // Правый график: КОМИССИИ — столбики (сумма) + линия % от выручки (правая ось)
  const commMax = niceRoundUp(Math.max(...buckets.map(b => b.comm), 1) * 1.18);
  const yScaleC = v => padT + innerH - (v / commMax) * innerH;
  const pctMax = Math.max(1, Math.ceil(Math.max(...buckets.map(b => b.commPct), 0.1) * 1.25));
  const pctScale = v => padT + innerH - (v / pctMax) * innerH;

  // Сетка/ось слева (комиссия, K₽) + правая ось (%)
  let commGrid = '', pctAxis = '';
  for(let t = 0; t < yTicks; t++){
    const y = padT + innerH - (innerH * t / (yTicks - 1));
    const vC = (commMax / (yTicks - 1)) * t;
    const lblC = vC >= 1000 ? `${(vC/1000).toFixed(1).replace('.0','')}M` : `${Math.round(vC)}K`;
    commGrid += `<line class="pr-grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    commGrid += `<text class="pr-axis-y" x="${(padL-6).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${lblC}</text>`;
    const vP = (pctMax / (yTicks - 1)) * t;
    pctAxis += `<text class="pr-axis-pct" x="${(W-6).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${vP.toFixed(1)}%</text>`;
  }

  let commBars = '';
  buckets.forEach((b, i) => {
    const x = xBar(i) - barW / 2;
    const yC = yScaleC(b.comm);
    const hC = baselineY - yC;
    commBars += `<rect class="pr-bar-comm" x="${x.toFixed(1)}" y="${yC.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(hC,0).toFixed(1)}" rx="1"><title>${b.label}: комиссия ${b.comm>=1000?(b.comm/1000).toFixed(2)+'M':Math.round(b.comm)+'K'} ₽/дн · ${b.commPct.toFixed(1)}% от выручки</title></rect>`;
  });
  const pctPts = buckets.map((b, i) => [xBar(i), pctScale(b.commPct)]);
  const pctLine = smoothLinePath(pctPts);
  const pctDots = pctPts.map(([x,y]) => `<circle class="pr-dot pr-dot-pct" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8"/>`).join('');

  const rightSVG = `
    <svg viewBox="0 0 ${W} ${H}" class="pr-svg" preserveAspectRatio="xMidYMid meet">
      ${commGrid}
      ${commBars}
      <path class="pr-line-pct" d="${pctLine}"/>
      ${pctDots}
      ${pctAxis}
      ${xLabelsBar}
    </svg>`;

  // Суммарные показатели за период (для подзаголовка)
  const totalRev = buckets.reduce((s,b) => s + b.rev, 0) * bucketSize / 1000; // обратно в млн ₽ (mean × дни × buckets / 1000)
  // Используем простой агрегат
  const sumRev = (function(){
    let r = 0, c = 0;
    Object.keys(DAILY_REV_CAT).forEach(id => {
      if(SUBCAT_MARGIN[id] === undefined) return;
      const rv = sumRange(DAILY_REV_CAT[id], startIdx, endIdx);
      r += rv;
      c += rv * (1 - SUBCAT_MARGIN[id] / 100);
    });
    return { rev:r, cost:c, profit:r - c, marginPct:r > 0 ? ((r-c)/r)*100 : 0 };
  })();
  // Суммарная комиссия за период (млн ₽) — согласована с графиком (выручка × % бакета)
  const totalComm = buckets.reduce((s,b) => s + b.comm * b.len, 0) / 1000;
  const commShare = sumRev.rev > 0 ? (totalComm / sumRev.rev) * 100 : 0;

  $('#profitability').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">Рентабельность</div>
        <div class="card-sub">выручка и себестоимость · ${periodLabel()} · себестоимость — по достоверным строкам источника (≈74%) · ${hasComm?'комиссия по подкатегориям (снимок pnl-sku)':'комиссии нет источника'}</div>
      </div>
      <div class="cl-summary">
        <div>Выручка: <b>${fmt(sumRev.rev,1)}</b> млн ₽</div>
        <div class="cl-summary-sep"></div>
        <div>Себестоимость: <b>${fmt(sumRev.cost,1)}</b> млн ₽</div>
        <div class="cl-summary-sep"></div>
        <div>Комиссия: ${hasComm?`<b>${fmt(totalComm,1)}</b> млн ₽ · <b>${commShare.toFixed(1).replace('.',',')}%</b>`:'<b style="color:var(--ink-3)">нет данных</b>'}</div>
        <div class="cl-summary-sep"></div>
        <div>Маржа: <b>${fmt(sumRev.marginPct,1)}%</b></div>
      </div>
    </div>
    <div class="pr-grid">
      <div class="pr-chart-wrap">
        <div class="pr-chart-title">Выручка и себестоимость</div>
        ${leftSVG}
        <div class="pr-legend">
          <span class="pr-leg-item"><span class="pr-leg-dot rev"></span>Выручка</span>
          <span class="pr-leg-item"><span class="pr-leg-dot cost"></span>Себестоимость</span>
        </div>
      </div>
      <div class="pr-chart-wrap">
        <div class="pr-chart-title">Комиссии и % от выручки</div>
        ${hasComm ? `${rightSVG}
        <div class="pr-legend">
          <span class="pr-leg-item"><span class="pr-leg-dot" style="background:#22D3EE"></span>Комиссия, ₽</span>
          <span class="pr-leg-item"><span class="pr-leg-dot" style="background:#A78BFA"></span>% от выручки</span>
        </div>` : `<div style="min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);text-align:center">
          <div style="font-size:28px;opacity:.55;margin-bottom:6px">∅</div>
          <div style="font-size:14px;font-weight:700;color:var(--ink-2)">Нет данных</div>
          <div style="font-size:12px;margin-top:4px;max-width:300px">Ставки комиссий по площадкам: нет источника (нужны отчёты Ozon / WB / Я.Маркет или 1С)</div>
        </div>`}
      </div>
    </div>
  `;
}

/* ============ Категории × Каналы (МАТРИЦА с drill-down) ============ */

// Заказы на канал × подкатегория — пропорционально выручке (через отношение в подкатегории)
function getOrdersByChannel(subId){
  const sub = findSubcat(subId);
  if(!sub) return {};
  const byCh = {};
  CHANNELS.forEach(ch => {
    const chRev = MX_DATA[ch.id]?.[subId] || 0;
    const share = sub.rev > 0 ? chRev / sub.rev : 0;
    byCh[ch.id] = Math.round(sub.orders * share);
  });
  return byCh;
}

function renderMatrixCompare(){
  const c = state.compare;
  const metric = state.mx.cmpMetric || 'rev';            // 'rev' | 'ord'
  const unit = metric === 'ord' ? 'шт' : 'млн ₽';
  const fmtVal = v => metric === 'ord' ? fmt0(v) : fmt(v,1);
  const fmtTip = v => metric === 'ord' ? `${fmt0(v)} шт` : `${fmt(v,2)} млн ₽`;
  const colLbl = metric === 'ord' ? 'Заказы' : 'Выручка';

  // показатель подкатегории за период: выручка (млн) или заказы (шт = выручка × заказы/выручка подкат — без поденного округления)
  const childVal = (child, from, to) => {
    const rev = sumRangeDates(DAILY_REV_CAT[child.id], from, to);
    return metric === 'ord'
      ? (child.rev > 0 ? rev * (child.orders / child.rev) : 0)
      : rev;
  };
  // значение канала по набору подкатегорий за период (доля канала × показатель подкатегории)
  const chValForPeriod = (chId, children, from, to) => children.reduce((s, ch) => {
    const share = ch.rev > 0 ? (MX_DATA[chId]?.[ch.id] || 0) / ch.rev : 0;
    return s + share * childVal(ch, from, to);
  }, 0);
  const totForPeriod = (children, from, to) => children.reduce((s, ch) => s + childVal(ch, from, to), 0);

  // строки категорий
  const rows = CAT_TREE.map(g => {
    const byA = {}, byB = {};
    CHANNELS.forEach(ch => {
      byA[ch.id] = chValForPeriod(ch.id, g.children, c.aFrom, c.aTo);
      byB[ch.id] = chValForPeriod(ch.id, g.children, c.bFrom, c.bTo);
    });
    return {
      id:g.id, name:g.name, byA, byB, children:g.children,
      totA: totForPeriod(g.children, c.aFrom, c.aTo),
      totB: totForPeriod(g.children, c.bFrom, c.bTo)
    };
  }).sort((x,y) => y.totB - x.totB);

  // диапазон дельт по ячейкам каналов (для раскраски: минус — красный, максимум — зелёный)
  let maxPos = 0.0001, maxNegAbs = 0.0001;
  rows.forEach(r => CHANNELS.forEach(ch => {
    const a = r.byA[ch.id], b = r.byB[ch.id];
    if(a > 0.001){ const d = (b-a)/a*100; if(d > maxPos) maxPos = d; if(d < 0 && -d > maxNegAbs) maxNegAbs = -d; }
  }));

  // заливка по дельте: < 0 — красный (насыщенность по |Δ|), ≥ 0 — зелёный (максимум = самый яркий)
  const heatDelta = (d, isNew) => {
    if(isNew) return 'hsl(150,64%,44%)';
    if(d === null || d === 0) return 'hsl(150,28%,16%)';
    if(d > 0){ const t = Math.pow(Math.min(1, d/maxPos), 0.7); return `hsl(150, ${(42+t*28).toFixed(0)}%, ${(16+t*28).toFixed(0)}%)`; }
    const t = Math.pow(Math.min(1, -d/maxNegAbs), 0.7); return `hsl(353, ${(50+t*26).toFixed(0)}%, ${(20+t*22).toFixed(0)}%)`;
  };
  const heatDeltaTx = (d, isNew) => {
    if(isNew) return '#0A140E';
    if(d === null || d === 0) return 'var(--ink-2)';
    const t = d > 0 ? Math.pow(Math.min(1,d/maxPos),0.7) : Math.pow(Math.min(1,-d/maxNegAbs),0.7);
    return t > 0.5 ? (d > 0 ? '#0A140E' : '#1A0A0C') : 'var(--ink)';
  };

  // ячейка-кнопка: Δ% (дельта), заливка по динамике (красный спад / зелёный рост), тултип А/Б/Δ
  const cell = (name, ch, a, b) => {
    const thr = metric==='ord' ? 0.5 : 0.05;
    const empty = b <= thr && a <= thr;
    const isNew = a <= 0.001 && b > thr;
    const d = a > 0.001 ? (b-a)/a*100 : (b > 0.001 ? null : 0);
    const dStr = empty ? '—' : (isNew ? 'нов' : `${d>0?'+':''}${d.toFixed(0)}%`);
    const dTip = empty ? '—' : (isNew ? 'новый' : `${d>0?'+':''}${fmt(d,1)}%`);
    const tip = `${name} · ${ch.name}|${colLbl} А|${fmtTip(a)}|${colLbl} Б|${fmtTip(b)}|Δ (Б−А)/А|${dTip}`;
    const bg = empty ? 'transparent' : heatDelta(d, isNew);
    const tx = empty ? 'var(--ink-3)' : heatDeltaTx(d, isNew);
    return `<td class="mx-cell mx-cellbtn" data-tip="${tip}"><span class="mx-pill ${empty?'empty':''}" style="background:${bg};color:${tx}">${dStr}</span></td>`;
  };
  const dTotalCell = (a, b) => {
    const d = a > 0.001 ? (b-a)/a*100 : (b > 0.001 ? null : 0);
    const up = (d ?? 0) >= 0;
    return `<td class="mx-total mx-margin ${up?'good':'bad'}"><span class="num">${d===null?'нов':`${up?'+':''}${fmt(d,1)}%`}</span></td>`;
  };

  let bodyRows = '';
  rows.forEach(g => {
    const expanded = state.mx.expanded.has(g.id);
    const chCells = CHANNELS.map(ch => `<td class="mx-cell" style="color:var(--ink-3);text-align:center" data-tip="${g.name} · ${ch.name}|Каналы|нет источника">н/д</td>`).join('');
    bodyRows += `<tr class="mx-row lvl1 ${expanded?'expanded':''}" data-mx-toggle="${g.id}">
      <td class="mx-label">${g.name}</td>
      ${chCells}
      <td class="mx-total"><span class="num">${fmtVal(g.totA)}</span></td>
      <td class="mx-total"><span class="num">${fmtVal(g.totB)}</span></td>
      ${dTotalCell(g.totA, g.totB)}
    </tr>`;

    if(expanded){
      g.children.forEach(s => {
        const aV = childVal(s, c.aFrom, c.aTo);
        const bV = childVal(s, c.bFrom, c.bTo);
        const sCells = CHANNELS.map(ch => `<td class="mx-cell" style="color:var(--ink-3);text-align:center" data-tip="${s.name} · ${ch.name}|Каналы|нет источника">н/д</td>`).join('');
        bodyRows += `<tr class="mx-row lvl2">
          <td class="mx-label">${s.name}</td>
          ${sCells}
          <td class="mx-total"><span class="num">${fmtVal(aV)}</span></td>
          <td class="mx-total"><span class="num">${fmtVal(bV)}</span></td>
          ${dTotalCell(aV, bV)}
        </tr>`;
      });
    }
  });

  // итоги по каналам (значение Период Б + Δ в подсказке через цвет)
  const footChCells = CHANNELS.map(ch => `<td style="color:var(--ink-3);text-align:center">н/д</td>`).join('');
  const grandA = rows.reduce((s,g) => s + g.totA, 0);
  const grandB = rows.reduce((s,g) => s + g.totB, 0);
  const grandD = grandA > 0 ? (grandB-grandA)/grandA*100 : 0;

  const headChannels = CHANNELS.map(ch => `<th class="mx-ch">${ch.short}</th>`).join('');

  $('#divergent').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">Категории × Каналы</div>
        <div class="card-sub">Δ по категориям (Б−А)/А — реальные из OZON · разбивка по каналам — нет источника (нужен Roistat / Bitrix)</div>
      </div>
      <div class="mx-toggle">
        <button class="mx-tg ${metric==='rev'?'active':''}" data-mx-metric="rev">Выручка ₽</button>
        <button class="mx-tg ${metric==='ord'?'active':''}" data-mx-metric="ord">Заказы шт</button>
      </div>
    </div>
    <div class="mx-wrap">
      <table class="mx-table">
        <thead>
          <tr>
            <th class="mx-label-h">Категория</th>
            ${headChannels}
            <th class="mx-total-h">${colLbl} А</th>
            <th class="mx-total-h">${colLbl} Б</th>
            <th class="mx-total-h">Δ</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr class="mx-foot">
            <td>Итого</td>
            ${footChCells}
            <td><span class="num">${fmtVal(grandA)}</span></td>
            <td><span class="num">${fmtVal(grandB)}</span></td>
            <td class="mx-margin ${grandD>=0?'good':'bad'}"><span class="num">${grandD>=0?'+':''}${fmt(grandD,1)}%</span></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

function renderMatrix(){
  const sortCol = state.mx.sortCol;
  const sortDir = state.mx.sortDir;
  const dir = sortDir === 'desc' ? -1 : 1;
  const subRatios = subRatiosForPeriod();
  const ratioOf = id => subRatios[id] !== undefined ? subRatios[id] : 1;
  // Метрика, отображаемая в ячейках каналов (кнопки над матрицей). Данные только по Озону.
  const MM = state.mx.metric || 'rev';
  const ozFmt = (rev, margin, orders, share) =>
    MM === 'margin' ? (margin==null ? 'н/д' : fmt(margin,1)+'%')
    : MM === 'orders' ? fmt0(orders)
    : MM === 'share'  ? fmt(share,1)+'%'
    : (rev>0 ? fmt(rev,1) : '—');

  // ===== Режим сравнения периодов: Δ-хитмап (Б−А)/А по ячейкам =====
  if(state.compare.active){ return renderMatrixCompare(); }

  // Подсчёт сумм для каждой категории и подкатегории (с учётом периода).
  // Маржа: для категории — взвешенное среднее по выручке подкатегорий
  // (т.е. сумма cost / сумма rev), что эквивалентно реальной агрегированной марже.
  // Маржа инвариантна к периоду (rev и cost масштабируются одинаково).
  const groupRows = CAT_TREE.map(g => {
    const byChRev = {}; const byChOrd = {};
    CHANNELS.forEach(ch => {
      byChRev[ch.id] = g.children.reduce((s, sub) => s + (MX_DATA[ch.id]?.[sub.id] || 0) * ratioOf(sub.id), 0);
      byChOrd[ch.id] = g.children.reduce((s, sub) => {
        const subOrd = getOrdersByChannel(sub.id);
        return s + (subOrd[ch.id] || 0) * ratioOf(sub.id);
      }, 0);
    });
    const totalRev = g.children.reduce((s, c) => s + c.rev * ratioOf(c.id), 0);
    const totalOrd = g.children.reduce((s, c) => s + c.orders * ratioOf(c.id), 0);
    // Взвешенная маржа: Σ(rev_sub × margin_sub) / Σ(rev_sub)
    // (используем долю выручки внутри группы как вес — период сокращается)
    const groupRevBase = g.children.reduce((s, c) => s + c.rev, 0);
    const margin = groupRevBase > 0
      ? g.children.reduce((s, c) => s + c.rev * (SUBCAT_MARGIN[c.id] ?? 35), 0) / groupRevBase
      : 0;
    return {id:g.id, name:g.name, byChRev, byChOrd, totalRev, totalOrd, margin, children:g.children};
  });

  const grandRev = groupRows.reduce((s, r) => s + r.totalRev, 0);
  const grandOrd = groupRows.reduce((s, r) => s + r.totalOrd, 0);
  // Общая взвешенная маржа по всему ассортименту
  const grandRevBase = CAT_TREE.reduce((s, g) => s + g.children.reduce((ss, c) => ss + c.rev, 0), 0);
  const grandMargin = grandRevBase > 0
    ? CAT_TREE.reduce((s, g) =>
        s + g.children.reduce((ss, c) => ss + c.rev * (SUBCAT_MARGIN[c.id] ?? 35), 0), 0
      ) / grandRevBase
    : 0;

  // Максимум для тепловой раскраски
  let maxCellRev = 0;
  groupRows.forEach(r => CHANNELS.forEach(ch => { if(r.byChRev[ch.id] > maxCellRev) maxCellRev = r.byChRev[ch.id]; }));

  // Сортировка категорий
  groupRows.sort((a,b) => {
    let av, bv;
    if(sortCol === 'name')      { return a.name.localeCompare(b.name,'ru') * dir; }
    else if(sortCol === 'total'){ av = a.totalRev; bv = b.totalRev; }
    else if(sortCol === 'margin'){ av = a.margin; bv = b.margin; }
    else if(sortCol === 'orders'){ av = a.totalOrd; bv = b.totalOrd; }
    else if(sortCol === 'share'){ av = a.totalRev; bv = b.totalRev; }
    else                        { av = a.byChRev[sortCol] || 0; bv = b.byChRev[sortCol] || 0; }
    return (av - bv) * dir;
  });

  const heatBg = v => {
    if(v === 0 || maxCellRev === 0) return 'transparent';
    const t = Math.pow(v/maxCellRev, 0.55);
    const L = 14 + t*40, S = 50 + t*30;
    return `hsl(187, ${S}%, ${L}%)`;
  };
  const heatTx = v => {
    if(v === 0 || maxCellRev === 0) return 'var(--ink-3)';
    return (v/maxCellRev) > 0.45 ? '#0A0E14' : 'var(--ink)';
  };

  // Заголовки столбцов
  const headChannels = CHANNELS.map(ch => {
    const cls = sortCol === ch.id ? `sorted ${sortDir === 'asc' ? 'asc' : ''}` : '';
    return `<th class="mx-ch ${cls}" data-mx-sort="${ch.id}">${ch.short}</th>`;
  }).join('');
  const sortedTotal  = sortCol === 'total'  ? `sorted ${sortDir === 'asc' ? 'asc' : ''}` : '';
  const sortedMargin = sortCol === 'margin' ? `sorted ${sortDir === 'asc' ? 'asc' : ''}` : '';
  const sortedOrders = sortCol === 'orders' ? `sorted ${sortDir === 'asc' ? 'asc' : ''}` : '';
  const sortedShare  = sortCol === 'share'  ? `sorted ${sortDir === 'asc' ? 'asc' : ''}` : '';

  // Цветовое кодирование маржи: ≥45% good, 30-44.9% warn, <30% bad
  const marginClass = m => m >= 45 ? 'good' : (m >= 30 ? 'warn' : 'bad');

  // Тело таблицы
  let bodyRows = '';
  groupRows.forEach(g => {
    const expanded = state.mx.expanded.has(g.id);
    const chCells = CHANNELS.map(ch =>
      ch.id === 'ozon'
        ? `<td class="mx-cell" style="text-align:center" data-tip="${g.name} · Озон|Каналы|реальные данные OZON за период">${ozFmt(g.byChRev['ozon'], g.margin, g.totalOrd, grandRev>0?g.totalRev/grandRev*100:0)}</td>`
        : `<td class="mx-cell" style="color:var(--ink-3);text-align:center" data-tip="${g.name} · ${ch.name}|Каналы|нет источника (нужен Roistat / Bitrix)">н/д</td>`
    ).join('');
    const sharePct = grandRev > 0 ? (g.totalRev/grandRev*100) : 0;
    bodyRows += `<tr class="mx-row lvl1 ${expanded?'expanded':''}" data-mx-toggle="${g.id}">
      <td class="mx-label">${g.name}</td>
      ${chCells}
      <td class="mx-total"><span class="num">${fmt(g.totalRev,1)}</span></td>
      <td class="mx-total mx-margin ${marginClass(g.margin)}"><span class="num">${fmt(g.margin,1)}%</span></td>
      <td class="mx-total mx-orders"><span class="num">${fmt0(g.totalOrd)}</span></td>
      <td class="mx-total mx-share"><span class="num">${fmt(sharePct,1)}%</span></td>
    </tr>`;

    if(expanded){
      // Подкатегории (с учётом периода)
      const subRows = g.children.map(c => {
        const ratio = ratioOf(c.id);
        const byCh = {};
        CHANNELS.forEach(ch => { byCh[ch.id] = (MX_DATA[ch.id]?.[c.id] || 0) * ratio; });
        const subOrd = getOrdersByChannel(c.id);
        const totalOrdSub = CHANNELS.reduce((s, ch) => s + (subOrd[ch.id] || 0), 0) * ratio;
        const margin = SUBCAT_MARGIN[c.id] ?? 35;
        return {...c, byCh, totalOrd: totalOrdSub, revPeriod: c.rev * ratio, margin};
      });
      // Сортировка подкатегорий
      subRows.sort((a,b) => {
        let av, bv;
        if(sortCol === 'total')        { av = a.revPeriod; bv = b.revPeriod; }
        else if(sortCol === 'margin')  { av = a.margin; bv = b.margin; }
        else if(sortCol === 'orders')  { av = a.totalOrd; bv = b.totalOrd; }
        else if(sortCol === 'share')   { av = a.revPeriod; bv = b.revPeriod; }
        else if(sortCol === 'name')    { return a.name.localeCompare(b.name,'ru') * dir; }
        else                           { av = a.byCh[sortCol] || 0; bv = b.byCh[sortCol] || 0; }
        return (av - bv) * dir;
      });
      subRows.forEach(s => {
        const sCells = CHANNELS.map(ch =>
          ch.id === 'ozon'
            ? `<td class="mx-cell" style="text-align:center" data-tip="${s.name} · Озон|Каналы|реальные данные OZON за период">${ozFmt(s.byCh['ozon'], s.margin, s.totalOrd, grandRev>0?s.revPeriod/grandRev*100:0)}</td>`
            : `<td class="mx-cell" style="color:var(--ink-3);text-align:center" data-tip="${s.name} · ${ch.name}|Каналы|нет источника">н/д</td>`
        ).join('');
        const subShare = grandRev > 0 ? (s.revPeriod/grandRev*100) : 0;
        bodyRows += `<tr class="mx-row lvl2">
          <td class="mx-label">${s.name}</td>
          ${sCells}
          <td class="mx-total"><span class="num">${fmt(s.revPeriod,1)}</span></td>
          <td class="mx-total mx-margin ${marginClass(s.margin)}"><span class="num">${fmt(s.margin,1)}%</span></td>
          <td class="mx-total mx-orders"><span class="num">${fmt0(s.totalOrd)}</span></td>
          <td class="mx-total mx-share"><span class="num">${fmt(subShare,1)}%</span></td>
        </tr>`;
      });
    }
  });

  // Итоги по каналам — пересчитываются от итогов категорий (которые уже под период)
  const channelTotals = {};
  CHANNELS.forEach(ch => { channelTotals[ch.id] = 0; });
  groupRows.forEach(g => CHANNELS.forEach(ch => { channelTotals[ch.id] += g.byChRev[ch.id]; }));
  const footChCells = CHANNELS.map(ch => ch.id === 'ozon'
    ? `<td style="text-align:center"><span class="num">${ozFmt(channelTotals['ozon'], grandMargin, grandOrd, 100)}</span></td>`
    : `<td style="color:var(--ink-3);text-align:center">н/д</td>`).join('');
  const totalOrdersAll = CHANNELS.reduce((s,ch) => s + ch.orders, 0);

  $('#divergent').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">Категории × Каналы</div>
        <div class="card-sub">метрика в ячейках каналов — по кнопкам справа · реальные из OZON · прочие каналы — нет источника (нужен Roistat / Bitrix)</div>
      </div>
      <div class="mx-toggle">
        <button class="mx-tg ${MM==='rev'?'active':''}" data-mx-mainmetric="rev">Выручка</button>
        <button class="mx-tg ${MM==='margin'?'active':''}" data-mx-mainmetric="margin">Маржа</button>
        <button class="mx-tg ${MM==='orders'?'active':''}" data-mx-mainmetric="orders">Заказы</button>
        <button class="mx-tg ${MM==='share'?'active':''}" data-mx-mainmetric="share">Доля</button>
      </div>
    </div>
    <div class="mx-wrap">
      <table class="mx-table">
        <thead>
          <tr>
            <th class="mx-label-h" data-mx-sort="name">Категория</th>
            ${headChannels}
            <th class="mx-total-h ${sortedTotal}" data-mx-sort="total">Выручка</th>
            <th class="mx-total-h ${sortedMargin}" data-mx-sort="margin">Маржа</th>
            <th class="mx-total-h ${sortedOrders}" data-mx-sort="orders">Заказы</th>
            <th class="mx-total-h ${sortedShare}" data-mx-sort="share">Доля</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr class="mx-foot">
            <td>Итого</td>
            ${footChCells}
            <td><span class="num">${fmt(grandRev,1)}</span></td>
            <td class="mx-margin ${marginClass(grandMargin)}"><span class="num">${fmt(grandMargin,1)}%</span></td>
            <td><span class="num">${fmt0(grandOrd)}</span></td>
            <td><span class="num">100,0%</span></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

/* ============ ABC × XYZ анализ ============ */

/* Детерминированный псевдо-рандом по seed строки — нужен для стабильной XYZ-классификации
   между рендерами (классификация не должна "прыгать" при смене периода).                 */
function _axHash(s){
  let h = 2166136261;
  for(let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function _axRng(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t>>>15, t | 1);
    t ^= t + Math.imul(t ^ t>>>7, t | 61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* Разворачивает все продукты в плоский список SKU (артикулов).
   Для продуктов с variants — каждый вариант = отдельный SKU.
   Для плоских продуктов — сама позиция = SKU.                                            */
function expandSKUs(){
  const out = [];
  PRODUCTS.forEach(p => {
    if(p.variants && p.variants.length){
      p.variants.forEach(v => {
        out.push({
          sku: v.sku, parentNm: p.nm, parentSub: p.sub, sub: v.sub,
          rev: v.rev, cost: v.cost, orders: v.orders,
          returns: v.returns, leadDays: v.leadDays, stockQty: v.stockQty, stk: v.stk,
          subcatId: p.subcatId, groupId: p.groupId, isVariant: true,
          cv: p.cv  // cv наследуется от родительской серии
        });
      });
    } else {
      out.push({
        sku: p.nm, parentNm: p.nm, parentSub: null, sub: p.sub,
        rev: p.rev||0, cost: p.cost||0, orders: p.orders||0,
        returns: p.returns||0, leadDays: p.leadDays||0, stockQty: p.stockQty||0, stk: p.stk||'OK',
        subcatId: p.subcatId, groupId: p.groupId, isVariant: false,
        cv: p.cv
      });
    }
  });
  return out;
}

/* Период (из верхнего фильтра) → веса 12 месяцев 2025.
   Год/Всё время → все месяцы (вес 1). Короткие окна (7/30/90 дн, Свой) — доля дней
   месяца, попавших в окно (день-окно 2025, "сегодня"=27 дек, как в остальных блоках). */
function periodMonthWeights(){
  // 16 месяцев: 2025 (Янв–Дек) + 2026 (Янв–Апр). 2026 не високосный.
  const DIM = [31,28,31,30,31,30,31,31,30,31,30,31, 31,28,31,30];
  const N = DIM.length;
  const START = [0]; for(let i = 0; i < N - 1; i++) START.push(START[i] + DIM[i]);
  const LAST = START[N - 1] + DIM[N - 1] - 1;          // последний день апр 2026
  const p = state.period;
  const w = new Array(N).fill(0);
  if(p === 'all') return w.fill(1);                    // Всё время — вся история (вкл. 2026)
  if(p === 'year'){ for(let m = 4; m < N; m++) w[m] = 1; return w; }    // Год — скользящие 12 мес (май'25–апр'26)
  let s2, e2; const refEnd = LAST;                     // 30.04.2026 — «сейчас»
  if(p === 'today'){ s2 = refEnd; e2 = refEnd; }
  else if(p === '7d'){ s2 = refEnd - 6; e2 = refEnd; }
  else if(p === '30d'){ s2 = refEnd - 29; e2 = refEnd; }
  else if(p === '90d'){ s2 = refEnd - 89; e2 = refEnd; }
  else if(p === 'custom'){
    const ys = new Date('2025-01-01T00:00:00Z');
    s2 = Math.round((new Date(state.customFrom) - ys) / 86400000);
    e2 = Math.round((new Date(state.customTo) - ys) / 86400000);
  } else { s2 = refEnd - 29; e2 = refEnd; }
  s2 = Math.max(0, Math.min(LAST, s2)); e2 = Math.max(0, Math.min(LAST, e2));
  if(e2 < s2){ const t = s2; s2 = e2; e2 = t; }
  for(let m = 0; m < N; m++){
    const ms = START[m], me = START[m] + DIM[m] - 1;
    const ov = Math.max(0, Math.min(e2, me) - Math.max(s2, ms) + 1);
    w[m] = ov / DIM[m];
  }
  return w;
}

/* Агрегация в модели за ВЫБРАННЫЙ ПЕРИОД. Одна строка = Модель.
   ABC — по выручке за окно периода (mr/mo — помесячные ряды 2025 на уровне модели, май
   интерполирован). Себестоимость/возвраты/срок — из вариантов (структурные, доля выручки);
   склад — сумма. XYZ (cv) — годовая стабильность спроса, от периода не зависит (в коротком
   окне стабильность из месячных данных не измерить). Модель без продаж в окне — не участвует. */
function aggregateModels(){
  const wts = periodMonthWeights();
  // Реальные дневные ряды OZON за выбранное окно (точный период). Фолбэк — помесячные веса.
  const PDR = window.__PRODUCT_DAILY_REV, PDO = window.__PRODUCT_DAILY;
  const _dr = (PDR && PDO) ? getDateRange() : null;
  const out = [];
  PRODUCTS.forEach(p => {
    const mr = p.mr || [], mo = p.mo || [];
    let wrev = 0, word = 0;
    if(_dr && PDR[p.nm]){
      wrev = sumRange(PDR[p.nm], _dr.startIdx, _dr.endIdx);
      word = PDO[p.nm] ? sumRange(PDO[p.nm], _dr.startIdx, _dr.endIdx) : 0;
    } else {
      for(let m = 0; m < wts.length; m++){
        const wt = wts[m] || 0; if(wt <= 0) continue;
        wrev += (mr[m] || 0) * wt; word += (mo[m] || 0) * wt;
      }
    }
    if(wrev <= 0) return;
    let sRev = 0, sCost = 0, stockQty = 0, retW = 0, leadW = 0;
    if(p.variants && p.variants.length){
      p.variants.forEach(v => {
        const r = v.rev || 0;
        sRev += r; sCost += v.cost || 0; stockQty += v.stockQty || 0;
        retW  += (v.returns  || 0) * r;
        leadW += (v.leadDays || 0) * r;
      });
    }
    const ratio    = sRev > 0 ? sCost / sRev : 0.5;
    const returns  = sRev > 0 ? retW  / sRev : 0;
    const leadDays = sRev > 0 ? leadW / sRev : 0;
    const stk = stockQty === 0 ? 'OOS' : (stockQty <= 20 ? 'LOW' : 'OK');
    out.push({
      sku: p.nm, parentNm: p.nm, parentSub: null, sub: p.sub,
      rev: wrev, cost: wrev * ratio, orders: Math.round(word),
      returns, leadDays, stockQty, stk,
      subcatId: p.subcatId, groupId: p.groupId, isVariant: false,
      cv: p.cv
    });
  });
  return out;
}

/* ABC по выручке: сортировка убыв. + кумулятивный % (правило Парето).
   A: до 80% выручки, B: 80–95%, C: 95–100%.                                              */
function classifyABC(skus){
  const sorted = skus.slice().sort((a,b) => b.rev - a.rev);
  const total = sorted.reduce((s,sk) => s + sk.rev, 0);
  let cum = 0;
  return sorted.map(sk => {
    cum += sk.rev;
    const cumPct = total > 0 ? (cum / total) * 100 : 0;
    const abc = cumPct <= 80 ? 'A' : (cumPct <= 95 ? 'B' : 'C');
    return {...sk, abc, cumPct};
  });
}

/* XYZ по стабильности спроса. Приоритетно — заданный cv товара (из карточки).
   Фоллбэк (если cv не задан): синтетический 12-мес. ряд с шумом от состояния склада
   и редкости заказов. Классические пороги: X < 10% (стабильно), Y 10-25% (переменно),
   Z ≥ 25% (нерегулярно).                                                                  */
function classifyXYZ(sk){
  let cv;
  if(typeof sk.cv === 'number' && !isNaN(sk.cv)){
    cv = sk.cv;
  } else {
    const volStock = { OK: 0.09, LOW: 0.38, OOS: 0.60 }[sk.stk] ?? 0.15;
    const volOrders = sk.orders < 12 ? 0.22 : (sk.orders < 22 ? 0.10 : 0);
    const baseVol = volStock + volOrders;
    const rng = _axRng(_axHash(sk.sku));
    const monthly = [];
    for(let m = 0; m < 12; m++){
      const seasonal = 1 + Math.sin(m * Math.PI / 6) * 0.08;
      const noise = 1 + (rng() - 0.5) * 2 * baseVol;
      monthly.push(Math.max(0, (sk.orders / 12) * seasonal * noise));
    }
    const mean = monthly.reduce((s,v) => s+v, 0) / 12;
    if(mean === 0) return { xyz: 'Z', cv: 1 };
    const variance = monthly.reduce((s,v) => s + (v-mean)**2, 0) / 12;
    cv = Math.sqrt(variance) / mean;
  }
  const xyz = cv < 0.10 ? 'X' : (cv < 0.25 ? 'Y' : 'Z');
  return { xyz, cv };
}

/* Маппинг ячейки → бизнес-зона согласно классической матрице ABC-XYZ. */
const AX_ZONES = {
  AX:'green', AY:'green', AZ:'yellow',
  BX:'green', BY:'gray',  BZ:'gray',
  CX:'green', CY:'gray',  CZ:'red'
};

function renderABCXYZ(){
  // Сводный анализ по всем SKU. Период не применяем — ABCXYZ это про
  // относительный ранг и стабильность, а не про абсолютные объёмы.
  // Не учитываем Нестандарты, Комплекты мебели и Прочее (не товарные позиции для ранжирования).
  const ABC_EXCLUDE = new Set(['g_nonstd','g_komplekty','g_other']);
  const skus = aggregateModels().filter(sk => !ABC_EXCLUDE.has(sk.groupId));
  const classified = classifyABC(skus).map(sk => ({...sk, ...classifyXYZ(sk)}));
  const grandRev = classified.reduce((s,sk) => s + sk.rev, 0);

  // Группируем по ячейке (AX, AY, ..., CZ)
  const buckets = {};
  ['A','B','C'].forEach(a => ['X','Y','Z'].forEach(b => buckets[a+b] = []));
  classified.forEach(sk => { buckets[sk.abc + sk.xyz].push(sk); });

  // Агрегация SKU по 4 зонам действий (объединяем 9 ячеек ABC×XYZ в 4 блока)
  const zoneBuckets = {green:[], yellow:[], gray:[], red:[]};
  Object.entries(buckets).forEach(([key, items]) => {
    const z = AX_ZONES[key];
    if(z && zoneBuckets[z]) zoneBuckets[z].push(...items);
  });

  const fmtRev = v => v >= 10 ? fmt(v,1) : fmt(v,2);
  const ZONE_LABELS = {
    green: 'Лидеры',
    yellow: 'Внимание',
    gray: 'Основа',
    red: 'На вывод'
  };
  const formatLegendItem = (zone) => {
    const items = zoneBuckets[zone];
    const zoneLbl = ZONE_LABELS[zone];
    const empty = items.length === 0;
    const cellRev = items.reduce((s,sk) => s + sk.rev, 0);
    const sharePct = grandRev > 0 ? (cellRev / grandRev) * 100 : 0;
    const selected = state.ax.selectedZone === zone ? ' selected' : '';
    if(empty){
      return `<div class="ax-legend-item zone-${zone} empty" data-ax-zone="${zone}">
        <div class="ax-leg-dot-col"></div>
        <div class="ax-leg-text">
          <div class="ax-leg-name">${zoneLbl}</div>
          <div class="ax-leg-meta">нет моделей</div>
        </div>
        <div class="ax-leg-numcol"><span class="ax-leg-count">—</span></div>
      </div>`;
    }
    return `<div class="ax-legend-item zone-${zone}${selected}" data-ax-zone="${zone}">
      <div class="ax-leg-dot-col"></div>
      <div class="ax-leg-text">
        <div class="ax-leg-name">${zoneLbl}</div>
        <div class="ax-leg-meta"><b>${fmt(sharePct,1)}%</b> выручки</div>
      </div>
      <div class="ax-leg-numcol">
        <span class="ax-leg-count">${items.length}<span class="ax-leg-count-u">моделей</span></span>
        <span class="ax-leg-rev"><b>${fmtRev(cellRev)}</b> млн ₽</span>
      </div>
    </div>`;
  };

  // Суммарные показатели и выручка по зонам для donut-секторов
  const zoneRev = {
    green:  zoneBuckets.green.reduce((s,sk) => s + sk.rev, 0),
    yellow: zoneBuckets.yellow.reduce((s,sk) => s + sk.rev, 0),
    gray:   zoneBuckets.gray.reduce((s,sk) => s + sk.rev, 0),
    red:    zoneBuckets.red.reduce((s,sk) => s + sk.rev, 0)
  };

  const greenCount = zoneBuckets.green.length;
  const yellowCount = zoneBuckets.yellow.length;
  const grayCount = zoneBuckets.gray.length;
  const redCount = zoneBuckets.red.length;
  const total = classified.length;

  // === Donut SVG ===
  const totalZoneRev = zoneRev.green + zoneRev.yellow + zoneRev.gray + zoneRev.red;
  const ZONE_ORDER = ['green','gray','yellow','red'];
  const ZONE_COLORS = {green:'var(--up)', yellow:'var(--warn)', gray:'var(--ink-3)', red:'var(--dn)'};
  const polarXY = (cx, cy, r, deg) => {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const donutSeg = (cx, cy, ro, ri, a1, a2) => {
    const [x1o,y1o] = polarXY(cx,cy,ro,a1);
    const [x2o,y2o] = polarXY(cx,cy,ro,a2);
    const [x2i,y2i] = polarXY(cx,cy,ri,a2);
    const [x1i,y1i] = polarXY(cx,cy,ri,a1);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return `M ${x1o.toFixed(2)} ${y1o.toFixed(2)} A ${ro} ${ro} 0 ${large} 1 ${x2o.toFixed(2)} ${y2o.toFixed(2)} L ${x2i.toFixed(2)} ${y2i.toFixed(2)} A ${ri} ${ri} 0 ${large} 0 ${x1i.toFixed(2)} ${y1i.toFixed(2)} Z`;
  };

  let donutPaths = '';
  if(totalZoneRev > 0){
    let acc = 0;
    ZONE_ORDER.forEach(z => {
      const share = zoneRev[z] / totalZoneRev;
      if(share <= 0) return;
      const angle = share * 360;
      const gap = Math.min(1.2, angle / 6);
      const a1 = acc + gap;
      const a2 = acc + angle - gap;
      acc += angle;
      if(a2 <= a1) return;
      const isSelected = state.ax.selectedZone === z ? ' selected' : '';
      donutPaths += `<path d="${donutSeg(120,120,96,60,a1,a2)}" fill="${ZONE_COLORS[z]}" class="ax-donut-seg${isSelected}" data-ax-zone="${z}" style="color:${ZONE_COLORS[z]}"><title>${ZONE_LABELS[z]}: ${zoneBuckets[z].length} моделей, ${fmtRev(zoneRev[z])} млн ₽ (${fmt(share*100,1)}%)</title></path>`;
    });
  }

  const donutSVG = `
    <svg viewBox="0 0 240 240" class="ax-donut-svg" preserveAspectRatio="xMidYMid meet">
      <circle cx="120" cy="120" r="96" fill="none" stroke="var(--border-soft)" stroke-width="0.5"/>
      <circle cx="120" cy="120" r="60" fill="none" stroke="var(--border-soft)" stroke-width="0.5"/>
      ${donutPaths}
      <text x="120" y="118" text-anchor="middle" class="ax-donut-center-num">${total}</text>
      <text x="120" y="138" text-anchor="middle" class="ax-donut-center-unit">Моделей</text>
      <text x="120" y="156" text-anchor="middle" class="ax-donut-center-lbl">всего</text>
    </svg>`;

  // Drill-down: список SKU в выбранной зоне
  let drillHtml = '';
  if(state.ax.selectedZone){
    const zone = state.ax.selectedZone;
    // Подготовка SKU с предвычисленными метриками для сортировки и фильтра
    const enriched = zoneBuckets[zone].map(sk => ({
      ...sk,
      margin: sk.rev > 0 ? ((sk.rev - sk.cost) / sk.rev) * 100 : 0
    }));

    // Применяем фильтр
    let filtered = enriched.slice();
    if(state.ax.drillFilter === 'top-rev' && enriched.length > 0){
      const sortedByRev = enriched.slice().sort((a,b) => b.rev - a.rev);
      const cutoff = Math.max(1, Math.ceil(sortedByRev.length * 0.3));
      const topSet = new Set(sortedByRev.slice(0, cutoff).map(x => x.sku));
      filtered = filtered.filter(x => topSet.has(x.sku));
    } else if(state.ax.drillFilter === 'high-margin'){
      filtered = filtered.filter(x => x.margin >= 40);
    } else if(state.ax.drillFilter === 'low-margin'){
      filtered = filtered.filter(x => x.margin < 25);
    }

    // Применяем сортировку
    const sortKeyMap = {
      sku:'sku', cat:'groupId', subcat:'subcatId', rev:'rev', cost:'cost',
      margin:'margin', orders:'orders', returns:'returns', lead:'leadDays',
      cv:'cv', stock:'stockQty'
    };
    const sortCol = state.ax.drillSort.col;
    const sortDir = state.ax.drillSort.dir === 'asc' ? 1 : -1;
    const sortField = sortKeyMap[sortCol] || 'rev';
    const items = filtered.slice().sort((a,b) => {
      const av = a[sortField], bv = b[sortField];
      if(typeof av === 'string') return av.localeCompare(bv, 'ru') * sortDir;
      return ((av || 0) - (bv || 0)) * sortDir;
    });

    const zoneLabel = ({
      green: 'Лидеры · обеспечить постоянное наличие',
      yellow: 'Особое внимание · важно но непредсказуемо',
      gray: 'Основа ассортимента · заказ под план',
      red: 'Кандидаты на вывод из ассортимента'
    })[zone];

      { id:'high-margin', label:'Высокая рентаб. ≥40%' },
      { id:'low-margin',  label:'Низкая рентаб. <25%' }
    ];

    const tableRows = items.length === 0
      ? `<tr><td colspan="9" class="ax-drill-empty">${enriched.length === 0 ? 'В этой ячейке нет моделей' : 'Под этот фильтр ничего не подошло'}</td></tr>`
      : items.map(sk => {
        const grp = CAT_TREE.find(g => g.id === sk.groupId);

        // Возвраты: ≤1.5% зелёный, 1.5-3% жёлтый, >3% красный

/* ============ ABC-анализ по клиентам ============ */

/* Хеш для детерминированной вариации метрик клиента между периодами.
   Один и тот же клиент при одном и том же периоде даёт стабильный результат. */
function _clientHash(id, period){
  let h = 2166136261;
  const s = id + ':' + period;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967296;
}

/* Метрики клиента за выбранный период:
   - revPeriod, prevPeriod — масштабированы по periodFactor()
   - growth — отклонение к предыдущему аналогичному периоду
   Для коротких периодов (today/7d/30d/90d/custom) добавляется небольшой
   детерминированный шум, чтобы динамика отличалась от годовой. */
function periodMetricsForClient(c){
  const pf = periodFactor();
  const revPeriod = c.rev * pf;
  let prevPeriod;
  if(state.period === 'year' || state.period === 'all'){
    prevPeriod = c.prev * pf;
  } else {
    const drift = 0.88 + _clientHash(c.id, state.period) * 0.24; // [0.88, 1.12]
    prevPeriod = c.prev * pf * drift;
  }
  const ordersPeriod = Math.max(0, Math.round(c.orders * pf));
  const growth = prevPeriod > 0
    ? ((revPeriod - prevPeriod) / prevPeriod) * 100
    : (revPeriod > 0 ? 100 : 0);
  return { revPeriod, prevPeriod, ordersPeriod, growth };
}

/* Классификация клиентов по ABC: 
   A — кумулятивно до 80% выручки (ключевые)
   B — 80-95% (средние) 
   C — 95-100% (хвост). 
   Классификация делается по годовой выручке (стабильная характеристика клиента,
   не должна перепрыгивать при смене периода). */
function classifyClients(){
  const sorted = CLIENTS.slice().sort((a,b) => b.rev - a.rev);
  const total = sorted.reduce((s,c) => s + c.rev, 0);
  let cum = 0;
  return sorted.map(c => {
    cum += c.rev;
    const cumPct = total > 0 ? (cum / total) * 100 : 0;
    const share = total > 0 ? (c.rev / total) * 100 : 0;
    const cls = cumPct <= 80 ? 'A' : (cumPct <= 95 ? 'B' : 'C');
    return {...c, class: cls, cumPct, share};
  });
}

// Детерминированная дневная кривая выручки клиента (сумма = годовой c.rev). Нужна для сравнения периодов А/Б.
// ПЛЕЙСХОЛДЕР: заменить на фактические сделки клиента из Bitrix24/1С.
const _clientDailyCache = {};
function clientDaily(c){
  if(_clientDailyCache[c.id]) return _clientDailyCache[c.id];
  const phase = _clientHash(c.id,'ph') * Math.PI * 2;
  const amp   = 0.30 + _clientHash(c.id,'amp') * 0.55;
  const trend = -0.35 + _clientHash(c.id,'tr') * 0.95;
  const freq  = 1 + Math.floor(_clientHash(c.id,'fq') * 2);
  const arr = new Array(TOTAL_DAYS); let sum2025 = 0;
  for(let i=0;i<TOTAL_DAYS;i++){
    const t = i/365;
    const v = Math.max(0.02, (1 + Math.sin(t*Math.PI*2*freq + phase)*amp*0.5) * (1 + trend*t));
    arr[i] = v; if(i < 365) sum2025 += v;
  }
  for(let i=0;i<TOTAL_DAYS;i++) arr[i] = arr[i]/sum2025 * c.rev;  // 2025 ≈ c.rev, 2026 продолжает тренд
  _clientDailyCache[c.id] = arr;
  return arr;
}
function clientRevForRange(c, from, to){ return sumRangeDates(clientDaily(c), from, to); }
