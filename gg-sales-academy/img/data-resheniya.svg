<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Пунктир ожидания упирается в яркую метку, от неё расходятся три равных исхода">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#233242" stroke-width="1" opacity=".1"/>
    </pattern>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="#06121a"/>
  <rect width="1600" height="640" fill="url(#g)"/>

  <!-- Договорились и ждём -->
  <circle cx="200" cy="320" r="30" fill="#06121a" stroke="#233242" stroke-width="3"/>
  <path d="M230 320H700" fill="none" stroke="#233242" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round"/>
  <!-- Названная дата: метка выше и ярче всего в кадре -->
  <path d="M760 186V468" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <circle cx="760" cy="152" r="24" fill="#06121a" stroke="#22D3EE" stroke-width="3"/>
  <!-- Три исхода, равные по длине и толщине -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M800 300L960 196H1240" stroke="#34D399"/>
    <path d="M800 320H1240" stroke="#f59e0b"/>
    <path d="M800 340L960 444H1240" stroke="#E05A50"/>
  </g>
  <g fill="#06121a" stroke-width="3">
    <circle cx="1290" cy="196" r="38" stroke="#34D399"/>
    <circle cx="1290" cy="320" r="38" stroke="#f59e0b"/>
    <circle cx="1290" cy="444" r="38" stroke="#E05A50"/>
  </g>
</svg>
