name: keys.so collect (конкуренты и семантика)

# Тянет данные keys.so (сводка домена, органика, конкуренты, реклама) в
# data/keyso/ проекта SEO/GEO. keys.so закрыт из web-контейнера Claude сетевой
# политикой, поэтому живой сбор - здесь. Ключ REST API - в GitHub Secrets
# (KEYSO_TOKEN, см. gg-seo-geo-monster/docs/KEYS_SO.md). Запуск вручную; для
# регулярного обновления раскомментируй schedule. Тариф Профессиональный: 3000/сутки.

on:
  workflow_dispatch:
    inputs:
      db:
        description: "База/регион keys.so (msk = Москва Яндекс; сверить в кабинете)"
        default: "msk"
      per:
        description: "Строк на отчёт (беречь суточный лимит 3000)"
        default: "100"
      dry_run:
        description: "1 = показать план запросов без похода в сеть"
        default: "0"
      deep:
        description: "1 = глубокий сбор по каждому домену (семантика+PPC+объявления+страницы)"
        default: "0"
      targets:
        description: "Путь к файлу целей (по умолчанию рынок перегородок)"
        default: "gg-seo-geo-monster/data/keyso-targets.json"
      outdir:
        description: "Каталог вывода (по умолчанию data/keyso; для GENTERO - data/keyso-gentero)"
        default: "gg-seo-geo-monster/data/keyso"
      own:
        description: "own-домен для групповой пары deep (перегородки genglass.ru; офис gen-group.ru)"
        default: "genglass.ru"
  schedule:
    - cron: "30 2 * * 1"   # еженедельно, пн 05:30 МСК - контроль рынка перегородок (goal Ивана 14.07)

permissions:
  contents: write

concurrency:
  group: keyso-collect
  cancel-in-progress: false

env:
  DEEP: ${{ github.event.inputs.deep || '0' }}
  KEYSO_TOKEN: ${{ secrets.KEYSO_TOKEN }}
  KEYSO_DB: ${{ github.event.inputs.db || 'msk' }}
  KEYSO_PER: ${{ github.event.inputs.per || '100' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
  KEYSO_OWN: ${{ github.event.inputs.own || 'genglass.ru' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Сбор keys.so
        run: node gg-seo-geo-monster/scripts/keyso.mjs "${{ github.event.inputs.targets || 'gg-seo-geo-monster/data/keyso-targets.json' }}" "${{ github.event.inputs.outdir || 'gg-seo-geo-monster/data/keyso' }}"

      - name: Коммит результата
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gg-seo-geo-monster/data
          if git diff --cached --quiet; then
            echo "Изменений в keyso нет"
          else
            git commit -m "chore(seo-geo): обновление данных keys.so ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do git push && break || sleep $((2**i)); done
          fi
