# Вкладка «Отчет» Яндекс Маркета: ежемесячный отчёт руководителю (месяц к прошлому месяцу).
# Аналог ozon-monthly-report.yaml, адаптирован под данные Маркета (E036: экран не копируется как есть).
id: ym-monthly-report
title: "Отчет Маркета: оборот, причины отклонений, затраты площадки, реклама, непродаваемые товары"
version: 1
status: approved   # ответы 1-5 (01.10), эталон «да», общие расходы «2а», неполный месяц «3 да» (01.10)
owner: "Иван Раюшкин"
approved_at: "2026-10-01"   # ответы в чате 01.10: «1 а (аналитика по артикулам за выбранный период) 2а 3а 4а 5а», затем «да, 2а, 3 да»
decision: >
  Руководитель раз в месяц видит, вырос или упал оборот Маркета (всего, зеркала, мебель), за счёт чего,
  сколько забрал Маркет по статьям, сколько ушло на рекламу и какие товары снимать или перезаливать.
good_direction: "оборот и К выплате вверх, доля сборов вниз, ДРР вниз"
entity: "месяц x статья (и артикул для вклада в отклонение)"
key: [month, line]
type: derived
formula_text: >
  База (ответ 1): ИТОГО блока «Аналитика по артикулам (за выбранный период)» на «Деньгах» Маркета за те же
  даты - ACC = pnl_sku_netting_daily.ndjson, проводки отчёта по взаиморасчётам по дате ТРАНЗАКЦИИ, функция
  accAgg (build-katya.ts). Оборот = «Начислено», штуки = «Итого, шт» (продано - возвраты).
  Затраты (ответ 2а): те же статьи, что в ACC: Комиссия, Доставка, Эквайринг, Хранение, Продвижение, Прочие
  услуги -> Всего сборов -> К выплате -> С\С -> Валовая -> АДМ 30% от К выплате -> Налоги 15% от «Оплатил
  клиент» + «Доставка покупателя» (база Маркета, knowledge/semantic/ym-rates-adm-tax.md) -> Чистая. Баллы
  отдельной строкой (начислено / списано баллами, cofin), в сборы не входят - как в ACC.
  Причины: те же разложения, что у OZON: оборот = штуки x цена, Δ = (u1-u0)·p0 + (p1-p0)·u1; статья
  s = объём + ставка, Δs = (A1-A0)·r0 + (r1-r0)·A1; топ артикулов по вкладу. Подпись «разложение цифр, а не причина».
  Реклама (ответ 3а): расход = Продвижение (Буст продаж, Полки, Товарные баннеры) из тех же проводок; ДРР =
  расход / заказанный оборот (daily_totals Маркета). Выручка рекламных заказов и окупаемость - «нет данных»
  (API рекламы Маркета не подключён, ads_reports.json), не 0.
  Непродаваемые (ответ 4а): правила и пороги OZON [ГИПОТЕЗА]: показы в месяце > 0, 0 заказов (кроме
  отменённых) за 60 дней, карточке 60+ дней; источник показов sku_views.ndjson (часть строк недельные -
  суммируются в месяц по period_from), заказы orders.ndjson. Топ-5 в группе.
  Зеркала / мебель (ответ 5а): по категории артикула (префикс, ACC_CAT / таксономия), мебель = всё кроме зеркал.
  Общие расходы кабинета (ответ «2а» 01.10): проводки реестра без артикула (удержания без заказа, премия;
  ACC_DOC acct/prem) - отдельной строкой под «Чистой прибылью по артикулам», вычитаются из чистой прибыли;
  ИТОГО по артикулам остаётся равным блоку на «Деньгах». Приходят в последние дни месяца.
code_module: "analytics-mvp/src/scripts/ym/report-page-ym.ts (новый файл; report-page.ts OZON не трогать)"
filters:
  include_statuses: []
  exclude:
    - "непродаваемые: карточки с первым показом позже начала 60-дневного окна"
    - "окупаемость рекламы и выручка рекламных заказов не считаются (нет источника), не 0"
cancellations_returns:
  mode: "net: продано - возвраты по проводкам («Получено от потребителей» - «Возвращено потребителям»)"
  return_date_basis: "дата транзакции возврата в реестре"
date_field: "дата транзакции реестра платежей (как блок ACC); дата заказа - для ДРР и непродаваемых"
mode: period
conversion_window_days: null
timezone: Europe/Moscow
interval: "[1-е число, последний день месяца]; незакрытый месяц [1-е, последний день реестра] против [1-е, то же число] прошлого (как OZON 2а; подтверждено 01.10 «3 да»). Последний день реестра - по отстающему кабинету среди активных за 30 дней"
partial_period: mark
additive_over_time: true
accounting_basis: "проводки отчёта по взаиморасчётам Маркета по дате транзакции (как ACC на «Деньгах»)"
empty_value: "null: нет данных, не 0"
reconciliation:
  - "ИТОГО отчёта за месяц = ИТОГО блока ACC на «Деньгах» за те же даты (одна функция, не копия - К9)"
  - "независимая сверка: «Оплатил клиент» за месяц против отчёта о платежах Маркета (Получено - Возвращено от потребителей); реализация - realization_monthly"
known_gaps:
  - "непродаваемые: возраст карточки (60+ дней у OZON) не проверяется - отчёт показов Маркета собирается с 31.08.2026, даты появления карточки в данных нет; новая карточка без заказов попадает в список (пометка на странице) [ГИПОТЕЗА]"
  - "непродаваемые: статья «Хранение» по артикулу у Маркета нулевая (январь-сентябрь 2026), правило «снятие при 90+ дн и платном хранении» не срабатывает; снятие предлагается как второй шаг"
  - "показы: первая неделя (31.08-06.09) одной строкой, отнесена к сентябрю целиком, включая 31.08"
  - "реестр отстаёт на день: последний день месяца может прийти позже (points_after_ledger, PR #438)"
