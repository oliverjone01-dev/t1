# Спека блока «План с 15.10: как идём к цели» (страница «Тесты» OZON). Модуль: analytics-mvp/src/scripts/plan-tab.ts
id: ozon-plan-15-10
title: "План с 15.10: заказы 10 карточек и магазина к порогу и цели, реклама и цена к плану"
version: 7
status: approved
owner: "Иван Раюшкин"
approved_at: "2026-10-15"   # v1: определения - «да» Ивана на 6 вопросов («по Москве», «меньше - зеленее»). v2 (15.10): «да» Ивана на эталоны 137/49/179, сверка с кабинетом, съём 2 раза в день. v3 (15.10, Иван «1-3 да»): сверка по каждой карточке, допуск 1 шт, утром перезабор только воронки. v4 (15.10, Иван «б» на V3 ФЕНИКСА iter3): 27 выводимых артикулов вне счёта карточки в базе и окне, пороги 5 карточек пересчитаны правилом 15% (plan v3); спидометр «Реклама» - за месяц, а не за неделю (Иван 15.10); v5 (15.10, Иван): все спидометры за месяц, реклама - все клики без «Оплаты за заказ», карточки - база до 15.10 и порог с 15.10; раздел 5 - статус цены по факту, скидка OZON было/стало; охват сверки с кабинетом - все дни окна (ФЕНИКС B1c); v6 (15.10, Иван «По факту», «По окну 15-28.10»): «на пути» по окну решения; v7 (15.10, Иван): спидометры - период 15-31.10, факт за период к плану периода, 01-14.10 справочно
decision: "29.10 по каждой карточке: заказов за 15-28.10 не меньше порога - оставляем, меньше - откат клика и цены. Решаем только после прихода заказов за 28.10 (иначе на блоке красное предупреждение, ФЕНИКС N8)"
good_direction: "up для заказов и оборота, down для расхода рекламы (Иван 15.10: везде меньше - зеленее)"
entity: "отправление OZON (orders_daily.order), шт = units"
key: [order]
type: cumulative
formula_text: >
  Заказы карточки = сумма units по orders_daily без status=cancelled, sku в объединённой карточке (plan_card_groups_1510.json - состав на 15.10, Иван 16.10; с 16.10 card_groups.json ночной из API и в план не идёт) кроме plan.withdrawn (v4), d в [15.10, 28.10].
  Порог карточки посчитан по той же базе без выводимых (plan v3, v8/withdraw_base_1510.py).
  Магазин = то же по всем sku. Нужное магазину к дню n = goalPath(14+n) - goalPath(14), goalPath(d) = 300/31*d + (355-300)*clamp(d-16,0,15)/15.
  Реклама: клик главного = ads_sku_daily.sp на главный sku без кампании 28753239 и без 11 кампаний на минимум; минимальный клик = sp на min_arts;
  11 кампаний = ads_daily.sp по id. Неделя чт-ср. Статус расхода: <=100% в плане, <=120% выше, >120% перерасход.
  Спидометры (v7, Иван 15.10: «план до конца месяца по каждому спидометру начиная с 15.10 и факт за этот период; 01-14.10 справочно»):
  период [15.10, 31.10], с ноября - [1-е, конец месяца]. Стрелка = факт за период по последний день источника / план всего периода;
  белая метка = план на последний день данных; цветные зоны шкалы строятся от метки (Иван 15.10, G1), цвет = факт к этой метке (заказы: от 100% зелёный, 70-100 жёлтый; реклама: до 100 зелёный, до 120 жёлтый).
  План на день: карточки threshold/14 (Σ за 15-31.10 = Σпорогов/14×17 = 170); магазин и оборот - приращение пути цели «средне» (355 − 135,5 = 219,5 шт; 24,2 − 9,44 = 14,76 млн);
  реклама - все клики ads_daily без 28753239, ставка (283 110 + прочие по темпу 01-13.10 51 598)/7 в день (813 тыс. за период).
  Под спидометром справочно факт 01-14.10 (только если за эти дни есть данные). «Карточки на пути» - по окну решения 15-28.10 к порогу на дату, нужно 5, 1-2 дня - «рано».
code_module: analytics-mvp/src/scripts/plan-tab.ts
filters:
  include_statuses: ["все, кроме cancelled"]
  exclude: ["кампания 28753239 «Оплата за заказ» - не клик"]
cancellations_returns:
  mode: net                # без отмен; отмены приходят с опозданием (01-10.10 12,9%, 11-13.10 6,5%) - свежие дни предварительные
  return_date_basis: order_date
date_field: created        # in_process_at из API
mode: period
timezone: Europe/Moscow     # Иван 15.10 «по Москве»: orders_daily.t (полное in_process_at, добавлено 15.10) + 3 ч; без t - UTC-дата d до ночного перезабора истории
interval: "[from, to]"
partial_period: mark       # последние 3 дня бледные; последний полный день по МСК = последний d выгрузки; реклама по товарам - до последнего полного дня (adsFullDay, покрытие от 95%)
additive_over_time: true
accounting_basis: order_date   # по дате заказа (in_process_at), не по отгрузке
empty_value: "null"        # дня нет в источнике - пропуск; внутри полного окна день без строки рекламы = 0 (кампания не тратила)
source:
  endpoint: "Seller API postings (orders_daily), Performance API (ads_daily, ads_sku_daily), analytics (sku_views)"
  fields: [d, status, sku, units, revenue, sp, cl, cid, vsearch, views, pdp, cart]
  limits: "ads_sku_daily доливается по кампаниям несколько ночей (ads_sku_state.json)"
  latency: "1 день; реклама по товарам 1-3 дня"
  lookback_days: null
reconciliation:
  against_family: api       # sku_views (аналитика OZON) против orders_daily (отправления)
  document: "01-13.10: orders_daily 155 с отменами / 137 без; sku_views units 153; разница 2 шт - граница UTC и дня OZON"
  tolerance: "0.02"
  second_family: cabinet    # v2: кабинет «Аналитика → Заказано, шт» с отменами по товарам 10 карточек, съём чата по чт и 29.10 (cabinet_orders_check.ndjson); v3: сверка ПО КАЖДОЙ карточке (решение 29.10 - по карточке), по парам «товар карточки + день» из выгрузки; допуск на карточку 2% и не меньше 1 шт (Иван 15.10: 1 шт - с полем t день заказа по МСК, как в кабинете); охват - все пары «товар + день» за каждый день от 15.10 до конца выгрузки (вчера от ts съёма по МСК, без ts - последний день строк, не позже последнего дня заказов; v4, ФЕНИКС B1c), неполная выгрузка = сверка не пройдена
funnel_tests_snapshots: "v3: съём утром и вечером; ключ роль+товар+тест+группа+дата, повтор заменяет; агрегат группы test в контрольный ряд не идёт; день не закрыт = full=false ИЛИ время среза ts в тот же день по МСК - в ряды не входит, показан строкой «день не закрыт, срез ЧЧ:ММ» по уникальным тестовым товарам; утром чат перезабирает вчера только воронку (Иван 15.10), состояния (цены, акции, буст) за вчера не трогает; позиция для блока - последнее значение"
inference_rules:
  min_n: null
  mde: "порог карточки: Пуассон, карточка без эффекта проходит не чаще 15%"
  causal_claims: forbidden_without_control   # цена и клик в одних карточках - эффект общий
golden_rows:
  - input: "orders_daily 01-13.10, весь магазин, без отмен"
    expected: "137 (по дню UTC, поле d; по дню МСК - отдельный эталон после ночного сбора с полем t)"
    confirmed_by: "Иван 15.10 «да»; ФЕНИКС 15.10; тест plan-tab.test.ts на замороженной выборке __fixtures__/plan-golden-orders.ndjson (186 строк, 15.10), точное равенство"
  - input: "TRUBIS 160 GGT-03-3-3-E-16080, заказы карточки 14.09-11.10 без отмен"
    expected: "49 (12,25 в неделю), порог 31"
    confirmed_by: "Иван 15.10 «да»; Excel 15.10; ФЕНИКС 15.10; тест plan-tab.test.ts (48 товаров объединённой карточки)"
  - input: "магазин, нужное за 15-28.10 по пути цели октября «средне»"
    expected: "179"
    confirmed_by: "Иван 15.10 «да»; ФЕНИКС 15.10; тест plan-tab.test.ts"
