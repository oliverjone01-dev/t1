name: Импорт объединённых карточек из Google-таблицы

# Тянет карту «какие SKU склеены в одну карточку OZON» из Google-таблицы (CSV-экспорт)
# в data/card_groups.json. Auth не нужен - читаем CSV-экспорт вкладки, поэтому таблица
# должна быть открыта «Все, у кого есть ссылка → Читатель». Запуск вручную.

on:
  workflow_dispatch:
    inputs:
      sheet_url:
        description: "Ссылка на Google-таблицу (или готовый CSV-export URL)"
        default: "https://docs.google.com/spreadsheets/d/18_7cjRqTMFoUtsuKu3Gqc1vr1DJs835Rgsi6kG0Inb8/edit?usp=sharing"

permissions:
  contents: write

concurrency:
  group: card-groups-import
  cancel-in-progress: false

env:
  SHEET_URL: ${{ github.event.inputs.sheet_url || 'https://docs.google.com/spreadsheets/d/18_7cjRqTMFoUtsuKu3Gqc1vr1DJs835Rgsi6kG0Inb8/edit?usp=sharing' }}

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Импорт из таблицы -> card_groups.json
        run: npm run import:cards -- --url "$SHEET_URL"

      - name: Коммит карты карточек
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/data/card_groups.json
          if git diff --staged --quiet; then echo "карта без изменений"; exit 0; fi
          git commit -m "data: импорт объединённых карточек из Google-таблицы $(date -u +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((2**i))
          done
          echo "push не удался"; exit 1
