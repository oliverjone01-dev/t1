/* ============ Сезонность ============ */
function heatColor(t){
  // t от 0 (мин в строке) до 1 (макс в строке).
  // 4 ступени с лёгким градиентом внутри каждой: красный → оранжевый → жёлтый → зелёный.
  if(t < 0.25){
    const u = t / 0.25;                 // 0..1 внутри красного
    return `hsl(348, ${58 + u*4}%, ${28 + u*7}%)`;
  } else if(t < 0.5){
    const u = (t - 0.25) / 0.25;        // оранжевый
    return `hsl(22, ${62 + u*4}%, ${33 + u*6}%)`;
  } else if(t < 0.75){
    const u = (t - 0.5) / 0.25;         // жёлтый
    return `hsl(48, ${56 + u*4}%, ${34 + u*5}%)`;
  } else {
    const u = (t - 0.75) / 0.25;        // зелёный
    return `hsl(152, ${50 + u*12}%, ${30 + u*10}%)`;
  }
}
function heatTextColor(t){
  // Для жёлтой зоны (середина) текст слегка темнее, чтобы не было перегруза белого.
  if(t >= 0.5 && t < 0.75) return 'rgba(255,255,255,.94)';
  return 'rgba(255,255,255,.96)';
}

/* Рангово-процентильная нормализация значений строки в диапазон [0, 1].
   Возвращает массив t-значений той же длины. Используется вместо линейной
   нормализации (val-min)/(max-min): она ломается на бимодальных данных
   (например, выходные vs будни), где почти все значения уходят в крайние цвета.
   Ранг гарантирует распределение по всем 4 цветовым ступеням heatColor.
   Связанные значения (ties) получают средний ранг. Все одинаковые → t = 0.5. */
function rankPercentile(row){
  const n = row.length;
  if(n <= 1) return row.map(() => 0.5);
  const indexed = row.map((v, i) => ({v, i})).sort((a,b) => a.v - b.v);
  // Если все значения равны — возвращаем 0.5 (нейтральный цвет)
  if(indexed[0].v === indexed[n-1].v) return row.map(() => 0.5);
  const ranks = new Array(n);
  let i = 0;
  while(i < n){
    let j = i;
    while(j < n && indexed[j].v === indexed[i].v) j++;
    const avgRank = (i + j - 1) / 2;
    for(let k = i; k < j; k++) ranks[indexed[k].i] = avgRank / (n - 1);
    i = j;
  }
  return ranks;
}

function renderSeasonality(){
  const measure = state.season.measure;
  const series = getSeasonalitySeries();
  const labels = series.labels;
  const data = series.data;
  const granularity = series.granularity;
  const n = labels.length;
  const unitLabel = measure === 'rev' ? 'млн ₽' : 'шт';
  const fmtVal = v => measure === 'rev' ? fmt(v, granularity === 'day' ? 2 : 1) : fmt0(v);

  // Адаптивная плотность: при N≥20 (дни) — мельче шрифт и padding
  const dense = n >= 18;
  const veryDense = n >= 28;
  const denseClass = veryDense ? 'sz-very-dense' : (dense ? 'sz-dense' : '');

  // Названия гранулярности
  const granName = granularity === 'month' ? 'месяцам' : granularity === 'week' ? 'неделям' : 'дням';
  // По дням это уже не сезонность (она годовая), а ежедневная динамика
  const cardTitle = granularity === 'day' ? `Динамика продаж по дням` : `Сезонность по ${granName}`;

  let bodyRows = '';
  CAT_TREE.forEach(g => {
    const row = data[g.id];
    if(!row) return;
    const min = Math.min(...row), max = Math.max(...row), range = max - min || 1;
    const isExpanded = state.season.expanded.has(g.id);
    const peakIdx = row.indexOf(max);
    const rowSum = row.reduce((s,x) => s + x, 0);
    const tArr = rankPercentile(row);

    const cells = row.map((v, i) => {
      const t = tArr[i];
      const bg = heatColor(t);
      const tx = heatTextColor(t);
      const isPeak = i === peakIdx && range > 0;
      const sharePct = rowSum > 0 ? (v/rowSum*100).toFixed(1) : '0';
      return `<td class="sz-cell ${isPeak?'peak':''}" style="background:${bg};color:${tx}" data-tip="${g.name} · ${labels[i]}|Значение|${fmtVal(v)} ${unitLabel}|Доля в строке|${sharePct}%">${fmtVal(v)}</td>`;
    }).join('');

    bodyRows += `<tr class="sz-row-grp ${isExpanded?'expanded':''}" data-toggle-season="${g.id}">
      <td class="label">${g.name}</td>
      ${cells}
    </tr>`;

    if(isExpanded){
      g.children.forEach((sub, subIdx) => {
        const sRow = data[sub.id];
        if(!sRow) return;
        const sMin = Math.min(...sRow), sMax = Math.max(...sRow), sRange = sMax - sMin || 1;
        const sPeakIdx = sRow.indexOf(sMax);
        const sTArr = rankPercentile(sRow);
        const sCells = sRow.map((v, i) => {
          const t = sTArr[i];
          const bg = heatColor(t);
          const tx = heatTextColor(t);
          const isPeak = i === sPeakIdx && sRange > 0;
          return `<td class="sz-cell ${isPeak?'peak':''}" style="background:${bg};color:${tx}" data-tip="${sub.name} · ${labels[i]}|Значение|${fmtVal(v)} ${unitLabel}">${fmtVal(v)}</td>`;
        }).join('');
        const subClass = [
          'sz-row-sub',
          subIdx === 0 ? 'sub-first' : '',
          subIdx === g.children.length - 1 ? 'sub-last' : ''
        ].filter(Boolean).join(' ');
        bodyRows += `<tr class="${subClass}"><td class="label">${sub.name}</td>${sCells}</tr>`;
      });
    }
  });

  const head = `<tr><th>Категория</th>${labels.map(l => `<th>${l}</th>`).join('')}</tr>`;

  $('#seasonality').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">${cardTitle}</div>
        <div class="card-sub">${n} ${granularity === 'day' ? 'дней' : granularity === 'week' ? 'недель' : 'месяцев'} · цвет по рангу внутри строки (красный → оранжевый → жёлтый → зелёный) · клик по строке — раскрыть подкатегории</div>
      </div>
      <div class="card-actions">
        <div class="tabs">
          <button class="tab ${measure==='rev'?'act':''}" data-season-measure="rev">Выручка ₽</button>
          <button class="tab ${measure==='ord'?'act':''}" data-season-measure="ord">Заказы шт</button>
        </div>
      </div>
    </div>
    <div class="sz-wrap">
      <table class="sz-table ${denseClass}">
        <thead>${head}</thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
    <div class="sz-legend">
      <span>низкий сезон</span>
      <div class="sz-legend-bar"></div>
      <span>пик сезона</span>
      <span style="margin-left:auto">обведена ячейка пика ${granularity === 'day' ? 'дня' : granularity === 'week' ? 'недели' : 'месяца'} у каждой категории</span>
    </div>
  `;
}

/* ============ СОБЫТИЯ ============ */
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const target = e.target.closest('[data-tip]');
  if(target){
    const parts = target.dataset.tip.split('|');
    let html = `<div class="tip-title">${parts[0]}</div>`;
    for(let i=1; i<parts.length; i+=2){
      if(parts[i] && parts[i+1]) html += `<div class="tip-row"><span>${parts[i]}</span><span class="v">${parts[i+1]}</span></div>`;
    }
    tip.innerHTML = html; tip.classList.add('show');
    const rect = tip.getBoundingClientRect();
    let x = e.clientX+14, y = e.clientY+14;
    if(x+rect.width  > window.innerWidth-10)  x = e.clientX-rect.width-14;
    if(y+rect.height > window.innerHeight-10) y = e.clientY-rect.height-14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  } else { tip.classList.remove('show'); }
});

document.addEventListener('click', e => {
  // Период
  const pb = e.target.closest('.pb[data-p]');
  if(pb){ state.period = pb.dataset.p; renderAll(); return; }
  if(e.target.closest('#btn-range')){ $('#cmp-panel').classList.remove('open'); $('#range-panel').classList.toggle('open'); return; }
  if(e.target.id === 'range-apply'){
    state.customFrom = $('#range-from').value;
    state.customTo   = $('#range-to').value;
    state.period = 'custom';
    $('#range-panel').classList.remove('open');
    renderAll(); return;
  }
  if(e.target.id === 'range-cancel'){ $('#range-panel').classList.remove('open'); return; }
  if(!e.target.closest('#range-panel') && !e.target.closest('#btn-range')){
    $('#range-panel').classList.remove('open');
  }

  // Сравнение двух периодов (А/Б)
  if(e.target.closest('#btn-compare')){ $('#range-panel').classList.remove('open'); $('#cmp-panel').classList.toggle('open'); return; }
  if(e.target.id === 'cmp-apply'){
    state.compare.aFrom = $('#cmp-a-from').value;
    state.compare.aTo   = $('#cmp-a-to').value;
    state.compare.bFrom = $('#cmp-b-from').value;
    state.compare.bTo   = $('#cmp-b-to').value;
    state.compare.active = true;
    $('#cmp-panel').classList.remove('open');
    $('#btn-compare').classList.add('compare-on');
    renderCompareChip();
    renderKPIs();
    renderPlanFact();
    renderMatrix();
    renderClients(); return;
  }
  if(e.target.id === 'cmp-off'){
    state.compare.active = false;
    $('#cmp-panel').classList.remove('open');
    $('#btn-compare').classList.remove('compare-on');
    renderCompareChip();
    renderKPIs();
    renderPlanFact();
    renderMatrix();
    renderClients(); return;
  }
  if(!e.target.closest('#cmp-panel') && !e.target.closest('#btn-compare')){
    $('#cmp-panel').classList.remove('open');
  }

  // Drill-down treemap
  const drillTarget = e.target.closest('[data-drill]');
  if(drillTarget){ state.drillCategory = drillTarget.dataset.drill; renderDrill(); return; }
  if(e.target.id === 'drill-back' || e.target.closest('#drill-back')){
    state.drillCategory = null; renderDrill(); return;
  }

  // Структура продаж - мульти-переключатель метрик в режиме сравнения (тоггл на одном графике)
  const cmpMetric = e.target.closest('[data-cmp-metric]');
  if(cmpMetric){
    if(!(state.compare.metrics instanceof Set)) state.compare.metrics = new Set(['rev']);
    const k = cmpMetric.dataset.cmpMetric;
    if(state.compare.metrics.has(k)) state.compare.metrics.delete(k); else state.compare.metrics.add(k);
    if(state.compare.metrics.size === 0) state.compare.metrics.add('rev');
    renderPlanFact(); return;
  }

  // Категории × Каналы - переключатель метрики (Выручка / Заказы) в режиме сравнения
  const mxMetric = e.target.closest('[data-mx-metric]');
  if(mxMetric){
    state.mx.cmpMetric = mxMetric.dataset.mxMetric;
    renderMatrix(); return;
  }

  // Категории × Каналы - переключатель метрики ячеек (Выручка / Маржа / Заказы / Доля)
  const mxMain = e.target.closest('[data-mx-mainmetric]');
  if(mxMain){
    state.mx.metric = mxMain.dataset.mxMainmetric;
    renderMatrix(); return;
  }

  // Категории × Каналы - сортировка по заголовку столбца
  const mxSort = e.target.closest('[data-mx-sort]');
  if(mxSort){
    const col = mxSort.dataset.mxSort;
    if(state.mx.sortCol === col){
      state.mx.sortDir = state.mx.sortDir === 'desc' ? 'asc' : 'desc';
    } else {
      state.mx.sortCol = col;
      state.mx.sortDir = (col === 'name') ? 'asc' : 'desc';
    }
    renderMatrix(); return;
  }
  // Категории × Каналы - раскрытие категории
  const mxToggle = e.target.closest('[data-mx-toggle]');
  if(mxToggle){
    const gid = mxToggle.dataset.mxToggle;
    if(state.mx.expanded.has(gid)) state.mx.expanded.delete(gid);
    else state.mx.expanded.add(gid);
    renderMatrix(); return;
  }

  // ABC-XYZ - клик по зоне (выбор/сброс)
  const axZone = e.target.closest('[data-ax-zone]');
  if(axZone && !axZone.classList.contains('empty')){
    const zone = axZone.dataset.axZone;
    state.ax.selectedZone = state.ax.selectedZone === zone ? null : zone;
    renderABCXYZ(); return;
  }
  // ABC-XYZ - закрытие drill-down
  if(e.target.id === 'ax-drill-close'){
    state.ax.selectedZone = null;
    renderABCXYZ(); return;
  }
  // ABC-XYZ drill - чипса фильтра
  const drillFilterBtn = e.target.closest('[data-drill-filter]');
  if(drillFilterBtn){
    state.ax.drillFilter = drillFilterBtn.dataset.drillFilter;
    renderABCXYZ(); return;
  }
  // ABC-XYZ drill - клик по заголовку столбца → сортировка
  const drillSortTh = e.target.closest('.ax-drill-table thead th[data-drill-sort]');
  if(drillSortTh){
    const col = drillSortTh.dataset.drillSort;
    if(state.ax.drillSort.col === col){
      state.ax.drillSort.dir = state.ax.drillSort.dir === 'desc' ? 'asc' : 'desc';
    } else {
      state.ax.drillSort.col = col;
      // Текстовые колонки по умолчанию по возрастанию, числовые — по убыванию
      state.ax.drillSort.dir = (col === 'sku' || col === 'cat' || col === 'subcat') ? 'asc' : 'desc';
    }
    renderABCXYZ(); return;
  }

  // Клиенты - клик по карточке класса A/B/C
  const classCard = e.target.closest('[data-client-class]');
  if(classCard){
    const cls = classCard.dataset.clientClass;
    state.clients.selectedClass = state.clients.selectedClass === cls ? null : cls;
    renderClients(); return;
  }
  // Клиенты - закрытие drill
  if(e.target.id === 'cl-drill-close'){
    state.clients.selectedClass = null;
    renderClients(); return;
  }

  // Сезонность - мера
  const sm = e.target.closest('[data-season-measure]');
  if(sm){ state.season.measure = sm.dataset.seasonMeasure; renderSeasonality(); return; }
  // Сезонность - раскрытие
  const stog = e.target.closest('[data-toggle-season]');
  if(stog){
    const gid = stog.dataset.toggleSeason;
    if(state.season.expanded.has(gid)) state.season.expanded.delete(gid);
    else state.season.expanded.add(gid);
    renderSeasonality(); return;
  }
});

// Старый change handler удалён — теперь dropdown полностью на click
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open'));
  }
});

// Заглушка пустого обработчика (отдельный слушатель change больше не нужен)
document.addEventListener('change', () => {});

function tick(){
  const d = new Date();
  const z = n => n.toString().padStart(2,'0');
  const el = $('#clock');
  if(el) el.textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
setInterval(tick, 1000); tick();

function renderAll(){
  $$('.pb[data-p]').forEach(b => b.classList.toggle('act', b.dataset.p === state.period));
  renderKPIs();
  renderPlanFact();
  renderDrill();
  renderProfitability();
  renderMatrix();
  renderABCXYZ();
  renderClients();
  renderSeasonality();
}
renderAll();
window.addEventListener('resize', () => renderDrill());
</script>
