name: Manager photos (фото менеджеров из Bitrix -> хаб)

# Тянет PERSONAL_PHOTO менеджеров из Bitrix24 (user.get) и кладёт в
# analytics-mvp/public/dashboards/mgr/<slug>.jpg. Коммитит в main, деплой публикует.
# Только чтение Bitrix. Ручной запуск + раз в неделю.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # понедельник 04:23 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: mgr-photos
  cancel-in-progress: true

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  photos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Тянем фото из Bitrix
        run: |
          set -euo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::Нет секрета B24_WEBHOOK_URL"; exit 1; fi
          npx tsx src/scripts/b24/fetch-mgr-photos.ts
      - name: Commit фото в main
        id: commit
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/public/dashboards/mgr
          if git diff --staged --quiet; then echo "без изменений"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(hub): фото менеджеров из Bitrix $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main; git rebase origin/main || git rebase --abort; sleep $((2**i))
          done
          echo "push не удался"; exit 1
      - name: Триггер деплоя
        if: steps.commit.outputs.changed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}' || echo "деплой не дёрнулся (не критично, сработает по расписанию)"
