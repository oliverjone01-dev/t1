name: OZON cabinet validated publication
run-name: cabinet-${{ inputs.blob_sha }}-${{ inputs.base_sha }}
on:
  workflow_dispatch:
    inputs:
      blob_sha:
        description: Sanitized cabinet capture blob (no raw reports)
        required: true
      backfill_since:
        description: Optional earliest historical catalog/competitor observation day (YYYY-MM-DD)
        required: false
        default: ''
      base_sha:
        description: Expected current cabinet capture blob
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: ozon-cabinet-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BLOB_SHA: ${{ inputs.blob_sha }}
      BACKFILL_SINCE: ${{ inputs.backfill_since }}
      BASE_SHA: ${{ inputs.base_sha }}
    defaults:
      run:
        working-directory: analytics-mvp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Receive only a bounded JSON blob against the expected source
        run: |
          set -euo pipefail
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git hash-object data/cabinet_capture.json)" = "$BASE_SHA"
          echo "CHECKED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BLOB_SHA" > "$RUNNER_TEMP/blob.json"
          python3 - <<'PY'
          import base64,json,os,pathlib
          b=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'blob.json').read_text())
          assert b['encoding']=='base64' and 0 < b['size'] <= 32_000_000
          raw=base64.b64decode(b['content']); assert len(raw)==b['size']
          json.loads(raw)
          pathlib.Path(os.environ['RUNNER_TEMP'],'incoming.json').write_bytes(raw)
          PY
          node --import tsx src/scripts/ozon/validate-cabinet-capture.ts "$RUNNER_TEMP/incoming.json"
          node --import tsx src/scripts/ozon/validate-cabinet-capture.ts data/cabinet_capture.json
          args=()
          if [ -n "$BACKFILL_SINCE" ]; then
            [[ "$BACKFILL_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            args=(--backfill-since "$BACKFILL_SINCE")
          fi
          python3 -B tools/cabinet/accept_capture.py "${args[@]}" data/cabinet_capture.json "$RUNNER_TEMP/incoming.json" "$RUNNER_TEMP/merged.json"
          node --import tsx src/scripts/ozon/validate-cabinet-capture.ts "$RUNNER_TEMP/merged.json"
      - name: Build and verify the existing dashboard with staged data
        run: |
          set -euo pipefail
          cp -a data "$RUNNER_TEMP/stage-data"
          cp "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/stage-data/cabinet_capture.json"
          mkdir "$RUNNER_TEMP/preview"
          export DATA_DIR="$RUNNER_TEMP/stage-data" OUT_DIR="$RUNNER_TEMP/preview"
          for script in build-katya build-tests build-reakciya build-boost smoke; do
            node --import tsx "src/scripts/$script.ts"
          done
          node --import tsx tools/cabinet/verify_dashboard.ts "$DATA_DIR" "$OUT_DIR"
          node --import tsx tools/cabinet/verify_supplements.ts "$DATA_DIR" "$OUT_DIR"
          node --import tsx tools/cabinet/verify_cpo.ts "$DATA_DIR" "$OUT_DIR" data/cabinet_capture.json
      - name: Publish only the validated capture against the checked main commit
        run: python3 -B tools/cabinet/publish_capture.py "$CHECKED_HEAD" "$RUNNER_TEMP/merged.json" data/cabinet_capture.json
      - name: Refresh Pages after the validated data commit
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Continue the API chain unless it is already collecting
        run: |
          set -euo pipefail
          # Both share ozon-data: dispatching while snapshots is queued could evict it.
          active=0
          for workflow in orders-backfill.yml ozon-snapshots.yml; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&per_page=30" --jq '[.workflow_runs[]|select(.status != "completed")]|length')
            active=$((active + count))
          done
          if [ "$active" = 0 ]; then
            gh workflow run orders-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
