name: B24 calls probe (разбор сделки 91033 v2, read-only)

# Что за сущность звонок в сделке 91033: перечисляем активности OWNER=сделка (тип/провайдер/
# направление), для звонков VOXIMPLANT берём полную структуру (bindings) и запись через
# voximplant по CRM_ACTIVITY_ID. Только чтение.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-calls-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Разбор сделки 91033
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета B24_WEBHOOK_URL"; exit 1; fi
          cat > /tmp/one.mjs <<'MJS'
          const base = (process.env.B24_WEBHOOK_URL || '').replace(/\/+$/,'');
          const call = async (m,p={}) => {
            const r = await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
            let j={}; try{j=await r.json();}catch(e){j={error:'parse'};}
            return j;
          };
          const S=(o,n=900)=>{const t=(o===undefined||o===null)?'—':JSON.stringify(o);return t.length>n?t.slice(0,n)+'…':t;};
          const TYPE={1:'Встреча',2:'Звонок',3:'Задача',4:'Письмо',6:'Дело'};
          const DEAL=91033;
          (async()=>{
            const acts=(await call('crm.activity.list',{ filter:{OWNER_TYPE_ID:2, OWNER_ID:DEAL}, order:{ID:'DESC'},
              select:['ID','TYPE_ID','PROVIDER_ID','PROVIDER_TYPE_ID','DIRECTION','SUBJECT','COMPLETED','ASSOCIATED_ENTITY_ID'] })).result||[];
            console.log(`Активностей OWNER=сделка ${DEAL}: ${acts.length}`);
            for(const a of acts){
              console.log(`  #${a.ID} | ${TYPE[a.TYPE_ID]||('type'+a.TYPE_ID)} / ${a.PROVIDER_ID||'-'} | dir=${a.DIRECTION}(1вх/2исх) | assoc=${a.ASSOCIATED_ENTITY_ID||'-'} | «${(a.SUBJECT||'').slice(0,45)}»`);
            }
            const calls=acts.filter(a=>String(a.TYPE_ID)==='2'||String(a.PROVIDER_ID||'').includes('CALL'));
            console.log(`\nЗвонков среди них: ${calls.length}`);
            for(const c of calls.slice(0,4)){
              const full=(await call('crm.activity.get',{id:c.ID})).result||{};
              console.log(`\n== Звонок #${c.ID} - полная карточка ==`);
              console.log('  OWNER:', full.OWNER_TYPE_ID, '/', full.OWNER_ID, '| PROVIDER:', full.PROVIDER_ID, '| DIRECTION:', full.DIRECTION);
              console.log('  BINDINGS (к чему привязан):', S(full.BINDINGS,500));
              console.log('  FILES:', S(full.FILES,300));
              const v=(await call('voximplant.statistic.get',{ filter:{CRM_ACTIVITY_ID:c.ID} })).result||[];
              if(v[0]) console.log(`  voximplant: CALL_TYPE=${v[0].CALL_TYPE}(1исх/2вх) | ЗАПИСЬ=${v[0].CALL_RECORD_URL||('file_id:'+v[0].RECORD_FILE_ID)} | CRM_ENTITY=${v[0].CRM_ENTITY_TYPE}/${v[0].CRM_ENTITY_ID} | длит=${v[0].CALL_DURATION}с`);
              else console.log('  voximplant по этому activity: нет записи в статистике');
            }
          })().catch(e=>console.log('FATAL', e && e.message));
          MJS
          node /tmp/one.mjs
