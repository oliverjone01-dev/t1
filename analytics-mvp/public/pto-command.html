<title>ПТО · Запуски расчётов</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surf:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s0:#f0efec; --s1:#cde2fb; --s2:#9ec5f4; --s3:#5598e7; --s4:#2a78d6; --s5:#184f95;
  --bar:#2a78d6;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 72px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.005em}
.sub{color:var(--ink-3);font-size:12px;margin:0 0 22px}
.card{background:var(--surf);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.muted{color:var(--ink-3)}
.sec{color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink-3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* --- вердикт --- */
.verdict{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--ring)}
.vtext{flex:1 1 380px;min-width:280px}
/* --- календарь --- */
.mrow{display:flex;gap:16px;flex-wrap:wrap}
.mon{margin:0 0 14px}
.mon h3{font-size:12.5px;margin:0 0 6px;color:var(--ink-2);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,30px);gap:3px;margin:0 0 3px}
.dow span{font-size:10px;color:var(--ink-3);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,30px);gap:3px}
.cell{width:30px;height:30px;border-radius:4px;background:var(--s0);
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);position:relative;cursor:default}
.cell.void{background:transparent}
.cell.we{opacity:.42}
.cell.future{background:transparent;border:1px dashed var(--grid);color:var(--ink-3)}
.cell.tail{outline:2px solid var(--ink-3);outline-offset:-2px}
.cell.hi{color:#fff}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.lgsteps{display:flex;align-items:center;gap:3px}
.lgsteps i{width:16px;height:16px;border-radius:3px;display:block}
/* --- столбики --- */
.bars{display:flex;align-items:flex-end;gap:26px;height:150px;padding:18px 4px 0;border-bottom:1px solid var(--axis)}
.bcol{flex:0 0 96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bval{font-size:13px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.bfill{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:3px}
.blab{font-size:11.5px;color:var(--ink-3);margin-top:7px;text-align:center}
/* --- фильтры и таблица --- */
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
select,input{font:13px system-ui,sans-serif;color:var(--ink);background:var(--surf);
  border:1px solid var(--ring);border-radius:7px;padding:5px 9px}
input{min-width:190px}
.scroll{max-height:560px;overflow:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--ring);color:var(--ink-2)}
.pill.won{color:var(--good);border-color:var(--good)}
.pill.lost{color:var(--crit);border-color:var(--crit)}
.tt{position:fixed;z-index:9;pointer-events:none;background:var(--surf);color:var(--ink);
  border:1px solid var(--ring);border-radius:8px;padding:7px 10px;font-size:12px;
  box-shadow:0 6px 22px rgba(0,0,0,.14);display:none;max-width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
a{color:inherit}
.tgl{position:absolute;right:16px;top:20px;font-size:12px;color:var(--ink-3);cursor:pointer;
  background:none;border:1px solid var(--ring);border-radius:7px;padding:4px 9px}
</style></head>

  color:var(--ink);border:1px solid transparent}
.scell.hi .v{color:#fff}
.scell .l{display:block;font-size:10.5px;color:var(--ink-3);margin-top:5px;white-space:nowrap}
.scell.sel .v{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cell{cursor:pointer}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cellsum{font-size:12px;color:var(--ink-3);margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--ring);background:var(--surf);cursor:pointer;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}

t":"2026-07-16","last":"2026-07-16","n":24},{"c":"C49:UC_847A56","first":"2026-07-17","last":"2026-07-18","n":18},{"c":"C49:UC_4UCM2A","first":"2026-09-09","last":"2026-09-09","n":7},{"c":"C49:UC_1GGAGV","first":"2026-05-14","last":"2026-05-14","n":1}]};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONR=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const monTitle=m=>MON[+m.slice(5,7)-1]+' '+m.slice(0,4);
const monDay=(m,d)=>d+' '+MONR[+m.slice(5,7)-1];
const dru=s=>s.split('-').reverse().join('.');
const plural=(n,a,b,c)=>{const x=n%10,y=n%100;return x===1&&y!==11?a:x>=2&&x<=4&&(y<12||y>14)?b:c;};
const fmt=n=>Number.isInteger(n)?n.toLocaleString('ru-RU'):n.toFixed(1);

/* ---------- состояние ---------- */
const S = { unit:'deals', gran:'day', sel:null };
const unitOf = k => D.units.find(u=>u.key===k);
const UNAME = {deals:['сделка','сделки','сделок'], items:['изделие','изделия','изделий'], qty:['штука','штуки','штук']};

/* ---------- даты ---------- */
const dt = s => new Date(s+'T00:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const monday = s => { const d=dt(s); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return iso(d); };
const keyOf = (day,gran) => gran==='day'?day : gran==='week'?monday(day) : day.slice(0,7);
const labelOf = (k,gran) => {
  if(gran==='month') return monTitle(k);
  if(gran==='week'){ const e=dt(k); e.setUTCDate(e.getUTCDate()+6); return dru(k).slice(0,5)+'-'+dru(iso(e)).slice(0,5); }
  return dru(k);
};

/* ---------- агрегация ---------- */
function buckets(){
  const src = unitOf(S.unit).series, out = {};
  for(const day in src){ const k=keyOf(day,S.gran); out[k]=(out[k]||0)+src[day]; }
  return out;
}
function inSel(day){
  if(!S.sel) return true;
  return keyOf(day,S.sel.gran)===S.sel.k;
}

/* ---------- панель ---------- */
function bar(){
  const u = D.units.map(u=>`<button data-unit="${u.key}" aria-pressed="${S.unit===u.key}"${u.available?'':' disabled title="нужна выгрузка смарта «Расчёт»"'}>${esc(u.label)}</button>`).join('');
  const g = [['day','по дням'],['week','по неделям'],['month','по месяцам']]
    .map(([k,l])=>`<button data-gran="${k}" aria-pressed="${S.gran===k}">${l}</button>`).join('');
  return `<div class="bar">
    <span><span class="seglab">считать</span><span class="seg">${u}</span></span>
    <span><span class="seglab">группировать</span><span class="seg">${g}</span></span>
  </div>`;
}

/* ---------- календарь ---------- */
function calendar(){
  const un = unitOf(S.unit);
  if(!un.available) return `<section class="card">${bar()}
    <p class="sec" style="margin:0">Единица «${esc(un.label)}» пока недоступна: нужен снимок смарт-процесса «Расчёт».
    Он приезжает воркфлоу <code>pto-cron.yml</code>. Переключись на «по сделкам» или дождись выгрузки.</p></section>`;
  const b = buckets();
  const vals = Object.values(b);
  const max = Math.max(1, ...vals);
  const steps=[]; for(let i=1;i<=5;i++) steps.push(max*i/5);
  const st = v => { if(!v) return 0; for(let i=0;i<5;i++) if(v<=steps[i]) return i+1; return 5; };
  const total = vals.reduce((a,x)=>a+x,0);

  let body;
  if(S.gran==='day'){
    const months=[...new Set(Object.keys(un.series).map(d=>d.slice(0,7)))].sort();
    body = '<div class="mrow">'+months.map(m=>{
      const n=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate();
      const lead=(dt(m+'-01').getUTCDay()+6)%7;
      let cells='<div class="cell void"></div>'.repeat(lead);
      let sum=0;
      for(let i=0;i<n;i++){
        const day=`${m}-${String(i+1).padStart(2,'0')}`;
        const v=b[day]||0; sum+=v;
        const s=st(v), w=dt(day).getUTCDay(), we=(w===0||w===6)||D.holidays.includes(day);
        const future=day>D.today;
        const cls=['cell',we?'we':'',s>=3?'hi':'',future?'future':'',S.sel&&S.sel.k===day?'sel':''].filter(Boolean).join(' ');
        cells+=`<div class="${cls}" style="${future||!s?'':`background:var(--s${s});`}" data-k="${day}"
          data-tip="${esc(monDay(m,i+1))} · ${fmt(v)}">${future?'':(v?fmt(v):'')}</div>`;
      }
      return `<div class="mon"><h3>${monTitle(m)} <span class="muted" style="font-weight:400">· ${fmt(sum)}</span></h3>
        <div class="dow"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
        <div class="grid">${cells}</div></div>`;
    }).join('')+'</div>';
  } else {
    const keys=Object.keys(b).sort();
    body='<div class="strip">'+keys.map(k=>{
      const v=b[k], s=st(v);
      return `<button class="scell ${s>=3?'hi':''} ${S.sel&&S.sel.k===k?'sel':''}" data-k="${k}"
        data-tip="${esc(labelOf(k,S.gran))} · ${fmt(v)}">
        <span class="v"${s?` style="background:var(--s${s})"`:''}>${fmt(v)}</span>
        <span class="l">${esc(labelOf(k,S.gran))}</span></button>`;
    }).join('')+'</div>';
  }

  const nm=UNAME[S.unit];
  return `<section class="card">${bar()}
    <h2>Календарь запусков</h2>
    <p class="muted" style="margin:0 0 12px;font-size:12px">${esc(un.hint)}. Клик по ячейке показывает, что внутри.</p>
    ${body}
    <div class="legend">
      <span>меньше</span><span class="lgsteps">${[0,1,2,3,4,5].map(i=>`<i style="background:var(--s${i})"></i>`).join('')}</span>
      <span>больше (до ${fmt(max)} в ячейке)</span>
      ${S.gran==='day'?'<span>приглушённые ячейки - выходные и нерабочие дни</span>':''}
    </div>
    <div class="cellsum">Всего за период: <b>${fmt(total)}</b> ${plural(Math.round(total),nm[0],nm[1],nm[2])}</div>
  </section>`;
}

/* ---------- таблица по клику ---------- */
function table(){
  if(!S.sel) return `<section class="card"><h2>Все запуски, по датам</h2>
    <p class="sec" style="margin:0">Кликни ячейку календаря, чтобы увидеть, что в ней.</p></section>`;
  const nm=UNAME[S.unit];
  const head = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px">
    <h2 style="margin:0">Все запуски · ${esc(labelOf(S.sel.k,S.sel.gran))}</h2>
    <button class="chip" data-clear>× сбросить выбор</button></div>`;

  if(S.unit==='deals'){
    const f=D.runs.filter(r=>inSel(r.d)).sort((a,b)=>a.d<b.d?1:-1);
    return `<section class="card">${head}
      <div class="muted" style="margin:0 0 10px;font-size:12px">${f.length} ${plural(f.length,nm[0],nm[1],nm[2])}</div>
      <div class="scroll"><table><thead><tr>
        <th>Дата</th><th>Сделка</th>${D.public?'':'<th>Название</th><th>Менеджер</th>'}
        <th>Пришла из</th><th>Ушла в</th><th class="n">Дней</th><th>Сейчас</th>
      </tr></thead><tbody>${f.map(r=>`<tr>
        <td style="white-space:nowrap">${dru(r.d)}</td>
        <td style="font-variant-numeric:tabular-nums">${esc(r.id)}</td>
        ${D.public?'':`<td>${esc(String(r.title||'').slice(0,46))}</td><td>${esc(r.mgr||'')}</td>`}
        <td class="sec">${esc(r.from)||'<span class="muted">-</span>'}</td>
        <td class="sec">${esc(r.to)||'<span class="muted">стоит здесь</span>'}</td>
        <td class="n">${r.days==null?'<span class="muted">-</span>':r.days}</td>
        <td><span class="pill ${r.out}">${esc(r.cur)}</span></td></tr>`).join('')}</tbody></table></div>
      ${D.public?'<p class="note">Номер сделки без названия и суммы: имя заказчика и деньги в публичную версию не выгружаются.</p>':''}
    </section>`;
  }
  const f=D.smartRows.filter(r=>inSel(r.d)).sort((a,b)=>a.d<b.d?1:-1);
  const sumQty=f.reduce((s,r)=>s+(r.qty||0),0);
  return `<section class="card">${head}
    <div class="muted" style="margin:0 0 10px;font-size:12px">${f.length} ${plural(f.length,'изделие','изделия','изделий')} · ${fmt(sumQty)} ${plural(Math.round(sumQty),'штука','штуки','штук')}</div>
    <div class="scroll"><table><thead><tr>
      <th>Дата</th><th>Карточка</th>${D.public?'':'<th>Название</th><th>Конструктор</th>'}
      <th>Сделка</th><th>Вид расчёта</th><th class="n">Штук</th><th>Стадия</th>
    </tr></thead><tbody>${f.map(r=>`<tr>
      <td style="white-space:nowrap">${dru(r.d)}</td>
      <td style="font-variant-numeric:tabular-nums">${esc(r.id)}</td>
      ${D.public?'':`<td>${esc(String(r.title||'').slice(0,46))}</td><td>${esc(r.constructor||'')}</td>`}
      <td style="font-variant-numeric:tabular-nums">${r.dealId?esc(r.dealId):'<span class="muted">-</span>'}</td>
      <td class="sec">${esc(r.kind||'')||'<span class="muted">-</span>'}</td>
      <td class="n">${r.qty==null?'<span class="muted">-</span>':fmt(r.qty)}</td>
      <td><span class="pill">${esc(r.stage||'')}</span></td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

/* ---------- сноска ---------- */
function foot(){
  const s=D.smart;
  return `<p class="note" style="margin:6px 2px 0">
    Сделки считаются по воронке C49, дубли одной сделки за день схлопнуты (${D.totals.rows} строк истории → ${D.totals.events} событий).
    ${s?`Изделия и штуки из смарта «Расчёт»: ${s.items} карточек, штуки из товарных строк у ${s.fromProductRows}, из поля «Кол-во товара» у ${s.fromText}, без количества ${s.noQty}.`
       :'Изделия и штуки станут доступны после первой выгрузки смарта «Расчёт».'}
    Март 2026 исключён как месяц переезда из amoCRM. Считаются переходы в CRM: расчёт, сделанный без движения стадии, сюда не попадает.
    ${D.public?'Публичная версия: без названий, сумм и фамилий.':''}</p>`;
}

/* ---------- рендер ---------- */
function render(){
  $('#app').innerHTML = calendar() + table() + foot();
  $('#app').querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ S.unit=b.dataset.unit; S.sel=null; render(); });
  $('#app').querySelectorAll('[data-gran]').forEach(b=>b.onclick=()=>{ S.gran=b.dataset.gran; S.sel=null; render(); });
  $('#app').querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    S.sel = (S.sel && S.sel.k===k) ? null : {k, gran:S.gran};
    render();
    if(S.sel) document.querySelectorAll('.card')[1]?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  const c=$('#app').querySelector('[data-clear]'); if(c) c.onclick=()=>{ S.sel=null; render(); };
}

$('#stamp').textContent =
  `Снимок Bitrix24 ${String(D.snapshot).slice(0,10)}`
  + (D.smartSnapshot?` · смарт «Расчёт» ${String(D.smartSnapshot).slice(0,10)}`:' · смарт «Расчёт» ещё не выгружен')
  + ` · запуски с ${dru(D.from)}`
  + (D.public?' · публичная версия':'')
  + ` · собрано ${String(D.bakedAt).slice(0,16).replace('T',' ')}`;

$('#tgl').onclick = () => {
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
};

render();

const tt=$('#tt');
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(!el)return;
  tt.textContent=el.dataset.tip; tt.style.display='block';
  const r=el.getBoundingClientRect();
  tt.style.left=Math.min(innerWidth-270,r.left)+'px';
  tt.style.top=Math.max(6,r.top-tt.offsetHeight-8)+'px'; });
document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) tt.style.display='none'; });
</script></body></html>
