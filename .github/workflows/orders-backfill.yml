name: orders backfill (аналитика по заказам)

# Сбор данных по ЗАКАЗУ (posting) с кредами OZON из секретов.
# Пишет data/orders_daily.ndjson в ветку, на которой запущен (ref).
#
# Раньше запускался только руками, и начисления застревали: order_accruals стоял на августе,
# pnl_sku_accrual - на 17.09. С 25.09.2026 идёт каждый день (Иван: вкладка «Деньги» должна
# показывать последние данные кабинета), а не 5-го числа: при месячном сборе заказы и начисления
# текущего месяца стояли до 5-го следующего. Сбор полный, от 06.02 до вчера, поэтому доначисления
# прошлых дней подтягиваются сами. Час раньше ночного ozon-snapshots.yml: тот пересобирает
# страницы и забирает свежие заказы; группа ozon-data не даёт им идти одновременно.
on:
  schedule:
    - cron: "0 5 * * *" # каждый день ~08:00 МСК, до ночного синка OZON (06:00 UTC)
  workflow_dispatch:
    inputs:
      from:
        description: "FROM YYYY-MM-DD (дата заказа)"
        required: false
        default: "2026-02-06"
      to:
        description: "TO YYYY-MM-DD (пусто = вчера)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ozon-data
  cancel-in-progress: false

env:
  OZON_SELLER_CLIENT_ID: ${{ secrets.OZON_SELLER_CLIENT_ID }}
  OZON_SELLER_API_KEY: ${{ secrets.OZON_SELLER_API_KEY }}

jobs:
  orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Сбор по заказам
        run: npx tsx src/scripts/ozon/orders-daily.ts "${{ github.event.inputs.from }}" "${{ github.event.inputs.to }}"
      - name: Миграция финансов по SKU на accrual (параллельный файл)
        run: npx tsx src/scripts/ozon/pnl-sku-accrual-daily.ts 2026-02-06 "${{ github.event.inputs.to }}"
      - name: Эквайринг/хранение по SKU из accrual/by-day
        run: npx tsx src/scripts/ozon/acq-sku-daily.ts "${{ github.event.inputs.from }}" "${{ github.event.inputs.to }}"
      - name: Канальный P&L и Общие расходы из accrual (замена мёртвых транзакций)
        run: npx tsx src/scripts/ozon/pnl-accrual-daily.ts 2026-02-06 "${{ github.event.inputs.to }}"
      - name: Отчёт о реализации по SKU (штуки и база налога F+G-J-K)
        # Иван 25.09.2026: база налога OZON - «Реализовано» отчёта о реализации (F + G за вычетом
        # возвратов). Хвост из двух месяцев перетягивается каждый раз, месяцы без базы - один раз.
        run: npm run pnl:realization
      - name: "Разведка: отчёт о реализации за день (структура и суммы, без строк)"
        # Иван 25.09.2026, п. 1.4: можно ли брать «Реализовано» за незакрытый месяц из документа.
        # Печатает только пути ключей и суммы за день; не пишет файлов и не валит сбор.
        run: npx tsx src/scripts/ozon/realization-day-probe.ts 2026-09-24 2026-08-28 || true
      - name: Калибровка соинвеста по эталону начислений
        # Сети не требует, поэтому не падает вместе с OZON. Вердикт виден прямо в логе шага:
        # он говорит, какая из двух цен снимка разошлась с фактом и на сколько пунктов.
        run: npm run coinv:calib || echo "::warning::калибровка соинвеста не пересчиталась"
      - name: Коммит данных в ветку
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-mvp/data/orders_daily.ndjson analytics-mvp/data/orders_accrual_types.json analytics-mvp/data/pnl_sku_accrual_daily.ndjson analytics-mvp/data/acq_sku_daily.ndjson analytics-mvp/data/buyer_delivery_daily.ndjson analytics-mvp/data/buyer_delivery_orders.ndjson analytics-mvp/data/partner_daily.ndjson analytics-mvp/data/partner_orders.ndjson analytics-mvp/data/pnl_channel_accrual_daily.ndjson analytics-mvp/data/pnl_account_accrual_daily.ndjson analytics-mvp/data/coinv_calibration.json analytics-mvp/data/realization_monthly.ndjson analytics-mvp/data/pnl_account_accrual_types.json
          if git diff --cached --quiet; then
            echo "нет изменений в orders_daily.ndjson"
          else
            git commit -m "data(orders): начисления и калибровка соинвеста ${{ github.event_name == 'schedule' && '(ежедневный сбор)' || format('{0}..{1}', github.event.inputs.from, github.event.inputs.to) }} [skip ci]"
            for i in 1 2 3 4; do git push origin "HEAD:${{ github.ref_name }}" && break || sleep $((2**i)); done
          fi
