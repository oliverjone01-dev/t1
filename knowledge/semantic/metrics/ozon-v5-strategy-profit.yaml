# Спека метрики: прибыль магазина OZON за 2 недели, вариант 1 против варианта 2 (цепочка «Тесты ОЗОН», v5)
id: ozon-v5-strategy-profit
title: "Прогноз прибыли магазина OZON за 2 недели: В1 (своя цена + клик) против В2 (ставка за заказ 9%)"
version: 1
status: draft              # формула и охват подтверждены Иваном 13.10 («1а 2а 3а», «4 по всему магазину», «5а» -> «дрр не больше 15%»); эталон - на подпись
owner: "Иван Раюшкин"
approved_at: ""
decision: "какой вариант запускать: В1 (ставка 5%, снижение предельной у 26 артикулов, клик выборочно) или В2 (ставка 9% на весь магазин, клик минимум)"
good_direction: up
entity: заказ без отмены (единица товара)
key: [sku, дата заказа]
type: derived
formula_text: >
  Прибыль = сумма по товарам [заказы без отмен x (К выплате - ставка за заказ - себестоимость - наша доставка - налог)] - расход за клик.
  К выплате = доля выплаты OZON товара по доставленным с 01.09 (у товара без доставок с 01.09 - его доля с 01.06 x сдвиг магазина) x предельная.
  Ставка за заказ = номинал (5% или 9%) x доля списания 0,82 (расход кампании «Оплата за заказ» / 5% оборота заказов без отмен, 14.09-11.10) x предельная.
  Налог = 15% от оплаты покупателя = 0,15 x предельная x доля витрины x 0,914 (P20). АДМ не вычитается (одинаков в вариантах, ответ «2а»);
  строка «как в Отчете» с АДМ 30% от К выплате - справочно.
  Клик: кампании, шедшие 10-11.10, урезаются до 2 000 ₽/нед (цена клика 8-12 ₽), кроме выбранных в В1 (4+ заказа по отчёту рекламы за 4 недели).
  Потеря заказов при урезании = заказы кампании по отчёту рекламы x (1 - (новый/старый бюджет)^0,81) x доля своих k.
  Своя цена: витрина падает 1:1 (passthrough.py), заказы x (новая/старая)^ε, доля прироста, перетянутая у соседей, теряет их прибыль.
  Ставка 9%: витрина x (1 + d9), заказы x (1 + d9)^ε.
  Сценарии: ε -1 / -2 / -3,6 (верх - elastic.py, середина и низ - допущения), k 0 / 0,5 / 1 (тест 3), d9 0 / -2 / -4% (cpo_discount.py), переток 50 / 25 / 0%.
code_module: knowledge/episodes/2026-10/ozon-testy-scripts/v5/forecast.py
filters:
  include_statuses: [все, кроме cancelled]
  exclude: ["товары без себестоимости или цены (2 из 272 заказов окна)", "кампании, не шедшие 10-11.10, в В1 и В2 выключены"]
cancellations_returns:
  mode: "net по отменам (orders_daily status != cancelled), возвраты не вычитаются - одинаково во всех вариантах"
  return_date_basis: order_date
date_field: created              # дата заказа
mode: period
conversion_window_days: null
timezone: Europe/Moscow
interval: "[2026-09-14, 2026-10-12) база; прогноз 2 недели = 2 x средняя неделя базы"
partial_period: hide
additive_over_time: true
accounting_basis: shipment
empty_value: "null (товар без заказов в окне - 0 заказов в базе, его прибыль не прогнозируется)"
source:
  endpoint: "analytics-mvp/data: orders_daily, ads_daily, prices_daily, gap_daily, sku_cogs; параметры товара - проба ФЕНИКСА P20 (исправленная модель пола цены)"
  fields: [units, status, sku, d, sp, o, price, site_to_seller]
  limits: "реклама по 11.10, заказы по 12.10"
  latency: "1 день (автозапуск ozon-snapshots ~14:30-16:30 МСК)"
  lookback_days: 28
reconciliation:
  against_family: documents
  document: "отчёт о реализации сентябрь: комиссия 49,7% (ФЕНИКС 13.10) против 1 - доля К выплате 51,7% по API (разница - логистика и прочие сборы в К выплате)"
  tolerance: "2 п. объяснены составом; абсолютная прибыль с «Отчетом» не сверена - выводы только по разнице вариантов"
inference_rules:
  min_n: null
  mde: null
  causal_claims: "эластичность -3,6 - наблюдение по панели (товар x неделя, эффекты товара и недели), не эксперимент: верхняя граница; измерение - тест 4, замер 21.10"
golden_rows:
  - input: "KONUX GGT-35-5-1-100-180, предельная 121 898, доля К выплате 0,4773, с/с 16 933, доставка -1 429, витрина 0,4583, ставка 5%"
    expected: "прибыль заказа 58 182 - 4 980 - 16 933 + 1 429 - 7 660 = 30 039 ₽ (скрипт 30 039)"
    confirmed_by: ""
