name: Update OZON snapshots

# Дёргает n8n-вебхуки (ключи OZON живут в n8n, в Actions не нужны), обновляет
# фикстуры и дневную историю, пересобирает сайт и коммитит. Раз в день.

on:
  schedule:
    - cron: "30 5 * * *" # ~08:30 МСК, после дневного синка
  workflow_dispatch: {}

concurrency:
  group: ozon-snapshots
  cancel-in-progress: false

permissions:
  contents: write

env:
  N8N: https://gen-group.app.n8n.cloud/webhook

jobs:
  snapshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci

      - name: Daily history (yesterday) -> ingest
        run: |
          Y=$(date -u -d "yesterday" +%F)
          curl -sf -X POST "$N8N/gengroup-ozon-daily" -H "Content-Type: application/json" \
            -d "{\"dateFrom\":\"$Y\",\"dateTo\":\"$Y\"}" -o /tmp/daily.json
          npm run ingest -- /tmp/daily.json || echo "ingest: нет новых продаж за $Y"

      - name: Snapshots (skus, ads, pnl за 30 дней)
        run: |
          FROM=$(date -u -d "29 days ago" +%F); TO=$(date -u -d "yesterday" +%F)
          curl -sf -X POST "$N8N/gengroup-ozon-skus" -H "Content-Type: application/json" \
            -d '{"days":30}' -o fixtures/skus_live_30d.json
          curl -sf -X POST "$N8N/gengroup-ozon-ads" -H "Content-Type: application/json" \
            -d '{"days":30}' -o fixtures/ads_30d.json
          curl -sf -X POST "$N8N/gengroup-ozon-pnl" -H "Content-Type: application/json" \
            -d "{\"dateFrom\":\"$FROM\",\"dateTo\":\"$TO\"}" -o /tmp/pnl_raw.json
          npx tsx src/scripts/snapshot-pnl.ts /tmp/pnl_raw.json

      - name: Rejoin cogs and rebuild site
        run: |
          npm run join:cogs
          npm run build:site

      - name: Commit
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-mvp/data/history.ndjson analytics-mvp/fixtures/skus_live_30d.json \
                  analytics-mvp/fixtures/ads_30d.json analytics-mvp/fixtures/pnl_30d.json \
                  analytics-mvp/data/sku_cogs.json analytics-mvp/public/*.html
          if git diff --staged --quiet; then
            echo "Снимки без изменений"
          else
            git commit -m "data: ежедневное обновление снимков OZON $(date -u +%F)"
            git push
          fi
