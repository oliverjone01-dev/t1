weekly_reconciliation: Арифметические и независимые runtime пробы; определения источников прежние. Новая банковская сверка и подтверждённая прибыль не заявляются.

visibility_request_20261105: Пользователь просит скрыть будущие периоды и пустые блоки, показывая их по мере наступления дат и получения данных.
period_visibility: Недели в переключателях, плановых таблицах, заказах, рекламе и этапах скрыты до начала по Europe/Moscow. Полный план остаётся в данных, цели месяца не меняются. При открытии страницы дата проверяется в браузере независимо от даты сборки; факты не генерируются.
empty_visibility: Спидометры и графики без факта скрыты. Реальные нули показываются. Для пропусков уже закрытых дней сохраняется отдельное предупреждение; частичный охват не становится полным.
chart_visibility: Графики заказов, оборота, CPC и прибыли ограничены уже закрытыми днями; цена до текущей даты. Неполный кабинетный срез воронки по-прежнему отдельная точка.
decision_copy: Понятные формулировки вместо первой/второй волны в решениях по карточкам; смысл рекомендаций и отсутствие автоматического запуска изменений сохранены.

unit_plan_revision_2026_11_05: Планы товаров показываются целыми. Накопленный план округляется до ближайшей штуки, недельный равен разнице округлённых накопленных планов на границах; сумма недель равна цели месяца. Статусы и линии графика используют целый план. Денежные значения и показатели конверсии не меняются.
gauge_period_revision_2026_11_05:
  request: Пользователь вернул недельные показатели у спидометров и добавил полный месяц.
  controls: Все пять недель доступны постоянно плюс Весь ноябрь. Исключение из прежнего скрытия касается только переключателя спидометров; прочие будущие колонки остаются скрыты.
  month: Заказы, оборот и реклама за закрытые дни ноября; цель месяца прежняя. 100% равно накопленному плану закрытых дней, не полному месяцу в начале месяца.
  profit: Прямой вызов того же финансового расчёта from01Nov..closedDay для месяца; недельные прибыли не складываются. Пропуски дают null и предупреждение.
  future: Можно выбрать будущую неделю и увидеть её план в подписи. Спидометры без факта остаются скрыты, нули не выдумываются.
