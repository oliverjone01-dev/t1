# Вкладка «Отчет» OZON: ежемесячный отчёт руководителю (месяц к прошлому месяцу).
id: ozon-monthly-report
title: "Отчет OZON: оборот, причины отклонений, затраты площадки, реклама, непродаваемые товары"
version: 1
status: approved
owner: "Иван Раюшкин"
approved_at: "2026-10-01"   # ответы в чате 01.10: «1в 2а 3а 4 нужны отклонения по каждому доходу или расходу за счет чего произошло 5а 6а»
decision: >
  Руководитель раз в месяц видит, вырос или упал оборот (всего, зеркала, мебель), за счёт чего, сколько
  забрала площадка по статьям, окупается ли реклама и какие товары снимать, перезаливать или выкупать.
good_direction: "оборот и К выплате вверх, доля сборов вниз, окупаемость рекламы вверх"
entity: "месяц x статья (и артикул для вклада в отклонение)"
key: [month, line]
type: derived
formula_text: >
  Оборот = «Начислено» ИТОГО таблицы «Аналитика по артикулам (за выбранный период)» на «Деньгах» за те же даты
  (функция skuAnalyticsData, одна для обеих вкладок). Зеркала = категория «Зеркала» таксономии, мебель = всё
  остальное, включая «Прочее» (3а). Причины: оборот = штуки x цена, Δ = (u1-u0)·p0 + (p1-p0)·u1, p = начислено/шт;
  статья s = объём + ставка, Δs = (A1-A0)·r0 + (r1-r0)·A1, r = s/Начислено; плюс топ артикулов по Δ статьи и
  кабинетная часть (строка «Общие расходы»). Затраты площадки = «Всего сборов» = Начислено - К выплате.
  Реклама: расход и выручка заказов за клик - ads_daily (Performance API), расход «за заказ» - ads_daily,
  выручка заказов «за заказ» - ручная выгрузка кабинета (cpo_orders) по номеру заказа, выручка отправлений
  без отменённых; окупаемость = выручка / расход; ДРР = расход / заказанный оборот (daily_totals, как «Маркетинг»).
  Непродаваемые: показы в отчётном месяце > 0, 0 заказов (кроме отменённых) за 60 дней до конца периода по SKU
  и по артикулу, показы не меньше 60 дней; топ-5 по показам в группе.
code_module: analytics-mvp/src/scripts/report-page.ts
filters:
  include_statuses: []
  exclude:
    - "непродаваемые: новые карточки с первым показом позже начала 60-дневного окна"
    - "ДРР и окупаемость «за заказ» вне дат ручной выгрузки не считаются (нет данных, не 0)"
cancellations_returns:
  mode: "net: Начислено за вычетом возвратов (как таблица по артикулам); выручка рекламных заказов «за заказ» без отменённых отправлений"
  return_date_basis: "дата начисления возврата"
date_field: "дата начисления OZON (дата реализации) для денег; дата статистики рекламного кабинета для рекламы; дата заказа для выручки «за заказ»"
mode: period
conversion_window_days: null
cohort_maturity_rule: ""
timezone: Europe/Moscow
interval: "[1-е число, последний день месяца]; незакрытый месяц [1-е, MAXD] против [1-е, то же число] прошлого месяца (2а)"
partial_period: mark
additive_over_time: true
accounting_basis: "начисления OZON (как «Деньги»)"
empty_value: "null: нет данных («нет данных», «нет базы»), не 0"
source:
  endpoint: "данные страницы «Деньги» (pnl_sku_daily до FIN_CUT, realization_daily + acq_sku_daily + orders_daily.dl после), pnl_account_*_daily, ads_daily, ads_attr_daily, cpo_orders, cpo_sku_daily, sku_views, daily_totals, pnl_account_accrual_types"
  fields: []
  limits: "типы начислений кабинета - только целые месяцы"
  latency: "снимок ozon-snapshots.yml утром"
  lookback_days: 0
reconciliation:
  against_family: "documents"
  document: "отчёт о реализации за закрытый месяц (realization_monthly, основа УПД): «Реализовано (база налога)» отчёта = колонке таблицы по артикулам"
  tolerance: "1 ₽ по ИТОГО"
inference_rules:
  min_n: "процент от базы меньше 1000 ₽ не показывается"
  mde: ""
  causal_claims: forbidden_without_control   # «причины» = разложение цифр, подпись на странице
thresholds:   # [ГИПОТЕЗА] блока 5, предложены 01.10 в варианте 6а
  low_views: "меньше 300 показов за месяц - перезалив"
  low_ctr: "заходы в карточку / показы меньше половины медианы группы - перезалив (фото, заголовок)"
  no_cart: "заходы есть, корзин 0 - выкуп или проверка цены"
  cart_no_order: "корзины есть, заказов нет - выкуп или проверка цены и срока доставки"
  drop: "90+ дней без заказов и хранение OZON > 0 - снятие с площадки"
golden_rows:
  - input: "«Деньги», ИТОГО июль 2026: начислено 22 301 584 ₽, 383 шт; август: 18 905 221 ₽, 299 шт"
    expected: "отчёт за август: -3 396 363 ₽ (-15,2%); за счёт штук (299-383)·58 228,68 = -4 891 209 ₽"
    confirmed_by: "юнит-тест report-page.test.ts; блок «План» на «Деньгах» за июль и август даёт те же 22 301 584 и 18 905 221"
  - input: "сентябрь при данных по 29.09"
    expected: "01.09-29.09 против 01.08-29.08, пометка «месяц неполный»"
    confirmed_by: "юнит-тест report-page.test.ts"
