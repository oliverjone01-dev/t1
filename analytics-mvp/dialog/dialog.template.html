<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Диалоги по сделкам</title>
<style>
:root{--bg:#0E141A;--card:#141C24;--card2:#0F171E;--border:#243039;--border-soft:#1B242C;--ink:#E7EEF4;--ink-2:#B7C4CE;--ink-3:#8A99A6;--ink-4:#5D6B77;--acc:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
.h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--ink-3);font-size:12px;margin-top:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.bar label{color:var(--ink-3);font-size:11px;margin-right:4px}
select,input{background:var(--card2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none}
input#q{min-width:220px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--ink-2);font-size:11.5px;cursor:pointer;user-select:none}
.chip.on{background:#12303a;border-color:#1f6b7d;color:#bfeff8}
.cnt{color:var(--ink-4);font-size:11px}
.deal{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.dhead:hover{background:rgba(34,211,238,.04)}
.arw{color:var(--ink-4);width:12px;flex:0 0 12px;font-size:11px}
.did{font-weight:800;flex:0 0 auto}
.link2{color:var(--ink-4);font-weight:600;font-size:11px}
.dttl{color:var(--ink);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmgr{color:var(--ink-2);flex:0 0 auto;white-space:nowrap;font-size:12px}
.dchips{display:flex;gap:4px;flex:0 0 auto}
.dchips i{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.dchips b{width:8px;height:8px;border-radius:2px;display:inline-block}
.dmeta{color:var(--ink-4);font-size:11px;flex:0 0 auto;white-space:nowrap}
.thread{border-top:1px solid var(--border-soft);padding:4px 0;background:var(--card2)}
.ev{display:grid;grid-template-columns:110px 60px 128px 22px 140px 1fr 190px;gap:9px;padding:7px 14px;border-bottom:1px solid var(--border-soft);align-items:start}
.ev:last-child{border-bottom:none}
.ev .t{color:var(--ink-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stg{font-size:9.5px;padding:1px 5px;border-radius:4px;white-space:nowrap}
.stg-lead{background:#3a2a12;color:#d6a45f}.stg-deal{background:#12303a;color:#7fd7e6}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.dir-in{color:#69C7DA}.dir-out{color:#7FD1A6}.dir-n{color:var(--ink-4)}
.who-cli{color:#E8A33D;font-weight:600}
.who-mgr{color:#22d3ee}
.whosub{display:block;color:var(--ink-4);font-size:10px;font-weight:400}
.who{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.body .st{color:var(--ink-4);font-size:10.5px;margin-left:6px}
.body a.rec{margin-left:8px;font-size:11px}
.ev-bad{background:#C2525209;border-left:2px solid #C2525288}
.ev-good{background:#2E9E7407;border-left:2px solid #2E9E7455}
.evtags{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.evtag{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1.5}
.hlq{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 14px;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line)}
.part{padding:1px 7px;border:1px solid var(--line);border-radius:5px;color:var(--ink-2)}
.part b{color:var(--ink);font-weight:600}
.body .ref{display:block;margin-top:2px;color:#C2569B;font-size:10.5px}
.empty{padding:40px;text-align:center;color:var(--ink-4)}
.foot{color:var(--ink-4);font-size:11px;margin-top:10px}

/* рейтинг менеджеров и скоринг сделок */

.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{background:#0000000d;color:var(--ink-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#ffffff06}
.tbl .who2{font-weight:600;font-size:12.5px}
.cellv{display:inline-flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;min-width:52px;padding:2px 4px;border-radius:5px}
.cellv:hover{background:#ffffff10;outline:1px solid var(--line)}
.cellv b{font-weight:600;font-size:12px}
.pbar{display:block;width:46px;height:3px;border-radius:2px;background:#ffffff18;overflow:hidden}
.pbar i{display:block;height:100%}
.rt{font-weight:700;font-size:15px}
.rtst{color:#E8A33D;font-size:10px;letter-spacing:.5px;display:block}
.na2{color:var(--ink-4);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile.on{border-color:var(--acc);background:#22d3ee0f}
.tile .tl{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.tile .tn{font-size:20px;font-weight:700;line-height:1.2}
.tile .tm{color:var(--ink-4);font-size:10.5px}
.qrow{cursor:pointer}
.qrow:hover td{background:#ffffff08}
.qrow td{vertical-align:middle}
.pri{font-weight:700;font-size:12px;white-space:nowrap}
.kind{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap}
.k-deal{color:#22d3ee;border-color:#22d3ee55;background:#22d3ee12}
.k-lead{color:#C2873C;border-color:#C2873C55;background:#C2873C12}
.urg{font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.qexp>td{padding:0 10px 10px 10px;background:#ffffff05}
.qnext{color:var(--ink-2);font-size:11.5px;margin:6px 0 8px 0;line-height:1.5}
.qnext b{color:var(--ink-3)}
.qm{display:inline-block;margin-left:3px;font-size:9px;color:var(--ink-4);border:1px solid var(--line);border-radius:50%;width:11px;height:11px;line-height:11px;text-align:center;cursor:help;vertical-align:top}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:11.5px}
.lgh{padding:8px 12px;cursor:pointer;color:var(--ink-2)}
.lgh i{font-style:normal;color:var(--ink-4);margin-right:5px}
.lgb{padding:0 12px 10px 12px}
.lgi{color:var(--ink-2);margin-bottom:5px;line-height:1.5}
.lgcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:8px}
.lgc{background:#ffffff05;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink-3)}
.lgc b{color:var(--ink);display:inline}
.lgnote{color:var(--ink-3);font-size:11px}
.lgcols{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lgcol{background:#ffffff05;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);cursor:help;white-space:nowrap}
.lgcol b{color:var(--ink)}.lgcol i{color:var(--ink-4);font-style:normal;font-size:10px}
.lqm{display:inline-block;font-size:9px;color:var(--ink-4);border:1px solid var(--line);border-radius:50%;width:12px;height:12px;line-height:12px;text-align:center;cursor:help;vertical-align:1px;margin:0 3px}
.lgi b{color:var(--ink)}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--acc)}
.sarr{font-size:9px;color:var(--acc)}
.fbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11.5px;color:var(--ink-3)}
.fbar select{background:#0f1720;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px}
.vbadge{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;border:1px solid}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px 34px}
.swcol{}
.swh{font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.swh-g{color:#2E9E74}.swh-b{color:#C25252}
.swi{color:var(--ink-2);font-size:11.5px;line-height:1.6}
.swd{color:var(--ink-4);font-size:10px;margin-left:6px}
.swnone{color:var(--ink-4);font-style:italic}
/* Плавающая подсказка - дизайн РОП-дашборда (rop-command.template.html, #tip) */
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid #2A3742;border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:420px}
#tip .tl{color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
#tip .tip-tot{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin:3px 0 8px;padding-bottom:7px;border-bottom:1px solid #2A3742}
#tip .tip-tot span:first-child{font-size:12.5px;font-weight:700}
#tip .tip-tot span:last-child{font-size:11.5px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
#tip .qh{font-weight:800;font-size:10.5px;margin:8px 0 2px;color:#E8A33D}
#tip .qh:first-child{margin-top:0}
#tip .qh i{font-style:normal;color:var(--ink-3);font-weight:600;margin-left:6px}
#tip .qb{white-space:normal;line-height:1.45;color:var(--ink-2)}
#tip .qn{color:var(--ink-4);font-size:10.5px;margin-top:8px;padding-top:6px;border-top:1px solid #2A3742}
.malert{display:inline-block;margin-left:7px;font-size:10px;font-weight:800;line-height:15px;height:15px;min-width:15px;padding:0 5px;border-radius:8px;text-align:center;cursor:help;vertical-align:1px;border:1px solid}
.aigr{display:inline-block;font-size:11px;font-weight:800;line-height:17px;min-width:30px;padding:0 6px;border-radius:6px;text-align:center;cursor:help;border:1px solid}
.aidot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.aidv{cursor:help;border-bottom:1px dotted var(--ink-4)}
.aibanner{background:#8B7BF014;border:1px solid #8B7BF04d;border-radius:9px;padding:8px 12px;margin-bottom:8px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.aimgr{background:#8B7BF00d;border:1px solid;border-radius:10px;padding:11px 13px;margin-bottom:10px}
.aimgr-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.aimgr-h b{font-size:12.5px}
.aimgr-sub{color:var(--ink-3);font-size:11px}
.aimgr-v{font-size:13px;color:var(--ink);line-height:1.5;margin-bottom:8px}
.aimgr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.aimgr-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.aimgr-i{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.aihead-sub{color:var(--ink-4);font-size:10.5px;margin-left:8px;text-transform:none;letter-spacing:0}
.aibox{background:#8B7BF00d;border:1px solid;border-radius:9px;padding:9px 11px;margin-bottom:9px}
.aihead{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.airow{font-size:12px;color:var(--ink-2);line-height:1.5;margin:3px 0}
.t3 .evtag[data-ai]{border-style:dashed}
.fixids{display:flex;flex-wrap:wrap;gap:5px}
.fixid{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;cursor:pointer;color:var(--ink-2)}
.fixid:hover{border-color:var(--acc);color:var(--acc)}
.t1{margin-bottom:10px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t1{min-width:1260px}
.t1 th,.t2 th,.t3 th{font-size:9px;padding:5px 5px;white-space:nowrap}
/* Только СВОИ строки: таблицы сделок и переписки лежат внутри ячеек таблицы менеджеров,
   и потомковый селектор .t1 td навязывал им nowrap - из-за этого текст сообщения шёл
   одной строкой и наезжал на разметку. */
.t1>tbody>tr>td{white-space:nowrap;padding:7px 5px;font-size:11.5px}
.t1>tbody>tr>td.l{white-space:nowrap;min-width:230px;padding-left:12px;padding-right:18px}
.t1>tbody>tr>th.l{padding-left:12px}
.t1>tbody>tr>td:nth-child(2),.t1>tbody>tr>th:nth-child(2){min-width:118px;padding-right:16px}
.t1>tbody>tr>td .vbadge{white-space:nowrap;font-size:9px;padding:2px 8px}
.mrow2{cursor:pointer}
.mrow2:hover td{background:#ffffff08}
.mrow2.on td{background:#22d3ee0d}
/* Приглушённые границы между уровнями: менеджеры, сделки, коммуникации/диалоги */
.t1>tbody>tr.mrow2>td{border-bottom:1px solid var(--line)}
.t2>tbody>tr.drow>td{border-bottom:1px solid #ffffff0a}
.t3>tbody>tr.erow2>td{border-bottom:1px solid #ffffff08}
.t1>tbody>tr.subrow>td{padding:0 10px 16px 64px;white-space:normal;background:#ffffff05;border-left:6px solid #22d3ee55;position:relative}
.subrow>td::before{content:'СДЕЛКИ ▸';position:absolute;left:22px;top:9px;font-size:9px;font-weight:700;letter-spacing:.08em;color:#22d3eeaa}
.subrow .t2{border-left:2px solid #22d3ee33;padding-left:12px}
.whob{color:var(--ink-3);font-size:11px;margin:2px 0 0 0}
.afterdlg{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.t2{margin-top:6px;font-size:11px}
.t2>tbody>tr>td{padding:6px 6px;white-space:nowrap}
/* Отступы у краёв вложенных таблиц - видно границу */
.t2>tbody>tr>td:first-child,.t2 th:first-child,.t3>tbody>tr>td:first-child,.t3 th:first-child{padding-left:12px}
.t2>tbody>tr>td:last-child,.t2 th:last-child,.t3>tbody>tr>td:last-child,.t3 th:last-child{padding-right:14px}
.t2>tbody>tr>td.l{white-space:normal}
.dtt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;display:block}
.dsig{font-size:9.5px;color:var(--ink-4);margin-top:2px;line-height:1.4}
.dsig .sdiv{color:var(--ink-4);opacity:.45;margin:0 4px}
.leadnote{font-size:11px;padding:6px 12px;margin:0 0 6px;border-radius:7px;line-height:1.4}
.leadnote.lead-from{background:#C2873C14;border:1px solid #C2873C44;color:#d6a866}
.leadnote.lead-from a{color:#e4b877;font-weight:600}
.leadnote.lead-none{background:#8794A514;border:1px solid var(--border);color:var(--ink-3)}
.lstage{display:inline-block;margin-left:6px;font-size:8px;font-weight:700;letter-spacing:.05em;color:#C2873C;border:1px solid #C2873C66;border-radius:4px;padding:0 4px;line-height:13px;vertical-align:middle;text-transform:uppercase}
/* Мини-воронка и коммуникации в таблице менеджеров */
.funnel{display:flex;gap:1px;height:9px;border-radius:3px;overflow:hidden;min-width:140px;max-width:240px}
.funnel .fseg{min-width:4px;cursor:help;transition:filter .1s}
.funnel .fseg:hover{filter:brightness(1.35)}
.fnrow{display:flex;gap:1px;min-width:140px;max-width:240px;margin-top:3px}
.fn{font-size:9.5px;color:var(--ink-3);text-align:center;min-width:4px;font-variant-numeric:tabular-nums;border-left:1px solid var(--border);line-height:1.2}
.fn:first-child{border-left:none}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:6px}
.funnel .fseg.fon{outline:2px solid var(--acc);outline-offset:-2px;filter:brightness(1.15)}
.fnchip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:#22d3ee14;border:1px solid #22d3ee44;border-radius:8px;padding:4px 10px;margin:2px 0 8px 64px;font-size:11.5px;color:#bfeff8}
.fnchip .fpk{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:12px;background:#ffffff12;border:1px solid #ffffff22}
.fnchip .fpk b{color:#fff}
.fnchip b{color:#e7f8fc;margin:0 3px}
.fnchip .x{margin-left:8px;cursor:pointer;color:#8fd3e2;border:1px solid #2a7a8e;border-radius:6px;padding:2px 8px;font-size:10.5px}
.fnchip .x:hover{background:#164050;color:#e7f8fc}
.hotcell{cursor:pointer}
.hotcell:hover{outline:1px solid #C2525288;outline-offset:-1px}
.hoton{outline:2px solid var(--acc);outline-offset:-2px}
.comm{display:flex;flex-wrap:wrap;gap:8px;white-space:normal}
.cwrap{display:inline-grid;grid-template-columns:repeat(3,56px);gap:4px}
.cwrap .cchip{padding:1px 4px;text-align:left;justify-self:stretch}
.cgrid{display:inline-grid;grid-template-columns:repeat(3,auto);column-gap:14px;row-gap:3px}
.cgrid .cgc,.cgrid .cch0{display:inline-flex;align-items:baseline;gap:4px;padding:0;border:0;background:none;border-radius:0}
.cgrid b{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:34px}
.cgrid i{font-style:normal;color:var(--ink-4);font-size:9px;font-weight:400}
.cgrid .cch0{opacity:.4}
.cgrid .cch0 b{color:var(--ink-4)}
.cgrid .cgc{cursor:pointer}
.cgrid .cgc:hover{filter:brightness(1.3)}
.cgrid .cgc.con b{text-decoration:underline}
.cchip{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;padding:1px 5px;border-radius:6px;border:1px solid transparent;transition:.1s}
.cchip:hover{background:#ffffff0d;border-color:var(--border)}
.cchip.con{background:#ffffff14;border-color:currentColor}
.cchip i{font-style:normal;color:var(--ink-4);font-size:9px;font-weight:400;margin-left:2px}
.rolech{display:inline-block;margin-left:7px;font-size:8px;font-weight:700;letter-spacing:.05em;color:#3DAEC2;border:1px solid #3DAEC266;background:#3DAEC214;border-radius:4px;padding:1px 5px;vertical-align:middle;text-transform:uppercase;cursor:help}
.deptrow>td{background:#22d3ee0d;border-top:2px solid #22d3ee44;border-bottom:1px solid #22d3ee33}
.deptrow:hover>td{background:#22d3ee16}
.deptrow>td:first-child b{color:#bfeff8}
.dmgrtag{display:inline-block;margin-right:7px;font-size:9.5px;color:#8fd3e2;background:#22d3ee12;border:1px solid #22d3ee33;border-radius:4px;padding:0 5px;vertical-align:middle}
.t3 tr.lead-stage td.etime{color:#C2873C}
.drow{cursor:pointer}
.drow:hover td{background:#ffffff08}
.drow.on td{background:#22d3ee12}
.t2>tbody>tr.subrow2>td{padding:0 8px 18px 80px;white-space:normal;background:#00000055;border-left:6px solid #C2873C99;position:relative}
.subrow2>td::before{content:'КОММУНИКАЦИЯ ▸';position:absolute;left:34px;top:9px;font-size:9px;font-weight:700;letter-spacing:.08em;color:#C2873Ccc}

function freshStamp(){
  const el=document.getElementById('freshTag'); if(!el) return;
  const src=DATA.generatedAt||BAKED_AT; if(!src){el.textContent='';return;}
  const g=new Date(src), ageH=(new Date()-g)/36e5;
  const m=new Date(g.getTime()+3*36e5); // показываем по Москве (UTC+3)
  const t=p2(m.getUTCDate())+'.'+p2(m.getUTCMonth()+1)+' '+p2(m.getUTCHours())+':'+p2(m.getUTCMinutes());
  let col='#2E9E74', pre='данные на';
  if(ageH>48){col='#F43F5E';pre='данные устарели, на';}else if(ageH>30){col='#F59E0B';}
  const bb=new Date(g.getTime()+3*36e5);
  const bk=' · сборка '+p2(bb.getUTCDate())+'.'+p2(bb.getUTCMonth()+1)+' '+p2(bb.getUTCHours())+':'+p2(bb.getUTCMinutes());
  el.textContent=pre+' '+t+' МСК'+bk; el.style.color=col;
}

function matchEvent(e){
  if(S.dir && e.dir!==S.dir) return false;
  if(S.types.size && !S.types.has(e.type)) return false;
  if(S.q){ const q=S.q; if(!((e.body&&e.body.toLowerCase().indexOf(q)>=0)||(e.who&&e.who.toLowerCase().indexOf(q)>=0)||(e.title&&e.title.toLowerCase().indexOf(q)>=0)||(e.leadT&&e.leadT.toLowerCase().indexOf(q)>=0)||(e.dealT&&e.dealT.toLowerCase().indexOf(q)>=0))) return false; }
  return true;
}
// якорь группировки по режиму: по сделкам -> сделка (лид сливается), по лидам -> лид (сделка сливается)
function anchor(e){
  if(S.mode==='deal') return e.dealId ? {ent:'deal',aid:e.dealId,title:e.dealT,other:e.leadId} : {ent:'lead',aid:e.leadId,title:e.leadT,other:''};
  return e.leadId ? {ent:'lead',aid:e.leadId,title:e.leadT,other:e.dealId} : {ent:'deal',aid:e.dealId,title:e.dealT,other:''};
}
function dealScore(ent,aid,other){ return (SC? (SCD[(ent==='deal'?'D':'L')+aid] || SCD['D'+(other||'')]) : null) || null; }
function passScoreFilter(ent,aid,other){
  if(!S.sec && !S.tag) return true;
  const d = dealScore(ent,aid,other); if(!d) return false;
  if(S.sec) return d.tags.some(t=>t.sec===S.sec && t.tone==='bad');
  const norm = t => t.split(' · ')[0].replace(/[0-9]+/g,'N');
  return d.tags.some(t=>norm(t.t)===S.tag);
}
function group(){
  const map = new Map();
  for(const e of DATA.events){
    if(S.mgr && e.mgr!==S.mgr) continue;
    if(!matchEvent(e)) continue;
    const a = anchor(e);
    if(!a.aid) continue;
    if(S.id && String(a.aid).indexOf(S.id)<0 && String(a.other||'').indexOf(S.id)<0) continue;
    if(!passScoreFilter(a.ent,a.aid,a.other)) continue;
    const key=a.ent+':'+a.aid;
    let g = map.get(key);
    if(!g){ g={ent:a.ent,aid:a.aid,title:a.title,other:a.other,events:[],chans:{},stages:{},last:0,mgr:e.mgr}; map.set(key,g); }
    g.events.push(e); if(e.ts>g.last){g.last=e.ts;g.mgr=e.mgr;} g.chans[e.type]=(g.chans[e.type]||0)+1; g.stages[e.stage]=1;
  }
  const arr=[...map.values()];
  arr.forEach(g=>g.events.sort((a,b)=>a.ts-b.ts));
  arr.sort((a,b)=> S.ord==='desc' ? b.last-a.last : a.last-b.last);
  return arr;
}

}

function hl(body, tags){
  let out = esc(body);
  for(const t of tags){ if(!t.quote) continue;
    const q = esc(t.quote); const i = out.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) continue;
    out = out.slice(0,i) + `<u class="hlq" style="text-decoration-color:${tagCol(t.tone)}">` + out.slice(i,i+q.length) + '</u>' + out.slice(i+q.length);
  }
  return out;
}

function toggle(el, forceOpen){

// У дел заголовок часто дублируется в начале описания: «Формирование ТЗ: Формирование ТЗ...».
// Показываем тело без повтора, иначе строка читается как каша.
// Русские окончания: «3 дела», а не «3 дел».
function plu(n,one,few,many){ const a=Math.abs(n)%100, b=a%10;

// Ноли не печатаем - строка должна читаться, а не считаться.
// Состав ленты за выбранный период. Без фильтра берём предпосчитанный mix за всё окно
// снимка, с фильтром пересчитываем на лету: РОП смотрит «что менеджер делал в этот день».
function mixOf(d,a,b){
  if(!a&&!b) return d.mix||null;

  const m={msg:0,chan:0,call:0,mail:0,task:0,note:0,ai:0,total:0}, ch=new Set();
  for(const e of evs){ if(a&&e.ts<a)continue; if(b&&e.ts>b)continue;

    // посчитан, поэтому резюме в счёт ленты не идёт (помечаем звонок как «с разбором»).
    if(e.type==='Резюме BitrixGPT'){ m.ai++; continue; }
    m.total++;
    if(e.type&&e.type.indexOf('Сообщение')===0){ m.msg++; ch.add(e.type); }

    else if(e.type==='Письмо') m.mail++;
    else if(e.type==='Дело'||e.type==='Задача') m.task++;
    else if(e.type==='Комментарий-заметка') m.note++; }

}

  'менеджер':'Объект анализа - МЕНЕДЖЕР(Ы). Данные собраны на всю глубину. ПОРЯДОК РАБОТЫ (внутри) - снизу вверх: сначала разбери коммуникации, каналы и системные отбивки (дела/задачи/комментарии) по каждой сделке, пойми контекст, затем поднимись на уровень менеджера. ПОРЯДОК ВЫВОДА (пользователю) - сверху вниз. НЕ опускайся в тексте до отдельных реплик. Тон - профессиональный консультант по продажам: критично, по фактам, БЕЗ похвалы. По каждому менеджеру: (1) вердикт - фраза-заголовок; (2) поле "разбор" - РАЗВЁРНУТЫЙ, максимально раскрытый аудит-вывод (несколько абзацев, это ГЛАВНЫЙ результат): общая картина работы, механика ключевых проблем и сильных мест, причины, чем подтверждается - синтез всего, что понял снизу; цифры вплетай в текст; (3) поле "сводка_сделок" - дополнительная сводка на 2-4 предложения, что творится на уровне его сделок (группы/паттерны, где деньги под риском); (4) по его сделкам - verdict/problem/recommendation/tone, БЕЗ пословного разбора реплик - детализация, доказывающая вывод. Верни JSON: {"менеджер":{"менеджер":"","вердикт":"","tone":"","разбор":"","сводка_сделок":"","сильные":[],"слабые":[],"действия":[]},"сделки":[{"id":"","менеджер":"","вердикт":"","проблема":"","рекомендация":"","tone":""}]}',
  'сделка':'Объект анализа - СДЕЛКА(И). Вывод по каждой сделке и на один уровень ниже - по коммуникациям: что именно в переписке (отклик, квалификация, сроки, ведение) сыграло. Верни JSON: {"сделки":[{"id":"","вердикт":"","проблема":"","рекомендация":"","tone":""}]}'
};
function aiScope(){ const F=S.aiF, deals=aiMatchDeals(); const byM={}; for(const d of deals)(byM[d.mgr]||=[]).push(d);
  const rep={full:0,partial:0,empty:0}; const obj=aiObject();
  const list=deals.map(d=>{ const c=completeness(d), m=aiMix(d); rep[c.k]++;
    return { id:d.dealId||d.leadId, kind:d.isLead?'лид':'сделка', менеджер:d.mgr, название:d.title,
      чек:d.budget||0, тип_клиента:d.client||'', ассортимент:d.assort||'', источник:d.source||'', бренд:d.dir||'',
      стадия:d.stage, история_стадий:(d.stageRows||[]).map(s=>({стадия:s.name,дней:s.days})), цикл_дней:d.cycle,
      исход:d.outcome||'open', происхождение:(d.dealId? (d.leadId?{из_лида:String(d.leadId)}:{создана_напрямую:true, лида_не_было:true}) : {это_лид:true}),
      вероятность:d.prob, причина_отказа:d.lossReason||'', полнота:c.k, комментарий:c.why,
      лента:{сообщения:m.msg,письма:m.mail,звонки:m.call,разбор_звонков:m.ai,дела:m.task,заметки:m.note} }; });
  return {
    объект_анализа: obj,
    формат_вывода: AI_OBJ_FMT[obj],
    уточняющий_вопрос: (F.question||'').trim() || null,
    запрос:'Ты аудитор отдела продаж (регламент: отклик, квалификация, сроки, вежливость, ведение, результат). Опирайся на все сигналы сделки: чек, тип клиента (B2B/B2C/дилер), ассортимент, источник лида, стадию и историю стадий, цикл - рекомендация должна учитывать контекст (крупный чек и B2B требуют иного дожима, чем розница). Учитывай отметку полноты: по 🔴/🟡 не делай выводов там, где данных нет. Порядок работы: сначала прими и разбери все данные выборки на всю глубину, пойми общую картину; затем прочитай уточняющий_вопрос (если задан) и через его призму сфокусируй ответ - вопрос это линза, не отдельный ответ вперёд разбора. ГЛУБИНА И ФОРМАТ ВЫВОДА - строго по полю формат_вывода (объект анализа: '+obj+'): данные собраны до коммуникаций, но вывод делай на уровне объекта и на один уровень ниже, не глубже.',
    фильтр:{ период_по:F.dMode==='created'?'дате создания сделки':'дате коммуникации', с:F.from||'начало окна снимка', по:F.to||'конец окна снимка', глубина:F.depth==='range'?'только события в диапазоне дат':'вся коммуникация сделки', менеджеры:F.mgrs.size?[...F.mgrs]:'весь отдел', стадии:F.stages.size?[...F.stages]:'все стадии', включено:[...F.inc].map(k=>INCLBL[k]) },
    полнота:{полные:rep.full,неполные:rep.partial,пустые:rep.empty,всего:deals.length},
    менеджеры:Object.entries(byM).map(([m,ds])=>({менеджер:m,сделок:ds.length})),
    сделки:list, снимок:BAKED_AT };
}
function aiCopy(){ const txt=JSON.stringify(aiScope(),null,2);
  const done=()=>{ const el=document.getElementById('aiCopied'); if(el){ el.textContent='Скопировано - пришлите этот текст в чат'; setTimeout(()=>el.textContent='',4000);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity=0; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); cb&&cb(); }

function aiPreset(k){ const F=S.aiF, now=new Date(), iso=d=>d.toISOString().slice(0,10);
  if(k==='all'){F.from='';F.to='';}
  else if(k==='today'){F.from=iso(now);F.to=iso(now);}
  else if(k==='yst'){const y=new Date(now-864e5);F.from=iso(y);F.to=iso(y);}
  else if(k==='3'){F.from=iso(new Date(now-2*864e5));F.to=iso(now);}
  else if(k==='7'){F.from=iso(new Date(now-6*864e5));F.to=iso(now);}
  renderAIPanel();
}

function repHTML(){ const F=S.aiF, deals=aiMatchDeals(); const rep={full:0,partial:0,empty:0};
  const rows=deals.map(d=>{ const c=completeness(d); rep[c.k]++; return {d,c}; });
  const byM={}; for(const {d} of rows)(byM[d.mgr]||=[]).push(d);
  const order={full:0,partial:1,empty:2};
  rows.sort((x,y)=>order[x.c.k]-order[y.c.k]||(y.d.budget||0)-(x.d.budget||0));
  const mgrLine=Object.entries(byM).sort((a,b)=>b[1].length-a[1].length)
    .map(([m,ds])=>`${esc(m)} <b style="color:var(--ink-2)">${ds.length}</b>`).join(' · ') || '<span class="na2">нет сделок под фильтр</span>';
  return `<div class="rep">
      <div class="rc"><b style="color:#7FD1A6">${rep.full}</b><span>🟢 полные</span></div>
      <div class="rc"><b style="color:#E4B563">${rep.partial}</b><span>🟡 неполные</span></div>
      <div class="rc"><b style="color:#E08585">${rep.empty}</b><span>🔴 пустые</span></div>
      <div class="rc"><b>${deals.length}</b><span>всего</span></div>
    </div>
    <div class="mgrsum" style="margin-top:9px">Менеджеры: ${mgrLine}</div>
    <div class="hint" style="margin-top:6px">${deals.length} ${plu(deals.length,'сделка','сделки','сделок')} в выборке. Полный список сделок и полнота по каждой уходят в конфиг для ИИ - здесь читать не нужно.</div>`;
}
function renderRepOnly(){ const el=document.getElementById('aiRep'); if(el) el.innerHTML=repHTML(); }

// Одно окно на весь цикл: распознаём вставленное и сами решаем, что с ним делать.
// Настройка (есть ключ «фильтр» или список сделок без вердиктов) - разворачиваем дашборд.
// Разбор ИИ (вердикты по сделкам / карточка менеджера / просто текст) - показываем ниже.
// Ключ Anthropic для прямого вызова из браузера. Хранится ТОЛЬКО в localStorage этого браузера
// (не в коде, не в гите). Вставляется один раз - дальше кнопка работает сама.
function aiKeyGet(){ try{ return localStorage.getItem('dlg_anthropic_key')||''; }catch(e){ return ''; } }
function aiKeySet(v){ try{ localStorage.setItem('dlg_anthropic_key',(v||'').trim()); }catch(e){} }
// Кнопка «Получить разбор»: собирает выборку (aiScope) + уточняющий вопрос, шлёт напрямую в
// Anthropic (Sonnet 5, браузерный доступ) и рендерит ответ тем же renderAns, что и раньше.
async function aiRun(){
  const msg=document.getElementById('aiInMsg'), out=document.getElementById('aiAnsOut');
  const key=aiKeyGet();
  if(!key){ msg.innerHTML='Вставьте ключ Anthropic (sk-ant-…) в поле выше - один раз, дальше не нужно.'; const k=document.getElementById('aiKey'); if(k) k.focus(); return; }
  const scope=aiScope(); const n=(scope.сделки||[]).length;
  if(!n){ msg.innerHTML='В выборке нет сделок - задайте фильтр (даты, менеджеры, стадии или клики по дашборду).'; return; }
  msg.innerHTML='Отправляю '+n+' '+plu(n,'сделку','сделки','сделок')+' в Anthropic (Sonnet 5)… до минуты.'; out.innerHTML='';
  const sys=scope.запрос+' Верни ТОЛЬКО валидный JSON строго по полю формат_вывода, без markdown-обёртки.';
  const body={ model:'claude-sonnet-5', max_tokens:8000, system:[{type:'text',text:sys}], messages:[{role:'user',content:JSON.stringify(scope)}] };
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body) });
    const j=await res.json();
    if(j.error){ msg.innerHTML='Ошибка API: '+esc(j.error.message||j.error.type||'неизвестно'); return; }
    const txt=(j.content||[]).map(c=>c.text||'').join('').trim();
    if(!txt){ msg.innerHTML='Пустой ответ модели.'; return; }
    S.ansText=txt; renderAns(txt); aiSave();
    const u=j.usage||{}; msg.innerHTML='Готово · '+n+' '+plu(n,'сделка','сделки','сделок')+(u.input_tokens?(' · токенов '+u.input_tokens+'→'+(u.output_tokens||0)):'');
  }catch(e){ msg.innerHTML='Сбой запроса: '+esc(e&&e.message||String(e))+'. Проверьте ключ и сеть.'; }
}
function aiIsConfig(obj){ if(!obj) return false; // не-JSON (обычный текст) считаем разбором
  if(obj.фильтр||obj.filter) return true; // наш конфиг всегда несёт блок «фильтр»
  if(obj.отдел||obj.department) return false; // разбор уровня отдела
  const arr=obj.сделки||obj.deals||obj.reviews, mg=obj.менеджер||obj.manager, mgs=obj.менеджеры||obj.managers;
  const answerish=(mg&&(mg.вердикт||mg.verdict||mg.сильные||mg.strengths||mg.слабые||mg.weaknesses))
    ||(Array.isArray(arr)&&arr.some(x=>x&&(x.вердикт||x.verdict||x.проблема||x.problem||x.рекомендация||x.recommendation||x.tone)))
    ||(Array.isArray(mgs)&&mgs.some(x=>x&&(x.вердикт||x.verdict||x.tone||x.сильные_сделки||x.слабые_сделки||x.strong||x.weak)));
  if(answerish) return false;
  if(obj.менеджеры||obj.выборка||Array.isArray(arr)) return true; // список сделок/менеджеров без вердиктов = настройка
  return false;
}
function renderAns(raw,obj){ const out=document.getElementById('aiAnsOut'); if(!out) return;
  raw=(raw||'').trim(); if(!raw){ out.innerHTML=''; return; }
  if(obj===undefined){ obj=null; try{ const m=raw.match(/\{[\s\S]*\}/); obj=m?JSON.parse(m[0]):null; }catch(e){} }
  const tcol=t=>t==='bad'?'#E08585':t==='good'?'#7FD1A6':'#E4B563';
  const lst=(a)=>Array.isArray(a)&&a.length?'<ul class="mgul">'+a.map(x=>`<li>${esc(typeof x==='string'?x:(x.действие||x.text||''))}</li>`).join('')+'</ul>':'';
  // Вывод уровня ОТДЕЛ: карточка отдела + карточки менеджеров с подсветкой сильных/слабых сделок.
  const dept = obj && (obj.отдел||obj.department);
  const mgrsArr = obj && (obj.менеджеры||obj.managers);
  if(dept || Array.isArray(mgrsArr)){
    const dchips=(a,cls)=>Array.isArray(a)&&a.length?'<div class="dchips">'+a.map(x=>{ const id=esc(String(x.id||x.сделка||x)); const why=esc(x.почему||x.why||''); return `<span class="dchip ${cls}" title="${why}">${id}${why?' · '+why:''}</span>`; }).join('')+'</div>':'';
    let h='<div class="ansout">';
    if(dept){ const tc=tcol(dept.tone);
      h+=`<div class="mgcard" style="border-color:${tc}66"><div class="mgh">Отдел</div>
        <div class="mgv" style="color:${tc}">${esc(dept.вердикт||dept.verdict||'')}</div>
        ${dept.разбор||dept.данные||dept.caveat?`<div class="mgaudit">${esc(dept.разбор||dept.данные||dept.caveat)}</div>`:''}
        ${(dept.сильные||dept.strengths)?`<div class="mglab">Сильные места</div>${lst(dept.сильные||dept.strengths)}`:''}
        ${(dept.слабые||dept.weaknesses)?`<div class="mglab">Слабые места</div>${lst(dept.слабые||dept.weaknesses)}`:''}
        ${(dept.действия||dept.actions)?`<div class="mglab">Что делать</div>${lst(dept.действия||dept.actions)}`:''}</div>`; }
    if(dept && (dept.сводка_менеджеров||dept.сводка_ниже)) h+=`<div class="lsum"><div class="lsumh">Что по менеджерам · сводка</div>${esc(dept.сводка_менеджеров||dept.сводка_ниже)}</div>`;
    else if(Array.isArray(mgrsArr)&&mgrsArr.length) h+='<div class="lsumh">Детализация по менеджерам</div>';
    if(Array.isArray(mgrsArr)) h+=mgrsArr.map(mm=>{ const tc=tcol(mm.tone);
      return `<div class="mgcard" style="border-color:${tc}44"><div class="mgh">${esc(mm.менеджер||mm.name||'')}</div>
        <div class="mgv" style="color:${tc}">${esc(mm.вердикт||mm.verdict||'')}</div>
        ${(mm.сильные_сделки||mm.strong)?`<div class="mglab" style="color:#7FD1A6">Молодец</div>${dchips(mm.сильные_сделки||mm.strong,'good')}`:''}
        ${(mm.слабые_сделки||mm.weak)?`<div class="mglab" style="color:#E08585">Слабо</div>${dchips(mm.слабые_сделки||mm.weak,'bad')}`:''}</div>`; }).join('');
    out.innerHTML=h+'</div>'; return;
  }
  const arr = obj && (obj.сделки||obj.deals||obj.reviews);
  const mg = obj && (obj.менеджер||obj.manager);
  if(arr||mg){ const items = arr? (Array.isArray(arr)?arr:Object.entries(arr).map(([id,v])=>({id,...v}))) : [];
    // Уровень менеджера: сводка по всем разобранным сделкам плюс действия руководителю.
    const mgBlock = mg ? (()=>{ const t=mg.tone==='bad'?'#E08585':mg.tone==='good'?'#7FD1A6':'#E4B563';
      const lst=(a)=>Array.isArray(a)&&a.length?'<ul class="mgul">'+a.map(x=>`<li>${esc(typeof x==='string'?x:(x.действие||x.text||''))}</li>`).join('')+'</ul>':'';
      return `<div class="mgcard" style="border-color:${t}66">
        <div class="mgh">Менеджер · ${esc(mg.менеджер||mg.name||'')}</div>
        <div class="mgv" style="color:${t}">${esc(mg.вердикт||mg.verdict||'')}</div>
        ${mg.разбор||mg.данные||mg.caveat?`<div class="mgaudit">${esc(mg.разбор||mg.данные||mg.caveat)}</div>`:''}
        ${(mg.сильные||mg.strengths)?`<div class="mglab">Сильные стороны</div>${lst(mg.сильные||mg.strengths)}`:''}
        ${(mg.слабые||mg.weaknesses)?`<div class="mglab">Слабые места</div>${lst(mg.слабые||mg.weaknesses)}`:''}
        ${(mg.действия||mg.actions)?`<div class="mglab">Что сделать руководителю</div>${lst(mg.действия||mg.actions)}`:''}
      </div>`; })() : '';
    const subM = mg && (mg.сводка_сделок||mg.сводка_ниже) ? `<div class="lsum"><div class="lsumh">Что в сделках · сводка</div>${esc(mg.сводка_сделок||mg.сводка_ниже)}</div>` : (items.length?'<div class="lsumh">Детализация по сделкам</div>':'');
    out.innerHTML='<div class="ansout">'+mgBlock+subM+items.map(r=>{
      const t=r.tone==='bad'?'#E08585':r.tone==='good'?'#7FD1A6':'#E4B563';
      return `<div class="rv"><div class="rvh" style="color:${t}">${esc(r.id||r.сделка||'')} · ${esc(r.verdict||r.вердикт||'')}</div>
        ${r.problem||r.проблема?`<div class="rvp">Проблема: ${esc(r.problem||r.проблема)}</div>`:''}
        ${r.recommendation||r.рекомендация?`<div class="rvr">→ ${esc(r.recommendation||r.рекомендация)}</div>`:''}</div>`;
    }).join('')+'</div>';
  } else { out.innerHTML='<div class="ansout">'+esc(raw)+'</div>'; }
}

// Применить выборку к самому дашборду: сузить таблицу до нужных менеджеров и сделок,
// выставить период и раскрыть сделки, чтобы сразу видеть ход коммуникаций по пайплайну.
// Источник настройки - либо текущие контролы панели, либо переданный конфиг-JSON (cfg).
const OPEN_CAP = 20; // сколько сделок раскрываем автоматически, чтобы не рендерить сотни лент
function aiApplyToDash(cfg){ const F=S.aiF;
  let dMode, from, to, mgrs, dealIds, stages;
  if(cfg){ S.picks=[]; const f=cfg.фильтр||{}; // вставленная настройка замещает корзину кликов
    dMode=/созда/.test(String(f.период_по||''))?'created':'comm';
    from=(f.с&&!/окн/.test(String(f.с)))?f.с:''; to=(f.по&&!/окн/.test(String(f.по)))?f.по:'';
    const ml=Array.isArray(f.менеджеры)?f.менеджеры:(Array.isArray(cfg.менеджеры)?cfg.менеджеры.map(x=>x.менеджер):[]);
    mgrs=new Set(ml);
    stages=new Set(Array.isArray(f.стадии)?f.стадии:[]);
    const dl=Array.isArray(cfg.сделки)?cfg.сделки.map(x=>String(x.id)):[];
    dealIds=new Set(dl);
    // Синхронизируем контролы панели с активированным JSON, чтобы при повторном открытии
    // фильтр показывал то же, что применено к дашборду.
    S.aiF.dMode=dMode; S.aiF.from=from; S.aiF.to=to; S.aiF.mgrs=new Set(mgrs); S.aiF.stages=new Set(stages); S.aiF.dealIds=dl.join(', ');
  } else {
    dMode=F.dMode; from=F.from; to=F.to; mgrs=new Set(F.mgrs); stages=new Set(F.stages);
    if(F.dealIds.trim()) dealIds=new Set(F.dealIds.split(/[\s,;]+/).map(x=>x.trim().replace(/^[DL]/i,'')).filter(Boolean));
    else dealIds=new Set(aiMatchDeals().map(d=>String(d.dealId||d.leadId)));
  }
  S.dMode=dMode; S.dFrom=from; S.dTo=to;
  const matched=SC.deals.filter(d=> (!mgrs.size||mgrs.has(d.mgr)) && (!stages.size||stages.has(d.stage||'(без стадии)')) && (!dealIds.size||dealIds.has(String(d.dealId||d.leadId))) );
  S.fMgrs = mgrs.size ? mgrs : (dealIds.size ? new Set(matched.map(d=>d.mgr)) : new Set());
  S.fDealIds = dealIds;
  S.tm=new Set(matched.map(d=>d.mgr)); S.td=new Set();
  if(matched.length<=OPEN_CAP){ for(const d of matched) S.td.add(d.key); S.dashNote=''; }
  else S.dashNote=`сделок ${matched.length} - раскрыты менеджеры, переписку открывай кликом по строке`;
  aiSave(); aiToggle(false); render(); window.scrollTo(0,0);
}
function aiClearDash(){ S.fMgrs=new Set(); S.fDealIds=new Set(); S.dashNote=''; S.tm=new Set(); S.td=new Set(); S.picks=[]; aiApplyPicks(); aiSave(); render(); }
// Сохранение состояния панели и применённого фильтра в localStorage: обновление страницы
// (в т.ч. авто-деплой) больше не сбрасывает выборку и вставленный разбор.
function aiSave(){ try{ const F=S.aiF;
  localStorage.setItem('dlg_ai_v1', JSON.stringify({
    aiF:{dMode:F.dMode,from:F.from,to:F.to,dealIds:F.dealIds,depth:F.depth,mgrs:[...F.mgrs],stages:[...F.stages],question:F.question||'',obj:F.obj||'auto',inc:[...F.inc]},
    fMgrs:[...S.fMgrs], fDealIds:[...S.fDealIds], tm:[...S.tm], td:[...S.td], picks:S.picks||[],
    vdMode:S.dMode, vdFrom:S.dFrom, vdTo:S.dTo, dashNote:S.dashNote||'', ans:S.ansText||'' })); }catch(e){} }
function aiLoad(){ try{ const j=JSON.parse(localStorage.getItem('dlg_ai_v1')||'null'); if(!j) return;
  if(j.aiF){ S.aiF={dMode:j.aiF.dMode||'comm',from:j.aiF.from||'',to:j.aiF.to||'',dealIds:j.aiF.dealIds||'',depth:j.aiF.depth||'all',
    mgrs:new Set(j.aiF.mgrs||[]),stages:new Set(j.aiF.stages||[]),question:j.aiF.question||'',obj:j.aiF.obj||'auto',inc:new Set(j.aiF.inc&&j.aiF.inc.length?j.aiF.inc:['msg','mail','call','task','note'])}; }
  S.fMgrs=new Set(j.fMgrs||[]); S.fDealIds=new Set(j.fDealIds||[]); S.picks=Array.isArray(j.picks)?j.picks:[];
  // Раскрытие строк (tm/td) НЕ восстанавливаем: это навигация, а не анализ. Иначе при
  // перезагрузке дашборд сам разворачивает менеджера, которого раскрывали в прошлый раз.
  // Восстанавливаем только применённый ИИ-фильтр и ответ.
  if(j.vdMode)S.dMode=j.vdMode; S.dFrom=j.vdFrom||''; S.dTo=j.vdTo||''; S.dashNote=j.dashNote||''; S.ansText=j.ans||'';
}catch(e){} }
function aiQInput(v){ S.aiF.question=v; aiSave(); }
function aiSetObj(v){ S.aiF.obj=v; renderAIPanel(); }

// ===== Фильтр по кликам (корзина внизу) =====
// 4 уровня: отдел -> менеджер -> сделка -> коммуникация. Клик по любому элементу кладёт
// «пик» в корзину; каждый пик разворачивается в список сделок, а конфиг ИИ по каждой
// сделке несёт всю её коммуникацию - глубина всегда до конца. Клики накапливаются
// (множественный выбор), повторный клик снимает пик, «×» в корзине - тоже.
const mLabel=(mm)=> mm===DEPT_KEY ? 'Весь отдел' : mm;
function pickSig(p){ return p.kind+'|'+p.mgr+'|'+p.sub; }
function aiPickActive(kind,mgr,sub){ return S.picks.some(p=>p.kind===kind&&p.mgr===mgr&&p.sub===sub); }
function aiPickToggle(p){ const s=pickSig(p); const i=S.picks.findIndex(x=>pickSig(x)===s);
  if(i>=0) S.picks.splice(i,1); else S.picks.push(p);
  aiApplyPicks(); renderTree(); }
function aiPickRemove(sig){ const i=S.picks.findIndex(x=>pickSig(x)===sig); if(i>=0){ S.picks.splice(i,1); aiApplyPicks(); renderTree(); } }
function aiPicksClear(){ S.picks=[]; aiApplyPicks(); renderTree(); }
function aiPicksClearMgr(mgr){ S.picks=S.picks.filter(p=>p.mgr!==mgr); aiApplyPicks(); renderTree(); }
// Корзина -> фильтр ИИ: объединяем сделки всех пиков в один список ID, глубина всегда
// «вся сделка». Пусто - корзина не трогает ручной фильтр панели.
function aiApplyPicks(){ const F=S.aiF;
  if(S.picks.length){ const ids=new Set(), mgrs=new Set(), stages=new Set();
    // Выборка ИИ = объединение сделок всех пиков (истина - список ID). Плюс отражаем клики
    // в измерения панели: менеджер пика зажигает чип менеджера, пик воронки - чипы стадий.
    S.picks.forEach(p=>{ (p.deals||[]).forEach(d=>ids.add(String(d)));
      if(p.mgr && p.mgr!==DEPT_KEY && p.mgr!=='(лид)') mgrs.add(p.mgr);
      if(p.kind==='fn'){ const g=STAGE_GRP.find(x=>x.k===p.sub); if(g&&g.stages.length) g.stages.forEach(s=>stages.add(s)); } });
    F.mgrs=mgrs; F.stages=stages; F.depth='all'; F.dealIds=[...ids].join(', ');
    F.dMode=S.dMode; F.from=S.dFrom; F.to=S.dTo; }
  else { F.mgrs=new Set(); F.stages=new Set(); F.dealIds=''; }
  aiSave(); if(S.aiOpen) renderAIPanel(); }
function renderPickTray(){ const el=document.getElementById('picktray'); if(!el) return;
  if(!S.picks.length){ el.classList.remove('on'); el.innerHTML=''; document.body.style.paddingBottom=''; return; }
  document.body.style.paddingBottom='84px';
  const total=new Set(); S.picks.forEach(p=>(p.deals||[]).forEach(d=>total.add(String(d))));
  const chips=S.picks.map(p=>`<span class="pchip" data-psig="${esc(pickSig(p))}" title="Убрать из корзины">${esc(p.label)} <b>${(p.deals||[]).length}</b> <span class="px">✕</span></span>`).join('');
  el.innerHTML=`<div class="ptl">Фильтр по кликам<span class="ptn">${total.size} ${plu(total.size,'сделка','сделки','сделок')} · всё вниз до коммуникаций</span></div>
    <div class="pchips">${chips}</div>
    <div class="pacts"><button class="pbtn" id="ptOpen">Открыть фильтр</button><button class="pbtn ghost" id="ptClear">Сбросить всё</button></div>`;
  el.classList.add('on');
  el.querySelectorAll('.pchip').forEach(c=>c.onclick=()=>aiPickRemove(c.dataset.psig));
  const o=el.querySelector('#ptOpen'); if(o) o.onclick=()=>aiToggle(true);
  const cl=el.querySelector('#ptClear'); if(cl) cl.onclick=aiPicksClear;
}
// Любой клик-дрил на дашборде готовит фильтр ИИ (не открывая панель): выборка = ровно
// те сделки, что сейчас показаны, чтобы «Анализ ИИ» бил по тому, на что смотришь.
// Семантический перенос дрила в фильтр панели: менеджер, стадии и период выставляются
// чипами (видно, что перенеслось); точный список ID - только когда стадией не выразить.
function aiSyncScope(o){ const F=S.aiF;
  F.dMode=S.dMode; F.from=S.dFrom; F.to=S.dTo;
  F.mgrs = (o.mgr && o.mgr!==DEPT_KEY) ? new Set([o.mgr]) : new Set();
  if(o.stages && o.stages.length){ F.stages=new Set(o.stages); F.dealIds=''; }
  else if(o.deals){ F.stages=new Set(); F.dealIds=o.deals.map(d=>String(d.dealId||d.leadId)).join(', '); }
  else { F.stages=new Set(); F.dealIds=''; }
  aiSave(); }
function aiSyncReset(){ const F=S.aiF; F.mgrs=new Set(); F.stages=new Set(); F.dealIds=''; aiSave(); }
// Прокрутка к переписке сделки и подсветка событий нужной категории (клик по чипу «Ленты»).
function scrollToDeal(key, cat){ setTimeout(()=>{ const host=document.getElementById('tree-'+key); if(!host) return;
  let target=host;
  if(cat){ const rows=host.querySelectorAll('.erow2[data-evcat="'+cat+'"]'); rows.forEach(r=>r.classList.add('evhi')); if(rows.length) target=rows[0]; }
  target.scrollIntoView({behavior:'smooth', block:'center'});
}, 60); }

aiLoad(); initControls(); render();

// Анти-кэш для боевого адреса /dialog/: деплой кладёт рядом v.txt со штампом сборки.
// Проверяем при загрузке, при возврате на вкладку и раз в 15 минут - давно открытая
// вкладка тоже подтянет свежую версию. Перезагрузка одна на версию (sessionStorage),
// иначе упрямый кэш зациклил бы страницу.
(function(){try{
  if(location.protocol==='file:'||!BAKED_AT)return;
  const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
    v=(v||'').trim();
    if(!v||v===BAKED_AT||v<BAKED_AT)return;
    if(sessionStorage.getItem('_dlgv')===v)return;
    sessionStorage.setItem('_dlgv',v);
    location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }).catch(()=>{})};
  chk();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
  setInterval(chk,9e5);
}catch(e){}})();
</script>
