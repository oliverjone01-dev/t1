id: ozon-ad-unit-econ-take-rate
title: "OZON: ставка сборов и комиссия за выбранный период («Юнит-экономика рекламы» на «Маркетинге», «Рентабельность» на «Обзоре»)"
version: 4
status: approved
owner: "Иван Раюшкин"
approved_at: "2026-10-20"
decision: "жать / держать / резать рекламную кампанию; доля комиссии OZON в выручке"
good_direction: down
entity: SKU (реклама) / день (рентабельность)
key: [sku, d]
type: ratio
formula_text: >
  Реклама: ставка SKU = (начислено − к выплате) / начислено × 100 за дни выбранного периода + надбавка за
  эквайринг и хранение кабинета = ставка всех сборов канала − ставка SKU-ряда за тот же период (нет канала или
  начислено расходится >1% - надбавки нет, причина в подписи блока). Период, закончившийся меньше 14 дней назад
  (МСК): надбавка последних 30 дней до этой границы, с пометкой (Иван 20.10: «2 а»). Строки «доставлен, выручка >0,
  комиссия 0» остаются в расчёте (Иван 20.10: «1 вернуть»: с ними сентябрь 49,52% против 49,51% в отчёте о реализации). Нет начислений по SKU в периоде - ставки
  нет, строка «нет данных» (подстановок окна и категории нет). Считается только кампания с выручкой, заказами,
  ставкой и с/с; кампания без выручки - весь расход в минус и в «резать».
  Рентабельность: комиссия % = Σ|комиссия за продажу| / Σначислено по дням бакета с начислениями (только поле
  commission, не все сборы); комиссия ₽ = выручка ТЕХ ЖЕ дней × комиссия %;
  дни без начислений не заполняются. Процент показан с базой (выручка дней с начислениями); маржа - до комиссии. С/с = Σ с/с единицы × заказано шт
  по товарам с известной с/с, выручка - тех же товаров.
code_module: "analytics-mvp/src/scripts/ad-econ.ts (AD_ECON_JS), analytics-mvp/src/scripts/build-katya.ts (PROF_*, patchObzorOzon)"
ratio:
  numerator: "реклама: сборы OZON (начислено − к выплате); рентабельность: |комиссия за продажу|"
  denominator: "начислено (цена × штуки доставленных заказов)"
  same_entity: true
  same_date_field: false   # SKU-ряд и сборы по продаже - по дате заказа; эквайринг/хранение канала - по дате начисления (by-day)
  invariant: "0 <= com <= 100"
filters:
  include_statuses: [delivered]
  exclude: []
cancellations_returns:
  mode: gross        # в ряду начислений нет сторно возвратов: только доставленные заказы
  return_date_basis: order_date
date_field: created   # дата заказа (posting); надбавка - по дате начисления
mode: period
timezone: Europe/Moscow
interval: "[from, to] выбранного периода, обе границы включительно"
partial_period: mark   # дни без начислений пустые, пояснение в подписи блока
additive_over_time: false
accounting_basis: accrual
empty_value: "null"    # нет начислений / с/с - «нет данных» или пусто, не 0
source:
  endpoint: "data/pnl_sku_accrual_daily.ndjson, data/pnl_channel_accrual_daily.ndjson (accrual-API OZON), data/sku_cogs.json, data/history.ndjson"
decisions:
  - "Иван 20.10: 1б - эквайринг и хранение кабинета добавлять к ставке сборов рекламы; с/с GGT-46 (SKU 5632740461) = 12380 ₽"
  - "Иван 20.10: «бери рентабельность и комиссии только за выбранный период - остальное не проставляй»; на графике «Рентабельности» только комиссия, не все сборы (заменяет 2а и окно 60 дней из версии 1)"
golden_rows: "analytics-mvp/src/scripts/ad-econ.test.ts (эталон посчитан вручную, 15 кейсов; мутанты знака, окон, зрелости и устаревшего ряда убиты)"
known_limits:
  - "На свежем периоде начислений мало: OZON начисляет после доставки (01-15.10 начислено 49% заказанного, 16-19.10 - 0%)"
  - "Комиссия за сентябрь: страница 49,5%, отчёт о реализации 49,51% (ФЕНИКС iter3, документ против API)"
  - "Ряды начислений в страже свежести: порог 7 дней (обычный лаг доставки 3-5 дней)"
  - "Сверки с документом (отчёт о реализации) нет: ряды из API. С/с сентября: страница 3,7 млн, независимо по history.ndjson 3,65 млн и orders_daily 3,62 млн (одно семейство - API)"
