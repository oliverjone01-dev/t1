name: Monthly channels (апрель-август по каналам)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Помесячная выгрузка Директ+Метрика
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN || secrets.YD_TOKEN }}
          YANDEX_DIRECT_LOGIN: ${{ secrets.YANDEX_DIRECT_LOGIN || secrets.YD_LOGIN }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN || secrets.YM_TOKEN }}
          YANDEX_METRIKA_COUNTER: ${{ secrets.YANDEX_METRIKA_COUNTER || '104369223' }}
        run: node yandex-direct/dashboard/monthly-channels.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A yandex-direct/data/monthly-channels.json
          git diff --staged --quiet && { echo "нет изменений"; exit 0; }
          git commit -m "data: помесячная выгрузка по каналам $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((2**i)); done
          exit 1
