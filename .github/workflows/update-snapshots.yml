name: Update OZON snapshots (DEPRECATED - n8n)

# УСТАРЕЛ. Ночной синк переехал на прямой OZON: ozon-snapshots.yml (без n8n).
# У n8n Cloud исчерпана квота выполнений - эти вебхуки возвращают пусто, прогон падал
# бы каждую ночь и гонялся бы с прямым пайплайном за data/. Поэтому РАСПИСАНИЕ ОТКЛЮЧЕНО.
# Оставлен только ручной запуск как аварийный откат на n8n (если квота восстановится).
# Удалить после недели стабильной работы ozon-snapshots.yml.

on:
  # schedule отключён (см. выше) - ночной синк теперь ozon-snapshots.yml.
  workflow_dispatch:
    inputs:
      full:
        description: "Полная перезаливка истории с начала данных (для пересбора показов/возвратов без фильтра)"
        type: boolean
        default: false

concurrency:
  group: ozon-data # общий с sync.yml - не гонимся за push (FENIX G5)
  cancel-in-progress: false

permissions:
  contents: write

env:
  N8N: https://gen-group.app.n8n.cloud/webhook

jobs:
  snapshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      # Токен-заголовок готов под авторизацию вебхуков (FENIX G1). Пока вебхуки
      # открыты - заголовок безвреден; после включения header-auth заработает.
      - name: Snapshots (validate before replace)
        run: |
          set -euo pipefail
          AUTH=(-H "Content-Type: application/json" -H "X-Auth: ${N8N_TOKEN:-}")
          FROM=$(date -u -d "29 days ago" +%F); TO=$(date -u -d "yesterday" +%F); Y=$(date -u -d "yesterday" +%F)

          fetch () { # url, body, type, dest - ретраим флапы n8n (3 попытки), n8n иногда отдаёт пусто
            local url="$1" body="$2" type="$3" dest="$4" tmp; tmp=$(mktemp)
            for attempt in 1 2 3; do
              if curl -sS --fail-with-body --max-time 90 -X POST "$N8N/$url" "${AUTH[@]}" -d "$body" -o "$tmp" \
                 && npx tsx src/scripts/validate-snapshot.ts "$type" "$tmp"; then mv "$tmp" "$dest"; return 0; fi
              echo "fetch $url попытка $attempt не удалась, повтор через 5с"; sleep 5
            done
            echo "fetch $url не удался после 3 попыток"; exit 1
          }

          fetch gengroup-ozon-skus '{"days":30}' skus fixtures/skus_live_30d.json
          # Без withSku: per-SKU отчёты медленные (таймаут) и тут не нужны (грузятся лениво + cache:reports ниже).
          fetch gengroup-ozon-ads  '{"days":30}' ads  fixtures/ads_30d.json

          # Реклама по периодам (7/30/90) - чтобы Юнит-эк/маркетинг на снимке были период-точными
          # БЕЗ ожидания живого запроса. Заменяем только при валидном p30 (есть id), иначе не трогаем.
          AP=/tmp/ads_periods.json; echo '{}' > "$AP"
          for d in 7 30 90; do
            t=$(mktemp)
            if curl -sS --fail-with-body --max-time 90 -X POST "$N8N/gengroup-ozon-ads" "${AUTH[@]}" -d "{\"days\":$d}" -o "$t" \
               && npx tsx src/scripts/validate-snapshot.ts ads "$t"; then
              node -e "const fs=require('fs');const o=JSON.parse(fs.readFileSync('$AP'));o['p$d']=JSON.parse(fs.readFileSync('$t'));fs.writeFileSync('$AP',JSON.stringify(o));"
            else echo "::warning::ads_periods p$d не удалось"; fi
          done
          if node -e "const a=require('$AP');process.exit((a.p30&&((a.p30.top_spend||[])[0]||{}).id!==undefined)?0:1)"; then
            mv "$AP" fixtures/ads_periods.json; echo "ads_periods обновлён"
          else echo "::warning::ads_periods не обновлён (нет id в p30)"; fi

          fetch gengroup-ozon-pnl  "{\"dateFrom\":\"$FROM\",\"dateTo\":\"$TO\"}" pnl /tmp/pnl_raw.json
          npx tsx src/scripts/snapshot-pnl.ts /tmp/pnl_raw.json
          # per-SKU транзакции (маржа после сборов)
          curl -sS --fail-with-body --max-time 90 -X POST "$N8N/gengroup-ozon-pnl-sku" "${AUTH[@]}" \
            -d "{\"dateFrom\":\"$FROM\",\"dateTo\":\"$TO\"}" -o /tmp/pnlsku.json
          npx tsx src/scripts/validate-snapshot.ts pnlsku /tmp/pnlsku.json
          mv /tmp/pnlsku.json fixtures/pnl_sku_30d.json

          # Дневная история: догружаем ВСЕ недостающие дни от последнего в истории до вчера.
          # Самовосстановление после любого простоя синка (раньше тянули только вчера -> дыры).
          # full=true -> полная перезаливка с начала данных (ingest без фильтра пересоберёт показы/возвраты).
          LAST=$(node -e "let m='';for(const l of require('fs').readFileSync('data/history.ndjson','utf8').trim().split('\n')){try{const d=JSON.parse(l).date;if(d>m)m=d;}catch(e){}}console.log(m||'2026-02-05');")
          if [ "${{ github.event.inputs.full }}" = "true" ]; then cur="2026-02-06"; else cur=$(date -u -d "$LAST +1 day" +%F); fi
          BEFORE=$(wc -l < data/history.ndjson)
          while [ "${cur//-/}" -le "${Y//-/}" ]; do
            echo "догрузка дня $cur"
            # Ретраим день: n8n иногда отдаёт пустой ответ (флап). Раньше один пустой день
            # ронял весь бэкофилл - теперь 3 попытки, потом пропуск с warning (не валим прогон).
            ok=0
            for attempt in 1 2 3; do
              if curl -sS --fail-with-body --max-time 90 -X POST "$N8N/gengroup-ozon-daily" "${AUTH[@]}" \
                   -d "{\"dateFrom\":\"$cur\",\"dateTo\":\"$cur\"}" -o /tmp/daily.json \
                 && npx tsx src/scripts/validate-snapshot.ts daily /tmp/daily.json; then ok=1; break; fi
              echo "попытка $attempt за $cur не удалась, повтор через 5с"; sleep 5
            done
            if [ "$ok" = 1 ]; then npm run ingest -- /tmp/daily.json; else echo "::warning::день $cur пропущен (n8n вернул пусто/невалид после ретраев)"; fi
            cur=$(date -u -d "$cur +1 day" +%F)
          done
          AFTER=$(wc -l < data/history.ndjson)
          if [ "$AFTER" -lt "$BEFORE" ]; then echo "history сократилась $BEFORE->$AFTER"; exit 1; fi
        env:
          N8N_TOKEN: ${{ secrets.N8N_TOKEN }}

      # Кэш per-SKU отчётов рекламы (обход 429 OZON): один отчёт на кампанию, раз в день.
      # Не валим прогон, если OZON лимитирует - страница тогда тянет лениво вживую.
      - name: Cache ad reports
        continue-on-error: true
        run: npm run cache:reports

      - name: Rejoin cogs and rebuild
        run: |
          set -euo pipefail
          npm run join:cogs
          npm run build:site
          npm run katya # иначе katya-*.html в дате-коммите отстают от свежих данных

      - name: Commit (pull --rebase, retry)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Стейджим ВСЁ под analytics-mvp (сборка трогает файлы вне старого списка add;
          # *.db в .gitignore) - иначе остаются unstaged changes и pull --rebase падает.
          git add -A analytics-mvp
          if git diff --staged --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "data: ежедневное обновление снимков OZON $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((2**i))
          done
          echo "push не удался после ретраев"; exit 1
