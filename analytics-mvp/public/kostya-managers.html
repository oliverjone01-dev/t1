изделия (или пришлите фото с рулеткой).", "2. К какому сроку нужно готовое изделие?", "3. Какой бюджет закладываете на эту позицию?", "Расчёт подготовлю <конкретный срок: сегодня до 18:00 / завтра до обеда>."], "dont": ["Не отправлять сухое «Здравствуйте, по какому вопросу?» без представления.", "Не обещать «в ближайшее время»: это главный дефект отдела."]}, {"id": "qual", "title": "Квалификация: бюджет, срок, ЛПР", "when": "До подготовки расчёта. Всегда, а не когда сделка «покажется крупной».", "why": "Главный провал отдела по данным переписки: вопрос про бюджет встречается в 0.1% исходящих сообщений, про сроки в 0.1%, про лицо, принимающее решение, в 0.02%. Менеджеры считают, не зная ни денег клиента, ни его дедлайна, ни кто подписывает.", "script": ["Бюджет: «Чтобы не гонять вас по вариантам, скажите ориентир по бюджету на эту позицию. Мы умеем собирать решение и на 80 тысяч, и на 400, разница в стекле, профиле и фурнитуре».", "Срок: «К какому числу нужно готовое изделие? От этого зависит, успеваем ли мы в стандартный производственный цикл или нужно ставить в приоритет».", "ЛПР: «Подскажите, решение принимаете вы или нужно согласование с заказчиком или архитектором? Если нужно, подготовлю материалы сразу в удобном для показа виде».", "Критичное событие: «Есть ли дата, к которой объект должен быть сдан? Ремонт, переезд, открытие?»"], "dont": ["Не спрашивать бюджет извиняющимся тоном. Это рабочий вопрос, а не бестактность.", "Не пропускать вопрос про ЛПР на дизайнерских проектах: там почти всегда есть конечный заказчик."]}, {"id": "kp", "title": "Отправка КП", "when": "Расчёт готов. Сделка переводится на «КП отправлено» в тот же момент.", "why": "На стадии «КП отправлено» лежат 207 открытых сделок с медианой 31 день. Стадия работает как свалка, потому что после отправки не назначается контрольная точка.", "script": ["Имя, направляю расчёт по <изделие>. Внутри три варианта: базовый, с <опция>, и премиальный.", "Коротко разница: <одна строка на вариант, в рублях>.", "Срок изготовления с момента оплаты <N> рабочих дней, монтаж <M> дней.", "Предлагаю созвониться <конкретный день и время>, разберу вопросы за 10 минут. Удобно?"], "dont": ["Не отправлять файл без сопроводительного текста.", "Не заканчивать сообщение без вопроса: КП без следующего шага повисает."]}, {"id": "price", "title": "Возражение «дорого»", "when": "Клиент назвал цену высокой или упомянул более дешёвое предложение.", "why": "102 возражения по цене за 4 месяца, из них 46 у одного менеджера. Правило Кости: не более 24 часов на встречное предложение. Пропущенное возражение это не «клиент подумает», это уход к конкуренту.", "script": ["«Спасибо, что сказали прямо. Уточню: дорого в целом или конкретная позиция выбивается?»", "«Какой бюджет для вас рабочий? Назовите цифру, я скажу честно, попадаем мы в неё или нет».", "Если попадаем: «Можем удержаться в вашем бюджете, если <убрать подсветку / сменить профиль / взять осветлённое стекло вместо триплекса>. Пересчитаю и пришлю <конкретный срок>».", "Если не попадаем: «В ваш бюджет мы честно не попадём. Мы дороже, потому что <2 конкретных отличия с цифрами>. Если решите, что это важно, я на связи»."], "dont": ["Не давать скидку первым же ходом: 101 упоминание скидки в переписке против 14 вопросов про бюджет означает, что отдел торгуется вместо того, чтобы выяснять.", "Не отвечать на «дорого» вопросом «какое решение приняли»: это то, на чём была потеряна сделка 6 у Лакомовой."]}, {"id": "think", "title": "Возражение «подумаю» и «надо посоветоваться»", "when": "Клиент берёт паузу без названной даты.", "why": "На стадии «Принимают решение» 36 сделок висят дольше недели без согласованной даты решения. Правило: нет даты, нет стадии.", "script": ["«Конечно. Чтобы я не дёргал вас лишний раз, скажите, когда вам удобно вернуться к вопросу: к пятнице или к следующей среде?»", "«Что должно произойти, чтобы решение стало да? Может, чего-то не хватает в расчёте?»", "«Записал: возвращаемся <дата>. Я напишу вам утром этого дня»."], "don /* Индекс качества коммуникации. Веса - гипотеза, калибровка после 2 недель прогонов.
   Компоненты: скорость ответа, доведение диалога, конкретность сроков, квалификация, чистота текста. */
function commIndex(m){
  const r=m.reply||{};
  const speed = r.within60==null?0:r.within60;
  const tail  = r.over240==null?0:1-r.over240;
  const answered = m.in? 1-Math.min(1,m.unansweredCount/Math.max(1,m.dialogs)) : 0;
  const concrete = m.concreteTimeShare==null?0:m.concreteTimeShare;
  const qual = Math.min(1,(m.qualifyRate||0)/1.0);
  const dp = m.defectsPer100Out||{};
  const clean = Math.max(0,1-((dp['T07_ОРФОГРАФИЯ']||0)+(dp['T01_БЕЗ_ПОЯСНЕНИЯ']||0)+(dp['T02_БЕЗ_ПРИВЕТСТВИЯ']||0))/40);
  const v = speed*.25 + tail*.15 + answered*.20 + concrete*.15 + qual*.10 + clean*.15;
  return Math.round(v*100)/10;
}

})();

/* ---------- 2. Менеджеры ---------- */
(function(){
  const DEF=[['T03_ОБЕЩАНИЕ_БЕЗ_СРОКА','обещание без срока'],['T03_РАЗМЫТЫЙ_СРОК','размытая формулировка'],
    ['T01_БЕЗ_ПОЯСНЕНИЯ','сообщение без пояснения'],['T02_БЕЗ_ПРИВЕТСТВИЯ','нет приветствия в первом за день'],
    ['T07_ОРФОГРАФИЯ','орфография и пробелы'],['T04_ЖАРГОН','жаргон в извинении'],['T06_ЗАЩИТА','защита вместо извинения']];
  document.getElementById('t-mgr').innerHTML = M.map(m=>{
    const [b,c]=band(m.idx,m), r=m.reply||{}, dp=m.defectsPer100Out||{};

    const flags=(D.flagsByMgr[m.mgr]||[]);

    return `<details class="mgr">
      <summary>

        <span class="tag ${c}">${b}${m.deals>=MIN_DEALS?" "+m.idx.toFixed(1):""}</span>
        <span class="small">${m.deals} сделок &middot; ${m.out.toLocaleString('ru-RU')} исходящих &middot; медиана ${mins(r.medianMin)}</span>
        <span class="chips">
          ${m.unansweredCount?`<span class="tag bad">${m.unansweredCount} без ответа</span>`:''}
          ${m.escalationCount?`<span class="tag bad">${m.escalationCount} эскалаций</span>`:''}
          ${m.priceObjCount?`<span class="tag warn">${m.priceObjCount} «дорого»</span>`:''}
        </span>
      </summary>
      <div class="body">
        <h3>Скорость и доведение</h3>
        <div class="grid k4">
          <div class="card kpi"><div class="v">${mins(r.medianMin)}</div><div class="l">медиана ответа</div></div>
          <div class="card kpi"><div class="v">${mins(r.p75Min)}</div><div class="l">p75</div></div>
          <div class="card kpi"><div class="v" style="color:var(--bad)">${mins(r.p90Min)}</div><div class="l">p90, худшая десятая</div></div>
          <div class="card kpi"><div class="v">${pc(r.within60)}</div><div class="l">ответов быстрее часа</div>${bar(r.within60||0,(r.within60||0)>.7?'ok':'warn')}</div>
          <div class="card kpi"><div class="v">${pc(m.initiatedShare)}</div><div class="l">диалогов начал сам</div></div>
          <div class="card kpi"><div class="v">${pc(m.concreteTimeShare)}</div><div class="l">обещаний с конкретным сроком</div>${bar(m.concreteTimeShare||0,(m.concreteTimeShare||0)>.3?'ok':'bad')}</div>
          <div class="card kpi"><div class="v">${(m.qualifyRate||0).toFixed(2)}%</div><div class="l">сообщений с квалификацией</div></div>
          <div class="card kpi"><div class="v">${m.avgOutChars||'—'}</div><div class="l">средняя длина сообщения, знаков</div></div>
        </div>

        <h3>Дефекты текста на 100 исходящих</h3>
        <div class="scroll"><table><thead><tr><th>Дефект</th><th class="num">На 100 сообщений</th><th class="num">Всего</th><th>Уровень</th></tr></thead><tbody>
        ${DEF.filter(([k])=>dp[k]!=null).map(([k,n])=>{const v=dp[k]||0;const cl=v>15?'bad':v>5?'warn':'ok';
          return `<tr><td>${n}</td><td class="num">${v}</td><td class="num">${(m.defects||{})[k]||0}</td><td>${bar(Math.min(1,v/40),cl)}</td></tr>`}).join('')}
        </tbody></table></div>

        ${m.escalations&&m.escalations.length?`<h3 style="color:var(--bad)">Эскалации: клиент требовал руководителя или писал претензию</h3>
        ${m.escalations.map(e=>`<div class="q bad"><a href="${url(e.deal)}" target="_blank">Сделка ${E(e.deal)}</a>
          ${e.amount?` &middot; ${money(e.amount)}`:''} &middot; <span class="small">${E((e.at||'').slice(0,16).replace('T',' '))}</span><br>${E(e.text)}</div>`).join('')}`:''}

        ${m.unanswered&&m.unanswered.length?`<h3>Оставлено без ответа (топ по сумме)</h3>
        ${m.unanswered.slice(0,6).map(u=>`<div class="q"><a href="${url(u.deal)}" target="_blank">Сделка ${E(u.deal)}</a>
          ${u.amount?` &middot; ${money(u.amount)}`:''} &middot; <span class="small">${E((u.clientAt||'').slice(0,16).replace('T',' '))}, стадия ${E(u.stage)}</span><br>${E(u.clientText)}</div>`).join('')}`:''}

        ${m.worstReplies&&m.worstReplies.length?`<h3>Самые долгие ответы</h3>

          <td style="white-space:normal;max-width:340px">${E(w.clientText)}</td>
          <td style="white-space:normal;max-width:340px">${E(w.reply)}</td></tr>`).join('')}
        </tbody></table></div>`:''}

        ${flags.length?`<h3>Флаги дисциплины по открытым сделкам</h3>
        <div class="scroll"><table><thead><tr><th>Код</th><th>Сделка</th><th class="num">Сумма</th><th>Факт</th></tr></thead><tbody>
        ${flags.slice(0,12).map(f=>`<tr><td><span class="tag ${f.severity==='crit'?'bad':f.severity==='high'?'warn':''}">${E(f.code)}</span></td>
          <td><a href="${E(f.url)}" target="_blank">${E(f.deal)}</a></td><td class="num">${money(f.budget)}</td>
          <td style="white-space:normal">${E(f.fact)}</td></tr>`).join('')}
        </tbody></table></div>`:''}

        <h3>Крупнейшие сделки в переписке</h3>
        <div class="scroll"><table><thead><tr><th>Сделка</th><th class="num">Сумма</th><th>Стадия</th>
          <th class="num">Сообщений</th><th class="num">вх/исх</th><th class="num">Дней</th><th>Последнее слово</th></tr></thead><tbody>
        ${deals.slice(0,12).map(d=>`<tr><td><a href="${url(d.id)}" target="_blank">${E(d.id)}</a></td>
          <td class="num">${money(d.amount)}</td><td>${E(d.stage)}</td><td class="num">${d.n}</td>
          <td class="num">${d.in}/${d.out}</td><td class="num">${d.days}</td>
          <td>${d.lastDir==='in'?'<span class="tag bad">за клиентом</span>':'<span class="tag ok">за нами</span>'}</td></tr>`).join('')}
        </tbody></table></div>
      </div></details>`;
  }).join('');
})();

/* ---------- 3. Сделки ---------- */
(function(){
  const rows=[];
  for(const [mgr,ds] of Object.entries(D.dealsByMgr)) for(const d of ds) rows.push({mgr,...d});
  rows.sort((a,b)=>b.amount-a.amount);
  const el=document.getElementById('t-deal');
  el.innerHTML=`
  <h2>Детализация обработки заказов</h2>
  <div class="note">Одна строка на сделку: сколько сообщений, кто кого тащил, за кем осталось последнее слово,
    сколько дней жила переписка. «Последнее слово за клиентом» означает, что диалог оборвался на его сообщении.</div>
  <div class="card" style="margin-bottom:12px">
    <input id="q" placeholder="Фильтр: менеджер, стадия, номер сделки, тип изделия"
      style="width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
      padding:9px 12px;border-radius:8px;font:inherit">
  </div>
  <div class="scroll"><table><thead><tr><th>Сделка</th><th>Менеджер</th><th class="num">Сумма</th><th>Стадия</th>
    <th>Тип клиента</th><th>Изделие</th><th class="num">Сообщ.</th><th class="num">вх</th><th class="num">исх</th>
    <th class="num">Дней</th><th>Последнее слово</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="small" id="cnt"></p>`;
  const tb=el.querySelector('#tb'), cnt=el.querySelector('#cnt');
  function draw(f){
    const q=(f||'').toLowerCase().trim();
    const r=q?rows.filter(x=>[x.id,x.mgr,x.stage,x.item,x.client].join(' ').toLowerCase().includes(q)):rows;
    tb.innerHTML=r.slice(0,300).map(d=>`<tr><td><a href="${url(d.id)}" target="_blank">${E(d.id)}</a></td>
      <td>${E(d.mgr)}</td><td class="num">${money(d.amount)}</td><td>${E(d.stage)}</td>
      <td>${E(d.client)}</td><td>${E(d.item)}</td><td class="num">${d.n}</td><td class="num">${d.in}</td>
      <td class="num">${d.out}</td><td class="num">${d.days}</td>
      <td>${d.lastDir==='in'?'<span class="tag bad">за клиентом</span>':'<span class="tag ok">за нами</span>'}</td></tr>`).join('');
    cnt.textContent=`Показано ${Math.min(300,r.length)} из ${r.length}. В карточках менеджеров показаны только их топ-60 сделок по сумме.`;
  }
  el.querySelector('#q').oninput=e=>draw(e.target.value);
  draw('');
})();

    <td><span class="tag ${g.status==='НЕТ'||g.status==='почти НЕТ'?'bad':g.status.includes('разовое')?'warn':'ok'}">${E(g.status)}</span></td>
    <td class="num">${g.used}</td>
    <td style="white-space:normal;max-width:280px">${E(g.when)}</td>

</script>
