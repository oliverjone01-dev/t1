# Спека блока «План с 15.10: как идём к цели» (страница «Тесты» OZON). Модуль: analytics-mvp/src/scripts/plan-tab.ts
id: ozon-plan-15-10
title: "План с 15.10: заказы 10 карточек и магазина к порогу и цели, реклама и цена к плану"
version: 2
status: approved
owner: "Иван Раюшкин"
approved_at: "2026-10-15"   # v1: определения - «да» Ивана на 6 вопросов («по Москве», «меньше - зеленее»). v2 (15.10): «да» Ивана на эталоны 137/49/179, сверка с кабинетом, съём 2 раза в день
decision: "29.10 по каждой карточке: заказов за 15-28.10 не меньше порога - оставляем, меньше - откат клика и цены. Решаем только после прихода заказов за 28.10 (иначе на блоке красное предупреждение, ФЕНИКС N8)"
good_direction: "up для заказов и оборота, down для расхода рекламы (Иван 15.10: везде меньше - зеленее)"
entity: "отправление OZON (orders_daily.order), шт = units"
key: [order]
type: cumulative
formula_text: >
  Заказы карточки = сумма units по orders_daily без status=cancelled, sku в объединённой карточке (card_groups.json), d в [15.10, 28.10].
  Магазин = то же по всем sku. Нужное магазину к дню n = goalPath(14+n) - goalPath(14), goalPath(d) = 300/31*d + (355-300)*clamp(d-16,0,15)/15.
  Реклама: клик главного = ads_sku_daily.sp на главный sku без кампании 28753239 и без 11 кампаний на минимум; минимальный клик = sp на min_arts;
  11 кампаний = ads_daily.sp по id. Неделя чт-ср. Статус расхода: <=100% в плане, <=120% выше, >120% перерасход.
code_module: analytics-mvp/src/scripts/plan-tab.ts
filters:
  include_statuses: ["все, кроме cancelled"]
  exclude: ["кампания 28753239 «Оплата за заказ» - не клик"]
cancellations_returns:
  mode: net                # без отмен; отмены приходят с опозданием (01-10.10 12,9%, 11-13.10 6,5%) - свежие дни предварительные
  return_date_basis: order_date
date_field: created        # in_process_at из API
mode: period
timezone: Europe/Moscow     # Иван 15.10 «по Москве»: orders_daily.t (полное in_process_at, добавлено 15.10) + 3 ч; без t - UTC-дата d до ночного перезабора истории
interval: "[from, to]"
partial_period: mark       # последние 3 дня бледные; последний полный день по МСК = последний d выгрузки; реклама по товарам - до последнего полного дня (adsFullDay, покрытие от 95%)
additive_over_time: true
accounting_basis: order_date   # по дате заказа (in_process_at), не по отгрузке
empty_value: "null"        # дня нет в источнике - пропуск; внутри полного окна день без строки рекламы = 0 (кампания не тратила)
source:
  endpoint: "Seller API postings (orders_daily), Performance API (ads_daily, ads_sku_daily), analytics (sku_views)"
  fields: [d, status, sku, units, revenue, sp, cl, cid, vsearch, views, pdp, cart]
  limits: "ads_sku_daily доливается по кампаниям несколько ночей (ads_sku_state.json)"
  latency: "1 день; реклама по товарам 1-3 дня"
  lookback_days: null
reconciliation:
  against_family: api       # sku_views (аналитика OZON) против orders_daily (отправления)
  document: "01-13.10: orders_daily 155 с отменами / 137 без; sku_views units 153; разница 2 шт - граница UTC и дня OZON"
  tolerance: "0.02"
  second_family: cabinet    # v2: кабинет «Аналитика → Заказано, шт» с отменами по товарам 10 карточек, съём чата по чт и 29.10 (cabinet_orders_check.ndjson); сверка по тем товарам и дням, что есть в выгрузке; допуск 2% и не меньше 2 шт
funnel_tests_snapshots: "v2: съём утром и вечером; на ключ роль+товар+тест+дата одна строка, повтор заменяет; full=false - день не закрыт, в ряды не входит, показан отдельной строкой со временем среза; позиция для блока - последнее значение"
inference_rules:
  min_n: null
  mde: "порог карточки: Пуассон, карточка без эффекта проходит не чаще 15%"
  causal_claims: forbidden_without_control   # цена и клик в одних карточках - эффект общий
golden_rows:
  - input: "orders_daily 01-13.10, весь магазин, без отмен"
    expected: "137 (по дню UTC, поле d; по дню МСК - отдельный эталон после ночного сбора с полем t)"
    confirmed_by: "Иван 15.10 «да»; ФЕНИКС 15.10; тест plan-tab.test.ts (допуск вниз 2% на поздние отмены)"
  - input: "TRUBIS 160 GGT-03-3-3-E-16080, заказы карточки 14.09-11.10 без отмен"
    expected: "49 (12,25 в неделю), порог 31"
    confirmed_by: "Иван 15.10 «да»; Excel 15.10; ФЕНИКС 15.10; тест plan-tab.test.ts (48 товаров объединённой карточки)"
  - input: "магазин, нужное за 15-28.10 по пути цели октября «средне»"
    expected: "179"
    confirmed_by: "Иван 15.10 «да»; ФЕНИКС 15.10; тест plan-tab.test.ts"
