name: orders backfill (аналитика по заказам)

# Сбор данных по ЗАКАЗУ (posting) с кредами OZON из секретов.
# Пишет data/orders_daily.ndjson в ветку, на которой запущен (ref).
#
# Раньше запускался только руками, и начисления застревали: order_accruals стоял на августе,
# pnl_sku_accrual - на 17.09. С 25.09.2026 идёт каждый день (Иван: вкладка «Деньги» должна
# показывать последние данные кабинета), а не 5-го числа: при месячном сборе заказы и начисления
# текущего месяца стояли до 5-го следующего. Сбор полный, от 06.02 до вчера, поэтому доначисления
# прошлых дней подтягиваются сами. Час раньше ночного ozon-snapshots.yml: тот пересобирает
# страницы и забирает свежие заказы; группа ozon-data не даёт им идти одновременно.
# С 16.10.2026 (Иван: «данные собираются 2 раза в день, почему не подтягивание после сбора»)
# главный запуск - сразу после съёма кабинета с мака: legacy пишет data/reakciya.json,
# Codex пишет проверенный data/cabinet_capture.json в main.
# утром и вечером, этот push запускает сбор заказов, а он по окончании - ozon-snapshots
# (реклама, просмотры), после которого deploy-pages собирает сайт (workflow_run). Расписание
# ниже - страховка: GitHub запускает его с опозданием на часы, и если мак не прислал съём; по нему
# же раз в сутки идёт ozon-snapshots (своего cron у него нет с 16.10).
on:
  push:
    branches: [main]
    paths: [analytics-mvp/data/reakciya.json, analytics-mvp/data/cabinet_capture.json]
  schedule:
    - cron: "52 4 * * *" # каждый день ~07:52 МСК, до ночного синка OZON (05:53 UTC)
  workflow_dispatch:
    inputs:
      from:
        description: "FROM YYYY-MM-DD (дата заказа)"
        required: false
        default: "2026-02-06"
      to:
        description: "TO YYYY-MM-DD (пусто = вчера)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # после сбора по съёму запустить ozon-snapshots

concurrency:
  group: ozon-data
  cancel-in-progress: false

env:
  OZON_SELLER_CLIENT_ID: ${{ secrets.OZON_SELLER_CLIENT_ID }}
  OZON_SELLER_API_KEY: ${{ secrets.OZON_SELLER_API_KEY }}

jobs:
  orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Сбор по заказам
        run: npx tsx src/scripts/ozon/orders-daily.ts "${{ github.event.inputs.from || '2026-02-06' }}" "${{ github.event.inputs.to }}"
      # Шаги начислений ниже ходят в тот же OZON и ловят 429 (16.10: «rate limit per second» в
      # pnl-sku-accrual). Раньше сбой рвал весь прогон до коммита, и пропадали уже собранные заказы.
      # Теперь сбой шага не мешает коммиту, а прогон краснеет в последнем шаге. Файлы скрипты пишут
      # в конце, упавший шаг оставляет прежний файл.
      # timeout-minutes 30 (зелёные шаги 9-427 с вместе с повторами [ДАННЫЕ: gh api jobs, 6 прогонов]): при затяжном 429 на accrual/by-day
      # день стоит ~4,5 мин повторов, 252 дня заняли бы 17-21 ч, job упёрся бы в 360 мин и коммит
      # заказов не выполнился бы (ФЕНИКС #485 K1). С таймаутом шаг обрывается, коммит идёт.
      - name: Миграция финансов по SKU на accrual (параллельный файл)
        id: pnlsku
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # до 3 попыток: OZON отвечает 429 на секунды, пауза 60 и 120 с (ФЕНИКС #484 K7)
          for i in 1 2 3; do
            npx tsx src/scripts/ozon/pnl-sku-accrual-daily.ts 2026-02-06 "${{ github.event.inputs.to }}" && exit 0
            [ "$i" -lt 3 ] && sleep $((60*i))
          done
          exit 1
      - name: Эквайринг/хранение по SKU из accrual/by-day
        id: acq
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # до 3 попыток: OZON отвечает 429 на секунды, пауза 60 и 120 с (ФЕНИКС #484 K7)
          for i in 1 2 3; do
            npx tsx src/scripts/ozon/acq-sku-daily.ts "${{ github.event.inputs.from || '2026-02-06' }}" "${{ github.event.inputs.to }}" && exit 0
            [ "$i" -lt 3 ] && sleep $((60*i))
          done
          exit 1
      - name: Канальный P&L и Общие расходы из accrual (замена мёртвых транзакций)
        id: pnlacc
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # до 3 попыток: OZON отвечает 429 на секунды, пауза 60 и 120 с (ФЕНИКС #484 K7)
          for i in 1 2 3; do
            npx tsx src/scripts/ozon/pnl-accrual-daily.ts 2026-02-06 "${{ github.event.inputs.to }}" && exit 0
            [ "$i" -lt 3 ] && sleep $((60*i))
          done
          exit 1
      - name: Отчёт о реализации по SKU (штуки и база налога F+G-J-K)
        # Иван 25.09.2026: база налога OZON - «Реализовано» отчёта о реализации (F + G за вычетом
        # возвратов). Хвост из двух месяцев перетягивается каждый раз, месяцы без базы - один раз.
        id: realm
        continue-on-error: true
        run: npm run pnl:realization
      - name: Отчёт о реализации за день по SKU (накопительно, OZON хранит 32 дня)
        # Иван 25.09.2026, п. 1.4 и 2.2: база налога и деньги таблицы по артикулам за незакрытый месяц
        # - из отчёта о реализации за день, а не оценкой. Каждый прогон перетягивает последние 31 день.
        id: reald
        continue-on-error: true
        run: npx tsx src/scripts/ozon/realization-daily.ts 31
      - name: Калибровка соинвеста по эталону начислений
        # Сети не требует, поэтому не падает вместе с OZON. Вердикт виден прямо в логе шага:
        # он говорит, какая из двух цен снимка разошлась с фактом и на сколько пунктов.
        run: npm run coinv:calib || echo "::warning::калибровка соинвеста не пересчиталась"
      - name: Коммит данных в ветку
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-mvp/data/orders_daily.ndjson analytics-mvp/data/orders_accrual_types.json analytics-mvp/data/pnl_sku_accrual_daily.ndjson analytics-mvp/data/acq_sku_daily.ndjson analytics-mvp/data/buyer_delivery_daily.ndjson analytics-mvp/data/buyer_delivery_orders.ndjson analytics-mvp/data/partner_daily.ndjson analytics-mvp/data/partner_orders.ndjson analytics-mvp/data/pnl_channel_accrual_daily.ndjson analytics-mvp/data/pnl_account_accrual_daily.ndjson analytics-mvp/data/coinv_calibration.json analytics-mvp/data/realization_monthly.ndjson analytics-mvp/data/pnl_account_accrual_types.json analytics-mvp/data/realization_daily.ndjson
          # Финансовые collectors пишут through/loaded_at только после успешной записи данных.
          # Все три могли завершиться ошибкой: тогда файла в старом checkout ещё нет.
          if [ -f analytics-mvp/data/collector_status.json ]; then
            git add analytics-mvp/data/collector_status.json
          fi
          if git diff --cached --quiet; then
            echo "нет изменений в orders_daily.ndjson"
          else
            git commit -m "data(orders): начисления и калибровка соинвеста ${{ github.event_name == 'schedule' && '(ежедневный сбор)' || github.event_name == 'push' && '(после съёма с мака)' || format('{0}..{1}', github.event.inputs.from, github.event.inputs.to) }} [skip ci]"
            # чужой push в main во время сбора (съём с мака, другие сборщики): без rebase все попытки
            # отказывали, шаг выходил с кодом 0 и заказы молча не доходили (ФЕНИКС #484 A5b)
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep $((2**i))
            done
            if [ "$ok" != "1" ]; then echo "::error::push данных не удался"; exit 1; fi
          fi
      - name: Запуск ozon-snapshots после сбора по съёму
        # Цепочка «съём -> заказы -> реклама и просмотры -> сайт» без ожидания расписания GitHub.
        # Коммиты ботом (GITHUB_TOKEN) push-воркфлоу не запускают, поэтому петли нет; dispatch через
        # GITHUB_TOKEN GitHub разрешает. Идёт и при сбое отчёта о реализации: реклама от него не зависит.
        # И по расписанию: в группе ozon-data новый запуск заменяет ждущий, и прогон по расписанию
        # может вытеснить прогон от съёма (Codex P2 #484). Своего расписания у ozon-snapshots больше
        # нет: его запуск по расписанию - этот шаг после прогона orders по расписанию (без дубля, ФЕНИКС K1).
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ozon-snapshots.yml/dispatches" \
              -d '{"ref":"main"}' || echo 000)
            if [ "$code" = "204" ]; then ok=1; break; fi
            echo "попытка $i: HTTP $code $(cat /tmp/dispatch.out)"; sleep $((5*i))
          done
          if [ "$ok" != "1" ]; then echo "::error::ozon-snapshots не запущен после 5 попыток"; exit 1; fi
          echo "ozon-snapshots запрошен."
      - name: Отчёты о реализации получены целиком
        # Аудит ФЕНИКСА 25.09: сбор отчёта о реализации раньше глотал сбой, CI оставался зелёным, а
        # OZON хранит отчёт за день 32 дня - пропуск становился необратимым. Шаги выше не рвут
        # коммит остальных данных (continue-on-error), а этот шаг красит прогон, если они упали.
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.realm.outcome }}" = "failure" ] || [ "${{ steps.reald.outcome }}" = "failure" ]; then
            echo "::error::отчёт о реализации: месячный ${{ steps.realm.outcome }}, за день ${{ steps.reald.outcome }} - перезапусти workflow"
            exit 1
          fi
          # шаг, оборванный по timeout-minutes, приходит failure (раннер: таймаут = Failed, ФЕНИКС #485 iter2);
          # skipped при упавшем «Сбор по заказам» сюда не попадает: тогда и коммита не было
          if [ "${{ steps.pnlsku.outcome }}" = "failure" ] || [ "${{ steps.acq.outcome }}" = "failure" ] || [ "${{ steps.pnlacc.outcome }}" = "failure" ]; then
            echo "::error::начисления: по SKU ${{ steps.pnlsku.outcome }}, эквайринг ${{ steps.acq.outcome }}, канальный P&L ${{ steps.pnlacc.outcome }} - заказы закоммичены, перезапусти workflow"
            exit 1
          fi
