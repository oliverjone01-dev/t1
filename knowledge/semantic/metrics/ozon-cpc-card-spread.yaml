  - input: "карточка 4681610246, кампания 43629658, 180 ₽ 29.09 (GGM-17-1-3, GGM-17-2-2); заказов карточки 29.09 нет"
    expected: "0 штук в окне -> 180 ₽ на 10 заказов карточки за сентябрь, по 18 ₽ (вопрос 2). Сейчас: 104 ₽ на заказ 10940223-0695-3, 76 ₽ в «Общих»"
    confirmed_by: ""
  - input: "сентябрь 01-29.09 целиком"
    expected: "CPC 791 263 ₽. Сейчас на заказах 735 212, в «Общих» 56 051. Вариант А и Б: на заказах 788 482, в «Общих» 2 781 (в Б 936 ₽ из них по запасному правилу «нет штук в окне»). Сумма по заказам + «Общие» = 791 263 в обоих"
    confirmed_by: ""
