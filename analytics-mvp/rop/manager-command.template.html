<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Дашборд менеджера</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0B0F15;--bg-card:#131820;--bg-elevated:#1A2029;--bg-soft:#232B36;--border:#1F2731;--border-soft:#161C24;--border-hot:#2B3441;
--ink:#F1F4F8;--ink-2:#A0AAB8;--ink-3:#6A7484;--ink-4:#3F4855;--accent:#22D3EE;--accent-2:#06B6D4;--accent-deep:#0E7490;--accent-soft:rgba(34,211,238,.10);
--d1:#22D3EE;--d2:#6366F1;--d3:#10B981;--d4:#A78BFA;--d5:#F472B6;--d6:#FB923C;--up:#10B981;--dn:#F43F5E;--warn:#F59E0B;--info:#A78BFA;
--radius:10px;--radius-lg:14px;--ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{background:radial-gradient(ellipse 60% 40% at 50% -8%,rgba(34,211,238,.05),transparent 70%),var(--bg-base);color:var(--ink);font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tglFlash{0%{box-shadow:0 0 0 0 rgba(34,211,238,0)}18%{box-shadow:0 0 0 2px rgba(34,211,238,.55)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
#root .card.tgl-flash{animation:tglFlash 1.1s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hdr{position:sticky;top:0;z-index:60}
.topbar{padding:11px 24px;border-bottom:1px solid var(--border-soft);background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}
.brand b{font-family:'Manrope';font-weight:800;font-size:14px}.brand span{display:block;font-size:10.5px;color:var(--ink-3)}
.nav{display:flex;gap:3px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:3px}
.nav button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:7px;cursor:pointer;transition:.15s}
.nav button.on{background:var(--accent-soft);color:var(--accent)}.nav button:hover:not(.on){color:var(--ink)}
.tb-spacer{flex:1}
.seg{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:10.5px;padding:5px 7px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.msel{position:relative;display:inline-block}
.msel-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--ink-2);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.msel-panel{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:8px;min-width:210px;max-height:300px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.msel-panel label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.msel-panel label:hover{background:var(--bg-elevated)}
.msel-foot{border-top:1px solid var(--border-soft);margin-top:6px;padding-top:6px;text-align:right}
.msel-foot button{background:transparent;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer}
.lsort{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0;text-align:left}
.dhh{background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;width:100%;text-align:center}
.dhh.l{text-align:left}.dhh.on{color:var(--accent)}
.dwell-split{display:flex;gap:20px;align-items:stretch}
.dwell-split .dw-tbl{flex:1.35;min-width:0}
.dwell-split .dw-chart{flex:1;min-width:0;border-left:1px solid var(--border-soft);padding-left:20px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:1150px){.dwell-split{flex-direction:column}.dwell-split .dw-chart{border-left:0;padding-left:0;border-top:1px solid var(--border-soft);padding-top:14px}}
.lsort.on{color:var(--accent)}
.controls{padding:9px 10px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px)}
.controls>*{flex-shrink:0}
.ctl-lbl{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;max-width:210px}
.wrap{max-width:1660px;margin:0 auto;padding:8px 24px 80px}
.sec-div{display:flex;align-items:center;gap:14px;margin:30px 0 14px;scroll-margin-top:120px}
.sec-div:first-child{margin-top:14px}
.sec-num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:14px;flex-shrink:0}
.sec-div h2{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.sec-div .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border-hot),transparent)}
.sec-div .hint{font-size:11px;color:var(--ink-3)}
.kpi-strip{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:14px;margin-bottom:14px}
@media(max-width:1200px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
.kpi-qty{position:absolute;top:12px;right:14px;text-align:right;line-height:1.05}
.kpi-qty b{font-family:'Manrope';font-weight:800;font-size:18px;color:var(--ink-2)}
.kpi-qty span{display:block;font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.kpi-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;animation:fadeUp .4s var(--ease-out) both;display:flex;flex-direction:column;align-items:flex-start}
.kpi-foot{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;width:100%;text-align:center}.kpi-foot>*{margin-top:0!important}
.kpi-cell::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac,var(--accent)),transparent)}
.kpi-k{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.kpi-v{font-family:'Manrope';font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1}
.kpi-v .u{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px}
.kpi-money{font-family:'Manrope';font-weight:700;font-size:14px;color:var(--ink-2);margin-top:6px}
.kpi-money b{color:var(--ink)}
.kpi-trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:8px;padding:2px 7px;border-radius:6px}
.kpi-trend.up{color:var(--up);background:rgba(16,185,129,.12)}.kpi-trend.dn{color:var(--dn);background:rgba(244,63,94,.12)}.kpi-trend.flat{color:var(--ink-3);background:var(--bg-elevated)}
.kpi-trend small{color:var(--ink-4);font-weight:500;margin-left:2px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;animation:fadeUp .45s var(--ease-out) both}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:16px;flex-wrap:wrap}
.card-title{font-family:'Manrope';font-weight:700;font-size:15px;margin-bottom:2px}
.card-sub{font-size:11px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid2>*,.grid3>*{min-width:0}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1100px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px 10px;text-align:center}
.gauge h4{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.gauge .gnote{font-size:10px;color:var(--ink-4);margin-top:2px}.gauge .gnote b{color:var(--ink-2)}
.grp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grp{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.grp{grid-template-columns:repeat(2,1fr)}}
.grp-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;position:relative;overflow:hidden;cursor:default}
.grp-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gc)}
.grp-card .gn{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-bottom:7px}
.grp-card .gc{font-family:'Manrope';font-weight:800;font-size:24px}
.grp-card .gm{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-weight:600}
.grp-card .gd{font-size:9.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;background:var(--bg-card);cursor:pointer;user-select:none}
.tbl th:hover{color:var(--ink)}.tbl th.sorted{color:var(--accent)}.tbl th.sorted::after{content:" ↓";font-size:9px}.tbl th.sorted.asc::after{content:" ↑"}
.tbl th.r,.tbl td.r{text-align:right}.tbl tr:last-child td{border-bottom:none}.tbl td.name{font-weight:600;color:var(--ink)}
.tbl tr.total td{background:var(--bg-elevated);font-weight:700;color:var(--ink);border-top:1px solid var(--border-hot)}
.tbl tbody tr:hover td{background:rgba(120,140,170,.12)}
.tbl tbody tr.total:hover td{background:var(--bg-elevated)}
.chrow:hover{background:rgba(120,140,170,.10);border-radius:4px}
.ddopt:hover{background:rgba(120,140,170,.16)!important}
.dhcol .dhg{opacity:0;transition:opacity .1s}.dhcol:hover .dhg{opacity:.6}
.fbar{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.fbar .fl{width:185px;font-size:11.5px;color:var(--ink-2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft{flex:1;height:24px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.fbar .ff{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#06121a;transform-origin:left;animation:grow .8s var(--ease-out) both}
.fbar .fv{width:128px;font-size:11px;color:var(--ink-3);flex-shrink:0}.fbar .fv b{color:var(--ink);font-weight:700}
.lgd{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:11px}.lgd div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);cursor:pointer;user-select:none;transition:.15s}
.lgd i{width:9px;height:9px;border-radius:2px}.lgd div.off{opacity:.32}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.mx th,.mx td{padding:7px 7px;text-align:right;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
.mx th{font-size:9.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;background:var(--bg-card);white-space:nowrap}
.mx th.lh,.mx td.lc{text-align:left}.mx td.lc{font-weight:600;color:var(--ink)}
.mx td.tot,.mx th.toth{background:var(--bg-elevated);font-weight:700;color:var(--ink);border-left:2px solid var(--border-hot)}
.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#2e3947 var(--bg-base)}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track{background:var(--bg-base);border-radius:5px}
.scroll::-webkit-scrollbar-thumb{background:#2e3947;border-radius:5px;border:2px solid var(--bg-base)}
.scroll::-webkit-scrollbar-thumb:hover{background:#3d4a5c}.foot{text-align:center;color:var(--ink-4);font-size:11px;margin-top:28px}
.tag{font-size:9.5px;padding:2px 7px;border-radius:5px;background:rgba(245,158,11,.14);color:var(--warn);font-weight:600}
.tag.bad{background:rgba(244,63,94,.14);color:var(--dn)}
.note{font-size:11px;color:var(--ink-3);background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.lossbtn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:7px 13px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s}
.lossbtn:hover{color:var(--accent);border-color:var(--border-hot)}
.plan-inp{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;width:120px;font-variant-numeric:tabular-nums}
.plan-inp:focus{outline:none;border-color:var(--accent)}
.seg-anim{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--ease-out) both}
.line-anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease-out) forwards}
.dpath{cursor:pointer}.dpath:hover{opacity:1!important;filter:drop-shadow(0 0 8px currentColor)}
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid var(--border-hot);border-radius:9px;padding:9px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:280px}

#tip .qh{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 2px}
#tip .qh:first-child{margin-top:0}
#tip .qw{color:#22D3EE}#tip .qq{color:#F59E0B}#tip .qc{color:#10B981}
#tip .qb{white-space:normal;line-height:1.45}
#tip b{font-family:'Manrope'}#tip .tl{color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;padding:1px 0}#tip .tr span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
#tip .tip-tot{display:flex;justify-content:space-between;gap:20px;align-items:baseline;font-family:'Manrope';margin:3px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--border-hot)}
#tip .tip-tot span:first-child{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
#tip .tip-tot span:last-child{font-size:19px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.kbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:1000px){.kbox{grid-template-columns:1fr}}
.kstat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.kstat h5{font-family:'Manrope';font-weight:700;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kstat .row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border-soft)}
.kstat .row:last-child{border:0}.kstat .row b{font-variant-numeric:tabular-nums;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%}

.lf-bars{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.lf-bar{display:grid;grid-template-columns:210px 1fr 122px;align-items:center;gap:14px}
.lf-name{font-size:12.5px;color:var(--ink-2);text-align:right}
.lf-track{height:28px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.lf-fill{height:100%;border-radius:6px 0 0 6px;min-width:3px;transform-origin:left;animation:grow .85s var(--ease-out) both}
.lf-meta{display:flex;align-items:baseline;gap:8px}
.lf-val{font-family:'Manrope';font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lf-pct{font-size:12px;font-weight:700;color:var(--ink-3)}
.ro-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:22px}
.ro-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin:0 0 12px}
.ro-dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ro-donut{width:180px;flex:0 0 auto}
.ro-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px}
.ro-lg{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0}
.ro-lg .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.ro-lg .nm{flex:1;color:var(--ink)}
.ro-lg .vl{font-weight:700;color:var(--ink)}
.ro-lg .pc{color:var(--ink-3);font-size:11.5px;min-width:42px;text-align:right}
.ro-lg.hl{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);border-radius:9px;padding:6px 9px;margin:-2px 0}
.ro-lg.hl .nm{font-weight:700}
.ro-lg.dim{opacity:.58}
.ro-reason{display:flex;flex-direction:column;gap:10px}
.ro-badge{font-size:10px;font-weight:700;color:var(--dn);background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);border-radius:7px;padding:3px 8px;align-self:flex-start}
.ro-line{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ro-rank{font-size:11px;color:var(--ink-4);width:15px;text-align:right;font-variant-numeric:tabular-nums}
.ro-rname{font-size:12.5px;flex:0 0 auto;max-width:215px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.ro-track{flex:1;height:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:5px;overflow:hidden;min-width:40px}
.ro-fill{height:100%;background:linear-gradient(90deg,#FB7185,#F43F5E);border-radius:5px}
.ro-count{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.ro-rpct{font-size:11px;color:var(--ink-3);margin-left:6px;font-weight:600}
.note code{background:var(--bg-base);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--accent)}
@media(max-width:860px){.lf-bar{grid-template-columns:120px 1fr 92px;gap:9px}.ro-grid{grid-template-columns:1fr}}
.mg-list{display:flex;flex-direction:column;gap:9px}
.mg-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:11px}
.mg-name{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-track{height:20px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mg-bar{display:flex;height:100%;min-width:24px;border-radius:5px;overflow:hidden;transform-origin:left;animation:grow .8s var(--ease-out) both}
.mg-tot{font-size:13px;font-weight:800;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.ov2grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:stretch;margin-bottom:14px}
@media(max-width:1000px){.ov2grid{grid-template-columns:1fr}}
.ov2grid>.card{margin-bottom:0}
.cf{display:flex;flex-direction:column;gap:0;margin-top:6px}

function byManager(D,L){const names=[...new Set([...D.map(d=>d.mgr),...L.map(l=>l.mgr)])].filter(n=>isOP(n));
  // лиды/сделки - по дате создания (intake); успех/выручка/чек/потери - по дате ИСХОДА в периоде.

    const won=so.filter(d=>d.mgr===m),lst=lo.filter(d=>d.mgr===m);const rev=won.reduce((s,x)=>s+(x.budget||0),0);

// Блок «Дисциплина ведения сделок»: чистота заполнения карточек сделок/лидов.
// От неё зависит точность ВСЕХ цифр дашбордов: направление, клиент, ассортимент, бюджет,
// источник, причина отказа (для проигранных), карточка СП (для переданных в производство).
function disciplineBlock(){
  const _p0=x=>Math.round(x*100)+'%';
  const _inP=c=>c>=S.start&&c<=S.end;
  const Ds=flt(AD,true).filter(d=>d.created&&_inP(d.created));
  const Ls=flt(AL,false).filter(l=>l.created&&_inP(l.created));
  const linkedSP=new Set(((DATA.prodItems)||[]).map(i=>i.dealId).filter(Boolean));
  const hasSP=!!(DATA.prodItems&&DATA.prodItems.length);
  const dealChecks=d=>{const ch=[
    ['направление',d.dir!=='не указано'],
    ['тип клиента',d.client!=='нет данных'],
    ['ассортимент',d.assort!=='нет данных'],
    ['бюджет',(d.budget||0)>0],
    ['источник',!!d.source&&d.source!=='не указан'&&d.source!=='-'],
  ];
    if(d.lost)ch.push(['причина отказа',!!d.reason&&d.reason!=='не указана']);
    if(hasSP&&prodDate(d))ch.push(['карточка СП',linkedSP.has(String(d.id))]);
    return ch;};
  const leadChecks=l=>[['направление',l.dir!=='не указано'],['источник',!!l.source&&l.source!=='не указан']];
  let dF=0,dT=0,lF=0,lT=0,rzF=0,rzT=0,spF=0,spT=0;
  const perM={};
  Ds.forEach(d=>{const ch=dealChecks(d);const f=ch.filter(x=>x[1]).length;dF+=f;dT+=ch.length;
    const m=perM[d.mgr]=perM[d.mgr]||{n:d.mgr,dc:0,df:0,dt:0,lc:0,lf:0,lt:0,noRz:0,noSp:0,miss:0};
    m.dc++;m.df+=f;m.dt+=ch.length;if(f<ch.length)m.miss++;
    if(d.lost){rzT++;const ok=!!d.reason&&d.reason!=='не указана';if(ok)rzF++;else m.noRz++;}
    if(hasSP&&prodDate(d)){spT++;const ok=linkedSP.has(String(d.id));if(ok)spF++;else m.noSp++;}});
  Ls.forEach(l=>{const ch=leadChecks(l);const f=ch.filter(x=>x[1]).length;lF+=f;lT+=ch.length;
    const m=perM[l.mgr]=perM[l.mgr]||{n:l.mgr,dc:0,df:0,dt:0,lc:0,lf:0,lt:0,noRz:0,noSp:0,miss:0};

const ddiffJS=(a,b)=>{const t1=Date.parse(a),t2=Date.parse(b);return isNaN(t1)||isNaN(t2)?null:(t2-t1)/864e5;};
function funnelChart(){
  // Труба привязана к общему тумблеру «Период по»: дата создания -> когорта created,

  const inSet=d=>mode==='created'?(d.created>=S.start&&d.created<=S.end):(d.created<=S.end&&(!d.closed||d.closed>=S.start));
  const DD=flt(AD,true).filter(inSet);
  const ord={};FORDER.forEach((c,i)=>ord[c]=i);
  const reachedOrd=d=>{let mo=-1;const h=d.hist||[];for(const e of h){if(e[1]<=S.end&&ord[e[0]]!=null&&ord[e[0]]>mo)mo=ord[e[0]];}if(!h.length&&ord[d.stageCode]!=null)mo=ord[d.stageCode];if(d.won&&ord['C49:WON']>mo)mo=ord['C49:WON'];return mo;};
  const reached=DD.map(reachedOrd);
  const FUN=prepay
    ?[['Новая сделка','C49:NEW'],['Квалификация','C49:UC_LRFLH9'],['Формируется предложение','C49:PREPARATION'],['Предложение отправлено','C49:PREPAYMENT_INVOIC'],['Принимают решение','C49:3'],['Продажи (от предоплаты)','C49:EXECUTING']]
    :[['Новая сделка','C49:NEW'],['Квалификация','C49:UC_LRFLH9'],['Формируется предложение','C49:PREPARATION'],['Предложение отправлено','C49:PREPAYMENT_INVOIC'],['Принимают решение','C49:3'],['Предоплата','C49:EXECUTING'],['В производстве','C49:FINAL_INVOICE'],['В логистике','C49:2'],['Успешно','C49:WON']];
  const F=FUN.map(([name,code])=>{const th=ord[code];const sub=DD.filter((d,i)=>reached[i]>=th);
    const dws=[];DD.forEach(d=>{const h=d.hist||[];for(let k=0;k<h.length;k++){if(h[k][0]===code){const nxt=h[k+1]?h[k+1][1]:((d.won||d.lost)?d.closed:DATA.to);const dd=ddiffJS(h[k][1],nxt);if(dd!=null&&dd>=0)dws.push(dd);}}});
    return {name,count:sub.length,money:sub.reduce((s,d)=>s+(d.budget||0),0),dwell:median(dws)};});
  F.forEach((f,k)=>f.conv=k===0?1:(F[k-1].count?f.count/F[k-1].count:0));
  const n=F.length;
  const W=1380,H=384,bandH=200,midY=80+bandH/2,moneyY=H-46,pillY=H-32;
  const colW=W/n,nodeW=colW*0.5,maxC=F[0].count||1;

  const cx=i=>colW*i+colW/2,hOf=c=>Math.max(7,c/maxC*bandH),nodeX=i=>cx(i)-nodeW/2;
  const dwellCol=dl=>dl>=21?'#F43F5E':dl>=10?'#FB923C':'#10B981';

  for(let i=0;i<n-1;i++){const h0=hOf(F[i].count),h1=hOf(F[i+1].count),x0=nodeX(i)+nodeW,x1=nodeX(i+1);
    const t0=midY-h0/2,b0=midY+h0/2,t1=midY-h1/2,b1=midY+h1/2,gid='fc'+i;
    defs+=`<linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${COL[i%COL.length]}" stop-opacity=".45"/><stop offset="1" stop-color="${COL[(i+1)%COL.length]}" stop-opacity=".45"/></linearGradient>`;
    const td=dt(F[i].name+' → '+F[i+1].name,[['Конверсия',pct(F[i+1].conv)],['Прошло дальше',fmt(F[i+1].count)],['Отвалилось',fmt(F[i].count-F[i+1].count)]]).replace(/"/g,'&quot;');
    conns+=`<path d="M${x0} ${t0} L${x1} ${t1} L${x1} ${b1} L${x0} ${b0} Z" fill="url(#${gid})" data-tip="${td}"/>`;

    nodes+=`<rect class="seg-anim" style="animation-delay:${i*.06}s;transform-box:fill-box;transform-origin:center" x="${nodeX(i)}" y="${t}" width="${nodeW}" height="${h}" rx="5" fill="${c}" data-tip="${td}"/>`;

    const ws=f.name.split(' ');let l1=ws[0],l2='';for(let k=1;k<ws.length;k++){if((l1+' '+ws[k]).length<=15&&!l2)l1+=' '+ws[k];else l2+=(l2?' ':'')+ws[k];}
    labels+=`<text x="${cx(i)}" y="26" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink-2)">${l1}</text>`+(l2?`<text x="${cx(i)}" y="40" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink-2)">${l2}</text>`:'');
    labels+=`<text x="${cx(i)}" y="${moneyY}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">${fmtK(f.money)} ₽</text>`;
    if(f.dwell!=null){const dc=dwellCol(f.dwell);labels+=`<rect x="${cx(i)-30}" y="${pillY}" width="60" height="16" rx="8" fill="${dc}22" stroke="${dc}" stroke-opacity=".5"/><text x="${cx(i)}" y="${pillY+11.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${dc}" pointer-events="none">${d1(f.dwell)} дн</text>`;}});
  const subTxt=(mode==='created'?'когорта по дате создания в периоде':'активные на стадиях в периоде + новые')+' · '+(prepay?'продажи = от предоплаты':'успех = WON')+' · конверсия/сумма/медианный срок на этапе · режим задаётся тумблером «Период по» сверху';
  return `<div class="card"><div class="card-h"><div><div class="card-title">Воронка прохождения сделок (труба) ${info('Пилюля срока под этапом: зелёная - меньше 10 дней, оранжевая - 10-21, красная - дольше 21 дня. Накопительная воронка по дате создания: из сделок, созданных за период, сколько дошло (коснулось) каждого этапа. Пример: создано 276, до «Успешно» дошли 12 - это НЕ значит, что остальные в отказе: многие ещё в работе на промежуточных стадиях (длинный цикл). Вопрос: где сделки массово застревают или отваливаются между этапами. Вывод: этап с резким падением конверсии = узкое горло, туда внимание.')}</div><div class="card-sub">${subTxt}</div></div></div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:1000px">${defs?`<defs>${defs}</defs>`:''}${conns}${nodes}${labels}</svg></div>
    </div>`;
}

function dwellByStage(deals){
  const op=deals.filter(d=>!d.won&&!d.lost&&d.dwellCur!=null);
  const by={};op.forEach(d=>{(by[d.stage]=by[d.stage]||[]).push(d);});
  const rows=Object.entries(by).map(([st,xs])=>{const a=xs.map(x=>x.dwellCur).sort((p,q)=>p-q);const med=a.length?a[Math.floor(a.length/2)]:0;const nt=xs.filter(x=>(x.touchReal||0)===0).length;return {st,med,n:xs.length,nt,code:xs[0].stageCode};});
  // позиции этапов зафиксированы порядком воронки; вкладки меняют МЕТРИКУ полосы, не порядок
  rows.sort((a,b)=>((FORDER.indexOf(a.code)+1||99)-(FORDER.indexOf(b.code)+1||99)));
  if(!rows.length)return '<div class="card-sub">нет открытых сделок</div>';

    const inside=+w>=30;const _lab=_dm==='count'?fmt(r.n)+' сд':d1(r.med)+' дн';
    return `<div class="fbar"><div class="fl" data-tip="${esc(r.st)}">${r.st}</div><div class="ft" data-tip="${td}" style="display:flex;align-items:center"><div style="height:100%;flex:0 0 ${w}%;min-width:6px;background:${c};border-radius:6px;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow .8s var(--ease-out) both">${inside?_lab:''}</div>${inside?'':`<span style="flex:0 0 auto;margin-left:7px;font-size:11px;font-weight:800;color:${c};white-space:nowrap">${_lab}</span>`}</div><div style="width:140px;font-size:10.5px;color:var(--ink-3);text-align:right">${fmt(r.n)} сд · <span style="color:#CC5867">${fmt(r.nt)} без кас.</span></div></div>`;}).join('')+'</div>';

// Сегментированные столбцы по этапам: высота = деньги (или сделки), сегменты по сроку
// (свежие <14д / тёплые 14-30д / застрявшие >30д). Видно где заперт пайплайн И что протухает.
function dwellStageChart(deals){
  const stages=['Из Взят в работу/Квалифицирован','Расчёт','КП отправлено','Принимают решение','Долгострой'];
  const lab={'Из Взят в работу/Квалифицирован':'Квал','Расчёт':'Расчёт','КП отправлено':'КП','Принимают решение':'Решение','Долгострой':'Долгострой'};
  const op=deals.filter(d=>!d.won&&!d.lost&&d.dwellCur!=null&&isOP(d.mgr)&&stages.includes(d.stage));
  if(!op.length)return '';
  const med=xs=>{if(!xs.length)return null;const a=xs.map(x=>x.dwellCur).sort((p,q)=>p-q);return a[Math.floor(a.length/2)];};
  const metric=S.dhMetric||'term';const isSeg=(metric!=='term');
  const cO=d=>d==null?'#3F4855':d>=35?'#B0414F':d>=21?'#CC5867':d>=10?'#C2873C':'#2E9E74';
  const BUCK=[['свежие · до 14 дн',d=>d<14,'#2E9E74'],['тёплые · 14-30 дн',d=>d>=14&&d<30,'#C2873C'],['застряли · 30+ дн',d=>d>=30,'#CC5867']];
  const vOf=xs=>metric==='money'?xs.reduce((s,x)=>s+(x.budget||0),0):xs.length;
  const data=stages.map(st=>{const xs=op.filter(d=>d.stage===st);const md=med(xs);
    const segs=BUCK.map(([lbl,f,c])=>{const sub=xs.filter(x=>f(x.dwellCur));return {lbl,c,v:vOf(sub),n:sub.length,money:sub.reduce((s,x)=>s+(x.budget||0),0)};});
    const money=xs.reduce((s,x)=>s+(x.budget||0),0),nAll=xs.length,stuck=xs.filter(x=>x.dwellCur>=30);
    const total=metric==='term'?(md||0):vOf(xs);

  const cumSeg=`<div class="seg" id="dhCumSeg" style="display:inline-flex;vertical-align:middle;transform:scale(.85);transform-origin:left"><button data-dc="cum" class="${cumMode?'on':''}">накопительно</button><button data-dc="per" class="${!cumMode?'on':''}">по периодам</button></div>`;

  const right=`<div><div class="card-t" style="font-size:12.5px">Конверсия в успех по менеджерам ${info('Успех ÷ портфель «в работе» на конец (снимок открытых офферов): какая доля портфеля стала успехом за период. По отделу и по каждому менеджеру (его портфель). Это снимок за период; график ниже - та же метрика во времени. Пунктир - отдел. Кто левее/ниже (красный) - тянет вниз. Клик по менеджеру выделяет его линию в динамике.')}</div><div class="card-sub" style="margin-bottom:6px">успех ÷ портфель «в работе» · отдел <b style="color:#A78BFA">${pct(crDept)}</b> (${fmt(suc)}/${fmt(wip)}) · <span style="color:#A78BFA">┊</span> = отдел · клик - линия в динамике</div>${crBars||'<div class="card-sub">нет данных</div>'}${dynChart}</div>`;
  return `<div class="card"><div class="card-h"><div><div class="card-title">Здоровье отдела продаж ${info('Баланс входа (новые офферы) и выхода (успех + отказ) за период - показатель здоровья отдела. Выход = предоплата (успех) плюс отказ, ушедший НЕПОСРЕДСТВЕННО с 3 оффер-этапов (КП/Решение/Долгострой); отвалившиеся раньше по воронке в отказ тут не считаются. Вход>выход - копится, менеджеры распыляются, растут отказы (поднимать эффективность). Вход<выход - воронка тает (маркетингу больше лидов). Вход≈выход - здоровый режим. План выхода - 1 успех на 3 отказа (25% успех / 75% отказ); падение доли успеха ниже 25% - сигнал по качеству. Линза периода: рабочая 30 дн (≈2× медианы цикла ~13 дн), контрольная 60 дн (ловит хвост p90 ~51 дн); окно короче 14 дн искажает баланс - выход не успевает закрыться. Справа - конверсия в успех по менеджерам против отдела: кто ниже пунктира, тянет вниз. Вопрос: отдел копит пайплайн, тает или в балансе и держит ли долю успеха. Вывод: вход больше выхода - поднимай эффективность и режь распыление; вход меньше выхода - проси у маркетинга лидов; успех ниже 25% - разбирай качество отработки.')}</div><div class="card-sub">баланс потока · выход 25/75 · конверсия по менеджерам - сигналы РОПу &nbsp;${lensBadge}</div></div></div><div class="grid2" style="align-items:start;gap:18px">${left}${right}</div></div>`;
}

}

// ===== ПРОВЕРКА ЗАПОЛНЕНИЯ: проблемные сделки (пропуски в CRM) =====
// Сделки, дошедшие до оффера, у которых не заполнено важное поле: причина отказа
// (для отказных), категория (ассортимент), тип клиента, либо бюджет 0/1 (при
// отправленном КП цена должна быть выше). Сортируемая таблица по столбцам.
function dataQualityBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  const eCat=d=>{const a=d.assort;return !a||a==="нет данных"||a==="не указана";};
  const eCli=d=>{const c=d.client;return !c||c==="нет данных"||c==="не указан";};
  const eRsn=d=>d.lost&&(!d.reason||d.reason==="не указана");
  const PRICED=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:EXECUTING","C49:FINAL_INVOICE","C49:1","C49:2","C49:WON"]);
  const eBud=d=>PRICED.has(d.stageCode)&&(d.budget||0)<=1; // цена обязательна только с «КП отправлено» и дальше; на «Формирование ТЗ»/«Долгострой» пустая цена - норма, не дыра
  const nP=d=>(eCat(d)?1:0)+(eCli(d)?1:0)+(eBud(d)?1:0);
  const rows=passed.filter(d=>!d.lost&&nP(d)>0);
  const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const _info=info('Сделки, дошедшие до предложения, у которых в CRM не заполнено важное: причина отказа (для отказных), категория (ассортимент), тип клиента, либо бюджет 0/1 - при отправленном КП цена должна быть выше 1. Вопрос: где дыры в данных, из-за которых статистика неполная? Вывод: заполни пропуски (красное «нет»), иначе отчёты врут; клик по заголовку столбца - сортировка.');
  if(!rows.length)return `<div class="card" id="dqfix"><div class="card-h"><div><div class="card-title">Сделки для исправления ${_info}</div></div></div><div style="text-align:center;padding:28px 16px"><div style="font-size:42px;line-height:1">🎉</div><div style="font-family:'Manrope';font-weight:800;font-size:17px;color:#2E9E74;margin-top:8px">В CRM порядок - все сделки заполнены</div><div style="font-size:12px;color:var(--ink-3);margin-top:5px;max-width:460px;margin-left:auto;margin-right:auto;line-height:1.5">Причина отказа, категория, тип клиента и бюджет проставлены везде. Отличная дисциплина ведения сделок - так держать!</div></div></div>`;
  const cRsn=rows.filter(eRsn).length,cCat=rows.filter(eCat).length,cCli=rows.filter(eCli).length,cBud=rows.filter(eBud).length;
  if(!S.dqSort)S.dqSort={k:'cnt',a:false};
  const sk=S.dqSort.k,sa=S.dqSort.a?1:-1;
  const sv={id:d=>+d.id||0,stage:d=>d.stage||'',bud:d=>d.budget||0,cat:d=>eCat(d)?0:1,cli:d=>eCli(d)?0:1,rsn:d=>eRsn(d)?0:1,cnt:d=>nP(d)};
  const sorted=rows.slice().sort((a,b)=>{const x=sv[sk](a),y=sv[sk](b);return (x>y?1:x<y?-1:0)*sa;});
  const th=(k,lab,al)=>`<th data-dqsort="${k}" style="cursor:pointer;text-align:${al||'center'};white-space:nowrap${S.dqSort.k===k?';color:#22D3EE':''}">${lab}${S.dqSort.k===k?(sa>0?' ▲':' ▼'):''}</th>`;
  const miss=(bad,val)=>`<td style="text-align:center;${bad?'color:#F8717A;font-weight:700':'color:var(--ink-3)'}">${bad?'нет':esc(val||'')}</td>`;
  const body=sorted.slice(0,300).map(d=>`<tr>`+

    `<td style="text-align:left;color:var(--ink-3);font-size:11px;white-space:nowrap">${esc(d.stage||'')}</td>`+
    miss(eCat(d),d.assort)+miss(eCli(d),d.client)+
    `<td style="text-align:center;${eBud(d)?'color:#F8717A;font-weight:700':''}">${fmtK(d.budget||0)}</td>`+
    `<td style="text-align:center;font-weight:800;color:${nP(d)>=2?'#CC5867':'#C2873C'}">${nP(d)}</td>`+

  return `<div class="card" id="dqfix"><div class="card-h"><div><div class="card-title">Сделки для исправления ${_info}</div><div class="card-sub">Сделки, где в карточке не хватает данных для точной аналитики</div></div></div><div class="scroll" style="max-height:440px;margin-top:6px"><table class="tbl"><thead><tr>${th('id','Сделка')}${th('stage','Стадия','left')}${th('cat','Категория')}${th('cli','Клиент')}${th('bud','Бюджет')}${th('cnt','Проблем')}</tr></thead><tbody>${body}</tbody></table></div></div>`;

// ===== ДИСЦИПЛИНА ДЕЛ И СВЯЗЬ С КЛИЕНТОМ (личный блок менеджера) =====
// У каждой открытой сделки должно быть запланированное дело, и после дела - реальное касание
// (звонок/письмо/мессенджер). Показываем по СВОИМ открытым сделкам: состояние дела
// (нет дела/просрочено/припарковано/в работе), последнее реальное касание и метку «без связи»
// (дело есть, а касания за 90 дней не было). Плюс свои каналы коммуникации.
function myTaskDisciplineBlock(){
  const PD2=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const now=NOWD.getTime(), PARK=30;
  const open=(AD||[]).filter(d=>!d.won&&!d.lost&&d.stageCode!=='C49:UC_8JTBV2');
  if(!open.length) return '';
  // Пост-продажные стадии (в производстве / логистике / монтаже) = состояние «на контроле» (синий):
  // продажа состоялась, деньги в кассе, дальше идёт сопровождение сроков, а не продажа. Просрочку
  // дела здесь НЕ считаем проблемой дисциплины и не гоним в счётчики риска и в челлендж - менеджеру
  // не за что отвлекаться, но сделки остаются видны в таблице отдельным синим фильтром.
  const cls=d=>{if(PROD_STAGES.includes(d.stageCode))return 'ctrl';if(!d.taskDue)return 'none';const dy=Math.round((PD2(d.taskDue).getTime()-now)/DAYMS);return dy<0?'over':dy>PARK?'park':'ok';};
  const COL={none:'#8794A5',over:'#CC5867',park:'#C2873C',ok:'#2E9E74',ctrl:'#38BDF8'};
  const LBL={none:'нет дела',over:'просрочено',park:'припарковано',ok:'в работе',ctrl:'на контроле'};
  const noLink=d=>d.taskDue&&!d.lastTouch&&cls(d)!=='ctrl';
  let tN=0,tNone=0,tOver=0,tPark=0,tOk=0,tCtrl=0,tNoLink=0,tRisk=0;
  open.forEach(d=>{const c=cls(d);tN++;if(c==='none')tNone++;else if(c==='over')tOver++;else if(c==='park')tPark++;else if(c==='ctrl')tCtrl++;else tOk++;if(c!=='ok'&&c!=='ctrl')tRisk+=(d.budget||0);if(noLink(d))tNoLink++;});
  const tProb=tNone+tOver+tPark, preN=tN-tCtrl;
  const CHC={call:'#3DAEC2',msg:'#2E9E74',email:'#C2873C'};
  const CH=DATA.channelMix||null, myCh=CH?CH[MANAGER]:null;
  const chS=(()=>{if(!myCh)return null;const call=(myCh.call_in||0)+(myCh.call_out||0),msg=(myCh.msg_in||0)+(myCh.msg_out||0),email=(myCh.email_in||0)+(myCh.email_out||0);const tot=call+msg+email;if(!tot)return null;const lead=call>=msg&&call>=email?'звонки':msg>=email?'мессенджеры':'почта';return {call,msg,email,tot,lead};})();
  // структура портфеля по состоянию дел
  const sg=(v,c,lab)=>v?`<div title="${lab}: ${v}" style="height:100%;width:${(v/tN*100).toFixed(2)}%;background:${c};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.92)">${(v/tN>=0.05)?v:''}</div>`:'';
  const bar=`<div style="display:flex;height:18px;border-radius:6px;overflow:hidden;border:1px solid var(--border)">${sg(tOver,COL.over,'просрочено')}${sg(tNone,COL.none,'нет дела')}${sg(tPark,COL.park,'припарковано')}${sg(tOk,COL.ok,'в работе')}${sg(tCtrl,COL.ctrl,'на контроле')}</div>`;
  const leg=[['over',tOver],['none',tNone],['park',tPark],['ok',tOk],['ctrl',tCtrl]].filter(([,v])=>v).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)"><i style="width:9px;height:9px;border-radius:2px;background:${COL[k]};display:inline-block"></i>${LBL[k]} <b style="color:var(--ink-2)">${v}</b></span>`).join('<span style="color:var(--ink-4)">·</span>');
  // мой канальный микс
  const chBar=chS?(()=>{const s2=(v,c)=>v?`<div style="height:100%;width:${(v/chS.tot*100).toFixed(2)}%;background:${c}"></div>`:'';return `<div style="margin-top:10px"><div class="card-sub" style="margin-bottom:4px">Мои каналы за 90 дней · чаще: <b style="color:var(--ink-2)">${chS.lead}</b> · звонки ${chS.call} · письма ${chS.email} · мессенджеры ${chS.msg}</div><div style="display:flex;height:14px;border-radius:5px;overflow:hidden;border:1px solid var(--border)">${s2(chS.call,CHC.call)}${s2(chS.msg,CHC.msg)}${s2(chS.email,CHC.email)}</div></div>`;})():(CH?'':'<div class="card-sub" style="margin-top:8px">Каналы коммуникации готовятся из Bitrix.</div>');
  // фильтр-чипы
  const seg=S.mtdProb||'every';
  const chip=(k,lab,n,col)=>{const on=seg===k;return `<span data-mtdprob="${k}" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:11px;white-space:nowrap;border:1px solid ${on?col:'var(--border)'};background:${on?col+'22':'transparent'};color:${on?col:'var(--ink-3)'}">${lab} <b>${n}</b></span>`;};
  const chips=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px">${chip('every','Все',open.length,'#8794A5')}${chip('all','Все проблемные',tProb,'#22D3EE')}${chip('over','Просрочено',tOver,COL.over)}${chip('none','Без дела',tNone,COL.none)}${chip('nolink','Без связи',tNoLink,'#CC5867')}${tCtrl?chip('ctrl','На контроле',tCtrl,COL.ctrl):''}</div>`;
  // список сделок
  const portal=DATA.b24Portal||'',dlc=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const dueCell=d=>{const c=cls(d);if(!d.taskDue)return c==='ctrl'?'<span style="color:var(--ink-4)">—</span>':'<span style="color:#8794A5">нет дела</span>';const dy=Math.round((PD2(d.taskDue).getTime()-now)/DAYMS);const dd=d.taskDue.slice(8,10)+'.'+d.taskDue.slice(5,7)+'.'+d.taskDue.slice(0,4);const suf=c==='ctrl'?(dy<0?`план ${-dy} дн назад`:`план через ${dy} дн`):(dy<0?`просрочено на ${-dy} дн`:`через ${dy} дн`);return `<span style="color:${COL[c]};font-weight:700">${dd}</span> <span style="color:var(--ink-4);font-size:10px">${suf}</span>`;};
  const touchCell=(d,ctrl)=>{if(!d.lastTouch)return ctrl?'<span style="color:var(--ink-4)">—</span>':'<span style="color:#CC5867;font-weight:700">касаний нет</span> <span style="color:var(--ink-4);font-size:10px">90+ дн</span>';const dy=Math.round((now-PD2(d.lastTouch).getTime())/DAYMS);const col=dy<=7?'#2E9E74':dy<=30?'#C2873C':'#CC5867';const dd=d.lastTouch.slice(8,10)+'.'+d.lastTouch.slice(5,7);return `<span style="color:${col};font-weight:700">${dy} дн назад</span> <span style="color:var(--ink-4);font-size:10px">${dd}</span>`;};
  const ordC={over:0,none:1,park:2,ctrl:3,ok:4};
  let ds=open.filter(d=>{const c=cls(d);return c!=='ok'&&c!=='ctrl';});
  if(seg==='over')ds=open.filter(d=>cls(d)==='over');else if(seg==='none')ds=open.filter(d=>cls(d)==='none');else if(seg==='park')ds=open.filter(d=>cls(d)==='park');else if(seg==='ctrl')ds=open.filter(d=>cls(d)==='ctrl');else if(seg==='nolink')ds=open.filter(noLink);else if(seg==='every')ds=open.slice();
  ds.sort((a,b)=>ordC[cls(a)]-ordC[cls(b)]||(b.budget||0)-(a.budget||0));
  const body=ds.slice(0,300).map(d=>{const c=cls(d);return `<tr><td style="text-align:center">${dlc(d.id)}</td><td style="text-align:left;font-size:11px;color:var(--ink-3);white-space:nowrap">${esc(d.stage||'')}</td><td style="text-align:center"><span style="font-size:10px;font-weight:700;color:${COL[c]}">${LBL[c]}</span></td><td style="text-align:left;font-size:11px;color:var(--ink-2)">${d.taskSubj?esc(d.taskSubj):'<span style="color:var(--ink-4)">-</span>'}</td><td style="text-align:center;font-size:11px;white-space:nowrap">${dueCell(d)}</td><td style="text-align:center;font-size:11px;white-space:nowrap">${touchCell(d,c==='ctrl')}</td><td style="text-align:right;font-size:11px">${fmtK(d.budget||0)}</td></tr>`;}).join('')||`<tr><td colspan="7" style="text-align:center;color:var(--ink-4);padding:14px">по этому фильтру сделок нет</td></tr>`;
  const _info=info('Все открытые сделки по состоянию запланированного дела. Что на полосе: 🔴 просрочено (срок дела прошёл), ⚪ нет дела, 🟠 припарковано (дело отодвинуто дальше 30 дней, сделкой не занимаются), 🟢 в работе (дело на ближайший месяц), 🔵 на контроле (сделка продана и в производстве, дожимать нечего). После дела в сделке должно быть реальное касание клиента (звонок Манго, письмо, мессенджер); метка «без связи» значит, что дело есть, а контакта нет 90 дней. Долгострой вынесен в соседнюю вкладку. Вопрос: по каким сделкам нет следующего шага или менеджер давно не выходил на связь? Вывод: красные 🔴 и ⚪ - поставь дело и позвони; «без связи» - контакта нет 90 дней, это имитация работы; срок дела двигай только после реального касания.');
  const _ctrlSub=tCtrl?` · <span style="color:#38BDF8;font-weight:700">${tCtrl} на контроле</span>`:'';
  return `<div class="card" id="mytaskdisc"><div class="card-h"><div><div class="card-title">Дисциплина дел и связь с клиентом ${_info}</div><div class="card-sub">Все открытые сделки: есть ли запланированное дело и связь с клиентом</div></div></div>

// ===== ДОЛГОСТРОЙ: постановка дел и коммуникация (только stageCode C49:UC_8JTBV2) =====
// Мягкое правило: касание важно ТОЛЬКО когда дело наступило. Долгострой - сделки, которые
// сознательно ждут решения клиента; нормально поставить дело на будущее и не трогать до срока.
// Проверяем постановку дела: если дело НАСТУПИЛО (срок прошёл) - была ли коммуникация (касание
// в день дела или позже). Если дело стоит на будущее и касаний нет - это норма. Долгострой
// исключён из основного блока «Дисциплина дел», чтобы не судить его строгим правилом дважды.
function myLongbuildBlock(){
  const PD2=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const now=NOWD.getTime();
  const open=(AD||[]).filter(d=>!d.won&&!d.lost&&d.stageCode==='C49:UC_8JTBV2');
  if(!open.length) return '';
  // wait - срок сегодня/в будущем (ждём, связь пока не нужна); done - дело наступило (просрочено)
  // и была коммуникация в день дела или позже; due - дело наступило, коммуникации не было (проблема);
  // none - дела нет вовсе (постановка не сделана, проблема).
  const cls=d=>{if(!d.taskDue)return 'none';const dy=Math.round((PD2(d.taskDue).getTime()-now)/DAYMS);if(dy>=0)return 'wait';return (d.lastTouch&&d.lastTouch.slice(0,10)>=d.taskDue.slice(0,10))?'done':'due';};
  const COL={wait:'#38BDF8',done:'#2E9E74',due:'#CC5867',none:'#C2873C'};
  const LBL={wait:'ждёт срока',done:'отработано',due:'наступило, без связи',none:'нет дела'};
  let tN=0,tWait=0,tDone=0,tDue=0,tNone=0,tProbM=0;
  open.forEach(d=>{const c=cls(d);tN++;if(c==='wait')tWait++;else if(c==='done')tDone++;else if(c==='due')tDue++;else tNone++;if(c==='due'||c==='none')tProbM+=(d.budget||0);});
  const tProb=tDue+tNone;
  const _info=info('Только сделки на стадии «Долгострой» - они сознательно ждут решения клиента, поэтому правило мягче: касание важно ТОЛЬКО когда наступил срок дела. Что на полосе: 🔴 наступило, без связи (срок дела прошёл, а контакта не было - проблема), 🟠 нет дела (постановка не сделана), 🔵 ждёт срока (дело стоит на будущее, касаний пока не нужно - это норма), 🟢 отработано (дело наступило и был контакт). Вопрос: по каким долгостроям наступил срок, а менеджер не вышел на связь? Вывод: красные 🔴 и 🟠 брать в работу сегодня; 🔵 «ждёт срока» не трогать, всё по плану.');
  const sg=(v,c,lab)=>v?`<div title="${lab}: ${v}" style="height:100%;width:${(v/tN*100).toFixed(2)}%;background:${c};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.92)">${(v/tN>=0.05)?v:''}</div>`:'';
  const bar=`<div style="display:flex;height:18px;border-radius:6px;overflow:hidden;border:1px solid var(--border)">${sg(tDue,COL.due,'наступило, без связи')}${sg(tNone,COL.none,'нет дела')}${sg(tWait,COL.wait,'ждёт срока')}${sg(tDone,COL.done,'отработано')}</div>`;
  const leg=[['due',tDue],['none',tNone],['wait',tWait],['done',tDone]].filter(([,v])=>v).map(([k,v])=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)"><i style="width:9px;height:9px;border-radius:2px;background:${COL[k]};display:inline-block"></i>${LBL[k]} <b style="color:var(--ink-2)">${v}</b></span>`).join('<span style="color:var(--ink-4)">·</span>');
  const seg=S.lbSeg||'all';
  const chip=(k,lab,n,col)=>{const on=seg===k;return `<span data-lbseg="${k}" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:11px;white-space:nowrap;border:1px solid ${on?col:'var(--border)'};background:${on?col+'22':'transparent'};color:${on?col:'var(--ink-3)'}">${lab} <b>${n}</b></span>`;};
  const chips=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px">${chip('all','Все',tN,'#8794A5')}${chip('prob','Требуют действия',tProb,'#22D3EE')}${chip('due','Наступило, без связи',tDue,COL.due)}${chip('none','Без дела',tNone,COL.none)}${chip('wait','Ждёт срока',tWait,COL.wait)}${chip('done','Отработано',tDone,COL.done)}</div>`;
  const portal=DATA.b24Portal||'',dlc=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const dueCell=d=>{if(!d.taskDue)return '<span style="color:#C2873C;font-weight:700">нет дела</span>';const dy=Math.round((PD2(d.taskDue).getTime()-now)/DAYMS);const dd=d.taskDue.slice(8,10)+'.'+d.taskDue.slice(5,7)+'.'+d.taskDue.slice(0,4);const c=cls(d),col=c==='wait'?'#38BDF8':c==='done'?'#2E9E74':'#CC5867';const suf=dy>0?`через ${dy} дн`:dy===0?'сегодня':`наступило ${-dy} дн назад`;return `<span style="color:${col};font-weight:700">${dd}</span> <span style="color:var(--ink-4);font-size:10px">${suf}</span>`;};
  const touchCell=d=>{if(!d.lastTouch)return '<span style="color:#CC5867;font-weight:700">касаний нет</span>';const dy=Math.round((now-PD2(d.lastTouch).getTime())/DAYMS);const col=dy<=7?'#2E9E74':dy<=30?'#C2873C':'#CC5867';const dd=d.lastTouch.slice(8,10)+'.'+d.lastTouch.slice(5,7);return `<span style="color:${col};font-weight:700">${dy} дн назад</span> <span style="color:var(--ink-4);font-size:10px">${dd}</span>`;};
  const ordC={due:0,none:1,wait:2,done:3};
  let ds=seg==='all'?open.slice():seg==='prob'?open.filter(d=>{const c=cls(d);return c==='due'||c==='none';}):open.filter(d=>cls(d)===seg);
  ds.sort((a,b)=>ordC[cls(a)]-ordC[cls(b)]||(b.budget||0)-(a.budget||0));
  const body=ds.slice(0,300).map(d=>{const c=cls(d);return `<tr><td style="text-align:center">${dlc(d.id)}</td><td style="text-align:center"><span style="font-size:10px;font-weight:700;color:${COL[c]}">${LBL[c]}</span></td><td style="text-align:left;font-size:11px;color:var(--ink-2)">${d.taskSubj?esc(d.taskSubj):'<span style="color:var(--ink-4)">-</span>'}</td><td style="text-align:center;font-size:11px;white-space:nowrap">${dueCell(d)}</td><td style="text-align:center;font-size:11px;white-space:nowrap">${touchCell(d)}</td><td style="text-align:right;font-size:11px">${fmtK(d.budget||0)}</td></tr>`;}).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--ink-4);padding:14px">по этому фильтру сделок нет</td></tr>`;
  return `<div class="card" id="mylongbuild"><div class="card-h"><div><div class="card-title">Долгострой: постановка дел и коммуникация ${_info}</div><div class="card-sub">Сделки на Долгострое: наступило ли дело и была ли связь</div></div></div>
    <div style="margin:8px 0 4px">${bar}</div>${chips}
    <div class="scroll" style="max-height:460px;margin-top:6px"><table class="tbl"><thead><tr><th style="text-align:center">Сделка</th><th style="text-align:center">Состояние</th><th style="text-align:left">Ближайшее дело</th><th style="text-align:center">Срок дела</th><th style="text-align:center">Последнее касание</th><th style="text-align:right">Бюджет</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

// ===== ОБЪЕДИНЁННЫЙ ВИДЖЕТ: переключатель Дисциплина дел / Долгострой =====
// Оба блока - таблицы открытых сделок с чипами-состояниями. Объединены в одну карточку с
// вкладками сверху, чтобы не растягивать дашборд и не путать менеджера двумя похожими блоками.
function myTaskCombinedBlock(){
  const view=S.taskView||'disc';
  const tab=(k,lab)=>`<button data-taskview="${k}" style="background:${view===k?'var(--accent-soft)':'transparent'};color:${view===k?'var(--accent)':'var(--ink-3)'};border:0;font:inherit;font-size:12.5px;font-weight:700;padding:7px 16px;cursor:pointer;border-radius:7px;white-space:nowrap;transition:.15s">${lab}</button>`;
  const tabs=`<div class="seg" style="display:inline-flex;margin-bottom:10px">${tab('disc','Дисциплина дел')}${tab('longbuild','Долгострой')}</div>`;
  return `<div>${tabs}${view==='disc'?myTaskDisciplineBlock():myLongbuildBlock()}</div>`;
}

// ===== ЧЕЛЛЕНДЖ «Дисциплина дел»: ТОП-3 менеджеров по доле живых сделок (дело + касание) =====
// Считаем по всему отделу (ALL_DEALS), не по фильтру - рейтинг общий. Метрика: доля
// чистых сделок среди дошедших до предложения. Виджет в правом углу, кнопка ведёт к #dqfix.
function priorityDealsBlock(){
  // Только сделки со СДЕЛАННЫМ предложением (КП направлено): КП/счёт, Принимают решение, Долгострой.
  // Ранние стадии (Расчёт, Формирование ТЗ) - без КП - в приоритет к предоплате не идут.
  // Лесенка близости к предоплате (не историческая вероятность, а «насколько дожата»):
  // 1.0 = предоплата уже получена (в списке не показываем), поэтому максимум 0.9. Порядок стадий
  // воронки C49: КП отправлено -> Принимают решение -> [Предоплата]. Долгострой = застрявшая сделка.
  const HOT={"C49:PREPAYMENT_INVOIC":["КП отправлено",0.55],"C49:3":["Принимают решение",0.75],"C49:UC_8JTBV2":["Долгострой",0.30]};
  const MINE=(AD||[]).filter(d=>!d.won&&!d.lost&&HOT[d.stageCode]);
  const _info=info('Очередь сделок к предоплате: сверху те, что дожимать первым, чтобы быстрее получить деньги. Оценка (0..0.9) - насколько сделка близка к предоплате: 0.9 = клиент принимает решение и ждёт нас (на пороге), пониже - КП отправлено, внизу - застряла или без переписки; единицу не показываем, это уже полученная предоплата. Мяч показывает, чей ход: у нас (клиент ждёт наш ответ - горячо), ждём клиента, нет связи. Приоритет = ожидаемая касса (бюджет × оценка): крупная и близкая сделка выше. Стадии - из воронки Bitrix «GG Заказы РФ», только сделки с направленным КП. «О чём договорились» - выжимка переписки из Bitrix. Вопрос: какие сделки дожимать первыми, чтобы закрыть предоплату сегодня. Вывод: работай сверху вниз, начиная с тех, где мяч у нас; наведи на номер приоритета - покажет, почему сделка тут; красный «Срок ожидания» - клиент давно без ответа, теряем.');
  if(!MINE.length)return `<div class="card" id="prio"><div class="card-h"><div><div class="card-title">Приоритет к предоплате ${_info}</div></div></div><div style="text-align:center;padding:24px;color:var(--ink-3)">Нет открытых сделок на стадиях до предоплаты.</div></div>`;
  const DLG=DATA.dialog||{};
  const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:(''+id);
  const cliV=d=>{const c=d.client;return (!c||c==="нет данных"||c==="не указан")?'—':String(c).replace(/^Конечный клиент\s*/i,'');};
  const catV=d=>{const a=d.assort;return (!a||a==="нет данных"||a==="не указана")?'—':a;};
  // Оценка = близость к предоплате: база стадии × сигнал коммуникации. Мяч у нас -> к 0.9; тишина/нет связи -> вниз.
  const scoreOf=d=>{const base=HOT[d.stageCode][1];const c=DLG[d.id]||{ball:'none'};let f;if(c.ball==='us')f=1.2;else if(c.ball==='client')f=(c.silent==null?0.9:c.silent<=7?1.0:c.silent<=21?0.8:0.55);else if(c.ball==='unk')f=0.7;else f=0.4;return Math.min(0.9,base*f);};
  const ballTxt=c=>(!c||c.ball==='none')?'⚪ нет связи':c.ball==='us'?'🔵 мяч у нас':c.ball==='client'?'⏳ ждём клиента':'⚪ внутр.';
  const ballRank=c=>(!c||c.ball==='none')?0:c.ball==='us'?3:c.ball==='client'?2:1;
  const rows=MINE.map(d=>{const c=DLG[d.id]||{ball:'none'};return {d,c,score:scoreOf(d),bud:d.budget||0,silent:(c.silent==null?9999:c.silent)};});
  rows.sort((a,b)=>(b.bud*b.score)-(a.bud*a.score)||ballRank(b.c)-ballRank(a.c)||b.score-a.score);
  rows.forEach((r,i)=>r.prio=i+1);
  if(!S.prioSort)S.prioSort={k:'prio',a:true};
  const sk=S.prioSort.k,sa=S.prioSort.a?1:-1;
  const sv={prio:r=>r.prio,score:r=>-r.score,ball:r=>-ballRank(r.c),bud:r=>-r.bud,cat:r=>catV(r.d),cli:r=>cliV(r.d),stage:r=>HOT[r.d.stageCode][0],silent:r=>r.silent};
  const sorted=rows.slice().sort((a,b)=>{const x=sv[sk](a),y=sv[sk](b);return (x>y?1:x<y?-1:0)*sa;});
  const th=(k,lab,al)=>`<th data-priosort="${k}" style="cursor:pointer;text-align:${al||'center'};white-space:nowrap${S.prioSort.k===k?';color:#22D3EE':''}">${lab}${S.prioSort.k===k?(sa>0?' ▲':' ▼'):''}</th>`;
  const scoreCol=s=>s>=0.5?'#2E9E74':s>=0.3?'#C2873C':'#CC5867';
  // Срок ожидания (дней без ответа): 1-2 зелёный, 3-6 жёлтый, от 7 краснее с ростом.
  const silCol=n=>n==null?'var(--ink-4)':n<=2?'#2E9E74':n<=6?'#D9A441':n<=13?'#E0776F':n<=20?'#D14F42':'#B83227';
  // Почему сделка на этом месте - словами, без формул (всплывает на номере приоритета).
  const whyText=r=>{const c=r.c,snm=HOT[r.d.stageCode][0],big=r.bud>=400000;
    if(c.ball==='us')return 'Мяч у нас: клиент написал последним и ждёт ответ на стадии «'+snm+'»'+(big?', сделка крупная':'')+'. Ответь и дожми - это самая быстрая касса.';
    if(c.ball==='client')return 'Ход за клиентом (мы написали последними)'+(c.silent!=null&&c.silent>7?', молчит '+c.silent+' дн - напомни о себе':'')+'. Стадия «'+snm+'».';
    return 'Переписки в системе нет'+(big?', а сделка крупная ('+fmtK(r.bud)+')':'')+'. Оживи звонком или закрой в отказ, чтобы не висела мёртвой.';};
  // Дела и сроки: ближайшее запланированное дело + дата. Красным, если срок нарушен (дело просрочено).
  const _dmy=s=>{const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'.'+p[1]:'';};
  const taskCell=d=>{const due=d.taskDue?String(d.taskDue).slice(0,10):null,subj=(d.taskSubj||'').trim();
    if(!due&&!subj)return '<span style="color:#F8717A;font-size:11px" data-tip="нет запланированного дела - поставь задачу в Bitrix">⚠ нет дела</span>';
    const overdue=due&&due<DATA.to;
    const head=due?(overdue?`<span style="color:#F8717A;font-weight:800">⚠ просрочено ${_dmy(due)}</span>`:`<span style="color:var(--ink-2);font-weight:700">${_dmy(due)}</span>`):'<span style="color:var(--ink-4)">без срока</span>';
    return `<div style="font-size:11px;line-height:1.3">${head}${subj?`<div style="color:var(--ink-3);font-size:10.5px;max-width:150px;white-space:normal">${esc(subj)}</div>`:''}</div>`;};
  const body=sorted.slice(0,200).map(r=>{const d=r.d,c=r.c,snm=HOT[d.stageCode][0];
    const gpt=c.gpt?`<div style="font-size:11px;color:var(--ink-3);max-width:480px;white-space:normal;line-height:1.4">${esc(c.gpt)}</div>`:'<span style="color:var(--ink-4)">нет переписки</span>';
    const sil=c.silent==null?'—':(c.silent+' дн');
    return `<tr>`+
      `<td style="text-align:center;font-weight:700">${dl(d.id)}</td>`+
      `<td style="text-align:center;font-weight:800;color:var(--ink-2);cursor:help" data-tip="${whyText(r).replace(/"/g,'&quot;')}">${r.prio}</td>`+
      `<td style="text-align:center;font-family:'Manrope';font-weight:800;color:${scoreCol(r.score)}">${r.score.toFixed(2)}</td>`+
      `<td style="text-align:center;white-space:nowrap">${ballTxt(c)}</td>`+
      `<td style="text-align:right;font-weight:700">${fmtK(d.budget||0)}</td>`+
      `<td style="text-align:left;font-size:11px;color:var(--ink-2);white-space:nowrap">${esc(catV(d))}</td>`+
      `<td style="text-align:left;font-size:11px;color:var(--ink-2);white-space:nowrap">${esc(cliV(d))}</td>`+
      `<td style="text-align:left;color:var(--ink-3);font-size:11px;white-space:nowrap">${esc(snm)}</td>`+
      `<td style="text-align:right;color:${silCol(c.silent)};font-weight:${(c.silent!=null&&c.silent>=7)?'700':'600'};font-size:11px">${sil}</td>`+
      `<td style="text-align:left">${taskCell(d)}</td>`+
      `<td style="text-align:left">${gpt}</td>`+
      `</tr>`;}).join("");
  const us=rows.filter(r=>r.c&&r.c.ball==='us');const nUs=us.length,sumUs=us.reduce((s,r)=>s+r.bud,0);
  const sub=`Сделки, ближе всего к предоплате после анализа стадии, сроков и диалогов`+(nUs?` · <b style="color:#22D3EE">мяч у нас: ${nUs} на ${fmtK(sumUs)}</b>`:'');
  return `<div class="card" id="prio"><div class="card-h"><div><div class="card-title">Приоритет к предоплате ${_info}</div><div class="card-sub">${sub}</div></div></div><div class="scroll" style="max-height:560px;margin-top:6px"><table class="tbl"><thead><tr><th style="text-align:center">Сделка</th>${th('prio','Приоритет')}${th('score','Оценка')}${th('ball','Мяч')}${th('bud','Бюджет')}${th('cat','Ассортимент','left')}${th('cli','Клиент','left')}${th('stage','Стадия','left')}${th('silent','Срок ожидания')}<th style="text-align:left">Дела / срок</th><th style="text-align:left">О чём договорились</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

function challengeWidget(){
  const enterExec=d=>{for(const h of (d.hist||[]))if(h[0]==="C49:EXECUTING"&&h[1])return h[1];return d.won?(d.closed||null):null;};
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  // РОПа и вспомогательные роли в гонку не берём (они руководят, а не соревнуются).
  const CHAL_EXCLUDE=new Set(["Ольга Лысенко","Алёна Кубанова"]);
  // Челлендж за ПРЕДОПЛАТЫ: сколько предоплат получил каждый менеджер ОП за период.
  const byM={};
  (ALL_DEALS||[]).forEach(d=>{if(!isOP(d.mgr)||CHAL_EXCLUDE.has(d.mgr))return;const e=enterExec(d);if(e&&inR(e)){const m=byM[d.mgr]=byM[d.mgr]||{n:d.mgr,cnt:0,rub:0};m.cnt++;m.rub+=d.budget||0;}});
  let rows=Object.values(byM);
  // менеджер всегда видит себя, даже при 0 предоплат
  if(!rows.some(m=>m.n===MANAGER)&&isOP(MANAGER)&&!CHAL_EXCLUDE.has(MANAGER))rows.push({n:MANAGER,cnt:0,rub:0});
  if(!rows.length)return "";
  rows.sort((a,b)=>b.cnt-a.cnt||b.rub-a.rub);
  rows.forEach((m,i)=>m.rank=i+1);

  const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':'';
  const deptCnt=rows.reduce((s,m)=>s+m.cnt,0),deptRub=rows.reduce((s,m)=>s+m.rub,0);

  const goalRub=pm?(pm.rev||0):0,goalCnt=(pm&&pm.check)?Math.round((pm.rev||0)/pm.check):0;
  const cvRub=goalRub?Math.min(100,Math.round(deptRub/goalRub*100)):0;
  const _low=rows.length-Math.max(1,Math.ceil(rows.length/3));
  const rankCol=m=>m.rank<=3?'#2E9E74':m.rank>_low?'#CC5867':'#C2873C';
  const line=(m,hi)=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0${hi?';font-weight:800':''}">`+
    `<span style="width:20px;text-align:center;font-size:14px">${medal(m.rank)||m.rank}</span>`+
    `<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${hi?'#22D3EE':'var(--ink-2)'}">${esc(short(m.n))}</span>`+
    `<span data-tip="предоплат за период" style="font-family:'Manrope';font-weight:800;color:${rankCol(m)}">${m.cnt}</span>`+
    `<span data-tip="выручка предоплат за период" style="color:var(--ink-4);font-size:11px;width:52px;text-align:right">${fmtKc(m.rub)}</span></div>`;
  const _sep=`<div style="border-top:1px dashed var(--line);margin:5px 0 2px"></div>`;
  const meOut=(me&&me.rank>3)?`${_sep}${line(me,true)}`:'';
  const _trow=(l,t)=>`<div style="margin:5px 0 0;line-height:1.4"><b style="color:#22D3EE">${l}:</b> ${t}</div>`;
  const tip=('Гонка отдела за предоплаты: место каждого менеджера за период. Число справа = сколько предоплат получил, серым - выручка по ним. Цель отдела: 20 млн в месяц, 700к в день, у каждого минимум 1 предоплата в день. Вопрос: кто из отдела впереди по предоплатам, а кто отстаёт. Вывод: дожимай сделки из блока «Приоритет к предоплате», начиная с тех, где мяч у нас.').replace(/"/g,'&quot;');
  const cta=me?(me.cnt>0?`ты ${me.cnt} предоплат · ${fmtKc(me.rub)}`:'сегодня нужна минимум 1 предоплата'):'к списку';
  const badge=me?`<span style="background:${me.cnt>0?'#2E9E74':'#CC5867'};color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:6px">${me.cnt}</span>`:'';
  if(S.chalMin)return `<button id="crmChallengeToggle" data-tip="${tip}" style="position:fixed;right:14px;top:150px;z-index:60;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;background:linear-gradient(180deg,rgba(20,24,33,.98),rgba(14,17,24,.98));box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:'Manrope';font-weight:800;font-size:12px;color:var(--ink-1)">🏆 Челлендж${badge}</button>`;
  return `<div id="crmChallenge" style="position:fixed;right:0;top:150px;z-index:60;width:238px;background:linear-gradient(180deg,rgba(20,24,33,.98),rgba(14,17,24,.98));border:1px solid var(--line);border-right:none;border-radius:14px 0 0 14px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:12px 13px;backdrop-filter:blur(6px);transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform">`+
    `<div id="crmChallengeRibbon" style="position:absolute;left:1px;top:11px;bottom:11px;width:7px;border-radius:7px;background:linear-gradient(180deg,#8B5CF6,#22D3EE);box-shadow:0 0 12px rgba(34,211,238,.6);cursor:pointer"></div>`+
    `<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px"><span style="font-size:17px">🏆</span><span style="flex:1;font-family:'Manrope';font-weight:800;font-size:13px;color:var(--ink-1);line-height:1.1">Челлендж<br><span style="font-size:11px;color:var(--ink-3);font-weight:600">Предоплаты · гонка отдела <span class="qm" data-tip="${tip}" style="font-size:10px">?</span></span></span><button id="crmChallengeToggle" data-tip="свернуть" style="border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px">–</button></div>`+
    `<div style="background:rgba(34,211,238,.07);border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)"><span>отдел за период</span><span style="color:var(--ink-1);font-weight:800">${deptCnt}${goalCnt?' / '+goalCnt:''} шт</span></div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:1px"><span>выручка</span><span style="color:var(--ink-1);font-weight:800">${fmtKc(deptRub)}${goalRub?' / '+fmtKc(goalRub):''}</span></div>${goalRub?`<div style="height:6px;border-radius:4px;background:#0d141d;border:1px solid var(--line);overflow:hidden;margin-top:5px"><i style="display:block;height:100%;width:${cvRub}%;background:#2E9E74"></i></div>`:''}</div>`+
    top.map(m=>line(m,m.n===MANAGER)).join('')+meOut+
    `<button id="crmChallengeGo" style="margin-top:9px;width:100%;border:0;border-radius:9px;padding:8px;cursor:pointer;font-family:'Manrope';font-weight:800;font-size:12px;color:#04110C;background:linear-gradient(180deg,#3DE0A0,#2E9E74)">Мои приоритетные сделки ↓</button>`+
    `<div style="text-align:center;font-size:10px;color:var(--ink-4);margin-top:5px">${esc(cta)}</div></div>`;
}

// ===== СТАНДАРТ ОТДЕЛА: план в предоплатах, декомпозиция по менеджерам =====
// План в КОЛИЧЕСТВЕ предоплат (не в выручке). Цель менеджеру = живой портфель × целевой
// CR. Гардрейлы: чек (чтобы count не убил выручку) и долгострой (в паре с отказами).
function standardBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  if(!passed.length)return "";
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const enterExec=d=>{for(const h of (d.hist||[]))if(h[0]==="C49:EXECUTING")return h[1];return null;};
  const enterLose=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0]))r=h[1];return r||(d.lost?d.closed:null);};
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  const PD=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const age=d=>Math.max(0,Math.round((NOWD-PD(d.created))/DAYMS));
  const days=Math.max(1,Math.round((PD(S.end)-PD(S.start))/DAYMS)+1),factor=days/30;

  // план из плановой таблицы (planModel читает Google-план; m-заглушка, targets из листа)
  const P=planModel(DATA.deals||[],DATA.leads||[],{check:0,conv:0,rev:0,deals:0,leads:0,qrate:0});
  const TCR=(P.conv&&P.conv>0)?P.conv:0.15; // конверсия-цель ИЗ ПЛАНА (CR2 листа); запас 15% если плана нет
  const checkP=Math.round(P.check||120000);          // плановый чек (гардрейл)
  const winTdept=Math.max(0,Math.round(P.winT||0));  // нужно предоплат за период для плана
  const revPlan=Math.round(P.targets.rev||0);

  const names=[...new Set([...open.map(d=>d.mgr),...passed.map(d=>d.mgr)])];
  const rows=names.map(m=>{
    const op=open.filter(d=>d.mgr===m),ps=passed.filter(d=>d.mgr===m);
    const live=op.filter(d=>age(d)<=60),zomb=op.filter(d=>age(d)>60);
    const suc=ps.filter(d=>inR(enterExec(d))),lo=ps.filter(d=>inR(enterLose(d)));
    const cr=(suc.length+lo.length)?suc.length/(suc.length+lo.length):null;
    const chk=median(suc.map(d=>d.budget||0).filter(v=>v>0))||0;
    const target=Math.round(live.length*TCR*factor);
    const pctPlan=target?suc.length/target:null;
    return {m,live:live.length,zomb:zomb.length,zombM:zomb.reduce((s,d)=>s+(d.budget||0),0),target,fact:suc.length,factM:suc.reduce((s,d)=>s+(d.budget||0),0),lose:lo.length,cr,chk,pctPlan};
  }).filter(r=>r.live+r.zomb+r.fact+r.lose>0);
  const medLive=median(rows.map(r=>r.live))||0;
  const stat=r=>{
    const okChek=!r.chk||r.chk>=checkP*0.85, okCR=r.cr==null||r.cr>=TCR, okPlan=r.pctPlan!=null&&r.pctPlan>=0.9;
    if(okPlan&&okCR&&okChek)return {l:"в норме",c:"#2E9E74"};
    if(r.live>medLive&&(r.pctPlan==null||r.pctPlan<0.6))return {l:"резать портфель",c:"#F43F5E"};
    if((r.cr!=null&&r.cr<0.10)||(r.pctPlan!=null&&r.pctPlan<0.4))return {l:"ставить ребром",c:"#F43F5E"};
    return {l:"обучать",c:"#C2873C"};
  };
  rows.forEach(r=>r.st=stat(r));
  rows.sort((a,b)=>(b.pctPlan||0)-(a.pctPlan||0)||b.fact-a.fact);

  // отдел
  const D_={live:rows.reduce((s,r)=>s+r.live,0),zomb:rows.reduce((s,r)=>s+r.zomb,0),target:rows.reduce((s,r)=>s+r.target,0),fact:rows.reduce((s,r)=>s+r.fact,0),factM:rows.reduce((s,r)=>s+r.factM,0),lose:rows.reduce((s,r)=>s+r.lose,0)};
  D_.cr=(D_.fact+D_.lose)?D_.fact/(D_.fact+D_.lose):0;
  const allSuc=passed.filter(d=>inR(enterExec(d)));
  D_.chk=median(allSuc.map(d=>d.budget||0).filter(v=>v>0))||(D_.fact?Math.round(D_.factM/D_.fact):0);
  // А / Б / В
  const revA=D_.factM, prepayA=D_.fact;
  const prepayB=Math.round(D_.live*TCR*factor), revB=prepayB*checkP; // потенциал живого портфеля при 15%
  const enough=prepayB>=winTdept;
  const gap=Math.max(0,winTdept-prepayB);
  const nDone=`${fmt(prepayA)}`;
  const pill=(t,c)=>`<span style="display:inline-block;font-size:10px;font-weight:700;color:${c};background:${c}18;border:1px solid ${c}55;border-radius:6px;padding:2px 8px">${t}</span>`;
  const headA=`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px"><b style="font-size:12.5px">Отдел:</b> ${pill('А сейчас: '+fmt(prepayA)+' предоплат · '+fmtK(revA)+' ₽ · CR '+pct(D_.cr),'#22D3EE')} ${pill('Б стандарт ('+pct(TCR)+' от живого): '+fmt(prepayB)+' предоплат · '+fmtK(revB)+' ₽','#C2873C')} ${pill('В план: '+fmt(winTdept)+' предоплат · '+fmtK(revPlan)+' ₽','#A78BFA')}</div><div class="card-sub" style="margin-bottom:10px">${enough?`<span style="color:#2E9E74;font-weight:700">Живого портфеля на план хватает</span> при ${pct(TCR)} конверсии.`:`<span style="color:#F8717A;font-weight:700">Живого портфеля на план НЕ хватает</span>: не достаёт <b>${fmt(gap)}</b> предоплат - поднимать конверсию выше ${pct(TCR)} или наполнять портфель (план по лидам).`} Цель менеджеру = живой портфель × ${pct(TCR)}. Чек - гардрейл (пол ${fmtK(checkP)}), долгострой 60+ - в паре с отказами.</div>`;

  const crC=v=>v==null?"var(--ink-4)":v>=TCR?"#2E9E74":v>=0.10?"#C2873C":"#CC5867";
  const pctC=v=>v==null?"var(--ink-4)":v>=0.9?"#2E9E74":v>=0.6?"#C2873C":"#CC5867";
  // Стаканы по менеджерам: доля каждого в общем плане. Риска = цель (портфель × 15%),
  // налив = факт предоплат. Норма успех:отказ = 1:4 (CR 15%). Отсортировано по % плана.
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.target,r.fact)));
  const short=m=>{const p=String(m).trim().split(/\s+/);return p[0].length>9?p[0].slice(0,8)+"…":p[0];};
  const cupsMgr=rows.length?`<div style="margin:2px 0 12px"><div class="card-sub" style="margin-bottom:6px">Стакан каждого менеджера = его доля общего плана: <span style="color:#A78BFA">риска</span> - цель (портфель × ${pct(TCR)}), налив - факт предоплат. Наведи - портфель, цель, факт, отказы и норма 1:4.</div><div class="scroll" style="overflow-x:auto"><div style="display:flex;gap:4px;align-items:flex-end;min-width:min-content;padding-bottom:2px">`+
    rows.map(r=>{const a=r.pctPlan,c=pctC(a),fh=Math.min(100,r.fact/maxV*100).toFixed(1),ph=Math.min(100,r.target/maxV*100).toFixed(1),loseNorm=Math.round(r.target*4);
      return `<div style="flex:0 0 34px;display:flex;flex-direction:column;align-items:center;gap:3px" data-tip="${(r.m+' · портфель '+r.live+(r.zomb?(' (+'+r.zomb+' долгострой)'):'')+' · цель '+r.target+' предоплат · факт '+r.fact+' · '+(a==null?'нет цели':pct(a)+' плана')+' · отказов '+r.lose+' из нормы ~'+loseNorm+' · CR '+(r.cr==null?'—':pct(r.cr))).replace(/"/g,'&quot;')}">`+
        `<div style="font-size:9px;font-weight:800;color:${c};height:12px">${r.fact||''}</div>`+
        `<div style="position:relative;width:26px;height:70px;background:var(--bg-base);border:1px solid var(--border);border-top:none;border-radius:0 0 5px 5px">`+
          `<div style="position:absolute;left:0;bottom:0;width:100%;height:${fh}%;background:${c};opacity:.9;border-radius:0 0 4px 4px"></div>`+
          `<div style="position:absolute;left:-1px;right:-1px;bottom:${ph}%;border-top:2px dashed #A78BFA"></div>`+
        `</div>`+
        `<div style="font-size:8px;color:var(--ink-4);max-width:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(short(r.m))}</div>`+
      `</div>`;}).join("")+`</div></div></div>`:"";
  const th=(t,tip)=>`<th style="text-align:center;white-space:nowrap">${t}${tip?info(tip):""}</th>`;
  const head=`<tr><th style="text-align:left">Менеджер</th>${th("Живой портфель","Открытые офферы моложе 60 дней - с них реально брать предоплаты.")}${th("Долгострой 60+","Открытые офферы старше 60 дней - мёртвый груз, в цель не идут.")}${th("Цель предоплат","Живой портфель × "+pct(TCR)+" (за период). Столько предоплат должно выйти.")}${th("Факт")}${th("% плана")}${th("CR","Успех ÷ (успех+отказ) за период. Ниже "+pct(TCR)+" - расточительство.")}${th("Отказов")}${th("Ср.чек","Медиана чека предоплат. Ниже пола - гонка за количеством роняет выручку.")}${th("Статус")}</tr>`;
  const body=rows.map(r=>`<tr><td class="name" style="text-align:left">${esc(r.m)}</td>
    <td style="text-align:center;font-weight:700">${r.live}</td>
    <td style="text-align:center;color:${r.zomb?'#F8717A':'var(--ink-3)'};font-weight:${r.zomb?700:400}">${r.zomb||'·'}${r.zombM?`<div style="font-size:9px;font-weight:400;color:var(--ink-4)">${fmtK(r.zombM)}</div>`:''}</td>
    <td style="text-align:center;color:var(--ink-3)">${r.target||'·'}</td>
    <td style="text-align:center;font-weight:800;color:#2E9E74">${r.fact||'·'}</td>
    <td style="text-align:center;font-weight:800;color:${pctC(r.pctPlan)}">${r.pctPlan==null?'—':pct(r.pctPlan)}</td>
    <td style="text-align:center;font-weight:700;color:${crC(r.cr)}">${r.cr==null?'—':pct(r.cr)}</td>
    <td style="text-align:center;color:${r.lose>r.fact*4?'#F8717A':'var(--ink-3)'}">${r.lose||'·'}</td>
    <td style="text-align:center;color:${r.chk&&r.chk<checkP*0.85?'#F8717A':'var(--ink-2)'}">${r.chk?fmtK(r.chk):'—'}</td>
    <td style="text-align:center"><span style="display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;color:${r.st.c};background:${r.st.c}22;border:1px solid ${r.st.c}66;border-radius:6px;padding:2px 8px">${r.st.l}</span></td></tr>`).join("");
  const foot=`<tr class="total"><td style="text-align:left">ОТДЕЛ</td><td style="text-align:center">${D_.live}</td><td style="text-align:center;color:#F8717A">${D_.zomb}</td><td style="text-align:center">${D_.target}</td><td style="text-align:center;color:#2E9E74">${D_.fact}</td><td style="text-align:center;color:${pctC(D_.target?D_.fact/D_.target:null)}">${D_.target?pct(D_.fact/D_.target):'—'}</td><td style="text-align:center;color:${crC(D_.cr)}">${pct(D_.cr)}</td><td style="text-align:center">${D_.lose}</td><td style="text-align:center">${D_.chk?fmtK(D_.chk):'—'}</td><td></td></tr>`;

  return `<div class="card"><div class="card-h"><div><div class="card-title">Стандарт отдела: план в предоплатах ${info('План декомпозируется в КОЛИЧЕСТВО предоплат, не в выручку - одна крупная сделка не должна закрывать месяц. Цель менеджеру = живой портфель × '+pct(TCR)+' (конверсия-цель из плана). Вопрос: кто вытягивает свой план по предоплатам и кого приводить к стандарту. Вывод: «резать портфель» - большой портфель без выхода; «ставить ребром» - хроническая низкая конверсия; чек ниже пола - гонка за количеством роняет выручку. Успех = вход в «Предоплата получена» (позже заменить на реальную оплату из 1С).')}</div><div class="card-sub">план в количестве предоплат · цель = живой портфель × ${pct(TCR)} · выручка - рычаг (чек-гардрейл)</div></div><a class="dbtn" href="${DATA.planUrl||'#'}" target="_blank" rel="noopener" style="text-decoration:none">↗ Таблица плана</a></div>${headA}${cupsMgr}<div class="scroll" style="max-height:520px"><table class="tbl">${head.replace('<tr>','<thead><tr>').replace('</tr>','</tr></thead>')}<tbody>${body}${foot}</tbody></table></div></div>`;
}

// ===== КАЛЕНДАРЬ ЗАГРУЗКИ МЕНЕДЖЕРОВ (оффер-стадии) =====
// Тепловой календарь по датам событий: приток, «в работе», перемещения по стадиям.
// Σ-столбец за период, переключатель Кол-во/Выручка, раскрытие этапа по всем менеджерам
// (строка отдела + строки менеджеров), фильтр по менеджеру. Реагирует на период/гранулярность.
function offerCalendarBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  if(!passed.length)return "";
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const enterStage=(d,code)=>{for(const h of (d.hist||[]))if(h[0]===code&&h[1])return h[1];return null;};
  const enterExec=d=>enterStage(d,"C49:EXECUTING");
  const enterLose=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0]))r=h[1];return r||(d.lost?d.closed:null);};
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  const g=S.gran,keys=buckets(g);
  const lbl=k=>{const p=k.split("-");return g==="month"?(p[1]+"."+p[0].slice(2)):(p[2]+"."+p[1]);};
  const endDate=k=>{if(g==="month")return k+"-31";if(g==="week"){const dt=new Date(k+"T00:00:00Z");dt.setUTCDate(dt.getUTCDate()+6);return dt.toISOString().slice(0,10);}return k;};
  const PD2=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const mgrSel=S.calMgr||"",unit=S.calUnit==="money"?"money":"count";
  const RW=unit==="money"?108:84; // ширина правой колонки (в деньгах числа шире)
  const scope=mgrSel?passed.filter(d=>d.mgr===mgrSel):passed;
  const _days=Math.max(1,Math.round((PD2(S.end)-PD2(S.start))/DAYMS)+1),_factor=_days/30;
  const _PC=planModel(DATA.deals||[],DATA.leads||[],{check:0,conv:0,rev:0,deals:0,leads:0,qrate:0});
  const _TCR=(_PC.conv&&_PC.conv>0)?_PC.conv:0.15; // конверсия-цель ИЗ ПЛАНА (CR2 листа), запас 15%
  const livePort=m=>open.filter(d=>d.mgr===m&&(NOWD-PD2(d.created))/DAYMS<=60).length;
  // База целей = «В работе на конец» (портфель). Успех-цель = портфель × TCR (конверсия-цель плана),
  // потолок отказов = успех-цель × 4 (= портфель × TCR×4). Пример при 15%: портфель 174 → успех 26 → отказ 104.
  const _capK=()=>keys[keys.length-1];
  const _portAt=sc=>wipAt(_capK(),sc).length;
  const _mSc=m=>passed.filter(d=>d.mgr===m);
  const mgrTarget=m=>Math.round(_portAt(_mSc(m))*_TCR*_factor);   // успех-цель менеджера
