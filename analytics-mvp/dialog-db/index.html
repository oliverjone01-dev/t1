<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Диалоги · работа отдела</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#191f2a;--line:#30394a;--ink:#eef2fa;--muted:#a1aec2;--accent:#99b6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#24324d55,transparent 60%),var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:#222b3b}button:hover,button.active{border-color:var(--accent);background:#2c3d60}input,select{background:#121923;border:1px solid var(--line);padding:9px;border-radius:9px}header{padding:20px 28px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 16px}h3{margin:18px 0 8px;font-size:15px}a{color:var(--accent)}.status{margin-left:auto;width:11px;height:11px;border-radius:50%;background:#d6b16b;padding:0;position:relative}.status:hover:after,.status:focus:after{content:attr(data-description);white-space:pre-line;position:absolute;right:0;top:20px;min-width:290px;background:#222c3c;padding:16px;border-radius:12px;z-index:10;color:var(--ink);font-size:12px;text-align:left;box-shadow:0 15px 50px #0008}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:16px 28px}.workspace{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(360px,1.25fr);gap:14px;padding:0 28px 28px;align-items:start}.panel{background:linear-gradient(150deg,#1e2633,var(--panel));border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0}.muted{color:var(--muted);font-size:12px}.manager{display:block;width:100%;text-align:left;margin:8px 0}.manager small{display:block;color:var(--muted)}.numbers{display:flex;gap:25px;margin-bottom:15px}.numbers strong{display:block;font-size:24px}.numbers small{color:var(--muted)}.chart{display:grid;grid-template-columns:1fr 1fr;align-items:center}.chart svg{width:100%;max-height:280px;overflow:visible}.score{margin:7px 0}.score b{color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);cursor:pointer}td,th{padding:11px 5px;border-bottom:1px solid var(--line)}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#2a3750}td:first-child{max-width:180px;overflow-wrap:anywhere}.tabs{display:flex;gap:8px;margin:15px 0}.comment{border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}.comment p{margin:7px 0}.client{background:#453d2655;border-left:3px solid #c6ab69}.staff{background:#25473555;border-left:3px solid #76af8c}.technical{background:#363b4355;border-left:3px solid #6b7585}.neutral{background:#29334755}.event{border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.event .muted{margin-bottom:6px}.error{color:#ffc0b0;padding:12px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.scroll{max-height:75vh;overflow:auto}.hidden{display:none}.empty{color:var(--muted);padding:25px 0}details{margin-top:20px}summary{cursor:pointer;color:var(--muted)}@media(max-width:1150px){.workspace{grid-template-columns:200px 1fr}.card{grid-column:1/-1}}@media(max-width:650px){header,.filters{padding:15px}.workspace{display:block;padding:0 15px}.panel{margin-bottom:15px}.chart{grid-template-columns:1fr}input{max-width:150px}}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .2s ease-out}@keyframes appear{from{opacity:.4;transform:translateY(4px)}}}
</style>
<header><h1>Диалоги</h1><span class="muted">Работа отдела и сделки</span><a href="/dialog/" class="muted">Текущая версия</a><button class="status" id="health" aria-label="Состояние данных" data-description="Проверка данных"></button></header>
<div class="filters"><input type="date" id="from" aria-label="Начало периода"><input type="date" id="to" aria-label="Конец периода"><select id="mode" aria-label="Режим периода"><option value="events">По событиям</option><option value="created">По дате создания</option></select><select id="outcome" aria-label="Исход"><option value="all">Все сделки</option><option value="open">В работе</option><option value="won">Успех</option><option value="lost">Отказ</option></select><input id="search" placeholder="Клиент или ID" aria-label="Поиск"><button id="apply">Применить</button></div>
<main class="workspace"><aside class="panel"><h2>Менеджеры</h2><button class="manager active" id="department">Весь отдел</button><div id="managers">Загрузка…</div></aside><section><div class="panel" id="overview">Загрузка сводки…</div><div class="panel" style="margin-top:14px"><h2 id="listTitle">Сделки отдела</h2><div id="deals"></div></div></section><section class="panel card" id="card"><h2>Выберите сделку</h2><div class="muted">Здесь появятся комментарий ИИ и история общения.</div></section></main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n||0)+' ₽';
let manager='',page=0,sort='last',direction='desc',selected='',current=null,tab='ai',eventPage=0,summary=null,portal='',requestId=0,dealRequest=0;
const labels={polite:'Вежливость',qual:'Квалификация',deadline:'Сроки',process:'Ведение',result:'Результат'};
function params(extra={}){return new URLSearchParams({from:$('from').value,to:$('to').value,mode:$('mode').value,outcome:$('outcome').value,q:$('search').value,manager,...extra})}
async function api(path,p){const r=await fetch('api/'+path+'?'+p,{credentials:'same-origin'});if(!r.ok)throw Error('Не удалось загрузить данные ('+r.status+'). Повторите запрос.');return r.json()}
function radar(scores){let a=Object.keys(labels),cx=150,cy=130,r=85;const pt=(i,v)=>[cx+Math.sin(i*2*Math.PI/5)*r*v,cy-Math.cos(i*2*Math.PI/5)*r*v];const polygon=v=>a.map((k,i)=>pt(i,v).join(',')).join(' ');let g=[.2,.4,.6,.8,1].map(v=>`<polygon points="${polygon(v)}" fill="none" stroke="#64718b55"/>`).join('');g+=a.map((k,i)=>`<line x1="150" y1="130" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="#64718b55"/><text x="${pt(i,1.28)[0]}" y="${pt(i,1.28)[1]}" text-anchor="middle" fill="#a1aec2" font-size="10">${labels[k]}</text>`).join('');if(a.every(k=>scores[k].value!==null)){g+=`<polygon points="${a.map((k,i)=>pt(i,scores[k].value/5).join(',')).join(' ')}" fill="#99b6ff30" stroke="#99b6ff" stroke-width="2"/>`}g+=a.filter(k=>scores[k].value!==null).map(k=>{let i=a.indexOf(k),p=pt(i,scores[k].value/5);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#b5caff"/>`}).join('');return `<svg viewBox="0 0 300 260" role="img" aria-label="Средние оценки ИИ по пяти критериям, шкала от нуля до пяти">${g}</svg>`}
function aiText(ai){if(!ai?.verdict)return '<div class="empty">Для этой сделки комментария ИИ пока нет.</div>';return `<div class="comment"><h3>Ситуация</h3><p>${esc(ai.verdict)}</p>${ai.problem?'<h3>Что мешает</h3><p>'+esc(ai.problem)+'</p>':''}${ai.recommendation?'<h3>Следующий шаг</h3><p>'+esc(ai.recommendation)+'</p>':''}${ai.quotes?.length?'<h3>Подтверждение в общении</h3>'+ai.quotes.map(q=>'<p>«'+esc(q)+'»</p>').join(''):''}</div>`}
function overview(a){$('overview').innerHTML=`<h2>${manager?esc(manager):'Весь отдел'}</h2><div class="numbers"><div><strong>${a.total}</strong><small>сделок в выборке</small></div><div><strong>${a.reviewed}</strong><small>с комментарием ИИ</small></div></div><div class="chart">${radar(a.scores)}<div>${Object.entries(labels).map(([k,label])=>`<div class="score">${label}: <b>${a.scores[k].value===null?'нет данных':a.scores[k].value.toFixed(1)+' / 5'}</b><div class="muted">${a.scores[k].n} оценённых сделок</div></div>`).join('')}</div></div><div class="muted">Средние существующих оценок ИИ по выбранным сделкам. Покрытие: ${a.total?Math.round(a.reviewed/a.total*100):0}%. Неоценённые сделки не считаются нулём.</div><details><summary>Комментарии ИИ по сделкам выборки</summary>${a.comments.length?a.comments.map(d=>`<div class="comment"><button data-key="${esc(d.key)}">${esc(d.title)} · ${esc(d.key)}</button>${aiText(d.ai)}</div>`).join(''):'<p class="muted">Комментарии отсутствуют.</p>'}<div class="muted">Показано до восьми примеров, сначала с проблемами. Это комментарии отдельных сделок, общий ИИ-вывод по отделу ещё не сформирован.</div></details>`;bindKeys($('overview'))}
function bindKeys(host){host.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>openDeal(b.dataset.key))}
async function refresh(){let id=++requestId;try{const a=await api('summary',params());if(id!==requestId)return;summary=a;overview(a.department);$('managers').innerHTML=a.managers.sort((a,b)=>b.total-a.total).map(m=>`<button class="manager ${m.manager===manager?'active':''}" data-manager="${esc(m.manager)}">${esc(m.manager)}<small>${m.total} сделок · ИИ ${m.reviewed}</small></button>`).join('');$('managers').querySelectorAll('button').forEach(b=>b.onclick=()=>chooseManager(b.dataset.manager));await loadDeals(id)}catch(e){$('overview').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function chooseManager(m){manager=m;page=0;selected='';$('department').classList.toggle('active',!m);$('managers').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.manager===m));$('card').innerHTML='<h2>Выберите сделку</h2>';refresh()}
async function loadDeals(id=requestId){try{const r=await api('deals',params({page,sort,direction}));if(id!==requestId)return;$('listTitle').textContent=manager?'Сделки менеджера':'Сделки отдела';$('deals').innerHTML=`<div class="scroll"><table><thead><tr><th data-sort="title">Клиент / сделка</th><th>Стадия</th><th data-sort="budget">Сумма</th><th data-sort="silence">Тишина</th></tr></thead><tbody>${r.items.map(d=>`<tr data-key="${esc(d.key)}" class="${selected===d.key?'selected':''}"><td>${esc(d.title)}<div class="muted">${esc(d.key)} · ${esc(d.mgr)}</div></td><td>${esc(d.stage)}</td><td>${money(d.budget)}</td><td>${d.silenceD==null?'—':esc(d.silenceD)+' дн.'}</td></tr>`).join('')}</tbody></table></div><div class="pager"><button id="prev" ${page===0?'disabled':''}>←</button><span class="muted">${r.total? page*40+1:0}–${Math.min((page+1)*40,r.total)} из ${r.total}</span><button id="next" ${(page+1)*40>=r.total?'disabled':''}>→</button></div>`;bindKeys($('deals'));$('prev').onclick=()=>{page--;loadDeals()};$('next').onclick=()=>{page++;loadDeals()};$('deals').querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{if(sort===th.dataset.sort)direction=direction==='asc'?'desc':'asc';else{sort=th.dataset.sort;direction='desc'}page=0;loadDeals()})}catch(e){$('deals').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function openDeal(key){selected=key;let id=++dealRequest;$('card').innerHTML='<div class="muted">Загрузка сделки…</div>';try{const r=await api('deal',new URLSearchParams({key}));if(id!==dealRequest)return;current=r.deal;tab='ai';eventPage=0;renderCard();loadDeals()}catch(e){$('card').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderCard(){let d=current;$('card').innerHTML=`<h2>${esc(d.title)}</h2><div class="muted">${esc(d.mgr)} · ${esc(d.stage)} · ${money(d.budget)} · <a href="${esc(portal)}/crm/${d.isLead?'lead':'deal'}/details/${encodeURIComponent(d.dealId||d.leadId)}/" target="_blank" rel="noopener">CRM ↗</a></div><div class="tabs"><button id="aiTab" class="${tab==='ai'?'active':''}">Комментарий ИИ</button><button id="eventsTab" class="${tab==='events'?'active':''}">Коммуникации</button></div><div id="content"></div>`;$('aiTab').onclick=()=>{tab='ai';renderCard()};$('eventsTab').onclick=()=>{tab='events';renderCard()};if(tab==='ai')$('content').innerHTML=aiText(d.ai);else loadEvents()}
function eventHtml(e){let technical=e.sys||['Стадия','Ответственный','Дело','Задача','Комментарий-заметка','Активность','Резюме BitrixGPT'].includes(e.type);let who=technical?'CRM':e.dir==='входящее'?'Клиент':e.dir==='исходящее'?(e.who||'Сотрудник'):(e.who||'Роль не определена');let cls=technical?'technical':e.dir==='входящее'?'client':e.dir==='исходящее'?'staff':'neutral';let body=e.body||e.title||'Нет текста';return `<div class="event ${cls}"><div class="muted">${esc(who)} · ${esc(e.type)} · ${esc(e.dt)}</div>${body.length>1500?'<details><summary>'+esc(body.slice(0,180))+'…</summary>'+esc(body)+'</details>':esc(body)}</div>`}
async function loadEvents(){let key=selected,id=dealRequest;$('content').innerHTML='<div class="muted">Загрузка истории…</div>';try{let r=await api('events',new URLSearchParams({key,page:eventPage}));if(id!==dealRequest||tab!=='events')return;let technical=[],comms=[];for(let e of r.items)(['Стадия','Ответственный','Дело','Задача','Комментарий-заметка','Активность','Резюме BitrixGPT'].includes(e.type)?technical:comms).push(e);let sys=(current.stageRows||[]).map(s=>({sys:true,type:'Стадия',dt:new Date(s.ts).toLocaleString('ru-RU'),body:s.name}));$('content').innerHTML=`<div class="muted">Жёлтый — клиент · зелёный — сотрудник · серый — служебные события. Показано до 100 событий за запрос.</div>${comms.map(eventHtml).join('')}<details><summary>Служебные события (${technical.length}${eventPage===0?' + история стадий':''})</summary>${technical.concat(eventPage===0?sys:[]).sort((a,b)=>(a.ts||0)-(b.ts||0)).map(eventHtml).join('')}</details><div class="pager"><button id="evPrev" ${eventPage===0?'disabled':''}>←</button><span class="muted">${r.total?eventPage*100+1:0}–${Math.min((eventPage+1)*100,r.total)} из ${r.total}</span><button id="evNext" ${(eventPage+1)*100>=r.total?'disabled':''}>→</button></div>`;$('evPrev').onclick=()=>{eventPage--;loadEvents()};$('evNext').onclick=()=>{eventPage++;loadEvents()}}catch(e){$('content').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('department').onclick=()=>chooseManager('');$('apply').onclick=()=>{page=0;refresh()};$('search').onkeydown=e=>{if(e.key==='Enter'){page=0;refresh()}};
api('status','').then(s=>{portal=s.portal||'';let lag=Date.now()-Date.parse(s.generatedAt),cov=s.aiCoverage||{};let color=lag>48*3600000?'#dc7777':(lag>30*3600000||cov.stale||cov.none)?'#d6b16b':'#75b890';$('health').style.background=color;$('health').dataset.description='Снимок: '+new Date(s.generatedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК\nИмпорт в базу: '+new Date(s.imported).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+'\nСделок: '+s.expected.deals+' · событий: '+s.expected.events+'\nИИ: актуальных '+(cov.fresh||0)+', устаревших '+(cov.stale||0)+', без анализа '+(cov.none||0)}).catch(e=>{$('health').style.background='#dc7777';$('health').dataset.description=e.message});refresh();
</script></html>
