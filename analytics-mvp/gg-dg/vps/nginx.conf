# Included only in dash.genglas.ru TLS server. DG never falls through to @legacy.
location = /gg-dg { return 308 /gg-dg/; }
location ^~ /gg-dg/ {
    alias /srv/gg/dg-www/current/;
    index index.html;
    autoindex off;
    auth_basic "Domglass";
    auth_basic_user_file /etc/nginx/gg-dg.htpasswd;
    if ($uri !~ "^/gg-dg/(index\.html|v\.txt)?$") { return 404; }
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
