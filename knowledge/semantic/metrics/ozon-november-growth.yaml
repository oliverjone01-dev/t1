reconciliation: Внутренняя согласованность с существующим дашбордом; новая банковская сверка не заявляется. Источники прежние, новых API и изменений кабинета нет.

weekly_request: Пользователь 03.11 попросил разбить план по неделям или декадам и добавить расход на рекламу и чистую прибыль к спидометрам.
weekly_windows: ['01-07.11', '08-14.11', '15-21.11', '22-28.11', '29-30.11']
weekly_plan: Месячная цель / 30 * число дней окна. Сумма недель равна месяцу; последняя неделя 2 дня. Окно выбирается по текущей дате МСК, в декабре последнее окно.
weekly_gauge: Факт выбранной недели за все ожидаемые закрытые дни / план этих же дней. 100% означает соответствие темпу. Полный план недели и месячная цель отдельно. В первый день нет закрытых дней; при любом пропуске или задержке нет стрелки/цветного вывода, а не нулевой факт.
weekly_finance: Прямой вызов существующего skuAnalyticsData({from,to}) и anDerive за выбранную неделю; не разность месячных накоплений. Предварительная чистая прибыль после рекламы в существующей модели; расход не вычитается повторно. Проверки покрытия такие же, как у финансовой страницы.
weekly_ads: Общий расход CPC + CPO из отчёта по кампаниям, без добавления SKU-отчёта повторно; период и закрытые дни явно указаны. Пока лимит не утверждён, только нейтральный факт без оценки перерасхода.
