id: ym-delivery-sheet
version: 1
status: approved
owner: Иван
approved_at: "2026-10-21"
approval: "подключи ежедневное обновление по нашей доставке отсюда туда где учитывается в дашборде"
source:
  spreadsheet_id: 1D312esBrGMvtAkMUdI4mI4tkF3rOsxnAVAq9vDUgNwY
  tabs: {active: 529668543, archive: 1308010914}
  fields: {order: B, document: C, offer: D, shipped: E, status: H, buyer: M, ship: O}
code_module: analytics-mvp/tools/delivery/fetch_ym_delivery_sheet.py
entity: отправка Маркета
key: [order, vedomost]
fallback_key: [order, shipped]
formula_text: "Существующая delivByOrder: один счёт на заказ/ведомость, повторные товарные строки не складываются; разные ведомости складываются"
numerator: "Наш расход из O (Стоимость доставки), рубли"
denominator: null
empty_value: null
filters:
  platform: "Только Яндекс; OZON исключён"
  cancellations: "Существующее withoutCancelled: ОТМЕНЕН исключён; возвраты и рекламации сохраняются"
date_field: "Учёт в своде и ACC не меняется: ym-monthly-report v4/L85; дата отгрузки ограничивает приём новых отправок, а не заменяет дату признания расхода"
mode: period
timezone: Europe/Moscow
interval: "Источник: [2026-10-03, московский сегодняшний день). Предыдущая принятая история сохраняется"
partial_period: "Сегодняшние и будущие отгрузки не принимаются; пропуски не объявляются полной ведомостью"
replay: "Активные+Архив ежедневно. Существующий документ обновляется, активный лист имеет приоритет; отсутствующие документы сохраняются. Изменение даты при известном счёте без номера ведомости требует разбора"
legacy: "fixtures/delivery_ym.csv не меняется. Первый запуск наследует его историю; затем data-ym/delivery.csv + delivery_source.json, коммитит только бот в main"
undated: "Новая отправка без даты не включается в расход; безопасная строка замечания передаётся в существующий список проблем доставки"
schedule: "Внутри ym-snapshots: ежедневно 06:40 UTC (09:40 МСК); ручное обновление ym-delivery-sync.yml"
failure_policy: "Оба CSV проверяются до записи; ошибка схемы/суммы/покрытия останавливает обновление. Сохранённые расходы не обнуляются. Manifest проверяется перед derive"
privacy: "Нет адресов, телефонов, контактов или комментариев; только прежний контракт доставки и безопасные замечания"
golden_rows:
  - {order: "62227988545", vedomost: М26-4639, ship: 1000, buyer: 3500, source: "Архив, 1589/1630; прежний ship пустой"}
  - {order: "62359294082", ship: 1000, buyer: 3000, source: "Архив, 1595/1635; номер ведомости пустой, дата исправлена"}
  - {order: "62536179201", ship: 7533, buyer: 4500, source: "Архив, 1642; без даты, только замечание"}
reconciliation:
  against: "Таблица пользователя и прежняя ведомость; проверка mapping/инвариантов, не независимая сверка счетов"
  tolerance: "0.01 ₽"
invariants:
  - "Наблюдённый документ может дополнить пустую старую сумму; ненаблюдённая история не теряется"
  - "Повтор синка и перенос в архив не удваивают расход"
  - "M не попадает в наш расход O; FALSE/пусто = null, настоящий 0 = 0"
  - "Неоднозначная цена или изменение даты оплаченного рейса без ведомости останавливает импорт"
  - "Источники и формулы OZON не меняются"
