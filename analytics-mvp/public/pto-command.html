<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПТО · Запуски расчётов</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surf:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s0:#f0efec; --s1:#cde2fb; --s2:#9ec5f4; --s3:#5598e7; --s4:#2a78d6; --s5:#184f95;
  --bar:#2a78d6;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 72px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.005em}
.sub{color:var(--ink-3);font-size:12px;margin:0 0 22px}
.card{background:var(--surf);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.muted{color:var(--ink-3)}
.sec{color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink-3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* --- вердикт --- */
.verdict{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--ring)}
.vtext{flex:1 1 380px;min-width:280px}
/* --- календарь --- */
.mrow{display:flex;gap:16px;flex-wrap:wrap}
.mon{margin:0 0 14px}
.mon h3{font-size:12.5px;margin:0 0 6px;color:var(--ink-2);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,30px);gap:3px;margin:0 0 3px}
.dow span{font-size:10px;color:var(--ink-3);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,30px);gap:3px}
.cell{width:30px;height:30px;border-radius:4px;background:var(--s0);
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);position:relative;cursor:default}
.cell.void{background:transparent}
.cell.we{opacity:.42}
.cell.future{background:transparent;border:1px dashed var(--grid);color:var(--ink-3)}
.cell.tail{outline:2px solid var(--ink-3);outline-offset:-2px}
.cell.hi{color:#fff}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.lgsteps{display:flex;align-items:center;gap:3px}
.lgsteps i{width:16px;height:16px;border-radius:3px;display:block}
/* --- столбики --- */
.bars{display:flex;align-items:flex-end;gap:26px;height:150px;padding:18px 4px 0;border-bottom:1px solid var(--axis)}
.bcol{flex:0 0 96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bval{font-size:13px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.bfill{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:3px}
.blab{font-size:11.5px;color:var(--ink-3);margin-top:7px;text-align:center}
/* --- фильтры и таблица --- */
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
select,input{font:13px system-ui,sans-serif;color:var(--ink);background:var(--surf);
  border:1px solid var(--ring);border-radius:7px;padding:5px 9px}
input{min-width:190px}
.scroll{max-height:560px;overflow:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--ring);color:var(--ink-2)}
.pill.won{color:var(--good);border-color:var(--good)}
.pill.lost{color:var(--crit);border-color:var(--crit)}
.tt{position:fixed;z-index:9;pointer-events:none;background:var(--surf);color:var(--ink);
  border:1px solid var(--ring);border-radius:8px;padding:7px 10px;font-size:12px;
  box-shadow:0 6px 22px rgba(0,0,0,.14);display:none;max-width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
a{color:inherit}
.tgl{position:absolute;right:16px;top:20px;font-size:12px;color:var(--ink-3);cursor:pointer;
  background:none;border:1px solid var(--ring);border-radius:7px;padding:4px 9px}
</style></head>

<div class="wrap" style="position:relative">
<button class="tgl" id="tgl">тема</button>
<h1>ПТО · запуски расчётов</h1>
<p class="sub" id="stamp"></p>
<div id="app"></div>
</div>
<div class="tt" id="tt"></div>
<style>
.bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:9px;overflow:hidden;background:var(--surf)}
.seg button{font:13px system-ui,sans-serif;color:var(--ink-2);background:none;border:0;
  padding:6px 13px;cursor:pointer;border-right:1px solid var(--ring)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--s3);color:#fff;font-weight:600}
.seg button[disabled]{opacity:.38;cursor:not-allowed}
.seglab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.strip{display:flex;gap:4px;flex-wrap:wrap}
/* Подпись периода вынесена ИЗ цветной плашки на поверхность карточки: внутри заливки
   серый текст на средних ступенях шкалы читался с контрастом около 1.6:1. Внутри остаётся
   только число, и оно белое начиная с третьей ступени. */
.scell{border:0;background:none;padding:0;cursor:pointer;text-align:left;min-width:82px}
.scell .v{display:block;padding:10px 11px;border-radius:8px;background:var(--s0);
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;
  color:var(--ink);border:1px solid transparent}
.scell.hi .v{color:#fff}
.scell .l{display:block;font-size:10.5px;color:var(--ink-3);margin-top:5px;white-space:nowrap}
.scell.sel .v{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cell{cursor:pointer}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cellsum{font-size:12px;color:var(--ink-3);margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--ring);background:var(--surf);cursor:pointer;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
/* Двухуровневая таблица по образцу /economics/: строка сделки разворачивается
   в карточку с её изделиями и сводкой сверху. */
tr.lvl1{cursor:pointer}
tr.lvl1:hover td{background:var(--s0)}
tr.lvl1.open td{background:var(--s0);border-bottom-color:transparent}
.chev{display:inline-block;width:12px;color:var(--ink-3);transition:transform .12s}
tr.lvl1.open .chev{transform:rotate(90deg);color:var(--ink)}
td.dwrap{padding:0 0 14px}
.dcard{background:var(--s0);border-radius:10px;padding:12px 14px;margin:2px 0 0}
.dsum{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 10px}
.dsum span b{display:block;font-size:10.5px;color:var(--ink-3);font-weight:500;
  text-transform:uppercase;letter-spacing:.04em}
.dcard table{font-size:12.5px}
.dcard th,.dcard td{padding:5px 9px 5px 0;border-bottom:1px solid var(--grid)}
.dcard tr:last-child td{border-bottom:0}
.itname{max-width:420px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Названия стадий длинные («В производство/Сборку»), и в узкой колонке плашка ломалась
   на три строки, раздувая высоту строки втрое. Запрещаем перенос внутри плашки. */
.pill{white-space:nowrap}
.dcard td,.dcard th{white-space:nowrap}
.dcard td .itname{max-width:360px}
</style>

const $ = s => document.querySelector(s);
const rub = n => (Math.round(n)||0).toLocaleString('ru-RU')+' ₽';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONR=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const monTitle=m=>MON[+m.slice(5,7)-1]+' '+m.slice(0,4);
const monDay=(m,d)=>d+' '+MONR[+m.slice(5,7)-1];
const dru=s=>s.split('-').reverse().join('.');
const plural=(n,a,b,c)=>{const x=n%10,y=n%100;return x===1&&y!==11?a:x>=2&&x<=4&&(y<12||y>14)?b:c;};
const fmt=n=>Number.isInteger(n)?n.toLocaleString('ru-RU'):n.toFixed(1);

/* ---------- состояние ---------- */
const S = { unit:'deals', gran:'day', sel:null };
const unitOf = k => D.units.find(u=>u.key===k);
const UNAME = {deals:['сделка','сделки','сделок'], items:['изделие','изделия','изделий'], qty:['штука','штуки','штук']};

/* ---------- даты ---------- */
const dt = s => new Date(s+'T00:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const monday = s => { const d=dt(s); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return iso(d); };
const keyOf = (day,gran) => gran==='day'?day : gran==='week'?monday(day) : day.slice(0,7);
const labelOf = (k,gran) => {
  if(gran==='month') return monTitle(k);
  if(gran==='week'){ const e=dt(k); e.setUTCDate(e.getUTCDate()+6); return dru(k).slice(0,5)+'-'+dru(iso(e)).slice(0,5); }
  return dru(k);
};

/* ---------- агрегация ---------- */
function buckets(){
  const src = unitOf(S.unit).series, out = {};
  for(const day in src){ const k=keyOf(day,S.gran); out[k]=(out[k]||0)+src[day]; }
  return out;
}
function inSel(day){
  if(!S.sel) return true;
  return keyOf(day,S.sel.gran)===S.sel.k;
}

/* ---------- панель ---------- */
function bar(){
  const u = D.units.map(u=>`<button data-unit="${u.key}" aria-pressed="${S.unit===u.key}"${u.available?'':' disabled title="нужна выгрузка смарта «Расчёт»"'}>${esc(u.label)}</button>`).join('');
  const g = [['day','по дням'],['week','по неделям'],['month','по месяцам']]
    .map(([k,l])=>`<button data-gran="${k}" aria-pressed="${S.gran===k}">${l}</button>`).join('');
  return `<div class="bar">
    <span><span class="seglab">считать</span><span class="seg">${u}</span></span>
    <span><span class="seglab">группировать</span><span class="seg">${g}</span></span>
  </div>`;
}

/* ---------- календарь ---------- */
function calendar(){
  const un = unitOf(S.unit);
  if(!un.available) return `<section class="card">${bar()}
    <p class="sec" style="margin:0">Единица «${esc(un.label)}» пока недоступна: нужен снимок смарт-процесса «Расчёт».
    Он приезжает воркфлоу <code>pto-cron.yml</code>. Переключись на «по сделкам» или дождись выгрузки.</p></section>`;
  const b = buckets();
  const vals = Object.values(b);
  const max = Math.max(1, ...vals);
  const steps=[]; for(let i=1;i<=5;i++) steps.push(max*i/5);
  const st = v => { if(!v) return 0; for(let i=0;i<5;i++) if(v<=steps[i]) return i+1; return 5; };
  const total = vals.reduce((a,x)=>a+x,0);

  let body;
  if(S.gran==='day'){
    const months=[...new Set(Object.keys(un.series).map(d=>d.slice(0,7)))].sort();
    body = '<div class="mrow">'+months.map(m=>{
      const n=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate();
      const lead=(dt(m+'-01').getUTCDay()+6)%7;
      let cells='<div class="cell void"></div>'.repeat(lead);
      let sum=0;
      for(let i=0;i<n;i++){
        const day=`${m}-${String(i+1).padStart(2,'0')}`;
        const v=b[day]||0; sum+=v;
        const s=st(v), w=dt(day).getUTCDay(), we=(w===0||w===6)||D.holidays.includes(day);
        const future=day>D.today;
        const cls=['cell',we?'we':'',s>=3?'hi':'',future?'future':'',S.sel&&S.sel.k===day?'sel':''].filter(Boolean).join(' ');
        cells+=`<div class="${cls}" style="${future||!s?'':`background:var(--s${s});`}" data-k="${day}"
          data-tip="${esc(monDay(m,i+1))} · ${fmt(v)}">${future?'':(v?fmt(v):'')}</div>`;
      }
      return `<div class="mon"><h3>${monTitle(m)} <span class="muted" style="font-weight:400">· ${fmt(sum)}</span></h3>
        <div class="dow"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
        <div class="grid">${cells}</div></div>`;
    }).join('')+'</div>';
  } else {
    const keys=Object.keys(b).sort();
    body='<div class="strip">'+keys.map(k=>{
      const v=b[k], s=st(v);
      return `<button class="scell ${s>=3?'hi':''} ${S.sel&&S.sel.k===k?'sel':''}" data-k="${k}"
        data-tip="${esc(labelOf(k,S.gran))} · ${fmt(v)}">
        <span class="v"${s?` style="background:var(--s${s})"`:''}>${fmt(v)}</span>
        <span class="l">${esc(labelOf(k,S.gran))}</span></button>`;
    }).join('')+'</div>';
  }

  const nm=UNAME[S.unit];
  return `<section class="card">${bar()}
    <h2>Календарь запусков</h2>
    <p class="muted" style="margin:0 0 12px;font-size:12px">${esc(un.hint)}. Клик по ячейке показывает, что внутри.</p>
    ${body}
    <div class="legend">
      <span>меньше</span><span class="lgsteps">${[0,1,2,3,4,5].map(i=>`<i style="background:var(--s${i})"></i>`).join('')}</span>
      <span>больше (до ${fmt(max)} в ячейке)</span>
      ${S.gran==='day'?'<span>приглушённые ячейки - выходные и нерабочие дни</span>':''}
    </div>
    <div class="cellsum">Всего за период: <b>${fmt(total)}</b> ${plural(Math.round(total),nm[0],nm[1],nm[2])}</div>
  </section>`;
}

/* ---------- таблица по клику: сделки, внутри изделия ---------- */
const openRows = new Set();

// Какие сделки попадают в выбранную ячейку. Для «сделок» отбор по дате входа на стадию
// «Расчёт», для «изделий» и «штук» по дате создания карточки смарта: у единиц разные
// источники, и период должен считаться по тому же источнику, что и календарь.
function dealsInSel(){
  if(!S.sel) return [];
  if(S.unit==='deals') return D.dealsTable.filter(d=>d.runs.some(inSel));
  const ids=new Set(D.smartRows.filter(r=>inSel(r.d)&&r.dealId).map(r=>r.dealId));
  const noDeal=D.smartRows.filter(r=>inSel(r.d)&&!r.dealId);
  const list=D.dealsTable.filter(d=>ids.has(d.id));
  if(noDeal.length) list.push({id:'(без сделки)', runs:[], items:noDeal.length,
    qty:noDeal.reduce((s,r)=>s+(r.qty||0),0), stage:null, out:null, orphan:true,
    stages:[...new Set(noDeal.map(r=>r.stage))]});
  return list;
}
function itemsOfDeal(id){
  return (id==='(без сделки)'
    ? D.smartRows.filter(r=>!r.dealId&&inSel(r.d))
    : D.smartRows.filter(r=>r.dealId===id)).sort((a,b)=>a.d<b.d?1:-1);
}

const dcell = v => v ? dru(v) : '<span class="muted">-</span>';
function detail(id){
  const its=itemsOfDeal(id);
  if(!its.length) return `<div class="dcard"><span class="muted">По этой сделке карточек в смарте «Расчёт» нет.
    Значит расчёт вели без карточки либо она заведена до 01.04.</span></div>`;
  const qty=its.reduce((s,i)=>s+(i.qty||0),0);
  const byStage={}; for(const i of its) byStage[i.stage]=(byStage[i.stage]||0)+1;
  const per=S.sel?its.filter(i=>inSel(i.d)).length:its.length;
  const sum=[
    ['изделий', its.length + (per!==its.length?` <span class="muted">(в периоде ${per})</span>`:'')],
    ['штук', fmt(qty)],
    ['стадии', Object.entries(byStage).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')],
    ['первое', dcell(its[its.length-1].d)],
    ['последнее', dcell(its[0].d)],
  ].map(([l,v])=>`<span><b>${l}</b>${v}</span>`).join('');
  const cols = D.public
    ? ['Карточка','Изделие','Стадия','Вид расчёта','Согласование чертежа','Тип','Направление','Штук','Создана','Смена стадии','В производство','Договор','Устный срок','Готовность']
    : ['Карточка','Изделие','Стадия','Вид расчёта','Согласование чертежа','Конструктор','Исполнитель','Тип','Направление','Штук','Сумма','Создана','Смена стадии','В производство','Договор','Устный срок','Готовность'];
  const rows=its.map(i=>{
    const inP=S.sel&&inSel(i.d);
    const q=i.qty==null?'<span class="muted">-</span>':`${fmt(i.qty)}${i.qtySrc==='поле'?'<span class="muted" title="из поля «Кол-во товара», товарных строк нет">*</span>':''}`;
    const cells=[
      `<span style="font-variant-numeric:tabular-nums">${esc(i.id)}</span>`,
      `<span class="itname" title="${esc(i.t)}">${esc(i.t)}</span>`,
      `<span class="pill">${esc(i.stage)}</span>`,
      esc(i.kind||'')||'<span class="muted">-</span>',
      esc(i.draw||'')||'<span class="muted">-</span>',
      ...(D.public?[]:[esc(i.constructor||'')||'<span class="muted">-</span>', esc(i.executor||'')||'<span class="muted">-</span>']),
      esc(i.type||'')||'<span class="muted">-</span>',
      esc(i.dir||'')||'<span class="muted">-</span>',
      `<span class="n">${q}</span>`,
      ...(D.public?[]:[i.opportunity?rub(i.opportunity):'<span class="muted">-</span>']),
      dcell(i.d), dcell(i.moved), dcell(i.toProd), dcell(i.contract), dcell(i.verbal), dcell(i.ready),
    ];
    return `<tr${inP?' style="font-weight:500"':''}>`+cells.map((c,k)=>`<td${k>=cells.length-6||/class="n"/.test(c)?' class="n"':''}>${c}</td>`).join('')+'</tr>';
  }).join('');
  return `<div class="dcard"><div class="dsum">${sum}</div>
    <div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th${/Штук|Сумма|Создана|стадии|производство|Договор|срок|Готовность/.test(c)?' class="n"':''}>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="note" style="margin:8px 0 0">Звёздочка у количества значит, что товарных строк нет и взято поле «Кол-во товара».
    Жирным выделены изделия, попавшие в выбранный период.</p></div>`;
}

function table(){
  if(!S.sel) return `<section class="card"><h2>Сделки и изделия</h2>
    <p class="sec" style="margin:0">Кликни ячейку календаря, чтобы увидеть, что в ней.</p></section>`;
  const ds=dealsInSel().sort((a,b)=>{
    const ak=a.runs[0]||a.firstItem||'', bk=b.runs[0]||b.firstItem||'';
    return ak<bk?1:ak>bk?-1:0;
  });
  const tQty=ds.reduce((s,d)=>s+d.qty,0), tIt=ds.reduce((s,d)=>s+d.items,0);
  const head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px">
    <h2 style="margin:0">Сделки и изделия · ${esc(labelOf(S.sel.k,S.sel.gran))}</h2>
    <button class="chip" data-clear>× сбросить выбор</button></div>`;
  const cols = D.public
    ? ['','Сделка','Стадия сделки','Запусков расчёта','Изделий','Штук','Первый запуск','Последний']
    : ['','Сделка','Название','Менеджер','Сумма','Стадия сделки','Запусков расчёта','Изделий','Штук','Первый запуск','Последний'];
  const rows=ds.map(d=>{
    const op=openRows.has(d.id);
    const runsIn=d.runs.filter(inSel).length;
    const cells=[
      `<span class="chev">›</span>`,
      d.orphan?'<span class="muted">без сделки</span>':`<span style="font-variant-numeric:tabular-nums">${esc(d.id)}</span>`,
      ...(D.public?[]:[`<span class="itname">${esc(String(d.title||'').slice(0,50))}</span>`, esc(d.mgr||'')||'<span class="muted">-</span>', d.budget?rub(d.budget):'<span class="muted">-</span>']),
      d.stage?`<span class="pill ${d.out}">${esc(d.stage)}</span>`:'<span class="muted">-</span>',
      `<span class="n">${d.runs.length}${runsIn&&runsIn!==d.runs.length?` <span class="muted">(${runsIn} в периоде)</span>`:''}</span>`,
      `<span class="n">${d.items}</span>`,
      `<span class="n">${fmt(d.qty)}</span>`,
      dcell(d.runs[0]||d.firstItem), dcell(d.runs[d.runs.length-1]||d.lastItem),
    ];
    const tr=`<tr class="lvl1${op?' open':''}" data-deal="${esc(d.id)}">`+
      cells.map((c,k)=>`<td${/class="n"/.test(c)||k>=cells.length-2?' class="n"':''}>${c}</td>`).join('')+'</tr>';
    return tr + (op?`<tr><td class="dwrap" colspan="${cols.length}">${detail(d.id)}</td></tr>`:'');
  }).join('');
  return `<section class="card">${head}
    <div class="muted" style="margin:0 0 10px;font-size:12px">${ds.length} ${plural(ds.length,'сделка','сделки','сделок')} · ${tIt} ${plural(tIt,'изделие','изделия','изделий')} · ${fmt(tQty)} ${plural(Math.round(tQty),'штука','штуки','штук')} · клик по строке раскрывает изделия</div>
    <div class="scroll" style="overflow-x:auto"><table><thead><tr>${cols.map((c,k)=>`<th${k>=cols.length-2||/Запусков|Изделий|Штук|Сумма/.test(c)?' class="n"':''}>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${D.public?'<p class="note">Публичная версия: без названий сделок, сумм и фамилий. Название изделия это спецификация продукта, имён заказчиков в нём нет.</p>':''}
  </section>`;
}

/* ---------- сноска ---------- */
function foot(){
  const s=D.smart;
  return `<p class="note" style="margin:6px 2px 0">
    Сделки считаются по воронке C49, дубли одной сделки за день схлопнуты (${D.totals.rows} строк истории → ${D.totals.events} событий).
    ${s?`Изделия и штуки из смарта «Расчёт»: ${s.items} карточек, штуки из товарных строк у ${s.fromProductRows}, из поля «Кол-во товара» у ${s.fromText}, без количества ${s.noQty}.`
       :'Изделия и штуки станут доступны после первой выгрузки смарта «Расчёт».'}
    Март 2026 исключён как месяц переезда из amoCRM. Считаются переходы в CRM: расчёт, сделанный без движения стадии, сюда не попадает.
    ${D.public?'Публичная версия: без названий, сумм и фамилий.':''}</p>`;
}

/* ---------- рендер ---------- */
function render(){
  $('#app').innerHTML = calendar() + table() + foot();
  $('#app').querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{ S.unit=b.dataset.unit; S.sel=null; openRows.clear(); render(); });
  $('#app').querySelectorAll('[data-gran]').forEach(b=>b.onclick=()=>{ S.gran=b.dataset.gran; S.sel=null; openRows.clear(); render(); });
  $('#app').querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    S.sel = (S.sel && S.sel.k===k) ? null : {k, gran:S.gran}; openRows.clear();
    render();
    if(S.sel) document.querySelectorAll('.card')[1]?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('#app').querySelectorAll('tr.lvl1').forEach(tr=>tr.onclick=()=>{
    const k=tr.dataset.deal;
    openRows.has(k)?openRows.delete(k):openRows.add(k);
    render();
  });
  const c=$('#app').querySelector('[data-clear]'); if(c) c.onclick=()=>{ S.sel=null; openRows.clear(); render(); };
}

$('#stamp').textContent =
  `Снимок Bitrix24 ${String(D.snapshot).slice(0,10)}`
  + (D.smartSnapshot?` · смарт «Расчёт» ${String(D.smartSnapshot).slice(0,10)}`:' · смарт «Расчёт» ещё не выгружен')
  + ` · запуски с ${dru(D.from)}`
  + (D.public?' · публичная версия':'')
  + ` · собрано ${String(D.bakedAt).slice(0,16).replace('T',' ')}`;

$('#tgl').onclick = () => {
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
};

render();

const tt=$('#tt');
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(!el)return;
  tt.textContent=el.dataset.tip; tt.style.display='block';
  const r=el.getBoundingClientRect();
  tt.style.left=Math.min(innerWidth-270,r.left)+'px';
  tt.style.top=Math.max(6,r.top-tt.offsetHeight-8)+'px'; });
document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) tt.style.display='none'; });
</script></body></html>
