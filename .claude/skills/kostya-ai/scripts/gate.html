<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__TITLE__</title>
<style>
:root{
  --bg:#06121a; --panel:#0b1a24; --panel2:#0e2130; --line:#233242; --line2:#2a3a4a;
  --tx:#dfe9f0; --mut:#5d7484; --acc:#22D3EE; --acc2:#0E7490;
  --ok:#34D399; --warn:#f59e0b; --bad:#FF4438;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}

/* ---------- гейт ---------- */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 600px at 50% -10%,#0d2333,#06121a)}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:26px}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.brand b{color:var(--acc);letter-spacing:.14em}
.box h1{font-size:19px;margin:0 0 10px;font-weight:600}
.box p{color:var(--mut);font-size:13px;margin:0 0 18px}
form{display:flex;flex-direction:column;gap:10px}
input[type=password]{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
  padding:12px 14px;border-radius:9px;font:inherit;font-size:15px;width:100%}
input[type=password]:focus{outline:2px solid var(--acc2);outline-offset:1px;border-color:var(--acc2)}
button{background:var(--acc2);border:0;color:#fff;padding:12px 16px;border-radius:9px;
  cursor:pointer;font:inherit;font-weight:600}
button:hover{background:#0891b2}
button:disabled{opacity:.55;cursor:progress}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.err{color:var(--bad);font-size:13px;min-height:19px}
.hint{color:var(--mut);font-size:11.5px;line-height:1.5;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line)}

/* ---------- приложение ---------- */
.app{display:none;min-height:100%}
.app.on{display:block}
@media(prefers-reduced-motion:no-preference){.app.on{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="brand"><b>GENGROUP</b> · учебная платформа</div>
    <h1>__TITLE__</h1>
    <p>__SUBTITLE__</p>
    <form id="f" autocomplete="on">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" autofocus>
      <span class="err" id="err" role="alert"></span>
      <button type="submit" id="go">Войти</button>
    </form>
    <div class="hint">
      Страница зашифрована целиком (AES-256-GCM, ключ из пароля через PBKDF2).
      Без пароля в файле нет читаемых данных, включая просмотр исходного кода.
      Внутри персональные данные: не пересылайте файл и не оставляйте открытым на общем экране.
    </div>
  </div>
</div>

<div class="app" id="app"></div>

<script id="sealed" type="application/json">__SEALED__</script>
<script>
(function(){
  const gate=document.getElementById('gate'), app=document.getElementById('app'),
        f=document.getElementById('f'), pw=document.getElementById('pw'),
        err=document.getElementById('err'), go=document.getElementById('go');
  const S=JSON.parse(document.getElementById('sealed').textContent);
  const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));

  async function unseal(pass){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b(S.salt),iterations:S.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    // AES-GCM аутентифицирован: неверный пароль не «расшифрует мусор», а бросит исключение.
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(S.iv)},key,b(S.ct));
    return new TextDecoder().decode(pt);
  }

  f.addEventListener('submit', async e=>{
    e.preventDefault();
    err.textContent=''; go.disabled=true; go.textContent='Расшифровываю…';
    try{
      const html=await unseal(pw.value);
      gate.remove();
      app.innerHTML=html;
      app.classList.add('on');
      // Скрипты, пришедшие из расшифрованного HTML, innerHTML не выполняет: пересоздаём.
      app.querySelectorAll('script').forEach(old=>{
        const s=document.createElement('script');
        for(const a of old.attributes) s.setAttribute(a.name,a.value);
        s.textContent=old.textContent;
        old.replaceWith(s);
      });
      document.title=(app.querySelector('h1')?.textContent||document.title).trim();
      pw.value='';
    }catch(_){
      err.textContent='Неверный пароль';
      go.disabled=false; go.textContent='Войти';
      pw.select();
    }
  });
})();
</script>
</body>
</html>
