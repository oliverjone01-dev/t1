name: Probe полей цены OZON (разведка цены с витрины)

on:
  workflow_dispatch:
    inputs:
      offer:
        description: "Offer ID для дампа (пусто = первые 3)"
        required: false
        default: "GGT-35-1-3-100-180"

permissions:
  contents: read

env:
  OZON_SELLER_CLIENT_ID: ${{ secrets.OZON_SELLER_CLIENT_ID }}
  OZON_SELLER_API_KEY: ${{ secrets.OZON_SELLER_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Probe полей цены
        run: npx tsx src/scripts/ozon/seller-prices-probe.ts "${{ github.event.inputs.offer }}"
