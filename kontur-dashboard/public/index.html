 'ct-idx': ['Разрыв между числом страниц и числом в индексе закрывается раньше нового контента.',
            'Исключённые страницы смотри по причине, а не по количеству.',
            'Страница без внутренних ссылок в индекс не попадёт, сколько её ни проси.']
};
function reading(v){
  const r = typeof RD[v]==='function' ? RD[v]() : RD[v]; if(!r) return '';
  return card('Что смотреть','Три правила чтения этого экрана',
    '<div class="space-y-2.5 t-small leading-snug">'
    + r.map((x,i)=>'<div class="flex items-start gap-2.5">'
      + '<span class="w-5 h-5 rounded-md shrink-0 flex items-center justify-center t-micro font-bold num" style="background:color-mix(in oklab, '+P(i)+' 18%, transparent);color:var(--text-strong)">'+(i+1)+'</span>'
      + '<span>'+esc(x)+'</span></div>').join('')
    + '</div>');
}


/* ============ ГРАФИКИ ============
   Только пресеты кита (kontur-ds/kit/charts.js): цвета из --cat-1..5 текущей темы,
   слоты в фиксированном порядке; одна серия без легенды, две и больше с легендой;
   подпись значения только на конце; двух осей Y нет, разные ряды идут через индекс.
   Пустой ряд кит рисует как отсутствие данных, а не пустой рамкой.
   Hex в этом файле запрещён: tools/check_dash.py. */
const wkCats = ['н-1','н-2','н-3','н-4','н-5','н-6','н-7'];
const has = id => !!document.getElementById(id);

function draw(){
  const d = V(), dd = DD(), sl = slice();
  const cats = sl.cur.map(r => ruD(r.date));
  const pick = f => sl.cur.map(r => r[f] == null ? null : r[f]);

  /* запросы в топ-10 по дням: одна серия */
  if(has('c-h10')) KS.charts.line('c-h10', { cats, data:pick('top10'), name:'Топ-10', slot:3, h:260 });
  /* видимость в ИИ по дням */
  if(has('c-hvis')) KS.charts.line('c-hvis', { cats, data:pick('vis'), name:'Видимость, %', slot:1, h:280, area:true, suffix:'%' });
  /* топ-10 и топ-50 вместе: одна природа, разный масштаб, логарифмическая ось */
  if(has('c-pos')) KS.charts.multi('c-pos', { cats, h:320, log:true, series:[
    { name:'Топ-10', data:pick('top10'), slot:3 }, { name:'Топ-50', data:pick('top50'), slot:2 }] });
  /* всё на одной шкале через индекс: первая точка периода это 100 */
  if(has('c-idx100')) KS.charts.index('c-idx100', { cats, h:300, series:[
    { name:'Топ-10', data:pick('top10'), slot:3 }, { name:'Топ-50', data:pick('top50'), slot:2 },
    { name:'Видимость', data:pick('vis'), slot:1 }] });
  /* визиты Метрики: две серии одной природы */
  if(has('c-ym') && d.ym){
    const days = d.ym.days || [];
    const cut = days.slice(Math.max(0, days.length - Math.min(PERIODS[PERIOD], days.length)));
    KS.charts.multi('c-ym', { cats:cut.map(r => ruD(r.date)), h:300, area:true, series:[
      { name:'Визиты', data:cut.map(r => r.visits), slot:3 }, { name:'Из поиска', data:cut.map(r => r.search_visits), slot:2 }] });
  }
  /* воронка топ-N: одна серия полосами */
  if(has('c-fun')){
    const rows = [['топ-1',d.top1],['топ-3',d.top3],['топ-5',d.top5],['топ-10',d.top10],['топ-50',d.top50]]
      .filter(r => r[1] && r[1].v != null);
    KS.charts.hbar('c-fun', { cats:rows.map(r => r[0]), data:rows.map(r => r[1].v), name:'Запросов', slot:3, h:260 });
  }
  /* динамика топ-50 по неделям: одна серия */
  if(has('c-wk')) KS.charts.line('c-wk', { cats:wkCats, data:dd.wk, name:'Топ-50', slot:2, h:270 });
  /* видимость ИИ по неделям: площадь, одна серия */
  if(has('c-aiwk')) KS.charts.line('c-aiwk', { cats:wkCats, data:dd.aiwk, name:'Видимость, %', slot:1, h:280, area:true, suffix:'%' });
  /* вес страниц: десять самых сильных страниц полосами. Площадь дерева читается хуже
     длины полосы, и у дерева нет законного места для подписи длинного адреса. */
  if(has('c-tree')){
    const top = (d.pg || []).map(r => { let u = String(r.url || ''); try{ u = new URL(u).pathname; }catch(e){} return [u, r.keywords_top50 || 0]; })
      .sort((a, b) => b[1] - a[1]).slice(0, 10);
    KS.charts.hbar('c-tree', { cats:top.map(r => r[0]), data:top.map(r => r[1]), name:'Запросов в топ-50', slot:3, h:Math.max(220, 34 * top.length + 40) });
  }
  /* объём рекламы у первой пятёрки конкурентов: настоящие объявления из выгрузки keys.so */
  if(has('c-ads')){
    const top = (d.adc || []).slice(0, 5);
    KS.charts.hbar('c-ads', { cats:top.map(r => r.domain), data:top.map(r => r.ads_count || 0), name:'Объявлений', slot:3, h:260 });
  }
}


const $id = x => document.getElementById(x);
function setP(p){ if(DB.projects[p]){ CUR = p; render(); } }
function setPer(v){ if(PERIODS[v]){ PERIOD = v; $id('per').value = v; render(); } }

function render(){
  const s = screens(), fn = s[VIEW] || s.obzor;
  if(!s[VIEW]) VIEW = 'obzor';
  const mth = method(VIEW), rd = reading(VIEW);
  const tail = (rd || mth) ? '<div class="ks-grid-2">' + (rd || '') + (mth || '') + '</div>' : '';
  $id('view').innerHTML = '<div class="ks-fade"><div class="ks-stack scr">' + fn() + tail + '</div></div>';
  KS.charts.prune();   /* графики прежнего экрана: их контейнеры только что исчезли */
  $id('nav').innerHTML = KS.nav(NAV, VIEW);
  $id('seg').querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === CUR)));
  const own = ownSnaps(), pend = pendingSnap();
  $id('stamp').textContent = V().name + ' · ' + V().dom
    + (own.length ? ' · свой съём ' + ruD(own[own.length-1]) : ' · своих съёмов нет')
    + (pend ? ' · срез ' + ruD(pend) + ' не записан' : '');
  $id('per').value = PERIOD;
  $id('foot').textContent = 'Сборка данных ' + (DB.built || '').slice(0,10).split('-').reverse().join('.')
    + '. Метрика: ' + (V().ym ? 'подключена' : 'нет') + '. Директ: ' + (V().direct ? 'выгрузка есть' : 'нет') + '.';
  $id('theme').innerHTML = KS.theme.icon();
  KS.route.set({ project:CUR, view:VIEW, period:PERIOD });
  KS.ticker.run($id('view'));
  scheduleDraw();
}
/* Несколько отрисовок в одном кадре дают одну перерисовку графиков: иначе второй вызов
   уничтожает график посреди анимации первого, и SVG получает размеры NaN. */
let _raf = 0;
function scheduleDraw(){ cancelAnimationFrame(_raf); _raf = requestAnimationFrame(() => { draw(); if($id('calcout')) recalc(); }); }

/* Палитра команд (Cmd+K, Ctrl+K): все экраны, проекты, периоды и действия. */
function commands(){
  const items = [];
  NAV.forEach(g => (g.ch ? g.ch.map(c => [g.t, c]) : [[null, g]]).forEach(([grp, c]) =>
    items.push({ group:'Экраны', label:c.t, hint:grp || '', icon:g.i, keywords:grp || '',
                 run:() => KS.vt(() => { go(c.id); window.scrollTo(0, 0); }) })));
  Object.entries(DB.projects).forEach(([k, p]) =>
    items.push({ group:'Проект', label:p.name, hint:p.dom, icon:'layers', run:() => setP(k) }));
  Object.keys(PERIODS).forEach(k =>
    items.push({ group:'Период', label:PERIOD_LABEL[k], icon:'calendar', run:() => setPer(k) }));
  items.push(
    { group:'Действия', label:'Сменить тему', icon:'moon', keywords:'тёмная светлая', run:() => KS.theme.toggle() },
    { group:'Действия', label:'Переключить плотность', hint:'просторно или компактно', icon:'rows', keywords:'компактно просторно', run:() => KS.density.toggle() },
    { group:'Действия', label:'Скопировать ссылку на экран', icon:'link', run:() => {
        const bad = () => KS.toast('Не удалось скопировать: выдели адрес вручную', 'warn');
        try{ navigator.clipboard.writeText(location.href).then(() => KS.toast('Ссылка на экран скопирована'), bad); }catch(e){ bad(); } } });
  return items;
}

function appStart(){
  const g = $id('gate'); if(g) g.remove();
  $id('app').hidden = false;
  /* прежние ключи хранения: выбор темы и периода не теряется при переходе на кит */
  try{ const t = localStorage.getItem('kontur-theme');
       if(t && !localStorage.getItem('ks-theme')) localStorage.setItem('ks-theme', t);
       const sp = localStorage.getItem('kontur-period'); if(sp && PERIODS[sp]) PERIOD = sp; }catch(e){}

  $id('seg').innerHTML = Object.entries(DB.projects).map(([k, p]) =>
    '<button type="button" data-p="' + k + '" aria-pressed="false">' + esc(p.name) + '</button>').join('');
  KS.seg.wire($id('seg'));
  $id('cmdkb').outerHTML = KS.cmdk.button('Поиск');
  KS.cmdk.set(commands());

  KS.charts.onTheme = () => render();
  KS.navWire($id('nav'), v => KS.vt(() => { VIEW = v; render(); window.scrollTo(0, 0); }));
  $id('seg').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if(b) setP(b.dataset.p); });
  $id('per').addEventListener('change', e => {
    PERIOD = e.target.value; try{ localStorage.setItem('kontur-period', PERIOD); }catch(x){} render(); });
  $id('theme').addEventListener('click', () => KS.theme.toggle());
  KS.shell.init({ sidebar:'#sb', backdrop:'#bd', menu:'#menu' });

  /* Старт: сначала адрес, потом тема. Смена темы перерисовывает экран и переписывает
     адрес, поэтому присланную ссылку надо прочитать до неё. */
  const r = KS.route.parse();
  KS.theme.init();
  if(r.project && DB.projects[r.project]) CUR = r.project;
  if(r.view && screens()[r.view]) VIEW = r.view;
  if(r.period && PERIODS[r.period]) PERIOD = r.period;
  render();

  const densUi = () => { const b = $id('dens'); b.innerHTML = KS.density.icon();
    b.setAttribute('data-tip', 'Плотность: ' + KS.density.label().toLowerCase()); };
  $id('dens').addEventListener('click', () => KS.density.toggle());
  document.addEventListener('ks:density', () => { densUi(); KS.toast('Плотность: ' + KS.density.label().toLowerCase()); });
  densUi();
}

</script>
<script>
/* Окно пароля. Единственный код страницы, который читается без пароля.
   В опубликованной странице всё приложение вместе с данными и китом лежит в блоке
   app-sealed шифротекстом: PBKDF2-SHA256 на 600 000 итераций, AES-256-GCM,
   та же схема, что у академии. Неверный пароль не проходит проверку GCM,
   хэша пароля в странице нет, подбирать его офлайн можно только через
   медленный PBKDF2. В локальной сборке блока нет, и приложение стартует сразу.
   Тема и плотность ставятся до пароля: окно не мигает светлым у тёмной темы. */
(function(){
  try{ const t = localStorage.getItem('ks-theme') || localStorage.getItem('kontur-theme');
       if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
       if(localStorage.getItem('ks-density') === 'compact') document.documentElement.setAttribute('data-density', 'compact'); }catch(x){}
  const box = document.getElementById('app-sealed');
  if(!box){ appStart(); return; }
  const S = JSON.parse(box.textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  async function derive(pass){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(S.salt), iterations:S.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  async function open(key){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(S.iv)}, key, b64(S.ct));
    const el = document.createElement('script');
    el.textContent = new TextDecoder().decode(pt);
    document.head.appendChild(el);
    appStart();
  }
  const form = document.getElementById('gateForm'), err = document.getElementById('gateErr'),
        btn = form.querySelector('button');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Проверяю...';
    try{
      const key = await derive(document.getElementById('gatePass').value);
      await open(key);
      try{ sessionStorage.setItem('kontur.key', toB64(await crypto.subtle.exportKey('raw', key))); }catch(x){}
    }catch(x){
      err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Войти';
    }
  });
  let saved = null; try{ saved = sessionStorage.getItem('kontur.key'); }catch(x){}
  if(saved){
    crypto.subtle.importKey('raw', b64(saved), {name:'AES-GCM'}, false, ['decrypt'])
      .then(open).catch(() => { try{ sessionStorage.removeItem('kontur.key'); }catch(x){} });
  }
})();
</script>
