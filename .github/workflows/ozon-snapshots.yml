name: OZON snapshots (прямой, без n8n)

# Ночной пайплайн OZON БЕЗ n8n: прямые клиенты src/scripts/ozon/* + connector. ЗАМЕНЯЕТ
# update-snapshots.yml (n8n, расписание отключено). Делает всё, что делал n8n-синк: снимки
# (pnl-sku/skus/pnl/ads + ads_periods 7/30/90), дневную историю (backfill, прямой Seller),
# пересборку сайта и коммит. Креды: GitHub Secrets, либо (временно, решение владельца)
# workflow_dispatch input с маскировкой (::add-mask:: в guard-шаге). Каждый снимок проходит
# дельта-гейт перед заменой (FENIX G3): просадка ключевой метрики >40% -> снимок НЕ заменяется.

on:
  schedule:
    - cron: "0 6 * * *" # ~09:00 МСК; работает после добавления OZON_* в Secrets
  workflow_dispatch:
    inputs:
      ozon_seller_client_id:
        description: "OZON Seller Client-Id (пусто = из секрета)"
        required: false
      ozon_seller_api_key:
        description: "OZON Seller Api-Key (пусто = из секрета)"
        required: false
      ozon_perf_client_id:
        description: "OZON Performance client_id (пусто = из секрета)"
        required: false
      ozon_perf_secret:
        description: "OZON Performance secret (пусто = из секрета)"
        required: false

permissions:
  contents: write

concurrency:
  group: ozon-data # общий с update-snapshots/sync - не гонимся за один data/
  cancel-in-progress: false

env:
  OZON_SELLER_CLIENT_ID: ${{ secrets.OZON_SELLER_CLIENT_ID || github.event.inputs.ozon_seller_client_id }}
  OZON_SELLER_API_KEY: ${{ secrets.OZON_SELLER_API_KEY || github.event.inputs.ozon_seller_api_key }}
  OZON_PERF_CLIENT_ID: ${{ secrets.OZON_PERF_CLIENT_ID || github.event.inputs.ozon_perf_client_id }}
  OZON_PERF_SECRET: ${{ secrets.OZON_PERF_SECRET || github.event.inputs.ozon_perf_secret }}

jobs:
  snapshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Маскировать креды и проверить наличие
        run: |
          set -euo pipefail
          echo "::add-mask::$OZON_SELLER_API_KEY"; echo "::add-mask::$OZON_SELLER_CLIENT_ID"
          echo "::add-mask::$OZON_PERF_SECRET"; echo "::add-mask::$OZON_PERF_CLIENT_ID"
          if [ -z "${OZON_SELLER_API_KEY:-}" ] || [ -z "${OZON_SELLER_CLIENT_ID:-}" ]; then
            echo "::error::OZON Seller креды не заданы (ни Secrets, ни input)."; exit 1
          fi
          echo "Seller-креды на месте. Perf-креды: ${OZON_PERF_CLIENT_ID:+есть}${OZON_PERF_CLIENT_ID:-нет (реклама пропустится)}"

      - name: Снимки напрямую (с дельта-гейтом перед заменой)
        run: |
          set -euo pipefail
          # validate-snapshot 3-м аргументом получает прошлый снимок -> дельта-гейт (FENIX G3).
          # Пишем в data/ И fixtures/ (сборка читает то одно, то другое; точное выравнивание
          # read-путей - часть cutover, Этап 3). put = validate+разложить в оба места.
          put () { # tmp, type, name
            local tmp="$1" type="$2" name="$3"
            npx tsx src/scripts/validate-snapshot.ts "$type" "$tmp" "fixtures/$name"
            cp "$tmp" "data/$name"; cp "$tmp" "fixtures/$name"; rm -f "$tmp"
          }
          npx tsx src/scripts/ozon/pnl-sku.ts "" "" /tmp/pnlsku.json; put /tmp/pnlsku.json pnlsku pnl_sku_30d.json
          npx tsx src/scripts/ozon/skus.ts 30 /tmp/skus.json;        put /tmp/skus.json   skus   skus_live_30d.json
          # P&L канал: сырой -> snapshot-pnl пишет data/pnl_30d.json, дублируем в fixtures
          npx tsx src/scripts/ozon/pnl.ts "" "" /tmp/pnl_raw.json
          npx tsx src/scripts/snapshot-pnl.ts /tmp/pnl_raw.json
          cp data/pnl_30d.json fixtures/pnl_30d.json
          if [ -n "${OZON_PERF_CLIENT_ID:-}" ]; then
            npx tsx src/scripts/ozon/ads.ts 30 /tmp/ads.json; put /tmp/ads.json ads ads_30d.json
            # Реклама по периодам 7/30/90 - период-точность снимка без живого запроса.
            # Заменяем только при валидном p30 (есть id), иначе прошлый файл не трогаем.
            AP=/tmp/ads_periods.json; echo '{}' > "$AP"
            for d in 7 30 90; do
              t=$(mktemp); prev=$(mktemp)
              # Прошлый p$d как база дельта-гейта (FENIX G4): просадка spend >40% -> снимок не берём.
              node -e "try{const a=require('./data/ads_periods.json');const p=a['p$d'];if(p)require('fs').writeFileSync('$prev',JSON.stringify(p));}catch(e){}"
              [ -s "$prev" ] || prev=""
              if npx tsx src/scripts/ozon/ads.ts "$d" "$t" && npx tsx src/scripts/validate-snapshot.ts ads "$t" $prev; then
                node -e "const fs=require('fs');const o=JSON.parse(fs.readFileSync('$AP'));o['p$d']=JSON.parse(fs.readFileSync('$t'));fs.writeFileSync('$AP',JSON.stringify(o));"
              else echo "::warning::ads_periods p$d не удался (или дельта-гейт)"; fi
            done
            if node -e "const a=require('$AP');process.exit((a.p30&&((a.p30.top_spend||[])[0]||{}).id!==undefined)?0:1)"; then
              cp "$AP" data/ads_periods.json; cp "$AP" fixtures/ads_periods.json; echo "ads_periods обновлён"
            else echo "::warning::ads_periods не обновлён (нет id в p30)"; fi
          else
            echo "::warning::OZON_PERF_* нет - снимки рекламы пропущены"
          fi

      - name: Дневная история (прямой Seller, догрузка недостающих дней)
        run: |
          set -euo pipefail
          # backfill сам тянет от последнего дня истории до вчера (самовосстановление после простоя).
          npm run backfill

      - name: Пересборка сайта из свежих снимков
        run: |
          set -euo pipefail
          npm run join:cogs
          npm run build:site
          npm run katya # иначе katya-*.html отстают от свежих данных в коммите

      - name: Commit (если есть изменения)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Стейджим весь analytics-mvp: снимки (data/+fixtures/), история, пересобранный сайт.
          git add -A analytics-mvp
          if git diff --staged --quiet; then echo "снимки без изменений"; exit 0; fi
          git commit -m "data: прямые снимки OZON (без n8n) $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1
