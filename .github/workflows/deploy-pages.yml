name: Deploy to GitHub Pages

# Единый сборщик сайта GENGROUP. На репозиторий - один Pages-сайт, поэтому ВСЕ
# проекты собираются одним воркфлоу и раскладываются по подпапкам:
#   /                  - Аналитика OZON, БОЙ (из ветки main)
#   /preview/          - Аналитика OZON, ПРЕВЬЮ (из рабочей ветки)
#   /smm/              - SMM-стратегия, БОЙ (из ветки main)
#   /smm/preview/      - SMM-стратегия, ПРЕВЬЮ (из рабочей ветки)
#   /seo/              - GG-SEO/GEO Монстр, БОЙ (из ветки main, статика public/)
#   /markplan/         - GG-MarkPlan 2026 (маркетинговый план по 5 брендам), БОЙ (из main, статика public/)
#   /rop/              - РОП-дашборд, БОЙ (из ветки rop-dashboard-v1, эталон Димы)
#   /rop-preview/      - РОП-дашборд, ПРЕВЬЮ (из ветки ozon-dashboard-dima-fork, изолированная копия Ивана)
#   /direct/           - Дашборд Яндекс.Директ, БОЙ (из main, данные direct-snapshots.yml)
#   /direct-preview/   - Дашборд Яндекс.Директ, ПРЕВЬЮ (из рабочей ветки)
#   /prod/             - Дашборд Производство, БОЙ (из ветки prod-dashboard-v1)
#   /op-gm/            - Автоматизация ОП ГМ (из ветки op-gm-automation-v1, статика public/)
#   /messages/         - GG Message Automation (из ветки claude/gg-message-automation-ffpwpd, статика public/)
#   /economics/        - Экономика сделок (из ветки economics-dashboard-v1, данные economics-cron.yml)
#   /integra/          - ИНТЕГРА 2.0, план GENTERO (из ветки claude/gentero-plan-03609o, статика public/)
# Прод (корни /, /smm/, /rop/, /prod/) меняется только при push в main / rop-dashboard-v1 / prod-dashboard-v1.
# Превью можно гонять вручную (workflow_dispatch) после пуша в рабочую ветку - бой не трогается.
# Аналитика проходит smoke-гейт контролов (jsdom) перед публикацией.
on:
  workflow_dispatch:
    inputs:
      preview_ref:
        description: "Ветка/реф для сборки превью-версий OZON и SMM"
        default: "claude/focused-davinci-tKJCt"
      rop_preview_ref:
        description: "Ветка/реф для сборки превью РОП-дашборда"
        default: "ozon-dashboard-dima-fork"
      direct_preview_ref:
        description: "Ветка/реф для сборки превью Директ-дашборда"
        default: "claude/token-verification-9re2i9"
  push:
    branches: [main]
    paths: [analytics-mvp/**, smm/**, gg-seo-geo-monster/**, GG-markplan-2026/**, yandex-direct/**, .github/workflows/deploy-pages.yml]
  # Авто-деплой после ежедневного синка данных. Пуш бота (GITHUB_TOKEN) сам по себе
  # не триггерит push-воркфлоу (защита GitHub от зацикливания), поэтому ловим завершение синка.
  # Источник один - прямой ночной синк OZON (ozon-snapshots); n8n удалён.
  workflow_run:
    workflows: ["OZON snapshots (прямой, без n8n)", "Direct snapshots (прямой, без n8n)", "GEO-monster harvest"]
    types: [completed]
  # СТРАХОВКА: гарантированная ежедневная пересборка сайта. Триггер workflow_run (после ночного
  # синка) в GitHub капризный - иногда пропускается, и свежие данные не попадают на сайт. Своё
  # расписание в 10:00 UTC (~13:00 МСК) - синк уже отработал (06:00 UTC), данные закоммичены,
  # деплой собирает сайт из свежих снимков. Так сайт обновляется сам каждый день, без ручного запуска.
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # Для workflow_run деплоим только при успешном синке; для push/dispatch - всегда.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # === БОЙ (из main) ===
      # Аналитика: сборка + smoke-гейт (hard gate), раскладка в корень.
      - name: Build analytics prod (main)
        working-directory: analytics-mvp
        run: |
          set -euo pipefail
          npm ci
          npm run fetch:live
          npm run build:site
          npm run katya
          npm run smoke
      - name: Assemble site (prod)
        env:
          HUB_PASS: ${{ secrets.HUB_PASS }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r analytics-mvp/public/. _site/
          # SMM: статика-плейсхолдер (свой build добавляется в сессии SMM)
          mkdir -p _site/smm
          cp -r smm/public/. _site/smm/
          # SEO/GEO Монстр (GEO-monster): статика public/ (конфиг внутри) + данные harvest
          mkdir -p _site/seo/data
          cp -r gg-seo-geo-monster/public/. _site/seo/
          if [ -d gg-seo-geo-monster/data ]; then cp -r gg-seo-geo-monster/data/. _site/seo/data/; fi
          # MarkPlan 2026: маркетинговый план по 5 брендам, статика public/ (данные в public/data/)
          mkdir -p _site/markplan
          cp -r GG-markplan-2026/public/. _site/markplan/
          # Пароль хаба: если задан секрет HUB_PASS - подменяем дефолтный хэш в index.html
          if [ -n "${HUB_PASS:-}" ]; then
            HASH=$(printf '%s' "$HUB_PASS" | sha256sum | cut -d' ' -f1)
            sed -i "s/window.HUB_PASS_HASH = \"[a-f0-9]*\"/window.HUB_PASS_HASH = \"$HASH\"/" _site/seo/index.html
            echo "HUB_PASS: хэш подменён из секрета"
          fi

      # === ПРЕВЬЮ (из рабочей ветки) ===
      # Если падает - бой всё равно публикуется (continue-on-error), поломка видна в логах.
      - name: Build preview (working branch)
        continue-on-error: true
        env:
          PREVIEW_REF: ${{ github.event.inputs.preview_ref || 'claude/focused-davinci-tKJCt' }}
        run: |
          set -euo pipefail
          git fetch origin "$PREVIEW_REF"
          git worktree add /tmp/preview FETCH_HEAD
          # аналитика-превью
          ( cd /tmp/preview/analytics-mvp && npm ci && npm run fetch:live && npm run build:site && npm run katya && npm run smoke )
          mkdir -p "$GITHUB_WORKSPACE/_site/preview"
          cp -r /tmp/preview/analytics-mvp/public/. "$GITHUB_WORKSPACE/_site/preview/"
          # smm-превью
          mkdir -p "$GITHUB_WORKSPACE/_site/smm/preview"
          cp -r /tmp/preview/smm/public/. "$GITHUB_WORKSPACE/_site/smm/preview/"

      # === РОП (ИЗОЛИРОВАННО, из ветки rop-dashboard-v1, в /rop/) ===
      # OZON (корень и /preview/) не затрагивается. Дашборд самодостаточный (данные Bitrix
      # запечены build-rop), поэтому только копируем готовый HTML - без npm/smoke. Падение
      # не валит OZON-деплой (continue-on-error). Временно, до вживления РОП в main.
      - name: Build ROP dashboard (isolated, /rop/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin rop-dashboard-v1
          git worktree add /tmp/rop FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/rop" "$GITHUB_WORKSPACE/_site/rop2"
          cp /tmp/rop/analytics-mvp/public/rop-command.html "$GITHUB_WORKSPACE/_site/rop/index.html"
          # /rop2/ - зеркало для обхода упрямых кэшей (прокси/CDN, игнорирующих query string)
          cp /tmp/rop/analytics-mvp/public/rop-command.html "$GITHUB_WORKSPACE/_site/rop2/index.html"
          # v.txt = штамп сборки: страница сверяет его со своим DATA.bakedAt и сама
          # перезагружается с кэш-бастером, если браузеру отдали устаревший HTML
          STAMP=$(grep -o '"bakedAt":"[^"]*"' /tmp/rop/analytics-mvp/public/rop-command.html | head -1 | cut -d'"' -f4)
          printf '%s' "$STAMP" | tee "$GITHUB_WORKSPACE/_site/rop/v.txt" > "$GITHUB_WORKSPACE/_site/rop2/v.txt"
          echo "РОП опубликован в /rop/ и /rop2/, сборка $STAMP ($(du -h /tmp/rop/analytics-mvp/public/rop-command.html | cut -f1))"

      # === ДИРЕКТ (из main, в /direct/; многостраничный) ===
      # Дашборд Яндекс.Директ: страницы запечены build.mjs из снимков yandex-direct/data/
      # (обновляет direct-snapshots.yml ночью). Токенов в HTML нет. Падение не валит сайт.
      - name: Build DIRECT dashboard (/direct/)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -d "yandex-direct/dashboard/public" ]; then
            mkdir -p "$GITHUB_WORKSPACE/_site/direct"
            cp -r yandex-direct/dashboard/public/. "$GITHUB_WORKSPACE/_site/direct/"
            echo "Директ опубликован в /direct/ ($(ls yandex-direct/dashboard/public | wc -l) страниц)"
          else
            echo "yandex-direct/dashboard/public отсутствует в main - пропуск"
          fi

      # === ДИРЕКТ-ПРЕВЬЮ (ИЗОЛИРОВАННО, из рабочей ветки, в /direct-preview/) ===
      - name: Build DIRECT preview (isolated, /direct-preview/)
        continue-on-error: true
        env:
          DIRECT_PREVIEW_REF: ${{ github.event.inputs.direct_preview_ref || 'claude/token-verification-9re2i9' }}
        run: |
          set -euo pipefail
          git fetch origin "$DIRECT_PREVIEW_REF"
          git worktree add /tmp/direct-preview FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/direct-preview"
          cp -r /tmp/direct-preview/yandex-direct/dashboard/public/. "$GITHUB_WORKSPACE/_site/direct-preview/"
          echo "Директ-превью опубликован в /direct-preview/ из $DIRECT_PREVIEW_REF"

      # === ПРОИЗВОДСТВО (ИЗОЛИРОВАННО, из ветки prod-dashboard-v1, в /prod/) ===
      # Аналог /rop/: дашборд самодостаточный (данные Bitrix СП 1086 запечены build-prod),
      # копируем готовый HTML - без npm/smoke. Падение не валит остальной сайт
      # (continue-on-error). Данные обновляет prod-cron.yml (ночью) -> prod-dashboard-v1.
      - name: Build PROD dashboard (isolated, /prod/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin prod-dashboard-v1
          git worktree add /tmp/prod FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/prod" "$GITHUB_WORKSPACE/_site/prod2"
          cp /tmp/prod/analytics-mvp/public/prod-command.html "$GITHUB_WORKSPACE/_site/prod/index.html"
          # /prod2/ - зеркало для обхода упрямых кэшей
          cp /tmp/prod/analytics-mvp/public/prod-command.html "$GITHUB_WORKSPACE/_site/prod2/index.html"
          # v.txt = штамп сборки для авто-обновления страницы при устаревшем кэше
          STAMP=$(grep -o '"bakedAt":"[^"]*"' /tmp/prod/analytics-mvp/public/prod-command.html | head -1 | cut -d'"' -f4)
          printf '%s' "$STAMP" | tee "$GITHUB_WORKSPACE/_site/prod/v.txt" > "$GITHUB_WORKSPACE/_site/prod2/v.txt"
          echo "Производство опубликовано в /prod/ и /prod2/, сборка $STAMP ($(du -h /tmp/prod/analytics-mvp/public/prod-command.html | cut -f1))"

      # === АВТОМАТИЗАЦИЯ ОП ГМ (ИЗОЛИРОВАННО, из ветки op-gm-automation-v1, в /op-gm/) ===
      # Проект автоматизации отдела продаж ГМ. Своя ветка, свой URL. Статика public/
      # копируется как есть - без npm/smoke. Падение не валит остальной сайт.
      - name: Build OP-GM automation (isolated, /op-gm/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin op-gm-automation-v1
          git worktree add /tmp/op-gm FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/op-gm"
          cp -r /tmp/op-gm/op-gm-automation/public/. "$GITHUB_WORKSPACE/_site/op-gm/"
          echo "Автоматизация ОП ГМ опубликована в /op-gm/ из op-gm-automation-v1"

      # === GG MESSAGE AUTOMATION (ИЗОЛИРОВАННО, из ветки claude/gg-message-automation-ffpwpd, в /messages/) ===
      # Панель автоматизации сообщений в чаты команды GG (шаблоны, расписание, конфиг-генератор).
      # Своя ветка, свой URL. Статика public/ копируется как есть - без npm/smoke. Секретов в HTML нет.
      # Падение не валит остальной сайт.
      - name: Build GG message automation (isolated, /messages/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin claude/gg-message-automation-ffpwpd
          git worktree add /tmp/gg-msg FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/messages"
          cp -r /tmp/gg-msg/gg-message-automation/public/. "$GITHUB_WORKSPACE/_site/messages/"
          echo "GG Message Automation опубликована в /messages/ из claude/gg-message-automation-ffpwpd"

      # === ИНТЕГРА 2.0 (ИЗОЛИРОВАННО, из ветки claude/gentero-plan-03609o, в /integra/) ===
      # План GENTERO по фурнитуре, складу соседей и недостроенному сайту. Документ к обсуждению
      # собственников. Самодостаточный офлайн-HTML (ноль внешних запросов), копируем как есть -
      # без npm/smoke. Секретов в HTML нет. Падение не валит остальной сайт.
      - name: Build INTEGRA plan (isolated, /integra/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin claude/gentero-plan-03609o
          git worktree add /tmp/integra FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/integra"
          cp -r /tmp/integra/gentero-integra/public/. "$GITHUB_WORKSPACE/_site/integra/"
          echo "ИНТЕГРА 2.0 опубликована в /integra/ из claude/gentero-plan-03609o"

      # === ОФИС-МЕНЕДЖЕР (ИЗОЛИРОВАННО, из ветки office-dashboard-v1, в /office/) ===
      # Личный дашборд квалификации лидов GG. Аналог /rop/: самодостаточный HTML,
      # копируем без npm/smoke, падение не валит остальной сайт.
      - name: Build OFFICE dashboard (isolated, /office/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin office-dashboard-v1
          git worktree add /tmp/office FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/office"
          cp /tmp/office/analytics-mvp/public/office-command.html "$GITHUB_WORKSPACE/_site/office/index.html"
          OSTAMP=$(grep -o '"bakedAt":"[^"]*"' /tmp/office/analytics-mvp/public/office-command.html | head -1 | cut -d'"' -f4)
          printf '%s' "$OSTAMP" > "$GITHUB_WORKSPACE/_site/office/v.txt"
          echo "Офис-менеджер опубликован в /office/, сборка $OSTAMP"

      # === ЭКОНОМИКА СДЕЛОК (ИЗОЛИРОВАННО, из ветки economics-dashboard-v1, в /economics/) ===
      # Дашборд денег по сделкам воронки «GG Заказы РФ»: выручка портфеля, себестоимость из СП
      # (Расчёт/Калькулятор/Закупка/Производство GG), маржа. Аналог /prod/: самодостаточный HTML
      # (данные запекает economics-cron), копируем без npm/smoke. Падение не валит остальной сайт.
      - name: Build ECONOMICS dashboard (isolated, /economics/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin economics-dashboard-v1
          git worktree add /tmp/economics FETCH_HEAD
          if [ -f /tmp/economics/analytics-mvp/public/economics-command.html ]; then
            mkdir -p "$GITHUB_WORKSPACE/_site/economics"
            cp /tmp/economics/analytics-mvp/public/economics-command.html "$GITHUB_WORKSPACE/_site/economics/index.html"
            ESTAMP=$(grep -o '"bakedAt":"[^"]*"' /tmp/economics/analytics-mvp/public/economics-command.html | head -1 | cut -d'"' -f4)
            printf '%s' "$ESTAMP" > "$GITHUB_WORKSPACE/_site/economics/v.txt"
            echo "Экономика сделок опубликована в /economics/, сборка $ESTAMP"
          else
            echo "public/economics-command.html ещё не запечён (запусти economics-cron) - пропуск"
          fi

      # === ПЕРСОНАЛЬНЫЕ ДАШБОРДЫ МЕНЕДЖЕРОВ (в /rop-<фамилия>/) ===
      # ЕДИНЫЙ ИСТОЧНИК ДАННЫХ: rop.json берём из rop-dashboard-v1 (тот же снимок, что и /rop/)
      # и пересобираем КАЖДОГО менеджера здесь в цикле. Ветка manager-lakomova хранит только
      # шаблон/скрипт - её собственный rop.json игнорируется, поэтому ни один дашборд менеджера
      # не может отстать от РОП по данным. Имя менеджера подставляет build-manager (MANAGER_NAME).
      # node_modules переиспользуем из основного workspace (npm ci уже прошёл выше).
      # Падение не валит остальной сайт (continue-on-error).
      - name: Build MANAGER dashboards (isolated, /rop-<surname>/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin manager-lakomova rop-dashboard-v1
          git worktree add /tmp/mgr origin/manager-lakomova
          git show origin/rop-dashboard-v1:analytics-mvp/rop/data/rop.json > /tmp/mgr/analytics-mvp/rop/data/rop.json
          ln -s "$GITHUB_WORKSPACE/analytics-mvp/node_modules" /tmp/mgr/analytics-mvp/node_modules
          cd /tmp/mgr/analytics-mvp
          # Авто-ростер: собираем ВСЕХ активных менеджеров ОП из единого rop.json одним
          # скриптом. Список берётся из данных (как opUsers), слаги = транслит фамилии,
          # пишет _site/rop-<slug>/index.html + v.txt. Новый менеджер в Bitrix -> дашборд
          # появляется сам, без правки этого файла. MIN_DEALS отсекает исторических призраков.
          OUT_DIR="$GITHUB_WORKSPACE/_site" MIN_DEALS=5 node src/scripts/b24/build-managers-all.mjs

      # === РОП GLASS MEMORY (изолированно, из ветки rop-gm-dashboard-v1, в /rop-gm/) ===
      # Форк РОП-дашборда под воронку C21 «ПРОДАЖИ Glass Memory». Данные - собственный снимок
      # rop-gm.json (крон b24-gm-snapshots), собирается build-rop-gm.ts здесь на деплое.
      # node_modules переиспользуем из основного workspace. Падение не валит сайт.
      - name: Build ROP-GM dashboard (isolated, /rop-gm/)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin rop-gm-dashboard-v1
          git worktree add /tmp/ropgm origin/rop-gm-dashboard-v1
          ln -s "$GITHUB_WORKSPACE/analytics-mvp/node_modules" /tmp/ropgm/analytics-mvp/node_modules
          cd /tmp/ropgm/analytics-mvp
          npx tsx src/scripts/b24/build-rop-gm.ts
          mkdir -p "$GITHUB_WORKSPACE/_site/rop-gm"
          cp public/rop-gm-command.html "$GITHUB_WORKSPACE/_site/rop-gm/index.html"
          STAMP=$(grep -o '"bakedAt":"[^"]*"' public/rop-gm-command.html | head -1 | cut -d'"' -f4)
          printf '%s' "$STAMP" > "$GITHUB_WORKSPACE/_site/rop-gm/v.txt"
          echo "ROP-GM опубликован в /rop-gm/, сборка $STAMP"

      # === РОП ПРЕВЬЮ (из fork-ветки Ивана, в /rop-preview/) ===
      # Изолированная копия РОП-дашборда для доработки без риска для боевого /rop/.
      # Fork создан от rop-dashboard-v1 на коммите 861f5ca (2026-06-30). Обновляется при
      # каждом deploy главного сайта (push в main / workflow_run OZON-снимков / manual dispatch).
      # continue-on-error: true - если preview сломался, /rop/ и остальной сайт не страдают.
      # Для срочной актуализации превью запусти workflow_dispatch с input rop_preview_ref.
      #
      # Раскладка /rop-preview/ после iter-2 rework (FENIX GO 9.125):
      #   /rop-preview/           = v2 (3-экрана + Crisis, sales-director assessment)
      #   /rop-preview/v1.html    = v1 boy backup (тот же что живёт в /rop/)
      #   /rop-preview/v2.html    = синоним основного v2 (для явных ссылок)
      # Feature flag на уровне URL: v2 default, v1 доступен для сравнения.
      - name: Build ROP preview (isolated, /rop-preview/)
        continue-on-error: true
        env:
          ROP_PREVIEW_REF: ${{ github.event.inputs.rop_preview_ref || 'ozon-dashboard-dima-fork' }}
        run: |
          set -euo pipefail
          git fetch origin "$ROP_PREVIEW_REF"
          git worktree add /tmp/rop-preview FETCH_HEAD
          mkdir -p "$GITHUB_WORKSPACE/_site/rop-preview"
          # v2 - основной (замена index.html)
          if [ -f /tmp/rop-preview/analytics-mvp/public/rop-command-v2.html ]; then
            cp /tmp/rop-preview/analytics-mvp/public/rop-command-v2.html "$GITHUB_WORKSPACE/_site/rop-preview/index.html"
            cp /tmp/rop-preview/analytics-mvp/public/rop-command-v2.html "$GITHUB_WORKSPACE/_site/rop-preview/v2.html"
            echo "РОП v2 опубликован в /rop-preview/ и /rop-preview/v2.html ($(du -h /tmp/rop-preview/analytics-mvp/public/rop-command-v2.html | cut -f1))"
          else
            # Fallback: если v2 ещё не собран - оставляем v1 в index.html
            cp /tmp/rop-preview/analytics-mvp/public/rop-command.html "$GITHUB_WORKSPACE/_site/rop-preview/index.html"
            echo "v2 не найден, fallback на v1"
          fi
          # v1 - всегда доступен как /rop-preview/v1.html для сравнения
          cp /tmp/rop-preview/analytics-mvp/public/rop-command.html "$GITHUB_WORKSPACE/_site/rop-preview/v1.html"
          echo "v1 backup доступен в /rop-preview/v1.html из ветки $ROP_PREVIEW_REF"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
