# Authenticated identity is set by nginx, never accepted from a browser header.
location ^~ /_access/api/ {
    client_max_body_size 8k;
    proxy_pass http://unix:/run/gg-access/http.sock:/;
    proxy_set_header X-GG-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
