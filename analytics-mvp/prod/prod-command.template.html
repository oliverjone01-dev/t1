<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Командный центр производства</title>
<style>
:root{--bg:#0a0e13;--bg-1:#0f141b;--card:#131a22;--card2:#0f151c;--elev:#1a222c;--soft:#182029;
--ink:#eaf1f6;--ink2:#c2ccd6;--ink3:#8593a0;--ink4:#5a6672;--border:#212b36;--border2:#2c3a47;
--accent:#2E9E74;--accent-soft:rgba(46,158,116,.14);--cyan:#22D3EE;--red:#F43F5E;--amber:#F59E0B;--violet:#A78BFA;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:clip}
b{font-weight:700}
.hdr{position:sticky;top:0;z-index:60;background:rgba(10,14,19,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.topbar{padding:11px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2E9E74,#22D3EE);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06121a}
.brand b{font-size:15px}.brand span{display:block;font-size:11.5px;color:var(--ink3)}
.brand #fresh{display:block;font-size:10px;font-weight:700;margin-top:2px}
.controls{padding:9px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);background:rgba(19,26,34,.5);font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--elev);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg button{background:transparent;border:0;color:var(--ink3);font:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ctl-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink4)}
.tag{font-size:10px;background:var(--elev);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink3)}
.wrap{padding:20px 24px 60px;max-width:1720px;margin:0 auto}
.sec{display:flex;align-items:center;gap:14px;margin:28px 0 14px}
.sec .n{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.sec .hint{font-size:11px;color:var(--ink3)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.card-t{font-size:15px;font-weight:800}
.card-s{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi .bar{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);margin-bottom:8px}
.kpi .v{font-size:26px;font-weight:800;font-family:'Manrope',sans-serif;letter-spacing:-.02em}
.kpi .u{font-size:13px;color:var(--ink3);font-weight:600}
.kpi .sub{font-size:10.5px;color:var(--ink4);margin-top:6px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:6px;padding:2px 7px;border-radius:6px}
.up{color:#34d399;background:rgba(52,211,153,.12)}.dn{color:#fb7185;background:rgba(251,113,133,.12)}.flat{color:var(--ink4);background:var(--elev)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
/* конвейер */
.conv{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:8px 2px 4px}
.st{flex:1;min-width:104px;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px}
.st .node{width:100%;border-radius:11px;padding:12px 8px;text-align:center;border:1px solid var(--border2);background:var(--elev);position:relative}
.st .cnt{font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;line-height:1}
.st .nm{font-size:11px;font-weight:700;color:var(--ink2);margin-top:5px;line-height:1.15;min-height:26px;display:flex;align-items:center;justify-content:center}
.st .dw{font-size:10px;font-weight:700;margin-top:5px}
.st .thru{font-size:9.5px;color:var(--ink4);margin-top:2px}
.st .arrow{position:absolute;right:-7px;top:34px;color:var(--ink4);font-size:16px;z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;padding:7px 9px;color:var(--ink3);font-weight:600;font-size:11px;border-bottom:1px solid var(--border2);white-space:nowrap;cursor:default}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl td.nm{color:var(--ink);font-weight:600}
.hbar{height:8px;border-radius:4px;background:var(--elev);overflow:hidden;min-width:40px}
.hbar>i{display:block;height:100%;border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.funnel{display:flex;gap:0;align-items:stretch}
.fn{flex:1;position:relative;text-align:center;padding:14px 6px;color:#06121a;font-weight:800;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.fn .fv{font-size:22px;font-family:'Manrope',sans-serif}.fn .fl{font-size:10.5px;font-weight:700;margin-top:2px;opacity:.85}
.note{font-size:11px;color:var(--ink4);background:var(--soft);border:1px dashed var(--border2);border-radius:8px;padding:8px 11px;margin-top:10px}
a{color:var(--cyan)}
</style></head><body>
<div class="hdr">
  <div class="topbar">
    <div class="logo">GG</div>
    <div class="brand"><b>GENGLASS · Производство</b><span>Командный центр производства · смарт-процесс «Производство GG»</span><span id="fresh"></span></div>
    <div style="margin-left:auto;font-size:11px;color:var(--ink4)">MVP · данные из Bitrix24 · фильтры визуальные (в разработке)</div>
  </div>
  <div class="controls">
    <span class="ctl-lbl">Период по</span><div class="seg"><button class="on">дате создания</button><button>дате готовности</button></div>
    <span class="ctl-lbl">Гранулярность</span><div class="seg"><button>День</button><button class="on">Неделя</button><button>Месяц</button></div>
    <span class="ctl-lbl">Направление</span><div class="seg"><button class="on">Все</button></div>
    <span class="tb-spacer" style="flex:1"></span>
    <div class="seg"><button class="on">Сегодня</button><button>Вчера</button><button>7 дн</button><button>30 дн</button><button>Всё</button></div>
  </div>
</div>
<div class="wrap" id="root"></div>
<script>
const DATA={"items":[],"refs":{},"generatedAt":null,"b24Portal":"","entityTypeId":1086};
const IT=DATA.items||[], REF=DATA.refs||{}, PORTAL=DATA.b24Portal||'';
const NOWS=(DATA.generatedAt||'2026-07-03').slice(0,10);
const NOW=new Date(NOWS+'T12:00:00');
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fmt=n=>{n=Math.round(n||0);return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const fmtK=n=>{n=n||0;return n>=1e6?(n/1e6).toFixed(2).replace('.',',')+' млн':n>=1e3?Math.round(n/1e3)+' тыс':fmt(n)};
const d1=x=>x==null?'—':(Math.round(x*10)/10).toString().replace('.',',');
const pct=x=>((x||0)*100).toFixed(1).replace('.',',')+'%';
const D=s=>s?new Date(String(s).slice(0,10)+'T12:00:00'):null;
const days=(a,b)=>{a=D(a);b=D(b);return a&&b?Math.round((b-a)/864e5):null};
const med=a=>{a=a.filter(x=>x!=null).sort((p,q)=>p-q);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
// участки конвейера (агрегация 22 этапов)
const P='DT1086_31:';
const STATIONS=[
 ['Передано',[P+'NEW']],['МДФ',[P+'PREPARATION']],
 ['Заготовка',[P+'CLIENT',P+'UC_PTHHHS',P+'UC_3W4FHW']],
 ['Сварка',[P+'UC_2V855E',P+'UC_BKVWPN',P+'UC_HG65QE']],
 ['Зачистка',[P+'UC_LBFZFL',P+'UC_CS1WNG',P+'UC_UEPDAT']],
 ['Покраска',[P+'UC_5WJH24',P+'UC_B6QDA5',P+'UC_RLOCN3']],
 ['Столярка',[P+'UC_00ETMV',P+'UC_CQP3GA']],
 ['Нержавейка',[P+'UC_RV8EML',P+'UC_ST4EAA',P+'UC_1HAN8T']],
 ['Готовность',[P+'UC_5QF1M7']],['Готово',[P+'SUCCESS']],
];
const REWORK=new Set([P+'UC_3W4FHW',P+'UC_HG65QE',P+'UC_UEPDAT',P+'UC_RLOCN3',P+'UC_1HAN8T']);
const stMap={};STATIONS.forEach(([nm,codes])=>codes.forEach(c=>stMap[c]=nm));
const stationOf=c=>stMap[c]||null;
const isDone=i=>i.sem==='S', isWip=i=>i.sem==='P';
const firstHist=i=>i.hist&&i.hist.length?i.hist[0][1]:i.created;
const successDate=i=>{if(!i.hist)return null;for(const h of i.hist)if(h[0]===P+'SUCCESS')return h[1];return i.close};
const cycleOf=i=>days(i.dateToProd||firstHist(i),successDate(i));
const dwellNow=i=>days(i.moved||firstHist(i),NOWS);
// бакеты недель
function wkey(ds){const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return dt.toISOString().slice(0,10)}
function wlabel(k){return k.slice(8,10)+'.'+k.slice(5,7)}
function tone(dw){return dw>=21?'#F43F5E':dw>=10?'#FB923C':dw>=5?'#F59E0B':'#2E9E74'}
// тренд: за последние 30 дн vs предыдущие 30
function inWin(ds,a,b){const t=D(ds);return t&&t>=a&&t<=b}
const w30a=new Date(NOW-30*864e5),w30b=NOW,w60a=new Date(NOW-60*864e5),w60b=new Date(NOW-30*864e5-1);
function trend(cur,prev,inv){if(prev===0)return cur>0?`<span class="trend up">▲ новый</span>`:`<span class="trend flat">—</span>`;const dl=(cur-prev)/prev,up=dl>=0,good=inv?!up:up;const cls=Math.abs(dl)<.005?'flat':good?'up':'dn';return `<span class="trend ${cls}">${Math.abs(dl)<.005?'→':up?'▲':'▼'} ${pct(Math.abs(dl))}</span>`}

function multiline(series,keys){
  const w=680,h=200,pl=34,pr=12,pt=12,pb=26;let mx=0;series.forEach(s=>s.vals.forEach(v=>{if(v>mx)mx=v}));mx=mx*1.15||1;
  const X=i=>pl+(w-pl-pr)*i/(keys.length-1||1),Y=v=>h-pb-(h-pt-pb)*v/mx;
  let grid='';for(let g=0;g<=3;g++){const yy=pt+(h-pt-pb)*g/3;grid+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink4)">${Math.round(mx*(1-g/3))}</text>`}
  let xl='';keys.forEach((k,i)=>{const step=Math.ceil(keys.length/8);if(i%step===0||i===keys.length-1)xl+=`<text x="${X(i)}" y="${h-pb+14}" text-anchor="middle" font-size="9" fill="var(--ink4)">${wlabel(k)}</text>`});
  let paths='';series.forEach(s=>{const pts=s.vals.map((v,i)=>[X(i),Y(v)]);const dd=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    paths+=`<path d="${dd}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${s.c}"/>`).join('')});
  const leg=series.map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:520px">${grid}${paths}${xl}</svg></div><div class="legend">${leg}</div>`;
}

function render(){
  const done=IT.filter(isDone),wip=IT.filter(isWip);
  // KPI
  const cyc=done.map(cycleOf).filter(x=>x!=null&&x>=0);
  const stuck=wip.filter(i=>(dwellNow(i)||0)>14);
  const dealSum=sum(IT,i=>i.dealBudget||0);
  const reworkItems=IT.filter(i=>i.hist&&i.hist.some(h=>REWORK.has(h[0])));
  // приток/выпуск тренды
  const inNow=IT.filter(i=>inWin(i.dateToProd||i.created,w30a,w30b)).length, inPrev=IT.filter(i=>inWin(i.dateToProd||i.created,w60a,w60b)).length;
  const outNow=done.filter(i=>inWin(successDate(i),w30a,w30b)).length, outPrev=done.filter(i=>inWin(successDate(i),w60a,w60b)).length;
  const kdef=[
    ['Заказов всего',fmt(IT.length),'','var(--cyan)','за всю историю СП',''],
    ['В производстве сейчас',fmt(wip.length),'','var(--amber)','открытых на участках',''],
    ['Готово',fmt(done.length),'','var(--accent)','дошли до «Успех»',''],
    ['Средний срок производства',d1(med(cyc)),' дн','var(--violet)','медиана: передача → готово',''],
    ['Зависло >14 дней',fmt(stuck.length),'','var(--red)','из тех, что в работе',''],
    ['Приток за 30 дн',fmt(inNow),'','var(--cyan)','передано в производство',trend(inNow,inPrev)],
    ['Выпуск за 30 дн',fmt(outNow),'','var(--accent)','готово за период',trend(outNow,outPrev)],
  ];
  const kpis=`<div class="kpis">`+kdef.map(k=>`<div class="kpi"><div class="bar" style="background:${k[3]}"></div><div class="k">${k[0]}</div><div class="v">${k[1]}<span class="u">${k[2]}</span></div><div class="sub">${k[4]}</div>${k[5]||''}</div>`).join('')+`</div>`;

  // КОНВЕЙЕР: по каждому участку - WIP сейчас + медиана срока + прошло всего
  const conv=(()=>{
    const wipByStation={},passByStation={},dwByStation={};
    STATIONS.forEach(([nm])=>{wipByStation[nm]=0;passByStation[nm]=0;dwByStation[nm]=[]});
    wip.forEach(i=>{const st=stationOf(i.stageCode);if(st){wipByStation[st]++;const dw=dwellNow(i);if(dw!=null)dwByStation[st].push(dw)}});
    IT.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{const st=stationOf(h[0]);if(st&&!seen.has(st)){seen.add(st);passByStation[st]++}})});
    const maxWip=Math.max(1,...STATIONS.map(([nm])=>wipByStation[nm]));
    const nodes=STATIONS.map(([nm],idx)=>{const c=wipByStation[nm],mdw=med(dwByStation[nm]),col=c?tone(mdw||0):'var(--ink4)';
      return `<div class="st"><div class="node" style="border-color:${c?col:'var(--border)'};background:${c?col+'22':'var(--elev)'}">
        <div class="cnt" style="color:${c?col:'var(--ink4)'}">${c}</div>
        <div class="nm">${nm}</div>
        <div class="dw" style="color:${c?col:'var(--ink4)'}">${c?(mdw!=null?d1(mdw)+' дн':''):'—'}</div>
        <div class="thru">прошло ${fmt(passByStation[nm])}</div>
      </div>${idx<STATIONS.length-1?'<div class="arrow">›</div>':''}</div>`}).join('');
    return `<div class="conv">${nodes}</div><div class="legend"><span><i style="background:#2E9E74"></i>до 5 дн</span><span><i style="background:#F59E0B"></i>5-10</span><span><i style="background:#FB923C"></i>10-21</span><span><i style="background:#F43F5E"></i>21+ дн (застряло)</span><span style="color:var(--ink4)">крупное число + красный = узкое горло</span></div>`;
  })();

  // ДИНАМИКА приток vs выпуск по неделям
  const dyn=(()=>{
    const keys=[...new Set(IT.flatMap(i=>[wkey(i.dateToProd||i.created),wkey(successDate(i))]).filter(Boolean))].sort().slice(-12);
    const ki={};keys.forEach((k,i)=>ki[k]=i);
    const inV=keys.map(()=>0),outV=keys.map(()=>0);
    IT.forEach(i=>{const wk=wkey(i.dateToProd||i.created);if(wk in ki)inV[ki[wk]]++;});
    done.forEach(i=>{const wk=wkey(successDate(i));if(wk in ki)outV[ki[wk]]++;});
    return multiline([{name:'Передано в производство',c:'#22D3EE',vals:inV},{name:'Готово (выпуск)',c:'#2E9E74',vals:outV}],keys);
  })();

  // УЧАСТКИ таблица
  const stTable=(()=>{
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const w=wip.filter(i=>stationOf(i.stageCode)===nm),dws=w.map(dwellNow).filter(x=>x!=null),m=med(dws),mx=dws.length?Math.max(...dws):0;
      let pass=0;IT.forEach(i=>{if((i.hist||[]).some(h=>stationOf(h[0])===nm))pass++});
      return {nm,wip:w.length,m,mx,pass}}).sort((a,b)=>b.wip-a.wip||(b.m||0)-(a.m||0));
    const body=rows.map(r=>`<tr><td class="nm">${r.nm}</td><td>${r.wip}</td><td style="color:${tone(r.m||0)};font-weight:700">${r.m!=null?d1(r.m)+' дн':'—'}</td><td>${r.mx?r.mx+' дн':'—'}</td><td>${fmt(r.pass)}</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Участок</th><th>В работе</th><th>Медиана срока</th><th>Макс</th><th>Прошло всего</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // ДОРАБОТКИ по участкам
  const reworkBlock=(()=>{
    const map={};STATIONS.forEach(([nm])=>map[nm]=0);let tot=0;
    IT.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{if(REWORK.has(h[0])){const st=stationOf(h[0]);if(st&&!seen.has(st)){seen.add(st);map[st]++;tot++}}})});
    const rows=Object.entries(map).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
    const mx=rows.length?rows[0][1]:1;
    const body=rows.map(([nm,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><div style="width:110px;font-size:12px;color:var(--ink2);text-align:right">${nm}</div><div class="hbar" style="flex:1"><i style="width:${(c/mx*100).toFixed(0)}%;background:#FB923C"></i></div><div style="width:34px;font-weight:700;font-size:12px">${c}</div></div>`).join('')||'<div class="card-s">возвратов на доработку не зафиксировано</div>';
    return `<div>${body}</div><div class="note">Доработка/Перекрас = сколько заказов возвращалось на участок повторно. Всего событий: <b>${tot}</b>. Высокий столбец = проблемный участок по качеству.</div>`;
  })();

  // КОНСТРУКТОРЫ
  const consTable=(()=>{
    const m={};IT.forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].tot++;if(isDone(i))m[n].done++;const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c);m[n].sum+=i.dealBudget||0;if((i.hist||[]).some(h=>REWORK.has(h[0])))m[n].rew++});
    const rows=Object.values(m).sort((a,b)=>b.tot-a.tot).slice(0,12);
    const body=rows.map(r=>`<tr><td class="nm">${r.n}</td><td>${r.tot}</td><td>${r.done}</td><td style="color:${tone(med(r.cyc)||0)}">${med(r.cyc)!=null?d1(med(r.cyc))+' дн':'—'}</td><td>${r.rew}</td><td>${fmtK(r.sum)} ₽</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Конструктор</th><th>Заказов</th><th>Готово</th><th>Ср.срок</th><th>Доработок</th><th>Сумма</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // МОСТ Продажи → Производство
  const bridge=(()=>{
    const withDeal=IT.filter(i=>i.dealId).length, inProd=IT.length, wipN=wip.length, doneN=done.length;
    const stages=[['Заказ в производстве',inProd,'#22D3EE'],['Привязан к сделке',withDeal,'#38BDF8'],['В работе сейчас',wipN,'#F59E0B'],['Готово',doneN,'#2E9E74']];
    const mx=stages[0][1]||1;
    const fns=stages.map((s,i)=>`<div class="fn" style="background:${s[2]};flex:${(0.5+s[1]/mx).toFixed(2)}"><div class="fv">${fmt(s[1])}</div><div class="fl">${s[0]}</div></div>`).join('');
    return `<div class="funnel">${fns}</div><div class="note">262 карточки производства, из них 252 связаны со сделкой воронки «GG Заказы РФ» (parentId2). Это мост: что продано - дошло до цеха, где сейчас и сколько готово.</div>`;
  })();

  // АССОРТИМЕНТ + НАПРАВЛЕНИЕ (что производим)
  const mixBlock=(()=>{
    const by=(key)=>{const m={};IT.forEach(i=>{const v=i[key]||'не указано';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    const bars=(data,pal)=>{const mx=data[0]?data[0][1]:1;return data.map(([n,c],idx)=>`<div style="display:flex;align-items:center;gap:10px;margin:4px 0"><div style="width:120px;font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n}</div><div class="hbar" style="flex:1"><i style="width:${(c/mx*100).toFixed(0)}%;background:${pal[idx%pal.length]}"></i></div><div style="width:60px;font-size:11.5px;font-weight:700">${c} <span style="color:var(--ink4);font-weight:400">${pct(c/IT.length)}</span></div></div>`).join('')};
    const PAL=['#22D3EE','#2E9E74','#A78BFA','#F59E0B','#F43F5E','#38BDF8','#10B981'];
    return `<div class="grid2"><div><div class="card-s" style="margin-bottom:6px">По ассортименту</div>${bars(by('assort'),PAL)}</div><div><div class="card-s" style="margin-bottom:6px">По направлению бренда</div>${bars(by('dir'),PAL)}</div></div>`;
  })();

  document.getElementById('root').innerHTML=
    `<div class="sec"><div class="n">1</div><h2>Производство</h2><div class="ln"></div><div class="hint">здоровье цеха: сколько в работе, где затор, растём или падаем</div></div>`+kpis+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конвейер производства</div><div class="card-s">сколько заказов сейчас на каждом участке (крупное число) · цвет и «дн» = медиана срока на участке · «прошло» = сколько всего прошло через участок. Вопрос: где очередь и застой. Вывод: крупный красный узел = узкое горло, туда мощности.</div></div></div>${conv}</div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Приток vs выпуск по неделям</div><div class="card-s">синяя = передано в производство, зелёная = готово. Если синяя выше зелёной - незавершёнка растёт (не успеваем). Сходятся - баланс.</div></div></div>${dyn}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Мост: Продажи → Производство</div><div class="card-s">что из проданного дошло до цеха и где оно сейчас</div></div></div>${bridge}</div></div>`+
    `<div class="sec"><div class="n">2</div><h2>Участки</h2><div class="ln"></div><div class="hint">где заказы лежат дольше всего и где страдает качество</div></div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Скорость по участкам</div><div class="card-s">в работе сейчас + медиана/макс срока лежания · красное = застряли. Скан сверху: у кого больше и краснее - там тормоз.</div></div></div>${stTable}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Доработки и перекрас (качество)</div><div class="card-s">сколько заказов возвращалось на участок повторно - индикатор брака</div></div></div>${reworkBlock}</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Что производим</div><div class="card-s">структура заказов по ассортименту и бренду · «не указано» = дыра в заполнении карточек</div></div></div>${mixBlock}</div>`+
    `<div class="sec"><div class="n">3</div><h2>Сотрудники</h2><div class="ln"></div><div class="hint">кто тянет объём и с каким качеством/скоростью</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конструкторы</div><div class="card-s">объём, готово, средний срок производства, доработки, сумма связанных сделок</div></div></div>${consTable}</div>`;

  // freshness
  const fr=document.getElementById('fresh');
  if(DATA.generatedAt){const g=new Date(DATA.generatedAt),m=new Date(g.getTime()+3*36e5),p=n=>String(n).padStart(2,'0');
    const ageH=(new Date()-g)/36e5,col=ageH>48?'#F43F5E':ageH>30?'#F59E0B':'#2E9E74';
    fr.textContent='данные на '+p(m.getUTCDate())+'.'+p(m.getUTCMonth()+1)+' '+p(m.getUTCHours())+':'+p(m.getUTCMinutes())+' МСК';fr.style.color=col}
}
render();
</script></body></html>
