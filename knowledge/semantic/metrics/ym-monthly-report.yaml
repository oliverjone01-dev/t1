  - "отчёт о платежах (документ) считает и оплаченные-отменённые: «Поступило платежей покупателей» и «Удержано на возвраты» без фильтра статуса. Сверка ACC_DOC на «Деньгах» добавляет их (cgot/cback, csold/cret), иначе после перезабора разошлась бы с документом (авг-сен: 1023124 -775 388 / +902 907, 74986385 -1 362 781 / +1 350 111; G2 ФЕНИКСА iter2). Блок и отчёт их в деньги не берут - разница с документом = строка «Оплачено и отменено»"
