# Ветки, которые сервер держит в релизах, и их ПУТИ ДАННЫХ.
# Формат: <ветка>  <путь>,<путь>,...   (пути от корня репозитория, без пробелов)
#
# Путь данных = то, что пишут задачи по расписанию (снимки, запечённые HTML). На сервере он
# становится ссылкой на /srv/gg/data/<ветка>/<путь>: данные живут на сервере и версионируются
# локальным git данных, в GitHub больше не уходят. Код ветки берётся из GitHub как есть.
# При первом выкате путь засевается тем, что лежит в git.
#
# Правило: путь сюда добавляется ТОЛЬКО при переносе задачи, которая его пишет (см. INVENTORY.md).
# Лишний путь «заморозит» код: правки в нём из GitHub на сервер перестанут доезжать.
# Ветка контура (main) выкатывается всегда, даже если её здесь нет.

# --- Пилот: РОП ГГ + Офис (задача rop-snapshot) ---
rop-dashboard-v1      analytics-mvp/rop/data,analytics-mvp/public/rop-command.html
office-dashboard-v1   analytics-mvp/rop/data,analytics-mvp/rop/plan,analytics-mvp/public/office-command.html
# Личные дашборды менеджеров: шаблон и билдер из manager-lakomova, rop.json - копия снимка РОПа
# (как в deploy-pages: свой rop.json ветки не используется). Готовые страницы - в cache, не в git данных.
manager-lakomova      analytics-mvp/rop/data

# --- Волна 2: экономика сделок (задачи economics-snapshot, econ-recon) ---
economics-dashboard-v1 analytics-mvp/economics/data,analytics-mvp/public/economics-command.html,analytics-mvp/public/econ-control.html
# РОП Glass Memory (задача rop-gm-snapshot): свой файл данных и запечённый HTML, rop.json ветки не трогаем
rop-gm-dashboard-v1    analytics-mvp/rop/data/rop-gm.json,analytics-mvp/public/rop-gm-command.html
# Производство (задача prod-snapshot) и ПТО (pto-snapshot; страница ПТО - из git ветки, задача её не пишет)
prod-dashboard-v1      analytics-mvp/prod/data,analytics-mvp/public/prod-command.html
pto-dashboard-v1       analytics-mvp/pto/data

