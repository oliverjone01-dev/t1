<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>GEN-GROUP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23060807'/%3E%3Cpath d='M4 18V6l8 8 8-8v12' fill='none' stroke='%23c7ff39' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07090A; --bg2:#0C0F11; --card:#12161A; --card2:#171C21;
  --txt:#F4F6F5; --mut:#A8B0B4; --dim:#7C858B; --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18); --lime:#C7FF39; --ink:#0A1003;
  --warn:#FFB27A;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --le-accent:#C7FF39; --le-accent-ink:#0A1003; --le-safe-top:76px;
  --gate-glow:rgba(199,255,57,.07); --gate-mark:#C7FF39;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;overflow-wrap:break-word;background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:99;background:var(--lime);color:var(--ink);
  padding:10px 16px;border-radius:999px;font-weight:700}

/* ---------- шапка ---------- */
#hd{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(7,9,10,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.lg{font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.lg .amp{color:var(--lime)}
.nav{margin-left:auto;display:flex;gap:6px}
.nav a{color:var(--mut);text-decoration:none;font-size:13.5px;font-weight:600;
  padding:9px 14px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--txt);border-color:var(--line2)}
.nav a.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
/* На узком экране пункты не обрезаются, а листаются вбок. */
@media(max-width:700px){
  .hd{flex-wrap:wrap;gap:8px;padding:10px 14px}
  /* При сильном увеличении шрифта в системе название переносится, а не
     раздвигает документ вбок. */
  .lg{font-size:13px;white-space:normal;line-height:1.3}
  .nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:5px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:8px 11px;font-size:12.5px;white-space:nowrap;border-color:var(--line)}
}

/* ---------- слайд ---------- */
.s{min-height:100svh;display:flex;align-items:center;padding:96px 20px 60px;
  border-bottom:1px solid var(--line);position:relative;scroll-margin-top:0}
.w{max-width:1180px;margin:0 auto;width:100%}
.tag{font:700 13px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--lime);margin:0 0 20px}
.tag i{color:var(--dim);font-style:normal}
h1{font-size:clamp(2rem,6vw,4rem);line-height:1.04;letter-spacing:-.025em;margin:0 0 22px;font-weight:800}
h2{font-size:clamp(1.7rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.022em;margin:0 0 20px;font-weight:800}
h3{font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.2;margin:0 0 10px;font-weight:700}
.lead{font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.5;color:var(--mut);max-width:62ch;margin:0 0 26px}
.lead b,.lead strong{color:var(--txt);font-weight:700}
p{margin:0 0 14px}
.mut{color:var(--mut)}
.src{font:500 14px/1.6 var(--sans);color:var(--dim);margin-top:18px}
/* Ссылка на источник это тач-цель. Строчная высота 16px не проходит по
   минимальному размеру цели, поэтому ссылка становится блоком с полем. */
.src a,.foot a{display:inline-block;color:var(--mut);line-height:1.4;
  padding:6px 8px;margin:0 -2px;border-radius:8px;min-height:26px;
  text-underline-offset:3px}
.src a:hover,.foot a:hover{color:var(--txt);background:var(--card2)}

/* ---------- сетки ---------- */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* Элемент грида по умолчанию не сжимается ниже min-content, и длинное слово
   внутри карточки раздвигает документ вбок. */
.g>*{min-width:0}
.card{overflow-wrap:break-word}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.hl{background:linear-gradient(160deg,rgba(199,255,57,.10),rgba(199,255,57,.02));
  border-color:rgba(199,255,57,.38)}
.card .n{font:700 12.5px/1.3 var(--mono);color:var(--lime);letter-spacing:.1em;margin-bottom:12px;display:block}

/* большая цифра */
.big{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin:0 0 6px}
.big.lime{color:var(--lime)}
.big-l{font-size:15.5px;color:var(--mut);line-height:1.4}

/* метка достоверности */
.mk{display:inline-block;font:700 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;vertical-align:middle;border:1px solid var(--line2);
  color:var(--dim);white-space:nowrap}
.mk.d{color:var(--lime);border-color:rgba(199,255,57,.4)}
.mk.h{color:var(--mut);border-style:dashed}
/* Длинная метка на узком экране раздвигала бы документ вбок. */
@media(max-width:700px){.mk{white-space:normal;overflow-wrap:anywhere}}

/* картинка */
.shot{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover}
.shot figcaption{padding:12px 16px;font-size:14.5px;color:var(--mut);line-height:1.45}

/* Кадры, которых может ещё не быть в папке, показываются только после
   успешной загрузки. Иначе на экране на секунду висит пустая рамка, а при
   отсутствующем файле она висела бы до конца. */
[data-opt]{display:none}
[data-opt].on{display:block}
.duo.noimg{grid-template-columns:1fr}

/* Широкая полоса под текстом. Кадр держит утверждение секции, поэтому
   подпись под ним обязательна: без неё это украшение. */
.band{margin:26px 0 0;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:var(--card)}
.band img{width:100%;aspect-ratio:21/9;object-fit:cover;display:block}
.band figcaption{padding:14px 18px;font-size:14.5px;color:var(--mut);line-height:1.45;
  border-top:1px solid var(--line)}
@media(max-width:620px){.band img{aspect-ratio:16/10}}

/* Кадр и текст в паре. Пропорция намеренно неравная: снимок это довод,
   а не половина разговора. */
.duo{display:grid;gap:22px;grid-template-columns:1.15fr 1fr;align-items:center;margin-top:26px}
.duo.flip{grid-template-columns:1fr 1.15fr}
.duo.flip .duo-img{order:2}
@media(max-width:820px){
  .duo,.duo.flip{grid-template-columns:1fr}
  .duo.flip .duo-img{order:0}
}
.duo-img{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.duo-img img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.duo-img figcaption{padding:12px 16px;font-size:14px;color:var(--mut);line-height:1.45;
  border-top:1px solid var(--line)}

/* Уточняющие ползунки под раскрытием. АВЮ не тронет ни одного, финдиректору
   нужны все, и страница обязана давать полный ответ при нуле касаний. */
.more{margin:4px 0 20px;border:1px solid var(--line2);border-radius:14px;background:var(--card2)}
.more summary{cursor:pointer;padding:15px 18px;font-weight:700;font-size:15.5px;
  list-style:none;display:flex;align-items:center;gap:11px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--lime);
  border-bottom:2px solid var(--lime);transform:rotate(45deg);margin-top:-3px;
  transition:transform .18s ease}
.more[open] summary::before{transform:rotate(-135deg);margin-top:2px}
.more summary:focus-visible{outline:2px solid #fff;outline-offset:-3px;border-radius:14px}
.more summary .sub{margin-left:auto;font-weight:500;font-size:14px;color:var(--dim);text-align:right}
.more .in{padding:4px 18px 6px}
@media(max-width:620px){.more summary{flex-wrap:wrap}.more summary .sub{margin-left:20px;text-align:left;width:100%}}
/* Вложенные поля складываются: секция плюс раскрытие съедали на узком
   экране больше половины ширины. */
@media(max-width:430px){
  .more summary{padding:13px 13px}
  .more .in{padding:4px 13px 6px}
  .s{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){.more summary::before{transition:none}}

/* Константа, которая раньше была ползунком */
.fix{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:15px 0 0;
  margin-top:4px;border-top:1px solid var(--line);font-size:15px;color:var(--mut);line-height:1.5}
.fix b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}

/* список галочек */
.ul{list-style:none;margin:0;padding:0}
.ul li{position:relative;padding-left:26px;margin-bottom:12px;color:var(--mut)}
.ul li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;
  border-radius:2px;background:var(--lime)}
.ul li b{color:var(--txt)}

/* ---------- калькулятор ---------- */
.calc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.calc-top{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-bottom:22px;
  padding-bottom:20px;border-bottom:1px solid var(--line)}
@media(max-width:700px){.calc-top{grid-template-columns:1fr}}
.mini b{display:block;font-size:23px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.mini span{font-size:15px;color:var(--mut);line-height:1.45;display:block;margin-top:4px}
.row{margin-bottom:20px}
.row label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:15.5px;font-weight:600;margin-bottom:9px}
.row label .v{font:800 19px/1 var(--mono);color:var(--lime);font-variant-numeric:tabular-nums;white-space:nowrap}
/* На узком экране подпись и значение встают в две строки, а не выдавливают
   друг друга за край. */
@media(max-width:430px){
  .row label{flex-wrap:wrap;gap:4px}
  .row label .v{margin-left:auto}
}
.row .hint{font-size:15px;color:var(--mut);margin-top:8px;line-height:1.5}
input[type=range]{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--card2);border:1px solid var(--line2)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--card2);border:1px solid var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--lime);border:3px solid var(--bg);margin-top:-13px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--lime);
  border:3px solid var(--bg);box-shadow:0 3px 12px rgba(0,0,0,.5)}
input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:99px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--line2);color:var(--txt);
  border-radius:12px;padding:12px 14px;font:600 14px/1.3 var(--sans);cursor:pointer;text-align:left}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:700}
.out{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-top:22px;padding-top:20px;
  border-top:1px solid var(--line)}
@media(max-width:820px){.out{grid-template-columns:1fr}}
/* Итоги стоят НАД ползунками и прилипают к шапке: иначе при движении ручки
   результат уходит за нижнюю кромку экрана, и весь смысл «двиньте и
   посмотрите» пропадает. На узком экране карточки идут в столбик и занимают
   пол-экрана, поэтому там не липнут. */
.out.top{margin-top:0;padding-top:0;border-top:0;margin-bottom:0}
/* Высоту шапки меряет скрипт и пишет в --hd-h. Прибитая цифра оставляла
   щель, в которой строки текста проезжали разрезанными пополам. */
.stick{position:sticky;top:var(--hd-h,66px);z-index:5;margin-bottom:14px;
  background:var(--card);padding-top:10px;padding-bottom:12px;
  box-shadow:0 10px 18px -14px rgba(0,0,0,.9)}
/* На телефоне три карточки в столбик заняли бы пол-экрана, поэтому там
   липнет сжатая полоса: только числа, подписи прячутся. */
@media(max-width:820px){
  .stick .oh{display:none}
  .stick .out.top{grid-template-columns:repeat(3,1fr);gap:6px}
  .stick .out.top .o{padding:8px 9px}
  .stick .out.top .o span{display:none}
  .stick .out.top .o b{font-size:clamp(.95rem,3.6vw,1.25rem)}
  /* Число без подписи нечитаемо, поэтому короткая подпись берётся из
     атрибута: полная остаётся для широкого экрана и для чтения с листа. */
  .stick .out.top .o[data-s]::after{content:attr(data-s);display:block;
    font-size:12px;color:var(--mut);margin-top:4px;line-height:1.3}
  .stick{padding-top:8px;padding-bottom:8px;margin-bottom:16px}
}
/* Ниже 340px три суммы в строку не помещаются. Это ширина при системном
   увеличении шрифта, и там на прилипшей полосе остаётся то число, ради
   которого калькулятор открыт. */
@media(max-width:340px){
  .stick .out.top{grid-template-columns:1fr}
  .stick .out.top .o:not(.hl){display:none}
}
.out.sec{margin-top:0;padding-top:14px;margin-bottom:18px}
.out.sec .o b{font-size:clamp(1.15rem,2.2vw,1.55rem)}
.oh{font:700 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  margin:0 0 10px}
.out .o{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px}
.out .o.hl{background:linear-gradient(160deg,rgba(199,255,57,.13),rgba(199,255,57,.03));
  border-color:rgba(199,255,57,.45)}
.out .o.bad{border-color:rgba(255,178,122,.45)}
.out .o b{display:block;font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.out .o.hl b{color:var(--lime)}
.out .o.bad b{color:var(--warn)}
.out .o span{display:block;font-size:15px;color:var(--mut);margin-top:7px;line-height:1.45}
/* строка чувствительности: порог, за которым знак предложения меняется */
.sens{font-size:15px;line-height:1.55;color:var(--mut);border-left:3px solid var(--line2);
  padding:2px 0 2px 14px;margin:0 0 18px}
.sens b{color:var(--txt)}
.reset{background:transparent;border:1px solid var(--line2);color:var(--mut);border-radius:999px;
  padding:9px 16px;font:600 13px/1 var(--sans);cursor:pointer;margin-top:18px}
.reset:hover{color:var(--txt);border-color:var(--lime)}

/* ---------- график ---------- */
.fig{margin:26px 0 0;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px}
.fig .chart{display:block;width:100%;height:auto;font-family:var(--sans)}
.fig figcaption{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  font-size:14.5px;color:var(--mut);line-height:1.45}
.fig .tbl{margin-top:10px}
.fig .tbl summary{cursor:pointer;font-size:13.5px;color:var(--dim);padding:6px 0;list-style:none}
.fig .tbl summary::-webkit-details-marker{display:none}
.fig .tbl summary::before{content:"Цифры таблицей"}
.fig .tbl[open] summary::before{content:"Свернуть таблицу"}
.fig .tbl summary:hover{color:var(--txt)}
.fig .tbl summary:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:6px}
.fig .tbl table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.fig .tbl th,.fig .tbl td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);
  color:var(--mut);font-variant-numeric:tabular-nums}
.fig .tbl th{color:var(--dim);font-weight:600}

/* ---------- иконка ---------- */
/* Набор рисованный: страница это один зашифрованный файл, подключить
   библиотеку иконок в неё нечем. Поэтому все знаки строго геометрические,
   один размер, одна толщина линии. */
.ic{width:26px;height:26px;display:block;margin-bottom:13px;color:var(--lime);
  stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card .n+.ic{margin-top:-2px}

/* ---------- движение ---------- */
/* Появление по мере прокрутки. Задача не украсить, а показать, что документ
   разделён на шаги: блок приходит целиком, а не проявляется по буквам. */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(16px);transition:opacity .55s cubic-bezier(.16,1,.3,1),transform .55s cubic-bezier(.16,1,.3,1)}
  .rv.in{opacity:1;transform:none}
  .rv2{transition-delay:.07s}
  .rv3{transition-delay:.14s}
  /* Параллакс на широких кадрах: изображение движется медленнее полосы.
     Сделано таймлайном прокрутки, без единого обработчика события. */
  @supports (animation-timeline: view()){
    .band img{animation:par linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
    @keyframes par{from{transform:translateY(-4%) scale(1.09)}to{transform:translateY(4%) scale(1.09)}}
  }
}
.band{overflow:hidden}

/* ---------- служебное ---------- */
.note{border-left:3px solid var(--warn);padding:2px 0 2px 16px;color:var(--mut);
  font-size:16px;line-height:1.6;margin:22px 0 0;max-width:70ch}
.foot{padding:56px 20px 70px;color:var(--dim);font-size:15px;line-height:1.7}
/* телевизор: на 2560px текст занимал 46% ширины и не рос вместе с панелью */
@media(min-width:1700px){
  body{font-size:19px}
  .w{max-width:1440px}
  .mk{font-size:13px}
  .row .hint,.out .o span,.mini span,.sens{font-size:17px}
  .note{font-size:18px}
  .src,.foot{font-size:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{#hd{position:static}.s{min-height:0;page-break-inside:avoid;padding:24px 0}}
</style>
<style>
/* ---------- парольный вход ---------- */
/* Свечение берётся из палитры документа. Два документа лежат на одном домене,
   и до ввода пароля их надо различать глазом, а не по памяти. */
#gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 50% 0%,var(--gate-glow,rgba(199,255,57,.07)),transparent 55%),var(--bg)}
#gate .lg svg{color:var(--gate-mark,var(--lime))}
#gate.done{display:none}
.gbox{width:100%;max-width:430px}
.gbox .lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.03em;margin-bottom:30px}
.gbox .lg svg{width:24px;height:24px}
.gbox h1{font-size:clamp(1.5rem,4.4vw,2rem);line-height:1.15;margin-bottom:10px;letter-spacing:-.02em}
.gbox .hint{color:var(--mut);font-size:14.5px;line-height:1.6;margin-bottom:26px}
.gf{display:flex;gap:10px;flex-wrap:wrap}
#gpass{flex:1 1 190px;min-height:48px;padding:12px 16px;border-radius:12px;border:1px solid var(--bd2);
  background:var(--bg2);color:var(--txt);font-family:inherit;font-size:15px;letter-spacing:.08em}
#gpass::placeholder{color:var(--dim);letter-spacing:0}
#gpass:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#gerr{margin-top:14px;font-size:13.5px;color:#ff8f6b;min-height:1.3em}
#gerr.ok{color:var(--mut)}
.gnote{margin-top:34px;padding-top:18px;border-top:1px solid var(--bd);font-size:12px;color:var(--dim);line-height:1.6}
@media print{#gate{display:none}}
</style>
</head>

<script>
(function(){
  'use strict';
  var ITER = 250000;
  var TITLES = {"avu":"GENGROUP и DOMO GROUP"};          // ключ документа -> заголовок вкладки браузера
  var gate = document.getElementById('gate');
  var form = document.getElementById('gform');
  var pass = document.getElementById('gpass');
  var btn  = document.getElementById('gbtn');
  var err  = document.getElementById('gerr');
  var key = null;                   // ключ выводим один раз, дальше переключение мгновенное

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

  if (!(window.crypto && window.crypto.subtle)) {
    err.textContent = 'Браузер не поддерживает расшифровку. Откройте в Chrome, Safari или Firefox.';
    pass.disabled = btn.disabled = true;
    return;
  }

  // Один документ в DOM за раз: у разных документов совпадают id разделов,
  // и initDoc начал бы цеплять чужие узлы.
  function open(name, focusTop){
    var el = document.getElementById('payload-' + name);
    if (!el) return Promise.reject(new Error('нет документа ' + name));
    var raw  = b64(el.textContent.trim());
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    return crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, data)
      .then(function(buf){
        var doc = document.getElementById('doc');
        doc.innerHTML = new TextDecoder().decode(buf);
        doc.setAttribute('data-doc', name);
        document.title = TITLES[name] || document.title;
        try { history.replaceState(null, '', '#' + name); } catch(e) {}
        window.scrollTo(0, 0);
        try { initDoc(); } catch(e) { console.error(e); }
        // вкладка перерисовала #doc целиком, патчи надо наложить заново
        if (window.BLOCKEDIT_REFRESH) { try { window.BLOCKEDIT_REFRESH(); } catch(e) { console.error(e); } }
        if (focusTop) {
          var h = document.getElementById('h-top');
          if (h) { h.setAttribute('tabindex','-1'); h.focus(); }
        }
      });
  }
  window.openDoc = open;

  // Переключатель вкладок появляется только после расшифровки, поэтому
  // слушаем делегированно от документа.
  document.addEventListener('click', function(ev){
    var t = ev.target.closest && ev.target.closest('[data-go]');
    if (!t || !key) return;
    ev.preventDefault();
    var name = t.getAttribute('data-go');
    if (document.getElementById('doc').getAttribute('data-doc') === name) return;
    open(name, true).catch(function(e){ console.error(e); });
  });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var p = pass.value;
    if (!p) return;
    btn.disabled = true;
    err.className = 'ok';
    err.textContent = 'Расшифровка...';

    // Соль и вектор берём из первого документа, ключ общий для всех
    var raw = b64(document.getElementById('payload-avu').textContent.trim());
    var salt = raw.slice(0, 16);

    crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt: salt, iterations: ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
      })
      .then(function(k){
        key = k;
        var patches = Promise.resolve();
        if (window.LIVEEDIT_KEY) {
          try { patches = window.LIVEEDIT_KEY(k) || Promise.resolve(); } catch(e) { console.error(e); }
        }
        var alts = window.LIVEEDIT_ALT_SALTS || [];
        if (alts.length && window.LIVEEDIT_ALTKEYS) {
          Promise.all(alts.map(function(sb){
            var raw = b64(sb);
            return crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
              .then(function(km){
                return crypto.subtle.deriveKey(
                  { name:'PBKDF2', salt: raw, iterations: ITER, hash:'SHA-256' },
                  km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
              });
          })).then(function(keys){ window.LIVEEDIT_ALTKEYS(keys); }, function(){});
        }
        var want = (location.hash || '').replace('#','');
        if (!document.getElementById('payload-' + want)) want = 'avu';
        err.textContent = 'Открываю...';
        return Promise.all([open(want, true), patches]);
      })
      .then(function(){
        gate.classList.add('done');
        gate.remove();            // иначе на странице остаётся второй h1
      })
      .catch(function(){
        key = null;
        err.className = '';
        err.textContent = 'Пароль не подошёл.';
        btn.disabled = false;
        pass.select();
      });
  });

  pass.focus();
})();
</script>
<script>
function initDoc(){

  var $ = function (s) { return document.getElementById(s); };
  var ru = function (n) { return Math.round(n).toLocaleString('ru-RU'); };
  // Крупные суммы читаются человеком в миллионах, а не в девяти разрядах.
  // До десяти миллионов держим два знака, иначе на границе миллиона число
  // теряет точность прямо под рукой: было 999 999 ₽, стало 1,0 млн ₽.
  var money = function (n) {
    var a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' млрд ₽';
    if (a >= 1e7) return (n / 1e6).toFixed(1).replace('.', ',') + ' млн ₽';
    if (a >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' млн ₽';
    return ru(n) + ' ₽';
  };
  // Знак пишем словом: «минус 0,79 млн ₽» читается однозначно, «-0,79» нет.
  var signed = function (n) {
    return (n >= 0 ? 'плюс ' : 'минус ') + money(Math.abs(n));
  };
  // Числовые допущения лежат в разметке документа, а не в этом скрипте:
  // разметка уезжает в шифр, скрипт остаётся открытым.
  var pick = function (box, k) {
    if (!box) return null;
    var v = parseFloat(box.getAttribute('data-' + k));
    return isFinite(v) ? v : null;
  };
  // Возврат к исходным значениям: то, чего нет в разметке, не трогаем.
  var restore = function (box, pairs) {
    Object.keys(pairs).forEach(function (id) {
      var v = pick(box, pairs[id]), el = $(id);
      if (el && v !== null) el.value = v;
    });
  };

  /* ---------- калькулятор фурнитуры ---------- */
  var BOX1 = document.querySelector('#gt-calc .calc');

  function calc1() {
    if (!$('c1-items')) return;
    var items = +$('c1-items').value,      // изделий в год с его фурнитурой
        shop = +$('c1-shop').value,        // заказов в месяц через витрину
        check = +$('c1-check').value,      // комплектующих на изделие, его прайс
        scheck = +$('c1-scheck').value,    // средний чек витрины, его прайс
        marg = +$('c1-marg').value / 100,  // его маржа в прайсовой цене
        disc = +$('c1-disc').value / 100;  // дилерская скидка нам
    $('v1-items').textContent = ru(items);
    $('v1-shop').textContent = ru(shop);
    $('v1-check').textContent = ru(check) + ' ₽';
    $('v1-scheck').textContent = ru(scheck) + ' ₽';
    $('v1-marg').textContent = Math.round(marg * 100) + '%';
    $('v1-disc').textContent = Math.round(disc * 100) + '%';

    // Два потока по его прайсу: комплектующие к нашим изделиям и прямые
    // продажи фурнитуры через витрину под его маркой в нашем канале.
    var price = items * check + shop * 12 * scheck;
    var rev = price * (1 - disc);
    // Себестоимость у поставщика не зависит от скидки, которую он даёт.
    var cost = price * (1 - marg);
    $('o1-price').textContent = money(price);
    $('o1-rev').textContent = money(rev);
    $('o1-marg').textContent = signed(rev - cost);

    // Предел просьбы задан не нами, а его же прайсом: прибыль обнуляется
    // ровно тогда, когда скидка равна его марже. Печатаем это числом, чтобы
    // разговор про размер скидки шёл по арифметике, а не по ощущению.
    var gap = Math.round(marg * 100) - Math.round(disc * 100);
    $('o1-sens').innerHTML = gap > 0
      ? '<b>Ваша прибыль обнуляется на скидке ' + Math.round(marg * 100) + '%</b>, то есть когда скидка сравняется с вашей маржой в прайсе. Мы просим ' +
        Math.round(disc * 100) + '%, это на ' + gap + ' пунктов ниже вашего предела.'
      : '<b>При такой марже эта скидка уводит вас ниже себестоимости.</b> Предел здесь задаёт ваш прайс, а не наша просьба: скидка не может быть больше вашей маржи.';
  }
  ['c1-items', 'c1-shop', 'c1-check', 'c1-scheck', 'c1-marg', 'c1-disc'].forEach(function (id) {
    var el = $(id); if (el) el.addEventListener('input', calc1);
  });
  if ($('c1-reset')) $('c1-reset').addEventListener('click', function () {
    restore(BOX1, { 'c1-items': 'items', 'c1-shop': 'shop', 'c1-check': 'check',
                    'c1-scheck': 'scheck', 'c1-marg': 'marg', 'c1-disc': 'disc' });
    calc1();
  });
  calc1();

  /* ---------- калькулятор памятников ---------- */
  var BOX2 = document.querySelector('#gm-calc .calc');

  function calc2() {
    if (!$('c2-solo')) return;
    var CHECK = pick(BOX2, 'check'), other = pick(BOX2, 'other');
    if (!CHECK || other === null) return;
    other /= 100;
    var solo = +$('c2-solo').value,        // выручка направления, если растём сами
        duo = +$('c2-duo').value,          // выручка направления, если растём вместе
        ad = +$('c2-ad').value * 12,       // его взнос в рекламу, ползунок в месяцах
        gpi = +$('c2-glass').value,        // стекла на изделие, по его прайсу
        marg = +$('c2-marg').value / 100;  // его маржа в цене стекла

    $('v2-solo').textContent = money(solo);
    $('v2-duo').textContent = money(duo);
    $('v2-ad').textContent = money(ad / 12);
    $('v2-glass').textContent = ru(gpi) + ' ₽';
    $('v2-marg').textContent = Math.round(marg * 100) + '%';

    // Доля стекла в выручке выводится из его же цифры: стекла на изделие
    // делить на средний чек. Так на экране нет второго числа про то же самое.
    var g = gpi / CHECK, capped = false;
    if (g > 0.9) { g = 0.9; capped = true; }

    var hisSolo = solo * g * marg;                 // без сделки: маржа на нашем объёме
    var cost = g * (1 - marg);                     // доля себестоимости стекла в выручке
    var half = duo * (1 - cost - other) / 2;       // его половина прибыли направления
    var hisNet = half - ad;                        // взнос идёт сверх бюджета направления
    var diff = hisNet - hisSolo;

    $('o2-solo').textContent = money(hisSolo);
    $('o2-net').textContent = money(hisNet);
    $('o2-diff').textContent = signed(diff);

    // Пороги. Знак предложения переворачивают три величины, поэтому все
    // границы стоят на экране числом, а не прячутся в оговорку.
    var t = [];
    var B = duo * (1 - marg) / 2 + solo * marg;
    var pBreak = B > 0 ? (duo * (1 - other) / 2 - ad) / B * CHECK : 0;
    t.push(pBreak > 0 ? 'стекло дороже <b>' + ru(pBreak) + ' ₽</b> за изделие'
                      : 'разница отрицательна при любой цене стекла');
    var adCap = half - hisSolo;
    t.push(adCap > 0 ? 'взнос выше <b>' + money(adCap / 12) + ' в месяц</b>'
                     : 'взнос выше нуля');
    var oCap = 1 - cost - 2 * (hisSolo + ad) / duo;
    if (oCap > 0 && oCap < 1) t.push('наши расходы выше <b>' + (oCap * 100).toFixed(1).replace('.', ',') + '% выручки</b>');
    var line = '<b>Разница обнуляется, если</b> ' + t.join(', либо ') + '.';
    if (capped) line += ' Доля стекла ограничена сверху 90%.';
    $('o2-sens').innerHTML = line;
  }
  ['c2-solo', 'c2-duo', 'c2-ad', 'c2-glass', 'c2-marg'].forEach(function (id) {
    var el = $(id); if (el) el.addEventListener('input', calc2);
  });
  if ($('c2-reset')) $('c2-reset').addEventListener('click', function () {
    restore(BOX2, { 'c2-solo': 'solo', 'c2-duo': 'duo', 'c2-ad': 'ad',
                    'c2-glass': 'glass', 'c2-marg': 'marg' });
    calc2();
  });
  calc2();

  /* ---------- появление по прокрутке ---------- */
  // Задача не украсить, а показать, что документ разделён на шаги. Наблюдатель,
  // не обработчик прокрутки: последний дёргается на каждом кадре.
  var rv = document.querySelectorAll('.rv');
  if (rv.length) {
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still || !window.IntersectionObserver) {
      rv.forEach(function (el) { el.classList.add('in'); });
    } else {
      var io2 = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('in');
          io2.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -12% 0px', threshold: .12 });
      rv.forEach(function (el) { io2.observe(el); });
      // Печать и поиск по странице не должны упираться в невидимый текст.
      addEventListener('beforeprint', function () { rv.forEach(function (el) { el.classList.add('in'); }); });
    }
  }

  /* ---------- кадры, которых ещё нет ---------- */
  // Файлы графики докладываются в public/img/ по одному, без пересборки
  // страницы. Пока файла нет, блок убирает себя сам и вёрстку не рвёт.
  document.querySelectorAll('[data-opt] img').forEach(function (img) {
    var box = img.closest('[data-opt]');
    var ok = function () { if (box) box.classList.add('on'); };
    var no = function () {
      var duo = box && box.closest('.duo');
      if (duo) duo.classList.add('noimg');
    };
    if (img.complete) { (img.naturalWidth ? ok : no)(); return; }
    img.addEventListener('load', ok);
    img.addEventListener('error', no);
  });

  /* ---------- высота шапки в переменную ---------- */
  // Липкая панель итогов прибивается под шапку. Фиксированное число
  // оставляло щель, в которой текст проезжал разрезанным пополам, и ломалось
  // при укрупнении кегля на большом экране.
  var hd = $('hd');
  if (hd) {
    var setHd = function () {
      document.documentElement.style.setProperty('--hd-h', hd.offsetHeight + 'px');
    };
    setHd();
    if (window.ResizeObserver) new ResizeObserver(setHd).observe(hd);
    else window.addEventListener('resize', setHd);
  }

  /* ---------- подсветка раздела в шапке ---------- */
  // Подсвечиваем не секцию, а часть документа: секций восемь, а пунктов три.
  var map = [['gt', 'nav-gt'], ['gm', 'nav-gm'], ['end', 'nav-end']];
  function group(id) {
    if (id === 'end') return 'end';
    if (id.indexOf('gm') === 0) return 'gm';
    if (id.indexOf('gt') === 0) return 'gt';
    return null;
  }
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var g = group(e.target.id);
        if (!g) return;
        map.forEach(function (p) {
          var a = $(p[1]); if (!a) return;
          a.classList.toggle('on', p[0] === g);
          if (p[0] === g) a.setAttribute('aria-current', 'true');
          else a.removeAttribute('aria-current');
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('.s').forEach(function (s) { io.observe(s); });
  }
}
</script>
