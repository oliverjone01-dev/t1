# Вкладка «Отчет» Яндекс Маркета: ежемесячный отчёт руководителю (месяц к прошлому месяцу).
# Аналог ozon-monthly-report.yaml, адаптирован под данные Маркета (E036: экран не копируется как есть).
id: ym-monthly-report
title: "Отчет Маркета: оборот, причины отклонений, затраты площадки, реклама, непродаваемые товары"
version: 4   # 02.10.2026 «два столбца» (ответ «по 5 вопросам да»): основа расчёта - Начислено по заказам со сборами Маркета за продажу, первый столбец справочно. v3: 02.10.2026 «1а 2а»: отменённые заказы (статус «не будет …») не продажа и не возврат; баллы кампаний справкой. v2: 02.10.2026: граница периода по последнему дню со сборами (вариант «а»), эталон пересчитан
status: approved   # ответы 1-5 (01.10), эталон «да», общие расходы «2а», неполный месяц «3 да»; после return ФЕНИКСА 7.25: «1а, да 2а 3а 4 аналитику строим на основе отчетов на вкладке деньги баллы пока справочно» (01.10)
owner: "Иван Раюшкин"
approved_at: "2026-10-02"   # v4: «по 5 вопросам да» в чате 02.10 после прототипа knowledge/episodes/2026-10/proto-ym-dva-stolbca-20261002.html; v2: «вариант а» в чате 02.10; v1: ответы в чате 01.10: «1 а (аналитика по артикулам за выбранный период) 2а 3а 4а 5а», затем «да, 2а, 3 да»
decision: >
  Руководитель раз в месяц видит, вырос или упал оборот Маркета (всего, зеркала, мебель), за счёт чего,
  сколько забрал Маркет по статьям, сколько ушло на рекламу и какие товары снимать или перезаливать.
good_direction: "оборот и К выплате вверх, доля сборов вниз, ДРР вниз"
entity: "месяц x статья (и артикул для вклада в отклонение)"
key: [month, line]
type: derived
formula_text: >
  База (ответ 1): ИТОГО блока «Аналитика по артикулам (за выбранный период)» на «Деньгах» Маркета за те же
  даты - ACC = pnl_sku_netting_daily.ndjson, проводки отчёта по взаиморасчётам по дате ТРАНЗАКЦИИ, функция
  accAgg (build-katya.ts). Оборот = «Начислено», штуки = «Итого, шт» (продано - возвраты).
  Затраты (ответ 2а): те же статьи, что в ACC: Комиссия, Доставка, Эквайринг, Хранение, Продвижение, Прочие
  услуги -> Всего сборов -> К выплате -> С\С -> Валовая -> АДМ 30% от К выплате -> Налоги 15% от «Оплатил
  клиент» + «Доставка покупателя» (база Маркета, knowledge/semantic/ym-rates-adm-tax.md) -> Чистая. Баллы
  отдельной строкой (начислено / списано баллами, cofin), в сборы не входят - как в ACC.
  Причины: те же разложения, что у OZON: оборот = штуки x цена, Δ = (u1-u0)·p0 + (p1-p0)·u1; статья
  s = объём + ставка, Δs = (A1-A0)·r0 + (r1-r0)·A1; топ артикулов по вкладу. Подпись «разложение цифр, а не причина».
  Реклама (ответ 3а): расход = Продвижение (Буст продаж, Полки, Товарные баннеры) из тех же проводок; ДРР =
  расход / заказанный оборот (daily_totals Маркета). Выручка рекламных заказов и окупаемость - «нет данных»
  (API рекламы Маркета не подключён, ads_reports.json), не 0.
  Непродаваемые (ответ 4а): правила и пороги OZON [ГИПОТЕЗА]: показы в месяце > 0, 0 заказов (кроме
  отменённых) за 60 дней, карточке 60+ дней; источник показов sku_views.ndjson (часть строк недельные -
  суммируются в месяц по period_from), заказы orders.ndjson. Топ-5 в группе.
  Зеркала / мебель (ответ 5а): по категории артикула (префикс, ACC_CAT / таксономия), мебель = всё кроме зеркал.
  Общие расходы кабинета (ответ «2а» 01.10): проводки реестра без номера заказа - удержания и премия Маркета -
  отдельной строкой под «Чистой прибылью по артикулам», вычитаются из чистой прибыли; ИТОГО по артикулам
  остаётся равным блоку на «Деньгах». «Внесено продавцом» - собственные деньги продавца, не доход и не
  расход: справкой, в чистую не входит (G2 ФЕНИКСА: в сентябре взнос +43 086 гасил удержание -43 086).
  Статьи (ответ «1а» 01.10, повтор E036): группы = поля блока ACC под названиями Маркета (Размещение
  товарных предложений, Доставка, Перевод и приём платежа, Хранение, Продвижение, Штрафы и прочие услуги),
  внутри - услуги из отчёта по взаиморасчётам; классификация - accNetKind/accFeeKey derive-lib (та же,
  что строит блок). Сумма услуг группы = колонка блока до построчного округления; иначе флаг на странице.
  Баллы (ответ «да» и «4» 01.10): аналитика - по деньгам отчётов «Денег»; начислено и списано баллами
  (по услугам), сальдо баллов - справкой, в оборот, сборы и прибыль не входят.
  ДРР (ответ «2а» 01.10): как на вкладке «Маркетинг» - функция pmRow вкладки, по своду заказов: (буст
  деньгами + баллами + общие на продвижение) / (выручка деньги + баллы), по месяцу ЗАКАЗА целиком и
  кабинету. Расход деньгами по реестру за даты блоков 1-3 - отдельной строкой сверху.
  Непродаваемые (ответ «3а» 01.10): если за 60 дней были заказы, но все отменены - причина «заказ был,
  но отменён», действие «разобрать причины отмен: срок, наличие, цена»; колонка «отменённых за 60 дн».
  ДВА СТОЛБЦА (v4, 02.10, ответ «по 5 вопросам да»). Маркет проводит платёж покупателя в день оплаты, а
  сборы за продажу - в день доставки; на стыке месяцев доход и сборы были из разных популяций (К2).
  Столбец 1 «Начислил Маркет» = как отчёт о платежах (платежи по дню платежа − возвраты по дню возврата),
  справочно, и на нём остаётся сверка с отчётом о платежах. Столбец 2 «Начислено» - основа расчёта:
  (1) заказ продан = первый день проводки сбора «Размещение товарных предложений» или «Перевод платежа»
  (деньгами или баллами; «Приём платежа» и штрафы не признак) - accSaleDay, derive-lib;
  (2) весь платёж покупателя заказа (товар и доставка) ложится на этот день, даже если оплата была раньше;
  (3) возврат - в день возврата, но не раньше дня продажи, только по проданным заказам; возврат по заказу
  без сбора за продажу (оплатили и отменили до доставки) во второй столбец не идёт, его оплаты там тоже нет;
  (4) сборы - все денежные сборы периода, те же, что в столбце 1; К выплате2 = К выплате1 − Начислено1 + Начислено2;
  (5) АДМ 30% от К выплате2, налог 15% от Начислено2; С\С - по штукам второго столбца; наша доставка -
  ведомость (без «ОТМЕНЕН», возвраты и рекламации учтены) по заказам второго столбца в день продажи,
  по артикулам пропорционально платежу; Валовая = К выплате2 − С\С − наша доставка.
code_module: "analytics-mvp/src/scripts/ym/report-page-ym.ts (новый файл; report-page.ts OZON не трогать)"
filters:
  include_statuses: []
  exclude:
    - "непродаваемые: карточки с первым показом позже начала 60-дневного окна"
    - "окупаемость рекламы и выручка рекламных заказов не считаются (нет источника), не 0"
cancellations_returns:
  mode: "net: продано - возвраты по проводкам («Получено от потребителей» - «Возвращено потребителям»). Проводки со статусом платежа «Не будет переведён / не будет удержан из-за отмены заказа» и «Справочно: не будет пополнен баланс» (PAYMENT_STATUS, схема реестра 5) не входят ни в деньги, ни в штуки, ни в баллы: заказ оплатили и отменили, денег не было (ответ «1а» 02.10, сверка с выгрузкой кабинета). Справкой: «оплачено и отменено» ₽ / шт (nettingCancelled, derive-lib)"
  return_date_basis: "дата транзакции возврата в реестре"
date_field: "дата транзакции реестра платежей (как блок ACC); дата заказа - для ДРР и непродаваемых"
mode: period
conversion_window_days: null
timezone: Europe/Moscow
interval: "[1-е число, последний день месяца]; незакрытый месяц [1-е, последний ПОЛНЫЙ день реестра] против [1-е, то же число] прошлого (как OZON 2а; подтверждено 01.10 «3 да»). Последний полный день (вариант «а» 02.10) = последний день, за который у кабинета пришли ДЕНЕЖНЫЕ сборы по заказам (поля commission..otherSvc блока ACC; списания баллами не в счёт), по отстающему кабинету среди активных за 30 дней. Та же граница у блока ACC на «Деньгах» (accLedgerFullTo, derive-lib). Probe 02.10, 11 снимков 21.09-01.10: такой день не менялся потом в 20 из 20 пар (кабинет, снимок); последний день любой проводки дорастал в 15 из 20"
partial_period: mark
additive_over_time: true
accounting_basis: "проводки отчёта по взаиморасчётам Маркета по дате транзакции (как ACC на «Деньгах»)"
empty_value: "null: нет данных, не 0"
reconciliation:
  - "ИТОГО отчёта за месяц = ИТОГО блока ACC на «Деньгах» за те же даты (одна функция, не копия - К9)"
  - "независимая сверка: «Оплатил клиент» за месяц против отчёта о платежах Маркета (Получено - Возвращено от потребителей); реализация - realization_monthly"
known_gaps:
  - "статус платежа собирается со схемы реестра 5 (02.10.2026): до перезабора ботом (три прогона при бюджете 10, см. ниже; бюджет 10 отчётов) месяцы без статуса считают отменённый заказ продажей и возвратом - помечены на «Деньгах» (ACC_NOST); статусы старше свежего окна (60 дней) не обновляются, отмена позже 60 дней после оплаты останется продажей"
  - "списания баллами за кампании кабинета без заказа (буст с оплатой за показы, полки) - из отчёта по баллам (bonuses_monthly), не из реестра: в отчёт о платежах они не входят (ответ «2а» 02.10); группа «Продвижение»"
  - "непродаваемые: возраст карточки (60+ дней у OZON) не проверяется - отчёт показов Маркета собирается с 31.08.2026, даты появления карточки в данных нет; новая карточка без заказов попадает в список (пометка на странице) [ГИПОТЕЗА]"
  - "непродаваемые: статья «Хранение» по артикулу у Маркета нулевая (январь-сентябрь 2026), правило «снятие при 90+ дн и платном хранении» не срабатывает; снятие предлагается как второй шаг"
  - "показы: первая неделя (31.08-06.09) одной строкой, отнесена к сентябрю целиком, включая 31.08"
