name: Market realization repair (2026-10-21)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ym-data
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the pinned pre-incident baseline
        run: git fetch --depth=1 origin dafa7b084b14ad87db8f5c0056c06a5351f1194c
      - name: Snapshot OZON files
        working-directory: analytics-mvp
        run: |
          set -euo pipefail
          md5sum public/*.html > /tmp/ozon-pages.md5
          find data -maxdepth 1 -type f -print0 | sort -z | xargs -0 md5sum > /tmp/ozon-data.md5
      - name: Exact incident repair (no API, no secrets)
        run: python3 analytics-mvp/src/scripts/ym/repair-realization-20261021.py
      - name: Validate and rebuild Market
        working-directory: analytics-mvp
        run: |
          set -euo pipefail
          npm ci
          python3 src/scripts/ym/repair-realization-20261021.py --check-only
          npm run ym:derive
          npm run ym:join
          npm run ym:reconcile
          npm run ym:build
          npm run ym:smoke
          npm run ym:ledger-fresh
          md5sum -c /tmp/ozon-pages.md5
          md5sum -c /tmp/ozon-data.md5
      - name: Commit repaired snapshots (bot, main only)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A analytics-mvp/data-ym analytics-mvp/public/market
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data-ym: удалить подтверждённый повторный слой реализации за май-июль'
          git push origin HEAD:main
