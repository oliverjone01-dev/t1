<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Диалоги по сделкам</title>
<style>
:root{--bg:#0E141A;--card:#141C24;--card2:#0F171E;--border:#243039;--border-soft:#1B242C;--ink:#E7EEF4;--ink-2:#B7C4CE;--ink-3:#8A99A6;--ink-4:#5D6B77;--acc:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:0 auto;padding:18px 22px 60px}
.h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--ink-3);font-size:12px;margin-top:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.bar label{color:var(--ink-3);font-size:11px;margin-right:4px}
select,input{background:var(--card2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none}
input#q{min-width:220px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--ink-2);font-size:11.5px;cursor:pointer;user-select:none}
.chip.on{background:#12303a;border-color:#1f6b7d;color:#bfeff8}
.cnt{color:var(--ink-4);font-size:11px}
.deal{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.dhead:hover{background:rgba(34,211,238,.04)}
.arw{color:var(--ink-4);width:12px;flex:0 0 12px;font-size:11px}
.did{font-weight:800;flex:0 0 auto}
.link2{color:var(--ink-4);font-weight:600;font-size:11px}
.dttl{color:var(--ink);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmgr{color:var(--ink-2);flex:0 0 auto;white-space:nowrap;font-size:12px}
.dchips{display:flex;gap:4px;flex:0 0 auto}
.dchips i{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.dchips b{width:8px;height:8px;border-radius:2px;display:inline-block}
.dmeta{color:var(--ink-4);font-size:11px;flex:0 0 auto;white-space:nowrap}
.thread{border-top:1px solid var(--border-soft);padding:4px 0;background:var(--card2)}
.ev{display:grid;grid-template-columns:110px 60px 128px 22px 140px 1fr 190px;gap:9px;padding:7px 14px;border-bottom:1px solid var(--border-soft);align-items:start}
.ev:last-child{border-bottom:none}
.ev .t{color:var(--ink-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stg{font-size:9.5px;padding:1px 5px;border-radius:4px;white-space:nowrap}
.stg-lead{background:#3a2a12;color:#d6a45f}.stg-deal{background:#12303a;color:#7fd7e6}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.dir-in{color:#69C7DA}.dir-out{color:#7FD1A6}.dir-n{color:var(--ink-4)}
.who-cli{color:#E8A33D;font-weight:600}
.who-mgr{color:#22d3ee}
.whosub{display:block;color:var(--ink-4);font-size:10px;font-weight:400}
.who{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.body .st{color:var(--ink-4);font-size:10.5px;margin-left:6px}
.body a.rec{margin-left:8px;font-size:11px}
.ev-bad{background:#C2525209;border-left:2px solid #C2525288}
.ev-good{background:#2E9E7407;border-left:2px solid #2E9E7455}
.evtags{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
.evtag{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1.5}
.hlq{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.parts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 14px;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line)}
.part{padding:1px 7px;border:1px solid var(--line);border-radius:5px;color:var(--ink-2)}
.part b{color:var(--ink);font-weight:600}
.body .ref{display:block;margin-top:2px;color:#C2569B;font-size:10.5px}
.empty{padding:40px;text-align:center;color:var(--ink-4)}
.foot{color:var(--ink-4);font-size:11px;margin-top:10px}

/* рейтинг менеджеров и скоринг сделок */

.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{background:#0000000d;color:var(--ink-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#ffffff06}
.tbl .who2{font-weight:600;font-size:12.5px}
.cellv{display:inline-flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;min-width:52px;padding:2px 4px;border-radius:5px}
.cellv:hover{background:#ffffff10;outline:1px solid var(--line)}
.cellv b{font-weight:600;font-size:12px}
.pbar{display:block;width:46px;height:3px;border-radius:2px;background:#ffffff18;overflow:hidden}
.pbar i{display:block;height:100%}
.rt{font-weight:700;font-size:15px}
.rtst{color:#E8A33D;font-size:10px;letter-spacing:.5px;display:block}
.na2{color:var(--ink-4);font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.tile:hover{border-color:var(--acc)}
.tile.on{border-color:var(--acc);background:#22d3ee0f}
.tile .tl{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.tile .tn{font-size:20px;font-weight:700;line-height:1.2}
.tile .tm{color:var(--ink-4);font-size:10.5px}
.qrow{cursor:pointer}
.qrow:hover td{background:#ffffff08}
.qrow td{vertical-align:middle}
.pri{font-weight:700;font-size:12px;white-space:nowrap}
.kind{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap}
.k-deal{color:#22d3ee;border-color:#22d3ee55;background:#22d3ee12}
.k-lead{color:#C2873C;border-color:#C2873C55;background:#C2873C12}
.urg{font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.qexp>td{padding:0 10px 10px 10px;background:#ffffff05}
.qnext{color:var(--ink-2);font-size:11.5px;margin:6px 0 8px 0;line-height:1.5}
.qnext b{color:var(--ink-3)}
.qm{display:inline-block;margin-left:3px;font-size:9px;color:var(--ink-4);border:1px solid var(--line);border-radius:50%;width:11px;height:11px;line-height:11px;text-align:center;cursor:help;vertical-align:top}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:11.5px}
.lgh{padding:8px 12px;cursor:pointer;color:var(--ink-2)}
.lgh i{font-style:normal;color:var(--ink-4);margin-right:5px}
.lgb{padding:0 12px 10px 12px}
.lgi{color:var(--ink-2);margin-bottom:5px;line-height:1.5}
.lgi b{color:var(--ink)}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--acc)}
.sarr{font-size:9px;color:var(--acc)}
.fbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11.5px;color:var(--ink-3)}
.fbar select{background:#0f1720;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px}
.vbadge{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;border:1px solid}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px 34px}
.swcol{}
.swh{font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.swh-g{color:#2E9E74}.swh-b{color:#C25252}
.swi{color:var(--ink-2);font-size:11.5px;line-height:1.6}
.swd{color:var(--ink-4);font-size:10px;margin-left:6px}
.swnone{color:var(--ink-4);font-style:italic}
/* Плавающая подсказка - дизайн РОП-дашборда (rop-command.template.html, #tip) */
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid #2A3742;border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:420px}
#tip .tl{color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
#tip .tip-tot{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin:3px 0 8px;padding-bottom:7px;border-bottom:1px solid #2A3742}
#tip .tip-tot span:first-child{font-size:12.5px;font-weight:700}
#tip .tip-tot span:last-child{font-size:11.5px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
#tip .qh{font-weight:800;font-size:10.5px;margin:8px 0 2px;color:#E8A33D}
#tip .qh:first-child{margin-top:0}
#tip .qh i{font-style:normal;color:var(--ink-3);font-weight:600;margin-left:6px}
#tip .qb{white-space:normal;line-height:1.45;color:var(--ink-2)}
#tip .qn{color:var(--ink-4);font-size:10.5px;margin-top:8px;padding-top:6px;border-top:1px solid #2A3742}
.malert{display:inline-block;margin-left:7px;font-size:10px;font-weight:800;line-height:15px;height:15px;min-width:15px;padding:0 5px;border-radius:8px;text-align:center;cursor:help;vertical-align:1px;border:1px solid}
.aigr{display:inline-block;font-size:11px;font-weight:800;line-height:17px;min-width:30px;padding:0 6px;border-radius:6px;text-align:center;cursor:help;border:1px solid}
.aidot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.aidv{cursor:help;border-bottom:1px dotted var(--ink-4)}
.aibanner{background:#8B7BF014;border:1px solid #8B7BF04d;border-radius:9px;padding:8px 12px;margin-bottom:8px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.aibox{background:#8B7BF00d;border:1px solid;border-radius:9px;padding:9px 11px;margin-bottom:9px}
.aihead{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.airow{font-size:12px;color:var(--ink-2);line-height:1.5;margin:3px 0}
.t3 .evtag[data-ai]{border-style:dashed}
.fixids{display:flex;flex-wrap:wrap;gap:5px}
.fixid{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:5px;cursor:pointer;color:var(--ink-2)}
.fixid:hover{border-color:var(--acc);color:var(--acc)}
.t1{margin-bottom:10px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t1{min-width:1260px}
.t1 th,.t2 th,.t3 th{font-size:9px;padding:5px 5px;white-space:nowrap}
/* Только СВОИ строки: таблицы сделок и переписки лежат внутри ячеек таблицы менеджеров,
   и потомковый селектор .t1 td навязывал им nowrap - из-за этого текст сообщения шёл
   одной строкой и наезжал на разметку. */
.t1>tbody>tr>td{white-space:nowrap;padding:7px 5px;font-size:11.5px}
.t1>tbody>tr>td.l{white-space:nowrap;min-width:230px;padding-left:12px;padding-right:18px}
.t1>tbody>tr>th.l{padding-left:12px}
.t1>tbody>tr>td:nth-child(2),.t1>tbody>tr>th:nth-child(2){min-width:118px;padding-right:16px}
.t1>tbody>tr>td .vbadge{white-space:nowrap;font-size:9px;padding:2px 8px}
.mrow2{cursor:pointer}
.mrow2:hover td{background:#ffffff08}
.mrow2.on td{background:#22d3ee0d}
.subrow>td{padding:0 10px 14px 46px;background:#ffffff04;border-left:3px solid #22d3ee3d}
.whob{color:var(--ink-3);font-size:11px;margin:2px 0 0 0}
.afterdlg{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.t2{margin-top:6px;font-size:11px}
.t2>tbody>tr>td{padding:6px 6px;white-space:nowrap}
.t2>tbody>tr>td.l{white-space:normal}
.drow{cursor:pointer}
.drow:hover td{background:#ffffff08}
.drow.on td{background:#22d3ee12}
.subrow2>td{padding:0 8px 14px 76px;background:#00000033;border-left:3px solid #C2873C4d}
.subrow2>td>div{border-left:2px solid #C2873C33;padding-left:14px}
.t3{margin-top:6px;font-size:11px;table-layout:fixed}
.t3 td{padding:5px 6px;vertical-align:top}
/* Колонки переписки фиксированы: текст сообщения не наезжает на разметку, длинные
   ссылки и склеенные слова переносятся внутри своей колонки. */
.t3 th:nth-child(1),.t3 td:nth-child(1){width:78px}
.t3 th:nth-child(2),.t3 td:nth-child(2){width:124px}
.t3 th:nth-child(3),.t3 td:nth-child(3){width:136px}
.t3 th:nth-child(5),.t3 td:nth-child(5){width:224px;border-left:1px solid var(--line);padding-left:10px}
.t3 td.ebody{padding-right:16px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.t3 td{white-space:normal}
.t3 td:nth-child(1){white-space:nowrap}
.t3 td:nth-child(5) .evtag{margin:0 3px 3px 0}
.erow2.e-bad td:first-child{box-shadow:inset 2px 0 0 #C25252}
.erow2.e-good td:first-child{box-shadow:inset 2px 0 0 #2E9E74}
.ebody{white-space:pre-wrap;word-break:break-word;max-width:520px}
.mnode{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.mnode.on{border-color:var(--acc)}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.mhead:hover{background:#ffffff08}
.mname{font-weight:600;font-size:13px;min-width:150px}
.mmeta{color:var(--ink-3);font-size:11.5px}
.mwhy{color:var(--ink-4);font-size:11px;margin-left:auto}
.mbody{border-top:1px solid var(--line);padding:4px 8px 8px 20px}
.dnode{border-bottom:1px solid #ffffff08}
.dnode:last-child{border-bottom:none}
.dnode.on{background:#22d3ee08;border-radius:8px}
.dhead2{display:grid;grid-template-columns:16px 78px 52px 54px 1fr 150px 44px auto;gap:8px;align-items:center;padding:7px 6px;cursor:pointer;font-size:11.5px}
.dhead2:hover{background:#ffffff08}
.dsum{font-weight:700}
.did2{color:var(--ink-4);font-size:10.5px}
.dttl2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dstage{color:var(--ink-3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dprob{font-weight:600;text-align:right}
.dbody{padding:2px 4px 10px 16px;border-left:2px solid var(--line);margin:0 0 8px 8px}
.whyb{color:var(--ink-3);font-size:11px;margin:4px 0 8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wchip{border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.node{margin:8px 0 12px 0}
.nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 0 5px 2px;border-bottom:1px solid var(--line)}
.nhead b{font-size:11.5px;letter-spacing:.02em}
.nhead a{color:inherit}
.ndot{width:8px;height:8px;border-radius:50%;display:inline-block}
.n-lead{background:#C2873C}.n-deal{background:#22d3ee}
.nsub{color:var(--ink-4);font-size:10.5px}
.nbody{border-left:1px solid var(--line);margin-left:3px}
.erow{display:grid;grid-template-columns:74px 132px 1fr 190px;gap:8px;padding:5px 8px;border-bottom:1px solid #ffffff08;align-items:start;font-size:11.5px}
.erow:last-child{border-bottom:none}
.lv-in{}
.lv-out{background:#ffffff04}
.lv-task{opacity:.8}
.e-bad{box-shadow:inset 2px 0 0 #C25252}
.e-good{box-shadow:inset 2px 0 0 #2E9E74}
.etime{color:var(--ink-3);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ewho{font-size:11px;overflow:hidden;text-overflow:ellipsis}
.ebody{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.sysw{color:var(--ink-4);font-size:10.5px}
.mixchip{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid;white-space:nowrap;margin:0 2px 2px 0}
.t2>tbody>tr>td.l .mixchip{font-size:9.5px}
.fbar input[type=date]{background:#0f1720;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px}
.chip2.on2{border-color:var(--acc);color:var(--acc);background:#22d3ee12}
.pset{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 8px;cursor:pointer;color:var(--ink-3);font-size:10.5px;margin-right:2px}
.pset:hover{border-color:var(--acc);color:var(--acc)}
.pset.on2{border-color:var(--acc);color:var(--acc);background:#22d3ee12}
.chip2{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 8px;cursor:pointer;color:var(--ink-3);font-size:10.5px}
.chip2:hover{border-color:var(--acc);color:var(--acc)}
.t3 tr.sysrow td{color:var(--ink-3);background:#ffffff04}
.t3 tr.inrng td{background:rgba(34,211,238,.10)}
.t3 tr.inrng.sysrow td{background:rgba(34,211,238,.06)}
.t3 tr.inrng td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
.t3 .ref{display:block;margin-top:3px;color:#C2569B;font-size:10.5px;line-height:1.45}
.due{display:inline-block;margin-left:6px;font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.arw3{color:var(--ink-4);margin-right:6px;font-size:10px}
.arw4{color:var(--acc);margin-right:7px;font-size:11px;display:inline-block;width:9px}
.xcell{width:16px;text-align:center}
.qbar{display:flex;justify-content:space-between;align-items:center;padding:7px 2px 4px 2px;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line);margin-bottom:6px}
.qclose{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:2px 9px;color:var(--ink-3);font-size:11px;margin-left:10px;white-space:nowrap}
.qclose:hover{border-color:var(--acc);color:var(--acc)}
.qrow.open td{background:#22d3ee0c}
.mrow{cursor:pointer}
.mrow.open td{background:#ffffff0a}
.arw2{color:var(--ink-4);margin-right:6px;font-size:10px}
.mexp>td{padding:0 8px 10px 8px;background:#ffffff05}
.expcap{color:var(--ink-3);font-size:11px;margin:6px 0}
.tagbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.tagsec{margin-bottom:7px}
.tagsec .sl{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.tgc{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid;margin:0 5px 5px 0;cursor:pointer}
.tgc:hover{filter:brightness(1.25)}
.tgc.on{outline:2px solid var(--acc)}
.tgc .n{opacity:.7;font-size:10px}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.crumb .x{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:1px 8px;color:var(--ink-3)}
.crumb .x:hover{border-color:var(--acc);color:var(--acc)}
.sc{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 10px 8px 28px;border-top:1px dashed var(--line)}

<body>
<div id="tip"></div>
<div class="wrap">
  <div class="h1">GENGLASS · Диалоги</div>
  <div class="sub" id="sub">загрузка…</div>

  <div class="cnt" id="stat" style="margin-bottom:10px"></div>

  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = __DIALOG_DATA__;
const BAKED_AT = "__BAKED_AT__";
const PORTAL = DATA.portal || "https://glassmemory.bitrix24.ru";
const DEAL_LIMIT = 400;

const TCOL = {'Стадия':'#6E7B8A','Ответственный':'#8B7BF0','Звонок':'#3DAEC2','Резюме BitrixGPT':'#C2569B','Письмо':'#C2873C','Дело':'#8B7BF0','Задача':'#8B7BF0','Мессенджер ОЛ':'#2E9E74','Комментарий-заметка':'#8794A5','Активность':'#5D6B77'};
const typeColor = t => t && t.indexOf('Сообщение')===0 ? '#2E9E74' : (TCOL[t]||'#5D6B77');
// Плавающая подсказка: тот же механизм, что в РОП-дашборде (наведение на элемент с data-tip).
const TIP = () => document.getElementById('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); const tip = TIP(); if(!tip) return;
  if(t){ tip.innerHTML = t.getAttribute('data-tip'); tip.style.opacity = 1;
    let nx = e.clientX + 14, ny = e.clientY + 14;
    if(nx + tip.offsetWidth > innerWidth) nx = e.clientX - tip.offsetWidth - 14;
    if(ny + tip.offsetHeight > innerHeight) ny = Math.max(8, e.clientY - tip.offsetHeight - 14);
    tip.style.left = nx + 'px'; tip.style.top = ny + 'px';
  } else tip.style.opacity = 0; });
const fmt2 = n => Math.round(n).toLocaleString('ru-RU');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const fmtTime = iso => { const d=new Date(iso); if(isNaN(d)) return ''; return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };
const fmtDay = ts => { const d=new Date(ts); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };

const S = { mode:'tree', dMode:'comm', dFrom:'', dTo:'', sM:{k:'hot',d:-1}, sD:{k:'prio',d:-1}, sE:{k:'ts',d:1}, sortK:'prio', sortDir:-1, fStage:'', fKind:'', fMin:0, sec:'', tag:'', exp:null, q4:'', tm:'', td:'', mgr:'', dir:'', id:'', q:'', ord:'desc', types:new Set() };
let VIEW = [];

function initControls(){
  // Панель старого плоского вида убрана: фильтры дерева живут в шапке таблицы менеджеров.
  document.getElementById('sub').textContent =
    `${DATA.from?DATA.from.slice(0,10):''} → ${DATA.to?DATA.to.slice(0,10):''} · ${DATA.days} дн · ${DATA.scope||''} · сделок ${DATA.dealCount||0} + лидов ${DATA.leadCount||0} · снимок ${BAKED_AT?BAKED_AT.slice(0,16).replace('T',' '):''}`;
}

function matchEvent(e){
  if(S.dir && e.dir!==S.dir) return false;
  if(S.types.size && !S.types.has(e.type)) return false;
  if(S.q){ const q=S.q; if(!((e.body&&e.body.toLowerCase().indexOf(q)>=0)||(e.who&&e.who.toLowerCase().indexOf(q)>=0)||(e.title&&e.title.toLowerCase().indexOf(q)>=0)||(e.leadT&&e.leadT.toLowerCase().indexOf(q)>=0)||(e.dealT&&e.dealT.toLowerCase().indexOf(q)>=0))) return false; }
  return true;
}
// якорь группировки по режиму: по сделкам -> сделка (лид сливается), по лидам -> лид (сделка сливается)
function anchor(e){
  if(S.mode==='deal') return e.dealId ? {ent:'deal',aid:e.dealId,title:e.dealT,other:e.leadId} : {ent:'lead',aid:e.leadId,title:e.leadT,other:''};
  return e.leadId ? {ent:'lead',aid:e.leadId,title:e.leadT,other:e.dealId} : {ent:'deal',aid:e.dealId,title:e.dealT,other:''};
}
function dealScore(ent,aid,other){ return (SC? (SCD[(ent==='deal'?'D':'L')+aid] || SCD['D'+(other||'')]) : null) || null; }
function passScoreFilter(ent,aid,other){
  if(!S.sec && !S.tag) return true;
  const d = dealScore(ent,aid,other); if(!d) return false;
  if(S.sec) return d.tags.some(t=>t.sec===S.sec && t.tone==='bad');
  const norm = t => t.split(' · ')[0].replace(/[0-9]+/g,'N');
  return d.tags.some(t=>norm(t.t)===S.tag);
}
function group(){
  const map = new Map();
  for(const e of DATA.events){
    if(S.mgr && e.mgr!==S.mgr) continue;
    if(!matchEvent(e)) continue;
    const a = anchor(e);
    if(!a.aid) continue;
    if(S.id && String(a.aid).indexOf(S.id)<0 && String(a.other||'').indexOf(S.id)<0) continue;
    if(!passScoreFilter(a.ent,a.aid,a.other)) continue;
    const key=a.ent+':'+a.aid;
    let g = map.get(key);
    if(!g){ g={ent:a.ent,aid:a.aid,title:a.title,other:a.other,events:[],chans:{},stages:{},last:0,mgr:e.mgr}; map.set(key,g); }
    g.events.push(e); if(e.ts>g.last){g.last=e.ts;g.mgr=e.mgr;} g.chans[e.type]=(g.chans[e.type]||0)+1; g.stages[e.stage]=1;
  }
  const arr=[...map.values()];
  arr.forEach(g=>g.events.sort((a,b)=>a.ts-b.ts));
  arr.sort((a,b)=> S.ord==='desc' ? b.last-a.last : a.last-b.last);
  return arr;
}
function chanIcons(chans){
  return Object.keys(chans).sort((a,b)=>chans[b]-chans[a]).slice(0,5).map(t=>`<i><b style="background:${typeColor(t)}"></b>${chans[t]}</i>`).join('');
}
function dealHTML(g, idx){
  const isLead = g.ent==='lead';
  const url = isLead ? `${PORTAL}/crm/lead/details/${esc(g.aid)}/` : `${PORTAL}/crm/deal/details/${esc(g.aid)}/`;
  const label = isLead ? 'Лид '+esc(g.aid) : 'Сделка '+esc(g.aid);
  const col = isLead ? '#C2873C' : 'var(--acc)';
  let other = '';
  if(g.other){ const ou = isLead?`${PORTAL}/crm/deal/details/${esc(g.other)}/`:`${PORTAL}/crm/lead/details/${esc(g.other)}/`;
    other = ` <a class="link2" href="${ou}" target="_blank" onclick="event.stopPropagation()">${isLead?'→ сделка '+esc(g.other):'← лид '+esc(g.other)}</a>`; }
  const link = `<a href="${url}" target="_blank" onclick="event.stopPropagation()" style="color:${col}">${label}</a>${other}`;
  return `<div class="deal" data-idx="${idx}">
    <div class="dhead">
      <span class="arw">▸</span>
      <span class="did">${link}</span>
      <span class="dttl" title="${esc(g.title)}">${esc(g.title)}</span>
      <span class="dmgr">${esc(g.mgr)}</span>
      <span class="dchips">${chanIcons(g.chans)}</span>
      <span class="dmeta">${g.events.length} соб · ${fmtDay(g.last)}</span>
    </div>
    ${scoreHTML(g)}
    <div class="thread" style="display:none"></div>
  </div>`;
}
let CUR_TAGS={};
const tagCol = t => t==='good'?'#2E9E74':t==='bad'?'#C25252':t==='info'?'#7C8794':'#C2873C';
// Подсветка места, по которому сработал тег: цитата подчёркивается прямо в тексте.
function hl(body, tags){
  let out = esc(body);
  for(const t of tags){ if(!t.quote) continue;
    const q = esc(t.quote); const i = out.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) continue;
    out = out.slice(0,i) + `<u class="hlq" style="text-decoration-color:${tagCol(t.tone)}">` + out.slice(i,i+q.length) + '</u>' + out.slice(i+q.length);
  }
  return out;
}
// Кто написал: клиент или наш сотрудник. У входящих в подписи часто стоит название чата,
// совпадающее с названием сделки, поэтому показываем слово «Клиент», а имя - только если оно
// действительно отличается и что-то добавляет.
// Дерево разбора: этап (лид -> сделка) -> кто вёл -> события с отступами по ролям.
// Плоский список не давал понять, где заканчивается работа с лидом и начинается сделка.
function treeHTML(events, sc){
  CUR_TAGS = (sc && sc.evTags) || {};
  const byStage = {lead:[], deal:[]};
  for(const e of events) (byStage[e.stage] || byStage.deal).push(e);
  const parts = (sc && sc.participants) || [];
  let out = '';
  for(const st of ['lead','deal']){
    const list = byStage[st]; if(!list.length) continue;
    const who = parts.filter(p=>p.stage===st).map(p=>`${esc(p.who)} · ${p.n}`).join(', ') || 'без исходящих';
    const id = st==='lead' ? (list[0].leadId||'') : (list[0].dealId||'');
    const url = st==='lead' ? `${PORTAL}/crm/lead/details/${id}/` : `${PORTAL}/crm/deal/details/${id}/`;
    const msgs = list.filter(e=>e.type.startsWith('Сообщение')||e.type==='Письмо'||e.type==='Мессенджер ОЛ'||e.type==='Звонок').length;
    out += `<div class="node">
      <div class="nhead"><span class="ndot ${st==='lead'?'n-lead':'n-deal'}"></span>
        <b>${st==='lead'?'ЛИД':'СДЕЛКА'} <a href="${url}" target="_blank" onclick="event.stopPropagation()">${esc(id)}</a></b>
        <span class="nsub">вёл: ${who}</span><span class="nsub">· ${list.length} событий, из них общения с клиентом ${msgs}</span></div>
      <div class="nbody">${list.map(e=>evRowHTML(e)).join('')}</div></div>`;
  }
  CUR_TAGS = {};
  return out;
}
// Строка события внутри дерева: клиент слева, наш ответ с отступом, внутренняя работа глубже.
function evRowHTML(e){
  const tags=(CUR_TAGS[e.src]||[]);
  const isMsg = e.type.startsWith('Сообщение')||e.type==='Письмо'||e.type==='Мессенджер ОЛ'||e.type==='Звонок';
  const lvl = !isMsg ? 'lv-task' : (e.dir==='входящее' ? 'lv-in' : 'lv-out');
  const bad = tags.some(t=>t.tone==='bad'), good = tags.length && !bad;
  const c = typeColor(e.type);
  const tagsHTML = tags.length ? `<span class="evtags">`+tags.map(t=>`<span class="evtag" style="color:${tagCol(t.tone)};border-color:${tagCol(t.tone)}55;background:${tagCol(t.tone)}12">${esc(t.t)}</span>`).join('')+`</span>` : '';
  const st = e.status?`<span class="st">${esc(e.status)}</span>`:'';
  const rec = e.link?`<a class="rec" href="${esc(e.link)}" target="_blank">запись</a>`:'';
  const ttl = e.title && !isMsg ? `<b>${esc(e.title)}: </b>` : '';
  const ref = e.ref?`<span class="ref">↳ ${esc(e.ref)}</span>`:'';
  return `<div class="erow ${lvl}${bad?' e-bad':good?' e-good':''}">
    <span class="etime">${fmtTime(e.dt)}</span>
    <span class="ewho">${isMsg? whoLabel(e) : '<span class="sysw">CRM · '+esc(e.who||e.mgr||'')+'</span>'}</span>
    <span class="ebody"><span class="badge" style="background:${c}18;color:${c};border:1px solid ${c}44">${esc(e.type)}</span> ${ttl}${tags.length?hl(e.body,tags):esc(e.body)}${st}${rec}${ref}</span>
    ${tagsHTML}</div>`;
}
function whoLabel(e){
  // Подпись «Телефон» стороны не даёт: направление восстановлено по тексту, помечаем это
  // явно, чтобы вывод РОПа опирался на понятную степень уверенности.
  if(e.dir!=='входящее') return esc(e.who||'')+(e.guess?'<span class="whosub" title="сторона определена по тексту сообщения, подпись канала была служебной">по тексту</span>':'');
  const nm=String(e.who||'').trim();
  const ttl=String(e.dealT||e.leadT||'').trim();
  const same = !nm || nm==='—' || (ttl && (ttl.indexOf(nm.slice(0,12))>=0 || nm.indexOf(ttl.slice(0,12))>=0));
  return same ? 'Клиент' : `Клиент<span class="whosub">${esc(nm.slice(0,22))}</span>`;
}
function evHTML(e, showStage){
  const c=typeColor(e.type);
  const dir = e.dir==='входящее'?'<span class="dir-in">←</span>':e.dir==='исходящее'?'<span class="dir-out">→</span>':'<span class="dir-n">·</span>';
  const st = e.status?`<span class="st">${esc(e.status)}${e.dur?' · '+esc(e.dur):''}</span>`:'';
  const rec = e.link?`<a class="rec" href="${esc(e.link)}" target="_blank">запись</a>`:'';
  const ttl = e.title?`<b>${esc(e.title)}: </b>`:'';
  const ref = e.ref?`<span class="ref">↳ ${esc(e.ref)}</span>`:'';
  const stg = showStage ? `<span class="stg ${e.stage==='lead'?'stg-lead':'stg-deal'}">${e.stage==='lead'?'лид':'сделка'}</span>` : '<span></span>';
  const mtags = (CUR_TAGS[e.src]||[]);
  const tagsHTML = mtags.length ? `<span class="evtags">`+mtags.map(t=>`<span class="evtag" style="color:${tagCol(t.tone)};border-color:${tagCol(t.tone)}55;background:${tagCol(t.tone)}12">${esc(t.t)}</span>`).join('')+`</span>` : '';
  const bad = mtags.some(t=>t.tone==='bad'), good = mtags.length && !bad;
  return `<div class="ev${bad?' ev-bad':good?' ev-good':''}">
    <span class="t">${fmtTime(e.dt)}</span>
    ${stg}
    <span><span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}55">${esc(e.type)}</span></span>
    <span>${dir}</span>
    <span class="who ${e.dir==='входящее'?'who-cli':e.dir==='исходящее'?'who-mgr':''}">${whoLabel(e)}</span>
    <span class="body">${ttl}${mtags.length?hl(e.body,mtags):esc(e.body)}${st}${rec}${ref}</span>
    ${tagsHTML}
  </div>`;
}
function toggle(el, forceOpen){
  const th=el.querySelector('.thread'), arw=el.querySelector('.arw');
  const open = th.style.display!=='none';
  if(open && forceOpen) return;
  if(!open){
    if(!th.dataset.filled){ const g=VIEW[+el.dataset.idx]; const mixed=Object.keys(g.stages).length>1;
      const sc=dealScore(g.ent,g.aid,g.other); CUR_TAGS=(sc&&sc.evTags)||{};
      const parts=(sc&&sc.participants)||[];
      const ph=parts.length? `<div class="parts">Переписку вели: `+parts.map(p=>`<span class="part"><b>${esc(p.who)}</b> · ${p.stage==='lead'?'на лиде':'на сделке'} · ${p.n}</span>`).join('<span style="color:var(--ink-4)">→</span>')+`</div>` : '';
      th.innerHTML = ph + g.events.map(e=>evHTML(e,mixed)).join(''); CUR_TAGS={}; th.dataset.filled='1'; }
    th.style.display=''; arw.textContent='▾';
  } else { th.style.display='none'; arw.textContent='▸'; }
}

const SC = DATA.scoring || null;
const SCD = {}; if(SC) for(const d of SC.deals) SCD[d.key]=d;
const probColor = p => p>=60?'#2E9E74':p>=30?'#C2873C':'#C25252';
function stars(r){ const f=Math.round(r); return '★★★★★'.slice(0,f)+'☆☆☆☆☆'.slice(0,5-f); }
const SECHELP={
  speed:['Отклик','Как быстро отвечаем клиенту. Норматив: первый ответ за 15 рабочих минут, клиент не ждёт дольше 4 часов. Отписки «ок, спасибо» за ответ не считаются.'],
  qual:['Квалификация','Выяснены ли до расчёта задача, размеры или ТЗ, срок и бюджет. Считается только на ранних стадиях - на производстве спрашивать бюджет поздно.'],
  deadline:['Сроки','Обещание всегда с конкретной датой («завтра до обеда», не «в ближайшее время»), дела в CRM не просрочены, нет пауз от 4 дней.'],
  polite:['Вежливость','Приветствие с обращением, извинение без жаргона («закрутился», «забыл») и без оправданий («вы не уточнили»).'],
  process:['Ведение','Следующий шаг назначен всегда, после КП идёт дожим, сделка не стоит на одной стадии месяцами.'],
  result:['Результат','Возражение отработано аргументом, сигнал оплаты доведён до счёта, отказ разобран, а не принят молча.'],
};
const COLHELP={
  deals:['Диалогов','Сколько сделок и лидов этого менеджера были в переписке за окно снимка (7 дней).'],
  prob:['Вероятность','Средний шанс закрыть сделку по его портфелю. Считается от фактической доли выигранных на этой стадии, поправленной на поведение в переписке.'],
  alerts:['Тревог','Сколько его сделок имеют хотя бы один красный тег: клиент ждёт ответа, тишина, нет следующего шага, риск отказа.'],
  rating:['Рейтинг','Взвешенная оценка по шести разделам, шкала 0-5. Меряет дисциплину ведения сделки, а не выручку. Не считается, если у менеджера меньше 10 диалогов.'],
};
function tone2col(t){ return t==='good'?'#2E9E74':t==='bad'?'#C25252':'#C2873C'; }
function pctCol(p){ return p>=70?'#2E9E74':p>=40?'#C2873C':'#C25252'; }
// Карточки диалогов внутри раскрытой строки: тот же рендер, что и в режиме «по сделкам».
// ===== ОЧЕРЕДЬ ДЕЛ: главный экран. Строка = сделка или лид, сортировка по деньгам под риском =====
const money = v => !v ? '-' : v>=1e6 ? (v/1e6).toFixed(1)+' млн' : Math.round(v/1000)+'к';
const urgCol = k => ({ready:'#2E9E74',waiting:'#C25252',refuse:'#C25252',objection:'#C2873C',silent:'#C2873C',nopush:'#C2873C',overdue:'#8B7BF0',nostep:'#8794A5'}[k]||'#5D6B77');
function renderTree(){
  const list=document.getElementById('list');
  if(!SC){ list.innerHTML='<div class="empty">разбор не посчитан</div>'; return; }
  // Индекс времени событий по сделкам - для фильтра «по коммуникациям».
  if(!window.EVTS){ window.EVTS={}; window.EVIX={};
    for(const e of DATA.events){ const k=e.dealId?'D'+e.dealId:'L'+e.leadId;
      (EVTS[k] ||= []).push(e.ts); (EVIX[k] ||= []).push(e); } }
  const dFrom=S.dFrom?Date.parse(S.dFrom+'T00:00:00+03:00'):0;
  const dTo=S.dTo?Date.parse(S.dTo+'T23:59:59+03:00'):0;
  const inPeriod=d=>{
    if(!dFrom&&!dTo) return true;
    if(S.dMode==='created'){
      // Дата создания приходит из снимка воронки. Её нет у лидов и у сделок вне C49,
      // поэтому запасной вариант - первое событие в ленте: сделка не должна исчезать
      // из таблицы только потому, что поля нет.
      const ts=EVTS[d.key]||[];
      const c=d.createdAt?Date.parse(d.createdAt+'T12:00:00+03:00'):(d.firstTs||(ts.length?Math.min.apply(null,ts):0));
      if(!c) return true;
      return (!dFrom||c>=dFrom)&&(!dTo||c<=dTo);
    }
    const ts=EVTS[d.key]||[];
    return ts.some(t=>(!dFrom||t>=dFrom)&&(!dTo||t<=dTo));
  };
  const DEALS=SC.deals.filter(inPeriod);
  const filtered=DEALS.length!==SC.deals.length;
  const byM={}; for(const d of DEALS) (byM[d.mgr] ||= []).push(d);
  const V={'сильный':['#2E9E74','СИЛЬНЫЙ'],'норма':['#C2873C','НОРМА'],'в разборе':['#C25252','В РАЗБОРЕ']};
  const MD=SC.metricDefs||[];
  // Полные названия метрик не помещаются в 16 колонок: в шапке короткие, полное - в подсказке.
  const SHORT={act:'Активность',take:'Взял',resp:'Ответ',ball:'Ждёт',silent:'Тишина',step:'Шаг',qual:'Квал.',fake:'Вхолост.',ghost:'Без связи',promise:'Слово',obj:'Возраж.',date:'Даты'};

          type:'Ответственный', dir:'-', who:'CRM', title:'', body:o.from+' → '+o.to, sys:1, src:'own#'+o.at});
      }
      const ekey=e=>S.sE.k==='ts'?e.ts:S.sE.k==='type'?e.type:S.sE.k==='who'?(e.dir==='входящее'?'клиент':e.who):e[S.sE.k];
      evs.sort((a,b)=>{ const x=ekey(a),y=ekey(b);
        if(typeof x==='number'&&typeof y==='number') return (x-y)*S.sE.d;
        return String(x??'').localeCompare(String(y??''))*S.sE.d; });
      const ECOLS=[{k:'ts',t:'Время'},{k:'who',t:'Кто'},{k:'type',t:'Канал'},{k:'body',t:'Сообщение',l:1},{k:'tags',t:'Разметка',l:1}];
      CUR_TAGS=(d&&d.evTags)||{};
      // Резюме BitrixGPT ссылается на звонок-источник (refId - ID активности звонка).
      // Пара «звонок -> резюме» должна читаться в обе стороны: у звонка метка, что
      // разбор есть, у резюме - к какому звонку и какого времени оно относится.
      const SUMBY={};
      for(const e of evs) if(e.type==='Резюме BitrixGPT'&&e.refId) SUMBY['act#'+e.refId]=e;
      const rows=evs.map(e=>{
        const tags=(CUR_TAGS[e.src]||[]);
        const bad=tags.some(t=>t.tone==='bad'), good=tags.some(t=>t.tone==='good')&&!bad;
        const isM=e.type.startsWith('Сообщение')||e.type==='Письмо'||e.type==='Мессенджер ОЛ'||e.type==='Звонок';
        const c3=typeColor(e.type);
        // Выбран период - подсвечиваем прозрачным фоном то, что в него попало: остальная
        // переписка остаётся для контекста, но видно, что именно происходило в эти даты.
        const inR=(dFrom||dTo)&&(!dFrom||e.ts>=dFrom)&&(!dTo||e.ts<=dTo);
        return `<tr class="erow2${e.sys?' sysrow':''}${inR?' inrng':''}${bad?' e-bad':good?' e-good':''}" data-src="${esc(e.src||'')}">
          <td class="etime">${fmtTime(e.dt)}</td>
          <td class="${e.dir==='входящее'?'who-cli':e.dir==='исходящее'?'who-mgr':''}">${isM?whoLabel(e):'<span class="sysw">CRM</span>'}</td>
          <td><span class="badge" style="background:${c3}18;color:${c3};border:1px solid ${c3}44">${esc(e.type)}</span></td>
          <td class="l ebody">${e.title&&!isM?`<b>${esc(String(e.title).replace(/[\s.:;-]+$/,''))}</b>${bodyNoTitle(e)?': ':''}`:''}${tags.length?hl(bodyNoTitle(e),tags):esc(bodyNoTitle(e))}${e.status?` <span class="st">${esc(e.status)}</span>`:''}${e.type==='Стадия'&&e.days!=null?` <span class="due">${e.days} дн на стадии</span>`:''}${dueChip(e)}${e.link?`<a class="rec" href="${esc(e.link)}" target="_blank">запись</a>`:''}${sumLink(e,SUMBY)}</td>
          <td class="l">${tags.map(t=>`<span class="evtag"${t.ai?' data-ai="1"':''} style="color:${tagCol(t.tone)};border-color:${tagCol(t.tone)}55;background:${tagCol(t.tone)}12">${esc(t.t)}</span>`).join(' ')}</td></tr>`;
      }).join('');
      const parts=(d&&d.participants)||[];
      const who=parts.length? parts.map(x=>`${esc(x.who)} (${x.stage==='lead'?'лид':'сделка'}, ${x.n})`).join(' → ') : 'исходящих не было';
      host.innerHTML=`<table class="tbl t3"><tr>`+ECOLS.map(c=>`<th class="${c.l?'l':''} sortable" data-lvl="e" data-k="${c.k}">${esc(c.t)}<span class="sarr">${arr(S.sE,c.k)}</span></th>`).join('')+`</tr>${rows}</table>`
        +`<div class="afterdlg">`
        +(d.ai&&d.ai.verdict?`<div class="aibox" style="border-color:${(AI_DOT[d.ai.tone]||'#8794A5')}55">
            <div class="aihead"><span class="aidot" style="background:${AI_DOT[d.ai.tone]||'#8794A5'}"></span><b>ИИ-итог по сделке</b></div>
            <div class="airow"><b>Итог:</b> ${esc(d.ai.verdict)}</div>
            ${d.ai.problem?`<div class="airow"><b style="color:#C25252">Проблема:</b> ${esc(d.ai.problem)}</div>`:`<div class="airow" style="color:#2E9E74">Проблем не видно, сделка ведётся правильно</div>`}
            ${d.ai.recommendation?`<div class="airow"><b style="color:#E8A33D">Рекомендация:</b> ${esc(d.ai.recommendation)}</div>`:''}
          </div>`:'')
        +`<div class="qnext"><b>Что сделать:</b> ${esc(d.next)}</div>`
        +`<div class="whob">Переписку вели: ${who}</div>`
        +(d.takeH!=null?`<div class="whob">Взял в работу за ${d.takeH} ч (отсчёт от начала дня создания: времени создания в снимке нет)</div>`:'')
        +(d.slowStage?`<div class="whob">Дольше всего стояла на стадии «${esc(d.slowStage.name)}» - ${d.slowStage.days} дн</div>`:'')
        +`<div class="whob"><span class="chip2" data-sys="1">${S.sys===false?'показать движение по стадиям':'скрыть движение по стадиям'}</span></div>`
        +(d.whyProb&&d.whyProb.length?`<div class="whyb">Почему шанс ${d.prob}%: базовая ${d.base}% `+d.whyProb.map(w=>`<span class="wchip" style="color:${w.bad?'#C25252':'#2E9E74'}">${w.pp>0?'+':''}${w.pp} п.п. ${esc(w.label)}</span>`).join('')+`</div>`:'')
        +`</div>`;
      CUR_TAGS={};
      host.querySelectorAll('th.sortable').forEach(th=>th.onclick=e=>{ e.stopPropagation();
        if(S.sE.k===th.dataset.k) S.sE.d=-S.sE.d; else { S.sE.k=th.dataset.k; S.sE.d=1; } renderTree(); });
      host.querySelectorAll('[data-sys]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); S.sys=(S.sys===false); renderTree(); });
    }
  }
  const hot=SC.deals.filter(d=>d.urgency);
  document.getElementById('stat').textContent=`менеджеров ${mgrs.length} · сделок и лидов ${SC.deals.length} · требуют действия ${hot.length} на ${money(hot.reduce((s2,d)=>s2+(d.budget||0),0))} ₽`;
  document.getElementById('foot').textContent=`Три уровня, у каждого свои столбцы и сортировка кликом по заголовку. Менеджер: метрики против медианы отдела, зелёное лучше отдела, красное хуже. Сделка: сумма, шанс, тишина, скорость. Диалог: кто, канал, текст и разметка дефектов.`;
}
// У дел заголовок часто дублируется в начале описания: «Формирование ТЗ: Формирование ТЗ...».
// Показываем тело без повтора, иначе строка читается как каша.
// Уровень 2: ИИ-итог по сделке. В таблице - светофор + первая фраза вердикта, в подсказке
// полный разбор. Всю переписку читает ИИ и выдаёт вывод одним взглядом.
const AI_DOT={good:'#2E9E74',warn:'#E8A33D',bad:'#C25252'};
function aiDealCell(d){
  const a=d.ai; if(!a||!a.verdict) return '<span class="na2">-</span>';
  const c=AI_DOT[a.tone]||'#8794A5';
  const body=`<div class="tl">ИИ-итог по сделке</div>`
    +`<div class="qb" style="margin-bottom:6px"><b>Итог:</b> ${esc(a.verdict)}</div>`
    +(a.problem?`<div class="qh" style="color:#C25252">Проблема</div><div class="qb">${esc(a.problem)}</div>`:'<div class="qb" style="color:#2E9E74">Проблем не видно, сделка ведётся правильно</div>')
    +(a.recommendation?`<div class="qh" style="color:#E8A33D">Рекомендация</div><div class="qb">${esc(a.recommendation)}</div>`:'')
    +`<div class="qn">Разбор всей переписки языковой моделью. Обновляется на ночном снимке.</div>`;
  return `<span class="aidot" style="background:${c}"></span><span class="aidv" data-tip="${body.replace(/"/g,'&quot;')}">${esc(a.verdict.slice(0,40))}${a.verdict.length>40?'…':''}</span>`;
}
// Русские окончания: «3 дела», а не «3 дел».
function plu(n,one,few,many){ const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return many; if(b>1&&b<5) return few; if(b===1) return one; return many; }
// Состав ленты сделки одним взглядом: сколько сообщений, звонков, писем и дел.
// Ноли не печатаем - строка должна читаться, а не считаться.
// Состав ленты за выбранный период. Без фильтра берём предпосчитанный mix за всё окно
// снимка, с фильтром пересчитываем на лету: РОП смотрит «что менеджер делал в этот день».
function mixOf(d,a,b){
  if(!a&&!b) return d.mix||null;
  const evs=(window.EVIX&&EVIX[d.key])||[];
  const m={msg:0,chan:0,call:0,mail:0,task:0,note:0,ai:0,total:0}, ch=new Set();
  for(const e of evs){ if(a&&e.ts<a)continue; if(b&&e.ts>b)continue;
    // Резюме BitrixGPT - это разбор звонка, а не отдельная коммуникация: сам звонок уже
    // посчитан, поэтому резюме в счёт ленты не идёт (помечаем звонок как «с разбором»).
    if(e.type==='Резюме BitrixGPT'){ m.ai++; continue; }
    m.total++;
    if(e.type&&e.type.indexOf('Сообщение')===0){ m.msg++; ch.add(e.type); }
    else if(e.type==='Мессенджер ОЛ') m.msg++;
    else if(e.type==='Звонок') m.call++;
    else if(e.type==='Письмо') m.mail++;
    else if(e.type==='Дело'||e.type==='Задача') m.task++;
    else if(e.type==='Комментарий-заметка') m.note++; }
  m.chan=ch.size; return m;
}
function mixCell(d,a,b){
  const m=mixOf(d,a,b); if(!m) return '<span class="na2">-</span>';
  const p=[];
  if(m.msg) p.push([m.msg+' '+plu(m.msg,'сообщение','сообщения','сообщений')+(m.chan>1?` в ${m.chan} `+plu(m.chan,'канале','каналах','каналах'):''),'#2E9E74']);
  if(m.call) p.push([m.call+' '+plu(m.call,'звонок','звонка','звонков')+(m.ai?' с разбором':''),'#3DAEC2']);
  if(m.mail) p.push([m.mail+' '+plu(m.mail,'письмо','письма','писем'),'#C2873C']);
  if(m.task) p.push([m.task+' '+plu(m.task,'дело','дела','дел'),'#8B7BF0']);
  if(m.note) p.push([m.note+' '+plu(m.note,'заметка','заметки','заметок'),'#8794A5']);
  if(!p.length) return '<span class="na2">пусто</span>';
  return p.map(x=>`<span class="mixchip" style="color:${x[1]};border-color:${x[1]}44;background:${x[1]}12">${esc(x[0])}</span>`).join(' ');
}
// Связка звонка и его разбора BitrixGPT: у звонка - подпись с началом резюме,
// у самого резюме - к какому звонку и на какое время оно относится.
function sumLink(e,SUMBY){
  if(e.type==='Резюме BitrixGPT') return e.ref?`<div class="ref">↳ ${esc(e.ref)}</div>`:'';
  const s=SUMBY&&SUMBY[e.src];
  if(!s) return '';
  return `<div class="ref">↳ разбор BitrixGPT: ${esc(String(s.body||'').replace(/\s+/g,' ').slice(0,110))}${String(s.body||'').length>110?'…':''}</div>`;
}
// У дел в Bitrix есть выставленный срок (DEADLINE/END_TIME). Показываем его рядом со
// статусом: просроченный - красным, будущий - серым. Без срока чипа нет.
function dueChip(e){
  if(!e.due) return '';
  const t=fmtTime(e.due); if(!t) return '';
  const over = e.status==='просрочено' || (e.status!=='выполнено' && new Date(e.due) < new Date());
  return ` <span class="due" style="${over?'color:#C25252;border-color:#C2525255':''}">срок ${t}</span>`;
}
function bodyNoTitle(e){
  const b=String(e.body||'').trim(), t=String(e.title||'').trim();
  if(!t) return b;
  if(b.toLowerCase().startsWith(t.toLowerCase())) return b.slice(t.length).replace(/^[\s:,;.\-–»]+/,'');
  return b;
}
const fmtMinShort = v => v===null||v===undefined?'-':(v<60?v+' м':(v/60).toFixed(1)+' ч');

function render(){
  VIEW=[]; renderTree(); return;
  VIEW = group();
  const show = VIEW.slice(0, DEAL_LIMIT);
  const list=document.getElementById('list');
  const secL = S.sec && SC ? (SC.sections.find(x=>x.key===S.sec)||{}).label : '';
  const crumb = (S.mgr||S.sec||S.tag) ? `<div class="crumb">
      <span class="x" onclick="backToTable()">← к таблице</span>
      ${S.mgr?`<span>Менеджер: <b>${esc(S.mgr)}</b></span>`:''}
      ${secL?`<span>· дефекты раздела: <b>${esc(secL)}</b></span>`:''}
      ${S.tag?`<span>· тег: <b>${esc(S.tag)}</b></span>`:''}
      <span class="x" onclick="clearScoreFilter()">сбросить фильтр</span></div>` : '';
  list.innerHTML = crumb + (show.length ? show.map((g,i)=>dealHTML(g,i)).join('') : `<div class="empty">по этому фильтру диалогов нет</div>`);
  list.querySelectorAll('.deal').forEach(d=>d.querySelector('.dhead').onclick=()=>toggle(d));
  const totEv = VIEW.reduce((s,g)=>s+g.events.length,0);
  const unit = S.mode==='deal' ? 'сделок/лидов' : 'лидов/сделок';
  document.getElementById('stat').textContent = `${unit}: ${VIEW.length}${VIEW.length>DEAL_LIMIT?` (показаны первые ${DEAL_LIMIT}, сузьте фильтр)`:''} · событий: ${totEv}`;
  document.getElementById('foot').textContent = `Снимок: ${DATA.events.length} событий. «Смотрим по сделкам» - лид сливается в свою сделку; «по лидам» - сделка сливается в лид. Метка «лид»/«сделка» у события - где в пути оно произошло. Клик по ID - карточка в Bitrix24.`;
}
initControls(); render();

// Анти-кэш для боевого адреса /dialog/: деплой кладёт рядом v.txt со штампом сборки.
// Проверяем при загрузке, при возврате на вкладку и раз в 15 минут - давно открытая
// вкладка тоже подтянет свежую версию. Перезагрузка одна на версию (sessionStorage),
// иначе упрямый кэш зациклил бы страницу.
(function(){try{
  if(location.protocol==='file:'||!BAKED_AT)return;
  const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
    v=(v||'').trim();
    if(!v||v===BAKED_AT||v<BAKED_AT)return;
    if(sessionStorage.getItem('_dlgv')===v)return;
    sessionStorage.setItem('_dlgv',v);
    location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }).catch(()=>{})};
  chk();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
  setInterval(chk,9e5);
}catch(e){}})();
</script>
</body>
</html>
