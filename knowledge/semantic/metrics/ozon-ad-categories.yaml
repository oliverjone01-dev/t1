id: ozon-ad-categories
title: "Маркетинг: реклама по категориям"
version: 1
status: approved
owner: "Иван Раюшкин"
approved_at: "2026-10-27"
authorization: "Иван: да, исправляй; ответ на предложение учитывать все кампании, известные категории, CPO отдельно и неизвестное н/д"
entity: campaign
key: [id]
mode: period
timezone: Europe/Moscow
interval: "[from, to], обе даты включительно, существующий фильтр Marketing"
date_field: "дата статистики OZON Performance; CPO-выручка из ранее согласованного cpo-orders-rev только при полном покрытии окна"
formula_text: >
  Каждая кампания из all включается ровно один раз. Категория: полный справочник SKU,
  затем точное совпадение offer, затем явно известная категория метаданных кампании.
  Неопределённое остаётся отдельной строкой. Общая CPO-кампания всегда отдельно.
  Расход, выручка и штуки суммируются по кампаниям категории. ДРР = расход / рекламная
  выручка той же категории и периода ×100. При нулевой или неизвестной выручке ДРР н/д.
  CPO: API-ноль не признаётся нулевой выручкой; известная CPO-выручка и штуки используются
  только при полном покрытии окна принятым расчётом cpo-orders-rev. Частичное покрытие = н/д
  за полное окно, подробность остаётся в таблице кампаний. Общие KPI/юнит-экономика не меняются.
filters:
  include_statuses: [active, inactive]
  exclude: []
cancellations_returns:
  mode: "CPC: как в существующей статистике Performance; CPO: принятые отправления без отменённых как cpo-orders-rev"
  return_date_basis: "существующая логика источников без изменений"
empty_value: "null; неизвестность одного слагаемого делает итог этой метрики категории неизвестным"
partial_period: "CPO неполное покрытие не экстраполируется"
source:
  files: [ads_daily.ndjson, ads_30d.json, sku_taxonomy.json, skus_live_30d.json]
  additional: "CPO - существующий cpoRevFix, изолированная копия, без изменений формулы"
reconciliation:
  method: "Сумма расходов категорий = сумма всех кампаний; исходные денежные ячейки и прочие блоки неизменны"
  limitation: "Проверка полноты группировки; независимая бухгалтерская сверка не заявляется"
golden_rows:
  - "27.09–26.10: все76кампаний2259408, прежнийтоп101631928, потеря627480"
  - "Кампания44990352:37714,SKU3564822409, категорияСтолы из полной таксономии"
  - "Кампания46083706:35490, категорияСтолы из явной line=столы"
  - "CPO28753239:1105968 отдельно; покрытиевыручки4из30дней => н/д за всё окно"
