name: B24 calls probe (разбор сделки 91033 - что за звонок, read-only)

# Разбираем конкретную сделку: её контакт/компания, активности-звонки на самой сделке,
# поле BINDINGS у звонка (привязка активности к нескольким сущностям), запись через
# voximplant по CRM_ACTIVITY_ID. Только чтение. Запуск: push этого файла в rop-dashboard-v1.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-calls-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Разбор сделки 91033
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета B24_WEBHOOK_URL"; exit 1; fi
          cat > /tmp/one.mjs <<'MJS'
          const base = (process.env.B24_WEBHOOK_URL || '').replace(/\/+$/,'');
          const call = async (m,p={}) => {
            const r = await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
            let j={}; try{j=await r.json();}catch(e){j={error:'parse'};}
            return j;
          };
          const short=(o,n=1500)=>{const t=JSON.stringify(o);return t.length>n?t.slice(0,n)+'…':t;};
          const DEAL=91033;
          (async()=>{
            const d=(await call('crm.deal.get',{id:DEAL})).result||{};
            console.log(`Сделка ${DEAL}: «${d.TITLE}» | стадия ${d.STAGE_ID} | CONTACT_ID=${d.CONTACT_ID} | COMPANY_ID=${d.COMPANY_ID} | LEAD_ID=${d.LEAD_ID||'-'}`);
            // связанные контакты (может быть несколько)
            const cont=(await call('crm.deal.contact.items.get',{id:DEAL})).result||[];
            console.log('Контакты сделки:', JSON.stringify(cont));

            // 1) Активности НА САМОЙ СДЕЛКЕ (owner = deal)
            const onDeal=(await call('crm.activity.list',{ filter:{OWNER_TYPE_ID:2, OWNER_ID:DEAL},
              select:['ID','TYPE_ID','PROVIDER_ID','DIRECTION','SUBJECT','COMPLETED','OWNER_TYPE_ID','OWNER_ID','BINDINGS','ASSOCIATED_ENTITY_ID'] })).result||[];
            console.log(`\n[1] Активностей с OWNER=сделка: ${onDeal.length}`);
            for(const a of onDeal) console.log(`  #${a.ID} | тип ${a.TYPE_ID}/${a.PROVIDER_ID} | dir ${a.DIRECTION} | «${(a.SUBJECT||'').slice(0,45)}» | BINDINGS=${short(a.BINDINGS,300)}`);

            // 2) Звонки на КОНТАКТЕ сделки + их BINDINGS (проверяем привязку к сделке)
            const cid=d.CONTACT_ID||(cont[0]&&cont[0].CONTACT_ID);
            if(cid){
              const onC=(await call('crm.activity.list',{ filter:{OWNER_TYPE_ID:3, OWNER_ID:cid, PROVIDER_ID:'VOXIMPLANT_CALL'},
                order:{ID:'DESC'}, select:['ID','DIRECTION','SUBJECT','PROVIDER_ID','BINDINGS','SETTINGS','FILES'] })).result||[];
              console.log(`\n[2] Звонков VOXIMPLANT на контакте ${cid}: ${onC.length}. Первые 5 (с BINDINGS):`);
              for(const a of onC.slice(0,5)){
                console.log(`  звонок #${a.ID} | dir ${a.DIRECTION} (1=вх,2=исх) | «${(a.SUBJECT||'').slice(0,40)}»`);
                console.log(`     BINDINGS=${short(a.BINDINGS,400)}`);
                // запись через voximplant по activity id
                const v=(await call('voximplant.statistic.get',{ filter:{CRM_ACTIVITY_ID:a.ID} })).result||[];
                if(v[0]) console.log(`     voximplant: CALL_TYPE=${v[0].CALL_TYPE} REC=${v[0].CALL_RECORD_URL||('file:'+v[0].RECORD_FILE_ID)} CRM_ENTITY=${v[0].CRM_ENTITY_TYPE}/${v[0].CRM_ENTITY_ID}`);
              }
            }
            // 3) Полная структура одного звонка (чтобы увидеть все привязки)
            const anyCall=onDeal.find(a=>String(a.PROVIDER_ID).includes('VOXIMPLANT'));
            if(anyCall){ const full=(await call('crm.activity.get',{id:anyCall.ID})).result||{};
              console.log('\n[3] Полный звонок на сделке:', short(full,1200)); }
          })().catch(e=>console.log('FATAL', e && e.message));
          MJS
          node /tmp/one.mjs
