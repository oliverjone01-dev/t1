name: Task canvas checks
on:
  pull_request:
    paths: ['task-canvas/**', '.github/workflows/task-canvas-ci.yml']
  push:
    paths: ['task-canvas/**', '.github/workflows/task-canvas-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.mjs && node --check public/model.mjs && npm test
        working-directory: task-canvas
