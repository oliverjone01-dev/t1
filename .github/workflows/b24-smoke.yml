name: B24 webhook smoke (read-only)

# Read-only разведка портала Bitrix (только счётчики и стадии — компактный вывод).
# Значение секрета GitHub автомаскирует. Никаких записей.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
    steps:
      - name: Разведка (лиды vs категория 69, объёмы, стадии)
        run: |
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета"; exit 1; fi
          echo "::add-mask::$B24_WEBHOOK_URL"
          base="${B24_WEBHOOK_URL%/}"
          post(){ curl -sS --max-time 30 -X POST "$base/$1.json" -H 'Content-Type: application/json' -d "$2"; }

          echo "== Классические лиды (crm.lead) =="
          post crm.lead.list '{"select":["ID"],"start":0}' > /tmp/lead.json || true
          node -e 'let j={};try{j=require("/tmp/lead.json")}catch(e){};console.log(j.error?("error: "+(j.error_description||j.error)):("total = "+j.total));'

          echo "== Стадии воронки лидов (ENTITY_ID=STATUS) =="
          post crm.status.list '{"filter":{"ENTITY_ID":"STATUS"}}' > /tmp/ls.json || true
          node -e 'let j={};try{j=require("/tmp/ls.json")}catch(e){};console.log((j.result||[]).map(x=>x.STATUS_ID+":"+x.NAME).join(" | ")||"(нет)");'

          echo "== Сделки по категориям 49 (GG RF) и 69 (GG Лиды) =="
          for c in 49 69; do
            post crm.deal.list "{\"filter\":{\"CATEGORY_ID\":$c},\"select\":[\"ID\"],\"start\":0}" > /tmp/d.json || true
            node -e "let j={};try{j=require('/tmp/d.json')}catch(e){};console.log('CATEGORY_ID=$c total =', j.total!==undefined?j.total:('error '+(j.error_description||j.error)));"
          done

          echo "== Стадии воронки 49 (GG RF Заказы) =="
          curl -sS --max-time 30 "$base/crm.dealcategory.stage.list.json?id=49" > /tmp/s49.json || true
          node -e 'let j={};try{j=require("/tmp/s49.json")}catch(e){};console.log((j.result||[]).map(x=>x.STATUS_ID+":"+x.NAME).join(" | "));'

          echo "== Источники (SOURCE) и тип клиента (для маппинга) =="
          post crm.status.list '{"filter":{"ENTITY_ID":"SOURCE"}}' > /tmp/src.json || true
          node -e 'let j={};try{j=require("/tmp/src.json")}catch(e){};console.log("SOURCE:",(j.result||[]).map(x=>x.STATUS_ID+":"+x.NAME).join(" | "));'

          echo "== Лиды genglass (UF бренд=2319) — объём =="
          post crm.lead.list '{"filter":{"UF_CRM_1772609158":2319},"select":["ID"],"start":0}' > /tmp/lg.json || true
          node -e 'let j={};try{j=require("/tmp/lg.json")}catch(e){};console.log(j.error?("error "+(j.error_description||j.error)):("genglass-лиды total = "+j.total));'
