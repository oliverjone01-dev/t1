<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Командный центр РОПа</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0B0F15;--bg-card:#131820;--bg-elevated:#1A2029;--bg-soft:#232B36;--border:#1F2731;--border-soft:#161C24;--border-hot:#2B3441;
--ink:#F1F4F8;--ink-2:#A0AAB8;--ink-3:#6A7484;--ink-4:#3F4855;--accent:#22D3EE;--accent-2:#06B6D4;--accent-deep:#0E7490;--accent-soft:rgba(34,211,238,.10);
--d1:#22D3EE;--d2:#6366F1;--d3:#10B981;--d4:#A78BFA;--d5:#F472B6;--d6:#FB923C;--up:#10B981;--dn:#F43F5E;--warn:#F59E0B;--info:#A78BFA;
--radius:10px;--radius-lg:14px;--ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{background:radial-gradient(ellipse 60% 40% at 50% -8%,rgba(34,211,238,.05),transparent 70%),var(--bg-base);color:var(--ink);font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hdr{position:sticky;top:0;z-index:60}
.topbar{padding:11px 24px;border-bottom:1px solid var(--border-soft);background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}
.brand b{font-family:'Manrope';font-weight:800;font-size:14px}.brand span{display:block;font-size:10.5px;color:var(--ink-3)}
.nav{display:flex;gap:3px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:3px}
.nav button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:7px;cursor:pointer;transition:.15s}
.nav button.on{background:var(--accent-soft);color:var(--accent)}.nav button:hover:not(.on){color:var(--ink)}
.tb-spacer{flex:1}
.seg{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:10.5px;padding:5px 7px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.msel{position:relative;display:inline-block}
.msel-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--ink-2);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.msel-panel{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:8px;min-width:210px;max-height:300px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.msel-panel label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.msel-panel label:hover{background:var(--bg-elevated)}
.msel-foot{border-top:1px solid var(--border-soft);margin-top:6px;padding-top:6px;text-align:right}
.msel-foot button{background:transparent;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer}
.lsort{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0;text-align:left}
.dhh{background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;width:100%;text-align:center}
.dhh.l{text-align:left}.dhh.on{color:var(--accent)}
.dwell-split{display:flex;gap:20px;align-items:stretch}
.dwell-split .dw-tbl{flex:1.35;min-width:0}
.dwell-split .dw-chart{flex:1;min-width:0;border-left:1px solid var(--border-soft);padding-left:20px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:1150px){.dwell-split{flex-direction:column}.dwell-split .dw-chart{border-left:0;padding-left:0;border-top:1px solid var(--border-soft);padding-top:14px}}
.lsort.on{color:var(--accent)}
.controls{padding:9px 10px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px)}
.controls>*{flex-shrink:0}
.ctl-lbl{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;max-width:210px}
.wrap{max-width:1660px;margin:0 auto;padding:8px 24px 80px}
.sec-div{display:flex;align-items:center;gap:14px;margin:30px 0 14px;scroll-margin-top:120px}
.sec-div:first-child{margin-top:14px}
.sec-num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:14px;flex-shrink:0}
.sec-div h2{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.sec-div .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border-hot),transparent)}
.sec-div .hint{font-size:11px;color:var(--ink-3)}
.kpi-strip{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:14px;margin-bottom:14px}
@media(max-width:1200px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
.kpi-qty{position:absolute;top:12px;right:14px;text-align:right;line-height:1.05}
.kpi-qty b{font-family:'Manrope';font-weight:800;font-size:18px;color:var(--ink-2)}
.kpi-qty span{display:block;font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.kpi-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;animation:fadeUp .4s var(--ease-out) both;display:flex;flex-direction:column;align-items:flex-start}
.kpi-foot{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;width:100%;text-align:center}.kpi-foot>*{margin-top:0!important}
.kpi-cell::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac,var(--accent)),transparent)}
.kpi-k{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.kpi-v{font-family:'Manrope';font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1}
.kpi-v .u{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px}
.kpi-money{font-family:'Manrope';font-weight:700;font-size:14px;color:var(--ink-2);margin-top:6px}
.kpi-money b{color:var(--ink)}
.kpi-trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:8px;padding:2px 7px;border-radius:6px}
.kpi-trend.up{color:var(--up);background:rgba(16,185,129,.12)}.kpi-trend.dn{color:var(--dn);background:rgba(244,63,94,.12)}.kpi-trend.flat{color:var(--ink-3);background:var(--bg-elevated)}
.kpi-trend small{color:var(--ink-4);font-weight:500;margin-left:2px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;animation:fadeUp .45s var(--ease-out) both}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:16px;flex-wrap:wrap}
.card-title{font-family:'Manrope';font-weight:700;font-size:15px;margin-bottom:2px}
.card-sub{font-size:11px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid2>*,.grid3>*{min-width:0}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1100px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px 10px;text-align:center}
.gauge h4{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.gauge .gnote{font-size:10px;color:var(--ink-4);margin-top:2px}.gauge .gnote b{color:var(--ink-2)}
.grp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grp{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.grp{grid-template-columns:repeat(2,1fr)}}
.grp-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;position:relative;overflow:hidden;cursor:default}
.grp-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gc)}
.grp-card .gn{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-bottom:7px}
.grp-card .gc{font-family:'Manrope';font-weight:800;font-size:24px}
.grp-card .gm{font-size:11.5px;color:var(--ink-2);margin-top:3px;font-weight:600}
.grp-card .gd{font-size:9.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;background:var(--bg-card);cursor:pointer;user-select:none}
.tbl th:hover{color:var(--ink)}.tbl th.sorted{color:var(--accent)}.tbl th.sorted::after{content:" ↓";font-size:9px}.tbl th.sorted.asc::after{content:" ↑"}
.tbl th.r,.tbl td.r{text-align:right}.tbl tr:last-child td{border-bottom:none}.tbl td.name{font-weight:600;color:var(--ink)}
.tbl tr.total td{background:var(--bg-elevated);font-weight:700;color:var(--ink);border-top:1px solid var(--border-hot)}
.tbl tbody tr:hover td{background:rgba(120,140,170,.12)}
.tbl tbody tr.total:hover td{background:var(--bg-elevated)}
.chrow:hover{background:rgba(120,140,170,.10);border-radius:4px}
.ddopt:hover{background:rgba(120,140,170,.16)!important}
.dhcol .dhg{opacity:0;transition:opacity .1s}.dhcol:hover .dhg{opacity:.6}
.fbar{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.fbar .fl{width:185px;font-size:11.5px;color:var(--ink-2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft{flex:1;height:24px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.fbar .ff{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#06121a;transform-origin:left;animation:grow .8s var(--ease-out) both}
.fbar .fv{width:128px;font-size:11px;color:var(--ink-3);flex-shrink:0}.fbar .fv b{color:var(--ink);font-weight:700}
.lgd{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:11px}.lgd div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);cursor:pointer;user-select:none;transition:.15s}
.lgd i{width:9px;height:9px;border-radius:2px}.lgd div.off{opacity:.32}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.mx th,.mx td{padding:7px 7px;text-align:right;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
.mx th{font-size:9.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;background:var(--bg-card);white-space:nowrap}
.mx th.lh,.mx td.lc{text-align:left}.mx td.lc{font-weight:600;color:var(--ink)}
.mx td.tot,.mx th.toth{background:var(--bg-elevated);font-weight:700;color:var(--ink);border-left:2px solid var(--border-hot)}
.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#2e3947 var(--bg-base)}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track{background:var(--bg-base);border-radius:5px}
.scroll::-webkit-scrollbar-thumb{background:#2e3947;border-radius:5px;border:2px solid var(--bg-base)}
.scroll::-webkit-scrollbar-thumb:hover{background:#3d4a5c}.foot{text-align:center;color:var(--ink-4);font-size:11px;margin-top:28px}
.tag{font-size:9.5px;padding:2px 7px;border-radius:5px;background:rgba(245,158,11,.14);color:var(--warn);font-weight:600}
.tag.bad{background:rgba(244,63,94,.14);color:var(--dn)}
.note{font-size:11px;color:var(--ink-3);background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.lossbtn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:7px 13px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s}
.lossbtn:hover{color:var(--accent);border-color:var(--border-hot)}
.plan-inp{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;width:120px;font-variant-numeric:tabular-nums}
.plan-inp:focus{outline:none;border-color:var(--accent)}
.seg-anim{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--ease-out) both}
.line-anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease-out) forwards}
.dpath{cursor:pointer}.dpath:hover{opacity:1!important;filter:drop-shadow(0 0 8px currentColor)}
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid var(--border-hot);border-radius:9px;padding:9px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:280px}

#tip .qh{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 2px}
#tip .qh:first-child{margin-top:0}
#tip .qw{color:#22D3EE}#tip .qq{color:#F59E0B}#tip .qc{color:#10B981}
#tip .qb{white-space:normal;line-height:1.45}
#tip b{font-family:'Manrope'}#tip .tl{color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;padding:1px 0}#tip .tr span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
#tip .tip-tot{display:flex;justify-content:space-between;gap:20px;align-items:baseline;font-family:'Manrope';margin:3px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--border-hot)}
#tip .tip-tot span:first-child{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
#tip .tip-tot span:last-child{font-size:19px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.kbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:1000px){.kbox{grid-template-columns:1fr}}
.kstat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.kstat h5{font-family:'Manrope';font-weight:700;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kstat .row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border-soft)}
.kstat .row:last-child{border:0}.kstat .row b{font-variant-numeric:tabular-nums;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%}

.lf-bars{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.lf-bar{display:grid;grid-template-columns:210px 1fr 122px;align-items:center;gap:14px}
.lf-name{font-size:12.5px;color:var(--ink-2);text-align:right}
.lf-track{height:28px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.lf-fill{height:100%;border-radius:6px 0 0 6px;min-width:3px;transform-origin:left;animation:grow .85s var(--ease-out) both}
.lf-meta{display:flex;align-items:baseline;gap:8px}
.lf-val{font-family:'Manrope';font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lf-pct{font-size:12px;font-weight:700;color:var(--ink-3)}
.ro-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:22px}
.ro-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin:0 0 12px}
.ro-dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ro-donut{width:180px;flex:0 0 auto}
.ro-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px}
.ro-lg{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0}
.ro-lg .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.ro-lg .nm{flex:1;color:var(--ink)}
.ro-lg .vl{font-weight:700;color:var(--ink)}
.ro-lg .pc{color:var(--ink-3);font-size:11.5px;min-width:42px;text-align:right}
.ro-lg.hl{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);border-radius:9px;padding:6px 9px;margin:-2px 0}
.ro-lg.hl .nm{font-weight:700}
.ro-lg.dim{opacity:.58}
.ro-reason{display:flex;flex-direction:column;gap:10px}
.ro-badge{font-size:10px;font-weight:700;color:var(--dn);background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);border-radius:7px;padding:3px 8px;align-self:flex-start}
.ro-line{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ro-rank{font-size:11px;color:var(--ink-4);width:15px;text-align:right;font-variant-numeric:tabular-nums}
.ro-rname{font-size:12.5px;flex:0 0 auto;max-width:215px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.ro-track{flex:1;height:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:5px;overflow:hidden;min-width:40px}
.ro-fill{height:100%;background:linear-gradient(90deg,#FB7185,#F43F5E);border-radius:5px}
.ro-count{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.ro-rpct{font-size:11px;color:var(--ink-3);margin-left:6px;font-weight:600}
.note code{background:var(--bg-base);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--accent)}
@media(max-width:860px){.lf-bar{grid-template-columns:120px 1fr 92px;gap:9px}.ro-grid{grid-template-columns:1fr}}
.mg-list{display:flex;flex-direction:column;gap:9px}
.mg-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:11px}
.mg-name{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-track{height:20px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mg-bar{display:flex;height:100%;min-width:24px;border-radius:5px;overflow:hidden;transform-origin:left;animation:grow .8s var(--ease-out) both}
.mg-tot{font-size:13px;font-weight:800;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.ov2grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:stretch;margin-bottom:14px}
@media(max-width:1000px){.ov2grid{grid-template-columns:1fr}}
.ov2grid>.card{margin-bottom:0}
.cf{display:flex;flex-direction:column;gap:0;margin-top:6px}
.cf-step{display:grid;grid-template-columns:78px 1fr 50px;align-items:center;gap:10px}
.cf-name{font-size:12px;color:var(--ink-2);text-align:right}

function saleKey(d){return S.dateBasis==='outcome'?(soldDate(d)||d.closed||d.created):d.created;}
function closeKey(d){return S.dateBasis==='outcome'?(d.closed||d.created):d.created;}
// «Передано в производство»: первый вход сделки в производственные стадии
// (Заказ в производстве / произведён / отправлен - по истории стадий).
const PROD_STAGES=['C49:FINAL_INVOICE','C49:1','C49:2'];
// «Предоплата получена»: первый вход сделки в стадию C49:EXECUTING.
function prepayDate(d){for(const h of(d.hist||[]))if(h[0]==='C49:EXECUTING')return h[1];return null;}
function prepayKey(d){return S.dateBasis==='outcome'?(prepayDate(d)||d.created):d.created;}
function prepaySet(a,b){a=a||S.start;b=b||S.end;
  if(S.dateBasis==='outcome')return flt(AD,true).filter(d=>{const pd=prepayDate(d);return pd&&pd>=a&&pd<=b;});
  return flt(AD,true).filter(d=>prepayDate(d)&&d.created>=a&&d.created<=b);}
function prodDate(d){for(const h of(d.hist||[]))if(PROD_STAGES.includes(h[0]))return h[1];return null;}
function prodKey(d){return S.dateBasis==='outcome'?(prodDate(d)||d.created):d.created;}
function prodSet(a,b){a=a||S.start;b=b||S.end;
  if(S.dateBasis==='outcome')return flt(AD,true).filter(d=>{const pd=prodDate(d);return pd&&pd>=a&&pd<=b;});
  return flt(AD,true).filter(d=>prodDate(d)&&d.created>=a&&d.created<=b);}
// Тумблер периода S.dateBasis: 'created' (по дате СОЗДАНИЯ, как было - дефолт) или
// 'outcome' (по дате ИСХОДА - продажи/потери считаются когда они состоялись).
// Наборы продаж/потерь в окне [a,b] (по умолчанию текущий период). Уважают фильтры flt().
function soldSet(a,b){a=a||S.start;b=b||S.end;
  if(S.dateBasis==='outcome')return flt(AD,true).filter(d=>{if(!SOLD(d))return false;const sd=soldDate(d);return sd&&sd>=a&&sd<=b;});
  return flt(AD,true).filter(d=>SOLD(d)&&d.created>=a&&d.created<=b);}

// metrics. D/L = когорта по дате СОЗДАНИЯ (intake: лиды, создано сделок, конверсии).
// so/lo = продажи/потери по дате ИСХОДА в периоде (деньги/результат). Если не переданы -
// откат к когортному расчёту (обратная совместимость).

  let h=`<div class='tl'>${label}</div><div class='tip-tot'><span>${totColor?`<i style='display:inline-block;width:9px;height:9px;border-radius:2px;background:${totColor};margin-right:7px;vertical-align:middle'></i>`:''}${totalLabel}</span><span>${f(total)}</span></div>`;
  if(rows.length)h+=rows.map(r=>`<div class='tr'><span>${_tipMk(r)}${esc(r.name)}</span><span>${f(r.v)}</span></div>`).join('');
  return h;}
function rankColor(arr,v,inv){const a=arr.filter(x=>x!=null);if(!a.length||v==null)return '';const mn=Math.min(...a),mx=Math.max(...a);let t=mx===mn?.5:(v-mn)/(mx-mn);if(inv)t=1-t;const c=t>=.66?'16,185,129':t>=.33?'245,158,11':'244,63,94';return `background:rgba(${c},${(.05+t*.20).toFixed(3)})`;}
// per-manager agg over a deal/lead set
function byManager(D,L){const names=[...new Set([...D.map(d=>d.mgr),...L.map(l=>l.mgr)])].filter(n=>isOP(n));
  // лиды/сделки - по дате создания (intake); успех/выручка/чек/потери - по дате ИСХОДА в периоде.
  const so=soldSet(),lo=lostSet();
  return names.map(m=>{const dd=D.filter(d=>d.mgr===m),ll=L.filter(l=>l.mgr===m);
    const won=so.filter(d=>d.mgr===m),lst=lo.filter(d=>d.mgr===m);const rev=won.reduce((s,x)=>s+(x.budget||0),0);
    const cyc=median(dd.filter(d=>d.cycle!=null).map(d=>d.cycle));const tr=dd.length?dd.reduce((s,d)=>s+(d.touchReal||0),0)/dd.length:0;
    // CR2 (conv) - строго когортный: и числитель, и знаменатель по сделкам, СОЗДАННЫМ в периоде.
    // Иначе в режиме «по дате продажи» outcome-числитель / cohort-знаменатель давал >100%.
    return {mgr:m,leads:ll.length,deals:dd.length,won:won.length,conv:dd.length?dd.filter(SOLD).length/dd.length:0,rev,check:won.length?rev/won.length:0,lost:lst.length,cycle:cyc,touch:tr};});}
// Блок «Зависание лидов»: единая таблица залежавшихся заявок - заменяет прежние
// «Нераспределённые: разбор» и «Стадия Разобрать». Открытые лиды НЕ на действующем
// продавце ИЛИ в технической стадии «Разобрать» (без отказа и без сделки). Фильтры:

function stagnationBlock(){

  const sysAcc=n=>/систем|^id\s?\d|^расч[её]т/i.test(n||'');
  const estat=n=>sysAcc(n)?{k:'sys',l:'системный',c:'#8A94A6'}:FIRED.has(n)?{k:'fired',l:'уволен',c:'#F43F5E'}:isOP(n)?{k:'act',l:'действующий',c:'#2E9E74'}:{k:'noop',l:'не из ОП',c:'#C2873C'};
  const bizOf=l=>{const s=(l.source||'')+' '+(l.title||'')+' '+(l.dir||'');
    if(/metal\s*-?gm|metalgm|мгм/i.test(s)||l.dir==='metal_gm')return {k:'mgm',l:'Metal GM',c:'#F59E0B'};
    if(/glass[\s-]*memory|glassmemory/i.test(s))return {k:'gm',l:'Glass Memory',c:'#A78BFA'};

  if(!base.length)return '';

  const ageBk={w2:[0,13],m1:[14,30],m3:[31,90],old:[91,1e9]};
  const rows=base.filter(l=>(!fE||l._es.k===fE)&&(!fB||l._bz.k===fB)&&(!fS||l.status===fS)&&(!fA||(l._age>=ageBk[fA][0]&&l._age<=ageBk[fA][1])));

  rows.sort((a,b)=>{const x=gv(a),y=gv(b);return (x>y?1:x<y?-1:0)*asc;});
  const total=base.length,shown=rows.length;
  const cntBy=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1;});return m;};
  const empC=cntBy(base,l=>l._es.k),bizC=cntBy(base,l=>l._bz.k);

  const more=rows.length>300?`<div class="card-sub" style="margin-top:6px">показаны первые 300 из ${fmt(rows.length)} (по сортировке) - сузь фильтрами</div>`:'';

  const seg=(id,cur,opts)=>`<div class="seg" id="${id}">`+opts.map(([v,t])=>`<button data-v="${v}" class="${cur===v?'on':''}">${t}</button>`).join('')+`</div>`;
  const empSeg=seg('stEmpSeg',fE,[['','Все'],['act','Действующий'],['fired','Уволен ('+fmt(empC.fired||0)+')'],['sys','Системный ('+fmt(empC.sys||0)+')'],['noop','Не из ОП ('+fmt(empC.noop||0)+')']]);

  const tip=info('Единая таблица залежавшихся заявок (заменяет прежние «Нераспределённые» и «Разобрать»). Входят открытые лиды НЕ на действующем продавце ИЛИ в технической стадии «Разобрать». Отказные (Дубль/СПАМ/Отказ/Некачественный) и ушедшие в сделку сюда НЕ попадают - отказ учитывается в конверсии CR1. Источник бизнеса определяется по строке источника: Metal GM / Glass Memory (пласт наследия GM-группы после переезда в общий Битрикс) / GG-прочее. Статус сотрудника: действующий / уволен (ACTIVE=false) / системный / не из ОП. Клик по заголовку - сортировка. Блок показывает все сроки (не зависит от периода в шапке), фильтр «срок лежания» - по дням ожидания. ID открывают лид в Битрикс24.');

    +`<div class="scroll" style="margin-top:12px;max-height:580px"><table class="tbl" id="stTbl"><thead>${thead}</thead><tbody>${body}</tbody></table></div>${more}`

}

// Блок «Дисциплина ведения сделок»: чистота заполнения карточек сделок/лидов.
// От неё зависит точность ВСЕХ цифр дашбордов: направление, клиент, ассортимент, бюджет,
// источник, причина отказа (для проигранных), карточка СП (для переданных в производство).
function disciplineBlock(){
  const _p0=x=>Math.round(x*100)+'%';
  const _inP=c=>c>=S.start&&c<=S.end;
  const Ds=flt(AD,true).filter(d=>d.created&&_inP(d.created));
  const Ls=flt(AL,false).filter(l=>l.created&&_inP(l.created));
  const linkedSP=new Set(((DATA.prodItems)||[]).map(i=>i.dealId).filter(Boolean));
  const hasSP=!!(DATA.prodItems&&DATA.prodItems.length);
  const dealChecks=d=>{const ch=[
    ['направление',d.dir!=='не указано'],
    ['тип клиента',d.client!=='нет данных'],
    ['ассортимент',d.assort!=='нет данных'],
    ['бюджет',(d.budget||0)>0],
    ['источник',!!d.source&&d.source!=='не указан'&&d.source!=='-'],
  ];
    if(d.lost)ch.push(['причина отказа',!!d.reason&&d.reason!=='не указана']);
    if(hasSP&&prodDate(d))ch.push(['карточка СП',linkedSP.has(String(d.id))]);
    return ch;};
  const leadChecks=l=>[['направление',l.dir!=='не указано'],['источник',!!l.source&&l.source!=='не указан']];
  let dF=0,dT=0,lF=0,lT=0,rzF=0,rzT=0,spF=0,spT=0;
  const perM={};
  Ds.forEach(d=>{const ch=dealChecks(d);const f=ch.filter(x=>x[1]).length;dF+=f;dT+=ch.length;
    const m=perM[d.mgr]=perM[d.mgr]||{n:d.mgr,dc:0,df:0,dt:0,lc:0,lf:0,lt:0,noRz:0,noSp:0,miss:0};
    m.dc++;m.df+=f;m.dt+=ch.length;if(f<ch.length)m.miss++;
    if(d.lost){rzT++;const ok=!!d.reason&&d.reason!=='не указана';if(ok)rzF++;else m.noRz++;}
    if(hasSP&&prodDate(d)){spT++;const ok=linkedSP.has(String(d.id));if(ok)spF++;else m.noSp++;}});
  Ls.forEach(l=>{const ch=leadChecks(l);const f=ch.filter(x=>x[1]).length;lF+=f;lT+=ch.length;
    const m=perM[l.mgr]=perM[l.mgr]||{n:l.mgr,dc:0,df:0,dt:0,lc:0,lf:0,lt:0,noRz:0,noSp:0,miss:0};
    m.lc++;m.lf+=f;m.lt+=ch.length;});
  if(!Ds.length&&!Ls.length)return '';
  const zc=p=>p>=.9?'#2E9E74':p>=.7?'#C2873C':'#CC5867';
  const mini=(lbl,f,t,sub)=>{const pr=t?f/t:null;const col=pr==null?'#5a6672':zc(pr);
    return `<div style="flex:1;min-width:150px;max-width:190px;text-align:center">${donut(t?[['Заполнено',f,col],['Пусто',Math.max(t-f,0),'rgba(204,88,103,.28)']]:[['нет данных',1,'#3a4350']],pr==null?'—':_p0(pr),lbl.toUpperCase())}<div class="card-sub" style="margin-top:2px">${sub}</div></div>`;};
  // порядок слева направо = путь клиента: лиды -> сделки -> смарт-процесс (карточка СП)
  const donuts=`<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between">
    ${mini('лиды',lF,lT,`полнота полей · ${fmt(Ls.length)} лидов периода`)}
    ${mini('сделки',dF,dT,`полнота полей · ${fmt(Ds.length)} сделок периода`)}
    ${mini('причина отказа',rzF,rzT,rzT?`проставлена у ${fmt(rzF)} из ${fmt(rzT)} проигранных`:'проигранных в периоде нет')}
    ${mini('карточка СП',spF,spT,spT?`создана у ${fmt(spF)} из ${fmt(spT)} переданных`:'передач в периоде нет')}
  </div>`;
  const dsk=(S.dsSort&&S.dsSort.k)||'dp',dsa=(S.dsSort&&S.dsSort.a!=null)?S.dsSort.a:true;
  const gv=m=>dsk==='n'?m.n:dsk==='dc'?m.dc:dsk==='dp'?(m.dp==null?2:m.dp):dsk==='lc'?m.lc:dsk==='lp'?(m.lp==null?2:m.lp):dsk==='noRz'?m.noRz:m.noSp;
  const rows=Object.values(perM).map(m=>{m.dp=m.dt?m.df/m.dt:null;m.lp=m.lt?m.lf/m.lt:null;return m;})
    .filter(m=>m.dc||m.lc).sort((a,b)=>{const x=gv(a),y=gv(b);return (x>y?1:x<y?-1:0)*(dsa?1:-1);});
  const pcCell=p=>p==null?'<td style="text-align:center;color:var(--ink-4)">—</td>':`<td style="text-align:center;font-weight:800;color:${zc(p)};background:linear-gradient(90deg,${zc(p)}22 ${(p*100).toFixed(0)}%,transparent ${(p*100).toFixed(0)}%)">${_p0(p)}</td>`;
  const dsh=(k,l,al)=>`<th data-ds="${k}" style="text-align:${al||'center'};cursor:pointer;white-space:normal;line-height:1.25;padding:6px 5px;font-size:9px${dsk===k?';color:#3DAEC2':''}">${l}${dsk===k?(dsa?' ↑':' ↓'):''}</th>`;
  const mgrTbl=`<div class="scroll" style="max-height:340px;overflow-x:hidden"><table class="tbl" style="table-layout:fixed;width:100%"><colgroup><col style="width:24%"><col style="width:10%"><col style="width:14%"><col style="width:10%"><col style="width:14%"><col style="width:14%"><col style="width:14%"></colgroup><thead><tr>${dsh('n','Менеджер','left')}${dsh('lc','Лидов')}${dsh('lp','Полнота лидов')}${dsh('dc','Сделок')}${dsh('dp','Полнота сделок')}${dsh('noRz','Отказы без причины')}${dsh('noSp','Без карточки СП')}</tr></thead><tbody>`+
    rows.map(m=>`<tr style="font-size:11px"><td class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.n}</td><td style="text-align:center">${m.lc||'·'}</td>${pcCell(m.lp)}<td style="text-align:center">${m.dc||'·'}</td>${pcCell(m.dp)}<td style="text-align:center;color:${m.noRz?'#CC5867':'var(--ink-4)'};font-weight:${m.noRz?800:400}">${m.noRz||'·'}</td><td style="text-align:center;color:${m.noSp?'#CC5867':'var(--ink-4)'};font-weight:${m.noSp?800:400}">${m.noSp||'·'}</td></tr>`).join('')+`</tbody></table></div>`;
  // проблемные сделки со ссылками: что именно не заполнено
  const portal=DATA.b24Portal||'',idCell=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const probs=Ds.map(d=>{const misses=dealChecks(d).filter(x=>!x[1]).map(x=>x[0]);return misses.length?{d,misses}:null}).filter(Boolean)
    .sort((a,b)=>b.misses.length-a.misses.length);
  const open=!!S.dscOpen;
  const probTbl=open?`<div class="scroll" style="margin-top:10px;max-height:420px"><table class="tbl"><thead><tr><th style="text-align:center">ID</th><th>Менеджер</th><th>Не заполнено</th><th style="text-align:center">Создана</th><th>Стадия</th></tr></thead><tbody>`+
    probs.slice(0,150).map(x=>`<tr><td style="text-align:center">${idCell(x.d.id)}</td><td class="name">${x.d.mgr}</td><td style="color:#CC5867">${x.misses.join(', ')}</td><td style="text-align:center">${x.d.created}</td><td>${x.d.stage||'-'}</td></tr>`).join('')+`</tbody></table>${probs.length>150?`<div class="card-sub" style="margin-top:6px">показаны первые 150 из ${fmt(probs.length)}</div>`:''}</div>`:'';
  const totP=dT?dF/dT:0;
  return `<div class="card"><div class="card-h"><div><div class="card-title">Дисциплина ведения сделок ${info('Полнота заполнения карточек сделок и лидов, созданных в выбранном периоде: направление, тип клиента, ассортимент, бюджет, источник; у проигранных - причина отказа; у переданных в производство - карточка СП. От этого зависит точность ВСЕХ дашбордов: пустое направление ломает разрезы, нулевой бюджет - деньги, отсутствие причины - аналитику проигрышей, отсутствие карточки СП - загрузку цеха. Зелёное 90%+, янтарное 70-90%, красное ниже 70%.')}</div><div class="card-sub">чистота заполнения карточек - от неё зависит точность дашбордов</div></div></div>
    <div class="grid2" style="align-items:start">${donuts}${mgrTbl}</div>
    <button id="dscToggle" class="dbtn" style="margin-top:12px">${open?'Скрыть проблемные сделки':'Показать проблемные сделки ('+fmt(probs.length)+')'}</button>${probTbl}</div>`;
}

// до предложения, с дырами в причине/категории/клиенте/бюджете≤1), чтобы цифры сходились.
function deptDQBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>(!S.fDir||d.dir===S.fDir)&&notForeign(d);
  const AD=(DATA.deals||[]).filter(dirOk);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  const eCat=d=>{const a=d.assort;return !a||a==="нет данных"||a==="не указана";};
  const eCli=d=>{const c=d.client;return !c||c==="нет данных"||c==="не указан";};
  const eRsn=d=>d.lost&&(!d.reason||d.reason==="не указана");
  const PRICED=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:EXECUTING","C49:FINAL_INVOICE","C49:1","C49:2","C49:WON"]);
  const eBud=d=>PRICED.has(d.stageCode)&&(d.budget||0)<=1; // цена обязательна только с «КП отправлено» и дальше; на «Формирование ТЗ»/«Долгострой» пустая цена - норма, не дыра
  const nP=d=>(eRsn(d)?1:0)+(eCat(d)?1:0)+(eCli(d)?1:0)+(eBud(d)?1:0);
  const allRows=passed.filter(d=>!d.lost&&nP(d)>0);  // исключаем «Сделка провалена»: мёртвые сделки не чиним
  const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const _info=info('Ровно тот список, что видит каждый менеджер в своём дашборде: сделки, дошедшие до предложения, у которых в CRM не заполнено важное - причина отказа (для отказных), категория, тип клиента или бюджет 0/1 (при отправленном КП цена должна быть выше 1). Вопрос: где дыры в данных по отделу и у кого их больше. Вывод: чипы сверху - кто сколько должен поправить (клик - фильтр), таблица - конкретные сделки; клик по заголовку столбца - сортировка. Пока не закрыты, статистика конверсии и причин неполная.');
  if(!allRows.length)return `<div class="card" id="deptdqfix"><div class="card-h"><div><div class="card-title">Сделки для исправления по отделу ${_info}</div></div></div><div style="text-align:center;padding:26px 16px"><div style="font-size:40px;line-height:1">🎉</div><div style="font-family:'Manrope';font-weight:800;font-size:16px;color:#2E9E74;margin-top:8px">В CRM порядок по всему отделу</div><div style="font-size:12px;color:var(--ink-3);margin-top:5px">Причина, категория, тип клиента и бюджет проставлены у всех сделок, дошедших до предложения. Отличная дисциплина - так держать!</div></div></div>`;
  // сводка по менеджерам (совпадает с логикой челленджа в личных дашбордах)
  const perM={};allRows.forEach(d=>{const m=perM[d.mgr]=perM[d.mgr]||{n:d.mgr,cnt:0};m.cnt++;});
  const mtop=Object.values(perM).sort((a,b)=>b.cnt-a.cnt);
  const sel=S.ddqMgr||'';
  const chips=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px">`+
    `<span data-ddqmgr="" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:11px;border:1px solid ${sel?'var(--border)':'#22D3EE'};background:${sel?'transparent':'#22D3EE22'};color:${sel?'var(--ink-3)':'#22D3EE'}">Все ${fmt(allRows.length)}</span>`+
    mtop.map(m=>{const on=sel===m.n;return `<span data-ddqmgr="${esc(m.n)}" style="cursor:pointer;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:11px;white-space:nowrap;border:1px solid ${on?'#F59E0B':'var(--border)'};background:${on?'#F59E0B22':'transparent'};color:${on?'#F59E0B':'var(--ink-3)'}">${esc(m.n)} <b>${m.cnt}</b></span>`;}).join('')+`</div>`;
  const rows=sel?allRows.filter(d=>d.mgr===sel):allRows;
  const cRsn=rows.filter(eRsn).length,cCat=rows.filter(eCat).length,cCli=rows.filter(eCli).length,cBud=rows.filter(eBud).length;
  if(!S.ddqSort)S.ddqSort={k:'cnt',a:false};
  const sk=S.ddqSort.k,sa=S.ddqSort.a?1:-1;
  const sv={id:d=>+d.id||0,mgr:d=>d.mgr||'',stage:d=>d.stage||'',bud:d=>d.budget||0,cat:d=>eCat(d)?0:1,cli:d=>eCli(d)?0:1,rsn:d=>eRsn(d)?0:1,cnt:d=>nP(d)};
  const sorted=rows.slice().sort((a,b)=>{const x=sv[sk](a),y=sv[sk](b);return (x>y?1:x<y?-1:0)*sa;});
  const th=(k,lab,al)=>`<th data-ddqsort="${k}" style="cursor:pointer;text-align:${al||'center'};white-space:nowrap${S.ddqSort.k===k?';color:#22D3EE':''}">${lab}${S.ddqSort.k===k?(sa>0?' ▲':' ▼'):''}</th>`;
  const miss=(bad,val)=>`<td style="text-align:center;${bad?'color:#F8717A;font-weight:700':'color:var(--ink-3)'}">${bad?'нет':esc(val||'')}</td>`;
  const body=sorted.slice(0,400).map(d=>`<tr>`+

    `<td style="text-align:center;${eRsn(d)?'color:#F8717A;font-weight:700':'color:var(--ink-3)'}">${d.lost?(eRsn(d)?'нет':esc(d.reason)):'—'}</td>`+
    miss(eCat(d),d.assort)+miss(eCli(d),d.client)+
    `<td style="text-align:center;${eBud(d)?'color:#F8717A;font-weight:700':''}">${fmtK(d.budget||0)}</td>`+
    `<td style="text-align:center;font-weight:800;color:${nP(d)>=2?'#CC5867':'#C2873C'}">${nP(d)}</td>`+

  return `<div class="card" id="deptdqfix"><div class="card-h"><div><div class="card-title">Сделки для исправления по отделу ${_info}</div><div class="card-sub">${fmt(rows.length)}${sel?' у «'+esc(sel)+'»':''} из ${fmt(allRows.length)} сделок надо поправить · причина ${cRsn} · категория ${cCat} · клиент ${cCli} · бюджет≤1 ${cBud} · клик по заголовку - сортировка</div></div></div>${chips}<div class="scroll" style="max-height:460px;margin-top:2px"><table class="tbl"><thead><tr>${th('id','Сделка')}${th('mgr','Менеджер','left')}${th('stage','Стадия','left')}${th('rsn','Причина')}${th('cat','Категория')}${th('cli','Клиент')}${th('bud','Бюджет')}${th('cnt','Проблем')}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}

// ===== ДИСЦИПЛИНА ДЕЛ: у каждой открытой сделки должно быть запланированное дело.
// Пинарик (обновление даты активности через дела) работает только если у сделки есть открытая
// задача. Классифицируем каждую открытую сделку по сроку ближайшего ОТКРЫТОГО дела (taskDue)
// относительно «сегодня» (DATA.to):
//   нет дела  - задачи нет вообще: сделка выпала из работы, пинарик по ней не тикает;
//   просрочено - срок дела уже прошёл: менеджер не сделал запланированное;
//   припарковано - срок сдвинут дальше чем на 30 дней вперёд: дело «отложено, чтоб не мозолило»,
//                  формально активность есть, по факту сделкой не занимаются;
//   в работе  - дело на ближайшие 30 дней: здоровое состояние.
// Разрез по менеджерам, клик по строке - раскрыть проблемные сделки со ссылками в Б24.
function taskDisciplineBlock(){
  const PD2=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const now=NOWD.getTime(), PARK=30;
  const open=flt(AD,true).filter(d=>!d.won&&!d.lost&&isOP(d.mgr));
  if(!open.length) return '';
  const cls=d=>{if(!d.taskDue)return 'none';const dy=Math.round((PD2(d.taskDue).getTime()-now)/DAYMS);return dy<0?'over':dy>PARK?'park':'ok';};
  const COL={none:'#8794A5',over:'#CC5867',park:'#C2873C',ok:'#2E9E74'};
  const LBL={none:'нет дела',over:'просрочено',park:'припарковано',ok:'в работе'};
  // Группировка по менеджеру. Вид «по делам» убран - названий дел слишком много (85 групп), пользы мало.
  const view='mgr';
  const _disp={};
  const gkey=d=>{if(view==='mgr')return d.mgr;if(!d.taskDue)return 'Без дела';const raw=(d.taskSubj||'без темы').trim()||'без темы';const k=raw.toLowerCase().replace(/\s+/g,' ');if(!_disp[k])_disp[k]=raw;return k;};
  const glabel=k=>view==='mgr'?k:(k==='Без дела'?'Без дела':(_disp[k]||k));
  const perM={};let tN=0,tNone=0,tOver=0,tPark=0,tOk=0,tRisk=0,tEmp=0;
  open.forEach(d=>{const c=cls(d);const key=gkey(d);const m=perM[key]=perM[key]||{n:key,tot:0,none:0,over:0,park:0,ok:0,risk:0,ch:{call:0,msg:0,email:0},noch:0,emp:0};m.tot++;m[c]++;const _emp=d.tasksNoContact||0;m.emp+=_emp;tEmp+=_emp;if(d.lastTouchChan&&m.ch[d.lastTouchChan]!=null)m.ch[d.lastTouchChan]++;else if(!d.lastTouch)m.noch++;tN++;if(c==='none')tNone++;else if(c==='over')tOver++;else if(c==='park')tPark++;else tOk++;if(c!=='ok'){m.risk+=(d.budget||0);tRisk+=(d.budget||0);}});
  const tProb=tNone+tOver+tPark;
  // каналы коммуникации: DATA.channelMix - карта «менеджер -> {call_in,call_out,email_in,email_out,msg_in,msg_out}»
  const CH=DATA.channelMix||null;
  const CHC={call:'#3DAEC2',msg:'#2E9E74',email:'#C2873C'};
  const chSum=name=>{const m=CH&&CH[name];if(!m)return null;const call=(m.call_in||0)+(m.call_out||0),msg=(m.msg_in||0)+(m.msg_out||0),email=(m.email_in||0)+(m.email_out||0);const tot=call+msg+email;if(!tot)return null;const lead=call>=msg&&call>=email?'звонки':msg>=email?'мессенджеры':'почта';return {m,call,msg,email,tot,lead};};
  // Тултип бара в стиле дашборда (тёмный #tip через data-tip): мини-легенда разбивки
  // с цветными кружками + счётчики + подсказка. Заменяет нативный белый title браузера.
  const _tdot=c=>`<i style='display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:6px;vertical-align:-1px'></i>`;
  const _barTip=(title,rows,hint)=>(`<div class='tl'>${title}</div>`+rows.map(r=>`<div class='tr'><span>${_tdot(r[2])}${r[0]}</span><span>${r[1]}</span></div>`).join('')+(hint?`<div style='color:var(--ink-3);font-size:10px;margin-top:6px;white-space:normal;text-transform:none;letter-spacing:0'>${hint}</div>`:'')).replace(/"/g,'&quot;');
  // ячейка каналов для строки группы: в виде «по менеджерам» - channelMix (90 дн, вх/исх);
  // в виде «по делам» - распределение канала ПОСЛЕДНЕГО касания сделок группы.
  const chanBar=(call,msg,email,tip)=>{const tot=call+msg+email;if(!tot)return '<td style="min-width:84px;text-align:center;color:var(--ink-4)">·</td>';const lead=call>=msg&&call>=email?'звонки':msg>=email?'мессенджеры':'почта';const sg=(v,c)=>v?`<div style="height:100%;width:${(v/tot*100).toFixed(2)}%;background:${c}"></div>`:'';return `<td style="min-width:84px"><div title="${tip}" style="display:flex;height:15px;border-radius:5px;overflow:hidden;border:1px solid var(--border)">${sg(call,CHC.call)}${sg(msg,CHC.msg)}${sg(email,CHC.email)}</div><div style="font-size:9px;color:var(--ink-4);margin-top:2px">чаще: ${lead}</div></td>`;};
  const chanCellG=m=>{if(view==='mgr'){if(!CH)return '<td style="min-width:84px;text-align:center;color:var(--ink-4);font-size:10px">готовится</td>';const s=chSum(m.n);if(!s)return '<td style="min-width:84px;text-align:center;color:var(--ink-4)">·</td>';return chanBar(s.call,s.msg,s.email,`звонки ${s.call} (вх ${s.m.call_in||0}/исх ${s.m.call_out||0}) · мессенджеры ${s.msg} (вх ${s.m.msg_in||0}/исх ${s.m.msg_out||0}) · почта ${s.email} (вх ${s.m.email_in||0}/исх ${s.m.email_out||0})`);}return chanBar(m.ch.call,m.ch.msg,m.ch.email,`канал последнего касания · звонки ${m.ch.call} · мессенджеры ${m.ch.msg} · почта ${m.ch.email}`);};
  // столбец «Каналы» = распределение канала ПОСЛЕДНЕГО касания сделок (звонки/мессенджеры/почта/без касания),
  // каждая зона кликабельна: показывает сделки этого менеджера с этим каналом.
  const chanSegCell=(o,mgr)=>{const none=o.none||0;const tot=o.call+o.msg+o.email+none;if(!tot)return '<td style="min-width:110px;text-align:center;color:var(--ink-4)">·</td>';const sg=(v,c,ch)=>v?`<div data-tdchanseg="${esc(mgr||'')}|${ch}" style="height:100%;width:${(v/tot*100).toFixed(2)}%;background:${c};cursor:pointer"></div>`:'';const tp=_barTip('Каналы касания · '+(mgr?esc(mgr):'отдел'),[['звонки',o.call,CHC.call],['мессенджеры',o.msg,CHC.msg],['почта',o.email,CHC.email],['без касания',none,'#8794A5']],'клик по сегменту - показать эти сделки');return `<td style="min-width:110px"><div data-tip="${tp}" style="display:flex;height:17px;border-radius:5px;overflow:hidden;border:1px solid var(--border);cursor:help">${sg(o.call,CHC.call,'call')}${sg(o.msg,CHC.msg,'msg')}${sg(o.email,CHC.email,'email')}${sg(none,'#8794A5','none')}</div></td>`;};
  // легенды: дисциплина + каналы
  // Единый стиль легенды - как в остальном дашборде (.lgd/.dot): цветной кружок 9px
  // с лёгким кольцом (как health-точки в строках) + подпись 11px + счётчик tabular.

  // разворот на уровне ОТДЕЛА: клик по цифре отдела (или фильтр по каналу без выбранного менеджера) - все сделки отдела по фильтру, со столбцом «Менеджер»
  const deptExp=(deptOpen&&!S.tdMgr&&(seg2!=='all'||chanF))?`<tr><td colspan="${NCOL}" style="padding:0;background:var(--bg-base)">${dealTableHTML(filterDeals(open),true)}</td></tr>`:'';
  // Уровень 2 - менеджеры (видны, когда отдел развёрнут). Уровень 3 - сделки менеджера (клик по строке или по цифре).
  const mgrBody=rows.map(m=>{const isOpen=S.tdMgr===m.n;const pr=prob(m);const pp=m.tot?pr/m.tot:0;const pc=hcol(pp);
    const head=`<tr data-tdmgr="${esc(m.n)}" style="cursor:pointer${isOpen?';background:var(--bg-hover,rgba(34,211,238,.06))':''}"><td class="name" style="text-align:left;white-space:nowrap;padding-left:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(glabel(m.n))}">${hdot(pp)}${isOpen?'▾':'▸'} ${esc(glabel(m.n))}</td><td style="text-align:center;font-weight:700">${m.tot}</td>${numCell(m.none,COL.none,'none',m.n)}${numCell(m.over,COL.over,'over',m.n)}${numCell(m.park,COL.park,'park',m.n)}<td ${pr?`data-tdcell="${esc(m.n)}|all"`:''} style="text-align:center;font-weight:800;color:${pc};${pr?'cursor:pointer':''}">${pr} <span style="color:var(--ink-4);font-weight:400;font-size:10px">${(pp*100).toFixed(0)}%</span></td><td style="text-align:right;font-size:11px;color:${m.risk?'#F8717A':'var(--ink-4)'};font-weight:${m.risk?700:400}">${m.risk?fmtK(m.risk):'·'}</td>${emptCell(m.emp,m.n)}${structCell(m)}${chanSegCell({call:m.ch.call,msg:m.ch.msg,email:m.ch.email,none:m.noch},m.n)}</tr>`;
    if(!isOpen)return head;
    return head+`<tr><td colspan="${NCOL}" style="padding:0;background:var(--bg-base)">${dealTableHTML(filterDeals(open.filter(d=>gkey(d)===m.n)),view==='task')}</td></tr>`;}).join('');
  const body=deptRow+deptExp+(deptOpen?mgrBody:'');
  const mgrTbl=`<div class="scroll" style="max-height:560px;margin-top:4px;overflow-x:auto"><table class="tbl"><thead><tr>${th('n',view==='mgr'?'Менеджер':'Название дела','left')}${th('tot','Откр.')}${th('none','Без дела')}${th('over','Просроч.')}${th('park','Припарк.')}${th('prob','Проблем.')}${th('risk','₽ риск','right')}${th('emp','Пустые дела')}<th style="text-align:left;white-space:nowrap">Портфель (дела)</th>${th('chan','Каналы','left')}</tr></thead><tbody>${body}</tbody></table></div>`;
  const _info=info('Таблица дисциплины дел по менеджерам. Столбец «Портфель (дела)» - цветной бар состояния сделок: красное просрочено, серое нет дела, жёлтое припарковано, зелёное в работе. КЛИК ПО ЦВЕТНОМУ СЕГМЕНТУ бара = фильтр: раскрывает сделки этого менеджера по этому статусу. Так же кликаются цифры в колонках. «Пустые дела» - просроченные дела, после срока которых клиенту так и не позвонили/написали (имитация работы); клик по числу = фильтр на эти сделки. Клик по строке менеджера - все его проблемные сделки со ссылками в Б24. «Каналы» - звонки/мессенджеры/почта; «₽ риск» - сумма бюджетов проблемных сделок.<br>'+legend);
  return `<div class="card" id="taskdisc"><div class="card-h"><div><div class="card-title">Дисциплина дел и каналы коммуникации - по менеджерам ${_info}</div><div class="card-sub">${fmt(open.length)} открытых сделок · <span style="color:#F8717A;font-weight:700">${pct(tN?tProb/tN:0)} с проблемой по делам</span> · <span style="color:#CC5867;font-weight:700">${tEmp} дел без касания</span> · ${fmtK(tRisk)} ₽ под риском · <span style="color:var(--ink-4)">клик по числу «Пустые дела» или сегменту бара - фильтр</span></div></div></div>${controls}${mgrTbl}</div>`;
}

/* ============ RENDER ============ */
function trendChip(cur,prev,inv,asMoney,asPct){let html='';if(prev===0||prev==null){return `<div class="kpi-trend flat">— нет базы</div>`;}
  const dl=(cur-prev)/Math.abs(prev);const up=dl>=0;const cls=Math.abs(dl)<0.005?'flat':up?'up':'dn';const ar=Math.abs(dl)<0.005?'→':up?'▲':'▼';
  return `<div class="kpi-trend ${cls}">${ar} ${pct(Math.abs(dl))}<small>к пред. периоду</small></div>`;}
function kstrip(items,cols){return `<div class="kpi-strip" style="--cols:${cols||Math.min(items.length,7)}">`+items.map(x=>{const ac=x.ac==='accent'?'var(--accent)':x.ac;
  const money=x.money?`<div class="kpi-money">${x.money}</div>`:'';
  const qty=x.qty!=null?`<div class="kpi-qty"><b>${x.qty}</b><span>${x.qtyLabel||'шт'}</span></div>`:'';
  const foot=x.trend||(x.sub?`<div class="kpi-sub" style="font-size:10.5px;color:var(--ink-3)">${x.sub}</div>`:'');
  return `<div class="kpi-cell" style="--ac:${ac}"><div class="kpi-k">${x.k}</div>${qty}<div class="kpi-v" style="color:${x.ac==='accent'?'var(--accent)':'var(--ink)'}">${x.v}<span class="u">${x.u||''}</span></div>${money}<div class="kpi-foot" style="margin-top:auto;padding-top:8px">${foot}</div></div>`;}).join('')+'</div>';}
function divider(n,title,hint){return `<div class="sec-div" id="sec${n}"><div class="sec-num">${n}</div><h2>${title}</h2><div class="ln"></div><div class="hint">${hint||''}</div></div>`;}
// Дашборды менеджеров: карточки со ссылкой на личный дашборд + основные метрики (портфель, план/факт
// предоплат, % плана, CR, выручка) за выбранный период. Фото - из Bitrix (DATA.managerPhotos), запас - инициалы.
function managerDashboardsBlock(){
  // Ростер строится ИЗ ДАННЫХ тем же алгоритмом, что build-managers-all.mjs (слаг = транслит фамилии
  // с защитой от коллизий), поэтому карточки совпадают с реально собранными страницами /rop-<slug>/.
  // Новый менеджер в Bitrix появляется сам, ушедший отваливается. MIN_DEALS=5 отсекает «призраков».
  const _MExcl=new Set(["Виктория Преснякова","Денис Белов","Юлия Мавлина","Системный пользователь MGM"]);
  const _MnotOP=new Set(["Дмитрий Янчоглов","Алиса Алексеева"]);
  // Белый список действующих продавцов ОП (решение Ивана): в свайпе показываем ТОЛЬКО их.
  // Явный список надёжнее фильтра-исключения - дрейф данных и однофамильцы (два Валайко) не протекают.
  // Нового менеджера добавлять сюда вручную. Слаги считаются против ПОЛНОГО ростера, чтобы совпадать со /rop-<slug>/.
  const _MShow=new Set(["Ольга Лысенко","Юлия Лысанова","Ольга Маслова","Татьяна Лакомова","Юлия Шура-Бура","Алина Платонова","Екатерина Зазноба"]);
  const _Msys=n=>/систем|^id\s?\d/i.test(n||"");
  const _Mcnt={};(DATA.deals||[]).filter(d=>!_MExcl.has(d.mgr)&&d.dir!=="glass-memory").forEach(d=>{if(d.mgr)_Mcnt[d.mgr]=(_Mcnt[d.mgr]||0)+1;});
  const _Mtl={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
  const _translit=s=>s.toLowerCase().split("").map(c=>c in _Mtl?_Mtl[c]:c).join("").replace(/[^a-z0-9-]/g,"").replace(/-+/g,"-").replace(/^-|-$/g,"");
  const _Mroster=Object.keys(_Mcnt).filter(n=>_Mcnt[n]>=5&&!_MnotOP.has(n)&&!_Msys(n)).sort((a,b)=>_Mcnt[b]-_Mcnt[a]);
  const _Mused=new Map();
  const _slugFor=name=>{const p=name.trim().split(/\s+/),sur=p[p.length-1]||name,fir=p[0]||"";let base=_translit(sur)||"mgr",slug=base;if(_Mused.has(slug)&&_Mused.get(slug)!==name){slug=base+"-"+(_translit(fir)||"x");let i=2;while(_Mused.has(slug)&&_Mused.get(slug)!==name)slug=base+"-"+(i++);}_Mused.set(slug,name);return slug;};
  const DASH=_Mroster.map(name=>[name,_slugFor(name)]).filter(([name])=>_MShow.has(name));
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>(!S.fDir||d.dir===S.fDir)&&notForeign(d);
  const AD=(DATA.deals||[]).filter(dirOk);
  const PDx=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  // Окно = ВЫБРАННЫЙ диапазон дат (реагирует на фильтр периода сверху). Портфель - снимок на конец диапазона.
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const enterExec=d=>{for(const h of (d.hist||[]))if(h[0]==="C49:EXECUTING")return h[1];return null;};
  const enterLoseAny=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0]))r=h[1];return r||(d.lost?d.closed:null);};
  const enterLoseOff=d=>{const h=d.hist||[];for(let i=0;i<h.length;i++){if(/LOSE|APOLOGY/.test(h[i][0])){const prev=i>0?h[i-1][0]:null;return (prev&&OSET.has(prev))?h[i][1]:null;}}return null;};
  // Портфель «в работе» на конец диапазона: ВСЕ открытые офферы менеджера (без ограничения возраста) - как «клиентский портфель» в его дашборде.
  const wipMgr=mp=>mp.filter(d=>{const f=firstOffer(d);if(!f||f.slice(0,10)>S.end)return false;const ex=enterExec(d),lo=enterLoseAny(d);return !((ex&&ex.slice(0,10)<=S.end)||(lo&&lo.slice(0,10)<=S.end));}).length;
  const days=Math.max(1,Math.round((PDx(S.end)-PDx(S.start))/DAYMS)+1),factor=days/30,moN=Math.max(days,7)/30;
  // Конверсия-цель = CR2 месяца конца диапазона из плана (как в дашборде менеджера), запас 15%.
  const _pmC=((DATA.plan&&DATA.plan.months)||[]).find(x=>x.month===String(S.end).slice(0,7));
  const TCR=(_pmC&&_pmC.cr2>0)?_pmC.cr2:0.15;
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  const photos=DATA.managerPhotos||{};
  const pctC=v=>v==null?'var(--ink-4)':v>=0.9?'#2E9E74':v>=0.6?'#C2873C':'#CC5867';
  const crC=v=>v==null?'var(--ink-4)':v>=TCR?'#2E9E74':v>=0.10?'#C2873C':'#CC5867';
  const initials=n=>n.trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h;};
  const avatar=n=>{const hu=hue(n),bg=`linear-gradient(135deg,hsl(${hu},55%,42%),hsl(${(hu+40)%360},55%,30%))`;
    const ini=`<span style="font-family:'Manrope';font-weight:800;font-size:16px;color:#fff">${esc(initials(n))}</span>`;
    const img=photos[n]?`<img src="${photos[n]}" alt="" onerror="this.style.display='none'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'';
    return `<div style="position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:${bg};overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35)">${ini}${img}</div>`;};
  const stat=(l,v,c)=>`<div style="display:flex;flex-direction:column;gap:1px"><span style="font-size:9.5px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.03em">${l}</span><b style="font-size:13px;color:${c||'var(--ink)'};font-variant-numeric:tabular-nums">${v}</b></div>`;
  // Данные по всем менеджерам за диапазон.
  const rows=DASH.map(([name,slug])=>{
    const mine=passed.filter(d=>d.mgr===name);
    const port=wipMgr(mine);
    const suc=mine.filter(d=>inR(enterExec(d)));
    const fact=suc.length, otk=mine.filter(d=>inR(enterLoseOff(d))).length;
    const cr=port?fact/port:null; // конверсия ПОРТФЕЛЬ→ПРЕДОПЛАТА за период = предоплаты ÷ портфель
    // Цель: портфель × CR2 × дней/30 из плана; на дневном виде пол = минимум 1 продажа (как в дашборде менеджера).
    const _cap=Math.round(port*TCR*factor), target=days<=1?Math.max(1,_cap):_cap, pctPlan=target?fact/target:null;
    const rev=suc.reduce((s,d)=>s+(d.budget||0),0);
    return {name,slug,port,fact,otk,cr,target,pctPlan,rev};
  });
  // Кубки: место В ОТДЕЛЕ - среди ВСЕХ менеджеров ОП с оффер-активностью, по выбранной метрике (за период).
  // Успех = вход в «Предоплата получена» (предоплата). Конверсия = предоплаты ÷ (предоплаты + отказы).
  const MK=S.mdMet||'conv';
  const mval=r=>MK==='rev'?r.rev:MK==='won'?r.fact:(r.cr==null?-1:r.cr);
  const mlab={conv:'Конверсия',rev:'Выручка',won:'Предоплаты'}[MK];
  const mfmt=r=>MK==='rev'?fmtK(r.rev)+' ₽':MK==='won'?fmt(r.fact):(r.cr==null?'—':pct(r.cr));
  const barCol=r=>MK==='conv'?crC(r.cr):MK==='rev'?'#A78BFA':'#2E9E74';
  const _byDept={};
  passed.filter(d=>isOP(d.mgr)).forEach(d=>{const m=d.mgr,o=_byDept[m]||(_byDept[m]={fact:0,otk:0,rev:0,mine:[]});o.mine.push(d);const e=enterExec(d);if(e&&inR(e)){o.fact++;o.rev+=d.budget||0;}const l=enterLoseOff(d);if(l&&inR(l))o.otk++;});
  const deptRows=Object.entries(_byDept).map(([m,o])=>{const wip=wipMgr(o.mine);return {name:m,fact:o.fact,otk:o.otk,rev:o.rev,wip,cr:wip?o.fact/wip:null};});
  const NDEPT=Math.max(deptRows.length,1);
  const ranked=[...deptRows].sort((a,b)=>mval(b)-mval(a));
  const rankOf={};ranked.forEach((r,i)=>rankOf[r.name]=i+1);
  const maxV=Math.max(1e-9,...deptRows.map(r=>Math.max(0,mval(r))));
  const cup=rk=>['🥇','🥈','🥉'][rk-1]||('<span style="font-size:12px;font-weight:800;color:var(--ink-3)">#'+rk+'</span>');
  const seg=`<div class="seg" id="mdMetSeg"><button data-mdmet="conv" class="${MK==='conv'?'on':''}">Конверсия</button><button data-mdmet="rev" class="${MK==='rev'?'on':''}">Выручка</button><button data-mdmet="won" class="${MK==='won'?'on':''}">Предоплаты</button></div>`;
  const cards=rows.map(r=>{const{name,slug,port,fact,otk,cr,target,pctPlan,rev}=r;
    const rk=rankOf[name]||NDEPT,bc=barCol(r),w=(mval(r)>0?Math.max(4,Math.min(100,mval(r)/maxV*100)):0).toFixed(1);
    return `<a href="../rop-${slug}/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;flex:0 0 clamp(240px,78%,270px);scroll-snap-align:start;background:var(--bg-elevated);border:1px solid var(--border);border-radius:13px;padding:13px 14px;transition:border-color .15s,transform .15s" onmouseover="this.style.borderColor='var(--accent)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform='none'">`+
      `<div style="display:flex;align-items:center;gap:11px;margin-bottom:11px">${avatar(name)}<div style="min-width:0;flex:1"><div style="font-family:'Manrope';font-weight:800;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div><div style="font-size:10.5px;color:var(--accent);font-weight:700">Открыть дашборд →</div></div><span style="font-size:19px;line-height:1" title="${rk} место из ${NDEPT} в отделе по: ${mlab}">${cup(rk)}</span></div>`+
      `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px 6px;padding-top:10px;border-top:1px solid var(--border-soft)">`+
        stat('Портфель',fmt(port))+
        stat('План / факт',`${fmt(target)} / ${fmt(fact)}`,fact?'#2E9E74':'var(--ink-3)')+
        stat('% плана',pctPlan==null?'—':pct(pctPlan),pctC(pctPlan))+
        stat('CR',cr==null?'—':pct(cr),crC(cr))+
        stat('Отказы',fmt(otk),otk>fact*4?'#F8717A':'var(--ink-2)')+

      `</div>`+
      `<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--border-soft)"><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.03em"><span>${mlab} · ${rk} из ${NDEPT} в отделе</span><b style="color:${bc};font-size:11.5px;font-variant-numeric:tabular-nums">${mfmt(r)}</b></div><div style="height:6px;background:var(--bg-base);border-radius:3px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${w}%;background:${bc};border-radius:3px"></div></div></div>`+

    const dws=[];DD.forEach(d=>{const h=d.hist||[];for(let k=0;k<h.length;k++){if(h[k][0]===code){const nxt=h[k+1]?h[k+1][1]:((d.won||d.lost)?d.closed:DATA.to);const dd=ddiffJS(h[k][1],nxt);if(dd!=null&&dd>=0)dws.push(dd);}}});

  const subTxt=(mode==='created'?'когорта по дате создания в периоде':'активные на стадиях в периоде + новые')+' · '+(prepay?'продажи = от предоплаты':'успех = WON')+' · конверсия/сумма/медианный срок на этапе · режим задаётся тумблером «Период по» сверху';
  return `<div class="card"><div class="card-h"><div><div class="card-title">Воронка прохождения сделок (труба) ${info('Пилюля срока под этапом: зелёная - меньше 10 дней, оранжевая - 10-21, красная - дольше 21 дня. Накопительная воронка по дате создания: из сделок, созданных за период, сколько дошло (коснулось) каждого этапа. Пример: создано 276, до «Успешно» дошли 12 - это НЕ значит, что остальные в отказе: многие ещё в работе на промежуточных стадиях (длинный цикл). Вопрос: где сделки массово застревают или отваливаются между этапами. Вывод: этап с резким падением конверсии = узкое горло, туда внимание.')}</div><div class="card-sub">${subTxt}</div></div></div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:1000px">${defs?`<defs>${defs}</defs>`:''}${conns}${nodes}${labels}</svg></div>
    </div>`;
}

function dwellStageChart(deals){

  if(!op.length)return '';
  const med=xs=>{if(!xs.length)return null;const a=xs.map(x=>x.dwellCur).sort((p,q)=>p-q);return a[Math.floor(a.length/2)];};
  const metric=S.dhMetric||'term';const isSeg=(metric!=='term');

    const money=xs.reduce((s,x)=>s+(x.budget||0),0),nAll=xs.length,stuck=xs.filter(x=>x.dwellCur>=30);

  const mx=Math.max(...data.map(d=>d.total),1);

    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(baseY+21).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-2)" pointer-events="none">${d.lab}</text>`;

}
function mgrDwellHeat(deals){
  const stages=['Из Взят в работу/Квалифицирован','Расчёт','КП отправлено','Принимают решение','Долгострой'];
  const lab={'Из Взят в работу/Квалифицирован':'Квал','Расчёт':'Расчёт','КП отправлено':'КП','Принимают решение':'Решение','Долгострой':'Долгострой'};
  const op=deals.filter(d=>!d.won&&!d.lost&&d.dwellCur!=null&&isOP(d.mgr)&&stages.includes(d.stage));
  if(!op.length)return '<div class="card-sub">нет открытых сделок на этих этапах</div>';
  const mgrs=[...new Set(op.map(d=>d.mgr))];
  const cell={};mgrs.forEach(m=>{cell[m]={};stages.forEach(st=>cell[m][st]=op.filter(d=>d.mgr===m&&d.stage===st));});
  const med=xs=>{if(!xs.length)return null;const a=xs.map(x=>x.dwellCur).sort((p,q)=>p-q);return a[Math.floor(a.length/2)];};
  const tot=m=>stages.reduce((s,st)=>s+cell[m][st].length,0);
  const ntTot=m=>stages.reduce((s,st)=>s+cell[m][st].filter(x=>(x.touchReal||0)===0).length,0);
  // сортировка по клику на заголовок (по столбцу): по медиане этапа / по «Висит» / «Без кас.» / имени
  const _ds=S.dhSort||'tot',_asc=S.dhAsc?1:-1;
  const _key=m=>{if(_ds==='mgr')return m;if(_ds==='tot')return tot(m);if(_ds==='nt')return ntTot(m);const v=med(cell[m][_ds]);return v==null?-1:v;};
  mgrs.sort((a,b)=>{const va=_key(a),vb=_key(b);return _ds==='mgr'?String(va).localeCompare(String(vb))*_asc:(va-vb)*_asc;});

function healthBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>(!S.fDir||d.dir===S.fDir)&&notForeign(d);

  if(!passed.length)return "";
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const enterExec=d=>{for(const h of (d.hist||[]))if(h[0]==="C49:EXECUTING")return h[1];return null;};
  const enterLose=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0]))r=h[1];return r||(d.lost?d.closed:null);};
  // отказ, засчитываемый в конверсию: сделка ушла в отказ НЕПОСРЕДСТВЕННО с одного из 3 оффер-этапов
  // (КП/Решение/Долгострой), а не отвалилась раньше по воронке. Смотрим стадию перед событием отказа.
  const enterLoseOff=d=>{const h=d.hist||[];for(let i=0;i<h.length;i++){if(/LOSE|APOLOGY/.test(h[i][0])){const prev=i>0?h[i-1][0]:null;return (prev&&OSET.has(prev))?h[i][1]:null;}}return null;};
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  const openEnd=d=>{const f=firstOffer(d);if(!f||f.slice(0,10)>S.end)return false;const ex=enterExec(d),lo=enterLose(d);return !((ex&&ex.slice(0,10)<=S.end)||(lo&&lo.slice(0,10)<=S.end));};
  const vhod=passed.filter(d=>inR(firstOffer(d))).length;
  const suc=passed.filter(d=>inR(enterExec(d))).length;
  const otk=passed.filter(d=>inR(enterLoseOff(d))).length;
  const vyhod=suc+otk,bal=vhod-vyhod;
  const wip=passed.filter(openEnd).length;
  // Конверсия = успех(за период) ÷ портфель «в работе» на конец, В ПЕРЕСЧЁТЕ НА МЕСЯЦ (÷ число
  // месяцев в окне, пол 7 дн). Так цель ЕДИНАЯ 15% на день/неделю/месяц. Отдел = успех отдела ÷
  // портфель отдела; у менеджера - его успех ÷ его портфель (единая формула).
  const _days=Math.max(1,Math.round((new Date(S.end)-new Date(S.start))/864e5)+1);
  const _moN=Math.max(_days,7)/30;
  const crDept=wip?(suc/wip)/_moN:0;
  const lossShare=vyhod?otk/vyhod:0;
  const tol=Math.max(3,0.15*Math.max(vhod,vyhod,1));
  // линза периода: 30 дн - рабочая (≈2× медианы цикла ~13 дн), 60 - контрольная, <14 искажает баланс
  const pDays=Math.max(1,Math.round((new Date(S.end)-new Date(S.start))/864e5)+1);
  let lensC,lensT;
  if(pDays<14){lensC='#F43F5E';lensT='окно '+pDays+' дн короче цикла сделки (медиана ~13 дн) - вход считается, а выход не успевает закрыться. Баланс искажён, «копится» может быть артефактом. Включи рабочую линзу 30 дн.';}
  else if(pDays<=40){lensC='#2E9E74';lensT='рабочая линза '+pDays+' дн (≈2× медианы цикла) - к концу окна закрылось большинство вошедших сделок, баланс репрезентативен.';}
  else if(pDays<=75){lensC='#22D3EE';lensT='контрольная линза '+pDays+' дн - полная картина закрытий, ловит хвост p90 (~51 дн). Свежие всплески сглаживаются - для оперативного сигнала вернись на 30 дн.';}
  else{lensC='#F59E0B';lensT='окно '+pDays+' дн шире контрольного - недельные всплески/провалы размываются. Для оперативного сигнала вернись на рабочие 30 дн.';}
  const lensBadge=`<span style="display:inline-block;font-size:10px;font-weight:700;color:${lensC};background:${lensC}18;border:1px solid ${lensC}55;border-radius:6px;padding:1px 8px;vertical-align:middle" data-tip="${lensT.replace(/"/g,'&quot;')}">линза ${pDays} дн</span>`;
  let fc,ft,fr;
  if(Math.abs(bal)<=tol){fc='#2E9E74';ft='Здоровый режим';fr='Вход ≈ выход: сделки обрабатываются, накопления нет. Нормальный темп отдела.';}
  else if(bal>0){fc='#F59E0B';ft='Копится в работе';fr='Входящих ('+fmt(vhod)+') больше, чем закрыто ('+fmt(vyhod)+') - портфель растёт на '+fmt(bal)+'. Поток новых клиентов больше, чем делается продаж: менеджеры распыляются, отказы неизбежно растут. Поднимать эффективность отдела (скорость обработки и конверсию).';}
  else{fc='#F43F5E';ft='Выход обгоняет вход';fr='Закрыто ('+fmt(vyhod)+') больше, чем пришло ('+fmt(vhod)+') - портфель тает на '+fmt(-bal)+'. Сигнал маркетингу: увеличить поток новых клиентов, иначе воронка иссякнет.';}
  // План выхода: 1 успех на 3 отказа = 25% успех / 75% отказ. Опорная линия слоя «Выход».

  const qr='План выхода - 1 успех на 3 отказа (25% успех / 75% отказ). Сейчас '+pct(sucShare)+' успех · '+pct(1-sucShare)+' отказ.'+(qWarn?' Недобор успеха '+fmt(Math.max(0,sucNeed-suc))+' сделок до плана. Разбирать возражения, скорость ответа, квалификацию лида на входе.':' Норму держим.');
  const maxFlow=Math.max(vhod,vyhod,1);
  const banner=(c,t,r)=>`<div style="border-left:3px solid ${c};background:${c}14;border-radius:8px;padding:8px 11px;margin-top:8px"><div style="font-weight:800;font-size:12.5px;color:${c}">${t}</div><div style="font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.4">${r}</div></div>`;
  // вертикальный сосуд-воронка: входящий поток льётся сверху в пузатое «В работе» (сток,

  // ∝ объёму потока (вход шире выхода = копится, уже = тает), пузо фиксировано - это сток.
  // вертикальная «труба» в стиле воронки прохождения сделок: сегменты-прямоугольники со скруглением,
  // соединённые сужающимися перемычками с градиентом. Вход -> В работе (пузо, сток) -> Выход (сплит
  // успех/отказ по плану 25/75). Ширина ∝ объёму: вход шире выхода = копится, уже = тает.
  const cx=150,SW=300,maxW=200,maxC=Math.max(vhod,wip,vyhod,1);
  const wv=c=>Math.max(30,Math.round(c/maxC*maxW)),w1=wv(vhod),w2=wv(wip),w3=wv(vyhod);

  const right=`<div><div class="card-t" style="font-size:12.5px">Конверсия в успех по менеджерам ${info('Успех ÷ портфель «в работе» на конец, В ПЕРЕСЧЁТЕ НА МЕСЯЦ: какая доля портфеля становится успехом за месяц. Отдел = успех отдела ÷ портфель отдела; менеджер = его успех ÷ его портфель. Цель ЕДИНАЯ 15%/мес на день/неделю/месяц (метрика приведена к месяцу, поэтому не искажается длиной окна). Отдел = средневзвешенное по менеджерам (одни выше, другие ниже - это норма, не ошибка). Пунктир - отдел. Кто левее/ниже (красный) - тянет вниз. Клик по менеджеру выделяет его линию в динамике.')}</div><div class="card-sub" style="margin-bottom:6px">успех ÷ портфель «в работе» /мес · отдел <b style="color:#A78BFA">${pct(crDept)}</b> (${fmt(suc)}/${fmt(wip)} за ${_days} дн) · <span style="color:#A78BFA">┊</span> = отдел · клик - линия в динамике</div><div style="display:flex;gap:13px;flex-wrap:wrap;align-items:center;margin:0 0 7px;font-size:10.5px;color:var(--ink-3)"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:18px;height:9px;border-radius:3px;background:#2E9E74;opacity:.9"></span>выше среднего</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:18px;height:9px;border-radius:3px;background:#F43F5E;opacity:.9"></span>ниже среднего</span><span style="display:inline-flex;align-items:center;gap:5px"><svg width="8" height="13" style="overflow:visible"><line x1="4" y1="0" x2="4" y2="13" stroke="#A78BFA" stroke-width="2" stroke-dasharray="3 2"/></svg>отдел ${pct(crDept)}</span><span style="color:var(--ink-4)">наведи - успех / портфель / %</span></div>${crBars||'<div class="card-sub">нет данных</div>'}${dynChart}</div>`;
  return `<div class="card"><div class="card-h"><div><div class="card-title">Здоровье отдела продаж ${info('Баланс входа (новые офферы) и выхода (успех + отказ) за период - показатель здоровья отдела. Выход = предоплата (успех) плюс отказ, ушедший НЕПОСРЕДСТВЕННО с 3 оффер-этапов (КП/Решение/Долгострой); отвалившиеся раньше по воронке в отказ тут не считаются. Вход>выход - копится, менеджеры распыляются, растут отказы (поднимать эффективность). Вход<выход - воронка тает (маркетингу больше лидов). Вход≈выход - здоровый режим. План выхода - 1 успех на 3 отказа (25% успех / 75% отказ); падение доли успеха ниже 25% - сигнал по качеству. Линза периода: рабочая 30 дн (≈2× медианы цикла ~13 дн), контрольная 60 дн (ловит хвост p90 ~51 дн); окно короче 14 дн искажает баланс - выход не успевает закрыться. Справа - конверсия в успех по менеджерам против отдела: кто ниже пунктира, тянет вниз.')}</div><div class="card-sub">баланс потока · выход 25/75 · конверсия по менеджерам - сигналы РОПу &nbsp;${lensBadge}</div></div></div><div class="grid2" style="align-items:start;gap:18px">${left}${right}</div></div>`;
}

function offerReasonsBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>(!S.fDir||d.dir===S.fDir)&&notForeign(d);
  const AD=(DATA.deals||[]).filter(dirOk);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  const lost=passed.filter(d=>d.lost);
  if(!lost.length)return "";
  const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const cat=d=>{const a=d.assort;return (!a||a==="нет данных"||a==="не указана")?"не указана":a;};
  const cli=d=>{const c=d.client;return (!c||c==="нет данных")?"не указан":c;};
  const loseDate=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0])&&h[1])r=h[1];return r||d.closed||"";};
  const amoBadge=d=>d.created===MIGDATE?` <span data-tip="Перенос из AmoCRM 05.03.2026" style="font-size:8.5px;font-weight:700;color:#F59E0B;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);border-radius:4px;padding:0 4px;white-space:nowrap">Amo</span>`:"";
  const rmap={};lost.forEach(d=>{const r=(!d.reason||d.reason==="не указана")?"не проставлена причина":d.reason;rmap[r]=(rmap[r]||0)+1;});
  const rrows=Object.entries(rmap).sort((a,b)=>b[1]-a[1]);
  const noReason=rmap["не проставлена причина"]||0,rOpen=!!S.ocReasons;
  // Переключатель ТОП 10/20/30/Все - чтобы не разворачивать полотнище из сотен свободных причин.
  const rN=S.ocReasonsN||10,rShown=rN>=9999?rrows.length:Math.min(rN,rrows.length);
  const rNbtns=`<div style="display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap">${[10,20,30,9999].map(n=>`<button data-ocrn="${n}" class="dbtn" style="padding:2px 11px;font-size:11px${(rN===n)?';background:var(--accent-soft);color:var(--accent);border-color:rgba(46,158,116,.4)':''}">${n>=9999?'Все ('+fmt(rrows.length)+')':'ТОП '+n}</button>`).join('')}</div>`;
  const rbars=rrows.slice(0,rShown).map(([r,n])=>{const bad=r==="не проставлена причина";return `<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><div style="width:200px;font-size:11px;color:${bad?'#F8717A':'var(--ink-3)'};text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r)}</div><div style="flex:1;height:14px;background:var(--bg-base);border-radius:7px;overflow:hidden"><div style="height:100%;width:${(n/lost.length*100).toFixed(1)}%;background:${bad?'#CC5867':'#6A7484'}"></div></div><div style="width:36px;font-size:11px;font-weight:800;color:var(--ink-2)">${n}</div></div>`;}).join("");
  const lostList=rOpen?`<div class="scroll" style="margin-top:8px;max-height:340px"><table class="tbl"><thead><tr><th>Сделка</th><th>Дата отказа</th><th style="text-align:left">Причина отказа</th><th style="text-align:left">Менеджер</th><th>Бюджет</th><th style="text-align:left">Категория / клиент</th></tr></thead><tbody>${lost.slice().sort((a,b)=>(loseDate(b)||'').localeCompare(loseDate(a)||'')).slice(0,200).map(d=>`<tr><td style="text-align:center">${dl(d.id)}${amoBadge(d)}</td><td style="text-align:center;color:var(--ink-3);white-space:nowrap">${loseDate(d)||'—'}</td><td style="text-align:left;${(!d.reason||d.reason==='не указана')?'color:#F8717A':''}">${esc((!d.reason||d.reason==='не указана')?'не проставлена':d.reason)}</td><td class="name" style="text-align:left">${esc(d.mgr)}</td><td style="text-align:center">${fmtK(d.budget||0)}</td><td style="text-align:left;font-size:11px;color:var(--ink-3)">${esc(cat(d))} · ${esc(cli(d))}</td></tr>`).join("")}</tbody></table></div>`:"";
  return `<div class="card"><div class="card-h"><div><div class="card-title">Причины отказов со стадии предложения ${info('Сделки, которые получили оффер, но ушли в отказ. Красным - «не проставлена причина». Вопрос: почему сливаются горячие и фиксируется ли причина. Вывод: большой красный столбик - дыра в дисциплине (чинить регламент); реальные причины (дорого/конкурент) - сигнал к цене и скорости.')}</div><div class="card-sub">${fmt(lost.length)} отказных из прошедших предложение · <span style="color:#F8717A;font-weight:700">${pct(lost.length?noReason/lost.length:0)} без причины</span> · показано ${fmt(rShown)} из ${fmt(rrows.length)} причин</div></div></div>${rNbtns}${rbars}<button id="ocReasonsToggle" class="dbtn" style="margin-top:10px">${rOpen?'Скрыть сделки':'Показать отказные сделки ('+fmt(lost.length)+')'}</button>${lostList}</div>`;
}

// ===== СТАНДАРТ ОТДЕЛА: план в предоплатах, декомпозиция по менеджерам =====
// План в КОЛИЧЕСТВЕ предоплат (не в выручке). Цель менеджеру = живой портфель × целевой
// CR. Гардрейлы: чек (чтобы count не убил выручку) и долгострой (в паре с отказами).
function standardBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>(!S.fDir||d.dir===S.fDir)&&notForeign(d);
  const AD=(DATA.deals||[]).filter(dirOk);
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  if(!passed.length)return "";
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const enterExec=d=>{for(const h of (d.hist||[]))if(h[0]==="C49:EXECUTING")return h[1];return null;};
  const enterLose=d=>{let r=null;for(const h of (d.hist||[]))if(/LOSE|APOLOGY/.test(h[0]))r=h[1];return r||(d.lost?d.closed:null);};
  const inR=ds=>ds&&ds.slice(0,10)>=S.start&&ds.slice(0,10)<=S.end;
  const PD=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const age=d=>Math.max(0,Math.round((NOWD-PD(d.created))/DAYMS));
  const days=Math.max(1,Math.round((PD(S.end)-PD(S.start))/DAYMS)+1),factor=days/30;
  // план из плановой таблицы (planModel читает Google-план; m-заглушка, targets из листа)
  const P=planModel(DATA.deals||[],DATA.leads||[],{check:0,conv:0,rev:0,deals:0,leads:0,qrate:0});
  const checkP=Math.round(P.check||120000);          // плановый чек (гардрейл)
  const winTdept=Math.max(0,Math.round(P.winT||0));  // нужно предоплат за период для плана
  const revPlan=Math.round(P.targets.rev||0);
  const TCR=(P.conv&&P.conv>0)?P.conv:0.15; // конверсия-цель ИЗ ПЛАНА (CR2 листа); запас 15% если плана нет

  const names=[...new Set([...open.map(d=>d.mgr),...passed.map(d=>d.mgr)])];
  const rows=names.map(m=>{
    const op=open.filter(d=>d.mgr===m),ps=passed.filter(d=>d.mgr===m);
    const live=op.filter(d=>age(d)<=60),zomb=op.filter(d=>age(d)>60);
    const suc=ps.filter(d=>inR(enterExec(d))),lo=ps.filter(d=>inR(enterLose(d)));
    const cr=(suc.length+lo.length)?suc.length/(suc.length+lo.length):null;
    const chk=median(suc.map(d=>d.budget||0).filter(v=>v>0))||0;
    const target=Math.round(live.length*TCR*factor);
    const pctPlan=target?suc.length/target:null;
    return {m,live:live.length,zomb:zomb.length,zombM:zomb.reduce((s,d)=>s+(d.budget||0),0),target,fact:suc.length,factM:suc.reduce((s,d)=>s+(d.budget||0),0),lose:lo.length,cr,chk,pctPlan};
  }).filter(r=>r.live+r.zomb+r.fact+r.lose>0);
  const medLive=median(rows.map(r=>r.live))||0;
  const stat=r=>{
    const okChek=!r.chk||r.chk>=checkP*0.85, okCR=r.cr==null||r.cr>=TCR, okPlan=r.pctPlan!=null&&r.pctPlan>=0.9;
    if(okPlan&&okCR&&okChek)return {l:"в норме",c:"#2E9E74"};
    if(r.live>medLive&&(r.pctPlan==null||r.pctPlan<0.6))return {l:"резать портфель",c:"#F43F5E"};
    if((r.cr!=null&&r.cr<0.10)||(r.pctPlan!=null&&r.pctPlan<0.4))return {l:"ставить ребром",c:"#F43F5E"};
    return {l:"обучать",c:"#C2873C"};
  };
  rows.forEach(r=>r.st=stat(r));
  rows.sort((a,b)=>(b.pctPlan||0)-(a.pctPlan||0)||b.fact-a.fact);

  // отдел
  const D_={live:rows.reduce((s,r)=>s+r.live,0),zomb:rows.reduce((s,r)=>s+r.zomb,0),target:rows.reduce((s,r)=>s+r.target,0),fact:rows.reduce((s,r)=>s+r.fact,0),factM:rows.reduce((s,r)=>s+r.factM,0),lose:rows.reduce((s,r)=>s+r.lose,0)};
  D_.cr=(D_.fact+D_.lose)?D_.fact/(D_.fact+D_.lose):0;
  const allSuc=passed.filter(d=>inR(enterExec(d)));
  D_.chk=median(allSuc.map(d=>d.budget||0).filter(v=>v>0))||(D_.fact?Math.round(D_.factM/D_.fact):0);
  // А / Б / В
  const revA=D_.factM, prepayA=D_.fact;
  const prepayB=Math.round(D_.live*TCR*factor), revB=prepayB*checkP; // потенциал живого портфеля при 15%
  const enough=prepayB>=winTdept;
  const gap=Math.max(0,winTdept-prepayB);
  const nDone=`${fmt(prepayA)}`;
  const pill=(t,c)=>`<span style="display:inline-block;font-size:10px;font-weight:700;color:${c};background:${c}18;border:1px solid ${c}55;border-radius:6px;padding:2px 8px">${t}</span>`;
