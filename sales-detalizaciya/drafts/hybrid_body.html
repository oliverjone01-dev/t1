<style>

/* ==========================================================================
   Детализация 2.0 · три направления + дизайн-система. Токены Контур DS.
   Движение: только transform, opacity, clip-path, stroke-dashoffset, grid-template-rows.
   Кривые: вход .2,.8,.2,1 · выход .4,0,1,1 · стандарт .4,0,.2,1. Без пружин.
   ========================================================================== */
:root{ --e-in:cubic-bezier(.2,.8,.2,1); --e-out:cubic-bezier(.4,0,1,1); --e-std:cubic-bezier(.4,0,.2,1);
  --lift:0 1px 1px rgba(16,19,24,.04), 0 2px 4px rgba(16,19,24,.04), 0 8px 24px -6px rgba(16,19,24,.10);
  --lift-hi:0 1px 1px rgba(16,19,24,.05), 0 4px 8px rgba(16,19,24,.06), 0 18px 40px -10px rgba(16,19,24,.18); }
[data-theme="dark"]{ --lift:inset 0 1px 0 rgba(255,255,255,.045), 0 0 0 1px rgba(255,255,255,.02); --lift-hi:inset 0 1px 0 rgba(255,255,255,.07), 0 16px 40px -12px rgba(0,0,0,.6); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --lift:inset 0 1px 0 rgba(255,255,255,.045), 0 0 0 1px rgba(255,255,255,.02); --lift-hi:inset 0 1px 0 rgba(255,255,255,.07), 0 16px 40px -12px rgba(0,0,0,.6); } }
html{ overflow-x:clip; }
body{ background:var(--bg); color:var(--text); margin:0; }
.gx{ max-width:1240px; margin:0 auto; padding:0 20px 96px; }
.num{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--text-muted); }
.cap{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
.hair{ height:1px; background:var(--border); border:0; margin:0; }

/* шапка витрины */
.gx-top{ position:sticky; top:0; z-index:40; margin:0 -20px; padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  background:var(--glass-bg); -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%); box-shadow:0 1px 0 var(--border); view-transition-name:gxtop; }
.gx-top b{ font-size:14px; font-weight:600; color:var(--text-strong); letter-spacing:-.01em; }
.gx-top .sp{ flex:1; }
.kbd{ display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:4px; font-size:11px; font-weight:600; color:var(--text-muted);
  background:var(--surface); box-shadow:inset 0 -1px 0 var(--border-strong), 0 0 0 1px var(--border); font-family:var(--font-sans); }

/* переключатель с переезжающей плашкой */
.seg{ position:relative; display:inline-flex; padding:3px; border-radius:10px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--border); isolation:isolate; }
.seg button{ position:relative; z-index:1; border:0; background:none; font:inherit; font-size:13px; font-weight:500; color:var(--text-muted); padding:6px 12px; min-height:32px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:color 160ms var(--e-std); }
.seg button[aria-pressed="true"]{ color:var(--text-strong); }
.seg button:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
.seg .pill{ position:absolute; inset:3px; z-index:0; border-radius:7px; background:var(--surface); box-shadow:var(--lift); transition:clip-path 250ms var(--e-std); }

/* кнопки */
.b{ --h:36px; display:inline-flex; align-items:center; gap:8px; height:var(--h); padding:0 14px; border-radius:8px; border:0; font:inherit; font-size:13px; font-weight:500; cursor:pointer;
  transition:transform 160ms var(--e-std), background 160ms var(--e-std), box-shadow 160ms var(--e-std); white-space:nowrap; }
.b:active{ transform:translateY(1px) scale(.985); }
.b:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.b.pri{ background:var(--action); color:var(--action-foreground); box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.2); }
.b.pri:hover{ background:var(--action-hover); }
.b.sec{ background:var(--surface); color:var(--text-strong); box-shadow:inset 0 0 0 1px var(--border-strong), 0 1px 1px rgba(0,0,0,.04); }
.b.sec:hover{ background:var(--surface-2); }
.b.gh{ background:transparent; color:var(--text); } .b.gh:hover{ background:var(--surface-2); }
.b.dan{ background:var(--crit); color:#fff; }
.b.sm{ --h:30px; padding:0 10px; font-size:12.5px; }
.b.ic{ width:var(--h); padding:0; justify-content:center; }
.b[disabled]{ opacity:.5; cursor:not-allowed; }
.b .spin{ width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* поверхность и отлив под курсором (6-7% акцента, только мышь) */
.card{ position:relative; background:var(--surface); border-radius:14px; box-shadow:var(--lift); padding:20px; isolation:isolate; }
.spot{ overflow:hidden; }
.spot::before{ content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity 250ms var(--e-std);
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), color-mix(in oklab, var(--primary) 7%, transparent), transparent 70%); }
@media (hover:hover){ .spot:hover::before{ opacity:1; } .lift{ transition:transform 250ms var(--e-in), box-shadow 250ms var(--e-in); } .lift:hover{ transform:translateY(-2px); box-shadow:var(--lift-hi); } }
.click{ cursor:pointer; }

/* вход блоков: из видимого состояния, шаг 35 мс, максимум 175 мс */
.rise{ animation:rise 420ms var(--e-in) both; animation-delay:calc(min(var(--i,0) * 35ms, 175ms)); }
@keyframes rise{ from{ transform:translateY(6px); opacity:.001; } }
.draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:draw 900ms var(--e-in) forwards; animation-delay:120ms; }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:0s !important; animation-delay:0s !important; transition-duration:0s !important; } .draw{ stroke-dashoffset:0; } }

/* статус */
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.ok{ --tone:var(--ok); } .warn{ --tone:var(--warn); } .crit{ --tone:var(--crit); } .na{ --tone:var(--neutral-bar); }
.dot.ok, .dot.warn, .dot.crit, .dot.na{ background:var(--tone); }
.st{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color:var(--tone); }
.bdg{ display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:6px; font-size:12px; font-weight:500; background:var(--surface-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--border); }
.dl{ font-size:12px; font-weight:600; padding:1px 6px; border-radius:6px; font-variant-numeric:tabular-nums; }
.dl.good{ color:var(--ok); background:var(--ok-soft); } .dl.bad{ color:var(--crit); background:var(--crit-soft); }

/* выбор направления */
.gx-intro{ padding:40px 0 8px; }
.gx-intro h1{ margin:0; font-size:clamp(28px, 3.4vw, 40px); line-height:1.1; letter-spacing:-.025em; font-weight:600; color:var(--text-strong); text-wrap:balance; }
.gx-intro p{ margin:12px 0 0; max-width:760px; font-size:15px; line-height:1.55; color:var(--text); }
.vpick{ display:grid; gap:12px; grid-template-columns:minmax(0,1fr); margin:24px 0 28px; }
@media (min-width:900px){ .vpick{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.vp{ text-align:left; font:inherit; color:inherit; border:0; background:var(--surface); border-radius:14px; padding:16px 18px; box-shadow:var(--lift); cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.vp[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--text-strong), var(--lift-hi); }
.vp:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.vp b{ font-size:16px; font-weight:600; color:var(--text-strong); }
.vp span{ font-size:13px; line-height:1.45; color:var(--text); }
.vp small{ font-size:12px; color:var(--text-muted); }
.stage{ view-transition-name:gxstage; }
::view-transition-old(gxstage){ animation:120ms var(--e-out) both vtout; }
::view-transition-new(gxstage){ animation:220ms var(--e-in) 60ms both vtin; }
@keyframes vtout{ to{ opacity:0; transform:translateY(-4px); } } @keyframes vtin{ from{ opacity:0; transform:translateY(6px); } }
::view-transition{ pointer-events:none; }

/* ===================== A · ШТАБ ===================== */
.va{ border-radius:20px; padding:24px; background:var(--bg); box-shadow:inset 0 0 0 1px var(--border); color:var(--text); }
.va-head{ display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; margin-bottom:20px; }
.va-head .t{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); }
.va-grid{ display:grid; gap:14px; grid-template-columns:repeat(12,minmax(0,1fr)); }
.va-grid > *{ grid-column:span 12; }
@media (min-width:1000px){ .c8{ grid-column:span 8 !important; } .c4{ grid-column:span 4 !important; } .c6{ grid-column:span 6 !important; } .c3{ grid-column:span 3 !important; } }
.hero-n{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.hero-n .big{ font-size:clamp(56px, 7vw, 96px); line-height:.9; font-weight:600; letter-spacing:-.045em; color:var(--text-strong); font-variant-numeric:tabular-nums; }
.hero-n .of{ font-size:22px; color:var(--text-muted); font-weight:500; padding-bottom:10px; letter-spacing:-.01em; }
.hero-say{ font-size:17px; line-height:1.45; color:var(--text-strong); font-weight:500; margin:14px 0 0; max-width:620px; text-wrap:pretty; }
.ratio{ display:flex; height:10px; gap:2px; margin-top:18px; border-radius:5px; overflow:hidden; }
.ratio i{ display:block; height:100%; transform-origin:left; animation:grow 700ms var(--e-in) both; animation-delay:calc(var(--i,0) * 60ms); }
@keyframes grow{ from{ transform:scaleX(0); } }
.ratio-leg{ display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:10px; font-size:12px; color:var(--text-muted); }
.ratio-leg span{ display:inline-flex; gap:6px; align-items:center; }
.ratio-leg i{ width:8px; height:8px; border-radius:2px; }
.stats{ display:grid; gap:1px; background:var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--lift); grid-template-columns:repeat(2,minmax(0,1fr)); }
@media (min-width:760px){ .stats{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.stat{ background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:6px; position:relative; }
.stat .k{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-muted); }
.stat .v{ font-size:30px; font-weight:600; letter-spacing:-.025em; color:var(--text-strong); line-height:1.05; }
.stat .s{ font-size:12.5px; color:var(--text); line-height:1.4; }
.ring{ width:44px; height:44px; flex:none; }
.ring circle{ fill:none; stroke-width:5; }
.ring .tr{ stroke:var(--track); } .ring .fg{ stroke:var(--tone); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 600ms var(--e-in); }
.ring .nm{ stroke:var(--text-strong); stroke-width:2; }
.steps{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; margin-top:6px; }
@media (max-width:760px){ .steps{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.stp{ position:relative; border:0; font:inherit; color:inherit; text-align:left; background:var(--surface-2); border-radius:10px; padding:10px 10px 12px; cursor:pointer; min-height:92px; display:flex; flex-direction:column; justify-content:space-between; transition:background 160ms var(--e-std), transform 200ms var(--e-in); }
.stp:hover{ transform:translateY(-1px); } .stp[aria-pressed="true"]{ background:var(--text-strong); color:var(--bg); }
.stp[aria-pressed="true"] .muted{ color:color-mix(in oklab, var(--bg) 70%, transparent); }
.stp b{ font-size:22px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stp .lbl{ font-size:11.5px; line-height:1.3; padding-right:34px; }
.stp .loss{ position:absolute; top:8px; right:8px; font-size:11px; font-weight:600; color:var(--crit); font-variant-numeric:tabular-nums; }
.stp[aria-pressed="true"] .loss{ color:color-mix(in oklab, var(--crit) 55%, var(--bg)); }
.stp:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.va-ins{ margin-top:14px; padding:14px 16px; border-radius:12px; background:var(--surface-2); display:grid; gap:12px; grid-template-columns:minmax(0,1fr); }
@media (min-width:760px){ .va-ins{ grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); } }
.va-ins h4{ margin:0 0 4px; font-size:15px; font-weight:600; color:var(--text-strong); }
.va-ins p{ margin:0; font-size:13px; line-height:1.5; }
.act-l{ display:flex; flex-direction:column; }
.act-i{ display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--border); }
.act-i:first-child{ border-top:0; padding-top:0; }
.act-i b{ display:block; font-size:13.5px; font-weight:600; color:var(--text-strong); line-height:1.35; }
.act-i span{ display:block; font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.4; }
.sm-mult{ display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); }
.sm1{ padding:12px; border-radius:10px; background:var(--surface-2); }
.sm1 .k{ font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between; }
.sm1 .v{ font-size:18px; font-weight:600; color:var(--text-strong); letter-spacing:-.02em; margin:4px 0 2px; }

/* ===================== B · ОТЧЁТ ===================== */
.vb{ border-radius:20px; background:var(--surface); box-shadow:var(--lift); padding:clamp(20px, 4vw, 56px); }
.vb-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:12.5px; color:var(--text-muted); }
.vb h2{ margin:14px 0 0; font-size:clamp(30px, 4.2vw, 52px); line-height:1.05; letter-spacing:-.035em; font-weight:600; color:var(--text-strong); max-width:980px; text-wrap:balance; }
.vb h2 em{ font-style:normal; color:var(--crit); }
.vb .lede{ margin:18px 0 0; font-size:18px; line-height:1.55; color:var(--text); max-width:760px; text-wrap:pretty; }
.vb-cols{ display:grid; gap:28px; grid-template-columns:minmax(0,1fr); margin-top:36px; }
@media (min-width:1000px){ .vb-cols{ grid-template-columns:minmax(0,1fr) 260px; } }
.vb-fig{ margin:0; }
.vb-fig figcaption{ font-size:13px; color:var(--text-muted); margin-top:10px; line-height:1.45; }
.vb-side{ display:flex; flex-direction:column; gap:22px; }
.note{ padding-left:14px; box-shadow:inset 1px 0 0 var(--border-strong); }
.note b{ display:block; font-size:28px; font-weight:600; letter-spacing:-.025em; color:var(--text-strong); font-variant-numeric:tabular-nums; }
.note > span{ display:block; font-size:13px; line-height:1.45; color:var(--text); margin-top:4px; }
.vb-quote{ margin:40px 0 0; padding:28px; border-radius:16px; background:var(--surface-2); display:grid; gap:18px; grid-template-columns:minmax(0,1fr); }
@media (min-width:900px){ .vb-quote{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
.bub{ max-width:92%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.45; }
.bub.c{ background:var(--surface); box-shadow:var(--lift); border-bottom-left-radius:4px; }
.bub.m{ background:var(--primary-soft); margin-left:auto; border-bottom-right-radius:4px; }
.bub small{ display:block; font-size:11.5px; color:var(--text-muted); margin-top:4px; }
.chat{ display:flex; flex-direction:column; gap:8px; }
.vb-three{ display:grid; gap:18px; grid-template-columns:minmax(0,1fr); margin-top:40px; }
@media (min-width:900px){ .vb-three{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.vb-three .n{ font-size:13px; font-weight:600; color:var(--text-muted); }
.vb-three h5{ margin:6px 0 6px; font-size:17px; line-height:1.3; font-weight:600; color:var(--text-strong); letter-spacing:-.01em; }
.vb-three p{ margin:0; font-size:13.5px; line-height:1.5; }

/* ===================== C · ПОТОК ===================== */
.vc-top{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
@media (min-width:1000px){ .vc-top{ grid-template-columns:minmax(0,1fr) 340px; } }
.sankey svg{ display:block; width:100%; height:auto; overflow:visible; }
.sankey .band{ transition:opacity 200ms var(--e-std); cursor:pointer; }
.sankey.hl .band{ opacity:.18; } .sankey.hl .band.on{ opacity:1; }
.sankey text{ font-family:var(--font-sans); }
.sk-n{ fill:var(--text-strong); font-size:13px; font-weight:600; } .sk-s{ fill:var(--text-muted); font-size:11.5px; }
.vc-side{ display:flex; flex-direction:column; gap:12px; }
.vc-say{ font-size:22px; line-height:1.25; font-weight:600; letter-spacing:-.02em; color:var(--text-strong); margin:6px 0 8px; }
.vc-cards{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr); margin-top:14px; }
@media (min-width:760px){ .vc-cards{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1150px){ .vc-cards{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.rc{ display:flex; flex-direction:column; gap:10px; }
.rc .top{ display:flex; gap:12px; align-items:center; }
.rc .top b{ display:block; font-size:24px; font-weight:600; letter-spacing:-.025em; color:var(--text-strong); }
.rc .top span{ display:block; font-size:12.5px; color:var(--text-muted); }
.rc p{ margin:0; font-size:13px; line-height:1.5; }

/* ===================== ДИЗАЙН-СИСТЕМА ===================== */
.ds{ margin-top:72px; }
.ds > header h2{ margin:0; font-size:32px; letter-spacing:-.03em; font-weight:600; color:var(--text-strong); }
.ds > header p{ margin:8px 0 0; color:var(--text); max-width:780px; font-size:14.5px; line-height:1.55; }
.ds-sec{ margin-top:36px; }
.ds-sec > h3{ margin:0 0 12px; font-size:13px; font-weight:600; color:var(--text-muted); letter-spacing:.06em; text-transform:uppercase; display:flex; gap:10px; align-items:baseline; }
.ds-sec > h3 small{ text-transform:none; letter-spacing:0; font-weight:400; }
.ds-grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
.ds-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.sw{ border-radius:12px; overflow:hidden; box-shadow:var(--lift); background:var(--surface); }
.sw i{ display:block; height:56px; }
.sw div{ padding:8px 10px; font-size:12px; } .sw code{ font-size:11px; color:var(--text-muted); font-family:var(--font-sans); }
.ty{ display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; align-items:baseline; padding:10px 0; border-top:1px solid var(--border); }
.ty code{ font-size:12px; color:var(--text-muted); font-family:var(--font-sans); }
.rad{ display:flex; gap:12px; flex-wrap:wrap; }
.rad div{ width:88px; height:64px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--border-strong); display:grid; place-items:end start; padding:6px 8px; font-size:11.5px; color:var(--text-muted); }
.dep{ display:flex; gap:16px; flex-wrap:wrap; }
.dep div{ width:150px; height:84px; border-radius:12px; background:var(--surface); display:grid; place-items:end start; padding:8px 10px; font-size:12px; color:var(--text-muted); }
.mo{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); }
.mo .card{ padding:14px; }
.mo-track{ height:36px; border-radius:8px; background:var(--surface-2); position:relative; margin-top:10px; overflow:hidden; }
.mo-dot{ position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:6px; background:var(--text-strong); transition:transform 520ms var(--c); }
.mo .card:hover .mo-dot{ transform:translateX(calc(var(--w, 220px) - 36px)); }
.field{ display:flex; flex-direction:column; gap:6px; min-width:220px; }
.field label{ font-size:12.5px; font-weight:500; color:var(--text-strong); }
.field .hint{ font-size:12px; color:var(--text-muted); } .field .err{ font-size:12px; color:var(--crit); }
.in{ height:38px; border-radius:8px; border:0; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border-strong); padding:0 12px; font:inherit; font-size:16px; color:var(--text-strong); transition:box-shadow 160ms var(--e-std); }
@media (min-width:760px){ .in{ font-size:14px; } }
.in:hover{ box-shadow:inset 0 0 0 1px var(--text-muted); } .in:focus{ outline:none; box-shadow:inset 0 0 0 1px var(--primary), 0 0 0 3px color-mix(in oklab, var(--primary) 22%, transparent); }
.in.bad{ box-shadow:inset 0 0 0 1px var(--crit); }
.srch{ position:relative; } .srch .in{ padding-left:34px; padding-right:44px; width:100%; }
.srch svg{ position:absolute; left:11px; top:11px; color:var(--text-muted); } .srch .kbd{ position:absolute; right:9px; top:9px; }

/* ---------- переход числа: только при изменении, 450 мс, ease-out по кубу ---------- */
const NUMS = new Map();
function tick(root){
  root.querySelectorAll('[data-n]').forEach(el => {
    const key = el.dataset.key || el.dataset.n, to = parseFloat(el.dataset.n), from = NUMS.has(key) ? NUMS.get(key) : to, suf = el.dataset.suf || '';
    NUMS.set(key, to);
    if(from === to || reduce){ el.textContent = nf(to) + suf; return; }
    const t0 = performance.now(), dur = 450;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = nf(Math.round((from + (to - from) * e) * 10) / 10) + suf; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const N = (v, key, suf) => '<span class="num" data-n="' + (v == null ? 0 : v) + '" data-key="' + key + '" data-suf="' + (suf || '') + '">' + nf(v) + (suf || '') + '</span>';

/* ---------- переключатель ---------- */
function seg(el, onPick){

function ring(v, norm, tone){ const r = 18, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, v || 0)) / 100, a = norm / 100 * 360 - 90;
  const nx = 22 + Math.cos(a * Math.PI / 180) * 18, ny = 22 + Math.sin(a * Math.PI / 180) * 18, nx2 = 22 + Math.cos(a * Math.PI / 180) * 12, ny2 = 22 + Math.sin(a * Math.PI / 180) * 12;
  return '<svg class="ring ' + tone + '" viewBox="0 0 44 44" aria-hidden="true"><circle class="tr" cx="22" cy="22" r="' + r + '"/><circle class="fg" cx="22" cy="22" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - p)) + '"/><line class="nm" x1="' + nx2 + '" y1="' + ny2 + '" x2="' + nx + '" y2="' + ny + '"/></svg>'; }
function spark(vals, color, w, h, fill){ w = w || 120; h = h || 36; const xs = vals.map((v, i) => [i, v]).filter(p => p[1] != null); if(xs.length < 2) return '';
  const mx = Math.max(...xs.map(p => p[1]), 1), pts = xs.map(([i, v]) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - (v / mx) * (h - 8)]), d = 'M' + pts.map(p => p.map(x => x.toFixed(1)).join(' ')).join('L'), l = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true" style="overflow:visible">' + (fill ? '<path d="' + d + 'L' + l[0] + ' ' + h + 'L' + pts[0][0] + ' ' + h + 'Z" fill="' + color + '" opacity=".1"/>' : '')
    + '<path class="draw" pathLength="1" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + l[0] + '" cy="' + l[1] + '" r="3" fill="' + color + '"/></svg>'; }
const statusOf = (v, norm, up) => v == null ? 'na' : (up ? v >= norm : v <= norm) ? 'ok' : (up ? v >= norm * .7 : v <= norm * 1.3) ? 'warn' : 'crit';
