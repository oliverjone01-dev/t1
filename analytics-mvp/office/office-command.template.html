<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Офис-менеджер · Квалификация лидов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0B0F15;--bg-card:#131820;--bg-elevated:#1A2029;--border:#1F2731;--border-soft:#161C24;--border-hot:#2B3441;
--ink:#F1F4F8;--ink-2:#A0AAB8;--ink-3:#6A7484;--ink-4:#3F4855;--accent:#22D3EE;--accent-deep:#0E7490;--accent-soft:rgba(34,211,238,.10);
--up:#10B981;--dn:#F43F5E;--warn:#F59E0B;--info:#A78BFA;--bg-soft:#232B36;--radius:10px;--radius-lg:14px;--ease-out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{background:radial-gradient(ellipse 60% 40% at 50% -8%,rgba(34,211,238,.05),transparent 70%),var(--bg-base);color:var(--ink);font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.line-anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease-out) forwards}
.hdr{position:sticky;top:0;z-index:60}
.topbar{padding:11px 24px;border-bottom:1px solid var(--border-soft);background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}
.brand b{font-family:'Manrope';font-weight:800;font-size:14px}.brand span{display:block;font-size:10.5px;color:var(--ink-3)}
.tb-spacer{flex:1}
.nav{display:flex;gap:3px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:3px}
.nav button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:7px;cursor:pointer;transition:.15s}
.nav button.on{background:var(--accent-soft);color:var(--accent)}.nav button:hover:not(.on){color:var(--ink)}
.controls{padding:10px 24px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px)}
.ctl-lbl{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;max-width:230px}
.seg{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input[type=date]{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:5px 8px;font:inherit;font-size:11.5px}
.plan-inp{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700;width:64px;font-variant-numeric:tabular-nums}
.plan-inp:focus{outline:none;border-color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:8px 24px 70px}
.sec-div{display:flex;align-items:center;gap:14px;margin:26px 0 14px;scroll-margin-top:118px}
.sec-div:first-child{margin-top:14px}
.sec-num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:14px;flex-shrink:0}
.sec-div h2{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.sec-div .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border-hot),transparent)}
.sec-div .hint{font-size:11px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:14px;margin-bottom:14px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;animation:fadeUp .4s var(--ease-out) both;display:flex;flex-direction:column;align-items:center;text-align:center}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac,var(--accent)),transparent)}
.kpi .k{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.kpi .v{font-family:'Manrope';font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1}
.kpi .v .u{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px}
.kpi .sub{font-size:10px;color:var(--ink-3);margin-top:6px;flex:1}
.kpi .trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:8px;padding:2px 7px;border-radius:6px}
.trend.up{color:var(--up);background:rgba(16,185,129,.12)}.trend.dn{color:var(--dn);background:rgba(244,63,94,.12)}.trend.flat{color:var(--ink-3);background:var(--bg-elevated)}
.now-badge{font-size:8.5px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.5);color:var(--warn);border-radius:5px;padding:1px 5px;font-weight:700;margin-left:6px;vertical-align:2px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;animation:fadeUp .45s var(--ease-out) both}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:16px;flex-wrap:wrap}
.card-title{font-family:'Manrope';font-weight:700;font-size:15px;margin-bottom:2px}
.card-sub{font-size:11px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tbl tr:last-child td{border-bottom:none}
.fbar{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.fbar .fl{width:190px;font-size:11.5px;color:var(--ink-2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft{flex:1;height:24px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.fbar .ff{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#06121a;transform-origin:left;animation:grow .8s var(--ease-out) both;white-space:nowrap}
.fbar .fv{width:150px;font-size:11px;color:var(--ink-3);flex-shrink:0}.fbar .fv b{color:var(--ink);font-weight:700}
.note{font-size:11.5px;color:var(--ink-2);background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 13px;margin-bottom:14px;line-height:1.5}
.reco{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;border:1px solid}
.qm{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-hot);color:var(--ink-3);font-size:9px;align-items:center;justify-content:center;cursor:help;vertical-align:1px;margin-left:5px}
#tip{position:fixed;z-index:99;background:#0d1219;border:1px solid var(--border-hot);border-radius:9px;padding:10px 13px;font-size:11.5px;color:var(--ink-2);pointer-events:none;opacity:0;transition:opacity .12s;max-width:340px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
#tip .tl{font-weight:700;color:var(--ink);margin-bottom:5px;font-size:12px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;margin:2px 0}#tip .tr span:last-child{font-weight:700;color:var(--ink);white-space:nowrap}

#tip .qh{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 2px}
#tip .qh:first-child{margin-top:0}
#tip .qw{color:#22D3EE}#tip .qq{color:#F59E0B}#tip .qc{color:#10B981}
#tip .qb{white-space:normal;line-height:1.45}
#tip .tn{margin-top:6px;padding-top:6px;border-top:1px solid var(--border-soft);color:var(--ink-3);line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.foot{text-align:center;color:var(--ink-4);font-size:11px;margin-top:28px}
.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#2e3947 var(--bg-base)}
.scroll::-webkit-scrollbar{width:9px;height:9px}.scroll::-webkit-scrollbar-track{background:var(--bg-base)}.scroll::-webkit-scrollbar-thumb{background:#2e3947;border-radius:5px}
.gauge-wrap{display:flex;gap:14px;flex-wrap:wrap}
.gauge{flex:1;min-width:210px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px 10px;text-align:center}
.gauge h4{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.gauge .gnote{font-size:10.5px;color:var(--ink-3);margin-top:2px}.gauge .gnote b{color:var(--ink-2)}
</style></head><body>
<div class="hdr">
<div class="topbar"><div class="logo">GG</div><div class="brand"><b>GENGLASS · Офис-менеджер</b><span>квалификация лидов · воронка GG · один экран на отдел · <span id="fresh"></span></span></div>
<div class="tb-spacer"></div><div class="nav" id="nav"></div></div>
<div class="controls">
  <span id="periodLabel" style="font-size:11.5px;color:var(--ink-3)"></span>
  <span style="flex:1"></span>
  <span class="ctl-lbl">Период</span><div class="seg" id="presetSeg"><button data-p="1">Сегодня</button><button data-p="y">Вчера</button><button data-p="7">7 дн</button><button data-p="30" class="on">30 дн</button><button data-p="60">60 дн</button><button data-p="all">Всё</button></div>
  <input type="date" id="dFrom"><span style="color:var(--ink-4)">-</span><input type="date" id="dTo"><button id="applyCustom" style="padding:6px 12px;color:var(--accent);cursor:pointer;border:1px solid var(--border);background:var(--bg-elevated);border-radius:8px;font:inherit;font-size:11.5px">OK</button>
</div>
</div>
<div class="wrap" id="root"></div>
<div id="tip"></div>
<script>
const DATA={};
/* ===== базовые помощники ===== */
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const d1=n=>(Math.round(n*10)/10).toLocaleString('ru-RU');
const pct=x=>(x*100).toFixed(x*100>=10?0:1).replace('.',',')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const attr=s=>String(s).replace(/"/g,'&quot;');
const info=t=>`<span class="qm" data-tip="${attr(t)}">?</span>`;
const med=a=>{a=a.filter(x=>x!=null).sort((p,q)=>p-q);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const DAYMS=864e5;
const iso=d=>d.toISOString().slice(0,10);
const D=s=>s?new Date(s+'T00:00:00+03:00'):null;
const days=(a,b)=>a&&b?Math.round((D(b)-D(a))/DAYMS):null;
const dm=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
/* «сегодня» = дата снимка данных (МСК) - живём по данным, не по часам браузера */
const GEN=DATA.generatedAt?new Date(DATA.generatedAt):new Date();
const TODAY=iso(new Date(GEN.getTime()+3*36e5));
const YESTER=iso(new Date(GEN.getTime()+3*36e5-DAYMS));
/* ===== GG-поток: без GM ===== */
const GM_M=new Set(['Виктория Преснякова','Денис Белов','Юлия Мавлина','Системный пользователь MGM']);
const GG=DATA.leads.filter(l=>l.dir!=='metal_gm'&&!GM_M.has(l.mgr));
const DD=DATA.deals||[]; // сделки ОП (воронка GG Заказы РФ): полярная звезда компании
function cstats(a,b){const inP=x=>x&&x>=a&&x<=b;
  const pre=DD.filter(d=>inP(d.prepay));
  return {rev:pre.reduce((s,d)=>s+(d.budget||0),0),sales:pre.length,
    prod:DD.filter(d=>inP(d.prod)).length,deals:DD.filter(d=>inP(d.created)).length}}
const OPEN=l=>!l.closed&&!l.conv&&!l.junk;
const MIND=GG.reduce((m,l)=>l.created&&l.created<m?l.created:m,TODAY);
/* ===== состояние ===== */
let S={from:'',to:'',preset:'30'};
function setPeriod(p){const e=D(TODAY);
  if(p==='all'){S.from=MIND;S.to=TODAY}
  else if(p==='y'){S.from=YESTER;S.to=YESTER}
  else{const s=new Date(e.getTime());s.setDate(s.getDate()-(+p-1));S.from=iso(s);S.to=TODAY}S.preset=p}
const workdays=(a,b)=>{let n=0;for(let d=D(a);d<=D(b);d=new Date(d.getTime()+DAYMS)){const w=d.getDay();if(w!==0&&w!==6)n++}return Math.max(n,1)};
/* ===== план офис-менеджера: декомпозиция от плана выручки ОП =====
   План выручки месяца (Google Таблица РОПа) -> продаж нужно (rev/чек) ->
   квал-лидов нужно (продажи/CR2) -> заявок разобрать (квал/CR1). В день = /раб.дни месяца. */
const PMON=TODAY.slice(0,7);
const _pm=((DATA.plan&&DATA.plan.months)||[]).find(m=>m.month===PMON)||null;
const PP={rev:_pm&&_pm.rev||4e6,check:_pm&&_pm.check||8e4,cr2:_pm&&_pm.cr2||.16,cr1:_pm&&_pm.cr1||.55,has:!!_pm};
const _mEnd=(()=>{const y=+PMON.slice(0,4),mo=+PMON.slice(5,7);const ld=new Date(Date.UTC(y,mo,0)).getUTCDate();return PMON+'-'+String(ld).padStart(2,'0')})();
const WDM=workdays(PMON+'-01',_mEnd);
const NEED={sales:PP.rev/PP.check};NEED.kval=NEED.sales/PP.cr2;NEED.rz=NEED.kval/PP.cr1;
const PLAN={rz:Math.ceil(NEED.rz/WDM),kv:Math.ceil(NEED.kval/WDM)};
/* ===== графика ===== */
function chart(series,keys,opt){opt=opt||{};const w=opt.w||640,h=opt.h||200,pl=40,pr=10,pt=12,pb=24;
  let mx=0;series.forEach(s=>s.vals.forEach(v=>{if(v!=null&&v>mx)mx=v}));mx=mx*1.15||1;
  const n=keys.length,X=i=>pl+(w-pl-pr)*(n>1?i/(n-1):.5),Y=v=>h-pb-(h-pt-pb)*v/mx;
  let grid='';for(let g=0;g<=3;g++){const yy=pt+(h-pt-pb)*g/3;grid+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink-4)">${fmt(mx*(1-g/3))}</text>`}
  let xl='';const step=Math.ceil(n/9);keys.forEach((k,i)=>{if(i%step===0||i===n-1)xl+=`<text x="${X(i)}" y="${h-pb+14}" text-anchor="middle" font-size="9" fill="var(--ink-4)">${dm(k)}</text>`});
  const smooth=pts=>{if(pts.length<3)return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
    return d};
  let body='';const oneB=n===1;const bars=series.filter(s=>s.bar||oneB);
  series.forEach(s=>{
    if(s.bar||oneB){const nb=bars.length||1,bi=bars.indexOf(s),slot=oneB?Math.min(120,40*nb):Math.max(2.5,(w-pl-pr)/(n*2.1)),bw=Math.max(2.5,slot/nb);
      body+=s.vals.map((v,i)=>!v?'':`<rect x="${(X(i)-slot/2+bi*bw).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-pb-Y(v)).toFixed(1)}" rx="2" fill="${s.c}" opacity="${s.op!=null?s.op:.8}" pointer-events="none"/>`+(oneB?`<text x="${(X(i)-slot/2+bi*bw+bw/2).toFixed(1)}" y="${(Y(v)-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${s.c}">${fmt(v)}</text>`:'')).join('')}
    else{const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
      if(pts.length>1){const d=smooth(pts);
        if(s.area)body+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${h-pb} L${pts[0][0].toFixed(1)} ${h-pb} Z" fill="${s.c}" opacity=".08" pointer-events="none"/>`;
        body+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`}
      body+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${s.c}" pointer-events="none"/>`).join('')}});
  /* колонки-ховеры с подсказкой по дню; пустые дни затеняем и объясняем */
  const bw2=(w-pl-pr)/(n-1||1);let cols='',shade='';
  keys.forEach((k,i)=>{const rows=series.map(s=>`<div class='tr'><span>${s.name}</span><span>${s.vals[i]!=null?fmt(s.vals[i]):'—'}</span></div>`).join('');
    const extra=opt.tipExtra?opt.tipExtra(i):'';
    const empty=series.every(s=>!s.vals[i]);
    const x0=Math.max(pl,X(i)-bw2/2);
    if(empty)shade+=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${bw2.toFixed(1)}" height="${h-pt-pb}" fill="rgba(148,163,184,.07)" pointer-events="none"/>`;
    const tipH=empty?`<div class='tl'>${dm(k)}</div><div class='tn'>${k>TODAY?'день ещё не наступил - данных пока нет':'событий в этот день не было: ни заявок, ни разборов'}</div>`:`<div class='tl'>${dm(k)}</div>${rows}${extra}`;
    cols+=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${bw2.toFixed(1)}" height="${h-pt-pb}" fill="transparent" data-tip="${attr(tipH)}"/>`});
  const legend=`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${grid}${shade}${body}${cols}${xl}</svg>`+legend}
function donut(rows,center,label){const tot=rows.reduce((s,r)=>s+r[1],0)||1;let a0=-90,segs='';
  const R=52,C=64;rows.forEach(r=>{const frac=r[1]/tot;if(frac<=0)return;const an=Math.min(frac*360,359.98);
    const a1=a0+an,rad=x=>x*Math.PI/180,x0=C+R*Math.cos(rad(a0)),y0=C+R*Math.sin(rad(a0)),x1=C+R*Math.cos(rad(a1)),y1=C+R*Math.sin(rad(a1));

  const wTbl=waiting.length?`<div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th style="text-align:center">ID</th><th>Заявка</th><th>Источник</th><th style="text-align:center">Статус</th><th style="text-align:center">Создан</th><th style="text-align:center">Ждёт</th></tr></thead><tbody>${wRows}</tbody></table>${waiting.length>12?`<div class="card-sub" style="margin-top:6px">показаны 12 старейших из ${fmt(waiting.length)}</div>`:''}</div>`:'';

  /* 7. Ориентиры: этот период против прошлого - прогноз темпа */
  const perDayCl=cur.closed.length/Math.max(span,1),perDayInPrev=prev.inflow.length/Math.max(span,1);
  const bench=(l,now,was,fmtF,invGood)=>{const better=now!=null&&was!=null?(invGood?now<=was:now>=was):null;
    return `<tr><td style="font-weight:600">${l}</td><td style="text-align:center;font-weight:800;color:${better==null?'var(--ink-2)':better?'#10B981':'#F43F5E'}">${now!=null?fmtF(now):'—'}</td><td style="text-align:center;color:var(--ink-2)">${was!=null?fmtF(was):'—'}</td></tr>`};
  const benchTbl=`<table class="tbl"><thead><tr><th>Показатель</th><th style="text-align:center">Этот период</th><th style="text-align:center">Прошлый период</th></tr></thead><tbody>
    ${bench('Заявок в день (поток)',perDayIn,perDayInPrev,d1)}
    ${bench('Разборов в день (темп)',perDayCl,prev.closed.length/Math.max(span,1),d1)}
    ${bench('CR в квал-лид',cur.cr,prev.cr,pct)}
    ${bench('Скорость разбора, дн (медиана)',cur.speed,prev.speed,d1,true)}
    ${bench('Передано в сделку',cur.kval.length,prev.kval.length,fmt)}
  </tbody></table>
  <div class="note" style="margin-top:12px;margin-bottom:0">Как читать: поток <b>${d1(perDayIn)} заявок/день</b> против темпа разбора <b>${d1(perDayCl)}/день</b>. Поток выше темпа - очередь растёт, день на скорость; темп успевает - день на качество: вытаскивать CR и не плодить «некачественных» без прозвона.</div>`;

  document.getElementById('root').innerHTML=
    `<div class="sec-div" id="sec1"><div class="sec-num">1</div><h2>Компания</h2><div class="ln"></div><div class="hint">полярная звезда: цель компании и отдела продаж · период ${dm(a)} - ${dm(b)} · стрелки = к прошлому равному периоду</div></div>`
    +kpiRow(kC,4)
    +`<div class="sec-div" id="sec2"><div class="sec-num">2</div><h2>Мои метрики</h2><div class="ln"></div><div class="hint">воронка квалификации GG · планы масштабируются под выбранный период</div></div>`
    +kpiRow(k1,4)
    +`<div class="sec-div" id="sec3"><div class="sec-num">3</div><h2>План / факт</h2><div class="ln"></div><div class="hint">декомпозиция от плана выручки ОП · выполнение как на дашборде РОПа</div></div>`
    +`<div class="card"><div class="card-h"><div><div class="card-title">Декомпозиция и выполнение ${info('План офис-менеджера НЕ задаётся руками - он выводится из плана выручки отдела продаж за текущий месяц по конверсиям из планов РОПа: продаж нужно = выручка ÷ средний чек; в сделку нужно = продажи ÷ CR2 (сделка -> продажа); заявок разобрать = в сделку ÷ CR1 (заявка -> сделка). План на день = месячная потребность ÷ рабочие дни месяца. Спидометры: стрелка - выполнение плана выбранного периода, риска - 100% плана. Вопрос: сколько заявок разобрать и передать в сделку, чтобы отдел сделал план выручки? Вывод: спидометры красные при зелёной выручке - план тянут крупные чеки, а не поток: хрупко, наращивать разбор; красное всё - эскалировать нехватку потока маркетингу.')}</div><div class="card-sub">план на день: разобрать <b style="color:var(--ink)">${fmt(PLAN.rz)}</b> · в сделку <b style="color:var(--ink)">${fmt(PLAN.kv)}</b> · на неделю: ${fmt(PLAN.rz*5)} / ${fmt(PLAN.kv*5)} · на месяц: ${fmt(Math.ceil(NEED.rz))} / ${fmt(Math.ceil(NEED.kval))}${PP.has?'':' · план месяца в таблице не найден, взяты дефолтные ориентиры'}</div></div></div>${planChain}${gaugesDay}</div>`
    +`<div class="sec-div" id="sec4"><div class="sec-num">4</div><h2>Динамика</h2><div class="ln"></div><div class="hint">${dm(a)} - ${dm(b)} · стрелки = к прошлому равному периоду</div></div>`
    +kpiRow(k2,3)
    +`<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-title">Картина по этапам ${info('Верхние две полосы - поток за период: сколько заявок пришло и сколько закрыто. Ветки ↳ - исходы разбора (% от разобранных). Оранжевые внизу - очередь ПРЯМО СЕЙЧАС по статусам: это не за период, а моментальный снимок. Вопрос: куда уходит входящий поток и на чём теряем? Вывод: растёт доля СПАМ/некачественных - чистить источники (сверь с пончиком «Откуда заявки»); растёт очередь внизу - ускоряться.')}</div><div class="card-sub">поток за период → исходы разбора · внизу очередь сейчас</div></div></div>${stages}<div style="height:8px"></div>${queueRows}</div>`
    +`<div class="card"><div class="card-h"><div><div class="card-title">Динамика по дням ${info('Голубые столбики - входящие заявки по дате создания. Зелёная линия - разобрано (закрыто) в этот день, фиолетовая - из них ушли в сделку. Наведи на день - все цифры и CR дня. Вопрос: успеваю ли я за потоком день в день? Вывод: голубые столбики систематически выше зелёной линии - хвост растёт, нужен темп; провалы линии в будни - смотреть, чем был занят день.')}</div><div class="card-sub">заявки · разобрано · в сделке по дням</div></div></div>${dyn}</div></div>`
    +`<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-title">Откуда заявки ${info('Источники входящих заявок за период с долями. Вопрос: какие каналы дают поток и какие - мусор? Вывод: сопоставь с «Исходами разбора»: канал с большой долей и высоким отсевом - чистить или отключать; канал с высоким CR - усиливать.')}</div><div class="card-sub">источники входящих за период</div></div></div>${dSrc}</div>`
    +`<div class="card"><div class="card-h"><div><div class="card-title">Исходы разбора ${info('Во что превратились закрытые за период заявки: сделка, отказ, некачественный, дубль, СПАМ. Вопрос: какая доля потока доходит до сделки и что съедает остальное? Вывод: доля «в сделку» упала к прошлому периоду - вопрос к качеству потока или глубине квалификации; много дублей - проверить склейку в CRM.')}</div><div class="card-sub">куда ушли закрытые за период лиды</div></div></div>${dOut}</div></div>`
    +`<div class="sec-div" id="sec5"><div class="sec-num">5</div><h2>Очередь сейчас</h2><div class="ln"></div><div class="hint">что разобрать первым - старые заявки сверху</div></div>`
    +`<div class="card"><div class="card-h"><div><div class="card-title">Ждут разбора: ${fmt(waiting.length)} ${info('Открытые лиды GG прямо сейчас (Новые заявки / Разобрать / В работе), созданные за последние 30 дней - рабочая очередь. Возрастная шкала: зелёное - сегодняшние, красное - ждут больше недели. Правило: заявка не должна ночевать дважды. Заявки старше 30 дней вынесены в архивный хвост - их разбирают планово, отдельно от свежего потока. Вопрос: что разобрать первым прямо сейчас? Вывод: красные строки - в работу сегодня: заявка не должна ночевать дважды; растёт архивный хвост - выделять регулярный слот на плановый разбор.')}</div><div class="card-sub">свежая заявка конвертируется лучше всего в первые сутки${tailN?` · архивный хвост: ${fmt(tailN)} заявок старше 30 дн - разобрать планово`:''}</div></div></div>${ageBar}${wTbl}</div>`
    +`<div class="sec-div" id="sec6"><div class="sec-num">6</div><h2>Ориентиры</h2><div class="ln"></div><div class="hint">поток против темпа: где ускориться, а где работать на качество</div></div>`
    +`<div class="card"><div class="card-h"><div><div class="card-title">Этот период против прошлого ${info('Зелёное - показатель не хуже прошлого равного периода, красное - просел. Главная пара: поток заявок/день против темпа разборов/день. Поток выше темпа = очередь копится, нужен темп. Темп успевает = можно вкладываться в качество квалификации. Вопрос: каким будет завтрашний день - на скорость или на качество? Вывод: поток/день выше темпа разборов - день на скорость; иначе - день на качество: поднимать конверсию в сделку и не плодить «некачественных» без прозвона.')}</div><div class="card-sub">равные окна: ${dm(a)} - ${dm(b)} против ${dm(pa)} - ${dm(pb2)}</div></div></div>${benchTbl}</div>`
    +`<div class="foot">GENGROUP · дашборд офис-менеджера GG · данные Bitrix24, снимок 2 раза в день</div>`;
}
/* ===== обвязка ===== */
function wire(){
  /* меню секций как у РОПа: клик - плавный скролл к разделу */
  const SECS=['Компания','Мои метрики','План/факт','Динамика','Очередь','Ориентиры'];
  const nav=document.getElementById('nav');
  nav.innerHTML=SECS.map((s,i)=>`<button data-i="${i+1}" class="${i===0?'on':''}">${s}</button>`).join('');
  nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const t=document.getElementById('sec'+b.dataset.i);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('presetSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#presetSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    setPeriod(b.dataset.p);syncDates();render()});
  const df=document.getElementById('dFrom'),dt=document.getElementById('dTo');
  const syncDates=()=>{df.value=S.from;dt.value=S.to;document.getElementById('periodLabel').textContent=S.from.split('-').reverse().join('.')+' - '+S.to.split('-').reverse().join('.')};
  window.syncDates=syncDates;
  document.getElementById('applyCustom').onclick=()=>{if(df.value)S.from=df.value;if(dt.value)S.to=dt.value;
    if(S.from>S.to){const t=S.from;S.from=S.to;S.to=t}document.querySelectorAll('#presetSeg button').forEach(x=>x.classList.remove('on'));syncDates();render()};
  /* подсказки */
  const tip=document.getElementById('tip');
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');
    if(t){tip.innerHTML=qfmt(t.dataset.tip);tip.style.opacity=1;
      const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
      if(x+r.width>innerWidth-8)x=e.clientX-r.width-10;if(y+r.height>innerHeight-8)y=e.clientY-r.height-10;
      tip.style.left=x+'px';tip.style.top=y+'px'}
    else tip.style.opacity=0});
  /* штамп свежести */
  const fr=document.getElementById('fresh');
  if(DATA.generatedAt){const g=new Date(DATA.generatedAt),m=new Date(g.getTime()+3*36e5),p=n=>String(n).padStart(2,'0');
    let s=`данные на ${p(m.getUTCDate())}.${p(m.getUTCMonth()+1)} ${p(m.getUTCHours())}:${p(m.getUTCMinutes())} МСК`;
    if(DATA.bakedAt){const bkd=new Date(new Date(DATA.bakedAt).getTime()+3*36e5);s+=` · сборка ${p(bkd.getUTCDate())}.${p(bkd.getUTCMonth()+1)} ${p(bkd.getUTCHours())}:${p(bkd.getUTCMinutes())}`}
    fr.textContent=s}
}
setPeriod('30');wire();window.syncDates();render();
/* Анти-кэш: v.txt рядом со страницей; проверка при загрузке, возврате на вкладку и раз в 15 мин */
(function(){try{
  if(location.protocol==='file:'||!DATA.bakedAt)return;
  const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
    v=(v||'').trim();if(!v||v===DATA.bakedAt)return;
    if(v<DATA.bakedAt)return;
    if(sessionStorage.getItem('_vchk')===v)return;
    sessionStorage.setItem('_vchk',v);location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }).catch(()=>{})};
  chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,9e5);
}catch(e){}})();
</script></body></html>
