name: Market delivery (Google Sheets)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ym-data
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Snapshot OZON files
        working-directory: analytics-mvp
        run: |
          set -euo pipefail
          md5sum public/*.html > /tmp/ozon-pages.md5
          find data -maxdepth 1 -type f -print0 | sort -z | xargs -0 md5sum > /tmp/ozon-data.md5
      - name: Read our delivery and rebuild Market
        working-directory: analytics-mvp
        run: |
          set -euo pipefail
          python3 -B tools/delivery/fetch_ym_delivery_sheet.py
          npm ci
          npm run ym:derive
          npm run ym:join
          npm run ym:reconcile
          npm run ym:build
          npm run ym:smoke
          md5sum -c /tmp/ozon-pages.md5
          md5sum -c /tmp/ozon-data.md5
      - name: Commit delivery snapshots (bot, main only)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A analytics-mvp/data-ym analytics-mvp/public/market
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data-ym: наша доставка из Google Таблицы'
          git push origin HEAD:main
