<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экономика сделок · GENGROUP</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#272c37;
    --tx:#e7ebf0; --mut:#8b93a1; --acc:#4A86E8;
    --pos:#38A169; --neg:#e05561; --warn:#D69E2E;
    --sp0:#4A86E8; --sp1:#D69E2E; --sp2:#DD6B20; --sp3:#805AD5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:13px}
  .stamp{margin-left:auto;color:var(--mut);font-size:12px;text-align:right}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .bar label{color:var(--mut);font-size:12px;margin-right:2px}
  input[type=date],select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--acc)} .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--mut);border:0;padding:6px 11px;font-size:12px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .k{color:var(--mut);font-size:12px;margin-bottom:6px}
  .kpi .v{font-size:22px;font-weight:700;letter-spacing:.3px}
  .kpi .v.pos{color:var(--pos)} .kpi .v.neg{color:var(--neg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--tx)}
  .card h2 .m{color:var(--mut);font-weight:400;font-size:12px}
  .spbar{display:flex;align-items:center;gap:10px;margin:9px 0}
  .spbar .nm{width:130px;font-size:13px;color:var(--tx)}
  .spbar .track{flex:1;height:14px;background:var(--panel2);border-radius:7px;overflow:hidden}
  .spbar .fill{height:100%;border-radius:7px}
  .spbar .vl{width:120px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  thead th{color:var(--mut);font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
  thead th:hover{color:var(--tx)}
  tbody tr:hover{background:var(--panel2)}
  td.pos{color:var(--pos)} td.neg{color:var(--neg)}
  .tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-top:16px;max-height:640px;overflow:auto}
  .muted{color:var(--mut)} .rt{font-size:12px;color:var(--mut);margin:4px 2px 0}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Экономика сделок</h1>
    <span class="sub" id="sub"></span>
    <span class="stamp" id="stamp"></span>
  </header>

  <div class="bar">
    <div class="presets" id="presets"></div>
    <span style="width:12px"></span>
    <label>с</label><input type="date" id="d1">
    <label>по</label><input type="date" id="d2">
    <span style="width:12px"></span>
    <label>по дате</label>
    <div class="seg" id="basis">
      <button data-b="created" class="on">создания</button>
      <button data-b="closed">закрытия</button>
    </div>
    <span style="width:12px"></span>
    <label>менеджер</label><select id="mgr"><option value="">все</option></select>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h2>Себестоимость по смарт-процессам <span class="m" id="ssnote"></span></h2>
      <div id="spbars"></div>
    </div>
    <div class="card">
      <h2>По менеджерам <span class="m">выручка · с/с · маржа</span></h2>
      <div style="max-height:320px;overflow:auto"><table id="mgrtbl"></table></div>
    </div>
  </div>

  <div class="rt" id="rowinfo"></div>
  <div class="tblwrap">
    <table id="deals"></table>
  </div>
</div>

<script>
const DATA={"funnelName":"GG Заказы РФ","b24Portal":"https://glassmemory.bitrix24.ru","bakedAt":null,"generatedAt":null,"category":49,"sp":[{"key":"Расчёт","etid":1060},{"key":"Калькулятор","etid":1056},{"key":"Закупка","etid":1074},{"key":"Производство GG","etid":1086}],"deals":[]};

// ---- утилиты ----
const SPCOL=['var(--sp0)','var(--sp1)','var(--sp2)','var(--sp3)'];
const rub=n=>Math.round(n).toLocaleString('ru')+' ₽';
const comp=n=>{n=Math.round(n);const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(2)+' млрд';if(a>=1e6)return (n/1e6).toFixed(1)+' млн';if(a>=1e3)return Math.round(n/1e3)+' тыс';return String(n);};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const dealUrl=id=>DATA.b24Portal+'/crm/deal/details/'+id+'/';

const S={d1:'',d2:'',basis:'created',mgr:'',sortKey:'id',sortDir:-1};

// диапазон -> отфильтрованные сделки
function filtered(){
  const b=S.basis;
  return DATA.deals.filter(d=>{
    if(S.mgr && d.mgr!==S.mgr) return false;
    const dt=b==='closed'?d.closed:d.created;
    if(b==='closed' && !d.closed) return false;
    if(S.d1 && (!dt||dt<S.d1)) return false;
    if(S.d2 && (!dt||dt>S.d2)) return false;
    return true;
  });
}

function kpis(rows){
  const budget=rows.reduce((a,d)=>a+d.budget,0);
  const ss=rows.reduce((a,d)=>a+d.ssTotal,0);
  const margin=budget-ss;
  const box=$('#kpis');box.innerHTML='';
  const add=(k,v,cls)=>{const e=el('div','kpi');e.append(el('div','k',k),el('div','v'+(cls?' '+cls:''),v));box.append(e);};
  add('Сделок с деньгами',rows.length.toLocaleString('ru'));
  add('Выручка портфеля',comp(budget)+' ₽');
  add('Себестоимость',comp(ss)+' ₽');
  add('Маржа',comp(margin)+' ₽',margin>=0?'pos':'neg');
  add('Маржинальность',pct(margin,budget)+' %',margin>=0?'pos':'neg');
}

function spbars(rows){
  const box=$('#spbars');box.innerHTML='';
  const totals=DATA.sp.map(s=>rows.reduce((a,d)=>a+(d.ss[s.key]||0),0));
  const max=Math.max(1,...totals);
  DATA.sp.forEach((s,i)=>{
    const b=el('div','spbar');
    b.append(el('div','nm',s.key));
    const tr=el('div','track');const f=el('div','fill');f.style.width=(totals[i]/max*100)+'%';f.style.background=SPCOL[i%4];tr.append(f);
    b.append(tr,el('div','vl',rub(totals[i])));
    box.append(b);
  });
  $('#ssnote').textContent='Сумма с/с = '+rub(totals.reduce((a,b)=>a+b,0));
}

function mgrtbl(rows){
  const m={};
  rows.forEach(d=>{const k=d.mgr||'-';const o=m[k]||(m[k]={b:0,s:0,n:0});o.b+=d.budget;o.s+=d.ssTotal;o.n++;});
  const arr=Object.entries(m).map(([k,v])=>({k,...v,mg:v.b-v.s})).sort((a,b)=>b.mg-a.mg);
  const t=$('#mgrtbl');
  t.innerHTML='<thead><tr><th class="l">Менеджер</th><th>Сделок</th><th>Выручка</th><th>С/с</th><th>Маржа</th><th>%</th></tr></thead>';
  const tb=el('tbody');
  arr.forEach(r=>{
    const tr=el('tr');
    tr.innerHTML='<td class="l">'+r.k+'</td><td>'+r.n+'</td><td>'+comp(r.b)+'</td><td>'+comp(r.s)+'</td>'
      +'<td class="'+(r.mg>=0?'pos':'neg')+'">'+comp(r.mg)+'</td><td class="'+(r.mg>=0?'pos':'neg')+'">'+pct(r.mg,r.b)+'</td>';
    tb.append(tr);
  });
  t.append(tb);
}

const COLS=[
  {k:'id',t:'Сделка',l:true,r:d=>'<a href="'+dealUrl(d.id)+'" target="_blank">'+d.id+'</a>'},
  {k:'title',t:'Название',l:true,r:d=>'<span title="'+(d.title||'').replace(/"/g,'&quot;')+'">'+(d.title||'').slice(0,42)+'</span>'},
  {k:'mgr',t:'Ответственный',l:true,r:d=>d.mgr||'-'},
  {k:'stage',t:'Стадия',l:true,r:d=>d.stage||'-'},
  {k:'budget',t:'Выручка',r:d=>rub(d.budget)},
  ...['Расчёт','Калькулятор','Закупка','Производство GG'].map(key=>({k:'ss_'+key,t:key,ss:key,r:d=>{const v=d.ss[key]||0;return v?rub(v):'<span class="muted">-</span>';}})),
  {k:'ssTotal',t:'Σ с/с',r:d=>rub(d.ssTotal)},
  {k:'margin',t:'Маржа',r:d=>'<span class="'+(d.margin>=0?'pos':'neg')+'">'+rub(d.margin)+'</span>'},
  {k:'mpct',t:'%',r:d=>'<span class="'+(d.margin>=0?'pos':'neg')+'">'+pct(d.margin,d.budget)+'</span>'},
  {k:'created',t:'Создана',l:true,r:d=>d.created||'-'},
  {k:'closed',t:'Закрыта',l:true,r:d=>d.closed||'-'},
];
function sortVal(d,k){if(k==='mpct')return pct(d.margin,d.budget);if(k&&k.indexOf('ss_')===0)return d.ss[k.slice(3)]||0;return d[k];}

function deals(rows){
  const r=[...rows].sort((a,b)=>{const x=sortVal(a,S.sortKey),y=sortVal(b,S.sortKey);if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*S.sortDir;});
  const t=$('#deals');
  const hd=COLS.map(c=>'<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'">'+c.t+(S.sortKey===c.k?(S.sortDir<0?' ▾':' ▴'):'')+'</th>').join('');
  t.innerHTML='<thead><tr>'+hd+'</tr></thead>';
  const tb=el('tbody');
  const frag=document.createDocumentFragment();
  r.slice(0,1000).forEach(d=>{
    const tr=el('tr');
    tr.innerHTML=COLS.map(c=>'<td class="'+(c.l?'l':'')+'">'+c.r(d)+'</td>').join('');
    frag.append(tr);
  });
  tb.append(frag);t.append(tb);
  t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=(k==='title'||k==='mgr'||k==='stage'||k==='created'||k==='closed')?1:-1;}render();});
  $('#rowinfo').textContent='Показано '+Math.min(1000,r.length)+' из '+r.length+' сделок'+(r.length>1000?' (первая 1000 по сортировке)':'');
}

function render(){
  const rows=filtered();
  kpis(rows);spbars(rows);mgrtbl(rows);deals(rows);
}

// ---- пресеты диапазона ----
function isoAdd(days){const t=new Date();t.setDate(t.getDate()+days);return t.toISOString().slice(0,10);}
const today=()=>new Date().toISOString().slice(0,10);
const PRESETS=[['Сегодня',0],['7 дней',-6],['30 дней',-29],['90 дней',-89],['Всё',null]];
function setPreset(days){
  if(days==null){S.d1='';S.d2='';}
  else{S.d2=today();S.d1=days===0?today():isoAdd(days);}
  $('#d1').value=S.d1;$('#d2').value=S.d2;markPresets();render();
}
function markPresets(){document.querySelectorAll('#presets .chip').forEach(c=>{const d=c.dataset.d;const on=(d===''&&!S.d1&&!S.d2)||(d!==''&&((d==='0'&&S.d1===today()&&S.d2===today())||(S.d1===isoAdd(+d)&&S.d2===today()&&d!=='0')));c.classList.toggle('on',!!on);});}

function init(){
  $('#sub').textContent=(DATA.funnelName||'')+(DATA.deals.length?' · '+DATA.deals.length+' сделок в базе':'');
  if(DATA.generatedAt){const dt=new Date(DATA.generatedAt);$('#stamp').innerHTML='данные Bitrix24<br>обновлено '+dt.toLocaleString('ru',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  // пресеты
  const pc=$('#presets');
  PRESETS.forEach(([nm,dd])=>{const c=el('button','chip',nm);c.dataset.d=dd==null?'':String(dd);c.onclick=()=>setPreset(dd);pc.append(c);});
  // менеджеры
  const mg=[...new Set(DATA.deals.map(d=>d.mgr).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
  const sel=$('#mgr');mg.forEach(m=>{const o=el('option');o.value=m;o.textContent=m;sel.append(o);});
  sel.onchange=()=>{S.mgr=sel.value;render();};
  // даты
  $('#d1').onchange=e=>{S.d1=e.target.value;markPresets();render();};
  $('#d2').onchange=e=>{S.d2=e.target.value;markPresets();render();};
  // basis
  document.querySelectorAll('#basis button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#basis button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.basis=b.dataset.b;render();});
  setPreset(null); // старт: всё
  autoReload();
}

// авто-перезагрузка при устаревшем кэше (сверка v.txt с bakedAt), как у остальных дашбордов
function autoReload(){
  if(!DATA.bakedAt||location.search.indexOf('cb=')>=0)return;
  fetch('v.txt?ts='+Date.now()).then(r=>r.ok?r.text():'').then(t=>{t=(t||'').trim();if(t&&t!==DATA.bakedAt)location.replace(location.pathname+'?cb='+Date.now());}).catch(()=>{});
}

init();
</script>
</body>
</html>
