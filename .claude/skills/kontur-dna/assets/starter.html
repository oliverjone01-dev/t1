<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Название дашборда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/kit.css">
<link rel="stylesheet" href="ds/kx.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.54.1/apexcharts.min.js"></script>
<script src="ds/brand.js"></script>
<script src="ds/icons.js"></script>
<script src="ds/kit.js"></script>
<script src="ds/charts.js"></script>
<script src="ds/kx.js"></script>
</head>
<body>
<!-- Стартовый дашборд в ДНК Контур DS 1.4. Замените данные в DATA и тексты разделов.
     Анатомия каждого раздела: номер → заголовок → вывод → метка «данные/гипотеза» → визуал → действие. -->
<div class="ks-app kx">
  <div id="bd" class="ks-backdrop" hidden></div>
  <aside id="sb" class="ks-sidebar" aria-label="Разделы">
    <div class="ks-brand">
      <div class="ks-brand-mark"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 15l4-5 3 3 4-6 3 4"/></svg></div>
      <div class="ks-lbl"><div class="ks-brand-name">Проект</div><div class="ks-brand-sub">подпись проекта</div></div>
    </div>
    <nav id="nav" class="ks-nav"></nav>
    <div class="ks-sidebar-foot ks-lbl">Источник данных и дата выгрузки. Что данные, что гипотеза.</div>
  </aside>
  <div class="ks-main">
    <header class="ks-topbar">
      <button type="button" class="ks-btn ks-btn--ghost ks-btn--icon" id="menu" aria-label="Меню"></button>
      <div class="ks-topbar-tools"><div class="seg" id="s-scope" role="group" aria-label="Срез"><span class="pill" aria-hidden="true"></span><button data-v="all" aria-pressed="true">все</button><button data-v="a" aria-pressed="false">срез A</button><button data-v="b" aria-pressed="false">срез B</button></div></div>
      <div class="ks-topbar-spacer"></div>
      <button class="b sec sm kx-search" id="cmdk-open"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3a6 6 0 1 0 0 12A6 6 0 0 0 9 3zM17 17l-3.7-3.7"/></svg><span class="lb">Поиск</span> <span class="kbd">⌘</span><span class="kbd">K</span></button>
      <button type="button" class="b gh sm ic" id="theme" aria-label="Сменить тему"></button>
    </header>
    <main class="hx" id="view">
      <section class="hs" id="p-sum" aria-label="Обстановка"></section>
      <section class="hs" id="p-dyn" aria-label="Динамика"></section>
      <section class="hs" id="p-list" aria-label="Список"></section>
    </main>
  </div>
</div>

<script>
(function(){
const { esc, nf, pct, reduce, tick, N, seg, ring, spark, statusOf } = KS.kx, $ = id => document.getElementById(id);

/* ============ ДАННЫЕ ПРИМЕРА: замените своими ============ */
const DATA = {
  period:'неделя 14.09', source:'источник, 1 000 записей',
  weeks:['27.07', '03.08', '10.08', '17.08', '24.08', '31.08', '07.09', '14.09'],
  scopes:{ a:{ series:{ m1:[40, 45, 38, 50, 52, 58, 61, 66], m2:[22, 25, 30, 28, 18, 12, 9, 6], m3:[80, 82, 79, 84, 85, 83, 86, 87], m4:[12, 11, 13, 12, 10, 9, 9, 8] }, parts:[20, 160, 30, 40, 5], n:255 },
           b:{ series:{ m1:[35, 42, 40, 44, 50, 55, 60, 70], m2:[28, 30, 26, 32, 20, 10, 8, 4], m3:[78, 80, 83, 81, 82, 84, 85, 86], m4:[11, 12, 12, 11, 9, 10, 8, 9] }, parts:[10, 120, 20, 25, 3], n:178 } },
  rows:[ { s:'a', w:'14.09', what:'Клиент спросил цену и замолчал', why:'ждёт ответа', id:'id-001' }, { s:'b', w:'14.09', what:'Прислал размеры, расчёта нет', why:'нет следующего шага', id:'id-002' }, { s:'a', w:'07.09', what:'Оставил телефон, звонка не было', why:'ждёт ответа', id:'id-003' } ]
};
/* показатели: ключ, название, норма, больше = лучше, подпись */
const METRICS = [['m1', 'Скорость', 70, true, 'ответ за 15 минут'], ['m2', 'Дожим', 30, true, 'вернулись к молчащему'], ['m3', 'Цена', 85, true, 'назвали на запрос'], ['m4', 'Телефон', 20, true, 'клиент дал номер']];
const PARTS = [['без вопроса', 'var(--neutral-bar)'], ['пропали после ответа', 'var(--crit)'], ['без следующего шага', 'var(--warn)'], ['ушли в звонок', 'var(--cat-3)'], ['сделка', 'var(--ok)']];

/* ============ общие детали: одинаковы для любого дашборда ============ */
let SCOPE = 'all';
const scopes = () => SCOPE === 'all' ? Object.keys(DATA.scopes) : [SCOPE];
const val = (k, i) => { const s = scopes(); return Math.round(s.reduce((a, c) => a + DATA.scopes[c].series[k][i], 0) / s.length * 10) / 10; };
const half = k => { const a = [0, 1, 2, 3].map(i => val(k, i)), b = [4, 5, 6, 7].map(i => val(k, i)), m = x => Math.round(x.reduce((p, q) => p + q, 0) / x.length * 10) / 10; return [m(a), m(b)]; };
const delta = (h, up) => { const d = Math.round((h[1] - h[0]) * 10) / 10, good = up ? d >= 0 : d <= 0; return '<span class="dl ' + (Math.abs(d) < 2 ? '' : good ? 'good' : 'bad') + '">' + (d > 0 ? '+' : d < 0 ? '−' : '') + nf(Math.abs(d)) + '</span>'; };
const TAG = { d:'<span class="bdg"><i class="dot ok"></i>данные</span>', g:'<span class="bdg" data-tip="<b>Гипотеза</b><br>Оценка или разметка, не прямой счёт."><i class="dot warn"></i>гипотеза</span>' };
const SH = (idx, title, say, tag) => '<header class="sh rise"><div><span class="idx">' + idx + '</span><h2>' + title + '</h2><p class="say">' + say + '</p></div>' + TAG[tag] + '</header>';
const W = DATA.weeks.length - 1;

/* ============ 01 · обстановка: вывод, большое число, 3 решения, показатели против нормы ============ */
function sSum(){
  const parts = PARTS.map((p, i) => [scopes().reduce((a, c) => a + DATA.scopes[c].parts[i], 0), p[1], p[0]]), total = parts.reduce((a, p) => a + p[0], 0);
  const stats = METRICS.map(([k, t, norm, up, sub], i) => { const v = val(k, W), st = statusOf(v, norm, up), h = half(k);
    return '<div class="stat spot click lift rise" style="--i:' + (i + 3) + '" data-drill="' + k + '" tabindex="0"><div class="k"><span>' + t + '</span><span class="st ' + st + '"><i class="dot ' + st + '"></i>' + ({ ok:'норма', warn:'близко', crit:'проблема', na:'нет' })[st] + '</span></div>'
      + '<div style="display:flex;align-items:center;gap:12px">' + ring(v, norm, st) + '<div><div class="v">' + N(v, 's' + k, '%') + '</div><div class="s muted">' + sub + '<br>норма ' + norm + '%</div></div></div>'
      + '<div class="s">' + nf(h[0]) + '% → ' + nf(h[1]) + '% за 8 недель ' + delta(h, up) + '</div></div>'; }).join('');
  $('p-sum').innerHTML = SH('01', 'Обстановка', 'Что происходит и что сделать на этой неделе.', 'd')
    + '<div class="grid12"><article class="card c8 hero rise" style="--i:1"><div class="meta"><span class="st crit"><i class="dot crit"></i>требует решения</span><span>' + DATA.period + '</span><span>' + esc(DATA.source) + '</span></div>'
    + '<h1>Главный вывод одной фразой. <em>Вторая фраза называет проблему.</em></h1>'
    + '<p class="lede">Две строки объяснения с цифрами: что выросло, что упало, почему это важно.</p>'
    + '<div class="hero-row"><div class="hero-n"><span class="big">' + N(parts[4][0], 'h1') + '</span><span class="of">из ' + N(total, 'h0') + '</span></div><div class="hero-cap">подпись к большому числу: что именно посчитано и за какой период.</div></div>'
    + '<div class="ratio" role="img" aria-label="Доли">' + parts.map((x, i) => '<i style="--i:' + i + ';flex:' + Math.max(x[0], .5) + ';background:' + x[1] + '"></i>').join('') + '</div>'
    + '<div class="ratio-leg">' + parts.map(x => '<span><i style="background:' + x[1] + '"></i>' + x[2] + ' ' + N(x[0], 'p' + x[2]) + '</span>').join('') + '</div></article>'
    + '<aside class="card c4 rise fill" style="--i:2"><div class="hd"><span class="cap">3 решения на неделю</span><span class="m">клавиши 1 2 3</span></div><div class="acts grow">'
    + [['Первое решение', 'почему и сколько даст', 'm2'], ['Второе решение', 'почему и сколько даст', 'm4'], ['Третье решение', 'почему и сколько даст', 'm1']].map((a, i) => '<div class="act"><span class="kbd">' + (i + 1) + '</span><div><b>' + a[0] + '</b><span>' + a[1] + '</span></div><button class="b gh sm" data-drill="' + a[2] + '">открыть</button></div>').join('') + '</div>'
    + '<button class="b pri" style="justify-content:center;margin-top:16px" data-copy="Вывод недели одной фразой.">Скопировать вывод для чата</button></aside>'
    + '<div style="grid-column:1/-1"><div class="stats">' + stats + '</div></div></div>';
}

/* ============ 02 · динамика: график с зоной нормы и наведением, выводы, мини-графики ============ */
function sDyn(){
  const a = DATA.weeks.map((_, i) => val('m2', i)), b = DATA.weeks.map((_, i) => val('m1', i)), Wd = 760, H = 300, L = 36, R = 16, T = 20, B = 30, n = a.length;
  const x = i => L + i * (Wd - L - R) / (n - 1), y = v => T + (1 - v / 100) * (H - T - B), path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  let g = [0, 50, 100].map(t => '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--grid)"/><text x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--text-muted)">' + t + '%</text>').join('');
  g += '<rect x="' + L + '" y="' + y(100) + '" width="' + (Wd - L - R) + '" height="' + (y(30) - y(100)) + '" fill="var(--ok-soft)" opacity=".5"/><text x="' + (Wd - R - 6) + '" y="' + (y(100) + 16) + '" text-anchor="end" font-size="11" fill="var(--ok)">зона нормы: от 30%</text>';
  g += '<path class="draw" pathLength="1" d="' + path(b) + '" fill="none" stroke="var(--cat-3)" stroke-width="2"/><path class="draw" pathLength="1" d="' + path(a) + '" fill="none" stroke="var(--crit)" stroke-width="3" stroke-linecap="round"/>';
  const cw = (Wd - L - R) / (n - 1);
  DATA.weeks.forEach((w, i) => { g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + w + '</text><g class="hc" data-tip="<b>' + w + '</b><br>дожим ' + nf(a[i]) + '% · скорость ' + nf(b[i]) + '%"><rect x="' + (x(i) - cw / 2) + '" y="' + T + '" width="' + cw + '" height="' + (H - T - B) + '" fill="transparent"/><line class="gl" x1="' + x(i) + '" x2="' + x(i) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--border-strong)"/><circle cx="' + x(i) + '" cy="' + y(a[i]) + '" r="4" fill="var(--crit)"/><circle cx="' + x(i) + '" cy="' + y(b[i]) + '" r="4" fill="var(--cat-3)"/></g>'; });
  const h1 = half('m2'), h2 = half('m1');
  const minis = METRICS.map(([k, t, , up]) => { const v2 = DATA.weeks.map((_, i) => val(k, i)); return '<div class="mini" data-drill="' + k + '" tabindex="0"><div class="k"><span>' + t + '</span><span>8 нед.</span></div><div class="v">' + N(v2[W], 'mn' + k, '%') + delta(half(k), up) + '</div>' + spark(v2, 'var(--text-strong)', 220, 34, true) + '</div>'; }).join('');
  $('p-dyn').innerHTML = SH('02', 'Динамика', '<b>Вывод жирным.</b> Пояснение обычным весом: что видно на графике и что из этого следует.', 'd')
    + '<div class="grid12"><figure class="card c8 rise" style="--i:1;margin:0"><div class="hd"><span class="cap">Два показателя по неделям</span><span class="m">наведите на неделю</span></div><div class="scx"><svg viewBox="0 0 ' + Wd + ' ' + H + '" style="width:100%;height:auto;overflow:visible;display:block" role="img" aria-label="График по неделям">' + g + '</svg></div>'
    + '<div class="leg"><span><i style="background:var(--crit)"></i>главный показатель</span><span><i style="background:var(--cat-3)"></i>второй показатель</span></div></figure>'
    + '<aside class="card c4 rise stack" style="--i:2;gap:20px"><div class="note"><b>' + N(h1[0], 'n1', '%') + ' → ' + N(h1[1], 'n2', '%') + '</b><span>что изменилось, первые 4 недели против последних 4</span></div><div class="note"><b>' + N(h2[0], 'n3', '%') + ' → ' + N(h2[1], 'n4', '%') + '</b><span>второй показатель за то же время</span></div></aside>'
    + '<div style="grid-column:1/-1"><div class="minis four">' + minis + '</div></div></div>';
}

/* ============ 03 · список: фильтр-переключатель, таблица с липкой шапкой, ID с копированием ============ */
let F = 'all';
function sList(){
  const rows = DATA.rows.filter(r => (SCOPE === 'all' || r.s === SCOPE) && (F === 'all' || r.why === F)), whys = [...new Set(DATA.rows.map(r => r.why))];
  $('p-list').innerHTML = SH('03', 'Список на сегодня', '<b>' + rows.length + ' записей требуют действия.</b> ID для поиска в системе.', 'd')
    + '<div class="card rise" style="--i:1;padding:0"><div class="hd" style="padding:16px 20px 0"><div class="seg" id="p-f"><span class="pill"></span><button data-v="all" aria-pressed="' + (F === 'all') + '">все</button>' + whys.map(w => '<button data-v="' + esc(w) + '" aria-pressed="' + (F === w) + '">' + esc(w) + '</button>').join('') + '</div></div>'
    + '<div style="overflow:auto;max-height:440px;margin-top:12px"><table class="tbl"><thead><tr><th>Срез</th><th>Неделя</th><th>Почему</th><th>Что было</th><th>ID</th></tr></thead><tbody>'
    + (rows.length ? rows.map(r => '<tr><td>' + r.s.toUpperCase() + '</td><td class="num">' + r.w + '</td><td><span class="st crit"><i class="dot crit"></i>' + esc(r.why) + '</span></td><td class="s">' + esc(r.what) + '</td><td><span class="idc">' + esc(r.id) + '<button data-copy="' + esc(r.id) + '" aria-label="Скопировать ID">⧉</button></span></td></tr>').join('')
      : '<tr><td colspan="5"><div class="empty"><b>Список пуст</b><span>Действий не требуется.</span></div></td></tr>') + '</tbody></table></div></div>';
  seg($('p-f'), v => { F = v; sList(); });
}

/* ============ панель деталей, меню, палитра, клавиши, тема ============ */
KS.kx.onDrill = (k, from) => { const m = METRICS.find(x => x[0] === k) || METRICS[0], v = DATA.weeks.map((_, i) => val(m[0], i));
  KS.kx.drawer.open('<div class="cap">Показатель</div><h3>' + m[1] + '</h3><p class="sub">Что это и как считается. Норма ' + m[2] + '%.</p><div class="card" style="margin:0 0 16px">' + spark(v, 'var(--text-strong)', 440, 110, true) + '</div><div class="cap" style="margin-bottom:8px">Что делать</div><div class="alert ok"><div>Конкретное действие на неделю.</div></div>', from); };
const SECS = [['p-sum', 'Обстановка'], ['p-dyn', 'Динамика'], ['p-list', 'Список на сегодня']];
$('nav').innerHTML = KS.nav([{ t:'Дашборд', i:'chart', ch:SECS.map(s => ({ id:s[0], t:s[1] })) }, { id:'about', t:'Откуда цифры', i:'info' }], 'p-sum');
KS.shell.init({ sidebar:'#sb', backdrop:'#bd', menu:'#menu' });
const go = id => { const el = $(id); if(!el) return KS.kx.toast('Раздел в разработке'); el.scrollIntoView({ behavior:reduce ? 'auto' : 'smooth' }); KS.shell.close && KS.shell.close(); };
KS.navWire($('nav'), go);
const spy = new IntersectionObserver(es => es.forEach(e => { if(!e.isIntersecting) return; $('nav').querySelectorAll('[data-view]').forEach(b => { const on = b.dataset.view === e.target.id; b.classList.toggle('is-active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); }); }), { rootMargin:'-30% 0px -60% 0px' });
document.querySelectorAll('.hs').forEach(s => spy.observe(s));
function render(){ sSum(); sDyn(); sList(); tick($('view')); }
seg($('s-scope'), v => { SCOPE = v; render(); });
KS.kx.cmdk.set([...SECS.map(s => ['Разделы', s[1], () => go(s[0])]), ['Действия', 'Сменить тему', () => KS.kx.themeToggle($('theme')), 'T']]);
$('cmdk-open').onclick = () => KS.kx.cmdk.open();
KS.theme.init(); let stored = null; try{ stored = localStorage.getItem('ks-theme'); }catch(e){} if(!stored) KS.theme.set('dark', { persist:false });
$('theme').innerHTML = KS.theme.icon(); $('theme').onclick = () => KS.kx.themeToggle($('theme'));
window.addEventListener('keydown', e => { if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if(['1', '2', '3'].includes(e.key)) KS.kx.onDrill(['m2', 'm4', 'm1'][+e.key - 1]); else if(e.key.toLowerCase() === 't' || e.key.toLowerCase() === 'е') KS.kx.themeToggle($('theme')); });
render();
})();
</script>
</body>
</html>
