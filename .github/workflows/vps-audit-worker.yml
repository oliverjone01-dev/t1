name: VPS private audit worker
run-name: audit-job-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: One-shot daily preview; VPS delivery must be disabled
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyse:
    if: ${{ startsWith(inputs.job_id, 'daily-preview-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: infra/vps/audit/vps-audit-worker.py
          sparse-checkout-cone-mode: false
      - name: Claim private preview and return one OpenAI result to VPS
        env:
          AUDIT_JOB_ID: ${{ inputs.job_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 infra/vps/audit/vps-audit-worker.py
      # No artifact upload: the review contains private communication evidence.
