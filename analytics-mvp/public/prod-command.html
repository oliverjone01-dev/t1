<style>

body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:clip}

.topbar{padding:11px 24px;border-bottom:1px solid #161C24;background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22D3EE,#0E7490);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}

.brand #fresh{display:block;font-size:10px;font-weight:700;letter-spacing:.02em;margin-top:2px}
.controls{padding:10px 24px;border-bottom:1px solid #161C24;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px);font-size:12px;color:var(--ink3)}
.seg{display:inline-flex;background:#1A2029;border:1px solid #1F2731;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink3);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:rgba(34,211,238,.10);color:#22D3EE}
.ctl-lbl{font-size:10px;color:var(--ink4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
.rev-toggle{display:flex;align-items:center;gap:7px}
.tb-spacer{flex:1}
.dinp{background:#1A2029;border:1px solid #1F2731;color:var(--ink2);border-radius:7px;padding:5px 8px;font:inherit;font-size:11.5px;color-scheme:dark}
.dbtn{background:rgba(34,211,238,.10);border:1px solid #1F2731;color:#22D3EE;border-radius:7px;padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer}
.qm{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--border);color:var(--ink3);font-size:9px;font-weight:700;line-height:12px;text-align:center;margin-left:5px;cursor:help;font-style:normal;vertical-align:middle}
#tip{position:fixed;z-index:200;pointer-events:none;background:rgba(7,9,13,.96);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;font-size:11.5px;color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;max-width:300px}
#tip b{font-family:'Manrope',sans-serif}#tip .tl{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}

#tip .qh{font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 2px}
#tip .qh:first-child{margin-top:0}
#tip .qw{color:#22D3EE}#tip .qq{color:#F59E0B}#tip .qc{color:#10B981}
#tip .qb{white-space:normal;line-height:1.45}
#tip .tr{display:flex;justify-content:space-between;gap:16px;padding:1px 0}#tip .tr span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}#tip .tn{margin-top:5px;padding-top:5px;border-top:1px solid var(--border);color:var(--ink3);font-size:10.5px;line-height:1.4;white-space:normal}
.foot{text-align:center;color:var(--ink4);font-size:11px;margin-top:28px}
.tag{font-size:10px;background:var(--elev);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--ink3)}
.wrap{padding:20px 24px 60px;max-width:1720px;margin:0 auto}
.sec{display:flex;align-items:center;gap:14px;margin:28px 0 14px}
.sec .n{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.sec .hint{font-size:11px;color:var(--ink3)}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.card-t{font-size:15px;font-weight:800}
.card-s{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.kpi .bar{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);margin-bottom:8px}
.kpi .v{font-size:25px;font-weight:800;font-family:'Manrope',sans-serif;letter-spacing:-.02em}
.kpi .u{font-size:13px;color:var(--ink3);font-weight:600}
.kpi .sub{font-size:10.5px;color:var(--ink4);margin:auto 0;padding:6px 0;text-align:center;align-self:center}
.kpi .trend{align-self:center}
.now-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);background:rgba(245,158,11,.12);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:6px;padding:2px 7px;border-radius:6px}
.up{color:#34d399;background:rgba(52,211,153,.12)}.dn{color:#fb7185;background:rgba(251,113,133,.12)}.flat{color:var(--ink4);background:var(--elev)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
/* конвейер */
.conv{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:8px 2px 4px}
.st{flex:1;min-width:104px;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px}
.st .node{width:100%;border-radius:11px;padding:12px 8px;text-align:center;border:1px solid var(--border2);background:var(--elev);position:relative}
.st .cnt{font-size:24px;font-weight:800;font-family:'Manrope',sans-serif;line-height:1}
.st .nm{font-size:11px;font-weight:700;color:var(--ink2);margin-top:5px;line-height:1.15;min-height:26px;display:flex;align-items:center;justify-content:center}
.st .dw{font-size:10px;font-weight:700;margin-top:5px}
.st .thru{font-size:9.5px;color:var(--ink4);margin-top:2px}
.st .arrow{position:absolute;right:-7px;top:34px;color:var(--ink4);font-size:16px;z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;padding:7px 9px;color:var(--ink3);font-weight:600;font-size:11px;border-bottom:1px solid var(--border2);white-space:nowrap;cursor:default}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl td.nm{color:var(--ink);font-weight:600;white-space:nowrap}
.tbl td.nm .idle-b{display:inline-block;white-space:nowrap;font-size:9px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.5);color:var(--amber);border-radius:5px;padding:1px 5px;font-weight:700;margin-left:5px;vertical-align:1px}
.hbar{height:8px;border-radius:4px;background:var(--elev);overflow:hidden;min-width:40px}
.hbar>i{display:block;height:100%;border-radius:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;color:var(--ink4);background:var(--soft);border:1px dashed var(--border2);border-radius:8px;padding:8px 11px;margin-top:10px}
/* проходимость участков: центрированная воронка */
.fun-row{display:grid;grid-template-columns:110px 1fr 150px;gap:12px;align-items:center;margin:7px 0}
.fun-dial{display:flex;align-items:center;gap:8px;cursor:help}
.fun-dial b{font-size:11.5px;font-variant-numeric:tabular-nums}
.fun-nm{font-size:12px;font-weight:700;color:var(--ink2);text-align:right}
.fun-tr{position:relative;height:27px;background:repeating-linear-gradient(90deg,transparent,transparent 6px,rgba(255,255,255,.015) 6px,rgba(255,255,255,.015) 12px)}
.fun-bar{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;white-space:nowrap;cursor:help;min-width:0;transition:width .35s var(--ease)}
.fun-st{font-size:11px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
/* оценка участков: мощность/загрузка/разгрузка */
.stx-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin:8px 0;cursor:help}
.stx-nm{font-size:12px;font-weight:700;color:var(--ink2);text-align:right}
.stx-tr{height:27px;display:flex;align-items:center;gap:9px}
.stx-cap{position:relative;height:100%;background:var(--elev);border:1px solid var(--border2);border-radius:7px;overflow:hidden;min-width:70px}
.stx-cap>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px}
.stx-pill{flex:none;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stx-cap>span{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
.stx-st{font-size:11px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:1100px){.stx-row{grid-template-columns:90px 1fr 200px}}

.cal-row{display:grid;grid-template-columns:148px 1fr 46px 52px 64px;gap:8px;align-items:center;margin:4px 0}
.cal-nm{font-size:11.5px;font-weight:700;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cells{display:flex;gap:2px}
.cal-c{flex:1;height:22px;border-radius:4px;background:var(--elev);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#06121a;min-width:6px;cursor:help}
.cal-sum{font-size:11.5px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.cal-norm{font-size:11px;color:var(--ink4);text-align:right;font-variant-numeric:tabular-nums}
.cal-pct{font-size:10.5px;font-weight:800;text-align:center;border-radius:6px;padding:2px 0}
.cal-head{font-size:9px;color:var(--ink4);text-align:center;overflow:hidden;white-space:nowrap}
/* профиль конструкторов по чекам */
.pr-row{display:grid;grid-template-columns:150px 1fr 1fr 1fr 200px;gap:10px;align-items:center;margin:7px 0}
.pr-nm{font-size:12px;font-weight:700;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink4)}
.pr-cell{position:relative;height:30px;background:var(--elev);border-radius:7px;overflow:hidden;cursor:help}
.pr-cell>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px}
.pr-cell>span{position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--ink2);white-space:nowrap}
.pr-tot{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:1100px){.pr-row{grid-template-columns:110px 1fr 1fr 1fr 150px}}
a{color:var(--cyan)}
.nav{display:flex;gap:3px;background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:3px}

    const tot={dep:'Итого',tD:sum(deps,a=>a.tD),tM:sum(deps,a=>a.tM),tPos:sum(deps,a=>a.tPos),tPcs:sum(deps,a=>a.tPcs),inN:sum(deps,a=>a.inN),inM:sum(deps,a=>a.inM),qN:sum(deps,a=>a.qN),qM:sum(deps,a=>a.qM)};
    // Итого - первой строкой: на него смотрят чаще, чем на разбивку
    const foot=`<tr style="border-bottom:2px solid var(--border2);background:rgba(34,211,238,.05)"><td class="nm" style="font-weight:800">Итого</td><td style="text-align:center;font-weight:800;${hg(1,1,T)}">${fmt(tot.tD)}</td><td style="text-align:center;font-weight:800;white-space:nowrap;${hg(1,1,T)}">${fmtK(tot.tM)} ₽</td><td style="text-align:center;font-weight:800;${hg(1,1,B)}">${fmt(tot.tPos)}</td><td style="text-align:center;font-weight:800;${hg(1,1,V)}">${fmt(tot.tPcs)}</td>${cell(tot.inN,tot.inM,'var(--amber)',tot.inM||1,AMB)}${cell(tot.qN,tot.qM,'#A78BFA',tot.qM||1,PU)}</tr>`;
    return `<div class="card"><div class="card-h"><div><div class="card-t">Отделы продаж: передачи и потенциал <span class="qm" data-tip="Клик по отделу раскрывает менеджеров, по менеджеру - его сделки в просчёте, Итого - первой строкой. Точка совещания ОП и цеха. «Передано» = за выбранный период (когорта воронки). «Пакет» = сделки, получившие предоплату, но ещё НЕ запущенные в производство: открытые на стадии «Предоплата получена» (следующий шаг - «Заказ в производстве»). Это будущая нагрузка цеха на подходе. «Потенциал» = открытые сделки в просчёте сейчас. Бейдж «не передаёт» = потенциал/пакет есть, а передач в периоде нет. Сортировка кликом по заголовку колонки. Вопрос: кто кормит цех и у кого потенциал лежит без движения? Вывод: большой потенциал при нуле передач - разбирать пайплайн менеджера поимённо, клик раскрывает его сделки.">?</span></div><div class="card-s">что отдел продаж передал и держит в расчётах</div></div></div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr>${dth('nm','Отдел / менеджер',true)}${dth('tD','Передано сделок')}${dth('tM','₽ передано')}${dth('tPos','Изделий')}${dth('tPcs','Штук')}${dth('inM','Пакет · сейчас')}${dth('qM','Потенциал · сейчас')}</tr></thead><tbody>${foot}${body}</tbody></table></div></div>`;
  })();

  // ===== МЕНЕДЖЕРЫ: ПЕРЕДАЧИ И ПОТЕНЦИАЛ (как в дашборде РОПа) =====
  const syncMgrCard=(()=>{
    const uniq=uniqByDeal(IT.filter(i=>inRange(startDate(i))));
    const M={};uniq.forEach(i=>{const n=mgrOf(i);(M[n]=M[n]||{n,c:0,m:0,q:0,qm:0});M[n].c++;M[n].m+=i.dealBudget||0});
    const QT=(DATA.quotes&&DATA.quotes.deals)||[];
    QT.forEach(d=>{const n=d.mgr||'—';(M[n]=M[n]||{n,c:0,m:0,q:0,qm:0});M[n].q++;M[n].qm+=d.budget||0});
    const rows=Object.values(M);
    sortRows(rows,S.smSort,{n:r=>r.n,c:r=>r.c,m:r=>r.m,q:r=>r.q,qm:r=>r.qm});
    const totC=sum(rows,r=>r.c),totM=sum(rows,r=>r.m),totQ=sum(rows,r=>r.q),totQM=sum(rows,r=>r.qm);
    const mxC=Math.max(1,...rows.map(r=>r.c)),mxM=Math.max(1,...rows.map(r=>r.m)),mxQ=Math.max(1,...rows.map(r=>r.q)),mxQM=Math.max(1,...rows.map(r=>r.qm));
    const bg=(v,mx,col)=>{if(!v)return '';const w=Math.max(v/mx*100,3).toFixed(1);return `background:linear-gradient(90deg,${col} ${w}%,transparent ${w}%);`};
    const T='rgba(45,212,191,.14)',Q='rgba(34,211,238,.12)';
    const body=rows.slice(0,14).map(r=>`<tr><td class="nm">${esc(r.n)}</td>
      <td style="${bg(r.c,mxC,T)}">${r.c||'·'}</td><td style="${bg(r.c,mxC,T)}">${totC?pct(r.c/totC):'·'}</td>
      <td style="${bg(r.m,mxM,T)}"><b>${r.m?fmtK(r.m):'·'}</b></td><td style="color:var(--ink3);${bg(r.m,mxM,T)}">${totM&&r.m?pct(r.m/totM):'·'}</td>
      <td style="color:var(--cyan);${bg(r.q,mxQ,Q)}">${r.q||'·'}</td><td style="color:var(--cyan);${bg(r.qm,mxQM,Q)}">${r.qm?fmtK(r.qm):'·'}</td></tr>`).join('');
    const foot=`<tr style="border-top:2px solid var(--border2)"><td class="nm" style="font-weight:800">Отдел</td>
      <td style="font-weight:800;${bg(1,1,T)}">${fmt(totC)}</td><td style="${bg(1,1,T)}">100%</td>
      <td style="font-weight:800;${bg(1,1,T)}">${fmtK(totM)}</td><td style="${bg(1,1,T)}">100%</td>
      <td style="font-weight:800;color:var(--cyan);${bg(1,1,Q)}">${fmt(totQ)}</td><td style="font-weight:800;color:var(--cyan);${bg(1,1,Q)}">${fmtK(totQM)}</td></tr>`;
    return `<div class="card"><div class="card-h"><div><div class="card-t">Менеджеры: передачи и потенциал</div><div class="card-s">передачи за период · «в расчётах» = снимок сейчас, будущий поток в цех</div></div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr>${thRow('sm',S.smSort,[['n','Менеджер'],['c','Передано'],[null,'Доля шт'],['m','₽'],[null,'Доля ₽'],['q','В расчётах'],['qm','Потенциал ₽']])}</tr></thead><tbody>${body}${foot}</tbody></table></div></div>`;
  })();

  // ===== ТРУБА ПРОИЗВОДСТВА (визуал РОПа): каких участков коснулись изделия когорты =====
  const prodTruba=(()=>{
    const base=cut; if(!base.length)return '<div class="card-s">нет заказов в выбранном периоде</div>';
    const doneBase=base.filter(isDone);
    // время на участке по когорте
    const stayOf=nm=>{const a=[];base.forEach(i=>{const h=i.hist||[];for(let j=0;j<h.length;j++){if(stationOf(h[j][0])!==nm)continue;const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);const d=end!=null?days(h[j][1],end):null;if(d!=null&&d>=0)a.push(d)}});return med(a)};
    const touch=nm=>base.filter(i=>(i.hist||[]).some(h=>stationOf(h[0])===nm));
    // единица тумблером: ИЗДЕЛИЯ = карточки-наряды (дефолт), ПО ШТУЧНО = штуки (изделия x количество из товарных строк)
    const PCS=S.trubaUnit==='pcs',mea=arr=>PCS?qtySum(arr):arr.length;
    const F=[{name:'Запущено',count:mea(base),pos:base.length,izd:qtySum(base),dwell:null,items:base}];
    STATIONS.filter(([nm])=>nm!=='Передано'&&nm!=='Готово').forEach(([nm])=>{const t=touch(nm);F.push({name:nm,count:mea(t),pos:t.length,izd:qtySum(t),dwell:stayOf(nm),items:t})});
    F.push({name:'Готово',count:mea(doneBase),pos:doneBase.length,izd:qtySum(doneBase),dwell:null,items:doneBase});
    const n=F.length,W=1380,H=330,bandH=190,midY=64+bandH/2,pillY=H-30,pctY=H-48;
    const colW=W/n,nodeW=colW*0.52,maxC=F[0].count||1;
    const COL=['#22D3EE','#38BDF8','#60A5FA','#818CF8','#A78BFA','#C084FC','#2DD4BF','#34D399','#10B981','#2E9E74'];
    const cx=i=>colW*i+colW/2,hOf=c=>Math.max(6,c/maxC*bandH),nodeX=i=>cx(i)-nodeW/2;
    const dwellCol=dl=>dl>=10?'#F43F5E':dl>=5?'#FB923C':'#10B981';
    let defs='',conns='',nodes='',labels='';
    for(let i=0;i<n-1;i++){const h0=hOf(F[i].count),h1=hOf(F[i+1].count),x0=nodeX(i)+nodeW,x1=nodeX(i+1);
      const t0=midY-h0/2,b0=midY+h0/2,t1=midY-h1/2,b1=midY+h1/2,gid='pc'+i;
      defs+=`<linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${COL[i%COL.length]}" stop-opacity=".4"/><stop offset="1" stop-color="${COL[(i+1)%COL.length]}" stop-opacity=".4"/></linearGradient>`;
      const bothArr=F[i+1].items.filter(x=>F[i].items.includes(x));
      const td=attr(`<div class='tl'>${F[i].name} → ${F[i+1].name}</div><div class='tr'><span>Прошли оба участка, изд.</span><span>${fmt(qtySum(bothArr))}</span></div><div class='tr'><span>Позиций</span><span>${fmt(bothArr.length)}</span></div>`);
      conns+=`<path d="M${x0} ${t0} L${x1} ${t1} L${x1} ${b1} L${x0} ${b0} Z" fill="url(#${gid})" data-tip="${td}"/>`}
    F.forEach((f,i)=>{const h=hOf(f.count),t=midY-h/2,c=COL[i%COL.length];
      const money=dealMoney(f.items);
      const doneNote=f.name==='Готово'?`<div class='tn'>${isStart?'готово ИЗ запущенных за период (когорта запуска). KPI «Выпущено штук» считает по дате выпуска, поэтому может быть больше - в него попадают заказы, запущенные ещё до периода. Совпадёт при срезе «по дате готовности».':'все выпущенные за период - совпадает с KPI «Выпущено штук»'}</div>`:'';
      const td=attr(`<div class='tl'>${f.name}</div><div class='tr'><span>Изделий (карточек)</span><span>${fmt(f.pos)}</span></div><div class='tr'><span>Штук (с количеством)</span><span>${fmt(f.izd)}</span></div><div class='tr'><span>Доля от запущенных</span><span>${pct(f.count/(F[0].count||1))}</span></div><div class='tr'><span>Деньги (уник. сделки)</span><span>${fmtK(money)} ₽</span></div><div class='tr'><span>Медиана на участке</span><span>${f.dwell!=null?d1(f.dwell)+' дн':'—'}</span></div>`+doneNote);
      nodes+=`<rect x="${nodeX(i)}" y="${t}" width="${nodeW}" height="${h}" rx="5" fill="${c}" data-tip="${td}" style="cursor:help"/>`;
      if(h>=22)nodes+=`<text x="${cx(i)}" y="${midY+5}" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="15" fill="#06121a" pointer-events="none">${fmt(f.count)}</text>`;
      else labels+=`<text x="${cx(i)}" y="${t-5}" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="12" fill="${c}">${fmt(f.count)}</text>`;
      labels+=`<text x="${cx(i)}" y="24" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink2)">${f.name}</text>`;
      labels+=`<text x="${cx(i)}" y="${pctY}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink3)">${pct0(f.count/(F[0].count||1))}</text>`;
      if(f.dwell!=null){const dc=dwellCol(f.dwell);labels+=`<rect x="${cx(i)-27}" y="${pillY}" width="54" height="16" rx="8" fill="${dc}22" stroke="${dc}" stroke-opacity=".5"/><text x="${cx(i)}" y="${pillY+11.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${dc}" pointer-events="none">${d1(f.dwell)} дн</text>`}});
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:1000px"><defs>${defs}</defs>${conns}${nodes}${labels}</svg></div><div class="card-sub" style="margin-top:6px">когорта (${modeLbl}): <b style="color:var(--ink2)">${fmt(base.length)}</b> изделий · <b style="color:var(--ink2)">${fmt(qtySum(base))}</b> штук · % = доля от запущенных · пилюля = медиана времени на участке</div>`;
  })();

  // ===== КОНВЕЙЕР: сейчас на участке + прошло за период =====
  const conv=(()=>{
    const wipBy={},passBy={},dwBy={};
    STATIONS.forEach(([nm])=>{wipBy[nm]=0;passBy[nm]=0;dwBy[nm]=[]});
    wip.forEach(i=>{const st=stationOf(i.stageCode);if(st){wipBy[st]++;const dw=dwellNow(i);if(dw!=null)dwBy[st].push(dw)}});
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{const st=stationOf(h[0]);if(st&&!seen.has(st)&&inRange(h[1])){seen.add(st);passBy[st]++}})});
    const nodes=STATIONS.map(([nm],idx)=>{
      const isFin=nm==='Готово';
      const c=isFin?passBy[nm]:wipBy[nm],mdw=med(dwBy[nm]);
      const col=isFin?'#2E9E74':(c?tone(mdw||0):'var(--ink4)');
      return `<div class="st"><div class="node" style="border-color:${c?col:'var(--border)'};background:${c?col+'22':'var(--elev)'}">
        <div class="cnt" style="color:${c?col:'var(--ink4)'}">${c}</div>
        <div class="nm">${nm}</div>
        <div class="dw" style="color:${c?col:'var(--ink4)'}">${isFin?'за период':c?(mdw!=null?d1(mdw)+' дн':''):'транзит'}</div>
        <div class="thru">${isFin?'всего готово '+fmt(done.length):'за период: '+fmt(passBy[nm])}</div>
      </div>${idx<STATIONS.length-1?'<div class="arrow">›</div>':''}</div>`}).join('');
    return `<div class="conv">${nodes}</div><div class="legend"><span><i style="background:#2E9E74"></i>до 5 дн</span><span><i style="background:#F59E0B"></i>5-10</span><span><i style="background:#FB923C"></i>10-21</span><span><i style="background:#F43F5E"></i>21+ дн (застряло)</span><span style="color:var(--ink4)">крупное число = заказы на участке СЕЙЧАС · «за период» = входы на участок в выбранных датах · 0 у транзитных участков = сейчас пусто, поток шёл (см. «за период»)</span></div>`;
  })();

  // ===== ДИНАМИКА: запуск vs выпуск (шт или ₽) =====
  const _money=S.dynUnit==='money',_deals=S.dynUnit==='deals';
  const _dfIn=_deals?uniqByDeal(all):all,_dfOut=_deals?uniqByDeal(done):done;
  const dynFlow=chartSVG([
    {name:_deals?'Передано (сделки)':'Передано в производство',c:'#22D3EE',vals:seriesBy(_dfIn,startDate,keys,_money?moneyOf:null)},
    {name:_deals?'Готово (сделки)':'Готово (выпуск)',c:'#2E9E74',vals:seriesBy(_dfOut,successDate,keys,_money?moneyOf:null)},
  ],keys,_money?{money:true}:{fmtY:v=>fmt(v)});

  // ===== ДИНАМИКА: деньги запуска =====
  const dynMoney=isStart
    ?chartSVG([{name:'Запущено в производство, ₽ (уникальные сделки)',c:'#22D3EE',vals:seriesBy(uniqByDeal(all),startDate,keys,moneyOf),type:'bar'}],keys,{money:true})
    :chartSVG([{name:'Выпущено (готово), ₽ (уникальные сделки)',c:'#2E9E74',vals:seriesBy(uniqByDeal(done),successDate,keys,moneyOf),type:'bar'}],keys,{money:true});

  // ===== ДВЕ ПЕДАЛИ ЦЕХА: вход vs мощность -> очередь или сроки =====
  const pedalsBlock=(()=>{
    if(!keys.length)return '';
    const ki={};keys.forEach((k,i)=>ki[k]=i);const mk=()=>keys.map(()=>0);
    const inP=mk(),outP=mk();
    IT.filter(dirOk).forEach(i=>{const k1=bkey(startDate(i));if(k1 in ki)inP[ki[k1]]+=qtyOf(i);
      if(isDone(i)&&successDate(i)){const k2=bkey(successDate(i));if(k2 in ki)outP[ki[k2]]+=qtyOf(i)}});
    // мощность: НЕ константа, а скользящая - средний выпуск шт/нед за 8 недель ДО начала бакета.
    // Чем больше цех реально выпускал в последнее время, тем выше риска; просел - риска съезжает.
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const w={};IT.forEach(i=>{if(!isDone(i)||!successDate(i))return;const k=wkOf(successDate(i));if(k)w[k]=(w[k]||0)+qtyOf(i)});
    const wkList=Object.keys(w).sort(),weeks=wkList.map(k=>w[k]),scale=S.gran==='d'?1/7:S.gran==='m'?30.4/7:1;
    const capAll=(weeks.length?weeks.reduce((a,b)=>a+b,0)/weeks.length:0)*scale;
    const capB=keys.map(k=>{const wkk=wkOf(k);const prev=wkList.filter(x=>x<wkk).slice(-8);
      return prev.length?prev.reduce((a,x)=>a+w[x],0)/prev.length*scale:(capAll||null)});
    const capI=i=>capB[i]!=null?capB[i]:capAll;
    const capMax=(weeks.length?Math.max(...weeks):0)*scale; // пик: лучшая неделя в истории - потолок цеха
    const cap=capAll;
    // следствия: незавершёнка (шт, конец бакета) и срок когорты запуска
    const wipP=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;let q=0;IT.filter(dirOk).forEach(i=>{const st=startDate(i);if(!st||st>t)return;const f=successDate(i);if(f&&f<=t)return;q+=qtyOf(i)});return q});
    const cycB=keys.map(k=>{const arr=IT.filter(dirOk).filter(i=>isDone(i)&&bkey(startDate(i))===k).map(cycleOf).filter(x=>x!=null&&x>=0);return arr.length?med(arr):null});
    const gl=S.gran==='d'?'день':S.gran==='m'?'мес':'нед';
    // текущая мощность = ступенька последнего наступившего бакета: подпись на графике совпадает с подсказкой
    const _nowIdx=(()=>{const nk=bkey(NOWS);let j=keys.length-1;while(j>0&&keys[j]>nk)j--;return j})();
    const _capNow=capI(_nowIdx);
    const top=chartSVG([
      {name:'Вход в цех, штук',c:'#8B7BF0',vals:inP,type:'bar',op:.45},
      {name:'Выпуск, штук',c:'#2DD4BF',vals:outP}
    ],keys,{fmtY:v=>fmt(v),
      noLegend:true, // легенда - в hover-окне бакета, с маркерами типов серий
      refSteps:{vals:capB,label:'мощность сейчас ~'+d1(_capNow)+' шт/'+gl,tipLabel:'Мощность периода, шт/'+gl,c:'#F59E0B'},
      refLine:capMax>0?{v:capMax,label:'пик мощности ~'+d1(capMax)+' шт/'+gl,tipLabel:'Пик мощности, шт/'+gl,c:'#F43F5E'}:null});
    const nowK=bkey(NOWS);
    const lastCyc=i=>{let j=i-1;while(j>=0&&cycB[j]==null)j--;return j>=0?cycB[j]:null};
    const diag=keys.map((k,i)=>{
      if(k>nowK)return {c:'#232c38',t:'период ещё не наступил'};
      if(!inP[i]&&!outP[i])return {c:'#232c38',t:'событий не было'};
      const over=capI(i)>0&&inP[i]>capI(i)*1.05;
      if(!over)return {c:'#2E9E74',t:'штатный режим: вход в пределах мощности'};
      const ratio=capI(i)>0?inP[i]/capI(i):999; // магнитуда перегруза: критический вход = сразу красный, не ждём роста срока
      if(ratio>=2.5)return {c:'#F43F5E',t:'КРИТИЧЕСКИЙ перегруз: вход в '+d1(ratio)+'x выше мощности - текущим темпом очередь не разгрести, тормозить запуски или добавлять мощность'};
      const dw=(wipP[i]!=null&&i>0&&wipP[i-1]!=null)?wipP[i]-wipP[i-1]:0;
      const pc=lastCyc(i),dc=(cycB[i]!=null&&pc!=null)?cycB[i]-pc:0;
      if(dc>1.5)return {c:'#F43F5E',t:'педаль «СРОКИ»: вход выше мощности, срок когорты растёт - двигаются обещания клиентам'};
      if(dw>0)return {c:'#F59E0B',t:'педаль «ОЧЕРЕДЬ»: вход выше мощности, темп держим - копится незавершёнка'};
      return {c:'#F59E0B',t:'вход выше мощности'};
    });
    const strip=`<div style="display:flex;gap:2px;margin:0 12px 10px 44px">`+diag.map((d,i)=>{const gap=capI(i)-inP[i];
      return `<div data-tip="${attr(`<div class='tl'>Диагноз · ${blabel(keys[i])}</div><div class='tr'><span>Вход, шт</span><span>${fmt(inP[i])}</span></div><div class='tr'><span>Мощность периода, шт/${gl}</span><span>${d1(capI(i))}</span></div><div class='tr'><span>${gap>=0?'Свободный запас':'Перегруз входа'}</span><span>${d1(Math.abs(gap))} шт</span></div><div class='tr'><span>Пик мощности, шт/${gl}</span><span>${d1(capMax)}</span></div><div class='tr'><span>Выпуск, шт</span><span>${fmt(outP[i])}</span></div><div class='tr'><span>Незавершёнка на конец, шт</span><span>${wipP[i]!=null?fmt(wipP[i]):'—'}</span></div><div class='tr'><span>Срок когорты запуска</span><span>${cycB[i]!=null?d1(cycB[i])+' дн':'ещё не готовы'}</span></div><div class='tn'>${d.t}</div>`)}" style="flex:1;height:11px;border-radius:3px;background:${d.c};cursor:help"></div>`}).join('')+`</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin:0 12px 4px 44px;font-size:10px;color:var(--ink3)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2E9E74;vertical-align:-1px;margin-right:4px"></i>штатно</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F59E0B;vertical-align:-1px;margin-right:4px"></i>очередь копится</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F43F5E;vertical-align:-1px;margin-right:4px"></i>критично: сроки едут или перегруз</span></div>`;
    // зависло: штуки без движения >14 дн на конец бакета (перенесено из убранной карточки «Незавершёнка и заторы»)
    const stuckP=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;let q=0;
      IT.filter(dirOk).forEach(i=>{const st=startDate(i);if(!st||st>t)return;const f=successDate(i);if(f&&f<=t)return;
        let last=st;(i.hist||[]).forEach(h=>{if(h[1]&&h[1]<=t&&h[1]>last)last=h[1]});if(days(last,t)>14)q+=qtyOf(i)});return q});
    const botWip=chartSVG([{name:'Незавершёнка на конец периода, штук',c:'#F59E0B',vals:wipP,area:true},{name:'из них без движения >14 дн, штук',c:'#F43F5E',vals:stuckP}],keys,{fmtY:v=>fmt(v),h:150,noLegend:true});
    const botCyc=chartSVG([{name:'Срок когорты запуска, дн (готовые)',c:'#A78BFA',vals:cycB,join:true}],keys,{fmtY:v=>d1(v),h:150,noLegend:true});
    return `<div class="card"><div class="card-h"><div><div class="card-t">Две педали цеха: очередь или сроки <span class="qm" data-tip="Столбики = вход штук в цех по неделям. Пунктиры: оранжевый = мощность (сколько цех обычно выпускает, скользящее за 8 недель), красный = пик мощности. Полоса-диагноз под графиком по цвету: ЗЕЛЁНЫЙ - штатно, вход в пределах мощности; ЖЁЛТЫЙ - очередь копится (вход выше мощности, темп держим, растёт незавершёнка); КРАСНЫЙ - критично (едут сроки клиентам ИЛИ вход в 2,5x+ выше мощности - очередь не разгрести). Наведи на сегмент - все цифры недели. Справа: незавершёнка (красная линия - зависло >14 дней) и срок доведения заказов до готовности. Вопрос: цех справляется или уже копит очередь / двигает сроки? Вывод: жёлтые подряд - усиливать мощность или тормозить запуски; красные - предупреждать клиентов о сроках.">?</span></div><div class="card-s">вход штук против мощности · полоса-диагноз под графиком</div></div></div><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center"><div>${top}${strip}</div><div><div style="font-size:12.5px;font-weight:700;color:var(--ink)">Незавершёнка и заторы</div><div class="card-s" style="margin:1px 0 4px">штук в работе на конец периода · красная = зависло без движения дольше 14 дней</div>${botWip}<div style="font-size:12.5px;font-weight:700;color:var(--ink);margin-top:10px">Срок когорты запуска</div><div class="card-s" style="margin:1px 0 4px">за сколько дней доводим до готовности заказы, запущенные в этот период</div>${botCyc}</div></div></div>`;
  })();

  // ===== ОЦЕНКА УЧАСТКОВ: загрузка сейчас × пропускная способность (из истории) × разгрузка =====
  const stationsBlock=(()=>{
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const wk={},stayAll={};STATIONS.forEach(([nm])=>{wk[nm]={};stayAll[nm]=[]});
    IT.forEach(i=>{const h=i.hist||[];const q=qtyOf(i);
      for(let j=0;j<h.length;j++){const st=stationOf(h[j][0]);if(!st)continue;
        const k=wkOf(h[j][1]);if(k)wk[st][k]=(wk[st][k]||0)+q;
        const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);
        const dur=end!=null?days(h[j][1],end):null;if(dur!=null&&dur>=0)stayAll[st].push(dur)}});
    const toneClear=c=>c==null?'#F43F5E':c>=14?'#F43F5E':c>=7?'#FB923C':c>=3?'#F59E0B':'#2E9E74';
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const weeks=Object.values(wk[nm]);
      const avgW=weeks.length?weeks.reduce((a,b)=>a+b,0)/weeks.length:0;
      const maxW=weeks.length?Math.max(...weeks):0;
      let queue=0,qPos=0;wip.forEach(i=>{if(stationOf(i.stageCode)===nm){queue+=qtyOf(i);qPos++}});
      const clear=queue?(avgW>0?queue/(avgW/7):null):0;
      return {nm,avgW,maxW,queue,qPos,stay:med(stayAll[nm]),clear,used:maxW>0};
    }); // порядок = как стадии в смарт-процессе (STATIONS), без пересортировки
    const mx=Math.max(1,...rows.map(r=>Math.max(r.avgW,r.queue)));
    const body=rows.map(r=>{
      if(!r.used)return `<div style="display:grid;grid-template-columns:110px 1fr 66px;gap:10px;align-items:center;margin:8px 0"><div style="text-align:right;font-size:11.5px;font-weight:700;color:var(--ink4)">${r.nm}</div><span style="color:var(--ink4);font-size:11px">участок не используется</span><span></span></div>`;
      const col=r.queue?toneClear(r.clear):'#3a4450';
      const over=r.avgW>0&&r.queue>r.avgW;
      const trackW=Math.max(r.avgW/mx*100,4);
      const fillPct=r.avgW>0?Math.min(r.queue/r.avgW,1)*100:(r.queue?100:0);
      const tailW=over?Math.max((r.queue-r.avgW)/mx*100,2):0;
      const td=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Очередь сейчас (заполнено)</span><span>${fmt(r.queue)} шт (${fmt(r.qPos)} изделий)</span></div><div class='tr'><span>Мощность = потенциал недели</span><span>${d1(r.avgW)} шт/нед</span></div><div class='tr'><span>Заполнение потенциала</span><span>${r.avgW>0?pct(r.queue/r.avgW):'—'}</span></div><div class='tr'><span>Мощность (пиковая)</span><span>${fmt(r.maxW)} шт/нед</span></div><div class='tr'><span>Разгрузка очереди</span><span>${r.clear!=null?'~'+d1(r.clear)+' дн':'нет данных о скорости'}</span></div><div class='tr'><span>Медиана времени на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div>`);
      return `<div data-tip="${td}" style="display:grid;grid-template-columns:110px 1fr 66px;gap:10px;align-items:center;margin:8px 0;cursor:help">
        <div style="text-align:right;font-size:11.5px;font-weight:700;color:var(--ink2)">${r.nm}</div>
        <div style="display:flex;align-items:center;gap:2px">
          <div style="position:relative;height:20px;width:${trackW.toFixed(1)}%;min-width:170px;border:1px solid rgba(62,123,214,.45);background:rgba(62,123,214,.10);border-radius:6px;overflow:hidden">
            <div style="position:absolute;left:0;top:0;bottom:0;width:${fillPct.toFixed(1)}%;background:${col}55;border-right:${r.queue?`2px solid ${col}`:'0'}"></div>
            <span style="position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap">${r.queue?`в работе: ${fmt(r.queue)} шт из ~${d1(r.avgW)} шт/нед`:`свободно · потенциал ~${d1(r.avgW)} шт/нед`}</span>
          </div>
          ${over?`<div style="height:20px;width:${tailW.toFixed(1)}%;min-width:46px;border-radius:6px;background:rgba(244,63,94,.35);border:1px solid rgba(244,63,94,.6);display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:800;color:#F87181;white-space:nowrap">+${fmt(r.queue-r.avgW)} сверх</div>`:''}
        </div>
        <b class="stx-pill" style="color:${col};background:${col}1c;border:1px solid ${col}55;justify-self:start">${r.clear!=null?'~'+d1(r.clear)+' дн':'?'}</b>
      </div>`}).join('');
    return `${body}<div class="legend"><span><i style="background:#2E9E74"></i>разгрузка до 3 дн</span><span><i style="background:#F59E0B"></i>3-7 дн</span><span><i style="background:#FB923C"></i>7-14 дн</span><span><i style="background:#F43F5E"></i>14+ дн (узкое горло)</span></div>`;
  })();

  // ===== ПРОХОДИМОСТЬ УЧАСТКОВ: центрированная воронка =====
  // ширина = доля заказов через участок · цвет = медиана времени НА участке (перегруз краснеет)
  const flowBlock=(()=>{
    const base=cut.length?cut:[];
    const total=base.length||1;
    const stayBy={};STATIONS.forEach(([nm])=>stayBy[nm]=[]);
    base.forEach(i=>{const h=i.hist||[];
      for(let j=0;j<h.length;j++){const st=stationOf(h[j][0]);if(!st)continue;
        const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);
        const dur=end!=null?days(h[j][1],end):null;
        if(dur!=null&&dur>=0)stayBy[st].push(dur)}});
    const rows=STATIONS.map(([nm])=>{
      const passed=base.filter(i=>(i.hist||[]).some(h=>stationOf(h[0])===nm)).length;
      let c=0,dws=[];wip.forEach(i=>{if(stationOf(i.stageCode)===nm){c++;const d=dwellNow(i);if(d!=null)dws.push(d)}});
      return {nm,passed,stay:med(stayBy[nm]),wc:c,wm:med(dws)}});
    const body=rows.map(r=>{
      const share=r.passed/total, isFin=r.nm==='Готово';
      const col=isFin?'#2E9E74':(r.passed?tone(r.stay||0):'#3a4450');
      const wpct=Math.max(share*100,r.passed?6:1.2).toFixed(1);
      const inTxt=share>=0.12?`${fmt(r.passed)} · ${pct0(share)}`:(r.passed?fmt(r.passed):'');
      // циферблат: сегмент = доля медианного времени участка от полного цикла производства
      const cycMed=med(finished.map(cycleOf).filter(x=>x!=null&&x>=0))||1;
      const frac=Math.max(0,Math.min(1,(r.stay||0)/cycMed));
      const RR=12,CC=2*Math.PI*RR,dcol=r.passed?tone(r.stay||0):'#3a4450';
      const dialTd=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Медиана на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Доля полного цикла (${d1(cycMed)} дн)</span><span>${pct(frac)}</span></div>`);
      const dial=`<svg width="30" height="30" viewBox="0 0 30 30" style="flex:none"><circle cx="15" cy="15" r="${RR}" fill="none" stroke="var(--elev)" stroke-width="5"/><circle cx="15" cy="15" r="${RR}" fill="none" stroke="${dcol}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(frac*CC).toFixed(1)} ${CC.toFixed(1)}" transform="rotate(-90 15 15)"/></svg>`;
      const stTxt=isFin?`<span style="color:var(--ink4);font-size:11px">выпуск за период</span>`:(r.passed
        ?`<span class="fun-dial" data-tip="${dialTd}">${dial}<b style="color:${dcol}">${d1(r.stay)} дн</b> <span style="color:var(--ink4)">· ${pct0(frac)} цикла</span></span>`
        :`<span style="color:var(--ink4);font-size:11px">не используется</span>`);
      const td=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Прошло за период</span><span>${fmt(r.passed)} из ${fmt(total)} (${pct(share)})</span></div><div class='tr'><span>Медиана времени на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Сейчас на участке</span><span>${r.wc}${r.wm!=null?' · лежат '+d1(r.wm)+' дн':''}</span></div>`);
      return `<div class="fun-row">
        <div class="fun-nm">${r.nm}</div>
        <div class="fun-tr"><div class="fun-bar" data-tip="${td}" style="width:${wpct}%;background:${col}26;border:1px solid ${col};color:${col}">${inTxt}</div></div>
        <div class="fun-st">${stTxt}</div>
      </div>`}).join('');
    return `${body}<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 5 дн)</span><span><i style="background:#F59E0B"></i>5-10 дн</span><span><i style="background:#FB923C"></i>10-21 дн</span><span><i style="background:#F43F5E"></i>21+ дн (перегруз)</span></div><div class="note">Воронка по участкам: ширина = сколько заказов периода (${modeLbl}: <b>${fmt(total)}</b> шт) проходит через участок, цвет = медиана времени на участке. Широкая и красная = перегруз, время растёт. Узкая = недогруз, участок простаивает. Заказ идёт только по нужным участкам, поэтому ширины не обязаны убывать сверху вниз.</div>`;
  })();

  // ===== УЧАСТКИ таблица =====
  const stTable=(()=>{
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const w=wip.filter(i=>stationOf(i.stageCode)===nm),dws=w.map(dwellNow).filter(x=>x!=null),m=med(dws),mx=dws.length?Math.max(...dws):0;
      let pass=0;all.forEach(i=>{if((i.hist||[]).some(h=>stationOf(h[0])===nm&&inRange(h[1])))pass++});
      return {nm,wip:w.length,m,mx,pass}}); // порядок = как стадии в смарт-процессе
    const body=rows.map(r=>`<tr><td class="nm">${r.nm}</td><td>${r.wip}</td><td style="color:${tone(r.m||0)};font-weight:700">${r.m!=null?d1(r.m)+' дн':'—'}</td><td>${r.mx?r.mx+' дн':'—'}</td><td>${fmt(r.pass)}</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Участок</th><th>В работе сейчас</th><th>Медиана срока</th><th>Макс</th><th>Прошло за период</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // ===== ДОРАБОТКИ =====
  const reworkBlock=(()=>{
    const map={};STATIONS.forEach(([nm])=>map[nm]=0);let tot=0;
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{if(REWORK.has(h[0])&&inRange(h[1])){const st=stationOf(h[0]);if(st&&!seen.has(st)){seen.add(st);map[st]++;tot++}}})});
    const rows=Object.entries(map).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
    const mx=rows.length?rows[0][1]:1;
    const body=rows.map(([nm,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><div style="width:110px;font-size:12px;color:var(--ink2);text-align:right">${nm}</div><div class="hbar" style="flex:1"><i style="width:${(c/mx*100).toFixed(0)}%;background:#FB923C"></i></div><div style="width:34px;font-weight:700;font-size:12px">${c}</div></div>`).join('')||'<div class="card-s">возвратов на доработку в выбранном периоде не зафиксировано</div>';
    return `<div>${body}</div><div class="card-sub" style="margin-top:6px">всего событий за период: <b style="color:var(--ink2)">${fmt(tot)}</b></div>`;
  })();

  // ===== МЕНЕДЖЕРЫ: запуски (шт и ₽) + просчёты (потенциал производства) =====
  const mgrBlock=(()=>{
    const m={};cut.forEach(i=>{const n=mgrOf(i);(m[n]=m[n]||{n,tot:0,done:0,wip:0,cyc:[],sum:0});
      m[n].tot++;if(isDone(i))m[n].done++;if(isWip(i))m[n].wip++;
      const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c)});
    uniqByDeal(cut).forEach(i=>{const n=mgrOf(i);(m[n]=m[n]||{n,tot:0,done:0,wip:0,cyc:[],sum:0});m[n].sum+=moneyOf(i)});
    // просчёты: открытые сделки на стадиях расчёта (снимок «сейчас», приходит из fetch-prod)
    const QT=(DATA.quotes&&DATA.quotes.deals)||null;
    const q={};let qTot=0,qSum=0;
    if(QT)QT.forEach(d=>{const n=d.mgr||'—';(q[n]=q[n]||{cnt:0,sum:0});q[n].cnt++;q[n].sum+=d.budget||0;qTot++;qSum+=d.budget||0;
      if(!m[n])m[n]={n,tot:0,done:0,wip:0,cyc:[],sum:0}});
    const rows=Object.values(m);
    rows.forEach(r=>{r.cycM=med(r.cyc);r.q=(q[r.n]||{}).cnt||0;r.qm=(q[r.n]||{}).sum||0});
    sortRows(rows,S.mgrSort,{n:r=>r.n,tot:r=>r.tot,sum:r=>r.sum,done:r=>r.done,cyc:r=>r.cycM,q:r=>r.q,qm:r=>r.qm});
    const totS=sum(rows,r=>r.sum);
    // три зоны: запуски - синий, выпуск - зелёный, потенциал - фиолетовый
    const LZ='rgba(34,211,238,.16)',LB='rgba(34,211,238,.05)';   // запуски
    const WZ='rgba(46,158,116,.18)',WB='rgba(46,158,116,.05)';   // выпуск
    const PZ='rgba(167,139,250,.16)',PB='rgba(167,139,250,.05)'; // потенциал
    const mxT=Math.max(1,...rows.map(r=>r.tot)),mxS=Math.max(1,...rows.map(r=>r.sum)),mxD=Math.max(1,...rows.map(r=>r.done)),mxQ=Math.max(1,...rows.map(r=>r.q)),mxQM=Math.max(1,...rows.map(r=>r.qm));
    const zb=(v,mx,col,base)=>{if(!v)return `background:${base};`;const w=Math.max(v/mx*100,3).toFixed(1);return `background:linear-gradient(90deg,${col} ${w}%,${base} ${w}%);`};
    const body=rows.slice(0,16).map(r=>{const qq=q[r.n];
      return `<tr><td class="nm">${esc(r.n)}</td>
      <td style="${zb(r.tot,mxT,LZ,LB)}"><b>${r.tot}</b></td><td style="${zb(r.sum,mxS,LZ,LB)}"><b>${fmtK(r.sum)} ₽</b></td><td style="color:var(--ink4);${zb(r.sum,mxS,LZ,LB)}">${totS?pct(r.sum/totS):'—'}</td>
      <td style="${zb(r.done,mxD,WZ,WB)}">${r.done}</td>
      <td style="color:${tone(r.cycM||0)};background:${WB}">${r.cycM!=null?d1(r.cycM)+' дн':'—'}</td>
      <td style="color:${r.q?'#A78BFA':'var(--ink4)'};${zb(r.q,mxQ,PZ,PB)}">${r.q||(QT?0:'—')}</td>
      <td style="color:${r.qm?'#A78BFA':'var(--ink4)'};font-weight:${r.qm?700:400};${zb(r.qm,mxQM,PZ,PB)}">${r.qm?fmtK(r.qm)+' ₽':QT?'0 ₽':'—'}</td></tr>`}).join('');
    const allCyc=med(rows.flatMap(r=>r.cyc));
    const foot=`<tr style="border-top:2px solid var(--border2)"><td class="nm" style="font-weight:800">Итого</td>
      <td style="font-weight:800;background:${LZ}">${fmt(sum(rows,r=>r.tot))}</td><td style="font-weight:800;background:${LZ}">${fmtK(totS)} ₽</td><td style="background:${LZ}">100%</td>
      <td style="font-weight:800;background:${WZ}">${fmt(sum(rows,r=>r.done))}</td>
      <td style="background:${WZ};color:${tone(allCyc||0)}">${allCyc!=null?d1(allCyc)+' дн':'—'}</td>
      <td style="font-weight:800;color:#A78BFA;background:${PZ}">${QT?fmt(qTot):'—'}</td>
      <td style="font-weight:800;color:#A78BFA;background:${PZ}">${QT?fmtK(qSum)+' ₽':'—'}</td></tr>`;
    const qNote=QT
      ?`Просчёты<span class="now-badge">сейчас</span> = открытые сделки на стадиях Расчёт / Формирование ТЗ / КП отправлено / Принимают решение / Долгострой: потенциал цеха <b>${fmt(qTot)}</b> сделок на <b>${fmtK(qSum)} ₽</b>. Снимок текущего момента, на фильтр периода не реагирует.`
      :`Просчёты появятся после ближайшего снимка данных (нужен ночной сбор с обновлённым коннектором).`;
    return `<table class="tbl"><thead><tr><th></th><th colspan="3" style="text-align:center;color:var(--cyan);background:rgba(34,211,238,.07);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ЗАПУСКИ · за период</th><th colspan="2" style="text-align:center;color:#2E9E74;background:rgba(46,158,116,.08);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ВЫПУСК</th><th colspan="2" style="text-align:center;color:#A78BFA;background:rgba(167,139,250,.08);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ПОТЕНЦИАЛ · сейчас</th></tr><tr>${thRow('mgr',S.mgrSort,[['n','Менеджер'],['tot','Запусков'],['sum','Запуски ₽'],[null,'Доля ₽'],['done','Выпущено'],['cyc','Ср.срок'],['q','Просчёты'],['qm','Потенциал ₽']])}</tr></thead><tbody>${body}${foot}</tbody></table>`;
  })();

  // ===== ЧТО ПРОИЗВОДИМ: два бублика =====
  const mixBlock=(()=>{
    const base=cut;
    const by=(key)=>{const m={};base.forEach(i=>{const v=i[key]||'не указано';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    const PAL=['#22D3EE','#2E9E74','#A78BFA','#F59E0B','#F43F5E','#38BDF8','#10B981','#FB923C'];
    if(!base.length)return '<div class="card-s">нет заказов в выбранном периоде</div>';
    return `<div class="grid2"><div><div class="card-s" style="margin-bottom:8px">По ассортименту</div>${donut(by('assort'),base.length,PAL,'заказов')}</div><div><div class="card-s" style="margin-bottom:8px">По направлению бренда</div>${donut(by('dir'),base.length,PAL,'заказов')}</div></div>`;
  })();

  // ===== КОНСТРУКТОРЫ =====
  const consTable=(()=>{
    const m={};cut.forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].tot++;if(isDone(i))m[n].done++;const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c);if((i.hist||[]).some(h=>REWORK.has(h[0])))m[n].rew++});
    uniqByDeal(cut).forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].sum+=moneyOf(i)});
    const rows=Object.values(m);
    rows.forEach(r=>{r.cycM=med(r.cyc);r.avg=r.tot?r.sum/r.tot:0});
    sortRows(rows,S.conSort,{n:r=>r.n,tot:r=>r.tot,done:r=>r.done,cyc:r=>r.cycM,rew:r=>r.rew,avg:r=>r.avg,sum:r=>r.sum});
    const body=rows.slice(0,12).map(r=>`<tr><td class="nm">${esc(r.n)}</td><td>${r.tot}</td><td>${r.done}</td><td style="color:${tone(r.cycM||0)}">${r.cycM!=null?d1(r.cycM)+' дн':'—'}</td><td>${r.rew}</td><td>${r.tot?fmtK(r.avg):'—'} ₽</td><td>${fmtK(r.sum)} ₽</td></tr>`).join('')||'<tr><td colspan="7" class="card-s">нет заказов в периоде</td></tr>';
    const tTot=sum(rows,r=>r.tot),tDone=sum(rows,r=>r.done),tRew=sum(rows,r=>r.rew),tSum=sum(rows,r=>r.sum),tCyc=med(rows.flatMap(r=>r.cyc));
    // Итого - первой строкой: на него смотрят чаще, чем на разбивку
    const foot=rows.length?`<tr style="border-bottom:2px solid var(--border2);background:rgba(34,211,238,.05)"><td class="nm" style="font-weight:800">Итого</td><td style="font-weight:800">${fmt(tTot)}</td><td style="font-weight:800">${fmt(tDone)}</td><td style="color:${tone(tCyc||0)};font-weight:800">${tCyc!=null?d1(tCyc)+' дн':'—'}</td><td style="font-weight:800">${fmt(tRew)}</td><td style="font-weight:800">${tTot?fmtK(tSum/tTot):'—'} ₽</td><td style="font-weight:800">${fmtK(tSum)} ₽</td></tr>`:'';
    return `<table class="tbl"><thead><tr>${thRow('con',S.conSort,[['n','Конструктор'],['tot','Позиций'],['done','Готово'],['cyc','Ср.срок'],['rew','Доработок'],['avg','Ср.чек'],['sum','Сумма']])}</tr></thead><tbody>${foot}${body}</tbody></table>`;
  })();

  // ===== КОНСТРУКТОРЫ: профиль по чекам, сортировка ₽/дни/шт =====
  const consScatter=(()=>{
    const pts=cut.filter(i=>isDone(i)&&moneyOf(i)>0).map(i=>({b:moneyOf(i),c:cycleOf(i),n:i.constructor||'—'})).filter(p=>p.c!=null&&p.c>=0);
    if(pts.length<5)return '<div class="card-s">мало готовых заказов с чеком в периоде</div>';
    const BK=[['Дешёвые · до 100 тыс',0,1e5],['Средние · 100-300 тыс',1e5,3e5],['Дорогие · от 300 тыс',3e5,Infinity]];
    const bkOf=b=>BK.findIndex(([,a,z])=>b>=a&&b<z);
    const m={};pts.forEach(p=>{(m[p.n]=m[p.n]||{n:p.n,tot:0,sum:0,cyc:[],bk:[[],[],[]]});m[p.n].tot++;m[p.n].sum+=p.b;m[p.n].cyc.push(p.c);m[p.n].bk[bkOf(p.b)].push(p)});
    const srt=S.consSort||'money';
    const keyF=srt==='days'?(r=>med(r.cyc)||0):srt==='cnt'?(r=>r.tot):(r=>r.sum);
    const rows=Object.values(m).sort((a,b)=>keyF(b)-keyF(a)).slice(0,10);
    const allRow={n:'Все конструкторы',tot:pts.length,sum:sum(pts,p=>p.b),cyc:pts.map(p=>p.c),bk:[[],[],[]]};
    pts.forEach(p=>allRow.bk[bkOf(p.b)].push(p));
    // выбранная метрика (₽/Дни/Шт) задаёт и ширину гистограммы, и главную цифру ячейки
    const cellVal=(arr)=>srt==='days'?(med(arr.map(p=>p.c))||0):srt==='cnt'?arr.length:sum(arr,p=>p.b);
    const colMax=[0,1,2].map(k=>Math.max(1e-9,...rows.concat([allRow]).map(r=>r.bk[k].length?cellVal(r.bk[k]):0)));
    const cell=(r,k)=>{const arr=r.bk[k];if(!arr.length)return `<div class="pr-cell"><span style="color:var(--ink4)">—</span></div>`;
      const share=arr.length/r.tot, mc=med(arr.map(p=>p.c)), col=toneC(mc||0), money=sum(arr,p=>p.b);
      const w=Math.max(cellVal(arr)/colMax[k]*100,4);
      const parts={money:`${fmtK(money)} ₽`,cnt:`${arr.length} шт`,days:`${d1(mc)} дн`};
      const main=srt==='days'?parts.days:srt==='cnt'?parts.cnt:parts.money;
      const rest=['money','cnt','days'].filter(x=>x!==(srt==='days'?'days':srt==='cnt'?'cnt':'money')).map(x=>parts[x]).join(' · ');
      const td=attr(`<div class='tl'>${esc(r.n)} · ${BK[k][0]}</div><div class='tr'><span>Деньги</span><span>${fmtK(money)} ₽</span></div><div class='tr'><span>Заказов</span><span>${fmt(arr.length)} (${pct(share)} его заказов)</span></div><div class='tr'><span>Медиана срока</span><span>${d1(mc)} дн</span></div>`);
      return `<div class="pr-cell" data-tip="${td}"><i style="width:${w.toFixed(1)}%;background:${col}30;border-right:2px solid ${col}"></i><span><b style="color:${col}">${main}</b>&nbsp;<span style="color:var(--ink3)">· ${rest}</span></span></div>`};
    const totCell=(r)=>{const md=med(r.cyc);const parts={money:`<b>${fmtK(r.sum)}</b> ₽`,cnt:`<b>${r.tot}</b> шт`,days:`<b style="color:${toneC(md||0)}">${d1(md)} дн</b>`};
      const key=srt==='days'?'days':srt==='cnt'?'cnt':'money';
      return `<div class="pr-tot">${parts[key]} · ${['money','cnt','days'].filter(x=>x!==key).map(x=>parts[x].replace(/<\/?b[^>]*>/g,'')).join(' · ')}</div>`};
    const row=(r,hl)=>`<div class="pr-row"${hl?' style="border-bottom:1px solid var(--border2);padding-bottom:10px;margin-bottom:4px"':''}>
      <div class="pr-nm"${hl?' style="color:var(--ink3)"':''}>${esc(r.n)}</div>${cell(r,0)}${cell(r,1)}${cell(r,2)}${totCell(r)}</div>`;
    const head=`<div class="pr-row" style="margin-bottom:2px"><div></div>${BK.map(([l])=>`<div class="pr-head">${l}</div>`).join('')}<div class="pr-head" style="text-align:right">Итого</div></div>`;
    return head+row(allRow,true)+rows.map(r=>row(r)).join('')+
      `<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 15 дн)</span><span><i style="background:#F59E0B"></i>15-25 дн</span><span><i style="background:#FB923C"></i>25-40 дн</span><span><i style="background:#F43F5E"></i>40+ дн (возится)</span></div>`+
      `<div class="note">Переключатель сверху (₽ / Дни / Шт) меняет и гистограммы, и главную цифру ячеек, и сортировку строк. <b>Длина полосы</b> = выбранная метрика относительно максимума колонки, <b>цвет</b> = медиана срока (краснее - дольше). Самая длинная и красная = приоритетная очередь. Первая строка - весь цех. Наведи на ячейку - детали.</div>`;
  })();

  // ===== ПРОИЗВОДСТВЕННЫЙ КАЛЕНДАРЬ: факт × пропускная способность (в ИЗДЕЛИЯХ) =====
  const calBlock=(()=>{
    if(!keys.length)return '<div class="card-s">нет периода</div>';
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const scale=S.gran==='d'?1/7:S.gran==='m'?30.4/7:1;
    const ki={};keys.forEach((k,i)=>ki[k]=i);
    // события: {d:дата, q:изделий, p:позиций}
    const mkRow=(nm,evts,primary)=>{
      const q=keys.map(()=>0),pp=keys.map(()=>0),wk={},bi={};
      evts.forEach(e=>{const k=bkey(e.d);if(k in ki){q[ki[k]]+=e.q;pp[ki[k]]++;if(e.it)(bi[k]=bi[k]||[]).push(e.it)}const wkk=wkOf(e.d);if(wkk)wk[wkk]=(wk[wkk]||0)+e.q});
      // норма = средняя по ПОСЛЕДНИМ 8 АКТИВНЫМ неделям: пустые ранние недели истории не занижают ориентир
      const wkKeys=Object.keys(wk).sort().slice(-8);
      const norm=(wkKeys.length?wkKeys.reduce((a,k2)=>a+wk[k2],0)/wkKeys.length:0)*scale;
      return {nm,q,pp,norm,bi,sum:q.reduce((a,b)=>a+b,0),psum:pp.reduce((a,b)=>a+b,0),primary}};
    const rows=[];
    rows.push(mkRow('▶ Запуск в цех',IT.filter(dirOk).filter(i=>startDate(i)).map(i=>({d:startDate(i),q:qtyOf(i),it:i})),true));
    // остаток «в работе» на конец каждого бакета: запущено <= конца и ещё не готово (в изделиях)
    rows.push((()=>{
      const q=keys.map(()=>null),pp=keys.map(()=>null),bi={};
      keys.forEach((k,ix)=>{const t=bend(k);if(t>NOWS)return;let qq=0,pc=0;
        IT.filter(dirOk).forEach(i=>{const s=startDate(i);if(!s||s>t)return;const f=successDate(i);if(f&&f<=t)return;qq+=qtyOf(i);pc++;(bi[k]=bi[k]||[]).push(i)});
        q[ix]=qq;pp[ix]=pc});
      // норма = средний остаток за ПОСЛЕДНИЕ 8 недель (скользящий ориентир, как мощность в педалях),
      // а не среднее выбранного окна - иначе завал в начале периода задирает норму и 29 выглядит как 25%
      const _refPts=[];for(let dd=0;dd<56;dd+=7){const t=iso(new Date(D(NOWS)-dd*864e5));let qq=0;
        IT.filter(dirOk).forEach(i=>{const s2=startDate(i);if(!s2||s2>t)return;const f=successDate(i);if(f&&f<=t)return;qq+=qtyOf(i)});_refPts.push(qq)}
      const avg=_refPts.length?_refPts.reduce((a,b)=>a+b,0)/_refPts.length:0;
      let nowQ=0,nowP=0;IT.filter(dirOk).forEach(i=>{const s=startDate(i);if(!s||s>NOWS)return;const f=successDate(i);if(f&&f<=NOWS)return;nowQ+=qtyOf(i);nowP++});
      return {nm:'⏳ В работе',q,pp,norm:avg,bi,sum:nowQ,psum:nowP,primary:true,stock:true};
    })());
    rows.push(mkRow('✔ Выпуск (готово)',done.filter(i=>successDate(i)).map(i=>({d:successDate(i),q:qtyOf(i),it:i})),true));
    STATIONS.filter(([nm])=>nm!=='Передано'&&nm!=='Готово').forEach(([nm])=>{
      const evts=[];IT.filter(dirOk).forEach(i=>(i.hist||[]).forEach(h=>{if(stationOf(h[0])===nm&&h[1])evts.push({d:h[1],q:qtyOf(i),it:i})}));
      if(evts.length)rows.push(mkRow(nm,evts,false))});
    const showN=keys.length<=14, showP=keys.length<=40, gap=keys.length>60?1:2;
    const gTone=r=>r>1.3?'#F43F5E':r>1?'#FB923C':'#2E9E74';
    const rowHtml=r=>{
      const ri=rows.indexOf(r);
      const H=r.primary?30:17, alpha=r.primary?1:0.62, fs=r.primary?10.5:9;
      const mx=Math.max(1,...r.q.filter(v=>v!=null)); // максимум строки за период - точка отсчёта теплоты
      const heat=t=>t>=.75?`rgba(244,63,94,${(Math.min(.3+t*.5,.85)*alpha).toFixed(2)})`:t>=.4?`rgba(251,146,60,${((.25+t*.5)*alpha).toFixed(2)})`:`rgba(46,158,116,${((.16+t*.9)*alpha).toFixed(2)})`;
      const cells=r.q.map((v,i)=>{
        if(v==null)return `<div class="cal-c" style="height:${H}px;background:var(--elev);opacity:.35"></div>`;
        const k=keys[i], wknd=S.gran==='d'&&(D(k).getDay()===0||D(k).getDay()===6);
        if(v===0&&!r.stock){
          const fut=bend(k)>NOWS;
          const td0=attr(`<div class='tl'>${r.nm} · ${blabel(k)}${wknd?' · выходной':''}</div><div class='tn'>${fut?'период ещё не наступил':'событий не было'}</div>`);
          const bg0=wknd?'repeating-linear-gradient(45deg,var(--elev),var(--elev) 4px,rgba(148,163,184,.10) 4px,rgba(148,163,184,.10) 8px)':'var(--elev)';
          return `<div class="cal-c" data-tip="${td0}" style="height:${H}px;background:${bg0};${wknd?'opacity:.55':''}"></div>`}
        const ratio=r.norm>0?v/r.norm:0, t=r.stock?Math.min(ratio/1.6,1):v/mx;
        const bg=v===0?'var(--elev)':r.stock?(ratio>1.3?`rgba(244,63,94,${(Math.min(.25+ratio*.2,.85)*alpha).toFixed(2)})`:ratio>1?`rgba(251,146,60,${(Math.min(.3+ratio*.3,.8)*alpha).toFixed(2)})`:`rgba(46,158,116,${((.18+ratio*.6)*alpha).toFixed(2)})`):heat(t);
        const canClick=!!(r.bi&&r.bi[k]&&r.bi[k].length);
        const sel=S.calSel&&S.calSel.r===ri&&S.calSel.k===k;
        const clickTn=canClick?`<div class='tn'>клик - список изделий</div>`:'';
        const td=r.stock
          ?attr(`<div class='tl'>${r.nm} · ${blabel(k)}${wknd?' · выходной':''}</div><div class='tr'><span>В работе, шт</span><span>${fmt(v)}</span></div><div class='tr'><span>Позиций (карточек)</span><span>${fmt(r.pp[i])}</span></div><div class='tr'><span>Норма: ср. остаток за 8 нед, шт</span><span>${d1(r.norm)}</span></div><div class='tr'><span>К норме</span><span>${r.norm?pct(ratio):'—'}</span></div>`+clickTn)
          :attr(`<div class='tl'>${r.nm} · ${blabel(k)}${wknd?' · выходной':''}</div><div class='tr'><span>Штук</span><span>${fmt(v)}</span></div><div class='tr'><span>Изделий (карточек)</span><span>${fmt(r.pp[i])}</span></div><div class='tr'><span>Максимум строки, шт</span><span>${fmt(mx)}</span></div><div class='tr'><span>Теплота (от макс.)</span><span>${pct(v/mx)}</span></div><div class='tr'><span>Ср. пропускная, изд.</span><span>${d1(r.norm)}</span></div>`+clickTn);
        return `<div class="cal-c"${canClick?` data-crow="${ri}" data-ck="${k}"`:''} data-tip="${td}" style="height:${H}px;background:${bg};color:${v&&t>.45?'#06121a':'var(--ink3)'};font-size:${fs}px${canClick?';cursor:pointer':''}${sel?';box-shadow:inset 0 0 0 2px #22D3EE':''}">${(showN||(r.primary&&showP))&&v?v:''}</div>`}).join('');
      const load=r.stock?(r.norm>0?r.sum/r.norm:null):(r.norm>0?r.sum/(r.norm*keys.length):null);
      const lc=load==null?'#5a6672':gTone(load);
      return `<div class="cal-row"><div class="cal-nm" style="${r.primary?'font-size:12.5px;color:var(--ink)':'font-size:11px;color:var(--ink3)'}">${r.nm}</div><div class="cal-cells" style="gap:${gap}px">${cells}</div><div class="cal-sum" style="${r.primary?'':'font-weight:600;color:var(--ink3)'}">${fmt(r.sum)}${r.stock?'<span style="font-weight:400;color:var(--ink4);font-size:9px"> сейчас</span>':''}</div><div class="cal-norm">${d1(r.norm)}</div><div class="cal-pct" style="color:${lc};background:${lc}1c">${load!=null?pct0(load):'—'}</div></div>`};
    const step=Math.ceil(keys.length/12);
    const heads=keys.map((k,i)=>`<div class="cal-head" style="flex:1">${(i%step===0||i===keys.length-1)?blabel(k):''}</div>`).join('');
    const headRow=`<div class="cal-row" style="margin-bottom:0"><div></div><div class="cal-cells">${heads}</div><div class="cal-head" style="text-align:right">Σ шт.</div><div class="cal-head" style="text-align:right">норма</div><div class="cal-head">%</div></div>`;
    const primary=rows.filter(r=>r.primary).map(rowHtml).join('');
    const secondary=rows.filter(r=>!r.primary).map(rowHtml).join('');
    const divider=`<div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink4)">Участки · входы, шт (второстепенно)</span><div style="flex:1;height:1px;background:var(--border)"></div></div>`;
    const calDetail=(()=>{
      if(!S.calSel)return '';
      const r=rows[S.calSel.r];const its=r&&r.bi&&r.bi[S.calSel.k];
      if(!its||!its.length)return '';
      const qsum=its.reduce((a,i2)=>a+qtyOf(i2),0);
      const lnk=(href,txt)=>`<a href="${href}" target="_blank" rel="noopener" style="color:#3DAEC2">${txt}</a>`;
      const body=its.slice(0,30).map(i2=>{
        const card=PORTAL?lnk(`${PORTAL}/crm/type/${DATA.entityTypeId||1086}/details/${i2.id}/`,i2.id):i2.id;
        const deal=i2.dealId?(PORTAL?lnk(`${PORTAL}/crm/deal/details/${i2.dealId}/`,i2.dealId):i2.dealId):'—';
        return `<tr><td>${card}</td><td class="nm" style="max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i2.title||'—')}</td><td>${fmt(qtyOf(i2))}</td><td>${deal}</td><td>${esc(i2.stage||'—')}</td><td>${esc(mgrOf(i2))}</td></tr>`}).join('');
      const more=its.length>30?`<div class="card-s" style="margin-top:6px">показаны первые 30 из ${fmt(its.length)}</div>`:'';
      return `<div style="margin-top:12px;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;background:var(--elev)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap"><b style="font-size:12px">${r.nm} · ${blabel(S.calSel.k)}</b><span class="card-s">изделий: ${fmt(its.length)} · штук: ${fmt(qsum)}</span><span style="flex:1"></span><button data-calclose style="background:none;border:1px solid var(--border2);border-radius:6px;color:var(--ink3);cursor:pointer;font-size:11px;padding:2px 8px">✕ закрыть</button></div><table class="tbl"><thead><tr><th>Карточка</th><th>Изделие</th><th>Шт</th><th>Сделка</th><th>Стадия</th><th>Менеджер</th></tr></thead><tbody>${body}</tbody></table>${more}</div>`;
    })();
    return headRow+primary+divider+secondary+`<div class="legend"><span><i style="background:rgba(46,158,116,.6)"></i>тихие ${S.gran==='d'?'дни':'периоды'} (до 40% макс.)</span><span><i style="background:rgba(251,146,60,.6)"></i>40-75% макс.</span><span><i style="background:rgba(244,63,94,.6)"></i>пиковые (75%+ от максимума строки)</span><span style="color:var(--ink4)">клик по ячейке = список изделий</span></div>`+calDetail;
  })();

  const perLbl=`${S.from.split('-').reverse().join('.')} - ${S.to.split('-').reverse().join('.')}`;
  document.getElementById('root').innerHTML=
    `<div class="sec" id="sec1"><div class="n">1</div><h2>Производство</h2><div class="ln"></div><div class="hint">период: <b>${perLbl}</b>${S.dir?' · '+S.dir:''} · срез: <b style="color:#22D3EE">${modeLbl}</b> (влияет на состав, менеджеров, конструкторов; KPI запуска и выпуска всегда по своим датам) · «сейчас» = моментальный снимок <span class="qm" data-tip="Язык дашборда. СДЕЛКА - ей управляет отдел продаж (деньги, менеджер). ИЗДЕЛИЕ (карточка) - создаётся при передаче в цех, по одному на тип изделия в заказе, ходит по участкам. ШТУКИ - количество из товарных строк карточки (изделие × кол-во), именно штуки грузят участки. Вопрос: в каких единицах читать каждый блок? Вывод: продажи считаем сделками, цех - изделиями и штуками; где единица не подписана - смотри подсказку блока.">?</span></div></div>`+kpis+
        syncBlock+
    `<div class="card"><div class="card-h"><div><div class="card-t">Труба производства: каких участков коснулись изделия <span class="qm" data-tip="Как воронка сделок у РОПа, но для цеха: сколько изделий (карточек-нарядов) или штук (изделия × количество из товарных строк - по тумблеру) выбранного среза прошло через каждый участок за период. Изделие идёт только по НУЖНЫМ участкам, поэтому столбики не обязаны убывать. Очередь «сейчас» - в «Стаканах участков» ниже. Вопрос: какие участки реально нагружает текущий поток заказов? Вывод: участок с большим столбиком здесь и красным бейджем в «Стаканах» - узкое горло; почти пустой - недозагрузка или заказы идут мимо него.">?</span></div><div class="card-s">${S.trubaUnit==='pcs'?'штуки':'изделия (карточки)'} через участки за период</div></div><div class="seg" id="trubaSeg"><button data-v="cards" class="${S.trubaUnit!=='pcs'?'on':''}">Изделия</button><button data-v="pcs" class="${S.trubaUnit==='pcs'?'on':''}">По штучно</button></div></div>${prodTruba}</div>`+
    `<div class="grid2">`+
    `<div class="card"><div class="card-h" style="flex-wrap:nowrap;align-items:flex-start"><div><div class="card-t">Запуск vs выпуск <span class="qm" data-tip="Две линии по периодам: сколько передано в цех и сколько выпущено готовым (по тумблеру - штуки или деньги). Вопрос: успевает ли цех за входящим потоком? Вывод: синяя стабильно выше зелёной - копится незавершёнка: тормозить передачи или расширять мощность; зелёная выше - цех разгребает накопленный хвост.">?</span></div><div class="card-s">успевает ли цех за входящим потоком</div></div><div class="seg" id="dynUnitSeg" style="flex:none">${[['deals','Сделки'],['cnt','Изделия'],['money','₽']].map(x=>`<button data-v="${x[0]}" class="${(S.dynUnit||'cnt')===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>${dynFlow}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">${isStart?'Запуск':'Выпуск'} в деньгах <span class="qm" data-tip="Суммы уникальных сделок по заказам каждого периода. Вопрос: сколько денег входит в цех и выходит готовым? Вывод: вход стабильно больше выхода - деньги замораживаются в незавершёнке; провал - смотреть, был ли провал в передачах у ОП.">?</span></div><div class="card-s">${isStart?'сколько денег вошло в цех':'сколько денег вышло готовым'}</div></div></div>${dynMoney}</div>`+
    `</div>`+
    pedalsBlock+`<div class="card"><div class="card-h"><div><div class="card-t">Стаканы участков: мощность vs очередь <span class="qm" data-tip="Один стакан на участок: длина рамки = недельная мощность (потенциал, из истории выпуска), заливка = очередь сейчас (заполненный потенциал), цвет заливки = за сколько дней разгребётся, красный хвост «+N сверх» = очередь больше, чем участок делает за неделю. Бейдж справа - дни на разгрузку. Вопрос: какой участок - узкое горло прямо сейчас? Вывод: красный бейдж (14+ дней) - переносить людей или смены на участок либо тормозить запуски; пустая очередь при большой мощности - резерв.">?</span></div><div class="card-s">очередь каждого участка против его недельной мощности</div></div></div>${stationsBlock}</div>`+
    `<div class="sec" id="sec2"><div class="n">2</div><h2>Участки</h2><div class="ln"></div><div class="hint">где заказы лежат дольше всего и где страдает качество</div></div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Скорость по участкам <span class="qm" data-tip="По каждому участку: сколько в работе сейчас, медиана и максимум срока лежания, сколько прошло за период. Вопрос: где заказы лежат дольше всего? Вывод: красная медиана - системная проблема участка, на планёрку; большой максимум при нормальной медиане - единичный застрявший заказ, найти и пнуть.">?</span></div><div class="card-s">где заказы лежат дольше всего</div></div></div>${stTable}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Доработки и перекрас (качество) <span class="qm" data-tip="Сколько заказов возвращалось на участок повторно (доработка, перекрас) за период. Вопрос: где страдает качество? Вывод: высокий столбец - разбирать причины брака с участком: каждый возврат - скрытые дни срока и деньги.">?</span></div><div class="card-s">где страдает качество</div></div></div>${reworkBlock}</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Что производим <span class="qm" data-tip="Структура запущенных заказов по ассортименту. Вопрос: чем реально загружен цех и совпадает ли это с тем, что продаём? Вывод: большой сегмент «не указано» - дыра заполнения карточек: ассортиментные разрезы врут, чинить дисциплину.">?</span></div><div class="card-s">чем загружен цех</div></div></div>${mixBlock}</div>`+
    `<div class="sec" id="sec3"><div class="n">3</div><h2>Подготовка к производству</h2><div class="ln"></div><div class="hint">потенциал цеха: слева - что отдел продаж передал и держит в расчётах, справа - что конструкторы уже проектируют</div></div>`+
    `<div class="grid2" style="align-items:start">`+deptBlock+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конструкторы <span class="qm" data-tip="Позиции, готовность, срок, доработки, средний чек и сумма по каждому конструктору. Вопрос: кто проектирует объём цеха и у кого сроки или доработки хуже? Вывод: длинный срок и доработки у одного человека - проверять сложность его заказов или качество проектирования; Итого - вклад отдела целиком.">?</span></div><div class="card-s">кто проектирует объём цеха</div></div></div>${consTable}</div></div>`+
    
    `<div class="sec" id="sec4"><div class="n">4</div><h2>Производственный календарь</h2><div class="ln"></div><div class="hint">факт против пропускной способности: где и когда цех был загружен, перегружен или простаивал</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Запуск, в работе и выпуск по ${S.gran==='d'?'дням':S.gran==='m'?'месяцам':'неделям'} · в штуках <span class="qm" data-tip="Тепловая карта загрузки цеха: каждая строка - этап (запуск, в работе, выпуск, участки), каждая колонка - день/неделя/месяц. Чем краснее ячейка, тем жарче было в этот день на этом этапе; зелёная - спокойно, пустая - событий не было. Цифра в ячейке - штуки. Справа: сумма за период, норма (сколько цех обычно делает) и процент к ней. Строка «В работе» - сколько штук лежало в цехе на конец каждого дня: краснеет, когда остаток выше обычного - цех копит. Красный пик на «Выпуске» - хорошо: вышел большой объём, станки освободились - сигнал отделу продаж ускорить запуски. Клик по ячейке - список изделий со ссылками в Битрикс24. Вопрос: в какие дни цех перегружен, когда простаивает и копится ли остаток? Вывод: красные ячейки запуска при зелёном выпуске - вход неравномерный: планировать запуски ровнее; краснеющая строка «В работе» - выпуск отстаёт от входа.">?</span></div><div class="card-s">где и когда цех был перегружен, а когда простаивал</div></div></div>${calBlock}</div>`;
  document.getElementById('periodLabel').textContent=perLbl;
  wireCharts();

  // freshness
  const fr=document.getElementById('fresh');
  if(DATA.generatedAt){const g=new Date(DATA.generatedAt),m=new Date(g.getTime()+3*36e5),p=n=>String(n).padStart(2,'0');
    const ageH=(new Date()-g)/36e5,col=ageH>48?'#F43F5E':ageH>30?'#F59E0B':'#2E9E74';
    fr.textContent='данные на '+p(m.getUTCDate())+'.'+p(m.getUTCMonth()+1)+' '+p(m.getUTCHours())+':'+p(m.getUTCMinutes())+' МСК';fr.style.color=col;
    if(DATA.bakedAt){const bkd=new Date(new Date(DATA.bakedAt).getTime()+3*36e5);fr.textContent+=' · сборка '+p(bkd.getUTCDate())+'.'+p(bkd.getUTCMonth()+1)+' '+p(bkd.getUTCHours())+':'+p(bkd.getUTCMinutes())}}
}

// ===== подсказки (как в РОП): плавающий тултип + вертикальный пунктир на графиках =====
const tipEl=document.getElementById('tip');
function qfmt(h){if(!/Вопрос:|Вывод:/.test(h))return h;
  let x='<div class="qh qw">Что в блоке?</div><div class="qb">'+h;
  x=x.replace(/\s*Вопрос:\s*/,'</div><div class="qh qq">На какие вопросы отвечает?</div><div class="qb">');
  x=x.replace(/\s*Вывод:\s*/,'</div><div class="qh qc">Какие выводы сделать?</div><div class="qb">');
  return x+'</div>'}
function tipShow(html,x,y){tipEl.innerHTML=qfmt(html);tipEl.style.opacity=1;let nx=x+14,ny=y+14;
  if(nx+tipEl.offsetWidth>innerWidth)nx=x-tipEl.offsetWidth-14;if(ny+tipEl.offsetHeight>innerHeight)ny=y-tipEl.offsetHeight-14;
  tipEl.style.left=nx+'px';tipEl.style.top=ny+'px'}
function tipHide(){tipEl.style.opacity=0}
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t)tipShow(t.getAttribute('data-tip'),e.clientX,e.clientY);else tipHide()});
function wireCharts(){document.querySelectorAll('svg.xh-chart').forEach(svg=>{const xh=svg.querySelector('.xhair');if(!xh)return;
  svg.querySelectorAll('rect[data-cx]').forEach(r=>r.addEventListener('mousemove',()=>{const cx=r.getAttribute('data-cx');xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity','0.5')}));
  svg.addEventListener('mouseleave',()=>xh.setAttribute('opacity','0'))})}

// ===== контролы =====
function segWire(id,key){const seg=document.getElementById(id);seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S[key]=b.dataset.v;
  if(key==='preset'){applyPreset(b.dataset.v)}render()})}
function applyPreset(v){if(v==='all'){S.from=MIND;S.to=NOWS}
  else if(v==='y'){const y=iso(new Date(NOW-864e5));S.from=y;S.to=y}
  else{const n=+v;const a=new Date(NOW-(n-1)*864e5);S.from=iso(a);S.to=NOWS}
  document.getElementById('dFrom').value=S.from;document.getElementById('dTo').value=S.to}
(function init(){
  // направления из данных
  const dirs=[...new Set(IT.map(i=>i.dir).filter(v=>v&&v!=='не указано'))].sort();
  const sel=document.getElementById('dirSel');
  dirs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});
  sel.addEventListener('change',()=>{S.dir=sel.value;render()});
  segWire('modeSeg','mode');segWire('granSeg','gran');segWire('presetSeg','preset');segWire('dealSeg','dealF');
  const SECS=['Производство','Участки','Подготовка','Календарь'];
  const nav=document.getElementById('nav');
  if(nav){nav.innerHTML=SECS.map((t,i)=>`<button data-i="${i+1}" class="${i===0?'on':''}">${t}</button>`).join('');
    nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const t=document.getElementById('sec'+b.dataset.i);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});}
  document.addEventListener('click',e=>{const b=e.target.closest('#consSortSeg button');if(b){S.consSort=b.dataset.v;render();return}
    const u=e.target.closest('#dynUnitSeg button');if(u){S.dynUnit=u.dataset.v;render();return}
    const tu=e.target.closest('#trubaSeg button');if(tu){S.trubaUnit=tu.dataset.v;render();return}
    const sd=e.target.closest('#syncDirSeg button');if(sd){S.syncDir=sd.dataset.v;render();return}
    const cc=e.target.closest('[data-calclose]');if(cc){S.calSel=null;render();return}
    const cl=e.target.closest('.cal-c[data-crow]');if(cl){const rr=+cl.dataset.crow,kk=cl.dataset.ck;S.calSel=(S.calSel&&S.calSel.r===rr&&S.calSel.k===kk)?null:{r:rr,k:kk};render();return}
    const dr=e.target.closest('tr[data-dept]');if(dr){const k=dr.dataset.dept;S.deptOpen[k]=!S.deptOpen[k];render();return}
    const mr=e.target.closest('tr[data-mgr]');if(mr&&!e.target.closest('a')){const k=mr.dataset.mgr;S.mgrOpen[k]=!S.mgrOpen[k];render();return}
    const dh=e.target.closest('th[data-dsk]');if(dh){const st=S.dSort;if(st.k===dh.dataset.dsk)st.a=!st.a;else{st.k=dh.dataset.dsk;st.a=false}render();return}
    const th=e.target.closest('th[data-sk]');if(th){const st=th.dataset.tbl==='mgr'?S.mgrSort:th.dataset.tbl==='sm'?S.smSort:S.conSort;
      if(st.k===th.dataset.sk)st.a=!st.a;else{st.k=th.dataset.sk;st.a=false}render()}});
  applyPreset('30');S.preset='30'; // дефолт: 30 дней (решение Ивана, как у РОПа)
  const df=document.getElementById('dFrom'),dt=document.getElementById('dTo');
  df.value=S.from;dt.value=S.to;
  document.getElementById('applyCustom').addEventListener('click',()=>{
    if(df.value)S.from=df.value;if(dt.value)S.to=dt.value;
    if(S.from>S.to){const t=S.from;S.from=S.to;S.to=t;df.value=S.from;dt.value=S.to}
    document.querySelectorAll('#presetSeg button').forEach(x=>x.classList.remove('on'));render()});
  render();
  // Анти-кэш для боевого адреса /prod/: деплой кладёт рядом v.txt со штампом сборки.
  // Проверяем при загрузке, при возврате на вкладку и раз в 15 минут: давно открытая
  // вкладка тоже подтянет свежую сборку. Перезагрузка одна на версию (sessionStorage).
  (function(){try{
    if(location.protocol==='file:'||!DATA.bakedAt)return;
    const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
      v=(v||'').trim();if(!v||v===DATA.bakedAt)return;
      if(v<DATA.bakedAt)return; // на сервере не новее нашей - не дёргаемся
      if(sessionStorage.getItem('_vchk')===v)return; // защита от цикла, если кэш упрямый
      sessionStorage.setItem('_vchk',v);location.replace(location.pathname+'?v='+encodeURIComponent(v));
    }).catch(()=>{})};
    chk();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
    setInterval(chk,9e5);
  }catch(e){}})();
})();
</script></body></html>
