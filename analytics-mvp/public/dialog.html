<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Диалоги по сделкам</title>
<style>
:root{--bg:#0E141A;--card:#141C24;--card2:#0F171E;--border:#243039;--border-soft:#1B242C;--ink:#E7EEF4;--ink-2:#B7C4CE;--ink-3:#8A99A6;--ink-4:#5D6B77;--acc:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
.h1{font-size:20px;font-weight:800;letter-spacing:.2px}
.sub{color:var(--ink-3);font-size:12px;margin-top:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.bar label{color:var(--ink-3);font-size:11px;margin-right:4px}
select,input{background:var(--card2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none}
input#q{min-width:220px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--ink-2);font-size:11.5px;cursor:pointer;user-select:none}
.chip.on{background:#12303a;border-color:#1f6b7d;color:#bfeff8}
.cnt{color:var(--ink-4);font-size:11px}
.deal{border:1px solid var(--border);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.dhead{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer}
.dhead:hover{background:rgba(34,211,238,.04)}
.arw{color:var(--ink-4);width:12px;flex:0 0 12px;font-size:11px}
.did{font-weight:800;color:var(--acc);flex:0 0 auto}
.dttl{color:var(--ink);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmgr{color:var(--ink-2);flex:0 0 auto;white-space:nowrap;font-size:12px}
.dchips{display:flex;gap:4px;flex:0 0 auto}
.dchips i{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.dchips b{width:8px;height:8px;border-radius:2px;display:inline-block}
.dmeta{color:var(--ink-4);font-size:11px;flex:0 0 auto;white-space:nowrap}
.thread{border-top:1px solid var(--border-soft);padding:4px 0;background:var(--card2)}
.ev{display:grid;grid-template-columns:118px 132px 22px 140px 1fr;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border-soft);align-items:start}
.ev:last-child{border-bottom:none}
.ev .t{color:var(--ink-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.dir-in{color:#69C7DA}.dir-out{color:#7FD1A6}.dir-n{color:var(--ink-4)}
.who{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.body .st{color:var(--ink-4);font-size:10.5px;margin-left:6px}
.body a.rec{margin-left:8px;font-size:11px}
.empty{padding:40px;text-align:center;color:var(--ink-4)}
.foot{color:var(--ink-4);font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="h1">GENGLASS · Диалоги по сделкам</div>
  <div class="sub" id="sub">загрузка…</div>

  <div class="bar">
    <span><label>Менеджер</label><select id="fMgr"></select></span>
    <span><label>Направление</label><select id="fDir"><option value="">все</option><option value="входящее">входящие</option><option value="исходящее">исходящие</option></select></span>
    <span><label>Сделка</label><input id="fDeal" placeholder="ID" style="width:90px"></span>
    <input id="q" placeholder="поиск по тексту / кто / тема">
    <span><label>Сделки</label><select id="fOrd"><option value="desc">свежие сверху</option><option value="asc">старые сверху</option></select></span>
    <span class="chip" id="expAll">развернуть видимые</span>
  </div>
  <div class="cnt" id="typeChips" style="margin-bottom:8px"></div>
  <div class="cnt" id="stat" style="margin-bottom:10px"></div>

  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = {"generatedAt":null,"from":"","to":"","days":7,"category":"все","portal":"https://glassmemory.bitrix24.ru","dealsScanned":0,"dealsWithEvents":0,"managers":[],"counts":{},"events":[]};
const BAKED_AT = "2026-08-17T09:37:10.704Z";
const PORTAL = DATA.portal || "https://glassmemory.bitrix24.ru";
const DEAL_LIMIT = 400;

const TCOL = {'Звонок':'#3DAEC2','Письмо':'#C2873C','Дело':'#8B7BF0','Задача':'#8B7BF0','Мессенджер ОЛ':'#2E9E74','Комментарий-заметка':'#8794A5','Активность':'#5D6B77'};
const typeColor = t => t && t.indexOf('Сообщение')===0 ? '#2E9E74' : (TCOL[t]||'#5D6B77');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2 = n => String(n).padStart(2,'0');
const fmtTime = iso => { const d=new Date(iso); if(isNaN(d)) return ''; return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };
const fmtDay = ts => { const d=new Date(ts); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };

const S = { mgr:'', dir:'', deal:'', q:'', ord:'desc', types:new Set() };
let VIEW = []; // текущие сгруппированные сделки

function initControls(){
  const mgr = document.getElementById('fMgr');
  mgr.innerHTML = '<option value="">все менеджеры</option>' + (DATA.managers||[]).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  const chips = document.getElementById('typeChips');
  const order = Object.keys(DATA.counts||{}).sort((a,b)=>DATA.counts[b]-DATA.counts[a]);
  chips.innerHTML = order.map(t=>`<span class="chip" data-t="${esc(t)}"><i style="width:8px;height:8px;border-radius:2px;background:${typeColor(t)};display:inline-block"></i>${esc(t)} <span class="cnt">${DATA.counts[t]}</span></span>`).join('');
  chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ const t=ch.dataset.t; if(S.types.has(t)){S.types.delete(t);ch.classList.remove('on');}else{S.types.add(t);ch.classList.add('on');} render(); });
  mgr.onchange=()=>{S.mgr=mgr.value;render();};
  document.getElementById('fDir').onchange=e=>{S.dir=e.target.value;render();};
  document.getElementById('fDeal').oninput=e=>{S.deal=e.target.value.trim();render();};
  document.getElementById('fOrd').onchange=e=>{S.ord=e.target.value;render();};
  let qt; document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();render();},180);};
  document.getElementById('expAll').onclick=()=>{ document.querySelectorAll('.deal').forEach(d=>toggle(d,true)); };
  document.getElementById('sub').textContent =
    `${DATA.from?DATA.from.slice(0,10):''} → ${DATA.to?DATA.to.slice(0,10):''} · ${DATA.days} дн · сделок в скоупе ${DATA.dealsScanned||0} · снимок ${BAKED_AT?BAKED_AT.slice(0,16).replace('T',' '):''}`;
}

function matchEvent(e){
  if(S.dir && e.dir!==S.dir) return false;
  if(S.types.size && !S.types.has(e.type)) return false;
  if(S.q){ const q=S.q; if(!((e.body&&e.body.toLowerCase().indexOf(q)>=0)||(e.who&&e.who.toLowerCase().indexOf(q)>=0)||(e.title&&e.title.toLowerCase().indexOf(q)>=0)||(e.dealTitle&&e.dealTitle.toLowerCase().indexOf(q)>=0))) return false; }
  return true;
}
function group(){
  const map = new Map();
  for(const e of DATA.events){
    if(S.mgr && e.mgr!==S.mgr) continue;
    if(S.deal && String(e.dealId).indexOf(S.deal)<0) continue;
    if(!matchEvent(e)) continue;
    let g = map.get(e.dealId);
    if(!g){ g={id:e.dealId,title:e.dealTitle,mgr:e.mgr,events:[],chans:{},last:0}; map.set(e.dealId,g); }
    g.events.push(e); if(e.ts>g.last)g.last=e.ts; g.chans[e.type]=(g.chans[e.type]||0)+1;
  }
  const arr=[...map.values()];
  arr.forEach(g=>g.events.sort((a,b)=>a.ts-b.ts));
  arr.sort((a,b)=> S.ord==='desc' ? b.last-a.last : a.last-b.last);
  return arr;
}
function chanIcons(chans){
  return Object.keys(chans).sort((a,b)=>chans[b]-chans[a]).slice(0,5).map(t=>`<i><b style="background:${typeColor(t)}"></b>${chans[t]}</i>`).join('');
}
function dealHTML(g, idx){
  const link = `<a href="${PORTAL}/crm/deal/details/${esc(g.id)}/" target="_blank" onclick="event.stopPropagation()">${esc(g.id)}</a>`;
  return `<div class="deal" data-idx="${idx}">
    <div class="dhead">
      <span class="arw">▸</span>
      <span class="did">${link}</span>
      <span class="dttl" title="${esc(g.title)}">${esc(g.title)}</span>
      <span class="dmgr">${esc(g.mgr)}</span>
      <span class="dchips">${chanIcons(g.chans)}</span>
      <span class="dmeta">${g.events.length} соб · ${fmtDay(g.last)}</span>
    </div>
    <div class="thread" style="display:none"></div>
  </div>`;
}
function evHTML(e){
  const c=typeColor(e.type);
  const dir = e.dir==='входящее'?'<span class="dir-in">←</span>':e.dir==='исходящее'?'<span class="dir-out">→</span>':'<span class="dir-n">·</span>';
  const st = e.status?`<span class="st">${esc(e.status)}${e.dur?' · '+esc(e.dur):''}</span>`:'';
  const rec = e.link?`<a class="rec" href="${esc(e.link)}" target="_blank">запись</a>`:'';
  const ttl = e.title?`<b>${esc(e.title)}: </b>`:'';
  return `<div class="ev">
    <span class="t">${fmtTime(e.dt)}</span>
    <span><span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}55">${esc(e.type)}</span></span>
    <span>${dir}</span>
    <span class="who">${esc(e.who)}</span>
    <span class="body">${ttl}${esc(e.body)}${st}${rec}</span>
  </div>`;
}
function toggle(el, forceOpen){
  const th=el.querySelector('.thread'), arw=el.querySelector('.arw');
  const open = th.style.display!=='none';
  if(open && forceOpen) return;
  if(!open){
    if(!th.dataset.filled){ const g=VIEW[+el.dataset.idx]; th.innerHTML=g.events.map(evHTML).join(''); th.dataset.filled='1'; }
    th.style.display=''; arw.textContent='▾';
  } else { th.style.display='none'; arw.textContent='▸'; }
}
function render(){
  VIEW = group();
  const show = VIEW.slice(0, DEAL_LIMIT);
  const list=document.getElementById('list');
  list.innerHTML = show.length ? show.map((g,i)=>dealHTML(g,i)).join('') : `<div class="empty">по этому фильтру диалогов нет</div>`;
  list.querySelectorAll('.deal').forEach(d=>d.querySelector('.dhead').onclick=()=>toggle(d));
  const totEv = VIEW.reduce((s,g)=>s+g.events.length,0);
  document.getElementById('stat').textContent = `сделок: ${VIEW.length}${VIEW.length>DEAL_LIMIT?` (показаны первые ${DEAL_LIMIT}, сузьте фильтр)`:''} · событий: ${totEv}`;
  document.getElementById('foot').textContent = `Всего в снимке ${DATA.events.length} событий по ${DATA.dealsWithEvents||0} сделкам за ${DATA.days} дн. Клик по сделке - развернуть диалог; клик по ID - карточка в Bitrix24.`;
}
initControls(); render();
</script>
</body>
</html>
