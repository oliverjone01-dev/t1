name: Deploy GENGLASS plan calculator to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/genglass-sales-calculator-8o56u3
    paths:
      - genglass-plan-calculator/**
      - .github/workflows/deploy-plan-calculator.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Страховка - фамилии ростера не уходят в Pages открытым текстом
        run: |
          ROSTER='Лакомова|Маслова|Кубанова|Шура-Бура|Лысанова|Платонова|Лысенко|Безмащук|Белов|Мавлина|Преснякова'
          if grep -rInE "$ROSTER" genglass-plan-calculator/; then
            echo "::error::Найдены фамилии ростера в деплоящейся папке - публикация остановлена. Персональные данные уходят только запечатанными (решение Ивана 08.08.2026)."
            exit 1
          fi
          echo "Ростер чист."
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: genglass-plan-calculator
      - id: deployment
        uses: actions/deploy-pages@v4
