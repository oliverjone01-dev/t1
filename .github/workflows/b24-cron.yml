name: B24 snapshots cron (планировщик на main)

# GitHub запускает расписание (cron) ТОЛЬКО из воркфлоу на дефолтной ветке (main).
# Данные РОПа живут на ветке rop-dashboard-v1, поэтому b24-snapshots.yml там по крону
# не срабатывал. Этот планировщик живёт на main: по расписанию чекаутит rop-dashboard-v1,
# снимает Bitrix, коммитит свежие данные туда и дёргает публикацию /rop/ (deploy-pages).
# Ручной запуск - через workflow_dispatch.
#
# ДВА слота в день - страховка: GitHub schedule best-effort, события могут дропаться
# (03.07.2026 утренний слот не сработал вовсе). Если утренний прошёл, дневной просто
# снимет более свежие данные - это плюс, не минус.

on:
  schedule:
    - cron: "17 5 * * *" # ~08:17 МСК, основной
    - cron: "47 9 * * *" # ~12:47 МСК, страховочный (и заодно освежает данные к обеду)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # для dispatch deploy-pages

concurrency:
  group: b24-rop-data
  cancel-in-progress: true

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
  B24_PORTAL: https://glassmemory.bitrix24.ru # домен портала для кликабельных ID (не секрет)
  DATA_BRANCH: rop-dashboard-v1

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rop-dashboard-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Проверить секрет
        run: |
          set -euo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then
            echo "::error::Секрет B24_WEBHOOK_URL не задан (Settings -> Secrets -> Actions)."; exit 1
          fi
          echo "Секрет на месте."

      - name: Снимок Bitrix -> rop/data/rop.json
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/fetch-rop.ts
          echo "Размер данных: $(du -h rop/data/rop.json | cut -f1)"

      - name: Запечь дашборд (build-rop) -> public/rop-command.html
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/build-rop.ts
          echo "Дашборд: $(du -h public/rop-command.html | cut -f1)"

      # Офис-дашборд живёт в СВОЕЙ ветке office-dashboard-v1: копируем туда свежий
      # снимок лидов и запекаем build-office там же. Падение не валит РОП-снимок.
      - name: Обновить офис-дашборд (ветка office-dashboard-v1)
        continue-on-error: true
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch origin office-dashboard-v1
          git -C "$GITHUB_WORKSPACE" worktree add /tmp/office origin/office-dashboard-v1
          mkdir -p /tmp/office/analytics-mvp/rop/data /tmp/office/analytics-mvp/rop/plan
          cp rop/data/rop.json /tmp/office/analytics-mvp/rop/data/rop.json
          # план выручки ОП (для декомпозиции плана офис-менеджера) - если есть в РОП-ветке
          cp rop/plan/plan.json /tmp/office/analytics-mvp/rop/plan/plan.json 2>/dev/null || true
          cd /tmp/office/analytics-mvp
          npm ci
          npx tsx src/scripts/b24/build-office.ts
          cd /tmp/office
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-mvp/rop/data/rop.json analytics-mvp/rop/plan analytics-mvp/public/office-command.html
          if git diff --staged --quiet; then echo "офис: снимок без изменений"; exit 0; fi
          git commit -m "data(office): снимок лидов Bitrix24 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin office-dashboard-v1 && git push origin HEAD:office-dashboard-v1; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "office push не удался"; exit 1

      - name: Commit + push в rop-dashboard-v1
        id: commit
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/rop/data analytics-mvp/public/rop-command.html
          if git diff --staged --quiet; then echo "снимок без изменений"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(rop): ночной снимок Bitrix24 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$DATA_BRANCH" && git push origin "HEAD:$DATA_BRANCH"; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "push не удался"; exit 1

      - name: Триггер деплоя /rop/ (deploy-pages на main)
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Публикация /rop/ запрошена."
