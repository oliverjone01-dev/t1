  const units = _cmpUnits(rows);
  if(units.length === 0) return '<div class="cmp-empty">Нет данных для разреза</div>';
  const N = units.length;
  // Конфиг метрик под выбранный вид
  const CFG = {
    rev:   { bar:'rev',  line:'margin', barU:'млн ₽', lineU:'%',
             bF:v=>fmt(v,1),  lF:v=>fmt(v,1),
             names:['Выручка А','Выручка Б','Маржа А','Маржа Б'] },
    ord:   { bar:'ord',  line:'avgp',   barU:'шт',    lineU:'тыс ₽',
             bF:v=>fmt0(v),   lF:v=>fmt0(v),
             names:['Заказы А','Заказы Б','Ср.цена А','Ср.цена Б'] },
    price: { bar:'avgp', line:'rev',    barU:'тыс ₽', lineU:'млн ₽',
             bF:v=>fmt0(v),   lF:v=>fmt(v,1),
             names:['Ср.цена А','Ср.цена Б','Выручка А','Выручка Б'] },
  }[view];
  // Период А — primary (фиолетовый бар + яркая solid линия), Период Б — reference (бирюзовый + dashed).
  // Линии overlay — оранжевые для всех видов (унифицировано в прошлой итерации).
  const PAL = {
    aPrim: 'url(#cmp-grad-a)',  // Период А — фиолетовый (главный)
    bRef:  'url(#cmp-grad-b)',  // Период Б — бирюзовый (референс)
    lA:    'hsl(38, 90%, 58%)', // Линия Период А (solid, яркий оранжевый)
    lB:    'hsl(38, 78%, 72%)', // Линия Период Б (dashed, светлый оранжевый)
  };
  // Маппинг ключей метрик в имена полей юнита
  const mapKey = { rev:['revA','revB'], ord:['ordA','ordB'], margin:['marginA','marginB'], avgp:['avgpA','avgpB'] };
  const [kBA, kBB] = mapKey[CFG.bar]   || mapKey.rev;
  const [kLA, kLB] = mapKey[CFG.line]  || mapKey.margin;
  const bA = units.map(u => u[kBA]), bB = units.map(u => u[kBB]);
  const lA = units.map(u => u[kLA]), lB = units.map(u => u[kLB]);
  // SVG геометрия — top margin под дельта-проценты; bottom — под наклон подписей (период убран в верхнюю плашку).
  const rotateLbls = N > 7;
  const W = 1240, H = rotateLbls ? 400 : 360, M = { l:62, r:62, t:44, b: rotateLbls ? 76 : 32 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const maxBar  = Math.max(...bA, ...bB, 0.001);
  const maxLine = Math.max(...lA, ...lB, 0.001);
  const bucketW = iw / N, gap = 2;
  const barW = Math.max(3, (bucketW - 10 - gap) / 2);
  // Сетка и оси
  const yT = 4; const grid = [];
  for(let i = 0; i <= yT; i++){
    const y = M.t + ih - (i / yT * ih);
    grid.push(`<line class="cmp-grid" x1="${M.l}" y1="${y}" x2="${M.l + iw}" y2="${y}"/>`);
    grid.push(`<text class="cmp-ax" x="${M.l - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${CFG.bF(i/yT*maxBar)}</text>`);
    grid.push(`<text class="cmp-ax" x="${M.l + iw + 8}" y="${(y + 3.5).toFixed(1)}">${CFG.lF(i/yT*maxLine)}</text>`);
  }
  // Бары — А слева (главный, фиолетовый), Б справа (референс, бирюзовый).
  // Закруглённые верхушки, дельта = (А - Б) / |Б| · 100% — насколько А отклонён от базы Б.
  const bars = [], pcts = [];
  const rx = 3;
  for(let i = 0; i < N; i++){
    const cx = M.l + (i + 0.5) * bucketW;
    const xLeft  = cx - barW - gap/2;  // А
    const xRight = cx + gap/2;          // Б
    let yA_ = M.t + ih - (bA[i] / maxBar * ih);
    let yB_ = M.t + ih - (bB[i] / maxBar * ih);
    yA_ = Math.min(M.t + ih, yA_); yB_ = Math.min(M.t + ih, yB_);  // не уходим ниже базовой линии (отриц. нетто)
    const hA_ = Math.max(0, M.t + ih - yA_);
    const hB_ = Math.max(0, M.t + ih - yB_);
    bars.push(`<rect class="cmp-ts-bar" x="${xLeft.toFixed(1)}"  y="${yA_.toFixed(1)}" width="${barW.toFixed(1)}" height="${hA_.toFixed(1)}" rx="${rx}" fill="${PAL.aPrim}"/>`);
    bars.push(`<rect class="cmp-ts-bar" x="${xRight.toFixed(1)}" y="${yB_.toFixed(1)}" width="${barW.toFixed(1)}" height="${hB_.toFixed(1)}" rx="${rx}" fill="${PAL.bRef}"/>`);
    // Фактические значения над каждым баром: А (фиолетовый) и Б (бирюзовый)
    if(bA[i] > 0) pcts.push(`<text class="cmp-ts-val" x="${(xLeft+barW/2).toFixed(1)}" y="${Math.max(M.t+7, yA_-4).toFixed(1)}" text-anchor="middle" fill="hsl(270,62%,76%)">${CFG.bF(bA[i])}</text>`);
    if(bB[i] > 0) pcts.push(`<text class="cmp-ts-val" x="${(xRight+barW/2).toFixed(1)}" y="${Math.max(M.t+7, yB_-4).toFixed(1)}" text-anchor="middle" fill="hsl(190,72%,68%)">${CFG.bF(bB[i])}</text>`);
  }
  // Линии (line-метрика)
  const buildPath = (vals, scale) => vals.map((v,i) => {
    const x = M.l + (i + 0.5) * bucketW;
    const y = M.t + ih - (v / scale * ih);
    return (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const pathA = buildPath(lA, maxLine);
  const pathB = buildPath(lB, maxLine);
  // X-метки — имена юнитов (категория / модель / артикул)
  const xLabels = [];
  // Динамическая длина текста: ширина бакета / средняя ширина символа
  const maxLblChars = Math.max(6, Math.floor(bucketW / (rotateLbls ? 5.5 : 7)));
  for(let i = 0; i < N; i++){
    const cx = M.l + (i + 0.5) * bucketW;
    const lbl = _trunc(units[i].name, rotateLbls ? 22 : maxLblChars).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    if(rotateLbls){
      const ty = M.t + ih + 10;
      xLabels.push(`<text class="cmp-ax cmp-ax-rot" transform="rotate(-35 ${cx.toFixed(1)} ${ty.toFixed(1)})" x="${cx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="end">${lbl}</text>`);
    } else {
      xLabels.push(`<text class="cmp-ax" x="${cx.toFixed(1)}" y="${(M.t + ih + 18).toFixed(1)}" text-anchor="middle">${lbl}</text>`);
    }
  }
  // Подписи единиц над осями
  const axUnits = `<text class="cmp-ax-unit" x="${M.l - 8}" y="${M.t - 8}" text-anchor="end">${CFG.barU}</text>
                   <text class="cmp-ax-unit" x="${M.l + iw + 8}" y="${M.t - 8}">${CFG.lineU}</text>`;
  // Подписи периодов А и Б теперь показываются в верхней плашке #cmp-info (не в SVG).
  // Легенда в порядке А → Б. Линии overlay — оранжевые (А solid, Б dashed).
  const legend = `<div class="cmp-ts-legend">
    <div class="cmp-lg-item"><span class="cmp-lg-bar" style="background:linear-gradient(180deg,hsl(270,42%,64%),hsl(262,28%,38%))"></span><span style="color:var(--ink-2)">${CFG.names[0]}</span></div>
    <div class="cmp-lg-item"><span class="cmp-lg-bar" style="background:linear-gradient(180deg,hsl(190,58%,60%),hsl(188,50%,38%))"></span><span style="color:var(--ink-2)">${CFG.names[1]}</span></div>
    <div class="cmp-lg-item" style="color:${PAL.lA}"><span class="cmp-lg-line"></span><span style="color:var(--ink-2)">${CFG.names[2]}</span></div>
    <div class="cmp-lg-item" style="color:${PAL.lB}"><span class="cmp-lg-line dashed"></span><span style="color:var(--ink-2)">${CFG.names[3]}</span></div>
  </div>`;
  // Сводка-итог в порядке А → Б, дельта = (Б - А) / |А| · 100% (Б относительно базы А)
  const sumA = bA.reduce((s,v) => s+v, 0), sumB = bB.reduce((s,v) => s+v, 0);
  const avgLA = lA.reduce((s,v) => s+v, 0) / Math.max(1, lA.length);
  const avgLB = lB.reduce((s,v) => s+v, 0) / Math.max(1, lB.length);
  const dltSmall = (bVal, aVal, posGood = true) => {
    if(!isFinite(bVal) || !isFinite(aVal) || aVal === 0) return '<span class="dlt n">—</span>';
    const d = (bVal - aVal) / Math.abs(aVal) * 100;
    if(Math.abs(d) < 0.5) return '<span class="dlt n">±0%</span>';
    const good = posGood ? d > 0 : d < 0;
    return `<span class="dlt ${good?'up':'dn'}">${d > 0 ? '▲+' : '▼'}${d.toFixed(1)}%</span>`;
  };
  const summary = `<div class="cmp-ts-summary">
    <div><span class="sl">${CFG.names[0]}:</span><span class="sv">${CFG.bF(sumA)} ${CFG.barU}</span></div>
    <div><span class="sl">${CFG.names[1]}:</span><span class="sv">${CFG.bF(sumB)} ${CFG.barU}</span> ${dltSmall(sumB, sumA)}</div>
    <div><span class="sl">${CFG.names[2]} ср.:</span><span class="sv">${CFG.lF(avgLA)} ${CFG.lineU}</span></div>
    <div><span class="sl">${CFG.names[3]} ср.:</span><span class="sv">${CFG.lF(avgLB)} ${CFG.lineU}</span> ${dltSmall(avgLB, avgLA)}</div>
  </div>`;
  const subtitle = `<div class="cmp-ts-subtitle">Разрез: ${_cmpBreakdownLabel()} · юнитов: <b>${N}</b>${state.pt.model.length === 1 ? ' (топ-20 по выручке А)' : ''}</div>`;
  const defs = `<defs>
    <linearGradient id="cmp-grad-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(270, 42%, 64%)"/>
      <stop offset="100%" stop-color="hsl(262, 28%, 38%)"/>
    </linearGradient>
    <linearGradient id="cmp-grad-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(190, 58%, 60%)"/>
      <stop offset="100%" stop-color="hsl(188, 50%, 38%)"/>
    </linearGradient>
  </defs>`;
  // Расшифровка артикулов — только в режиме "юниты = артикулы"
  const decoderHTML = (state.pt.model.length === 1) ? renderArticleDecoder(units) : '';
  return legend + subtitle + `<div class="cmp-ts-wrap"><svg class="cmp-ts-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${defs}
    ${axUnits}
    ${grid.join('')}
    ${bars.join('')}
    ${pcts.join('')}
    <path d="${pathA}" stroke="${PAL.lA}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${pathB}" stroke="${PAL.lB}" stroke-width="1.9" stroke-dasharray="5,3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    ${xLabels.join('')}
  </svg></div>` + summary + decoderHTML;
}

// Доля покрытия каждого месяца выбранным диапазоном дней [startIdx..endIdx].
function monthDayOverlap(range){
  const f = new Array(NMONTHS).fill(0);
  let acc = 0;
  for(let m = 0; m < NMONTHS; m++){
    const mStart = acc, mEnd = acc + DAYS_IN_MONTH_2025[m] - 1; acc += DAYS_IN_MONTH_2025[m];
    const lo = Math.max(range.startIdx, mStart), hi = Math.min(range.endIdx, mEnd);
    if(hi >= lo) f[m] = (hi - lo + 1) / DAYS_IN_MONTH_2025[m];
  }
  return f;
}
// Реальные rev/cost/orders модели/артикула за диапазон.
// Основной путь: реальные ДНЕВНЫЕ ряды OZON (выручка + заказы) за точное окно;
// себестоимость периода = заказы периода × юнит-С/С (полная С/С ÷ полные заказы).
// Фолбэк (нет дневного ряда): помесячная доля по дням окна (mr/mc/mo × overlap).
function productPeriod(p, range){
  const PDR = window.__PRODUCT_DAILY_REV, PDO = window.__PRODUCT_DAILY;
  const key = (p.nm != null) ? p.nm : p.sku; // модель -> nm, вариант -> sku(артикул)
  if(PDR && PDO && key != null && PDR[key]){
    const rev = sumRange(PDR[key], range.startIdx, range.endIdx);     // млн ₽
    const orders = sumRange(PDO[key], range.startIdx, range.endIdx);  // шт
    const fullOrd = (p.mo ? p.mo.reduce((s,v)=>s+v,0) : 0);
    const fullCost = (p.mc ? p.mc.reduce((s,v)=>s+v,0) : (p.cost||0));
    const unitCost = fullOrd > 0 ? fullCost / fullOrd : 0;
    return { rev, cost: orders * unitCost, orders };
  }
  const f = monthDayOverlap(range);
  let rev = 0, cost = 0, orders = 0;
  const mr = p.mr || [], mc = p.mc || [], mo = p.mo || [];
  for(let m = 0; m < NMONTHS; m++){ rev += (mr[m]||0)*f[m]; cost += (mc[m]||0)*f[m]; orders += (mo[m]||0)*f[m]; }
  return { rev, cost, orders };
}
// Диапазон дней из произвольных дат (период Б в сравнении).
function rangeFromDates(fromStr, toStr){
  const yearStart = new Date('2025-01-01T00:00:00Z');
  let a = Math.round((new Date(fromStr) - yearStart) / 86400000);
  let b = Math.round((new Date(toStr)   - yearStart) / 86400000);
  if(isNaN(a) || isNaN(b)) return { startIdx: 0, endIdx: NDAYS-1 };
  if(a > b){ const t=a; a=b; b=t; }                       // свап, если даты перепутаны
  return { startIdx: Math.max(0, Math.min(NDAYS-1, a)),    // кламп к доступным данным
           endIdx:   Math.max(0, Math.min(NDAYS-1, b)) };
}
function renderProducts(){
  let rows = PRODUCTS.slice();
  if(_selOn(state.pt.category)) rows = rows.filter(p => state.pt.category.includes(p.groupId));
  if(_selOn(state.pt.subcat))   rows = rows.filter(p => state.pt.subcat.includes(p.subcatId));
  if(_selOn(state.pt.abc))      rows = rows.filter(p => state.pt.abc.includes(p.abc));
  if(_selOn(state.pt.line))     rows = rows.filter(p => state.pt.line.includes(deriveLine(p)));
  if(_selOn(state.pt.model))    rows = rows.filter(p => state.pt.model.some(mv => modelMatches(p, mv)));

  const sortCol = state.pt.sortCol;
  const dir = state.pt.sortDir === 'desc' ? -1 : 1;

  // Масштабируем выручку, заказы и себестоимость под выбранный период.
  // Маржа в % инвариантна к периоду (отношение cost/rev постоянно).
  // Для продуктов с variants все базовые метрики уже агрегированы из вариантов.
  // Реальный разрез по периоду: для каждой модели суммируем её помесячные ряды
  // (mr/mc/mo) с учётом доли покрытия месяцев выбранным окном. Маржа считается из
  // реальных rev/cost периода, поэтому A и Б отличаются по-настоящему у каждой модели.
  const _rangeA = state.compare.enabled ? rangeFromDates(state.compare.aFrom, state.compare.aTo) : getDateRange();
  const _rangeB = state.compare.enabled ? rangeFromDates(state.compare.from, state.compare.to) : null;
  rows = rows.map(p => {
    const agg = aggregateProduct(p);
    const pa = productPeriod(p, _rangeA);
    const pb = _rangeB ? productPeriod(p, _rangeB) : { rev:0, cost:0, orders:0 };
    const revPeriod = pa.rev, costPeriod = pa.cost;
    const margin = revPeriod > 0 ? ((revPeriod - costPeriod) / revPeriod) * 100 : 0;
    // Доля периода от полного объёма модели — пропорциональный разрез артикулов.
    const full = (p.mr ? p.mr.reduce((s,v)=>s+v,0) : agg.rev) || 0;
    const _ratio  = full > 0 ? revPeriod / full : 0;
    const _ratioB = full > 0 ? pb.rev   / full : 0;
    return {
      ...p,
      _agg: agg,
      _ratio, _ratioB,
      revPeriod,
      costPeriod,
      margin,
      ordersPeriod: Math.round(pa.orders),
      // Сравнение: реальные метрики периода Б
      revPeriodB:    pb.rev,
      costPeriodB:   pb.cost,
      ordersPeriodB: Math.round(pb.orders),
      returns: agg.returns,
      leadDays: agg.leadDays,
      stockQty: agg.stockQty,
    };
  });

  rows.sort((a,b) => {
    let av, bv;
    if(sortCol === 'name'){ av = a.nm; bv = b.nm; return av.localeCompare(bv,'ru') * dir; }
    if(sortCol === 'rev')         { av = a.revPeriod; bv = b.revPeriod; }
    else if(sortCol === 'cost')   { av = a.costPeriod; bv = b.costPeriod; }
    else if(sortCol === 'margin') { av = a.margin; bv = b.margin; }
    else if(sortCol === 'orders') { av = a.ordersPeriod; bv = b.ordersPeriod; }
    else if(sortCol === 'avgp')   { av = a.ordersPeriod>0 ? a.revPeriod/a.ordersPeriod : 0; bv = b.ordersPeriod>0 ? b.revPeriod/b.ordersPeriod : 0; }
    else if(sortCol === 'returns'){ av = a.returns; bv = b.returns; }
    else if(sortCol === 'lead')   { av = a.leadDays; bv = b.leadDays; }
    else if(sortCol === 'stockq') { av = a.stockQty; bv = b.stockQty; }
    else if(sortCol === 'abc')    { av = a.abc; bv = b.abc; return av.localeCompare(bv) * dir; }
    else if(sortCol === 'cat')    { av = a.groupId; bv = b.groupId; return av.localeCompare(bv) * dir; }
    else { av = a.revPeriod; bv = b.revPeriod; }
    return (av - bv) * dir;
  });

  const sortClass = col => sortCol === col ? `sorted ${state.pt.sortDir === 'asc' ? 'asc' : ''}` : '';

  // Кастомные dropdown — генерируем HTML с .dd-btn и .dd-menu
  const arrowSvg = `<svg class="dd-btn-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4.5l3 3 3-3"/></svg>`;
  const chevronSvg = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5l3.5 3.5L4 9.5"/></svg>`;

  // Каскадное вычисление опций фильтров: Класс → Категория → Подкатегория → Линия → Модель.
  const abcOptions = [
    {val:'all', label:'Все классы'},
    {val:'A',   label:'Класс A'},
    {val:'B',   label:'Класс B'},
    {val:'C',   label:'Класс C'},
  ];
  const passesClass  = p => _selHas(state.pt.abc, p.abc);
  const passesCat    = p => _selHas(state.pt.category, p.groupId);
  const passesSubcat = p => _selHas(state.pt.subcat, p.subcatId);
  const passesLine   = p => _selHas(state.pt.line, deriveLine(p));

  const validGroupIds = new Set(PRODUCTS.filter(passesClass).map(p => p.groupId));
  const catOptions = [
    {val:'all', label:'Все категории'},
    ...CAT_TREE.filter(g => validGroupIds.has(g.id)).map(g => ({val:g.id, label:g.name})),
  ];

  const subcatPool = PRODUCTS.filter(p => passesClass(p) && passesCat(p));
  const validSubcatIds = new Set(subcatPool.map(p => p.subcatId));
  const subcatOptions = [
    {val:'all', label:'Все подкатегории'},
    ...CAT_TREE.flatMap(g => g.children.filter(c => validSubcatIds.has(c.id)).map(c => ({val:c.id, label:`${c.name} · ${g.name}`}))),
  ];

  const linePool = PRODUCTS.filter(p => passesClass(p) && passesCat(p) && passesSubcat(p));
  const lineSet = new Set();
  linePool.forEach(p => lineSet.add(deriveLine(p)));
  const lineOptions = [
    {val:'all', label:'Все линии'},
    ...[...lineSet].sort((a,b) => a.localeCompare(b, 'ru')).map(l => ({val:l, label:l})),
  ];
  const modelPool = PRODUCTS.filter(p => passesClass(p) && passesCat(p) && passesSubcat(p) && passesLine(p));
  const modelOptions = [{val:'all', label:'Все модели'}, ...modelPool.map(p => ({val:p.nm, label:p.nm}))];

  const buildDD = (id, sel, options) => {
    const currentLabel = _selLabel(sel, options[0].label, options);
    const opts = options.map(o => {
      const on = o.val === 'all' ? !_selOn(sel) : sel.includes(o.val);
      return `<button class="dd-opt ${on ? 'selected' : ''}" data-val="${o.val}">${o.label}</button>`;
    }).join('');
    return `<div class="dd" data-dd="${id}">
      <button class="dd-btn">
        <span class="dd-btn-label">${currentLabel}</span>
        ${arrowSvg}
      </button>
      <div class="dd-menu">${opts}</div>
    </div>`;
  };

  const hasActive = _selOn(state.pt.category) || _selOn(state.pt.subcat) || _selOn(state.pt.abc) || _selOn(state.pt.line) || _selOn(state.pt.model);

  // ─── Рендер строк: parent + (опц.) variant rows ──────────────────────────
  const ND = '<span class="pt-nd">нет данных</span>';
  const renderStockCell = (stockQty, _stk) => {
    const stockClass = stockQty === 0 ? 'OOS' : (stockQty <= 20 ? 'LOW' : 'OK');
    const stockLbl = stockQty === 0 ? 'нет' : (stockQty <= 20 ? 'мало' : 'есть');
    return `<td class="right pt-stock-cell ${stockClass}">
      <span class="num">${fmt0(stockQty)}</span><span class="pt-stock-lbl">${stockLbl}</span>
    </td>`;
  };

  // Хелпер: ширина бара ячейки относительно максимума в группе (для data-bar заливки).
  const barPct = (val, max) => max > 0 ? Math.max(0, Math.min(100, val/max*100)) : 0;
  const bAttr  = (val, max, fill) => `style="--bw:${barPct(val,max).toFixed(1)}%;--bf:${fill}"`;
  // Дельта-бейдж (режим сравнения). posGood=true → "+" хорошо (rev/ord), false → "+" плохо (cost).
  const dlt = (a, b, posGood = true) => {
    if(!state.compare.enabled) return '';
    if(!isFinite(a) || !isFinite(b) || b === 0) return ' <span class="dlt n">—</span>';
    const d = (a - b) / Math.abs(b) * 100;
    if(Math.abs(d) < 0.5)   return ' <span class="dlt n">±0%</span>';
    const good  = posGood ? d > 0 : d < 0;
    const arrow = d > 0 ? '▲' : '▼';
    const sign  = d > 0 ? '+' : '';
    return ` <span class="dlt ${good?'up':'dn'}">${arrow}${sign}${d.toFixed(1)}%</span>`;
  };
  // Заливка ячеек ограничена: rev (палитра ART_RANK/SIZE_RANK), ord (палитра ART_ORD/SIZE_RANK).
  // Cost, margin, returns, lead, stock, avg.price — без data-bar.

  // Лист дерева (артикул-цвет / финиш). Окрашивается по рангу + data-bar в магнитудных колонках.
  const renderLeafRow = (a, parentRatio, r, depth, mx, pRatioB) => {
    const _pa = a.mr ? productPeriod(a, _rangeA) : {rev:a.rev*parentRatio, cost:a.cost*parentRatio, orders:a.orders*parentRatio};
    const rev = _pa.rev, cost = _pa.cost;
    const ord = Math.round(_pa.orders);
    const margin = rev > 0 ? ((rev - cost) / rev) * 100 : 0;
    const retClass = a.returns <= 1 ? 'good' : (a.returns <= 2 ? 'warn' : 'bad');
    const marginCls = margin >= 45 ? 'good' : (margin >= 30 ? 'warn' : 'bad');
    const kp = ord > 0 ? rev/ord*1000 : 0;
    // Метрики периода Б — реальные, из помесячных рядов артикула
    const _pb = (a.mr && _rangeB) ? productPeriod(a, _rangeB) : {rev:a.rev*(pRatioB||0), cost:a.cost*(pRatioB||0), orders:a.orders*(pRatioB||0)};
    const revB  = _pb.rev;
    const costB = _pb.cost;
    const ordB  = Math.round(_pb.orders);
    return `<tr class="pt-row-variant pt-leaf depth${depth}" style="--rc:${r.color}" data-tip="${a.sku}|Описание|${a.sub}|Выручка|${fmt(rev,2)} млн ₽|Рентабельность|${a.costNA?'нет данных':fmt(margin,1)+'%'}|Заказы|${fmt0(ord)} шт|Ср.цена|${ord>0?fmt0(kp)+' тыс ₽':'—'}|Склад|нет данных|Ранг в модели|#${r.rank}">
      <td class="pt-rank pt-rank-dot"><span class="rc-dot" style="background:${r.color}"></span>${r.rank}</td>
      <td><div class="pt-name-cell pt-indent"><div class="pt-name-text">
        <div class="pt-name-main">${a.sku}</div>
        <div class="pt-name-sub">${a.sub}</div>
      </div></div></td>
      <td class="right pt-rev pt-bar-cell" ${bAttr(rev, mx.rev, r.fill)}><span class="num">${fmt(rev,2)}</span><span class="u">млн ₽</span>${dlt(rev, revB)}</td>
      <td class="right pt-cost">${a.costNA?ND:`<span class="num">${fmt(cost,2)}</span><span class="u">млн ₽</span>${dlt(cost, costB, false)}`}</td>
      <td class="right pt-margin ${a.costNA?'':marginCls}">${a.costNA?ND:`<span class="num">${fmt(margin,1)}%</span>`}</td>
      <td class="right pt-num pt-bar-cell" ${bAttr(ord, mx.ord, r.ordFill)}><span class="num">${fmt0(ord)}</span>${dlt(ord, ordB)}</td>
      <td class="right pt-avgp"><span class="num">${ord>0?fmt0(kp):'—'}</span><span class="u">тыс ₽</span></td>
      <td class="right pt-ret">${ND}</td>
      <td class="right pt-stock-cell">${ND}</td>
    </tr>`;
  };

  // Размер (2-й уровень под моделью). Раскрывается в артикулы. Окрашен по рангу + data-bar в магнитудных колонках.
  const renderSizeRow = (v, p, parentRatio, r, sizeKey, expanded, mx) => {
    const rev = v.rev * parentRatio, cost = v.cost * parentRatio;
    const ord = Math.round(v.orders * parentRatio);
    const margin = rev > 0 ? ((rev - cost) / rev) * 100 : 0;
    const retClass = v.returns <= 1 ? 'good' : (v.returns <= 2 ? 'warn' : 'bad');
    const marginCls = margin >= 45 ? 'good' : (margin >= 30 ? 'warn' : 'bad');
    const arts = buildArticles(v);
    const hasArts = arts && arts.length > 0;
    const kp = ord > 0 ? rev/ord*1000 : 0;
    // Метрики периода Б (если сравнение включено) — для дельт
    const ratioB = (p._ratioB || 0);
    const revB  = v.rev * ratioB;
    const costB = v.cost * ratioB;
    const ordB  = Math.round(v.orders * ratioB);
    return `<tr class="pt-row-variant pt-size${hasArts?' has-variants':''}${expanded?' expanded':''}" ${hasArts?`data-expand="${sizeKey}"`:''} style="--rc:${r.color}" data-tip="${v.sku}|Описание|${v.sub}|Выручка|${fmt(rev,2)} млн ₽|Рентабельность|${fmt(margin,1)}%|Заказы|${fmt0(ord)} шт|Ср.цена|${ord>0?fmt0(kp)+' тыс ₽':'—'}|Склад|${v.stockQty} шт|Ранг в модели|#${r.rank}${hasArts?'|Артикулов|'+arts.length:''}">
      <td class="pt-rank pt-rank-dot"><span class="rc-dot" style="background:${r.color}"></span>${r.rank}</td>
      <td><div class="pt-name-cell pt-indent">
        ${hasArts ? `<span class="pt-chev">${chevronSvg}</span>` : ''}
        <div class="pt-name-text">
          <div class="pt-name-main">${v.sku}</div>
          <div class="pt-name-sub">${v.sub}${hasArts?` · <span style="color:var(--accent);font-weight:600">${arts.length} арт.</span>`:''}</div>
        </div></div></td>
      <td class="right pt-rev pt-bar-cell" ${bAttr(rev, mx.rev, r.fill)}><span class="num">${fmt(rev,2)}</span><span class="u">млн ₽</span>${dlt(rev, revB)}</td>
      <td class="right pt-cost"><span class="num">${fmt(cost,2)}</span><span class="u">млн ₽</span>${dlt(cost, costB, false)}</td>
      <td class="right pt-margin ${marginCls}"><span class="num">${fmt(margin,1)}%</span></td>
      <td class="right pt-num pt-bar-cell" ${bAttr(ord, mx.ord, r.ordFill)}><span class="num">${fmt0(ord)}</span>${dlt(ord, ordB)}</td>
      <td class="right pt-avgp"><span class="num">${ord>0?fmt0(kp):'—'}</span><span class="u">тыс ₽</span></td>
      <td class="right pt-ret ${retClass}"><span class="num">${fmt(v.returns,1)}%</span></td>
      ${renderStockCell(v.stockQty, v.stk)}
    </tr>`;
  };

  // В режиме сравнения строки таблицы не нужны — будет графический вид
  const tbody = state.compare.enabled ? '' : (rows.length === 0
    ? `<tr><td colspan="9"><div class="pt-empty">Нет товаров под выбранными фильтрами. Сбрось селекторы выше.</div></td></tr>`
    : rows.map((p,i) => {
      const retClass = p.returns <= 1 ? 'good' : (p.returns <= 2 ? 'warn' : 'bad');
      const marginCls = p.margin >= 45 ? 'good' : (p.margin >= 30 ? 'warn' : 'bad');
      const hasVariants = p.variants && p.variants.length > 0;
      const isExpanded = state.pt.expanded.has(p.nm);
      const variantCount = hasVariants ? p.variants.length : 0;
      const childIsSize = hasVariants && p.variants.some(v => v.sizecode);
      const childWord = childIsSize ? `${variantCount} размеров` : `${variantCount} артикула`;
      const subText = hasVariants
        ? `${p.sub} · <span style="color:var(--accent);font-weight:600">${childWord}</span>`
        : p.sub;

      let html = `<tr class="pt-row${hasVariants?' has-variants':''}${isExpanded?' expanded':''}" ${hasVariants?`data-expand="${p.nm}"`:''} data-tip="${p.nm}|Выручка|${fmt(p.revPeriod,1)} млн ₽|Себестоимость|${p.costNA?'нет данных':fmt(p.costPeriod,1)+' млн ₽'}|Рентабельность|${p.costNA?'нет данных':fmt(p.margin,1)+'%'}|Заказы|${fmt0(p.ordersPeriod)} шт|Возвраты|нет данных|Склад|нет данных${hasVariants?'|'+(childIsSize?'Размеров':'Артикулов')+'|'+variantCount:''}">
        <td class="pt-rank">№${i+1}</td>
        <td>
          <div class="pt-name-cell">
            ${hasVariants ? `<span class="pt-chev">${chevronSvg}</span>` : ''}
            <div class="pt-name-text">
              <div class="pt-name-main">${p.nm}</div>
              <div class="pt-name-sub">${subText}</div>
            </div>
          </div>
        </td>
        <td class="right pt-rev"><span class="num">${fmt(p.revPeriod,1)}</span><span class="u">млн ₽</span>${dlt(p.revPeriod, p.revPeriodB)}</td>
        <td class="right pt-cost">${p.costNA?ND:`<span class="num">${fmt(p.costPeriod,1)}</span><span class="u">млн ₽</span>${dlt(p.costPeriod, p.costPeriodB, false)}`}</td>
        <td class="right pt-margin ${p.costNA?'':marginCls}">${p.costNA?ND:`<span class="num">${fmt(p.margin,1)}%</span>`}</td>
        <td class="right pt-num"><span class="num">${fmt0(p.ordersPeriod)}</span>${dlt(p.ordersPeriod, p.ordersPeriodB)}</td>
        <td class="right pt-avgp"><span class="num">${p.ordersPeriod>0 ? fmt0(p.revPeriod/p.ordersPeriod*1000) : '—'}</span><span class="u">тыс ₽</span></td>
        <td class="right pt-ret">${ND}</td>
        <td class="right pt-stock-cell">${ND}</td>
      </tr>`;

      if(hasVariants && isExpanded){
        if(childIsSize){
          // Уровень 2 — размеры, ранжируем по выручке внутри модели
          const sizeRank = rankGroup(p.variants, SIZE_RANK);
          // Макс. в единицах выбранного периода (умножаем на ratio — иначе при
          // коротких периодах верхний бар будет = ratio*100%, а не 100%).
          const sMx = {
            rev: Math.max(...p.variants.map(v => v.rev))    * p._ratio,
            ord: Math.max(...p.variants.map(v => v.orders)) * p._ratio,
          };
          const idxByRev = p.variants.map((v,idx) => idx).sort((a,b) => p.variants[b].rev - p.variants[a].rev);
          idxByRev.forEach(idx => {
            const v = p.variants[idx];
            const sizeKey = `${p.nm}::${v.sku}`;
            const sizeExpanded = state.pt.expanded.has(sizeKey);
            html += renderSizeRow(v, p, p._ratio, sizeRank.get(idx), sizeKey, sizeExpanded, sMx);
            if(sizeExpanded){
              const arts = buildArticles(v);
              if(arts && arts.length){
                const artRank = rankGroup(arts, ART_RANK, ART_ORD);
                const aMx = {
                  rev: Math.max(...arts.map(a => a.rev))    * p._ratio,
                  ord: Math.max(...arts.map(a => a.orders)) * p._ratio,
                };
                const aIdx = arts.map((a,ix) => ix).sort((x,y) => arts[y].rev - arts[x].rev);
                aIdx.forEach(ix => { html += renderLeafRow(arts[ix], p._ratio, artRank.get(ix), 3, aMx, p._ratioB); });
              }
            }
          });
        } else {
          // Уровень 2 = артикулы-цвета (комплекты): сразу строки артикулов с заливкой
          const _pv = p.variants.map(a => a.mr ? productPeriod(a, _rangeA) : {rev:a.rev*p._ratio, cost:a.cost*p._ratio, orders:a.orders*p._ratio});
          const artRank = rankGroup(p.variants.map((a,i) => ({rev: _pv[i].rev})), ART_RANK, ART_ORD);
          const aMx = {
            rev: Math.max(0, ..._pv.map(x => x.rev)),
            ord: Math.max(0, ..._pv.map(x => x.orders)),
          };
          const idxByRev = p.variants.map((v,ix) => ix).sort((x,y) => _pv[y].rev - _pv[x].rev);
          idxByRev.forEach(ix => { html += renderLeafRow(p.variants[ix], p._ratio, artRank.get(ix), 2, aMx, p._ratioB); });
        }
      }
      return html;
    }).join(''));

  $('#products').innerHTML = `
    <div class="card-h">
      <div>
        <div class="card-title">Товары</div>
        <div class="card-sub">клик по модели → артикулы · цвет точки = ранг по выручке · заливка ячеек = магнитуда внутри группы · класс / категория — в фильтрах</div>
      </div>
    </div>
    <div class="pt-filters">
      <div class="pt-filter-grp">
        <span class="pt-filter-lbl">Класс</span>
        ${buildDD('abc', state.pt.abc, abcOptions)}
      </div>
      <div class="pt-filter-grp">
        <span class="pt-filter-lbl">Категория</span>
        ${buildDD('category', state.pt.category, catOptions)}
      </div>
      <div class="pt-filter-grp">
        <span class="pt-filter-lbl">Подкатегория</span>
        ${buildDD('subcat', state.pt.subcat, subcatOptions)}
      </div>
      <div class="pt-filter-grp">
        <span class="pt-filter-lbl">Линия</span>
        ${buildDD('line', state.pt.line, lineOptions)}
      </div>
      <div class="pt-filter-grp">
        <span class="pt-filter-lbl">Модель</span>
        ${buildDD('model', state.pt.model, modelOptions)}
      </div>
      <div class="pt-counter">
        Найдено <b>${rows.length}</b> из ${PRODUCTS.length}
        ${hasActive ? '<span class="reset" id="pt-reset">сбросить</span>' : ''}
      </div>
    </div>
    ${state.compare.enabled ? buildCompareView(rows) : `
    <div class="pt-wrap">
      <table class="pt-table">
        <thead>
          <tr>
            <th>#</th>
            <th data-sort="name" class="${sortClass('name')}">Наименование</th>
            <th class="right ${sortClass('rev')}" data-sort="rev">Выручка</th>
            <th class="right ${sortClass('cost')}" data-sort="cost">Себестоимость</th>
            <th class="right ${sortClass('margin')}" data-sort="margin">Рентабельность</th>
            <th class="right ${sortClass('orders')}" data-sort="orders">Заказы</th>
            <th class="right ${sortClass('avgp')}" data-sort="avgp">Ср.цена</th>
            <th class="right ${sortClass('returns')}" data-sort="returns">Возвраты</th>
            <th class="right ${sortClass('stockq')}" data-sort="stockq">На складе</th>
          </tr>
        </thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`}
  `;

  // Доустанавливаем sorted-классы (т.к. в HTML может конфликтовать class дважды)
  $$('.pt-table thead th[data-sort]').forEach(th => {
    th.classList.remove('sorted','asc');
    if(th.dataset.sort === sortCol){
      th.classList.add('sorted');
      if(state.pt.sortDir === 'asc') th.classList.add('asc');
    }
  });
}

/* ============ СОБЫТИЯ ============ */
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const target = e.target.closest('[data-tip]');
  if(target){
    const parts = target.dataset.tip.split('|');
    let html = `<div class="tip-title">${parts[0]}</div>`;
    for(let i=1; i<parts.length; i+=2){
      if(parts[i] && parts[i+1]) html += `<div class="tip-row"><span>${parts[i]}</span><span class="v">${parts[i+1]}</span></div>`;
    }
    tip.innerHTML = html; tip.classList.add('show');
    const rect = tip.getBoundingClientRect();
    let x = e.clientX+14, y = e.clientY+14;
    if(x+rect.width  > window.innerWidth-10)  x = e.clientX-rect.width-14;
    if(y+rect.height > window.innerHeight-10) y = e.clientY-rect.height-14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  } else { tip.classList.remove('show'); }
});

document.addEventListener('click', e => {
  // Период
  const pb = e.target.closest('.pb[data-p]');
  if(pb){ state.period = pb.dataset.p; renderAll(); return; }
  if(e.target.closest('#btn-range')){ $('#range-panel').classList.toggle('open'); $('#compare-panel').classList.remove('open'); return; }
  if(e.target.id === 'range-apply'){
    state.customFrom = $('#range-from').value;
    state.customTo   = $('#range-to').value;
    state.period = 'custom';
    $('#range-panel').classList.remove('open');
    renderAll(); return;
  }
  if(e.target.id === 'range-cancel'){ $('#range-panel').classList.remove('open'); return; }
  // Сравнить периоды — открыть/закрыть панель и предзаполнить инпуты текущим state
  if(e.target.closest('#btn-compare')){
    const panel = $('#compare-panel');
    const wasOpen = panel.classList.contains('open');
    $('#range-panel').classList.remove('open');
    if(!wasOpen){
      // Период А: либо из state.customFrom/To, либо вычисляем из state.period (getDateRange).
      const yearStart = new Date('2025-01-01T00:00:00Z');
      const toISO = i => new Date(yearStart.getTime() + i*86400000).toISOString().slice(0,10);
      if(state.compare.aFrom && state.compare.aTo){
        $('#cmp-a-from').value = state.compare.aFrom;
        $('#cmp-a-to').value   = state.compare.aTo;
      } else {
        const r = getDateRange();
        $('#cmp-a-from').value = toISO(r.startIdx);
        $('#cmp-a-to').value   = toISO(r.endIdx);
      }
      // Период Б — из state.compare
      $('#cmp-b-from').value = state.compare.from;
      $('#cmp-b-to').value   = state.compare.to;
    }
    panel.classList.toggle('open');
    return;
  }
  if(e.target.id === 'compare-apply'){
    // Период А и Б — явные диапазоны из панели (А не зависит от кнопок периода вверху).
    state.compare.aFrom   = $('#cmp-a-from').value;
    state.compare.aTo     = $('#cmp-a-to').value;
    state.compare.from    = $('#cmp-b-from').value;
    state.compare.to      = $('#cmp-b-to').value;
    state.compare.enabled = true;
    $('#compare-panel').classList.remove('open');
    renderAll(); return;
  }
  const cmpTab = e.target.closest('[data-cmp-view]');
  if(cmpTab){
    state.compare.chartView = cmpTab.dataset.cmpView;
    renderProducts();
    return;
  }
  if(e.target.id === 'compare-off'){
    state.compare.enabled = false;
    $('#compare-panel').classList.remove('open');
    renderAll(); return;
  }
  if(!e.target.closest('#range-panel') && !e.target.closest('#btn-range')
     && !e.target.closest('#compare-panel') && !e.target.closest('#btn-compare')){
    $('#range-panel').classList.remove('open');
    $('#compare-panel').classList.remove('open');
  }

  // Товары - сортировка
  const ptSort = e.target.closest('.pt-table thead th[data-sort]');
  if(ptSort){
    const col = ptSort.dataset.sort;
    if(state.pt.sortCol === col){
      state.pt.sortDir = state.pt.sortDir === 'desc' ? 'asc' : 'desc';
    } else {
      state.pt.sortCol = col;
      state.pt.sortDir = (col === 'name' || col === 'abc' || col === 'cat') ? 'asc' : 'desc';
    }
    renderProducts(); return;
  }
  // Товары - раскрытие/сворачивание наименования по артикулам
  const ptExpand = e.target.closest('tr[data-expand]');
  if(ptExpand){
    const key = ptExpand.dataset.expand;
    if(state.pt.expanded.has(key)) state.pt.expanded.delete(key);
    else state.pt.expanded.add(key);
    renderProducts(); return;
  }
  // Товары - сброс фильтров
  if(e.target.id === 'pt-reset'){
    state.pt.category = []; state.pt.subcat = []; state.pt.abc = []; state.pt.line = []; state.pt.model = [];
    renderProducts(); return;
  }
  if(e.target.id === 'oh-reset'){
    state.oh.category = []; state.oh.subcat = []; state.oh.line = []; state.oh.model = [];
    renderOrdersHeat(); return;
  }

  // Кастомный dropdown: клик по кнопке → открыть/закрыть
  const ddBtn = e.target.closest('.dd-btn');
  if(ddBtn){
    const dd = ddBtn.closest('.dd');
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open'));
    if(!wasOpen) dd.classList.add('open');
    return;
  }
  // Клик по опции dropdown
  const ddOpt = e.target.closest('.dd-opt');
  if(ddOpt){
    const dd = ddOpt.closest('.dd');
    const ddId = dd.dataset.dd;
    const val = ddOpt.dataset.val;
    if(dd.closest('#orders-heat')){
      // Блок «Заказы» — мультивыбор (массивы), «Все» очищает выбор.
      const A = state.oh;
      if(!Array.isArray(A[ddId])) A[ddId] = [];
      if(val === 'all'){ A[ddId] = []; }
      else { const i = A[ddId].indexOf(val); if(i < 0) A[ddId].push(val); else A[ddId].splice(i,1); }
      validateOhFilters();
      renderOrdersHeat();
      if(val !== 'all'){ const d = document.querySelector('#orders-heat .dd[data-dd="'+ddId+'"]'); if(d) d.classList.add('open'); }
      return;
    }
    if(val === 'all'){ state.pt[ddId] = []; }
    else { if(!Array.isArray(state.pt[ddId])) state.pt[ddId] = []; const i = state.pt[ddId].indexOf(val); if(i < 0) state.pt[ddId].push(val); else state.pt[ddId].splice(i,1); }
    validatePtFilters();
    renderProducts();
    if(val !== 'all'){ const d = document.querySelector('#products .dd[data-dd="'+ddId+'"]'); if(d) d.classList.add('open'); }
    return;
  }
  // Клик вне любого dropdown — закрываем все
  if(!e.target.closest('.dd')){
    document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open'));
  }
});

// Старый change handler удалён — теперь dropdown полностью на click
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open'));
  }
});

// Заглушка пустого обработчика (отдельный слушатель change больше не нужен)
document.addEventListener('change', () => {});

function tick(){
  const d = new Date();
  const z = n => n.toString().padStart(2,'0');
  const el = $('#clock');
  if(el) el.textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
setInterval(tick, 1000); tick();

function _ohEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function _ohOrdersMonthly(mo, s, e){
  let acc=0, cum=0;
  for(let m=0;m<NMONTHS;m++){
    const ms=cum, me=cum+DAYS_IN_MONTH_2025[m]-1; cum+=DAYS_IN_MONTH_2025[m];
    const lo=Math.max(s,ms), hi=Math.min(e,me);
    if(hi>=lo) acc += (mo&&mo[m]?mo[m]:0) * (hi-lo+1)/DAYS_IN_MONTH_2025[m];
  }
  return acc;
}
function _ohSum(daily, s, e){ let a=0; for(let i=s;i<=e;i++) a+=daily[i]||0; return a; }
function _ohBuckets(){
  const r=getDateRange(), p=state.period, out=[];
  const fmtDM=i=>{const d=new Date(Date.UTC(2025,0,1)+i*86400000);return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0');};
  // Гранулярность: стандартные кнопки как раньше; для «Свой» (custom) — по длине окна,
  // чтобы короткий период не сжимался в один месяц (Иван: разбить по дням).
  const days=r.endIdx-r.startIdx+1;
  const daily=(p==='today'||p==='7d'||p==='30d')||(p==='custom'&&days<=45);
  const weekly=(p==='90d')||(p==='custom'&&days>45&&days<=120);
  let gran;
  if(daily){ gran='по дням'; for(let i=r.startIdx;i<=r.endIdx;i++) out.push({s:i,e:i,label:fmtDM(i)}); }
  else if(weekly){ gran='по неделям'; for(let s=r.startIdx;s<=r.endIdx;s+=7){ const e=Math.min(s+6,r.endIdx); out.push({s,e,label:fmtDM(s)}); } }
  else { gran='по месяцам'; let cum=0; for(let m=0;m<NMONTHS;m++){ const ms=cum, me=cum+DAYS_IN_MONTH_2025[m]-1; cum+=DAYS_IN_MONTH_2025[m]; if(me>=r.startIdx&&ms<=r.endIdx) out.push({s:Math.max(ms,r.startIdx),e:Math.min(me,r.endIdx),label:(MONTHS[m]?MONTHS[m].m:'M'+(m+1))}); } }
  return {buckets:out, range:r, gran};
}
// ── Мультивыбор: массив значений ([] = все) ──
function _selOn(a){ return Array.isArray(a) && a.length>0; }
function _selHas(a,v){ return !_selOn(a) || a.includes(v); }
function _selLabel(a, allLabel, options){ if(!_selOn(a)) return allLabel; if(a.length===1){ const o=options.find(o=>o.val===a[0]); return o?o.label:String(a[0]); } return 'Выбрано: '+a.length; }
// Блок «Заказы» работает по всем категориям, КРОМЕ «Прочее».
function _ohBase(){ const EX=new Set(CAT_TREE.filter(g=>g.name==='Прочее').map(g=>g.id)); return PRODUCTS.filter(p=>!EX.has(p.groupId)); }
// Каскадная валидация собственных фильтров блока «Заказы» (мультивыбор, без класса).
function validateOhFilters(){
  const A=state.oh;
  ['category','subcat','line','model'].forEach(k=>{ if(!Array.isArray(A[k])) A[k]=[]; });
  const BASE=_ohBase();
  const gids=new Set(BASE.map(p=>p.groupId));
  A.category=A.category.filter(v=>gids.has(v));
  const sids=new Set(BASE.filter(p=>_selHas(A.category,p.groupId)).map(p=>p.subcatId));
  A.subcat=A.subcat.filter(v=>sids.has(v));
  const lns=new Set(BASE.filter(p=>_selHas(A.category,p.groupId)&&_selHas(A.subcat,p.subcatId)).map(p=>deriveLine(p)));
  A.line=A.line.filter(v=>lns.has(v));
  const mds=new Set(BASE.filter(p=>_selHas(A.category,p.groupId)&&_selHas(A.subcat,p.subcatId)&&_selHas(A.line,deriveLine(p))).map(p=>p.nm));
  A.model=A.model.filter(v=>mds.has(v));
}
function renderOrdersHeat(){
  const host=document.getElementById('orders-heat'); if(!host) return;
  // В режиме сравнения периодов блок «Заказы» не показываем.
  if(state.compare && state.compare.enabled){ host.style.display='none'; host.innerHTML=''; return; }
  host.style.display='';
  validateOhFilters();
  const A=state.oh;
  const BASE=_ohBase();
  let pool=BASE.slice();
  if(_selOn(A.category)) pool=pool.filter(p=>A.category.includes(p.groupId));
  if(_selOn(A.subcat))   pool=pool.filter(p=>A.subcat.includes(p.subcatId));
  if(_selOn(A.line))     pool=pool.filter(p=>A.line.includes(deriveLine(p)));
  if(_selOn(A.model))    pool=pool.filter(p=>A.model.some(mv=>modelMatches(p,mv)));
  const {buckets,range,gran}=_ohBuckets();
  const drill=(pool.length===1 && pool[0].variants && pool[0].variants.length);
  let items=drill
    ? pool[0].variants.map(v=>({label:v.sku, sub:v.sub, mo:v.mo||[]}))
    : pool.map(p=>({label:p.nm, sub:deriveLine(p), mo:p.mo||[]}));
  items.forEach(it=> it._t=_ohOrdersMonthly(it.mo, range.startIdx, range.endIdx));
  items.sort((a,b)=>b._t-a._t);
  const total=items.length, MAX=20;
  // gran приходит из _ohBuckets (учитывает длину «Свой»-периода).
  // ── Каскад опций фильтра (мультивыбор, без Класса) ──
  const passCat=p=>_selHas(A.category,p.groupId);
  const passSub=p=>_selHas(A.subcat,p.subcatId);
  const passLine=p=>_selHas(A.line,deriveLine(p));
  const validG=new Set(BASE.map(p=>p.groupId));
  const catOptions=[{val:'all',label:'Все категории'},...CAT_TREE.filter(g=>validG.has(g.id)).map(g=>({val:g.id,label:g.name}))];
  const validS=new Set(BASE.filter(passCat).map(p=>p.subcatId));
  const subcatOptions=[{val:'all',label:'Все подкатегории'},...CAT_TREE.flatMap(g=>g.children.filter(c=>validS.has(c.id)).map(c=>({val:c.id,label:`${c.name} · ${g.name}`})))];
  const lineSet=new Set(); BASE.filter(p=>passCat(p)&&passSub(p)).forEach(p=>lineSet.add(deriveLine(p)));
  const lineOptions=[{val:'all',label:'Все линии'},...[...lineSet].sort((a,b)=>a.localeCompare(b,'ru')).map(l=>({val:l,label:l}))];
  const modelPool=BASE.filter(p=>passCat(p)&&passSub(p)&&passLine(p));
  const modelOptions=[{val:'all',label:'Все модели'},...modelPool.map(p=>({val:p.nm,label:p.nm}))];
  const arrowSvg='<svg class="dd-btn-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4.5l3 3 3-3"/></svg>';
  const buildDD=(id,sel,options)=>{ const cur=_selLabel(sel,options[0].label,options); const opts=options.map(o=>{ const on=o.val==='all'?!_selOn(sel):sel.includes(o.val); return `<button class="dd-opt ${on?'selected':''}" data-val="${_ohEsc(o.val)}">${_ohEsc(o.label)}</button>`; }).join(''); return `<div class="dd" data-dd="${id}"><button class="dd-btn"><span class="dd-btn-label">${_ohEsc(cur)}</span>${arrowSvg}</button><div class="dd-menu">${opts}</div></div>`; };
  const hasActive=_selOn(A.category)||_selOn(A.subcat)||_selOn(A.line)||_selOn(A.model);
  const filterRow=`<div class="pt-filters">
      <div class="pt-filter-grp"><span class="pt-filter-lbl">Категория</span>${buildDD('category',A.category,catOptions)}</div>
      <div class="pt-filter-grp"><span class="pt-filter-lbl">Подкатегория</span>${buildDD('subcat',A.subcat,subcatOptions)}</div>
      <div class="pt-filter-grp"><span class="pt-filter-lbl">Линия</span>${buildDD('line',A.line,lineOptions)}</div>
      <div class="pt-filter-grp"><span class="pt-filter-lbl">Модель</span>${buildDD('model',A.model,modelOptions)}</div>
      <div class="pt-counter">${drill?'артикулов':'моделей'} <b>${total}</b>${total>MAX?` · на карте топ-${MAX}`:''}${hasActive?' <span class="reset" id="oh-reset">сбросить</span>':''}</div>
    </div>`;
  const headCard=`<div class="card-h"><div><div class="card-title">Заказы</div><div class="card-sub">тепловая карта · ${gran} · ${drill?'артикулы модели':'модели'} · число = количество заказов · можно выбрать несколько значений в фильтре</div></div></div>`;
  const note=`<div class="oh-note">Источник — помесячные данные. Дневные/недельные ячейки — приблизительное распределение месячного итога по дням (с поправкой на будни/выходные) для наглядности; помесячный вид («Год», «Всё время») — фактические данные.</div>`;
  if(!items.length){ host.innerHTML=headCard+filterRow+`<div class="oh-empty">Нет данных под выбранными фильтрами.</div>`; return; }
  items=items.slice(0,MAX);
  // Дневное распределение через DAY_WEIGHTS → суммы по корзинам.
  items.forEach(it=> it.daily=buildDailyFromMonths(it.mo));
  const cells=items.map(it=>buckets.map(b=>Math.round(_ohSum(it.daily,b.s,b.e))));
  const totals=items.map(it=>Math.round(_ohSum(it.daily, range.startIdx, range.endIdx)));
  const flat=cells.flat().filter(v=>v>0).sort((a,b)=>a-b);
  const pct=v=>{ if(v<=0||!flat.length) return 0; let lo=0,hi=flat.length; while(lo<hi){const m=(lo+hi)>>1; if(flat[m]<v) lo=m+1; else hi=m;} return flat.length>1?lo/(flat.length-1):1; };
  const color=v=> v<=0 ? 'rgba(120,32,38,.22)' : `hsl(${Math.round(8+pct(v)*112)},60%,${40+Math.round(pct(v)*9)}%)`;
  const n=buckets.length, lstep=n>16?Math.ceil(n/14):1;
  const head=`<div class="oh-row oh-head"><div class="oh-label"></div>${buckets.map((b,i)=>`<div class="oh-c">${(i%lstep===0||i===n-1)?b.label:''}</div>`).join('')}<div class="oh-tot">Итого</div></div>`;
  const body=items.map((it,ri)=>`<div class="oh-row"><div class="oh-label" title="${_ohEsc(it.label)}"><b>${_ohEsc(it.label)}</b><span>${_ohEsc(it.sub)}</span></div>${cells[ri].map((v,ci)=>`<div class="oh-c oh-cell" style="background:${color(v)}" title="${_ohEsc(it.label)} · ${buckets[ci].label}: ${v} шт">${v||''}</div>`).join('')}<div class="oh-tot" title="Итого за период: ${totals[ri]} шт">${totals[ri]}</div></div>`).join('');
  host.innerHTML=headCard+filterRow+`<div class="oh-wrap"><div class="oh-grid">${head}${body}</div></div>`+note;
}
function renderAll(){
  $$('.pb[data-p]').forEach(b => b.classList.toggle('act', b.dataset.p === state.period));
  // Подсветка состояния "Сравнить" и плашка
  const cmpBtn = $('#btn-compare'); if(cmpBtn) cmpBtn.classList.toggle('act', state.compare.enabled);
  const cmpInfo = $('#cmp-info');
  if(cmpInfo){
    if(state.compare.enabled){
      cmpInfo.classList.add('on');
      const fmtD = ds => { const d=new Date(ds); return `${d.getUTCDate()}.${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCFullYear()).slice(-2)}`; };
      // Период А: из custom-range либо из текущего пресета (state.period)
      let aFrom, aTo;
      if(state.period === 'custom' && state.customFrom && state.customTo){
        aFrom = state.customFrom; aTo = state.customTo;
      } else {
        const yearStart = new Date('2025-01-01T00:00:00Z');
        const r = getDateRange();
        const toISO = i => new Date(yearStart.getTime() + i*86400000).toISOString().slice(0,10);
        aFrom = toISO(r.startIdx); aTo = toISO(r.endIdx);
      }
      $('#cmp-info-text').innerHTML =
        `<span class="cmp-info-prd"><span class="cmp-info-lbl">А</span> <b>${fmtD(aFrom)}–${fmtD(aTo)}</b></span>` +
        `<span class="cmp-info-sep">vs</span>` +
        `<span class="cmp-info-prd"><span class="cmp-info-lbl">Б</span> <b>${fmtD(state.compare.from)}–${fmtD(state.compare.to)}</b></span>`;
    } else cmpInfo.classList.remove('on');
  }
  renderOrdersHeat();
  renderProducts();
}
renderAll();
</script>
