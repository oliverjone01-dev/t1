<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>GEN-GROUP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23060807'/%3E%3Cpath d='M4 18V6l8 8 8-8v12' fill='none' stroke='%23c7ff39' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ===== Northline system v4 · спецификация · mobile-first · автономная сборка ===== */
:root{
  --bg:#060807;--bg2:#0a0d0b;--bg3:#0c120d;--txt:#f2f4ef;--mut:#a1a1aa;--dim:#8a8a93;
  --lime:#c7ff39;--ink:#071008;--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.15);
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
  font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden}
::selection{background:var(--lime);color:var(--ink)}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:2px}
.noise{background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px}
.wrap{max-width:1152px;margin:0 auto;padding-left:20px;padding-right:20px}
.ic{width:1.05em;height:1.05em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- типографика: три роли ---------- */
.tag{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.tag.lm{color:var(--mut);font-weight:600}
#decision .tag.lm{color:var(--lime);font-weight:700}
h1{font-size:clamp(1.9rem,7vw,3.4rem);font-weight:800;line-height:1.08;letter-spacing:-.022em;text-wrap:balance}
h2{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.16;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
section{padding:64px 0;border-top:1px solid var(--bd);position:relative}
.sub{margin-top:16px;color:var(--mut);line-height:1.65;max-width:44em;font-size:16px}
.lead-after{margin-top:32px;font-size:16px;color:var(--mut);line-height:1.68;max-width:44em}
.white{color:var(--txt);font-weight:600}
/* единый маркер оговорки: лаймовая черта слева, 14px, не бледнее и не мельче */
.m-note{border-left:2px solid rgba(199,255,57,.55);padding-left:14px;font-size:14px;color:var(--mut);line-height:1.6}
.m-note b{color:var(--txt);font-weight:600}
/* номер раздела как позиция спецификации */
.m-sec{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.m-sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.m-sec.m-c{justify-content:center}.m-sec.m-c::after{display:none}
.m-secnum{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.08em;flex:none}

/* ---------- reveal: 12px, 380ms, один раз, каскад до 240ms ---------- */
.reveal{opacity:0;transform:translateY(12px);transition:opacity 380ms var(--ease),transform 380ms var(--ease)}
.reveal.is-visible{opacity:1;transform:none}
.stg>*{transition-delay:min(calc(var(--i,0) * 60ms),240ms)}

/* ---------- слот под съёмку: аспект держится, сдвига макета нет ---------- */
.shot{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--bd);background:
  linear-gradient(150deg,rgba(199,255,57,.04),transparent 46%),#070a08}
.shot:has(figcaption)::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,transparent 60%,rgba(6,8,7,.78));opacity:0;transition:opacity .4s}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;
  opacity:0;pointer-events:none;filter:saturate(.96) brightness(1.05) contrast(1.02);transition:opacity .5s var(--ease)}
.shot.has img{opacity:1}
.shot.has:has(figcaption)::after{opacity:1}
.shot .fb{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.shot .fb svg{width:64%;max-width:220px;height:auto;overflow:visible}
figcaption{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:8px 12px;font-size:12px;color:var(--mut);
  background:linear-gradient(180deg,transparent,rgba(6,8,7,.85) 45%);text-align:right;letter-spacing:.01em}
.r32{aspect-ratio:3/2}
.r169{aspect-ratio:16/9}
.mock{position:absolute;top:10px;left:10px;z-index:4;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--txt);background:rgba(6,8,7,.85);border:1px solid var(--bd2);border-radius:4px;padding:3px 8px}

/* ---------- шапка: прогресс чтения + позиция в документе ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(6,8,7,.93);border-bottom-color:var(--bd)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime);transform:scaleX(0);transform-origin:0 50%;opacity:0;transition:opacity .3s}
header.scrolled .prog{opacity:1}
@supports (animation-timeline:scroll()){
  @media(prefers-reduced-motion:no-preference){
    .prog{animation:progGrow linear both;animation-timeline:scroll(root block)}
    @keyframes progGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.03em;font-size:16px;flex:none;min-height:44px}
.logo svg{width:22px;height:22px;color:var(--lime)}
/* переключатель предложений: GT & DG открыт, GM & DG ещё не собран */
/* На телефоне вкладки ужаты и знак спрятан: справа стоит указатель раздела,
   ему нужно место, иначе название раздела срезается до одной буквы. */
.m-tabs{display:flex;align-items:center;gap:5px;flex:none;min-height:44px}
.m-tab{display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:0 8px;border:1px solid var(--bd);border-radius:9px;
  font-weight:800;font-size:13px;letter-spacing:.02em;color:var(--mut);white-space:nowrap;
  transition:color .25s,border-color .25s,background-color .25s}
.m-tab .amp{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--dim)}
.m-tab.is-on{color:var(--txt);border-color:var(--lime);background-color:rgba(199,255,57,.08)}
.m-tab.is-on .amp{color:var(--lime)}
.m-tab.is-off{cursor:not-allowed;opacity:.5}
.m-tab:not(.is-off):hover{color:var(--txt);border-color:var(--bd2)}
.m-tab:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.logo .dot{color:var(--lime)}
.logo .v{margin-left:5px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.18em;font-family:var(--mono)}
.m-pos{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:13px}
/* Счётчик «N из 10» на узком телефоне уступает место названию раздела:
   вкладки заняли левый край, а «сколько осталось» и так показывает полоса прогресса. */
.m-pos b{display:none;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--dim);letter-spacing:.04em;flex:none;font-variant-numeric:tabular-nums}
.m-pos i{font-style:normal;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-d{display:none;align-items:center;gap:20px;font-size:13.5px;color:var(--mut);white-space:nowrap}
.nav-d a{transition:color .25s;position:relative;padding:10px 0}
.nav-d a:hover{color:var(--txt)}
.nav-d a[aria-current="true"]{color:var(--txt)}
.nav-d a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1px;background:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;white-space:nowrap;
  font-weight:700;min-height:48px;padding:12px 22px;font-size:15px;cursor:pointer;font-family:inherit;
  transition:filter .25s,border-color .25s,color .25s,transform .12s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn-lime{background:var(--lime);color:var(--ink);border:1px solid var(--lime)}
.btn-lime:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--bd2);color:var(--txt);background:none}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn-hd{display:none;min-height:44px;padding:10px 16px;font-size:13.5px}
.mbtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--bd2);border-radius:8px;background:none;color:var(--txt);cursor:pointer;flex:none}

/* мобильное меню */
#mmenu{position:fixed;inset:0;z-index:60;background:rgba(6,8,7,.98);
  display:none;opacity:0;transition:opacity .26s var(--ease),display .26s allow-discrete}
#mmenu.open{display:block;opacity:1}
@starting-style{#mmenu.open{opacity:0}}
.mm-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.mm-nav{display:flex;flex-direction:column;gap:2px;padding:18px 20px}
.mm-nav a{font-size:19px;font-weight:700;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);min-height:48px;display:flex;align-items:center;gap:12px}
.mm-nav a::before{content:attr(data-n);font-family:var(--mono);font-size:13px;font-weight:600;color:var(--dim);width:2ch}
.mm-nav a.lime{color:var(--lime)}
body.lock{overflow:hidden}

/* ---------- рейка разделов: только очень широкие экраны ---------- */
.spine{display:none}

/* ---------- герой ---------- */
.hero{position:relative;overflow:hidden;padding:112px 0 60px;border-top:none}
.hero-media{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 45%;
  opacity:0;transition:opacity 1.1s var(--ease);filter:saturate(.7) contrast(1.03)}
.hero-media.has img{opacity:.3}
.hero-media::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,8,7,.62),rgba(6,8,7,.84) 52%,var(--bg) 94%)}
.hero-glow{pointer-events:none;position:absolute;left:50%;top:0;z-index:1;transform:translateX(-32%);height:36rem;width:60rem;border-radius:50%;
  background:radial-gradient(ellipse at 68% 17%,rgba(199,255,57,.1),transparent 60%)}
@supports (animation-timeline:scroll()){
  @media(prefers-reduced-motion:no-preference){
    .hero-glow{animation:glowDrift linear both;animation-timeline:scroll(root block);animation-range:0 70vh}
    @keyframes glowDrift{to{transform:translateX(-32%) translateY(-14%);opacity:.35}}
  }
}
.hero-grid{position:relative;z-index:2;display:grid;gap:40px}
.hero p.lead{font-size:17px;color:var(--mut);line-height:1.62;max-width:34em;margin:22px 0 30px}
.hero-cta{display:flex;flex-direction:column;gap:12px}
.hero-cta .btn{width:100%}

/* оглавление: пять позиций пакета */
.toc{position:relative;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);padding:22px 18px 18px}
.toc .cap{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.toc ol{list-style:none;display:flex;flex-direction:column;gap:2px}
.toc li a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:8px;font-size:14.5px;line-height:1.45;min-height:44px;
  border:1px solid transparent;transition:border-color .25s,background .25s}
.toc li a:hover{border-color:var(--bd2);background:var(--bg3)}
.toc li a b{color:var(--dim);font-family:var(--mono);font-size:12.5px;font-weight:600;flex:none;width:1.5em}
.toc .foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.toc .foot .big{color:var(--lime);font-size:18px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.toc .foot span:last-child{font-size:12.5px;color:var(--mut);text-align:right;max-width:22ch;line-height:1.5}

/* ---------- если читать одну минуту ---------- */
.minute{background:var(--bg2);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:44px 0 40px}
.mgrid{display:grid;gap:26px;margin-top:8px}
.mcol{display:flex;flex-direction:column}
.mh{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.mlist,.mnum{list-style:none;display:flex;flex-direction:column;gap:11px}
.mlist li{display:flex;gap:11px;font-size:15px;color:var(--mut);line-height:1.55}
.mlist li b{color:var(--dim);font-family:var(--mono);font-size:12.5px;flex:none;padding-top:3px}
.mnum li{display:flex;flex-direction:column;gap:2px}
.mnum li b{color:var(--txt);font-family:var(--mono);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mnum li span{font-size:14px;color:var(--mut);line-height:1.5}
.mfoot{margin-top:14px}
.mcta{margin-top:28px;padding-top:18px;border-top:1px solid var(--bd);font-size:15px;color:var(--mut);line-height:1.6;max-width:64em}
.mcta a{color:var(--lime);border-bottom:1px solid rgba(199,255,57,.4)}
.mcta a:hover{border-bottom-color:var(--lime)}

/* ---------- цифры ---------- */
.stats{border-bottom:1px solid var(--bd)}
.stats-g{display:grid;gap:0}
.stat{padding:26px 0;border-bottom:1px solid var(--bd)}
.stat:last-child{border-bottom:none}
.stat b{display:block;font-size:clamp(1.9rem,4.5vw,2.4rem);font-weight:700;color:var(--txt);letter-spacing:-.03em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat p{margin-top:8px;font-size:14px;color:var(--mut);line-height:1.55;max-width:32ch}

/* ---------- кому выгодно: три человека ---------- */
.people{display:grid;gap:16px;margin-top:36px}
.pcard{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:15px}
.pcard.hl{border-color:rgba(199,255,57,.4);background:var(--bg3)}
.pwho{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.pwho .pava{width:44px;height:44px;border-radius:8px;border:1px solid var(--bd2);color:var(--txt);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;flex:none;letter-spacing:.02em;margin-top:0;position:relative;overflow:hidden}
.pwho .pava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:saturate(.85) contrast(1.02)}
.pwho b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.pwho span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.qa .q{color:var(--lime);font-weight:600;font-size:14.5px;line-height:1.45}
.qa .a{margin-top:5px;font-size:15px;color:var(--mut);line-height:1.6}
.qa .a b{color:var(--txt);font-weight:600}
.pfin{margin-top:auto;padding-top:13px;border-top:1px solid var(--bd);font-size:14.5px;color:var(--txt);font-weight:600;line-height:1.55}
.pfin em{font-style:normal;color:var(--lime)}
.pnote{margin-top:10px}

/* ---------- карточки фактов ---------- */
.grid{display:grid;gap:16px;margin-top:36px}
.card{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:24px}
.card.hl{border-color:var(--bd2);background:var(--bg3)}
.card .k{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.card h3{font-size:18.5px;font-weight:700;margin-bottom:10px;line-height:1.3}
.card p{font-size:15px;color:var(--mut);line-height:1.62}
.card .ft{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);font-size:14px;color:var(--mut);line-height:1.55}

/* пакет: позиции спецификации, единственный новый сильный приём */
#package .k{position:relative;padding-bottom:10px;margin-bottom:12px}
#package .k::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;
  background:linear-gradient(90deg,var(--lime) 0 34px,var(--bd) 34px);
  transform:scaleX(0);transform-origin:0 50%;transition:transform 420ms var(--ease) 120ms}
#package .is-visible .k::after{transform:scaleX(1)}
/* факты: иллюстрации в карточках */
#why .m-fimg,#package .grid .m-fimg{margin:-24px -24px 16px;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--bd);border-radius:11px 11px 0 0;background:#070a08}
#why .m-fimg img,#package .grid .m-fimg img{width:100%;height:100%;object-fit:cover;display:block}
/* пакет: структура вместо полотна текста */
.m-kh{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
.ft .m-kh{margin-top:0}
.m-klist{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:10px}
.m-klist li{display:flex;gap:10px;font-size:14px;color:var(--mut);line-height:1.5}
.m-klist li i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;padding-top:2px;width:2ch}
.m-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.m-chips span{border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--mut);background:var(--bg)}
.m-swap{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.m-swap>div{display:flex;gap:10px;align-items:baseline;font-size:14.5px;color:var(--mut);line-height:1.5}
.m-swap>div>span{min-width:0}
.m-swap b{flex:none;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt);border:1px solid var(--bd2);border-radius:4px;padding:2px 8px}

/* featured часть 1 */
.feat{border:1px solid var(--bd2);background:var(--bg3);border-radius:12px;overflow:hidden;margin-top:20px;margin-bottom:16px}
.feat-in{padding:24px}
.feat h3{font-size:clamp(1.25rem,3vw,1.6rem);font-weight:800;line-height:1.2;margin:10px 0 14px;max-width:26ch}
.feat p{color:var(--mut);font-size:15.5px;line-height:1.65;max-width:52em}
.feat .imp{color:var(--txt);font-weight:600;margin-top:14px}
.figs{display:grid;gap:12px;margin:22px 0 4px}
.fig{border:1px solid var(--bd);border-radius:10px;padding:15px 16px;background:var(--bg)}
.fig b{display:block;font-size:clamp(1.15rem,3vw,1.35rem);font-weight:700;color:var(--txt);letter-spacing:-.01em}
.fig b i{font-style:normal;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.fig span{display:block;margin-top:5px;font-size:13px;color:var(--mut);line-height:1.45}
.split{display:grid;gap:18px;margin-top:34px;border:1px solid var(--bd);border-radius:12px;padding:22px;background:var(--bg2)}
.sp-h{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.sp-col.ours .sp-h{color:var(--lime)}
.sp-col.buy .sp-h{color:var(--mut)}
.sp-col ul{list-style:none;display:flex;flex-direction:column;gap:11px}
.sp-col li{display:flex;flex-direction:column;gap:1px}
.sp-col li b{font-size:15.5px;font-weight:600;color:var(--txt)}
.sp-col.buy li b{color:var(--mut)}
.sp-col li span{font-size:13px;color:var(--dim);line-height:1.45}
.sp-note{grid-column:1/-1;margin-top:4px}

/* ---------- каталог: лента с намеренным горизонтальным скроллом ---------- */
.cat{display:flex;gap:12px;margin:28px -20px 0;padding:4px 20px 14px;overflow-x:auto;
  scroll-snap-type:x mandatory;scroll-padding-left:20px;
  scrollbar-width:thin;scrollbar-color:var(--bd2) rgba(255,255,255,.05)}
.cat::-webkit-scrollbar{height:6px}
.cat::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:3px}
.cat::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.ccard{flex:0 0 min(82%,340px);scroll-snap-align:start;border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:16px;display:flex;flex-direction:column;transition:border-color .3s}
.ccard:hover{border-color:var(--bd2)}
.ccard h3{font-size:16.5px;font-weight:700;margin:15px 0 8px;line-height:1.3}
.ccard>p{font-size:14.5px;color:var(--mut);line-height:1.58}
.cf{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px;line-height:1.5}
.cf b{color:var(--dim);font-weight:600}
.cnote{margin-top:20px;max-width:60em}
.bonus{border:1px solid var(--bd2);border-radius:12px;padding:24px;margin-top:34px;background:var(--bg3)}
.bonus .bt{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:10px}
.bonus h3{font-size:clamp(1.2rem,2.8vw,1.5rem);font-weight:800;line-height:1.25;margin-bottom:14px;max-width:28ch}
.bonus p{color:var(--mut);font-size:15.5px;line-height:1.65;max-width:56em}
.honest{margin:0 0 16px;max-width:56em}

/* маршрутизация заявок: на телефоне вертикальный стек, стрелки вниз */
.lanes{display:grid;gap:12px;margin:22px 0 4px}
.lane{border:1px solid var(--bd);border-radius:10px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.lane.keep{border-color:rgba(199,255,57,.45);background:rgba(199,255,57,.05)}
.ltag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
  border:1px solid var(--bd2);border-radius:4px;padding:3px 8px;display:inline-block;width:max-content}
.lane.keep .ltag{color:var(--lime);border-color:rgba(199,255,57,.5)}
.lin{font-size:15px;color:var(--txt);font-weight:600;line-height:1.4}
.lin em{display:block;margin-top:3px;font-style:normal;font-weight:400;font-size:13px;color:var(--mut)}
.larrow{position:relative;height:22px;width:12px;margin-left:5px}
.larrow::before{content:"";position:absolute;left:5px;top:0;bottom:2px;width:1px;background:var(--bd2)}
.larrow::after{content:"";position:absolute;left:2px;bottom:0;width:7px;height:7px;border-left:1px solid var(--bd2);border-bottom:1px solid var(--bd2);transform:rotate(-45deg)}
.lane.keep .larrow::before{background:rgba(199,255,57,.5)}
.lane.keep .larrow::after{border-color:rgba(199,255,57,.5)}
.lout{margin-top:auto}
.lout b{display:block;font-size:15.5px;font-weight:700;color:var(--txt)}
.lane.keep .lout b{color:var(--lime)}
.lout span{display:block;margin-top:3px;font-size:13px;color:var(--mut);line-height:1.45}

/* обязательство GENTERO */
.pledge{margin-top:20px;border:1px solid var(--bd);border-radius:10px;padding:20px;background:var(--bg)}
.pledge .pt{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:14px;line-height:1.45}
.pledge ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.pledge li{display:flex;gap:11px;font-size:15px;color:var(--mut);line-height:1.55}
.pledge li .m{color:var(--dim);flex:none;font-weight:700}
.pledge li b{color:var(--txt);font-weight:600}
.pledge .pf{margin-top:14px}

/* ---------- проверки перед сделкой ---------- */
.seq{display:flex;flex-direction:column;margin:20px 0 44px;border:1px solid var(--bd);border-radius:12px;background:var(--bg2);overflow:hidden;list-style:none}
.seq li{display:flex;gap:14px;align-items:flex-start;padding:18px;border-bottom:1px solid var(--bd)}
.seq li:last-child{border-bottom:none}
.icb{width:44px;height:44px;border:1px solid var(--bd2);border-radius:8px;display:grid;place-items:center;color:var(--dim);flex:none}
.seq p{font-size:15px;color:var(--mut);line-height:1.6;padding-top:2px}
.seq p b{color:var(--txt);display:block;margin-bottom:2px;font-weight:600}

/* три варианта сделки */
.opts{display:grid;gap:14px;margin-top:20px}
.opt{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:22px}
.opt.pref{border-color:rgba(199,255,57,.45);background:var(--bg3)}
.opt .lab{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.opt.pref .lab{color:var(--lime)}
.opt .lab i{font-style:normal;border:1px solid var(--bd2);border-radius:4px;padding:1px 7px;font-size:12px}
.opt.pref .lab i{border-color:rgba(199,255,57,.4)}
.opt h3{font-size:17.5px;font-weight:700;margin-bottom:10px;line-height:1.32}
.opt p{font-size:15px;color:var(--mut);line-height:1.62}

/* ---------- ступени продаж и правила ---------- */
.lad{display:grid;gap:40px;margin-top:36px;align-items:start}
.lrow{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--bd)}
.lrow:last-child{border-bottom:none}
.lrow .n{color:var(--dim);font-weight:600;font-size:15px;width:40px;flex:none;font-family:var(--mono);padding-top:3px}
.lrow h3{font-size:17px;font-weight:700;margin-bottom:6px}
.lrow p{font-size:15px;color:var(--mut);line-height:1.6}
.rulebox{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:24px;margin-bottom:20px}
.rulebox .t{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
.rulebox ul{list-style:none;display:flex;flex-direction:column;gap:14px}
.rulebox li{display:flex;gap:12px;font-size:15px;color:var(--mut);line-height:1.6}
.rulebox li b.n{color:var(--dim);flex:none;font-family:var(--mono);font-size:13px;font-weight:600;padding-top:2px}
.rulebox li b.w{color:var(--txt)}
blockquote{border-left:2px solid var(--lime);padding:4px 0 4px 18px;font-size:clamp(1.02rem,2.6vw,1.2rem);font-weight:500;line-height:1.55}

/* ---------- этапы ---------- */
.stage{display:grid;gap:10px;border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:22px;margin-bottom:14px}
.stage.hl{border-color:rgba(199,255,57,.4);background:var(--bg3)}
.stage .sn{color:var(--txt);font-weight:700;font-size:15px;font-family:var(--mono)}
.stage .sd{font-size:12.5px;color:var(--mut);margin-top:3px;letter-spacing:.04em;font-family:var(--mono)}
.stage h3{font-size:17px;font-weight:700;margin-bottom:6px}
.stage p{font-size:15px;color:var(--mut);margin-bottom:8px;line-height:1.62}
.stage .pr{font-size:14px;font-weight:600;color:var(--lime);margin-bottom:0}

/* ---------- таблицы: горизонтальный скролл + закреплённая первая колонка ---------- */
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;margin:22px 0 26px;-webkit-overflow-scrolling:touch;background:var(--bg2);
  scrollbar-width:thin;scrollbar-color:var(--bd2) rgba(255,255,255,.05)}
.tblw::-webkit-scrollbar{height:6px}
.tblw::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
.tblw::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:660px}
caption{text-align:left;padding:14px 16px 2px}
caption.m-note{border-left:none;padding-left:16px;position:relative}
caption.m-note::before{content:"";position:absolute;left:0;top:16px;bottom:4px;width:2px;background:rgba(199,255,57,.55)}
th{text-align:left;padding:13px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd);background:var(--bg2)}
th.r,td.r{text-align:right}
td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px;color:var(--mut);vertical-align:top;line-height:1.55}
td:first-child{color:var(--txt);font-weight:600}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:var(--bg2);border-right:1px solid var(--bd2);min-width:150px;max-width:200px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td:not(:first-child){background:rgba(199,255,57,.025)}
td.sum{white-space:nowrap;color:var(--txt);font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
td.nw{white-space:nowrap}

/* ---------- шкала бюджета: горизонтальна всегда ---------- */
.lead-sm{font-size:15px;color:var(--mut);line-height:1.6;margin-bottom:20px;max-width:48em}
.bbar{position:relative;display:grid;grid-template-columns:60fr 60fr 240fr 100fr 80fr 60fr;gap:2px;height:44px;margin:34px 0 12px}
.bseg{position:relative;border-radius:4px;overflow:hidden;transform-origin:0 100%;min-width:0}
.s1{background:linear-gradient(180deg,rgba(199,255,57,.30),rgba(199,255,57,.13))}
.s2{background:linear-gradient(180deg,rgba(199,255,57,.24),rgba(199,255,57,.10))}
.s3{background:linear-gradient(180deg,rgba(199,255,57,.19),rgba(199,255,57,.08))}
.s4{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05))}
.s5{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
.s6{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
.bl,.bv{display:none}
.bgate{position:absolute;top:-8px;bottom:-6px;left:20%;width:0;border-left:2px dashed rgba(255,255,255,.55);pointer-events:none}
.bgate span{position:absolute;top:-22px;left:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);white-space:nowrap}
.m-blegend{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;margin:14px 0 10px;max-width:480px}
.m-blegend li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);min-width:0}
.m-blegend li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-blegend li b{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums}
.m-sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid var(--bd)}
.bcap{margin-bottom:26px;max-width:52em}
@supports (animation-timeline:view()){
  @media(prefers-reduced-motion:no-preference){
    .bseg{animation:segIn linear both;animation-timeline:view();animation-range:entry 10% cover 34%}
    @keyframes segIn{from{transform:scaleY(.12);opacity:.25}to{transform:scaleY(1);opacity:1}}
  }
}

/* оговорки и предупреждения: всегда развёрнуты */
.caveats{display:grid;gap:12px;margin-bottom:26px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cav{border:1px solid var(--bd);border-left:2px solid rgba(199,255,57,.55);border-radius:10px;padding:16px 18px;background:var(--bg2)}
.ch{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:6px}
.cav p:last-child{font-size:14px;color:var(--mut);line-height:1.55}
.warns{display:grid;gap:14px;margin-top:16px}
.warn{border-left:2px solid rgba(199,255,57,.55);padding-left:14px}
.wh{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:5px}
.warn p:last-child{font-size:14px;color:var(--mut);line-height:1.55}

/* денежный гейт */
.gate{border:1px solid rgba(199,255,57,.42);border-radius:12px;padding:22px;margin-top:6px;background:var(--bg3)}
.gate .gt{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:14px}
.steps{display:grid;gap:12px;margin-bottom:16px}
.step{border:1px solid var(--bd);border-radius:10px;padding:16px 18px;background:var(--bg)}
.step.hl{border-color:rgba(199,255,57,.45);background:rgba(199,255,57,.05)}
.step b{display:block;font-family:var(--mono);font-size:18px;font-weight:700;color:var(--txt);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.step.hl b{color:var(--lime)}
.step span{display:block;margin-top:2px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.step em{display:block;margin-top:10px;font-style:normal;font-size:14px;color:var(--mut);line-height:1.55}
.gsum{font-size:15px;color:var(--mut);line-height:1.6;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.gsum b{color:var(--txt);font-weight:600}

/* ---------- вопросы ---------- */
.faq{max-width:860px}
.fitem{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;margin-bottom:12px;transition:border-color .3s}
.fitem:hover,.fitem.open{border-color:var(--bd2)}
.fbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;min-height:48px;
  padding:18px 20px;font-size:clamp(1rem,2.6vw,1.1rem);font-weight:700;background:none;border:none;color:var(--txt);cursor:pointer;font-family:inherit;line-height:1.35}
.fico{color:var(--lime);transition:transform .3s var(--ease);flex:none}
.fitem.open .fico{transform:rotate(45deg)}
.fbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.fitem.open .fbody{grid-template-rows:1fr}
.fbody>div{overflow:hidden}
.fbody p{padding:0 20px 20px;font-size:15px;color:var(--mut);line-height:1.68;max-width:62em}

/* ---------- три решения: последний экран ---------- */
.cta{position:relative;overflow:hidden;padding:84px 0 100px}
.cta-glow{display:none}
.cta .in{position:relative;max-width:920px;margin:0 auto;text-align:center}
.cta h2{max-width:none;margin-left:auto;margin-right:auto}
.cta3{display:grid;gap:14px;text-align:left;margin:36px 0 40px}
.dec{border:1px solid var(--bd2);background:var(--bg2);border-radius:12px;padding:24px}
.dec .big{color:var(--lime);font-weight:700;font-size:24px;margin-bottom:10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dec p{font-size:15.5px;color:var(--mut);line-height:1.62}
.dec p b{color:var(--txt);font-weight:600}
.cta .btn{width:100%}

footer{border-top:1px solid var(--bd)}
.ft-in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:32px 0;font-size:12px;color:var(--mut)}
.ft-in .lg{font-weight:800;font-size:14px;color:var(--txt)}

/* ============ брейкпоинт 600 ============ */
@media(min-width:600px){
  .m-pos b{display:block}
  .m-tabs{gap:6px}
  .m-tab{min-height:36px;padding:0 11px;gap:4px;font-size:14px;letter-spacing:.03em}
  .wrap{padding-left:28px;padding-right:28px}
  section{padding:84px 0}
  .hero{padding:126px 0 72px}
  .hero-cta{flex-direction:row;flex-wrap:wrap}
  .hero-cta .btn{width:auto}
  .stats-g{grid-template-columns:repeat(3,1fr)}
  .stat{padding:32px 24px 32px 0;border-bottom:none;border-right:1px solid var(--bd)}
  .stat:not(:first-child){padding-left:24px}
  .stat:last-child{border-right:none;padding-right:0}
  .g2{grid-template-columns:1fr 1fr}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}
  .split{grid-template-columns:1fr 1fr;padding:26px 28px}
  .feat-in{padding:30px 34px}
  .bonus{padding:30px 34px}
  .gate{padding:26px 28px}
  .stage{grid-template-columns:150px 1fr;gap:22px;padding:24px}
  .minute{padding:52px 0 48px}
  .cat{margin-left:-28px;margin-right:-28px;padding-left:28px;padding-right:28px;scroll-padding-left:28px}
  .bbar{height:64px;margin-top:34px}
  .bseg{padding:8px;display:flex;flex-direction:column;justify-content:flex-end}
  .bl{display:block;font-size:12px;color:var(--mut);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bv{display:block;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .s1 .bv,.s2 .bv,.s3 .bv{color:var(--lime)}
  .m-blegend{display:none}
}

/* ============ брейкпоинт 900 ============ */
@media(min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  section{padding:104px 0}
  .hero{padding:150px 0 92px}
  .hero-grid{grid-template-columns:1.18fr .82fr;gap:48px;align-items:center}
  .hero-media img{left:auto;right:0;width:72%;object-position:60% 45%}
  .hero-media.has img{opacity:.5}
  .hero-media::after{background:linear-gradient(90deg,var(--bg) 30%,rgba(6,8,7,.72) 58%,rgba(6,8,7,.5)),
    linear-gradient(180deg,var(--bg),transparent 22%,transparent 62%,var(--bg))}
  .toc{padding:24px 22px 22px}
  .mgrid{grid-template-columns:1.05fr 1fr 1fr;gap:34px}
  .minute{padding:56px 0 52px}
  .people{grid-template-columns:repeat(3,1fr)}
  .lanes{grid-template-columns:repeat(3,1fr)}
  .larrow{height:16px;width:auto;margin-left:0}
  .larrow::before{left:0;right:0;top:7px;bottom:auto;width:auto;height:1px}
  .larrow::after{left:auto;right:0;top:3.5px;bottom:auto;border:0;border-top:1px solid var(--bd2);border-right:1px solid var(--bd2);transform:rotate(45deg)}
  .lane.keep .larrow::after{border-color:rgba(199,255,57,.5)}
  .cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;overflow:visible;margin-left:0;margin-right:0;padding:0;margin-top:34px}
  .ccard{flex:none;padding:18px}
  .opts{grid-template-columns:1.25fr 1fr;align-items:start}
  .lad{grid-template-columns:1fr 1fr;gap:52px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .warns{grid-template-columns:repeat(3,1fr)}
  .cta3{grid-template-columns:repeat(3,1fr)}
  .cta .btn{width:auto}
  .bbar{height:78px}
  .bseg{padding:10px 8px}
  .sub,.lead-after{font-size:17px}
  .card p,.opt p,.stage p,.lrow p{font-size:15.5px}
}

/* ============ брейкпоинт 1240: полная навигация ============ */
@media(min-width:1240px){
  .nav-d{display:flex}
  .btn-hd{display:inline-flex}
  .mbtn{display:none}
  .m-pos{display:none}
}

/* ============ брейкпоинт 1440: только рейка разделов ============ */
@media(min-width:1440px){
  .spine{display:block;position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40}
  .spine ol{list-style:none;display:flex;flex-direction:column}
  .spine a{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 0;color:var(--dim);font-size:12px;transition:color .25s}
  .spine .lbl{opacity:0;transform:translateX(6px);transition:opacity .25s var(--ease),transform .25s var(--ease);white-space:nowrap}
  .spine .pip{width:13px;height:1px;background:currentColor;opacity:.42;flex:none;transition:width .25s var(--ease),opacity .25s}
  .spine a:hover{color:var(--txt)}
  .spine a:hover .pip{opacity:1;width:20px}
  .spine a:hover .lbl,.spine:hover .lbl{opacity:1;transform:none}
  .spine a[aria-current="true"]{color:var(--lime)}
  .spine a[aria-current="true"] .pip{width:30px;opacity:1}
  .spine a[aria-current="true"] .lbl{opacity:1;transform:none}
}

/* ---------- reduced motion: всё статично, всё видимо ---------- */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{transition:none;opacity:1;transform:none}
  #package .k::after{transform:none;transition:none}
  .prog{animation:none}
  .hero-glow{animation:none}
  .bseg{animation:none}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- печать: белый лист, лайм становится чёрным ---------- */
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--bg2:#fff;--bg3:#fff;--txt:#000;--mut:#333;--dim:#555;--lime:#000;--ink:#fff;--bd:#c9c9c9;--bd2:#8a8a8a}
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt}
  header,.spine,#mmenu,.hero-glow,.hero-media,.mbtn,.btn,.m-pos,.prog,.fico{display:none!important}
  .noise{background-image:none}
  .hero{padding:0 0 18pt}
  section{padding:16pt 0;border-top:1px solid #c9c9c9}
  h1,h2,h3{color:#000!important;break-after:avoid}
  #why .m-fimg,#package .grid .m-fimg{display:none}
  .reveal{opacity:1!important;transform:none!important}
  #package .k::after{transform:none!important;background:#000!important}
  .card,.pcard,.ccard,.stage,.opt,.dec,.fitem,.tblw,.gate,.bonus,.lane,.pledge,.split,.rulebox,.seq,.fig,.toc,.cav,.step,.minute,.stats,.shot{break-inside:avoid;border-color:#c9c9c9!important;background:#fff!important}
  .pcard.hl,.stage.hl,.opt.pref,.lane.keep,.step.hl,.gate,.card.hl,.bonus,.feat{border:1px solid #000!important;background:#fff!important}
  .m-note,.cav,.warn,blockquote,.honest{border-left-color:#000!important}
  caption.m-note::before{background:#000!important}
  .fbody{grid-template-rows:1fr!important}
  .fbody>div{overflow:visible!important}
  .tblw{overflow:visible}
  table{min-width:0}
  th:first-child,td:first-child{position:static;border-right:none;max-width:none}
  th{background:#f2f2f2!important;color:#000!important}
  .bbar{height:44px}
  .bseg{background:#f2f2f2!important;border:1px solid #c9c9c9}
  .s1 .bv,.s2 .bv,.s3 .bv,.step.hl b,.stat b,.dec .big,.toc .foot .big,.pfin em,.stage .pr,.bonus .bt,.gate .gt,.lane.keep .ltag,.lane.keep .lout b,.sp-col.ours .sp-h,.mcta a{color:#000!important}
  .bgate{border-left-color:#000}
  .bgate span{color:#000}
  .m-blegend{display:grid}
  .mock{background:#000!important;color:#fff!important;border-color:#000}
  .shot .fb svg [stroke="#c7ff39"]{stroke:#000!important}
  .shot .fb svg [fill="#c7ff39"]{fill:#000!important}
  .shot .fb svg [stroke="#4a5550"],.shot .fb svg [stroke="#3d4a44"]{stroke:#9a9a9a!important}
  figcaption{color:#333!important;background:rgba(255,255,255,.85)}
  a{color:#000!important}
  .cta{padding:20pt 0}
  .mcta a{border-bottom-color:#000}
}

/* ========================================================================
   Вкладка GM & DG. Классы с префиксом gm- живут только во втором документе.
   Таблица стилей общая на обе вкладки, поэтому здесь ничего не переопределяет
   существующее: только новые селекторы.
   ======================================================================== */

/* Метка происхождения цифры. По раскадровке метки не прячутся в сноски:
   на этом документе они работают как аргумент, а не как оговорка. */
.gm-mk{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  vertical-align:middle;white-space:nowrap;border:1px solid var(--bd2);color:var(--dim)}
.gm-mk.d{color:var(--lime);border-color:rgba(199,255,57,.4)}
.gm-mk.h{color:var(--mut);border-color:var(--bd2);border-style:dashed}

/* Две стороны сделки: наш канал против его производства */
.gm-vs{display:grid;gap:14px;margin-top:34px}
.gm-side{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:22px}
.gm-side.ours{border-color:rgba(199,255,57,.35);background:rgba(199,255,57,.05)}
.gm-side h3{font-size:15px;letter-spacing:.01em;margin-bottom:14px}
.gm-side ul{list-style:none;display:grid;gap:9px}
.gm-side li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;color:var(--mut);line-height:1.5}
.gm-side li b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);
  font-weight:700;flex:none;min-width:74px}
.gm-vs-mid{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:2px 0}

/* Цепочка передела: чей участок */
.gm-chain{display:grid;gap:3px;margin:30px 0 12px}
.gm-link{display:flex;align-items:baseline;gap:12px;padding:13px 16px;border-radius:8px;
  border:1px solid var(--bd);background:var(--bg2)}
.gm-link.his{border-style:dashed;border-color:rgba(255,178,122,.4);background:rgba(255,178,122,.05)}
.gm-link.ours{border-color:rgba(199,255,57,.4);background:rgba(199,255,57,.06)}
.gm-link .n{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:22px}
.gm-link .w{font-weight:600;font-size:14.5px}
.gm-link .o{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);flex:none;padding-left:12px}
.gm-link.ours .o{color:var(--lime)}
.gm-link.his .o{color:#ffb27a}

/* Крупная цифра-аргумент */
.gm-big{display:grid;gap:8px;padding:30px 0}
.gm-big b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:clamp(3rem,13vw,6.5rem);line-height:.92;letter-spacing:-.045em;color:var(--lime)}
.gm-big span{font-size:15px;color:var(--mut);line-height:1.55;max-width:44ch}

/* Сезонность и любое сравнение двух величин полосами */
.gm-bars{display:grid;gap:14px;margin:28px 0 8px}
.gm-bar{display:grid;gap:7px}
.gm-bar .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;color:var(--mut)}
.gm-bar .t b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);font-size:15px}
.gm-bar .r{height:12px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.gm-bar .r i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,rgba(199,255,57,.85),rgba(199,255,57,.4));
  transform-origin:0 50%;width:var(--w,0%)}
.gm-bar.dim .r i{background:rgba(255,255,255,.22)}

/* Три множителя x5 */
.gm-mult{display:grid;gap:12px;margin:32px 0 10px}
.gm-m{border:1px solid var(--bd);background:var(--bg2);border-radius:12px;padding:20px;
  display:grid;gap:12px;grid-template-columns:1fr;align-items:center}
.gm-m .k{font-family:var(--mono);font-weight:700;font-size:clamp(1.7rem,6vw,2.3rem);
  color:var(--lime);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.gm-m .lbl{font-weight:700;font-size:15px;margin-bottom:5px}
.gm-m .fr{font-family:var(--mono);font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.gm-m .sig{font-size:13px;color:var(--dim);line-height:1.5;border-top:1px solid var(--bd);padding-top:11px}
.gm-eq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  border:1px solid rgba(199,255,57,.35);background:rgba(199,255,57,.06);border-radius:12px;padding:20px}
.gm-eq b{font-family:var(--mono);font-size:clamp(2rem,8vw,3rem);color:var(--lime);
  font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.gm-eq span{font-size:14px;color:var(--mut);max-width:34ch;line-height:1.5}

/* Коридор роста: три дорожки */
.gm-track{display:grid;gap:10px;margin:30px 0 10px}
.gm-tr{display:grid;gap:9px;padding:18px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2)}
.gm-tr.goal{border-color:rgba(199,255,57,.4);background:rgba(199,255,57,.06)}
.gm-tr .h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gm-tr .x{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:-.02em;
  color:var(--txt);font-variant-numeric:tabular-nums;flex:none}
.gm-tr.goal .x{color:var(--lime)}
.gm-tr .v{font-family:var(--mono);font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.gm-tr p{font-size:14px;color:var(--mut);line-height:1.55}
.gm-tr .r{height:9px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.gm-tr .r i{display:block;height:100%;border-radius:3px;background:rgba(255,255,255,.25);width:var(--w,0%)}
.gm-tr.goal .r i{background:linear-gradient(90deg,var(--lime),rgba(199,255,57,.45))}

/* Барьеры: шкала высоты */
.gm-barr{display:grid;gap:2px;margin:28px 0 10px}
.gm-brow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:13px 16px;border-radius:8px;background:var(--bg2);border:1px solid var(--bd)}
.gm-brow.zero{opacity:.62;border-style:dashed}
.gm-brow.high{border-color:rgba(199,255,57,.4);background:rgba(199,255,57,.06)}
.gm-brow .w{font-size:14.5px;line-height:1.45}
.gm-brow .lv{display:flex;gap:3px;flex:none}
.gm-brow .lv i{width:9px;height:16px;border-radius:2px;background:rgba(255,255,255,.1)}
.gm-brow .lv i.on{background:var(--lime)}
.gm-brow.zero .lv i.on{background:rgba(255,255,255,.28)}

/* Калькулятор */
.gm-calc{border:1px solid var(--bd2);background:var(--bg2);border-radius:14px;padding:22px;margin-top:32px}
.gm-calc h3{font-size:15px;margin-bottom:6px}
.gm-calc .note{font-size:13px;color:var(--dim);line-height:1.55;margin-bottom:20px}
.gm-pre{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:20px}
.gm-pre-l{color:var(--dim);font-size:12.5px;letter-spacing:.04em;margin-right:2px}
.gm-pb{background:var(--bg);border:1px solid var(--bd2);color:var(--txt);border-radius:999px;
  padding:9px 16px;font:700 13px/1 inherit;font-family:inherit;cursor:pointer;transition:.15s}
.gm-pb:hover{border-color:var(--lime)}
.gm-pb.on{background:var(--lime);border-color:var(--lime);color:#0d1300}
.gm-pb:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.gm-hint{color:var(--dim);font-size:12px;line-height:1.4}
.gm-form{color:var(--mut);font-size:14px;line-height:1.6;margin-top:18px;padding-top:16px;
  border-top:1px solid var(--bd);max-width:70ch}
.gm-in{display:grid;gap:22px;padding-bottom:20px;border-bottom:1px solid var(--bd)}
.gm-f{display:grid;gap:7px}
.gm-f .fl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--mut)}
.gm-f .fv{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);font-weight:700;font-size:14px}
.gm-f input[type=range]{width:100%;height:26px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.gm-f input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.gm-f input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.gm-f input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;
  margin-top:-8px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.gm-f input[type=range]::-moz-range-thumb{width:20px;height:20px;border:2px solid var(--ink);
  border-radius:50%;background:var(--lime)}
.gm-f input[type=range]:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.gm-out{display:grid;gap:0;padding-top:6px}
.gm-o{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--mut)}
.gm-o:last-child{border-bottom:none}
.gm-o b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--txt);font-weight:700;
  font-size:15.5px;text-align:right}
.gm-o.key{margin-top:10px;padding:16px;border-radius:10px;border:1px solid rgba(199,255,57,.35);
  background:rgba(199,255,57,.06);border-bottom:1px solid rgba(199,255,57,.35);align-items:flex-start}
.gm-o.key span{max-width:30ch;line-height:1.5;color:var(--txt)}
.gm-o.key b{color:var(--lime);font-size:19px}
.gm-o.x b{font-size:26px;color:var(--lime)}

/* Лестница ступеней */
.gm-lad{display:grid;gap:10px;margin:30px 0 10px}
.gm-st{display:grid;gap:10px;padding:18px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2)}
.gm-st.gate{border-color:rgba(199,255,57,.45);background:rgba(199,255,57,.06)}
.gm-st .hd2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gm-st .n{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;letter-spacing:.08em}
.gm-st .s{font-weight:700;font-size:15px}
.gm-st .amt{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:15px;
  color:var(--txt);font-variant-numeric:tabular-nums;flex:none}
.gm-st.gate .amt{color:var(--lime)}
.gm-st p{font-size:13.5px;color:var(--mut);line-height:1.55}
.gm-st .dt{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.04em}

@media(min-width:600px){
  .gm-vs{grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0}
  .gm-vs-mid{padding:0 18px;writing-mode:vertical-rl;letter-spacing:.24em}
  .gm-m{grid-template-columns:auto 1fr;gap:22px;align-items:start}
  .gm-m .sig{grid-column:1 / -1;border-top:1px solid var(--bd);padding-top:12px}
  .gm-calc{padding:30px}
  .gm-in{grid-template-columns:repeat(3,1fr);gap:22px 26px}
  .gm-out{padding-top:14px}
}
@media(min-width:900px){
  .gm-chain{grid-template-columns:1fr 1fr}
  .gm-mult{grid-template-columns:repeat(3,1fr)}
  .gm-m .sig{grid-column:1 / -1}
  .gm-track{grid-template-columns:repeat(3,1fr)}
  .gm-lad{grid-template-columns:repeat(2,1fr)}
  .gm-in{grid-template-columns:repeat(3,1fr)}
}

@media print{
  .gm-side.ours,.gm-link.ours,.gm-link.his,.gm-eq,.gm-tr.goal,.gm-brow.high,.gm-o.key,.gm-st.gate{
    background:#fff!important;border-color:#000!important}
  .gm-big b,.gm-m .k,.gm-eq b,.gm-tr.goal .x,.gm-o.key b,.gm-o.x b,.gm-st.gate .amt,.gm-st .dt{color:#000!important}
  .gm-mk.d,.gm-mk.h{color:#000!important;border-color:#000!important}
  .gm-bar .r i,.gm-tr .r i{background:#000!important}
  .gm-brow .lv i.on{background:#000!important}
  .gm-calc{break-inside:avoid}
  .gm-f input[type=range]{display:none}
}

/* ========================================================================
   Презентационная версия для встречи втроём. Приватный слой.
   По умолчанию иконок нет ни визуально, ни в потоке: на общем экране
   случайный клик раскрыл бы внутреннюю трактовку всем сразу. Иконки
   включаются одним переключателем в шапке, он же гасит всё открытое.
   ======================================================================== */
.pv-sw{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 11px;
  border:1px solid var(--bd);border-radius:9px;background:transparent;color:var(--dim);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:color .25s,border-color .25s,background-color .25s;flex:none}
.pv-sw svg{width:14px;height:14px}
.pv-sw:hover{color:var(--mut);border-color:var(--bd2)}
.pv-sw[aria-pressed="true"]{color:var(--ink);background:var(--lime);border-color:var(--lime)}
.pv-sw:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pv-sw .lb{display:none}
@media(min-width:900px){.pv-sw .lb{display:inline}}

.pv-i{display:none}
.pv-on .pv-i{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;margin-left:9px;vertical-align:middle;flex:none;
  border:1px solid rgba(199,255,57,.45);border-radius:7px;background:rgba(199,255,57,.08);
  color:var(--lime);cursor:pointer;transition:background-color .2s}
.pv-on .pv-i:hover{background:rgba(199,255,57,.18)}
.pv-i svg{width:13px;height:13px}
.pv-i:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.pv-b{display:none}
.pv-on .pv-b.open{display:block;margin-top:18px;padding:18px 20px;border-radius:12px;
  border:1px dashed rgba(199,255,57,.4);background:rgba(199,255,57,.05)}
.pv-b .ph{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--lime);margin-bottom:10px}
.pv-b p{font-size:14px;color:var(--mut);line-height:1.6}
.pv-b p+p{margin-top:9px}
.pv-b b{color:var(--txt)}
.pv-b ul{list-style:none;display:grid;gap:7px;margin-top:9px}
.pv-b li{font-size:14px;color:var(--mut);line-height:1.5;padding-left:16px;position:relative}
.pv-b li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--lime)}

/* Приветственная плашка режима владельцев */
.pv-note{display:none}
.pv-on .pv-note{display:block;margin-top:14px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;color:var(--lime)}

@media print{.pv-sw,.pv-i{display:none!important}.pv-b{display:none!important}}

/* ========================================================================
   Презентационный слой. Экран в переговорной и ретина-маки собственников.
   Базовая система остаётся, здесь меняется масштаб, ритм и плотность.
   Всё завязано на ширину, поэтому телефон и печать не трогаются.
   ======================================================================== */

/* --- Контейнер растёт вместе с экраном. 1152 на 27 дюймах это колонка
       в треть ширины, читатель видит поля, а не документ. --- */
@media(min-width:1440px){ .wrap{max-width:1280px;padding-left:40px;padding-right:40px} }
@media(min-width:1720px){ .wrap{max-width:1500px;padding-left:56px;padding-right:56px} }
@media(min-width:2100px){ .wrap{max-width:1720px} }

/* --- Типографика. Крупный дисплейный кегль, плотный трекинг, короткая
       мера строки. На большом экране мелкий текст читают только первые ряды. --- */
@media(min-width:1024px){
  h1{font-size:clamp(3rem,3.7vw,4.7rem);line-height:1.04;letter-spacing:-.034em}
  h2{font-size:clamp(2.2rem,2.9vw,3.4rem);line-height:1.08;letter-spacing:-.028em;max-width:20ch}
  .lead-sm{font-size:clamp(1.05rem,1.15vw,1.3rem);line-height:1.55;max-width:46ch}
  .sub{font-size:clamp(1rem,1.05vw,1.2rem);line-height:1.6;max-width:56ch}
  .card p,.cav p,.warn p,.opt p{font-size:15.5px;line-height:1.62}
}
@media(min-width:1720px){
  .card p,.cav p,.warn p,.opt p{font-size:16.5px}
}

/* --- Воздух. Раздел на большом экране должен занимать экран, а не треть. --- */
@media(min-width:1024px){
  section{padding:120px 0}
  .hero{padding:0;min-height:100svh;display:flex;align-items:center}
  .hero-grid{width:100%;gap:72px;grid-template-columns:1.02fr .98fr;align-items:center}
  .grid{gap:22px;margin-top:52px}
  .m-sec{margin-bottom:28px}
}
@media(min-width:1720px){
  section{padding:150px 0}
  .grid{gap:26px}
}

/* --- Номер раздела становится знаком главы, а не подписью --- */
@media(min-width:1024px){
  .m-sec{position:relative}
  .m-secnum{font-size:15px;color:var(--dim)}
  .m-sec::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,var(--bd),transparent)}
}

/* --- Карточки перестают быть коробками. Волосяная граница, лёгкий
       внутренний градиент, отклик на курсор. Тени по-прежнему запрещены. --- */
@media(min-width:1024px){
  .card,.opt,.cav,.warn,.dec,.gm-side,.gm-m,.gm-tr,.gm-st,.gm-calc{
    background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%)}
  .card,.opt,.dec,.gm-side,.gm-m,.gm-tr,.gm-st{padding:30px;border-radius:14px}
  .gm-calc{padding:40px;border-radius:18px}
  .card,.opt,.dec,.gm-m,.gm-tr{transition:border-color .35s var(--ease),transform .35s var(--ease),background-color .35s var(--ease)}
  .card:hover,.opt:hover,.dec:hover,.gm-m:hover,.gm-tr:hover{
    border-color:var(--bd2);transform:translateY(-3px);background-color:rgba(255,255,255,.015)}
  .card.hl,.gm-side.ours,.gm-tr.goal,.gm-st.gate{
    background-image:linear-gradient(180deg,rgba(199,255,57,.09),rgba(199,255,57,.02) 70%)}
}
@media(prefers-reduced-motion:reduce){
  .card:hover,.opt:hover,.dec:hover,.gm-m:hover,.gm-tr:hover{transform:none}
}

/* --- Цифры. Главный носитель смысла на этом сайте, значит и главный
       носитель масштаба. --- */
@media(min-width:1024px){
  .stat b{font-size:clamp(2.8rem,3.6vw,4.4rem);letter-spacing:-.045em;line-height:.94}
  .stat{padding:44px 0}
  .gm-big b{font-size:clamp(4.5rem,8vw,9rem);letter-spacing:-.05em}
  .gm-big span{font-size:17px;max-width:48ch}
  .gm-m .k{font-size:clamp(2.4rem,3.2vw,3.6rem)}
  .gm-eq b{font-size:clamp(3rem,5vw,4.6rem)}
  .gm-eq{padding:34px 40px;gap:28px}
  .gm-eq span{font-size:16px;max-width:40ch}
  .gm-o b{font-size:18px}
  .gm-o.x b{font-size:34px}
  .gm-o.key b{font-size:23px}
  .gm-o{padding:16px 0}
  .dec .big{font-size:30px}
}

/* --- Две стороны сделки в герое. На узкой колонке подпись и текст
       в одну строку не помещаются и рвутся по слогам. --- */
.gm-side li{display:block}
.gm-side li b{display:block;min-width:0;margin-bottom:3px;font-size:17px;letter-spacing:-.01em}
.gm-side li span{display:block}
@media(min-width:1024px){
  .gm-side{padding:32px}
  .gm-side h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    font-family:var(--mono);font-weight:600;padding-bottom:14px;border-bottom:1px solid var(--bd)}
  .gm-side ul{gap:18px}
  .gm-side li b{font-size:22px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .gm-side li span{font-size:14.5px;line-height:1.5}
  .gm-vs{gap:0}
  .gm-vs-mid{padding:0 22px;font-size:11px;letter-spacing:.3em}
}

/* --- Цепочка передела на большом экране читается как спецификация --- */
@media(min-width:1024px){
  .gm-link{padding:17px 22px;border-radius:10px}
  .gm-link .w{font-size:16.5px}
  .gm-link .o{font-size:12px}
  .gm-chain{gap:4px}
}

/* --- Съёмка занимает всю ширину полосы, а не колонку текста --- */
@media(min-width:1024px){
  .shot{border-radius:16px}
  .shot figcaption{font-size:13.5px;padding:14px 18px}
}

/* --- Кнопки под палец и под курсор на большом экране --- */
@media(min-width:1024px){
  .btn{min-height:52px;padding:0 26px;font-size:15.5px;border-radius:11px}
  .hero-cta{gap:14px;margin-top:38px}
}

/* --- Движение. Параллакс фоновой съёмки на scroll-driven, без слушателей.
       Только там, где движение разрешено. --- */
@media(prefers-reduced-motion:no-preference){
  @supports (animation-timeline: view()){
    .hero-media img{animation:pres-par linear both;animation-timeline:view();
      animation-range:entry 0% exit 100%}
    @keyframes pres-par{from{transform:scale(1.12) translateY(-2.5%)}to{transform:scale(1.12) translateY(2.5%)}}
    .shot img{animation:pres-shot linear both;animation-timeline:view();
      animation-range:entry 10% cover 60%}
    @keyframes pres-shot{from{transform:scale(1.07)}to{transform:scale(1)}}
  }
}

/* --- Шапка карточки со съёмкой --- */
.card .m-fimg{margin:-24px -24px 18px;aspect-ratio:16/9;overflow:hidden;
  border-bottom:1px solid var(--bd);border-radius:11px 11px 0 0;background:#070a08}
.card .m-fimg img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:1024px){ .card .m-fimg{margin:-30px -30px 22px;border-radius:13px 13px 0 0} }
@media print{ .card .m-fimg{display:none} }

/* Фон героя. На большом экране прежняя выдержка съедала кадр целиком:
   0.3 непрозрачности под затемняющим градиентом это почти чёрный
   прямоугольник. Кадр должен читаться, оставаясь фоном. */
@media(min-width:1024px){
  .hero-media.has img{opacity:.46;object-position:70% 42%}
  .hero-media::after{background:
    linear-gradient(90deg,rgba(6,8,7,.94) 0%,rgba(6,8,7,.72) 42%,rgba(6,8,7,.34) 100%),
    linear-gradient(180deg,rgba(6,8,7,.35),rgba(6,8,7,.18) 50%,var(--bg) 97%)}
}
@media(min-width:1720px){ .hero-media.has img{opacity:.52} }

/* Верхняя подсветка героя чуть шире на большом экране */
@media(min-width:1440px){
  .hero-glow{opacity:.9}
}

/* Панель пароля режима владельцев */
.pv-wrap{position:relative;flex:none}
.pv-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:60;display:none;
  width:250px;padding:16px;border-radius:12px;border:1px solid var(--bd2);
  background:var(--bg2);background-image:linear-gradient(180deg,rgba(255,255,255,.04),transparent 60%)}
.pv-pop.on{display:block}
.pv-pop p{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:11px}
.pv-pop form{display:flex;gap:8px}
.pv-pop input{flex:1 1 auto;min-width:0;min-height:40px;padding:0 12px;border-radius:9px;
  border:1px solid var(--bd2);background:var(--bg);color:var(--txt);font-family:var(--mono);
  font-size:15px;letter-spacing:.22em;text-align:center}
.pv-pop input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pv-pop button{flex:none;min-height:40px;padding:0 14px;border-radius:9px;border:none;
  background:var(--lime);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pv-err{margin-top:9px;font-size:12px;color:#ff8f6b;min-height:1.2em}
@media print{.pv-pop{display:none!important}}
</style>

<script>
(function(){
  'use strict';
  var ITER = 250000;
  var TITLES = {"gt":"GT & DG","gm":"GM & DG"};          // ключ документа -> заголовок вкладки браузера
  var gate = document.getElementById('gate');
  var form = document.getElementById('gform');
  var pass = document.getElementById('gpass');
  var btn  = document.getElementById('gbtn');
  var err  = document.getElementById('gerr');
  var key = null;                   // ключ выводим один раз, дальше переключение мгновенное

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

  if (!(window.crypto && window.crypto.subtle)) {
    err.textContent = 'Браузер не поддерживает расшифровку. Откройте в Chrome, Safari или Firefox.';
    pass.disabled = btn.disabled = true;
    return;
  }

  // Один документ в DOM за раз. Держать оба нельзя: у них совпадают
  // id разделов, #hd, #spine и #navd, и initDoc начнёт цеплять чужой.
  function open(name, focusTop){
    var el = document.getElementById('payload-' + name);
    if (!el) return Promise.reject(new Error('нет документа ' + name));
    var raw  = b64(el.textContent.trim());
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    return crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, data)
      .then(function(buf){
        var doc = document.getElementById('doc');
        doc.innerHTML = new TextDecoder().decode(buf);
        doc.setAttribute('data-doc', name);
        document.title = TITLES[name] || document.title;
        try { history.replaceState(null, '', '#' + name); } catch(e) {}
        window.scrollTo(0, 0);
        try { initDoc(); } catch(e) { console.error(e); }
        // вкладка перерисовала #doc целиком, патчи надо наложить заново
        if (window.BLOCKEDIT_REFRESH) { try { window.BLOCKEDIT_REFRESH(); } catch(e) { console.error(e); } }
        if (focusTop) {
          var h = document.getElementById('h-top');
          if (h) { h.setAttribute('tabindex','-1'); h.focus(); }
        }
      });
  }
  window.openDoc = open;

  // Переключатель вкладок живёт внутри шифра, поэтому слушаем делегированно
  document.addEventListener('click', function(ev){
    var t = ev.target.closest && ev.target.closest('[data-go]');
    if (!t || !key) return;
    ev.preventDefault();
    var name = t.getAttribute('data-go');
    if (document.getElementById('doc').getAttribute('data-doc') === name) return;
    open(name, true).catch(function(e){ console.error(e); });
  });

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var p = pass.value;
    if (!p) return;
    btn.disabled = true;
    err.className = 'ok';
    err.textContent = 'Расшифровка...';

    // Соль и вектор берём из первого документа, ключ общий для всех
    var raw = b64(document.getElementById('payload-gt').textContent.trim());
    var salt = raw.slice(0, 16);

    crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt: salt, iterations: ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
      })
      .then(function(k){
        key = k;
        // тот же ключ уходит модулям правки и версий: патчи контента лежат в
        // Supabase шифрованными и открываются только этим паролем
        var patches = Promise.resolve();
        if (window.LIVEEDIT_KEY) {
          try { patches = window.LIVEEDIT_KEY(k) || Promise.resolve(); } catch(e) { console.error(e); }
        }
        // Ключи прошлых сборок выводим в фоне и отдаём модулю позже: они нужны
        // только для чтения правок, сохранённых до стабилизации соли.
        var alts = window.LIVEEDIT_ALT_SALTS || [];
        if (alts.length && window.LIVEEDIT_ALTKEYS) {
          Promise.all(alts.map(function(sb){
            var raw = b64(sb);
            return crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey'])
              .then(function(km){
                return crypto.subtle.deriveKey(
                  { name:'PBKDF2', salt: raw, iterations: ITER, hash:'SHA-256' },
                  km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
              });
          })).then(function(keys){ window.LIVEEDIT_ALTKEYS(keys); }, function(){});
        }
        var want = (location.hash || '').replace('#','');
        if (!document.getElementById('payload-' + want)) want = 'gt';
        // Гейт снимаем только когда правки уже наложены. Иначе зал сначала
        // видит шаблонные цифры, а через полсекунды их подмену на глазах.
        err.textContent = 'Загружаю правки...';
        return Promise.all([open(want, true), patches]);
      })
      .then(function(){
        gate.classList.add('done');
        gate.remove();            // иначе на странице остаётся второй h1
      })
      .catch(function(){
        key = null;
        err.className = '';
        err.textContent = 'Пароль не подошёл.';
        btn.disabled = false;
        pass.select();
      });
  });

  pass.focus();
})();
</script>
<script>
function initDoc(){

  'use strict';
  var d = document;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* слоты съёмки: пометить уже загруженные (кэш опережает onload) */
  d.querySelectorAll('.shot img, .hero-media img').forEach(function(im){
    if (im.complete && im.naturalWidth > 0) im.parentNode.classList.add('has');
  });

  /* базовый reveal: один раз, 12px, 380ms */
  if ('IntersectionObserver' in window && !reduce) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -36px 0px' });
    d.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  } else {
    d.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }

  /* состояние шапки: sentinel вместо слушателя scroll */
  var hd = d.getElementById('hd');
  var sentinel = d.createElement('div');
  sentinel.setAttribute('aria-hidden','true');
  sentinel.style.cssText = 'position:absolute;top:90px;left:0;width:1px;height:1px;pointer-events:none';
  (d.getElementById('doc') || d.body).appendChild(sentinel);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(e){
      hd.classList.toggle('scrolled', !e[0].isIntersecting);
    }, { threshold: 0 }).observe(sentinel);
  } else {
    hd.classList.add('scrolled');
  }

  /* активный раздел: шапка, рейка и позиция «N из 10» одним наблюдателем */
  var spineLinks = [].slice.call(d.querySelectorAll('#spine a'));
  var ids = spineLinks.map(function(a){ return a.getAttribute('href').slice(1); });
  var names = {};
  spineLinks.forEach(function(a){
    var lbl = a.querySelector('.lbl');
    names[a.getAttribute('href').slice(1)] = lbl ? lbl.textContent : '';
  });
  var links = {};
  d.querySelectorAll('#spine a, #navd a').forEach(function(a){
    var id = a.getAttribute('href').slice(1);
    (links[id] = links[id] || []).push(a);
  });
  var posN = d.getElementById('m-posn');
  var posT = d.getElementById('m-post');
  function setActive(id){
    Object.keys(links).forEach(function(k){
      links[k].forEach(function(a){
        if (k === id) a.setAttribute('aria-current','true');
        else a.removeAttribute('aria-current');
      });
    });
    var i = ids.indexOf(id);
    if (i > -1 && posN && posT) {
      posN.textContent = (i + 1) + ' из ' + ids.length;
      posT.textContent = names[id] || '';
    }
  }
  setActive('top');
  if ('IntersectionObserver' in window) {
    var seen = {};
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ seen[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0; });
      var best = null, bestVal = 0;
      ids.forEach(function(id){ if ((seen[id] || 0) > bestVal) { bestVal = seen[id]; best = id; } });
      if (best) setActive(best);
    }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.01, 1] });
    ids.forEach(function(id){ var el = d.getElementById(id); if (el) spy.observe(el); });
  }

  /* мобильное меню: ловушка фокуса и Esc */
  var mm = d.getElementById('mmenu');
  var mopen = d.getElementById('mopen');
  var mclose = d.getElementById('mclose');
  var lastFocus = null;
  function openMenu(){
    lastFocus = d.activeElement;
    mm.classList.add('open');
    d.body.classList.add('lock');
    mopen.setAttribute('aria-expanded','true');
    mclose.focus();
  }
  function closeMenu(){
    mm.classList.remove('open');
    d.body.classList.remove('lock');
    mopen.setAttribute('aria-expanded','false');
    if (lastFocus) lastFocus.focus();
  }
  mopen.addEventListener('click', openMenu);
  mclose.addEventListener('click', closeMenu);
  mm.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeMenu); });
  d.addEventListener('keydown', function(ev){
    if (!mm.classList.contains('open')) return;
    if (ev.key === 'Escape') { closeMenu(); return; }
    if (ev.key !== 'Tab') return;
    var f = mm.querySelectorAll('a[href], button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && d.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && d.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  /* FAQ: аккордеон, первый открыт из разметки */
  d.querySelectorAll('.fbtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = btn.closest('.fitem');
      var was = item.classList.contains('open');
      d.querySelectorAll('.fitem.open').forEach(function(i){
        i.classList.remove('open');
        i.querySelector('.fbtn').setAttribute('aria-expanded','false');
      });
      if (!was) { item.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
    });
  });


  /* ---------- калькулятор, только на вкладке GM ----------
     Считает в лоб и в человеческих единицах: штуки, рубли, проценты.
     Прошлая версия крутила множители, доли себестоимости и скорость раскатки,
     то есть требовала держать в голове модель, чтобы понять цифру на экране.
     На встрече втроём это работает против нас: спорить начинают о механике
     калькулятора, а не о сделке. */
  var calc = d.getElementById('gmcalc');
  if (calc) {
    var f = ['deals','chek','marg'].map(function(k){
      return { k: k, el: d.getElementById('c-' + k), out: d.getElementById('v-' + k) };
    });
    var mln  = function(v){ return (v / 1e6).toFixed(1).replace('.', ',') + ' млн \u20BD'; };
    var rub  = function(v){ return Math.round(v).toLocaleString('ru-RU') + ' \u20BD'; };
    var num  = function(v){ return Math.round(v).toLocaleString('ru-RU'); };

    function recount(){
      var v = {};
      f.forEach(function(x){ v[x.k] = parseFloat(x.el.value); });
      f.forEach(function(x){
        if (x.k === 'deals')     x.out.textContent = num(v.deals);
        else if (x.k === 'chek') x.out.textContent = rub(v.chek);
        else                     x.out.textContent = Math.round(v.marg) + '%';
      });

      var rev  = v.deals * v.chek;
      var prof = rev * v.marg / 100;

      d.getElementById('o-rev').textContent  = mln(rev);
      d.getElementById('o-prof').textContent = mln(prof);
      d.getElementById('o-half').textContent = mln(prof / 2);

      /* подсветка сценария, если ползунки совпали с пресетом */
      d.querySelectorAll('.gm-pb').forEach(function(b){
        var p = b.getAttribute('data-pre').split('|');
        var hit = (+p[0] === v.deals && +p[1] === v.chek && +p[2] === v.marg);
        b.classList.toggle('on', hit);
      });
    }

    d.querySelectorAll('.gm-pb').forEach(function(b){
      b.addEventListener('click', function(){
        var p = b.getAttribute('data-pre').split('|');
        f[0].el.value = p[0]; f[1].el.value = p[1]; f[2].el.value = p[2];
        recount();
      });
    });
    f.forEach(function(x){ x.el.addEventListener('input', recount); });
    recount();
  }


  /* ---------- приватный слой презентации ----------
     Замки навешиваются напрямую на каждую кнопку, а не делегированно.
     Кнопки пересоздаются вместе с документом при переключении вкладок,
     поэтому прямое навешивание не может задвоиться. Делегирование здесь
     уже ломалось: обработчик стакался и toggle отменял сам себя. */
  var sw = d.getElementById('pvt');
  if (sw) {
    var PASS = '0103';
    var root = d.getElementById('doc') || d.body;
    var pop  = d.getElementById('pvpop');
    var fld  = d.getElementById('pvpass');
    var err  = d.getElementById('pverr');

    function closeAll(){
      d.querySelectorAll('.pv-b.open').forEach(function(b){ b.classList.remove('open'); });
      d.querySelectorAll('.pv-i[aria-expanded="true"]').forEach(function(i){ i.setAttribute('aria-expanded','false'); });
    }
    function off(){
      sw.setAttribute('aria-pressed','false');
      root.classList.remove('pv-on');
      if (pop) pop.classList.remove('on');
      closeAll();
    }
    function on(){
      sw.setAttribute('aria-pressed','true');
      root.classList.add('pv-on');
      if (pop) pop.classList.remove('on');
      if (err) err.textContent = '';
      if (fld) fld.value = '';
    }

    sw.addEventListener('click', function(){
      if (sw.getAttribute('aria-pressed') === 'true') { off(); return; }
      if (!pop) { on(); return; }
      pop.classList.toggle('on');
      if (pop.classList.contains('on') && fld) { fld.value=''; if(err) err.textContent=''; fld.focus(); }
    });

    var frm = d.getElementById('pvform');
    if (frm) frm.addEventListener('submit', function(ev){
      ev.preventDefault();
      if (fld && fld.value.trim() === PASS) { on(); }
      else { if (err) err.textContent = 'Не подошёл'; if (fld) { fld.select(); } }
    });

    /* каждый замок получает свой обработчик, элементы всегда свежие */
    d.querySelectorAll('.pv-i').forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.preventDefault();
        if (!root.classList.contains('pv-on')) return;
        var box = d.getElementById(b.getAttribute('aria-controls'));
        if (!box) return;
        var open = box.classList.toggle('open');
        b.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    /* Esc гасит весь слой разом. Вешается однажды за жизнь страницы. */
    if (!window.__pvEsc) {
      window.__pvEsc = true;
      d.addEventListener('keydown', function(ev){
        if (ev.key !== 'Escape') return;
        var host = d.getElementById('doc') || d.body;
        var b = d.getElementById('pvt'), pp = d.getElementById('pvpop');
        if (pp) pp.classList.remove('on');
        if (!host.classList.contains('pv-on')) return;
        if (b) b.setAttribute('aria-pressed','false');
        host.classList.remove('pv-on');
        d.querySelectorAll('.pv-b.open').forEach(function(x){ x.classList.remove('open'); });
        d.querySelectorAll('.pv-i[aria-expanded="true"]').forEach(function(x){ x.setAttribute('aria-expanded','false'); });
      });
    }
  }

  /* печать: раскрыть все ответы, показать все блоки */
  if (!window.__printBound) { window.__printBound = true;
  window.addEventListener('beforeprint', function(){
    d.querySelectorAll('.fitem').forEach(function(i){ i.classList.add('open'); });
    d.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }); }
}
</script>
