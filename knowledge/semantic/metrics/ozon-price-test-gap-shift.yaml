# Тест 4 (OZON): держит ли Ozon процент скидки, когда мы снижаем предельную цену.
id: ozon-price-test-gap-shift
title: "Тест 4: сдвиг разрыва тестовой группы к контролю после снижения предельной цены на 10%"
version: 3   # v3 12.10 (E065, Иван «3б 4да», вариант «а»): грязные тестовые товары, свежесть данных, окно меток, «вердикта нет». v2 01.10: сдвиг по каждому товару к своей базе (ФЕНИКС G1), вердикт по медиане последних 7 дней (Иван, п. 1а), коридор цены
status: draft   # v3 ждёт подписи Ивана («ок по спеке v3»); v2 approved 01.10
owner: "Иван Раюшкин"
approved_at: "2026-10-01"   # ответы в чате 01.10: состав 10 товаров «вывести», глубина 10%, пороги, старт 07.10, замер 21.10
decision: >
  Держит - скидку сверх обычной даём своей ценой на выбранных товарах, а не подъёмом ставки за заказ
  до 7-9% на весь магазин (ставка за заказ остаётся на минимуме 5%). Не держит - затея отменяется,
  скидку даёт только ставка. Частично - сравниваем рубль скидки покупателю в обеих ветках.
good_direction: "сдвиг около нуля (держит)"
entity: "товар (артикул) x наблюдаемый день снимка цен"
key: [date, art]
type: derived
formula_text: >
  разрыв(товар, день) = (1 - витрина / предельная) * 100 = gap_pct из gap_daily.
  контроль(день) = медиана разрыва контроля. дни базы = 7 последних наблюдаемых дней до старта.
  база(товар) = медиана (разрыв(товар, день) - контроль(день)) по дням базы.
  сдвиг(товар, день) = разрыв(товар, день) - контроль(день) - база(товар).
  сдвиг(день) = медиана сдвига(товар, день) по засчитанным товарам (после старта - только с ценой в коридоре
  «снижена»); день пустой, если засчитано меньше половины группы. Одна популяция до и после старта (E056).
  Вердикт - по медиане сдвига(день) за последние 7 наблюдаемых дней окна. Ожидаемый сдвиг при «не держит»
  E = -(100 - g) * 0.10 / 0.90, g - медиана разрыва теста в базе.
code_module: analytics-mvp/src/scripts/price-test.ts
filters:
  include_statuses: []
  exclude:
    - "контроль: товары тестов 1-3 (тест, контроль, роли, пары ставок, лог кампаний)"
    - "контроль: соседи тестовых товаров по объединённой карточке"
    - "контроль: товары с расходом на рекламу за клик с 01.09"
    - "контроль: участники «Максимального бустинга» и «Усиления» с начала базы"
    - "тест (v3): товар не засчитывается в дне d, если исключён в tests.json «исключены», или есть расход на рекламу за клик в любой день с [старт - 14 дн] по d, или в день d он в «Максимальном бустинге» (включая «...: усиление»); такой товар не входит ни в свою базу, ни в день"
    - "тест (v3, fail-closed): день d после 23.09 не засчитывается ни для одного тестового товара, если выгрузка рекламы по товарам (ads_sku_daily) заканчивается раньше d или за d нет снимка акций (acts_daily); на карточке красная строка со списком таких дней"
    - "тест: товар в дне засчитывается, только если предельная по снимку цен в коридоре 0.90 * база ± 1.5% (от -8,65% до -11,35% к базе); старая цена (база ± 1.5%) - «не снижена», всё прочее - «аномалия», не засчитывается"
cancellations_returns:
  mode: "не применимо (цены, не заказы); в справочных штуках отмены исключены"
  return_date_basis: ""
date_field: "дата снимка цен (gap_daily.date)"
mode: period
conversion_window_days: null
cohort_maturity_rule: ""
timezone: Europe/Moscow
interval: "база [старт - 7 наблюдаемых дней, старт), окно [07.10, 21.10), замер 21.10"
partial_period: mark
additive_over_time: false
accounting_basis: ""
empty_value: "null: день без снимка не считается и не равен нулю; строка с ценой сайта, равной нашей (разрыв 0, метка no_site), у карточки БЕЗ ИСТОРИИ ненулевого разрыва - тоже null, не 0 (Иван 16.10 «пиши нет данных», 19.10 - со SKU или без, но только пока у артикула не было дня с ненулевым разрывом; PR #487); ноль у карточки с историей - честный 0, он и есть стоп «разрыв обвалился к нулю» (см. stop)"
source:
  endpoint: "срез кабинета (gap_daily.ndjson, src snapshot/prices_raw), снимок цен prices_daily.ndjson (поле price = предельная с 23.09)"
  fields: [gap_pct, price]
  limits: "снимки по будням; выходные пропущены"
  latency: "срез кабинета днём (мак), снимок цен ~08:53 МСК (ozon-snapshots.yml)"
  lookback_days: 0
reconciliation:
  against_family: "documents"
  document: "реестр начислений за октябрь (payout_orders): цена продавца и баллы Ozon по заказам тестовых товаров после старта"
  tolerance: "1 п."
inference_rules:
  min_n: "не меньше 3 наблюдаемых дней в окне для вердикта; не меньше половины тестовых товаров с подтверждённым снижением в дне"
  mde: "шум базы по сдвигу дня 0.20 п., по разнице группы 0.24 п. (21-30.09, страница 01.10); пороги -1 п. (держит) и -4 п. (не держит), ожидаемое E около -5.6 п. (считается на странице)"
  causal_claims: forbidden_without_control
v3_rules:   # 12.10, ждёт подписи
  min_clean: "знаменатель - вся группа (10): если чистых товаров (не исключены, без рекламы и второй акции на последний день окна) меньше ceil(0.5 * группы) = 5, вердикт «вердикта нет», база, шум, разрыв группы и сдвиг не считаются, плашка красная"
  window_labels: "метки «не в расчёте» и счёт чистых - на день min(последний снимок разрыва, конец окна - 1); реклама или акции после конца окна итог не меняют"
  item_base_gap: "колонка «Разрыв в базе» - медиана разрыва самого товара за 7 его последних наблюдаемых дней до старта"
  views: "доля показов и стоп по показам - по чистым товарам (если чистых нет - по всей группе)"
  excluded_keys: "ключ «исключены», которого нет в «тест», - ошибка сборки"
  post_start_events: "товар, у которого акции изменились после старта (возможная реакция OZON на снижение), исключается; на странице оговорка под вердиктом (Иван 12.10, вариант «а»)"
thresholds:   # [ГИПОТЕЗА], приняты Иваном 01.10, пересмотр после замера. Правило вердикта - Иван 01.10, п. 1а (после аудита ФЕНИКСА)
  verdict_on: "медиана сдвига за последние 7 наблюдаемых дней окна [старт, замер); до замера тот же расчёт с пометкой «предварительно»"
  holds: "медиана >= -1 п."
  fails: "медиана <= -4 п."
  partial: "иначе: держит частично, доля = 1 - медиана сдвига / E; на замере окно продлевается до 28.10, итог на 28.10"
  views_drop: "доля группы в показах магазина за 7 дней ниже базы на 20% и больше две недели подряд"
  stop: "доля показов за день ниже половины базы 3 дня подряд, или разрыв товара с историей обвалился к нулю (OZON перестал доплачивать; стоп держится с даты первого обвала; выход из «Эластичного бустинга» разрыв не обваливает и список акций acts_daily этот стоп не заменяет - ФЕНИКС 19.10 Z2); системный день (цена сайта равна нашей у 90% строк дня и больше, не меньше 50 строк) - весь день null, стоп не считается (Иван 19.10 по K2)"
golden_rows:
  - input: "база 7 дней: разница 1.30, 1.06, 0.99, 1.52, 1.28, 1.19, 1.20; день после старта: тест 47.0, контроль 48.0"
    expected: "база = 1.20 (медиана), разница дня = -1.0, сдвиг = -2.2 (держит частично, если медиана последних 7 дней окна такая на замере)"
    confirmed_by: "юнит-тест price-test.test.ts"
  - input: "g = 48.5 в базе, снижение 10%"
    expected: "E = -(100 - 48.5) * 0.1 / 0.9 = -5.72 п."
    confirmed_by: "юнит-тест price-test.test.ts"
  - input: "предельная в базе 68 300, в день 61 470 (-10%)"
    expected: "день засчитан; 64 885 (-5%), 55 300 (-19%), 34 800 (витрина в поле price) - аномалия, не засчитан"
    confirmed_by: "юнит-тест price-test.test.ts"
