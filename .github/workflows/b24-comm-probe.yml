name: B24 comm probe (возраст сделок по активности vs создание, read-only)

# Демонстрация для РОП-дашборда: по открытым сделкам воронки 49 сравниваем
# возраст «с даты создания» (как сейчас) против LAST_ACTIVITY_TIME и
# LAST_COMMUNICATION_TIME. Показываем примеры со ссылками и агрегат: сколько из
# «брошенных 30+» на самом деле недавно трогали. Только чтение.
# Запуск: push этого файла в rop-dashboard-v1 или workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-comm-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Возраст сделок - создание vs активность vs контакт
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета B24_WEBHOOK_URL"; exit 1; fi
          cat > /tmp/comm.mjs <<'MJS'
          const base = (process.env.B24_WEBHOOK_URL || '').replace(/\/+$/,'');
          const PORTAL = 'https://glassmemory.bitrix24.ru';
          const call = async (m,p={}) => {
            const r = await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
            let j={}; try{j=await r.json();}catch(e){j={error:'parse'};}
            return j;
          };
          const NOW = Date.now(), DAY = 86400000;
          const parse = s => { if(!s) return null; const t = String(s); if(t.startsWith('0000')) return null; const d = Date.parse(t); return isNaN(d)?null:d; };
          const ageD = s => { const d = parse(s); return d===null ? null : Math.floor((NOW - d)/DAY); };
          const fmtAge = a => a===null ? 'нет' : a+'д';

          (async()=>{
            // Тянем ВСЕ открытые сделки воронки 49 (CLOSED='N'), с полями активности.
            const select = ['ID','TITLE','DATE_CREATE','LAST_ACTIVITY_TIME','LAST_COMMUNICATION_TIME','STAGE_ID','ASSIGNED_BY_ID'];
            let all = [], start = 0;
            for(let i=0;i<40;i++){
              const r = await call('crm.deal.list',{ filter:{CATEGORY_ID:49, CLOSED:'N'}, select, order:{DATE_CREATE:'ASC'}, start });
              if(r.error){ console.log('crm.deal.list error:', r.error_description||r.error); break; }
              const arr = r.result||[]; all = all.concat(arr);
              if(arr.length<50 || r.next===undefined || r.next===null) break;
              start = r.next;
            }
            console.log(`Открытых сделок воронки 49 (CLOSED=N): ${all.length}`);
            console.log(`Сегодня (UTC): ${new Date(NOW).toISOString().slice(0,10)}`);

            const rows = all.map(d => ({
              id: d.ID, title: (d.TITLE||'').slice(0,40),
              created: d.DATE_CREATE, act: d.LAST_ACTIVITY_TIME, comm: d.LAST_COMMUNICATION_TIME,
              aCreated: ageD(d.DATE_CREATE), aAct: ageD(d.LAST_ACTIVITY_TIME), aComm: ageD(d.LAST_COMMUNICATION_TIME),
            }));

            // ── ПРИМЕРЫ: самые старые по созданию (то, что сейчас в «брошенные 30+») ──
            console.log('\n===== 12 самых старых по ДАТЕ СОЗДАНИЯ (сейчас все в корзине «брошенные 30+») =====');
            console.log('ID | ссылка | возраст с создания | посл. активность | посл. контакт клиента | стадия');
            for(const r of rows.slice(0,12)){
              console.log(`#${r.id} | ${PORTAL}/crm/deal/details/${r.id}/ | создан ${fmtAge(r.aCreated)} назад | активность ${fmtAge(r.aAct)} назад | контакт ${fmtAge(r.aComm)} назад`);
            }

            // ── ЯРКИЙ ПРИМЕР: старая по созданию, но недавно был контакт ──
            const misfit = rows.find(r => r.aCreated!==null && r.aCreated>=30 && r.aComm!==null && r.aComm<14);
            console.log('\n===== ПОКАЗАТЕЛЬНЫЙ ПРИМЕР (создана давно, но контакт свежий) =====');
            if(misfit){
              console.log(`Сделка #${misfit.id} «${misfit.title}»`);
              console.log(`  ${PORTAL}/crm/deal/details/${misfit.id}/`);
              console.log(`  Создана: ${misfit.created}  →  ${misfit.aCreated} дней назад  → СЕЙЧАС попадает в «брошенные 30+»`);
              console.log(`  Последний контакт с клиентом: ${misfit.comm}  →  всего ${misfit.aComm} дней назад`);
              console.log(`  Последняя активность: ${misfit.act}  →  ${misfit.aAct} дней назад`);
              console.log(`  ВЫВОД: по дате создания - «брошена», по контакту - живая (${misfit.aComm}д). Откройте таймлайн и сверьте.`);
            } else {
              console.log('Не нашёл сделку create>=30 & contact<14 в открытых - значит старые действительно давно без контакта.');
            }

            // ── АГРЕГАТ: сколько «брошенных 30+ по созданию» на деле свежие по контакту/активности ──
            const old = rows.filter(r => r.aCreated!==null && r.aCreated>30);
            const commFresh = old.filter(r => r.aComm!==null && r.aComm<=30).length;
            const commStale = old.filter(r => r.aComm===null || r.aComm>30).length;
            const actFresh = old.filter(r => r.aAct!==null && r.aAct<=30).length;
            const actStale = old.filter(r => r.aAct===null || r.aAct>30).length;
            console.log('\n===== АГРЕГАТ: корзина «брошенные 30+» (по дате создания) =====');
            console.log(`Всего открытых с возрастом-создания > 30 дней: ${old.length}`);
            console.log(`  из них по ПОСЛ. КОНТАКТУ: свежие (<=30д) = ${commFresh} | реально без контакта (>30д или нет) = ${commStale}`);
            console.log(`  из них по ПОСЛ. АКТИВНОСТИ: свежие (<=30д) = ${actFresh} | реально без активности (>30д или нет) = ${actStale}`);
            console.log(`\nСмысл: ${commFresh} из ${old.length} «брошенных» на самом деле недавно контактировали - счётчик врёт на эту величину.`);
            // сколько у скольких вообще заполнен LAST_COMMUNICATION_TIME
            const noComm = rows.filter(r => r.aComm===null).length;
            console.log(`\nСлужебное: у ${noComm} из ${rows.length} открытых сделок LAST_COMMUNICATION_TIME пустой (нет ни одного контакта / поле не ведётся).`);

            // ── ДЕТАЛИ: ЧТО за «активность» на конкретных сделках (таймлайн + автор) ──
            const TYPE = {1:'Встреча',2:'Звонок',3:'Задача',4:'Письмо',6:'Дело (provider)'};
            const uCache={};
            const uName = async id => { if(!id||String(id)==='0') return 'система/робот'; if(uCache[id]) return uCache[id];
              const u=await call('user.get',{ID:id}); const x=(u.result&&u.result[0])||{};
              const n=[x.LAST_NAME,x.NAME].filter(Boolean).join(' ')||('id'+id); uCache[id]=n; return n; };
            for(const id of [6017,9923,10181,14901]){
              console.log(`\n===== ДЕТАЛИ #${id}  ${PORTAL}/crm/deal/details/${id}/ =====`);
              const dg = await call('crm.deal.get',{id});
              const d = dg.result||{};
              console.log(`  LAST_ACTIVITY_TIME = ${d.LAST_ACTIVITY_TIME||'-'}  | двигал: ${await uName(d.LAST_ACTIVITY_BY)} (LAST_ACTIVITY_BY=${d.LAST_ACTIVITY_BY||'-'})`);
              console.log(`  LAST_COMMUNICATION_TIME = ${d.LAST_COMMUNICATION_TIME||'(пусто)'}`);
              const ac = await call('crm.activity.list',{ filter:{OWNER_TYPE_ID:2, OWNER_ID:id}, order:{ID:'DESC'},
                select:['ID','TYPE_ID','PROVIDER_ID','SUBJECT','CREATED','COMPLETED','DIRECTION','AUTHOR_ID'] });
              const acts = ac.result||[];
              console.log(`  активностей в таймлайне: ${acts.length}${ac.error?(' (ошибка: '+(ac.error_description||ac.error)+')'):''}. Последние 5:`);
              for(const a of acts.slice(0,5)){
                console.log(`    ${a.CREATED} | ${TYPE[a.TYPE_ID]||('type'+a.TYPE_ID)}${a.PROVIDER_ID?('/'+a.PROVIDER_ID):''} | «${(a.SUBJECT||'').slice(0,55)}» | автор ${await uName(a.AUTHOR_ID)}${a.COMPLETED==='Y'?' | завершено':''}`);
              }
              if(!acts.length) console.log('    (активностей в таймлайне нет - значит LAST_ACTIVITY_TIME двигало НЕ «дело», а изменение карточки/робот)');
            }
          })().catch(e=>console.log('FATAL', e && e.message));
          MJS
          node /tmp/comm.mjs
