# Canonical entry selection. Only the access service reads the owner-controlled state.
auth_request /_access/route-check;
auth_request_set $gg_redirect_base $upstream_http_x_gg_redirect_base;
error_page 403 = @gg_selected_entry;
location = /_access/route-check {
 internal;
 auth_basic off;
 auth_request off;
 proxy_pass http://unix:/run/gg-access/http.sock:/route-check;
 proxy_method GET;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Authorization "";
 proxy_set_header X-GG-Request-Host $host;
 proxy_set_header X-GG-Request-Port $server_port;
 proxy_read_timeout 5s;
}
location @gg_selected_entry {
 if ($gg_redirect_base = "") { return 403; }
 return 308 $gg_redirect_base$request_uri;
}
location = /_access/recovery/ {
 auth_request off;
 proxy_pass http://unix:/run/gg-access/http.sock:/recovery;
 proxy_set_header X-GG-Authenticated-User $remote_user;
 proxy_set_header Authorization "";
 proxy_set_header Host $host;
 add_header Cache-Control "private, no-store" always;
 add_header X-Robots-Tag "noindex, nofollow" always;
}
