name: PROD snapshots cron (планировщик на main)

# GitHub запускает расписание (cron) ТОЛЬКО из воркфлоу на дефолтной ветке (main).
# Данные дашборда Производство живут на ветке prod-dashboard-v1, поэтому prod-snapshot.yml
# там по крону не срабатывает. Этот планировщик живёт на main: по расписанию чекаутит
# prod-dashboard-v1, снимает СП «Производство GG» (1086), запекает build-prod, коммитит
# свежие данные туда и дёргает публикацию /prod/ (deploy-pages). Аналог b24-cron.yml.
# Ручной запуск - через workflow_dispatch.
#
# ДВА слота в день - страховка: GitHub schedule best-effort, события могут дропаться
# (утренний слот РОПа 03.07.2026 не сработал вовсе). Второй слот догоняет пропуск.

on:
  schedule:
    - cron: "37 5 * * *" # ~08:37 МСК, основной (смещён от РОП 08:17, чтобы не биться за раннер)
    - cron: "7 10 * * *" # ~13:07 МСК, страховочный
  workflow_dispatch:

permissions:
  contents: write
  actions: write # для dispatch deploy-pages

concurrency:
  group: prod-data
  cancel-in-progress: true

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
  B24_PORTAL: https://glassmemory.bitrix24.ru # домен портала для кликабельных ID (не секрет)
  DATA_BRANCH: prod-dashboard-v1

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-dashboard-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Проверить секрет
        run: |
          set -euo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then
            echo "::error::Секрет B24_WEBHOOK_URL не задан (Settings -> Secrets -> Actions)."; exit 1
          fi
          echo "Секрет на месте."

      - name: Снимок СП Производство -> prod/data/prod.json
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/fetch-prod.ts
          echo "Размер данных: $(du -h prod/data/prod.json | cut -f1)"

      - name: Запечь дашборд (build-prod) -> public/prod-command.html
        run: |
          set -euo pipefail
          npx tsx src/scripts/b24/build-prod.ts
          echo "Дашборд: $(du -h public/prod-command.html | cut -f1)"

      - name: Commit + push в prod-dashboard-v1
        id: commit
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/prod/data analytics-mvp/public/prod-command.html
          if git diff --staged --quiet; then echo "снимок без изменений"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(prod): ночной снимок СП Производство $(date -u +%F)"
          # гонка с ручными правками: rebase конфликтует на запечённом HTML - вместо этого
          # сброс на origin, свежие данные обратно, пересборка на актуальном шаблоне
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$DATA_BRANCH"; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            cp analytics-mvp/prod/data/prod.json /tmp/prod-fresh.json 2>/dev/null || true
            git fetch origin "$DATA_BRANCH"
            git reset --hard "origin/$DATA_BRANCH"
            cp /tmp/prod-fresh.json analytics-mvp/prod/data/prod.json 2>/dev/null || true
            (cd analytics-mvp && npx tsx src/scripts/b24/build-prod.ts)
            git add -A analytics-mvp/prod/data analytics-mvp/public/prod-command.html
            git diff --staged --quiet || git commit -m "data(prod): снимок СП Производство $(date -u +%F)"
            sleep $((2**i))
          done
          echo "push не удался"; exit 1

      - name: Триггер деплоя /prod/ (deploy-pages на main)
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # GitHub иногда отвечает 5xx на dispatch. Без --fail-with-body curl молчит, и публикация
          # теряется незаметно: шаг рапортует успех, а данные на сайт не уезжают. Поэтому ретраи.
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
              -d '{"ref":"main"}' || echo 000)
            if [ "$code" = "204" ]; then ok=1; break; fi
            echo "попытка $i: HTTP $code $(cat /tmp/dispatch.out)"; sleep $((5*i))
          done
          if [ "$ok" != "1" ]; then echo "::error::Публикация не запрошена после 5 попыток"; exit 1; fi
          echo "Публикация /prod/ запрошена."
