name: Импорт конкурентов из Google-таблицы

# Тянет список конкурентов из Google-таблицы (CSV-экспорт) в input.json и пересобирает
# демо-лист «Вид Кати / Конкуренты». Auth не нужен - читаем CSV-экспорт вкладки, поэтому
# таблица должна быть открыта «Все, у кого есть ссылка → Читатель» (иначе Google вернёт 403).
# Из web-контейнера Claude Google закрыт сетевой политикой, поэтому импорт идёт здесь, в Actions.
# Запуск вручную; для регулярного обновления раскомментируй schedule.

on:
  workflow_dispatch:
    inputs:
      sheet_url:
        description: "Ссылка на Google-таблицу (или готовый CSV-export URL)"
        default: "https://docs.google.com/spreadsheets/d/1TzAF_fZw099e5W-7Yyf88u1J32TQxZxJVPDdJMTfOxc/edit?gid=1392017382#gid=1392017382"
  # schedule:
  #   - cron: "0 5 * * *"   # ежедневно 08:00 МСК - обновлять список из таблицы

permissions:
  contents: write

concurrency:
  group: competitors-import
  cancel-in-progress: false

env:
  SHEET_URL: ${{ github.event.inputs.sheet_url || 'https://docs.google.com/spreadsheets/d/1TzAF_fZw099e5W-7Yyf88u1J32TQxZxJVPDdJMTfOxc/edit?gid=1392017382#gid=1392017382' }}

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/focused-davinci-tKJCt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Импорт из таблицы -> input.json
        run: npm run import:competitors -- --url "$SHEET_URL"

      - name: Пересборка демо-листа + smoke-гейт
        run: |
          npm run katya
          npm run smoke

      - name: Коммит обновлённого списка
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics-mvp/src/scripts/competitors/input.json analytics-mvp/public
          if git diff --staged --quiet; then echo "список без изменений"; exit 0; fi
          git commit -m "data: импорт конкурентов из Google-таблицы $(date -u +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase origin claude/focused-davinci-tKJCt && git push; then exit 0; fi
            sleep $((2**i))
          done
          echo "push не удался"; exit 1
