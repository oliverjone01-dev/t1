name: B24 timeline probe v3 - inventory of channels (tasks, mail, calls, messengers, whatsapp)

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-calls-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Инвентарь каналов таймлайна
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета"; exit 1; fi
          cat > /tmp/tl.mjs <<'MJS'
          const base=(process.env.B24_WEBHOOK_URL||'').replace(/\/+$/,'');
          const call=async(m,p={})=>{const r=await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j={};try{j=await r.json();}catch(e){j={error:'parse'};}return j;};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const TYPE={1:'Встреча',2:'Звонок',3:'Задача',4:'Письмо',6:'Дело/провайдер'};
          const dir=d=>String(d)==='1'?'вх':String(d)==='2'?'исх':'-';
          const DEAL=91033, CONTACT=60179;
          const tally=async(f,pages=20)=>{const t={};let last=0;for(let i=0;i<pages;i++){const j=await call('crm.activity.list',{filter:{...f,'>ID':last},select:['ID','TYPE_ID','PROVIDER_ID','PROVIDER_TYPE_ID','DIRECTION'],order:{ID:'ASC'},start:-1});if(j.error){console.log('  err',j.error_description||j.error);break;}const b=j.result||[];if(!b.length)break;for(const a of b){const k=`${TYPE[a.TYPE_ID]||('t'+a.TYPE_ID)} · ${a.PROVIDER_ID||'-'} · ${dir(a.DIRECTION)}`;t[k]=(t[k]||0)+1;}last=Number(b[b.length-1].ID);if(b.length<50)break;await sleep(60);}return t;};
          const show=t=>Object.entries(t).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>console.log(`   ${v}  ${k}`));
          (async()=>{
            console.log('=== ГЛОБАЛЬНО: все каналы таймлайна (сэмпл ~5000 активностей, по провайдеру и направлению) ===');
            show(await tally({}, 100));

            console.log('\n=== СДЕЛКА 91033: активности на самой сделке ===');
            show(await tally({OWNER_TYPE_ID:2, OWNER_ID:DEAL}));

            console.log('\n=== КОНТАКТ 60179 (клиент сделки): звонки/письма/мессенджеры ===');
            show(await tally({OWNER_TYPE_ID:3, OWNER_ID:CONTACT}));

            console.log('\n=== Комментарии таймлайна сделки 91033 ===');
            const cm=await call('crm.timeline.comment.list',{filter:{ENTITY_ID:DEAL, ENTITY_TYPE:'deal'}, order:{ID:'DESC'}});
            console.log(cm.error?('  недоступно: '+(cm.error_description||cm.error)):('  комментариев: '+((cm.result||[]).length)));

            console.log('\n=== Открытые линии/мессенджеры: список коннекторов (imconnector) ===');
            const ic=await call('imconnector.connector.list',{});
            console.log(ic.error?('  недоступно: '+(ic.error_description||ic.error)):('  '+JSON.stringify(ic.result)));
          })().catch(e=>console.log('FATAL',e&&e.message));
          MJS
          node /tmp/tl.mjs
