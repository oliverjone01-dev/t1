name: B24 webhook smoke (read-only)

# Read-only разведка портала Bitrix перед написанием коннектора РОП.
# Проверяет секрет, auth, scope, воронки, сущность лидов, объёмы и UF-поля.
# Значение секрета GitHub автомаскирует. Только чтение (.list/.fields), никаких записей.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}
    steps:
      - name: Секрет присутствует?
        run: |
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then
            echo "::error::Секрет B24_WEBHOOK_URL не задан."; exit 1
          fi
          echo "::add-mask::$B24_WEBHOOK_URL"
          echo "B24_WEBHOOK_URL присутствует, длина ${#B24_WEBHOOK_URL}."

      - name: Auth + scope
        run: |
          base="${B24_WEBHOOK_URL%/}"
          curl -sS --max-time 30 "$base/profile.json" -o /tmp/p.json
          curl -sS --max-time 30 "$base/scope.json" -o /tmp/s.json
          node -e 'const p=require("/tmp/p.json").result||{};const s=require("/tmp/s.json").result||[];console.log("Владелец:",[p.NAME,p.LAST_NAME].filter(Boolean).join(" "),"| ADMIN:",p.ADMIN,"| scope:",JSON.stringify(s));'

      - name: Воронка лидов = classic crm.lead?
        run: |
          base="${B24_WEBHOOK_URL%/}"
          # объём классических лидов
          curl -sS --max-time 30 -X POST "$base/crm.lead.list.json" \
            -H 'Content-Type: application/json' -d '{"select":["ID"],"start":0}' -o /tmp/lead.json || true
          # статусы лидов (стадии воронки лидов)
          curl -sS --max-time 30 -X POST "$base/crm.status.list.json" \
            -H 'Content-Type: application/json' -d '{"filter":{"ENTITY_ID":"STATUS"}}' -o /tmp/lst.json || true
          node -e '
            let L={}; try{L=require("/tmp/lead.json")}catch(e){}
            let S={}; try{S=require("/tmp/lst.json")}catch(e){}
            if(L.error){console.log("crm.lead -> error:",L.error_description||L.error,"(classic-лиды, видимо, выключены)");}
            else{console.log("classic crm.lead: total =", L.total);}
            const st=(S.result||[]).map(x=>x.STATUS_ID+":"+x.NAME);
            console.log("Стадии воронки лидов (STATUS):", st.length?st.join(" | "):"(нет — лиды отключены?)");
          '

      - name: Объёмы сделок (воронка 49 vs категория 69 «GG Лиды»)
        run: |
          base="${B24_WEBHOOK_URL%/}"
          for cat in 49 69; do
            curl -sS --max-time 30 -X POST "$base/crm.deal.list.json" \
              -H 'Content-Type: application/json' -d "{\"filter\":{\"CATEGORY_ID\":$cat},\"select\":[\"ID\"],\"start\":0}" -o /tmp/d$cat.json || true
            node -e "let d={};try{d=require('/tmp/d$cat.json')}catch(e){};console.log('CATEGORY_ID=$cat -> total =', d.total!==undefined?d.total:('error: '+(d.error_description||d.error)));"
          done
          # стадии воронки 49
          curl -sS --max-time 30 "$base/crm.dealcategory.stage.list.json?id=49" -o /tmp/st49.json || true
          node -e 'let j={};try{j=require("/tmp/st49.json")}catch(e){};const s=(j.result||[]).map(x=>x.STATUS_ID+":"+x.NAME);console.log("Стадии воронки 49:", s.join(" | "));'

      - name: UF-поля сделок и лидов (для маппинга assort/dir/reason)
        run: |
          base="${B24_WEBHOOK_URL%/}"
          curl -sS --max-time 30 "$base/crm.deal.fields.json" -o /tmp/df.json || true
          curl -sS --max-time 30 "$base/crm.lead.fields.json" -o /tmp/lf.json || true
          node -e '
            function dump(file,label){
              let j={};try{j=require(file)}catch(e){}
              const f=j.result||{};
              const uf=Object.keys(f).filter(k=>k.indexOf("UF_")===0);
              console.log("=== "+label+" UF-поля: "+uf.length+" ===");
              uf.forEach(k=>{
                const x=f[k]; const items=(x.items||[]).slice(0,8).map(i=>i.ID+"="+i.VALUE).join(", ");
                console.log(k+" | "+(x.title||x.formLabel||"")+" | "+x.type+(items?(" | {"+items+"}"):""));
              });
            }
            dump("/tmp/df.json","DEAL"); dump("/tmp/lf.json","LEAD");
          '
