name: B24 calls probe (сделки с записью исходящих звонков, read-only)

# Ищем сделки с ЗАПИСЬЮ ИСХОДЯЩИХ звонков. voximplant.statistic.get без фильтра по
# сущности (звонки часто привязаны к контакту/лиду, а не к сделке напрямую). Считаем
# распределение CALL_TYPE и CRM_ENTITY_TYPE, собираем сделки (CRM_ENTITY_TYPE=DEAL) и
# отдельно домапливаем звонки-активности на сделку. Только чтение. Запуск: push в rop-dashboard-v1.

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-calls-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Сделки с записью исходящих звонков
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета B24_WEBHOOK_URL"; exit 1; fi
          cat > /tmp/calls.mjs <<'MJS'
          const base = (process.env.B24_WEBHOOK_URL || '').replace(/\/+$/,'');
          const PORTAL = 'https://glassmemory.bitrix24.ru';
          const call = async (m,p={}) => {
            const r = await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
            let j={}; try{j=await r.json();}catch(e){j={error:'parse'};}
            return j;
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const typeCnt={}, entCnt={}, recEntCnt={};
            const dealRec={};        // сделки с записью исходящего (прямая привязка DEAL)
            const actIds=[];         // CRM_ACTIVITY_ID звонков-записей на контакте/лиде - домапим на сделку
            let start=0, scanned=0, outRec=0, capped=false;
            for(let i=0;i<400;i++){
              const j=await call('voximplant.statistic.get',{ order:{CALL_START_DATE:'DESC'}, start });
              if(j.error){ console.log('ошибка на стр', i, j.error_description||j.error); break; }
              const rows=j.result||[]; if(!rows.length) break;
              for(const c of rows){
                scanned++;
                typeCnt[c.CALL_TYPE]=(typeCnt[c.CALL_TYPE]||0)+1;
                if(c.CRM_ENTITY_TYPE) entCnt[String(c.CRM_ENTITY_TYPE)]=(entCnt[String(c.CRM_ENTITY_TYPE)]||0)+1;
                const isOut=String(c.CALL_TYPE)==='1';
                const hasRec=(c.RECORD_FILE_ID&&String(c.RECORD_FILE_ID)!=='0')||(c.CALL_RECORD_URL&&String(c.CALL_RECORD_URL).length>5);
                if(isOut&&hasRec){
                  outRec++;
                  const et=String(c.CRM_ENTITY_TYPE||'нет'); recEntCnt[et]=(recEntCnt[et]||0)+1;
                  if(et==='DEAL'){
                    const id=String(c.CRM_ENTITY_ID);
                    const e=(dealRec[id]||={n:0,rec:'',date:''}); e.n++;
                    if(!e.rec){e.rec=c.CALL_RECORD_URL||('file:'+c.RECORD_FILE_ID); e.date=(c.CALL_START_DATE||'').slice(0,10);}
                  } else if(c.CRM_ACTIVITY_ID){ actIds.push(String(c.CRM_ACTIVITY_ID)); }
                }
              }
              if(j.next===undefined||j.next===null){ break; }
              start=j.next; if(i===399) capped=true; await sleep(120);
            }
            console.log(`Просмотрено звонков: ${scanned}${capped?' (упёрлись в лимит страниц - не все)':''}`);
            console.log('CALL_TYPE распределение (1=исходящий, 2=входящий):', JSON.stringify(typeCnt));
            console.log('CRM_ENTITY_TYPE всех звонков:', JSON.stringify(entCnt));
            console.log(`\nИсходящих звонков С ЗАПИСЬЮ: ${outRec} | их привязка:`, JSON.stringify(recEntCnt));

            const direct=Object.entries(dealRec).sort((a,b)=>b[1].n-a[1].n);
            console.log(`\n[A] Сделки с записью исходящего (прямая привязка DEAL): ${direct.length}`);
            for(const [id,e] of direct.slice(0,60)) console.log(`  #${id} | звонков ${e.n} | ${e.date} | ${PORTAL}/crm/deal/details/${id}/ | ${e.rec}`);
            if(direct.length>60) console.log(`  … ещё ${direct.length-60}`);

            const uniqAct=[...new Set(actIds)].slice(0,500);
            const dealsViaAct={};
            for(const aid of uniqAct){
              const a=await call('crm.activity.get',{id:aid});
              const r=a.result; if(r && String(r.OWNER_TYPE_ID)==='2'){ const id=String(r.OWNER_ID); dealsViaAct[id]=(dealsViaAct[id]||0)+1; }
            }
            const viaAct=Object.entries(dealsViaAct).filter(([id])=>!dealRec[id]).sort((a,b)=>b[1]-a[1]);
            console.log(`\n[B] Ещё сделки, где звонок-запись лежит активностью на сделке (проверено ${uniqAct.length} активностей): ${viaAct.length}`);
            for(const [id,n] of viaAct.slice(0,60)) console.log(`  #${id} | звонков ${n} | ${PORTAL}/crm/deal/details/${id}/`);

            const all=new Set([...direct.map(x=>x[0]),...viaAct.map(x=>x[0])]);
            console.log(`\nИТОГО уникальных сделок с записью исходящего звонка: ${all.size}`);
          })().catch(e=>console.log('FATAL', e && e.message));
          MJS
          node /tmp/calls.mjs
