<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПТО · Запуски расчётов</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surf:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s0:#f0efec; --s1:#cde2fb; --s2:#9ec5f4; --s3:#5598e7; --s4:#2a78d6; --s5:#184f95;
  --bar:#2a78d6;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surf:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s0:#232322; --s1:#0d366b; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef;
  --bar:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 72px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.005em}
.sub{color:var(--ink-3);font-size:12px;margin:0 0 22px}
.card{background:var(--surf);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.muted{color:var(--ink-3)}
.sec{color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink-3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* --- вердикт --- */
.verdict{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.02em}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--ring)}
.vtext{flex:1 1 380px;min-width:280px}
/* --- календарь --- */
.mrow{display:flex;gap:16px;flex-wrap:wrap}
.mon{margin:0 0 14px}
.mon h3{font-size:12.5px;margin:0 0 6px;color:var(--ink-2);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,30px);gap:3px;margin:0 0 3px}
.dow span{font-size:10px;color:var(--ink-3);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,30px);gap:3px}
.cell{width:30px;height:30px;border-radius:4px;background:var(--s0);
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);position:relative;cursor:default}
.cell.void{background:transparent}
.cell.we{opacity:.42}
.cell.future{background:transparent;border:1px dashed var(--grid);color:var(--ink-3)}
.cell.tail{outline:2px solid var(--ink-3);outline-offset:-2px}
.cell.hi{color:#fff}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.lgsteps{display:flex;align-items:center;gap:3px}
.lgsteps i{width:16px;height:16px;border-radius:3px;display:block}
/* --- столбики --- */
.bars{display:flex;align-items:flex-end;gap:26px;height:150px;padding:18px 4px 0;border-bottom:1px solid var(--axis)}
.bcol{flex:0 0 96px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bval{font-size:13px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums}
.bfill{width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:3px}
.blab{font-size:11.5px;color:var(--ink-3);margin-top:7px;text-align:center}
/* --- фильтры и таблица --- */
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
select,input{font:13px system-ui,sans-serif;color:var(--ink);background:var(--surf);
  border:1px solid var(--ring);border-radius:7px;padding:5px 9px}
input{min-width:190px}
.scroll{max-height:560px;overflow:auto}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--ring);color:var(--ink-2)}
.pill.won{color:var(--good);border-color:var(--good)}
.pill.lost{color:var(--crit);border-color:var(--crit)}
.tt{position:fixed;z-index:9;pointer-events:none;background:var(--surf);color:var(--ink);
  border:1px solid var(--ring);border-radius:8px;padding:7px 10px;font-size:12px;
  box-shadow:0 6px 22px rgba(0,0,0,.14);display:none;max-width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
a{color:inherit}
.tgl{position:absolute;right:16px;top:20px;font-size:12px;color:var(--ink-3);cursor:pointer;
  background:none;border:1px solid var(--ring);border-radius:7px;padding:4px 9px}
</style></head>
<body>
<div class="wrap" style="position:relative">
<button class="tgl" id="tgl">тема</button>
<h1>ПТО · запуски расчётов</h1>
<p class="sub" id="stamp"></p>
<div id="app"></div>
</div>
<div class="tt" id="tt"></div>
<script>
const D = __PTO_DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => (Math.round(n)||0).toLocaleString('ru-RU')+' ₽';
const MON = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONR = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const monTitle = m => MON[+m.slice(5,7)-1]+' '+m.slice(0,4);
const monDay = (m,d) => d+' '+MONR[+m.slice(5,7)-1];
const dru = s => s.split('-').reverse().join('.');
const plural = (n,a,b,c)=>{const x=n%10,y=n%100;return x===1&&y!==11?a:x>=2&&x<=4&&(y<12||y>14)?b:c;};

$('#stamp').textContent =
  `Снимок Bitrix24 ${String(D.snapshot).slice(0,10)} · воронка «GG RF Заказы» · запуски с ${dru(D.from)}`
  + (D.public ? ' · публичная версия: без названий сделок, сумм и фамилий' : ' · полная версия')
  + ` · собрано ${String(D.bakedAt).slice(0,16).replace('T',' ')}`;

$('#tgl').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

const sc = k => D.scenarios.find(s=>s.key===k);
const cell = (v,l) => `<div><div style="font-size:22px;font-weight:600;font-variant-numeric:tabular-nums">${v}</div><div class="muted" style="font-size:12px">${l}</div></div>`;

/* ---------- вердикт: строится по таблице, а не по одной клетке ---------- */
function verdict(){
  const clean = sc('clean'), raw = sc('raw');
  const t5c = clean.rows.find(r=>r.kind==='tail'&&r.n===5);
  const t5r = raw.rows.find(r=>r.kind==='tail'&&r.n===5);
  const tails = clean.rows.filter(r=>r.kind==='tail');
  const above = tails.filter(r=>r.ratio>1.10).length;
  const best = clean.rows.reduce((a,b)=>b.p<a.p?b:a);
  return `<section class="card"><h2>Правда ли, что к концу месяца в расчёт отдают больше</h2>
  <div class="verdict">
    <div style="flex:0 0 220px">
      <div class="hero" style="font-size:26px;line-height:1.15;color:var(--ink)">Нет,<br>это не подтверждается</div>
      <div class="vbadge" style="margin-top:10px;color:var(--ink-3)">на очищенных данных ${t5c.ratio.toFixed(2)}×, p ${t5c.p.toFixed(3)}</div>
    </div>
    <div class="vtext">
      <p style="margin:0 0 8px">Проверено <b>${clean.rows.length} определений «конца месяца»</b> сразу, а не одно.
      ${above ? `Из ${tails.length} окон по рабочим дням выше 1.10 держатся ${above}.`
              : `Ни одно из ${tails.length} окон по рабочим дням не поднимается выше 1.10.`}
      Самым «значимым» получается не конец месяца, а <b>${esc(best.label)}</b> (${best.ratio.toFixed(2)}×, p ${best.p.toFixed(3)}),
      но и это не находка: когда смотришь ${clean.rows.length} окон, одно «значимое» появляется само собой.
      Поправка на ${clean.rows.length} просмотров даёт ${(1-Math.pow(1-best.p, clean.rows.length)).toFixed(2)} вместо ${best.p.toFixed(3)}.</p>
      <p style="margin:0 0 8px" class="sec">Две очистки убирают остаток эффекта. Дедуп по паре (сделка, день) снимает
      ${D.totals.dup} ${plural(D.totals.dup,'строку','строки','строк')} из ${D.totals.rows}: это повторный вход одной
      сделки за день, прокликивание карточки. Ещё ${D.holidays.length} нерабочих дня стояли в знаменателе как рабочие,
      хотя запусков в них ровно ноль. Хвост 5 рабочих дней: ${t5r.ratio.toFixed(2)}× (p ${t5r.p.toFixed(3)}) на сырых
      данных против <b>${t5c.ratio.toFixed(2)}× (p ${t5c.p.toFixed(3)})</b> на очищенных.</p>
      <p style="margin:0" class="muted">Считано по ${D.closed.length} закрытым месяцам (${D.closed.map(monTitle).join(', ')}).
      Текущий месяц в проверку хвоста не входит: его конец ещё не наступил.</p>
    </div>
  </div></section>`;
}

/* ---------- что выросло на самом деле ---------- */
function realCause(){
  const b=D.period.before, a=D.period.after;
  const up = b.perDay ? (a.perDay/b.perDay-1)*100 : 0;
  const lr = Object.entries(D.lrByMonth).sort();
  return `<section class="card"><h2>Что действительно изменилось</h2>
  <div class="verdict">
    <div style="flex:0 0 220px">
      <div class="hero" style="color:var(--serious)">${up>0?'+':''}${up.toFixed(0)}%</div>
      <div class="vbadge" style="margin-top:8px;color:var(--serious)">темп после ${dru(D.replumb)}</div>
    </div>
    <div class="vtext">
      <p style="margin:0 0 8px">До ${dru(D.replumb)} в расчёт заходило <b>${b.perDay.toFixed(2)}</b> сделки на рабочий день,
      после <b>${a.perDay.toFixed(2)}</b>. Ощущение ПТО «стало больше» похоже на правду, но дело не в конце месяца.</p>
      <p style="margin:0 0 8px" class="sec">Ровно в этот день из воронки исчезла стадия <code>C49:UC_LRFLH9</code>.
      Через неё прошло ${Object.values(D.lrByMonth).reduce((s,x)=>s+x,0)} переходов, больше чем через сам «Расчёт»:
      ${lr.map(([m,n])=>`${monTitle(m).split(' ')[0].toLowerCase()} ${n}`).join(', ')}, дальше ноль.
      Часть потока, которая шла через неё, теперь идёт в «Расчёт».</p>
      <p style="margin:0" class="muted">Это совпадение по датам, а не доказанная причина. Чем была эта стадия и почему
      её сняли, по снимку не восстановить: названия удалённых стадий Bitrix не хранит.</p>
    </div>
  </div></section>`;
}

/* ---------- таблица устойчивости ---------- */
function stability(){
  const keys = D.scenarios.map(s=>s.key);
  const rows = sc('raw').rows.map((r,i)=>{
    const cells = D.scenarios.map(s=>{
      const x = s.rows[i];
      const strong = x.p<0.05;
      return `<td class="n"${strong?' style="font-weight:600"':''}>${x.ratio.toFixed(2)}<span class="muted" style="font-weight:400"> · p ${x.p.toFixed(3)}</span></td>`;
    }).join('');
    return `<tr${r.kind==='dec'?' style="border-top:1px solid var(--axis)"':''}><td>${esc(r.label)}</td>${cells}</tr>`;
  }).join('');
  return `<section class="card"><h2>Устойчивость: все определения «конца месяца» сразу</h2>
  <p class="muted" style="margin:0 0 12px;font-size:12px">Отношение «запусков на рабочий день внутри окна» к «вне окна»,
  и вероятность получить такой же результат случайно. Единица означает «никакой разницы».
  Порог значимости 0.05. Если бы эффект был настоящим, высокие значения стояли бы подряд, а не в одной клетке.</p>
  <table><thead><tr><th>Окно</th>${D.scenarios.map(s=>`<th class="n">${esc(s.label)}<br><span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">${s.n} событий</span></th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody></table>
  <p class="muted" style="margin:12px 0 0;font-size:12px">Тест: Монте-Карло биномиального, 20 000 прогонов на клетку,
  детерминированный генератор. Разброс третьего знака p около ±0.002, поэтому сравнивать надо порядок величины, а не цифры после запятой.</p>
  </section>`;
}

/* ---------- прокликивание против работы ---------- */
function work(){
  const t=D.totals, share = t.events? t.sameDay/t.events*100 : 0;
  const rt = D.realTail;
  return `<section class="card"><h2>Что из этого вообще работа ПТО</h2>
  <div style="display:flex;gap:30px;flex-wrap:wrap;margin-bottom:12px">
    ${cell(t.events,'событий после дедупа')}
    ${cell(t.sameDay+' ('+share.toFixed(0)+'%)','ушли со стадии в тот же день')}
    ${cell(t.realWork,'заняли сутки и дольше')}
    ${cell(t.dwellMed+' дн','медиана')}
    ${cell(t.dwellP90+' дн','p90')}
    ${cell(t.stuck,'стоят в расчёте сейчас')}
  </div>
  <p class="sec" style="margin:0">Больше половины «запусков расчёта» покидают стадию в тот же день. Это движение карточки
  по воронке, а не работа конструктора. Если считать только расчёты длиннее суток, эффект конца месяца
  ${rt?`составляет ${rt.ratio.toFixed(2)}× при p ${rt.p.toFixed(3)}`:'не считается: мало данных'}.</p>
  </section>`;
}

/* ---------- календарь ---------- */
function calendar(){
  const max = Math.max(1, ...D.cal.flatMap(c=>c.cnt));
  const b = []; for(let i=1;i<=5;i++) b.push(Math.max(i, Math.ceil(max*i/5)));
  const step = v => { if(!v) return 0; for(let i=0;i<5;i++) if(v<=b[i]) return i+1; return 5; };
  const months = D.cal.map(c=>{
    const lead = (new Date(c.m+'-01T00:00:00Z').getUTCDay()+6)%7;
    let cells = '<div class="cell void"></div>'.repeat(lead);
    for(let i=0;i<c.n;i++){
      const day=i+1, v=c.cnt[i], s=step(v), future = c.partial && day>c.partial;
      const cls=['cell', c.wd[i]&&!c.hol[i]?'':'we', c.last5[i]?'tail':'', s>=4?'hi':'', future?'future':''].filter(Boolean).join(' ');
      const bg = future||!s ? '' : `background:var(--s${s});`;
      const tip = `${monDay(c.m,day)} · запусков ${v}${c.hol[i]?' · нерабочий день':''}${c.last5[i]?' · последние 5 раб. дней':''}`;
      cells += `<div class="${cls}" style="${bg}" data-tip="${esc(tip)}">${future?'':(v||'')}</div>`;
    }
    const sum = c.cnt.reduce((a,x)=>a+x,0);
    return `<div class="mon"><h3>${monTitle(c.m)} <span class="muted" style="font-weight:400">· ${sum}${c.partial?' (не закрыт)':''}</span></h3>
      <div class="dow"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
      <div class="grid">${cells}</div></div>`;
  }).join('');
  return `<section class="card"><h2>Календарь запусков (после дедупа)</h2>
    <div class="mrow">${months}</div>
    <div class="legend">
      <span>меньше</span><span class="lgsteps">${[0,1,2,3,4,5].map(i=>`<i style="background:var(--s${i})"></i>`).join('')}</span><span>больше (до ${max} за день)</span>
      <span style="margin-left:12px"><i style="display:inline-block;width:14px;height:14px;border-radius:3px;outline:2px solid var(--ink-3);outline-offset:-2px;vertical-align:-2px"></i> последние 5 рабочих дней</span>
      <span>приглушённые ячейки - выходные и нерабочие дни</span>
    </div></section>`;
}

/* ---------- срезы ---------- */
function slices(){
  const tbl=(title,rows,note)=>`<div class="card"><h2>${title}</h2><table><tbody>`+
    rows.slice(0,12).map(r=>`<tr><td>${esc(r.k)}</td><td class="n">${r.n}</td></tr>`).join('')+
    `</tbody></table>${note?`<p class="muted" style="margin:10px 0 0;font-size:12px">${note}</p>`:''}</div>`;
  return `<div class="two">
    ${tbl('Куда ушли из «Расчёта»', D.toStage, '«Перехода ещё не было» значит сделка стоит в расчёте прямо сейчас.')}
    ${tbl('Где эти сделки сейчас', D.curStage)}
    ${tbl('Откуда пришли в «Расчёт»', D.fromStage)}
    ${D.mgrs?tbl('Кто отправляет в расчёт', D.mgrs):''}
  </div>`;
}

/* ---------- таблица ---------- */
let F={m:'',cur:'',q:''};
function table(){
  const opt=(arr,cur)=>['<option value="">все</option>'].concat(arr.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`)).join('');
  const curs=[...new Set(D.runs.map(r=>r.cur))].sort();
  return `<section class="card"><h2>Все запуски, по датам</h2>
  <div class="fl">
    <select id="fm">${opt(D.months,F.m)}</select>
    <select id="fcur">${opt(curs,F.cur)}</select>
    <input id="fq" placeholder="номер сделки" value="${esc(F.q)}">
    <span class="muted" id="fcnt" style="align-self:center"></span>
  </div>
  <div class="scroll"><table><thead><tr>
    <th>Дата</th><th>Сделка</th><th>Пришла из</th><th>Ушла в</th><th class="n">Дней</th><th>Сейчас</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  ${D.public?'<p class="muted" style="margin:10px 0 0;font-size:12px">Номер сделки без названия и суммы: имя заказчика и деньги в публичную версию не выгружаются.</p>':''}
  </section>`;
}
function rows(){
  const f=D.runs.filter(r=>(!F.m||r.d.startsWith(F.m))&&(!F.cur||r.cur===F.cur)&&(!F.q||r.id.includes(F.q)));
  $('#fcnt').textContent = `${f.length} ${plural(f.length,'запуск','запуска','запусков')}`;
  $('#tb').innerHTML = f.slice(0,600).map(r=>`<tr>
    <td style="white-space:nowrap">${dru(r.d)}</td>
    <td style="font-variant-numeric:tabular-nums">${esc(r.id)}</td>
    <td class="sec">${esc(r.from)||'<span class="muted">-</span>'}</td>
    <td class="sec">${esc(r.to)||'<span class="muted">стоит здесь</span>'}</td>
    <td class="n">${r.days==null?'<span class="muted">-</span>':r.days}</td>
    <td><span class="pill ${r.out}">${esc(r.cur)}</span></td></tr>`).join('')
    + (f.length>600?`<tr><td colspan="6" class="muted">Показаны первые 600 из ${f.length}. Сузь фильтр.</td></tr>`:'');
}

$('#app').innerHTML = verdict() + realCause() + stability() + work() + calendar() + slices() + table() + gaps();

const tt=$('#tt');
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(!el)return;
  tt.textContent=el.dataset.tip; tt.style.display='block';
  const r=el.getBoundingClientRect();
  tt.style.left=Math.min(innerWidth-270,r.left)+'px';
  tt.style.top=Math.max(6,r.top-tt.offsetHeight-8)+'px'; });
document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) tt.style.display='none'; });
