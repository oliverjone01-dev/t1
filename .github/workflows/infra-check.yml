name: infra-check (контур VPS)

# Проверка серверного контура infra/vps: shellcheck и полный локальный прогон
# test/smoke-local.sh (выкат веток, сайт, задачи, откаты) без настоящего сервера.
on:
  pull_request:
    paths: [infra/vps/**, .github/workflows/infra-check.yml]
  push:
    branches: [main]
    paths: [infra/vps/**, .github/workflows/infra-check.yml]
  workflow_dispatch:

concurrency:
  group: infra-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # тесту нужны ветки-источники пилота (rop-dashboard-v1, office-dashboard-v1)
      - name: shellcheck
        working-directory: infra/vps
        run: |
          shellcheck --version
          shellcheck -S warning -x bin/* sbin/* lib/gg.sh site/build.sh bootstrap.sh test/smoke-local.sh site/steps/*.sh jobs/*.sh
      - name: smoke-local
        run: bash infra/vps/test/smoke-local.sh
