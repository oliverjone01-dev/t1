name: ROP TG bot (digest)

# Дайджест отдела продаж в Telegram-группу 2 раза в день: план / итоги (срез в чат отключён 15.09.2026).
# Данные - rop.json из ветки rop-dashboard-v1 (тот же снимок, что и дашборды). Без ИИ,
# чистый агрегат по воронке (сделки с КП по стадиям) + предоплаты + портфель менеджеров.
# Токен бота - секрет ROPCACHE_BOT_TOKEN; chat_id группы задан ниже (не секрет).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | srez | itogi | probe | test"
        default: "plan"
      chat:
        description: "chat_id (пусто = группа по умолчанию)"
        default: ""
      mgr:
        description: "имя менеджера для личного дайджеста (пусто = сводка по отделу)"
        default: ""
      report:
        description: "mode=report: путь к md-файлу отчёта в репо (напр. knowledge/sales-analysis/examples/weekly-example.md)"
        default: ""
  # Автоматическая доставка перенесена на VPS: 09:15 и 17:45 МСК по будням.
  # workflow_dispatch сохранён для ручной диагностики; schedule отключён.

permissions:
  contents: read
  actions: write # диспатч deploy-pages / b24-snapshots и опрос статуса ранов перед отправкой

jobs:
  send:
    # Daily plan and results can only be sent by VPS, including manual/guard dispatches.
    if: ${{ github.event_name == 'workflow_dispatch' && !contains(fromJSON('["plan","srez","itogi","test"]'), inputs.mode) }}
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '0 5 * * 1-5' || github.event.schedule == '0 6 * * 1-5' || github.event.schedule == '15 6 * * 1-5') && 'plan') || ((github.event.schedule == '0 11 * * 1-5' || github.event.schedule == '0 12 * * 1-5' || github.event.schedule == '15 12 * * 1-5') && 'srez') || ((github.event.schedule == '30 13 * * 1-5' || github.event.schedule == '30 14 * * 1-5' || github.event.schedule == '45 14 * * 1-5') && 'itogi') || 'plan' }}
      # Прогревочные слоты (SEND=0) только считают данные заранее и НЕ отправляют дайджест.
      SEND: ${{ (github.event.schedule == '0 5 * * 1-5' || github.event.schedule == '0 11 * * 1-5' || github.event.schedule == '30 13 * * 1-5') && '0' || '1' }}
      # Чистовые (main) слоты идут в основной чат; тестовые слоты и ручной запуск без chat - в тест-чат.
      CHAT_ID: ${{ github.event.inputs.chat != '' && github.event.inputs.chat || (github.event.schedule == '15 6 * * 1-5' && '-1004401671894') || (github.event.schedule == '15 12 * * 1-5' && '-1004401671894') || (github.event.schedule == '45 14 * * 1-5' && '-1004401671894') || '-1003652568523' }}
      # Признак планового запуска: у GitHub schedule бывают опоздания на часы. Ручной запуск не трогаем.
      IS_SCHED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      # Дашборды (РОП + менеджерские) должны показывать те же данные, что и цифры в дайджесте,
      # ИНАЧЕ ссылка в чате ведёт на устаревший дашборд. Перед отправкой:
      #   1) План: если снимок Bitrix ещё не за сегодня (ночной cron GitHub задерживает на 1-3 ч) -
      #      запускаем b24-snapshots и ЖДЁМ; данные приезжают в rop-dashboard-v1.
      #   2) Сверяем bakedAt задеплоенного /rop/ со снимком: если дашборды уже собраны на этом
      #      снимке - деплой не нужен (срез/итог днём обычно попадают сюда, данные не менялись).
      #   3) Иначе диспатчим deploy-pages и ЖДЁМ завершения - только потом уходит сообщение.
      # -e не ставим: ни одна сетевая осечка не должна заблокировать сам дайджест (в худшем случае
      # шлём как есть с предупреждением в лог), но штатно закладываем запас по времени на пересборку.
      - name: Обновить дашборды (РОП + менеджеры) до отправки дайджеста
        # ВАЖНО: по умолчанию GitHub запускает шаг как `bash -eo pipefail`. С -e и pipefail
        # безобидный `git show <20МБ> | head -c 400` падает по SIGPIPE (код 141) и валит шаг, из-за
        # чего отправка пропускается. Переопределяем shell без -e/pipefail: шаг best-effort, каждая
        # сетевая команда защищена своим `|| true`, последняя строка - echo, поэтому job не падает,
        # и дайджест уходит всегда; свежесть при этом обеспечивается ожиданием снимка/деплоя.
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e +o pipefail
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          case "$MODE" in
            plan|srez|itogi) : ;;
            *) echo "MODE=$MODE - служебный режим, дашборды не трогаем"; exit 0 ;;
          esac
          gen_of() { git fetch --depth=1 origin rop-dashboard-v1 -q 2>/dev/null || true
            git show FETCH_HEAD:analytics-mvp/rop/data/rop.json 2>/dev/null | head -c 400 \
              | tr ',' '\n' | sed -n 's/.*"generated_at":"\([^"]*\)".*/\1/p' | head -1; }
          # Диспатч воркфлоу + ожидание завершения свежего рана (до ~15 мин), не валит job при неудаче.
          dispatch_and_wait() {
            local wf="$1" nm="$2" inp="${3:-}" body t0 code run status concl created cts
            if [ -n "$inp" ]; then body="{\"ref\":\"main\",\"inputs\":$inp}"; else body='{"ref":"main"}'; fi
            t0=$(date -u +%s)
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/d.out -w '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" "$API/actions/workflows/$wf/dispatches" -d "$body" || echo 000)
              [ "$code" = "204" ] && { echo "$nm: запрос на запуск принят"; break; }
              echo "$nm dispatch попытка $i: HTTP $code $(cat /tmp/d.out 2>/dev/null || true)"; sleep $((3*i))
            done
            for i in $(seq 1 45); do
              sleep 20
              run=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/actions/workflows/$wf/runs?event=workflow_dispatch&per_page=1" 2>/dev/null || echo '{}')
              status=$(printf '%s' "$run" | jq -r '.workflow_runs[0].status // "?"' 2>/dev/null || echo '?')
              concl=$(printf '%s' "$run" | jq -r '.workflow_runs[0].conclusion // "-"' 2>/dev/null || echo '-')
              created=$(printf '%s' "$run" | jq -r '.workflow_runs[0].created_at // ""' 2>/dev/null || echo '')
              cts=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
              echo "$nm: status=$status conclusion=$concl created=$created (${i}/45)"
              if [ "$status" = "completed" ] && [ "$cts" -ge $((t0-90)) ]; then echo "$nm завершён: $concl"; return 0; fi
            done
            echo "::warning::$nm не завершился за отведённое время - продолжаю"; return 0
          }
          GEN="$(gen_of)"; D="${GEN:0:10}"; TODAY="$(date -u +%F)"
          echo "Снимок rop.json: generated_at=$GEN (дата $D) · сегодня(UTC)=$TODAY · MODE=$MODE"
          # 1) Данные 3 раза в день: свежий снимок Bitrix перед КАЖДЫМ дайджестом, чтобы Срез/Итог
          #    показывали живой прогресс дня. Слоты (UTC): план 06:00 (=09:00 МСК), срез 12:00
          #    (=15:00 МСК), итог 14:30 (=17:30 МСК). Тяжёлый снимок считается ЗАРАНЕЕ прогревочным
          #    прогоном (~60 мин до слота), поэтому здесь принимаем данные, снятые не раньше чем за
          #    LEAD=60 мин до слота: свежий прогрев (снят ~слот-30..слот-5) проходит и дайджест уходит
          #    сразу, а реально устаревшие данные (ночь/прошлый слот) всё ещё триггерят снимок.
          case "$MODE" in plan) SLOT="06:00";; srez) SLOT="12:00";; itogi) SLOT="14:30";; *) SLOT="06:00";; esac
          LEAD=3600
          SLOT_TS=$(date -u -d "$TODAY $SLOT" +%s 2>/dev/null || echo 0)
          ACCEPT_TS=$((SLOT_TS - LEAD))
          GEN_TS=$(date -u -d "$GEN" +%s 2>/dev/null || echo 0)
          if [ -n "$GEN" ] && [ "$GEN_TS" -lt "$ACCEPT_TS" ]; then
            echo "Снимок ($GEN) старше порога свежести для слота $SLOT UTC (минус $((LEAD/60)) мин) - обновляю данные Bitrix и жду"
            # Внутридневной снимок - LIGHT (быстрый ~3-4 мин): сделки/история/лиды свежие, медленное
            # обогащение из прошлого полного (ночного) снимка. Ночной b24-snapshots остаётся полным.
            dispatch_and_wait "b24-snapshots.yml" "Снимок Bitrix (light)" '{"mode":"light"}'
            GEN="$(gen_of)"; D="${GEN:0:10}"
            echo "После снимка: generated_at=$GEN"
            # b24-snapshots в конце САМ триггерит deploy-pages. Дожидаемся, пока задеплоенный /rop/
            # догонит свежий снимок, ПРЕЖДЕ чем решать про свой деплой. ВАЖНО: полный deploy-pages
            # идёт ~15-17 мин, поэтому окно ожидания должно быть НЕ короче этого - иначе бот не
            # дожидается деплой снимка, запускает свой, тот отменяет первый (concurrency
            # cancel-in-progress), таймер сбрасывается и отправка тормозит. Ждём до ~22 мин: этого
            # хватает на штатный деплой снимка, и шаг 2 ниже уже не запускает конкурирующий.
            for i in $(seq 1 66); do
              RB="$(curl -fsS "https://oliverjone01-dev.github.io/t1/rop/v.txt" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -n "$RB" ] && ! [[ "$RB" < "$GEN" ]]; then echo "Деплой от снимка доехал (bakedAt=$RB)"; break; fi
              echo "Жду деплой от снимка: /rop/ bakedAt=$RB vs снимок=$GEN (${i}/66)"; sleep 20
            done
          fi
          # 2) Свежесть деплоя: bakedAt /rop/ должен быть не старше снимка (тот же деплой пересобирает и менеджеров)
          ROPBAKED="$(curl -fsS "https://oliverjone01-dev.github.io/t1/rop/v.txt" 2>/dev/null | tr -d '[:space:]' || true)"
          echo "Задеплоенный /rop/ bakedAt=$ROPBAKED"
          if [ -n "$GEN" ] && [ -n "$ROPBAKED" ] && ! [[ "$ROPBAKED" < "$GEN" ]]; then
            echo "Дашборды уже собраны на снимке $D - пересборка не нужна"
          else
            echo "Дашборды устарели (bakedAt=$ROPBAKED, снимок=$GEN) - запускаю deploy-pages и жду"
            dispatch_and_wait "deploy-pages.yml" "Публикация дашбордов"
            ROPBAKED="$(curl -fsS "https://oliverjone01-dev.github.io/t1/rop/v.txt" 2>/dev/null | tr -d '[:space:]' || true)"
            echo "После деплоя /rop/ bakedAt=$ROPBAKED"
          fi
          echo "Готово - дашборды актуальны, можно отправлять дайджест."

      - name: Build digest and send to Telegram
        # Прогревочные прогоны (SEND=0) только считают данные заранее и НЕ отправляют дайджест.
        if: env.SEND != '0'
        env:
          BOT_TOKEN: ${{ secrets.ROPCACHE_BOT_TOKEN }}
          BOT_TOKEN_ALT: ${{ secrets.BOT_TOKEN }}
          MGR_NAME: ${{ github.event.inputs.mgr }}
          REPORT_FILE: ${{ github.event.inputs.report }}
        run: |
          set -euo pipefail
          # Защита от опоздавших кронов GitHub: schedule иногда срабатывает на часы позже слота.
          # Если ПЛАНОВЫЙ крон опоздал больше чем на 90 мин от своего слота - НЕ шлём дайджест,
          # иначе прилетает «призрак» (напр. утренний план в обед). Ручной запуск не трогаем.
          if [ "${IS_SCHED:-}" = "true" ]; then
            case "$MODE" in plan) GSLOT="06:00";; srez) GSLOT="12:00";; itogi) GSLOT="14:30";; *) GSLOT="";; esac
            if [ -n "$GSLOT" ]; then
              GSLOT_TS=$(date -u -d "$(date -u +%F) $GSLOT" +%s 2>/dev/null || echo 0)
              NOW_TS=$(date -u +%s)
              if [ "$GSLOT_TS" -gt 0 ] && [ $((NOW_TS - GSLOT_TS)) -gt 5400 ]; then
                echo "Крон слота $GSLOT UTC опоздал на $(((NOW_TS-GSLOT_TS)/60)) мин (>90) - пропускаю отправку (опоздавший дайджест не нужен)."
                exit 0
              fi
            fi
          fi
          git fetch --depth=1 origin rop-dashboard-v1
          git show FETCH_HEAD:analytics-mvp/rop/data/rop.json > /tmp/rop.json
          git fetch --depth=1 origin dialog-export-v1
          git show FETCH_HEAD:analytics-mvp/dialog/data/dialog.json > /tmp/dialog.json || echo '{}' > /tmp/dialog.json
          cat > /tmp/digest.mjs <<'MJS'
          import fs from 'node:fs';
          const TOKEN=(process.env.BOT_TOKEN||process.env.BOT_TOKEN_ALT||'').trim();
          const CHAT=process.env.CHAT_ID; const MODE=(process.env.MODE||'plan').trim(); const MGR=(process.env.MGR_NAME||'').trim();
          if(!TOKEN){console.error('Нет секрета ROPCACHE_BOT_TOKEN (и BOT_TOKEN пуст). Добавь токен бота в Settings > Secrets > Actions.');process.exit(1);}
          if(MODE==='probe'){
            const me=await (await fetch(`https://api.telegram.org/bot${TOKEN}/getMe`)).json();
            const wh=await (await fetch(`https://api.telegram.org/bot${TOKEN}/getWebhookInfo`)).json();
            const j=await (await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`)).json();
            console.log('getMe:',JSON.stringify(me.result||me));
            console.log('webhook:',JSON.stringify(wh.result||wh));
            const chats={};(j.result||[]).forEach(u=>{const c=(u.message||u.my_chat_member||u.channel_post||u.edited_message||u.edited_channel_post||{}).chat;if(c)chats[c.id]=(c.title||c.username||'')+' ['+c.type+']';});
            console.log('updates:',(j.result||[]).length,'· chats бот видит:');
            console.log(JSON.stringify(chats,null,2));
            console.log('Нужен id группы (начинается с -100). Если webhook.url не пуст - сначала уберём webhook.');
            process.exit(0);
          }
          if(MODE==='test'){
            // Простой тест доставки: шлём в CHAT слово «тест» (проверка, что бот в чате и может писать). Отчёты сюда не идут.
            const res=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:CHAT,text:'тест'})});
            const jj=await res.json();
            if(!jj.ok){console.error('Telegram error:',JSON.stringify(jj));process.exit(1);}
            console.log('Тест отправлен в',CHAT,'· msg',jj.result.message_id);
            process.exit(0);
          }
          if(MODE==='report'){
            // Отправка готового md-отчёта (недельный/месячный разбор) в чат. Файл берётся из репо,
            // делится на части <=3800 символов по границам строк и шлётся простым текстом (эмодзи + переносы).
            const fp=(process.env.REPORT_FILE||'').trim();
            if(!fp){console.error('mode=report: не задан REPORT_FILE (путь к md)');process.exit(1);}
            let txt=''; try{txt=fs.readFileSync(fp,'utf8');}catch(e){console.error('Файл отчёта не найден:',fp);process.exit(1);}
            const lines=txt.split('\n'); const chunks=[]; let cur='';
            for(const l of lines){ if((cur+l+'\n').length>3800){chunks.push(cur);cur='';} cur+=l+'\n'; }
            if(cur.trim())chunks.push(cur);
            for(let i=0;i<chunks.length;i++){
              const res=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:CHAT,text:chunks[i],disable_web_page_preview:true})});
              const jj=await res.json(); if(!jj.ok){console.error('Telegram error:',JSON.stringify(jj));process.exit(1);}
              console.log('Отчёт',fp,'часть',(i+1)+'/'+chunks.length,'отправлена в',CHAT);
              if(i<chunks.length-1)await new Promise(r=>setTimeout(r,800));
            }
            process.exit(0);
          }
          const d=JSON.parse(fs.readFileSync('/tmp/rop.json','utf8'));
          const canonicalManager=n=>String(n||'').trim().toLowerCase().replaceAll('ё','е')==='алена кубанова'?'Алёна Кубанова':n;
          for(const rows of [d.deals||[],d.leads||[]])for(const row of rows)row.mgr=canonicalManager(row.mgr);
          const deals=(d.deals||[]).filter(x=>String(x.category)==='49');
          // Ольга Лысенко - РОП (@Olgal89), в списке плановых менеджеров не участвует (тег РОПа в сводке).
          const PLAN=["Юлия Лысанова","Татьяна Лакомова","Юлия Шура-Бура","Надежда Лобова","Татьяна Фомичева","Алёна Филатова","Алёна Кубанова"];
          const TODAY=(d.generated_at||'').slice(0,10);
          // Compact plan/results: only prepayments, open portfolio and calendar days without prepayments.
          const KP=new Set(['C49:PREPAYMENT_INVOIC','C49:3','C49:UC_8JTBV2']);
          const epAt=x=>{for(const h of (x.hist||[]))if(h[0]==='C49:EXECUTING'&&h[1])return h[1];return x.won?x.closed:null;};
          const dayOf=v=>{if(!v)return null;const date=new Date(v);return Number.isFinite(+date)?new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(date):null;};
          const ASOF=new Date(d.generated_at);
          if(!Number.isFinite(+ASOF))throw Error('Missing snapshot timestamp');
          const DATE=dayOf(ASOF), MONTH=DATE.slice(0,7);
          const E=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const rub=v=>Math.round(v).toLocaleString('ru-RU')+' ₽';
          const number=v=>Number.isFinite(Number(v))?Number(v):0;
          const rows=PLAN.map(m=>{
            const own=deals.filter(x=>x.mgr===m);
            const port=own.filter(x=>!x.won&&!x.lost&&KP.has(x.stageCode));
            const prep=own.map(x=>{
              const prepay=number(x.prepayAmt), fallback=prepay===0, sum=fallback?number(x.budget):prepay;
              return {date:dayOf(epAt(x)),sum,missing:!(sum>0),fallback:fallback&&sum>0};
            }).filter(x=>x.date&&x.date<=DATE);
            const total=a=>({n:a.length,sum:a.reduce((s,x)=>s+x.sum,0),missing:a.filter(x=>x.missing).length,fallback:a.filter(x=>x.fallback).length});
            return {m,port:{n:port.length,sum:port.reduce((s,x)=>s+number(x.budget),0)},today:total(prep.filter(x=>x.date===DATE)),month:total(prep.filter(x=>x.date.slice(0,7)===MONTH)),last:prep.map(x=>x.date).sort().at(-1)||null};
          });
          const add=(a,b)=>({n:a.n+b.n,sum:a.sum+b.sum,missing:(a.missing||0)+(b.missing||0),fallback:(a.fallback||0)+(b.fallback||0)});
          const dep=rows.reduce((a,r)=>({port:add(a.port,r.port),today:add(a.today,r.today),month:add(a.month,r.month),last:!a.last||r.last>a.last?r.last:a.last}),{port:{n:0,sum:0},today:{n:0,sum:0},month:{n:0,sum:0},last:null});
          const days=last=>last===null?'нет предоплат в доступной истории':Math.max(0,Math.round((Date.parse(DATE)-Date.parse(last))/864e5))+' дн';
          const TL={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
          const slug=m=>m.split(/\s+/).at(-1).toLowerCase().split('').map(c=>TL[c]??c).join('');
          const paid=p=>p.n+' шт · '+rub(p.sum)+(p.fallback?' (у '+p.fallback+' взята сумма сделки)':'')+(p.missing?' (у '+p.missing+' сумма не заполнена)':'');
          const metrics=r=>[
            'Предоплаты за день: <b>'+paid(r.today)+'</b>',
            'Предоплаты за месяц: <b>'+paid(r.month)+'</b>',
            'Портфель в работе: <b>'+r.port.n+' шт · '+rub(r.port.sum)+'</b>',
            'Без предоплат: <b>'+days(r.last)+'</b>'
          ].join('\n');
          const head=MODE==='plan'?'🌅 ПЛАН НА ДЕНЬ':'🌙 ИТОГИ ДНЯ';
          const time=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'}).format(ASOF);
          const selected=MGR?rows.filter(r=>r.m===canonicalManager(MGR)):rows;
          if(MGR&&!selected.length)throw Error('Manager is outside active roster');
          const title=(process.env.GG_DIGEST_TEST==='1'?'🧪 ТЕСТ\n':'')+'<b>'+head+' · '+DATE.split('-').reverse().join('.')+'</b>\nДанные на '+time+' МСК';
          const blocks=selected.map(r=>'<b><a href="https://oliverjone01-dev.github.io/t1/rop-'+slug(r.m)+'/">'+E(r.m)+'</a></b>\n'+metrics(r));
          const text=title+'\n\n'+(!MGR?'<b><a href="https://oliverjone01-dev.github.io/t1/rop/">ОТДЕЛ</a></b>\n'+metrics(dep)+'\n\n':'')+blocks.join('\n\n')+'\n\n<i>Предоплаты — сделки, перешедшие в «Предоплата получена». Сумма — поле «Предоплата»; при нуле или пустом поле — сумма сделки. Портфель — открытые сделки с КП до предоплаты. Дни — календарные с последней предоплаты, сегодня = 0.</i>';
          if(text.length>4096)throw Error('Digest exceeds Telegram limit: '+text.length);
          const res=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:CHAT,text,parse_mode:'HTML',disable_web_page_preview:true})});
          const result=await res.json();
          if(!result.ok)throw Error('Telegram rejected digest: '+result.description);
          console.log('Digest delivered',MODE,'chat',CHAT,'message',result.result.message_id);
          process.exit(0);

