  const winTargetAll=()=>Math.round(_portAt(scope)*_TCR*_factor); // успех-цель (портфель × TCR)
  const lossCap=m=>Math.round(_portAt(_mSc(m))*_TCR*4*_factor);   // потолок отказов = успех-цель × 4
  const lossCapAll=()=>Math.round(_portAt(scope)*_TCR*4*_factor);
  // Средний чек портфеля - для пересчёта цели в деньги (кол-во × чек = выручка).
  const _avgChk=sc=>{const a=wipAt(_capK(),sc).map(d=>d.budget||0).filter(v=>v>0);return a.length?a.reduce((s,v)=>s+v,0)/a.length:0;};
  const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const cliV=d=>{const c=d.client;return (!c||c==="нет данных")?"не указан":c;};
  const catV=d=>{const a=d.assort;return (!a||a==="нет данных"||a==="не указана")?"не указана":a;};
  const money=a=>a.reduce((s,d)=>s+(d.budget||0),0);

  const ROWS=[
    {id:"in",nm:"Пришло офферов",color:"#22D3EE",df:firstOffer,grp:"вход"},
    {id:"wip",nm:"В работе (на конец)",color:"#818CF8",wip:true,grp:"в работе"},
    {id:"kp",nm:"КП отправлено",color:"#60A5FA",df:d=>enterStage(d,"C49:PREPAYMENT_INVOIC"),grp:"в работе",child:true},
    {id:"dec",nm:"Принимают решение",color:"#C2873C",df:d=>enterStage(d,"C49:3"),grp:"в работе",child:true},
    {id:"long",nm:"Долгострой",color:"#F59E0B",df:d=>enterStage(d,"C49:UC_8JTBV2"),grp:"в работе",child:true},
    {id:"vyhod",nm:"Выход (успех + отказ)",color:"#9AA4B2",df:d=>enterExec(d)||enterLose(d),grp:"выход"},
    {id:"win",nm:"Успех (предоплата)",color:"#2E9E74",df:enterExec,grp:"выход",child:true},
    {id:"loss",nm:"Отказ",color:"#CC5867",df:enterLose,grp:"выход",child:true},
  ];
  const RBY={};ROWS.forEach(r=>RBY[r.id]=r);
  const wipAt=(k,sc)=>sc.filter(d=>{const f=firstOffer(d);if(!f||f.slice(0,10)>endDate(k))return false;const ex=enterExec(d),lo=enterLose(d);return !((ex&&ex.slice(0,10)<=endDate(k))||(lo&&lo.slice(0,10)<=endDate(k)));});
  const stageAtT=(d,t)=>{let st=null,bd="";(d.hist||[]).forEach(h=>{const hd=(h[1]||"").slice(0,10);if(hd&&hd<=t&&hd>=bd){bd=hd;st=h[0];}});return st;};
  const stageWipAt=(k,sc,stg)=>{const e=endDate(k);return sc.filter(d=>stageAtT(d,e)===stg);};
  const ageAt=(d,k)=>Math.round((PD2(endDate(k))-PD2(d.created))/DAYMS);
  // Возрастные когорты открытых сделок. Для «В работе» база - все открытые офферы,
  // для стадий (КП/Решение/Долгострой) - сделки, стоящие на этой стадии на конец периода.
  const COHDEF=[{key:"new",nm:"новые ≤14 дн",color:"#2E9E74",cohort:[0,14]},{key:"mid",nm:"застой 14-30 дн",color:"#D9A441",cohort:[15,30]},{key:"old",nm:"брошенные 30+ дн",color:"#CC5867",cohort:[31,1e9]}];
  const COHSRC=[["wip",null],["kp","C49:PREPAYMENT_INVOIC"],["dec","C49:3"],["long","C49:UC_8JTBV2"]];
  const COHROWS={};COHSRC.forEach(([rid,stg])=>{COHROWS[rid]=COHDEF.map(c=>({...c,wip:true,id:rid+"@"+c.key,stg,base:rid}));});
  const RBY2={};Object.values(COHROWS).forEach(arr=>arr.forEach(c=>RBY2[c.id]=c));
  const cohBase=(r,k,sc)=>r.stg?stageWipAt(k,sc,r.stg):wipAt(k,sc);
  // ===== стадии «до предложения» + лиды: живут в AD (до оффера), а не в passed =====
  // Те же возрастные когорты (сроки), клик по строке = сроки, клик по ячейке = список.
  const _preSet={pnew:new Set(["C49:NEW","C49:UC_LRFLH9"]),pprep:new Set(["C49:PREPARATION","C49:UC_OGZUU0"])};
  const _leadWork=(DATA.leads||[]).filter(l=>l.qual==='в работе');
  const _wipSet=(k,set)=>AD.filter(d=>set.has(stageAtT(d,endDate(k))));
  const _leadWip=k=>_leadWork.filter(l=>String(l.created).slice(0,10)<=endDate(k));
  const _daysAt=s=>Math.max(0,Math.round((NOWD-PD2(s))/DAYMS));
  const _stIn=d=>{let r=d.created;(d.hist||[]).forEach(h=>{if(h[0]===d.stageCode&&h[1]&&h[1]>r)r=h[1];});return r;};
  const _portBaseAt=(r,k)=>r.lead?_leadWip(k):_wipSet(k,r.set);
  const PCOHSRC=[['pnew',_preSet.pnew],['pprep',_preSet.pprep]];
  const PCOHROWS={};PCOHSRC.forEach(([rid,set])=>{PCOHROWS[rid]=COHDEF.map(c=>({...c,port:true,wip:true,set,id:rid+'@'+c.key,base:rid}));});
  Object.values(PCOHROWS).forEach(arr=>arr.forEach(c=>RBY2[c.id]=c));
  const dealsFor=(r,k,sc)=>r.port?_portBaseAt(r,k).filter(d=>!r.cohort||(()=>{const a=ageAt(d,k);return a>=r.cohort[0]&&a<=r.cohort[1];})()):r.cohort?cohBase(r,k,sc).filter(d=>{const a=ageAt(d,k);return a>=r.cohort[0]&&a<=r.cohort[1];}):r.wip?wipAt(k,sc):sc.filter(d=>{const dt=r.df(d);return dt&&inR(dt)&&bkey(dt.slice(0,10),g)===k;});
  const serie=(r,sc)=>{const cnt={},mon={};let tot=0,totM=0;keys.forEach(k=>{const ds=dealsFor(r,k,sc);cnt[k]=ds.length;mon[k]=money(ds);if(!r.wip){tot+=ds.length;totM+=mon[k];}});return {cnt,mon,mx:Math.max(1,...keys.map(k=>cnt[k])),mxM:Math.max(1,...keys.map(k=>mon[k])),tot,totM};};

  const hx=(c,t)=>c+Math.round((0.18+t*0.75)*255).toString(16).padStart(2,"0");
  const fs=keys.length>60?6.5:keys.length>40?7:keys.length>24?8:9;
  const cellV=(cnt,mon)=>unit==="money"?(mon?fmtK(mon):""):(cnt?cnt:"");
  const rowLine=(r,sc,sid,opts)=>{const s=serie(r,sc);opts=opts||{};
    const cells=keys.map(k=>{const cnt=s.cnt[k],mon=s.mon[k],v=unit==="money"?mon:cnt,mx=unit==="money"?s.mxM:s.mx,t=v/mx,bg=cnt===0?"var(--bg-base)":hx(r.color,t),sel=S.calCell&&S.calCell.s===sid&&S.calCell.k===k;
      return `<div ${cnt?`data-calcell="${sid}|${k}" style="cursor:pointer;`:'style="'}flex:1;min-width:0;height:${opts.sub?18:22}px;background:${bg};border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:${opts.sub?fs-1:fs}px;font-weight:800;color:${cnt===0?'transparent':t>.5?'#06121a':'#eef2f7'};${sel?'box-shadow:inset 0 0 0 2px #22D3EE':''}"${cnt?` data-tip="${dt(r.nm+' · '+lbl(k),[['Сделок',fmt(cnt),'hl'],['Сумма',fmtK(mon)+' ₽','dim']]).replace(/"/g,'&quot;')}"`:''}>${cellV(cnt,mon)}</div>`;}).join("");
    const lastK=keys[keys.length-1];
    const rowKey=opts.rowKey||r.id;
    let sig;
    if(r.cohort){const base=r.port?_portBaseAt(r,lastK):cohBase(r,lastK,sc);const tw=base.length,cc=s.cnt[lastK];sig=`${cc} · ${tw?Math.round(cc/tw*100):0}%`;}
    else if(r.wip)sig=fmt(s.cnt[lastK]);
    else sig=unit==="money"?fmtK(s.totM):fmt(s.tot);
    const _mgrDash=typeof MANAGER!=='undefined'&&MANAGER;
    const canExp=opts.exp||(!opts.sub&&!opts.noexp&&(COHROWS[r.id]||PCOHROWS[r.id]||(!mgrSel&&!_mgrDash)));
    const arw=canExp?`<span style="color:#A78BFA">${(S.calRowOpen&&S.calRowOpen[rowKey])?'▾ ':'▸ '}</span>`:'';
    const baseIndent=r.child?'padding-left:18px;':'';
    const bullet=r.cohort?`<span style="color:${r.color};font-size:8px">● </span>`:'';
    const hintHTML=(!opts.sub&&r.hint)?` <span style="color:var(--ink-4);font-size:9px">· ${r.hint}</span>`:'';
    const nmeHTML=opts.sub?`<span style="padding-left:${(opts.off||0)+(opts.sub2?30:16)}px;color:${r.cohort?'var(--ink-2)':'var(--ink-3)'}">${arw}${bullet}${esc(opts.mgr)}</span>`:`<span style="${baseIndent}">${arw}${r.nm}${hintHTML}${(r.port||!r.wip&&!r.cohort)?` <b style="color:${r.color}">${sig}</b>`:''}</span>`;
    let rightHTML;
    if(opts.cup){const cf=opts.cup.fact,ct=opts.cup.target,inv=opts.cup.inv,mny=opts.cup.money,_fv=v=>mny?fmtK(v):fmt(v),sc=Math.max(1,cf,ct),fh=Math.min(100,cf/sc*100).toFixed(0),ph=Math.min(100,ct/sc*100).toFixed(0);
      // inv = потолок (отказы): меньше плана = зелёный, больше = красный, ровно = серый.
      let cc,fc,note;
      if(inv){const noCap=ct<0.5;cc=noCap?'#6A7484':cf<ct?'#2E9E74':cf>ct?'#CC5867':'#6A7484';fc=cc==='#6A7484'?'var(--ink-3)':cc;note=noCap?'нет потолка':cf<ct?'в норме':cf>ct?'превышен':'на пределе';}
      else{const met=ct>=0.5&&cf>=ct;cc=met?'#2E9E74':'#6A7484';fc=met?'#2E9E74':'var(--ink-3)';note=ct>=0.5?(met?'план выполнен':'не выполнен'):'нет цели';}
      const _base=mny?'кол-во × ср.чек':'портфель × '+pct(_TCR);
      const ttl=inv?('факт '+_fv(cf)+' · потолок '+_fv(ct)+' (успех × 4'+(mny?' × ср.чек':'')+') · '+note):('факт '+_fv(cf)+' · план '+_fv(ct)+' ('+_base+') · '+note);
      rightHTML=`<div style="width:${RW}px;box-sizing:border-box;border-left:1px dashed var(--border-soft);padding-left:6px;display:flex;align-items:flex-end;justify-content:${opts.cup.agg?'flex-start':'flex-end'};gap:5px" data-tip="${ttl.replace(/"/g,'&quot;')}"><div style="position:relative;flex:0 0 auto;width:12px;height:16px;background:var(--bg-base);border:1px solid var(--border);border-top:none;border-radius:0 0 3px 3px"><div style="position:absolute;left:0;bottom:0;width:100%;height:${fh}%;background:${cc};opacity:.9"></div><div style="position:absolute;left:-1px;right:-1px;bottom:${ph}%;border-top:1.5px dashed #A78BFA"></div></div><span style="flex:0 0 auto;font-size:9.5px;font-weight:800;line-height:16px"><span style="display:inline-block;min-width:15px;text-align:right;color:${fc}">${_fv(cf)}</span><span style="color:var(--ink-4);font-weight:600"> / </span><span style="display:inline-block;min-width:15px;text-align:right;color:var(--ink)">${_fv(ct)}</span></span></div>`;}
    else rightHTML=`<div style="width:${RW}px;box-sizing:border-box;border-left:1px dashed var(--border-soft);padding-left:6px;text-align:right;font-size:${opts.sub?10:11}px;font-weight:800;color:${r.cohort?r.color:r.wip?'var(--ink-4)':r.color}">${sig}</div>`;
    // Клик по ЛЕВОМУ блоку (название строки) раскрывает строку; клик по ЯЧЕЙКЕ открывает сделки.
    return `<div class="chrow" style="${opts.dim?'opacity:.62;':''}display:flex;align-items:center;gap:6px;margin:2px 0"><div ${canExp?`data-calrow="${rowKey}" style="cursor:pointer;`:'style="'}width:180px;font-size:${opts.sub?10.5:11}px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" data-tip="${canExp?'раскрыть по срокам':''}">${nmeHTML}</div><div style="flex:1;display:flex;gap:2px">${cells}</div>${rightHTML}</div>`;
  };
  // строки: отдел + (если раскрыто) менеджеры
  const names=[...new Set(passed.map(d=>d.mgr))];
  let _pg="";
  const grpLabel=t=>{const gc={'вход':'#22D3EE','в работе':'#818CF8','выход':'#9AA4B2'}[t]||'var(--ink-4)';return `<div style="font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:${gc};font-weight:800;border-left:2px solid ${gc};padding-left:6px;margin:${t==='вход'?'2px':'10px'} 0 2px">${t}</div>`;};
  const bodyRows=ROWS.map(r=>{
    let html=(r.grp!==_pg)?grpLabel(r.grp):"";_pg=r.grp;
    const _mny=unit==="money",_ac=_mny?_avgChk(scope):0;
    const _aggCup=r.id==="loss"?{fact:_mny?serie(r,scope).totM:serie(r,scope).tot,target:_mny?Math.round(lossCapAll()*_ac):lossCapAll(),inv:true,agg:true,money:_mny}:r.id==="win"?{fact:_mny?serie(r,scope).totM:serie(r,scope).tot,target:_mny?Math.round(winTargetAll()*_ac):winTargetAll(),agg:true,money:_mny}:null;
    html+=rowLine(r,scope,r.id,{cup:_aggCup});
    const isOpen=S.calRowOpen&&S.calRowOpen[r.id];
    const coh=COHROWS[r.id],off=r.child?18:0;
    if(isOpen&&mgrSel){
      // выбран один менеджер: стадия/В-работе сразу разворачивается в свои когорты
      if(coh)html+=coh.map(c=>rowLine(c,scope,c.id,{sub:true,mgr:c.nm,off})).join("");
    }else if(isOpen){
      const lastK=keys[keys.length-1],wm=(typeof MANAGER!=='undefined'&&MANAGER)?'age':(S.calWipMode||'mgr');
      if(coh&&wm==='age'){
        // сначала когорты по сроку, внутри - менеджеры (для «В работе» и стадий).
        // В личном дашборде менеджер один - разбивку по менеджерам не показываем (дубль).
        const _md=(typeof MANAGER!=='undefined'&&MANAGER);
        coh.forEach(c=>{const ckey=c.id;
          html+=rowLine(c,scope,ckey,{sub:true,mgr:c.nm,exp:!_md,rowKey:ckey,off});
          if(!_md&&S.calRowOpen&&S.calRowOpen[ckey]){
            const ms=names.map(m=>{const msc=passed.filter(d=>d.mgr===m);return {m,msc,rank:dealsFor(c,lastK,msc).length,any:keys.some(k=>dealsFor(c,k,msc).length>0)};}).filter(x=>x.any).sort((a,b)=>b.rank-a.rank);
            html+=ms.map(x=>rowLine(c,x.msc,ckey+"~"+x.m,{sub:true,sub2:true,mgr:x.m,off})).join("");
          }
        });
      }else{
        // сначала менеджеры, внутри - когорты по сроку (если у строки есть возрастные когорты)
        let subs;
        if(r.wip)subs=names.map(m=>{const msc=passed.filter(d=>d.mgr===m);return {m,msc,rank:wipAt(lastK,msc).length,any:keys.some(k=>wipAt(k,msc).length>0)};}).filter(x=>x.any);
        else subs=names.map(m=>{const msc=passed.filter(d=>d.mgr===m),s=serie(r,msc);return {m,msc,rank:s.tot,any:s.tot>0};}).filter(x=>x.any);
        subs.sort((a,b)=>b.rank-a.rank);
        subs.forEach(x=>{const mkey=r.id+"~"+x.m;const cup=r.id==="win"?{fact:x.rank,target:mgrTarget(x.m)}:null;
          html+=rowLine(r,x.msc,mkey,{sub:true,mgr:x.m,exp:!!coh,rowKey:mkey,cup,off});
          if(coh&&S.calRowOpen&&S.calRowOpen[mkey])html+=coh.map(c=>rowLine(c,x.msc,c.id+"~"+x.m,{sub:true,sub2:true,mgr:c.nm,off})).join("");
        });
      }
    }
    return html;
  }).join("");
  const step=Math.max(1,Math.ceil(keys.length/12));
  const head=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><div style="width:180px"></div><div style="flex:1;display:flex;gap:2px">`+keys.map((k,i)=>`<div style="flex:1;text-align:center;font-size:8.5px;color:var(--ink-4);overflow:hidden">${(keys.length<=16||i%step===0||i===keys.length-1)?lbl(k):''}</div>`).join("")+`</div><div style="width:${RW}px;box-sizing:border-box;border-left:1px dashed var(--border-soft);padding-left:6px;text-align:right;font-size:8.5px;color:var(--ink-4)">Σ ${unit==="money"?"₽":"сд"}</div></div>`;

  // ===== ПОРТФЕЛЬ: стадии «до предложения» + лиды как строки той же матрицы =====
  // Ведут себя как все строки: клик по строке разворачивает СРОКИ (новые/застой/брошенные),
  // клик по ячейке открывает список сделок. Столбец = WIP на конец бакета, Σ = сейчас.
  const _isMgr=typeof MANAGER!=='undefined'&&MANAGER;
  const PORTG={'взятые сделки в работу':'#60A5FA'};
  const PORT=[
    {id:'pnew',grp:'взятые сделки в работу',nm:'Новые сделки',hint:'новые + квалификация · этап уйдёт, цель закрывает воронка лидов',color:'#22D3EE',port:true,wip:true,set:_preSet.pnew},
    {id:'pprep',grp:'взятые сделки в работу',nm:'Формирование ТЗ',hint:'сделать ТЗ, отправить КП',color:'#60A5FA',port:true,wip:true,set:_preSet.pprep},
  ];
  PORT.forEach(r=>RBY[r.id]=r);
  const _pTot=r=>keys.reduce((n,k)=>n+dealsFor(r,k,scope).length,0);
  const portGrp=t=>{const gc=PORTG[t]||'var(--ink-4)';return `<div style="font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:${gc};font-weight:800;border-left:2px solid ${gc};padding-left:6px;margin:10px 0 2px">${t}${t==='запас'?' · лиды (менее срочно)':''}</div>`;};
  let _ppg="";
  const portBody=_isMgr?PORT.map(r=>{let h=(r.grp!==_ppg)?portGrp(r.grp):"";_ppg=r.grp;
    const empty=_pTot(r)===0;
    h+=rowLine(r,scope,r.id,{noexp:empty,dim:r.dim});
    if(!empty&&S.calRowOpen&&S.calRowOpen[r.id]){const coh=PCOHROWS[r.id];if(coh)h+=coh.map(c=>rowLine(c,scope,c.id,{sub:true,mgr:c.nm})).join("");}
    return h;}).join(""):"";
  const cal=head+portBody+bodyRows;

  // Стаканчики плана предоплат: вживлены под календарь, колонки те же. Стакан = факт
  // (все входы в «Предоплата получена» по отделу за период), риска = план из таблицы.
  const cupStrip=(()=>{
    // Личный дашборд: цель НЕ из таблицы отдела, а перерасчёт на этого менеджера -
    // его живой портфель (открытые офферы ≤60 дн) × 15%, разложенный по бакетам.
    if(mgrSel)return "";
    if(!_isMgr&&!(DATA.plan&&DATA.plan.months&&DATA.plan.months.length))return "";
    const useMoney=unit==="money",fmtV=v=>useMoney?fmtK(v):fmt(Math.round(v));
    const bStart=k=>g==="month"?k+"-01":k;
    const _bDaysP=k=>{const bs0=bStart(k),be0=endDate(k),bs=bs0>S.start?bs0:S.start,be=be0<S.end?be0:S.end;return bs>be?0:Math.max(1,Math.round((PD2(be)-PD2(bs))/DAYMS)+1);};
    const _herWip=wipAt(keys[keys.length-1],passed); // «В работе на конец» - её портфель
    const _herPort=_herWip.length;
    const _herAvg=(()=>{const a=_herWip.map(d=>d.budget||0).filter(v=>v>0);return a.length?a.reduce((s,v)=>s+v,0)/a.length:0;})();
    const planAt=_isMgr
      ?(k=>{const t=_herPort*_TCR*(_bDaysP(k)/30);return useMoney?t*_herAvg:t;})
      :(k=>{const bs0=bStart(k),be0=endDate(k),bs=bs0>S.start?bs0:S.start,be=be0<S.end?be0:S.end;if(bs>be)return 0;const pf=planForPeriod(bs,be);return pf?(useMoney?(pf.rev||0):(pf.sales||0)):0;});
    const P={};let ptot=0;keys.forEach(k=>{P[k]=planAt(k);ptot+=P[k];});
    if(ptot<(useMoney?1:0.5))return "";
    const days=Math.max(1,Math.round((PD2(S.end)-PD2(S.start))/DAYMS)+1),factor=days/30,TCR=_TCR;
    const fact={};keys.forEach(k=>fact[k]=0);
    passed.forEach(d=>{const e=enterExec(d);if(e&&inR(e)){const k=bkey(e.slice(0,10),g);if(fact[k]!=null)fact[k]+=useMoney?(d.budget||0):1;}});
    let mx=1,ftot=0;keys.forEach(k=>{ftot+=fact[k];mx=Math.max(mx,P[k],fact[k]);});
    const att=ptot?ftot/ptot:0,tc=att>=1?'#2E9E74':'#6A7484'; // выполнен = зелёный, нет = серый
    // рисуем один стакан-стрип: cnt по бакетам, риска = plan по бакетам, свой масштаб smx
    const strip=(fk,pk,smx,h,cap)=>keys.map(k=>{const pl=pk[k],fa=fk[k],a=pl>=0.3?fa/pl:null;
      const c=a==null?'#6A7484':a>=1?'#2E9E74':'#6A7484';
      const fh=Math.min(100,fa/smx*100).toFixed(1),ph=Math.min(100,pl/smx*100).toFixed(1);
      return `<div style="flex:1;min-width:0;display:flex;justify-content:center" data-tip="${dt(lbl(k),[['План',Math.round(pl*10)/10,'hl'],['Факт',fa,'hl'],['Выполнение',a==null?'нет плана':pct(a),'hl']]).replace(/"/g,'&quot;')}">`+
        `<div style="position:relative;width:100%;max-width:${h>36?24:20}px;height:${h}px;background:var(--bg-base);border:1px solid var(--border);border-top:none;border-radius:0 0 5px 5px">`+
          `<div style="position:absolute;left:0;bottom:0;width:100%;height:${fh}%;background:${c};opacity:.9;border-radius:0 0 4px 4px"></div>`+
          `${pl>=0.3?`<div style="position:absolute;left:-1px;right:-1px;bottom:${ph}%;border-top:${h>36?2:1.5}px dashed #A78BFA"></div>`:''}`+
        `</div></div>`;}).join("");
    const port=m=>open.filter(d=>d.mgr===m&&(NOWD-PD2(d.created))/DAYMS<=60).length;
    const mgrs=[...new Set(passed.map(d=>d.mgr))].map(m=>{const p=port(m);
      const ft=passed.filter(d=>d.mgr===m).reduce((s,d)=>{const e=enterExec(d);return s+((e&&inR(e))?1:0);},0);
      return {m,p,ft};}).filter(x=>x.p>0||x.ft>0);
    const wsum=mgrs.reduce((s,x)=>s+x.p,0)||1;
    mgrs.sort((a,b)=>b.ft-a.ft||b.p-a.p);
    const isOpen=S.calCupOpen,attC=v=>v==null?'var(--ink-3)':v>=1?'#2E9E74':v>=0.8?'#C2873C':v>=0.5?'#D9A441':'#CC5867';
    const dTgt=Math.round(wsum*TCR*factor);
    const mgrTbl=isOpen?`<div class="scroll" style="margin-top:8px;max-height:300px"><table class="tbl" style="font-size:11px"><thead><tr><th style="text-align:left">Менеджер ${info('Цель - живой портфель менеджера × '+pct(TCR)+' за период: его собственная норма от того, что он реально ведёт, а не доля обещанного отделом плана. Факт - его успехи (предоплаты) из оффер-воронки, как в строке «Успех». Вклад - сколько процентов всех успехов отдела он принёс. Вып. - факт ÷ его цель.')}</th><th>Портфель</th><th>Цель (портф×${pct(TCR)})</th><th>Факт</th><th>Вклад</th><th>Вып.</th></tr></thead><tbody>`+
      mgrs.map(x=>{const tgt=Math.round(x.p*TCR*factor),a=tgt?x.ft/tgt:null,contrib=ftot?x.ft/ftot:0,c=attC(a);
        return `<tr><td class="name" style="text-align:left">${esc(x.m)}</td><td style="text-align:center">${x.p}</td><td style="text-align:center;color:var(--ink-3)">${tgt}</td><td style="text-align:center;font-weight:800;color:${c}">${x.ft}</td><td style="text-align:center;color:#22D3EE;font-weight:700">${pct(contrib)}</td><td style="text-align:center;font-weight:800;color:${c}">${a==null?'—':pct(a)}</td></tr>`;}).join("")+
      `<tr class="total"><td style="text-align:left">ОТДЕЛ</td><td style="text-align:center">${wsum}</td><td style="text-align:center">${dTgt}</td><td style="text-align:center">${fmt(ftot)}</td><td style="text-align:center">100%</td><td style="text-align:center;color:${attC(dTgt?ftot/dTgt:null)}">${dTgt?pct(ftot/dTgt):'—'}</td></tr></tbody></table></div>`:"";
    const arw=isOpen?'▾':'▸';
    return `<div style="margin-top:2px;padding-top:8px;border-top:1px dashed var(--border)">`+
      `<div class="chrow" style="display:flex;align-items:flex-end;gap:6px">`+
        `<div style="width:180px;font-size:10.5px;color:var(--ink-2);line-height:1.25">${_isMgr?'Мой план предоплат · портфель × '+pct(_TCR):'План предоплат · отдел'} <b style="color:${tc}">${pct(att)}</b></div>`+
        `<div style="flex:1;display:flex;gap:2px;align-items:flex-end">${strip(fact,P,mx,46,'')}</div>`+
        (()=>{const gsc=Math.max(1,ftot,ptot),gfh=Math.min(100,ftot/gsc*100).toFixed(0),gph=Math.min(100,ptot/gsc*100).toFixed(0);
          return `<div style="width:${RW}px;box-sizing:border-box;border-left:1px dashed var(--border-soft);padding-left:6px;display:flex;align-items:flex-end;justify-content:flex-end;gap:4px" data-tip="${dt(_isMgr?'Мой план предоплат':'План предоплат отдела',[['Факт',fmtV(ftot),'hl'],[_isMgr?'Цель':'План',fmtV(ptot),'hl'],['Выполнение',pct(att),'hl'],['База',_isMgr?'портфель × '+pct(_TCR):'из таблицы','dim'],['Статус',att>=1?'выполнен':'не выполнен','dim']]).replace(/"/g,'&quot;')}"><div style="position:relative;flex:0 0 auto;width:22px;height:46px;background:var(--bg-base);border:1px solid var(--border-hot);border-top:none;border-radius:0 0 4px 4px"><div style="position:absolute;left:0;bottom:0;width:100%;height:${gfh}%;background:${tc};opacity:.92;border-radius:0 0 3px 3px"></div><div style="position:absolute;left:-1px;right:-1px;bottom:${gph}%;border-top:2px dashed #A78BFA"></div></div><span style="flex:0 0 auto;text-align:right;font-size:12px;font-weight:800;line-height:1.15"><span style="color:${att>=1?'#2E9E74':'var(--ink-3)'}">${fmtV(ftot)}</span><div style="color:var(--ink);font-weight:700;font-size:10.5px">/${fmtV(ptot)}</div></span></div>`;})()+
      `</div></div>`;
  })();

  // панель сделок по клику на ячейку (sid может быть "kp" или "kp~Менеджер")
  const cellPanel=(()=>{
    if(!S.calCell)return "";
    const parts=String(S.calCell.s).split("~"),r=RBY[parts[0]]||RBY2[parts[0]];if(!r)return "";
    const sc=parts[1]?passed.filter(d=>d.mgr===parts[1]):scope,k=S.calCell.k,ds=dealsFor(r,k,sc);
    if(!ds.length)return "";
    const hdrNm=`${(r.base&&RBY[r.base]?RBY[r.base].nm.replace('→ ','')+' · ':'')}${r.nm.replace('→ ','')}${parts[1]?' · '+esc(parts[1]):''} · ${lbl(k)}`;
    const wrap=(cnt,sumHTML,thead,tbody)=>`<div style="margin-top:10px;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;background:var(--bg-base)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap"><b style="font-size:12px;color:${r.color}">${hdrNm}</b><span class="card-sub">${cnt}${sumHTML}</span><span style="flex:1"></span><button data-calcellclose style="background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--ink-3);cursor:pointer;font-size:11px;padding:1px 7px">✕ закрыть</button></div><div class="scroll" style="max-height:300px"><table class="tbl"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div></div>`;
    if(r.lead){
      // Лид как ссылка на Битрикс + этап воронки, ответственный, срок в воронке лидов (с создания).
      const ll=id=>portal?`<a href="${portal}/crm/lead/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">#${id}</a>`:('#'+id);
      const lb=ds.slice(0,120).map(l=>{const dg=_daysAt(l.created),dc=dg>30?'#CC5867':dg>14?'#D9A441':'var(--ink-3)';return `<tr><td style="text-align:center">${ll(l.id)}</td><td style="text-align:left">${esc(l.title||('лид #'+l.id))}</td><td style="text-align:left">${esc(l.status||'-')}</td><td class="name" style="text-align:left">${esc(l.mgr||'-')}</td><td style="text-align:left;font-size:11px;color:var(--ink-3)">${esc(l.source||'-')}</td><td style="text-align:center;color:${dc};font-weight:700">${dg} дн</td></tr>`;}).join("");
      return wrap(`${fmt(ds.length)} лидов`,'','<tr><th>Лид</th><th style="text-align:left">Название</th><th style="text-align:left">Этап воронки</th><th style="text-align:left">Ответственный</th><th style="text-align:left">Источник</th><th>В воронке</th></tr>',lb);
    }
    const body=ds.slice(0,120).map(d=>{const evd=r.wip?'':(r.df(d)||'').slice(0,10);return `<tr><td style="text-align:center">${dl(d.id)}</td><td class="name" style="text-align:left">${esc(d.mgr)}</td><td style="text-align:left">${esc(d.stage||'')}</td><td style="text-align:center">${fmtK(d.budget||0)}</td><td style="text-align:left;font-size:11px;color:var(--ink-3)">${esc(catV(d))} · ${esc(cliV(d))}</td>${r.wip?'':`<td style="text-align:center;font-size:10px;color:var(--ink-4)">${evd}</td>`}</tr>`;}).join("");
    return wrap(`${fmt(ds.length)} сделок`,` · ${fmtK(money(ds))} ₽`,`<tr><th>Сделка</th><th style="text-align:left">Менеджер</th><th style="text-align:left">Текущая стадия</th><th>Бюджет</th><th style="text-align:left">Категория / клиент</th>${r.wip?'':'<th>Дата события</th>'}</tr>`,body);
  })();

  // лидерборд
  const mst=names.map(m=>{const sc=passed.filter(d=>d.mgr===m);const a=sc.filter(d=>inR(firstOffer(d))).length,su=sc.filter(d=>inR(enterExec(d))).length,lo=sc.filter(d=>inR(enterLose(d))).length,opn=open.filter(d=>d.mgr===m).length;return {m,a,su,lo,opn,bal:a-(su+lo)};});
  const medOpen=median(mst.map(x=>x.opn))||0;
  mst.forEach(x=>{x.risk=x.opn>=medOpen&&x.a>(x.su+x.lo)&&x.opn>0;});
  mst.sort((a,b)=>b.opn-a.opn);
  const lbRows=mst.map(x=>{const sel=mgrSel===x.m;return `<tr data-calmgr="${esc(x.m)}" style="cursor:pointer;${sel?'background:rgba(34,211,238,.12)':''}"><td class="name" style="text-align:left">${sel?'<span style="color:#22D3EE">▸ </span>':''}${esc(x.m)}${x.risk?' <span data-tip="Копит офферы быстрее, чем раскешивает, при высокой загрузке" style="font-size:9px;font-weight:700;color:#F43F5E;background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.45);border-radius:5px;padding:1px 5px">зона риска</span>':''}</td><td style="text-align:center;font-weight:800;color:${x.opn>=medOpen&&x.opn?'#F8717A':'var(--ink-2)'}">${x.opn}</td><td style="text-align:center;color:#22D3EE">${x.a||'·'}</td><td style="text-align:center;color:#2E9E74">${x.su||'·'}</td><td style="text-align:center;color:#CC5867">${x.lo||'·'}</td><td style="text-align:center;font-weight:700;color:${x.bal>0?'#F8717A':'#2E9E74'}">${x.bal>0?'+':''}${x.bal}</td></tr>`;}).join("");
  const lb=`<table class="tbl"><thead><tr><th style="text-align:left">Менеджер · клик открывает его календарь</th><th>Загрузка ${info('Горячих сделок на менеджере сейчас (снимок).')}</th><th style="color:#22D3EE">Пришло ${info('Новых офферов зашло за период.')}</th><th style="color:#2E9E74">Успех ${info('Раскешено за период (предоплата).')}</th><th style="color:#CC5867">Отказ ${info('Ушло в проигрыш за период.')}</th><th>Баланс ${info('Пришло − (Успех+Отказ). Плюс = копит, минус = разгружает.')}</th></tr></thead><tbody>${lbRows}</tbody></table><div class="card-sub" style="margin:6px 2px 0"><b style="color:#22D3EE">Пришло</b> зашло · <b style="color:#2E9E74">Успех</b> раскешено · <b style="color:#CC5867">Отказ</b> · <b>Баланс</b>: <span style="color:#F8717A">плюс = копит</span> / <span style="color:#2E9E74">минус = разгружает</span>.</div>`;

  const riskN=mst.filter(x=>x.risk).length;
  const unitSeg=`<div class="seg" id="calUnitSeg"><button data-cu="count" class="${unit!=='money'?'on':''}">Кол-во</button><button data-cu="money" class="${unit==='money'?'on':''}">Выручка</button></div>`;
  const _wm=(typeof MANAGER!=='undefined'&&MANAGER)?'age':(S.calWipMode||'mgr');
  const wipModeSeg=`<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-4)" data-tip="Порядок разворота стадий и «В работе»: сначала по менеджерам, либо сначала по сроку (когорты новые/застой/брошенные), а внутри - менеджеры">разворот:<div class="seg"><button data-calwipmode="mgr" class="${_wm==='mgr'?'on':''}">менеджеры</button><button data-calwipmode="age" class="${_wm==='age'?'on':''}">сроки</button></div></div>`;
  const _ddOpts=[""].concat(names.slice().sort((a,b)=>a.localeCompare(b)));
  const _ddMenu=S.calMgrOpen?`<div style="position:absolute;top:calc(100% + 4px);right:0;z-index:60;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.5);max-height:300px;overflow:auto;min-width:200px;padding:4px">${_ddOpts.map(m=>{const sel=m===mgrSel,lab=m||"Весь отдел";return `<div class="ddopt" data-calmgropt="${esc(m)}" style="padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;color:${sel?'#22D3EE':'var(--ink-2)'};background:${sel?'rgba(34,211,238,.12)':'transparent'}">${esc(lab)}</div>`;}).join("")}</div>`:"";
  const mgrSelHTML=`<div data-calmgrdd style="position:relative"><button data-calmgrbtn style="display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg-base);color:var(--ink-2);border:1px solid var(--border-soft);border-radius:8px;font-size:12px;padding:6px 10px;cursor:pointer;min-width:175px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(mgrSel||"Весь отдел")}</span><span style="color:var(--ink-4);font-size:10px">${S.calMgrOpen?'▲':'▼'}</span></button>${_ddMenu}</div>`;
  const isMgr=typeof MANAGER!=='undefined'&&MANAGER;
  const tilesHTML=isMgr?managerPortfolioTiles():'';
  const ttl=isMgr?'Мой клиентский портфель':'Календарь горячих сделок';
  const tip=isMgr
    ?'Вся воронка в одном месте, сверху вниз: лиды → до предложения → оффер пришёл → в работе → успех/отказ. Клик по строке этапа = разбивка по срокам (свежие / застой / брошенные), клик по ячейке = список этих сделок. «Запас · лиды» приглушён: это будущее, не срочное. «До предложения» - здесь надо действовать: взять, квалифицировать, сделать ТЗ, отправить КП. Вопрос: с кем работать дальше и где сделки застревают? Вывод: пусто в «до предложения» и в лидах - скоро нечего закрывать, проси лиды; «брошенные 30+» висят давно - ими займись в первую очередь.'
    :'Движение твоих сделок по времени: сколько пришло, сколько в работе, сколько ушло в успех или отказ. Разверни строку стрелкой - увидишь разбивку по срокам (свежие / застой / брошенные). Клик по клетке - список этих сделок. Переключатель Кол-во/Выручка - смотреть в штуках или в деньгах. Вопрос: где сделки застревают и что назревает? Вывод: «брошенные 30+» висят давно - ими займись в первую очередь.';
  const sub=isMgr?`стадии портфеля и движение сделок по времени`:`приток, «в работе» и перемещения сделок по стадиям · клик по этапу раскрывает по менеджерам`;
  return `<div class="card"><div class="card-h" style="flex-wrap:wrap;gap:8px"><div><div class="card-title">${ttl} ${info(tip)}</div><div class="card-sub">${sub}</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${isMgr?'':mgrSelHTML}${isMgr?'':wipModeSeg}${unitSeg}</div></div>${tilesHTML?`<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px">${tilesHTML}</div>`:''}<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px"><div class="card-t" style="font-size:12.5px">${isMgr?'Вся воронка сделок - одна таблица':(mgrSel?esc(mgrSel):"Весь отдел")+' · календарь движения сделок'}${unit==="money"?" · выручка ₽":""}</div><div class="card-sub" style="margin-bottom:6px">${isMgr?'сверху вниз: лиды → до предложения → оффер пришёл → в работе → успех/отказ · клик по строке этапа = разбивка по срокам · клик по ячейке = список сделок':`${unit==="money"?"₽ в интервале":"сделок в интервале"} · клик по этапу - разбивка по менеджерам · клик по ячейке - список сделок`} · Σ - итог за период</div>${cal}${cupStrip}${cellPanel}</div></div>`;
}

// ===== УПРАВЛЕНЧЕСКИЕ РЕШЕНИЯ: индекс эффективности, матрица нагрузки, рекомендации =====
// Синтез для решений: ограничить новые / перераспределить / нанять. Считает по горячему
// пайплайну (оффер-стадии): конверсия, скорость, раскешено за 90 дн, застой, нагрузка.
function mgmtDecisionsBlock(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const EARLY=new Set(["C49:NEW","C49:UC_LRFLH9","C49:PREPARATION","C49:UC_OGZUU0","C49:UC_32UM3S"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  if(!passed.length)return "";
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const money=a=>a.reduce((s,d)=>s+(d.budget||0),0);
  const PD=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const age=d=>Math.max(0,Math.round((NOWD-PD(d.created))/DAYMS));
  const cycle=d=>{const f=firstOffer(d);return (f&&d.closed)?Math.max(0,Math.round((PD(d.closed)-PD(f))/DAYMS)):null;};
  const M=s=>String(s||"").slice(0,7);
  const cutoff=NOWD-90*DAYMS;
  const inWin=s=>s&&PD(s).getTime()>=cutoff;
  const cliV=d=>{const c=d.client;return (!c||c==="нет данных")?"не указан":c;};
  const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

  const early={};AD.filter(d=>!d.won&&!d.lost&&EARLY.has(d.stageCode)).forEach(d=>{early[d.mgr]=(early[d.mgr]||0)+1;});
  const names=new Set([...open.map(d=>d.mgr),...passed.map(d=>d.mgr)]);
  let rows=[...names].map(mgr=>{
    const op=open.filter(d=>d.mgr===mgr),ps=passed.filter(d=>d.mgr===mgr);
    const won=ps.filter(d=>d.won),lost=ps.filter(d=>d.lost);
    const wr=(won.length+lost.length)?won.length/(won.length+lost.length):null;
    const cyc=median(won.map(cycle).filter(x=>x!=null));
    const stuck=op.filter(d=>age(d)>60);
    const wonRec=won.filter(d=>inWin(d.closed));
    return {mgr,op,openN:op.length,pipe:money(op),early:early[mgr]||0,won:won.length,lost:lost.length,wr,cyc,stuck:stuck.length,stuckM:money(stuck),cashRec:wonRec.length,cashRecM:money(wonRec),load:op.length+(early[mgr]||0),ps};
  }).filter(r=>r.openN>0||(r.won+r.lost)>0);

  const arr=f=>rows.map(f).filter(x=>x!=null&&isFinite(x));
  const norm=(v,vals,inv)=>{if(v==null||!vals.length)return 0;const mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn)return .5;const n=(v-mn)/(mx-mn);return inv?1-n:n;};
  const wrV=arr(r=>r.wr),cycV=arr(r=>r.cyc),cashV=arr(r=>r.cashRecM),stuckV=rows.map(r=>r.openN?r.stuck/r.openN:0);
  rows.forEach(r=>{r.index=Math.round(100*(.40*norm(r.wr,wrV)+.20*norm(r.cyc,cycV,true)+.25*norm(r.cashRecM,cashV)+.15*norm(r.openN?r.stuck/r.openN:0,stuckV,true)));});
  const medIdx=median(rows.map(r=>r.index))||0,medLoad=median(rows.map(r=>r.load))||0;
  const rec=r=>{const hE=r.index>=medIdx,hL=r.load>=medLoad;
    if(hE&&!hL)return {t:"дать больше потока",c:"#2E9E74",why:"эффективен, есть ёмкость"};
    if(hE&&hL)return {t:"звезда - беречь",c:"#22D3EE",why:"эффективен, но загружен: не перегружать"};
    if(!hE&&hL)return {t:"ограничить новые + перераспределить",c:"#F43F5E",why:"перегружен и слабо закрывает"};
    return {t:"разбор / обучение",c:"#C2873C",why:"низкая эффективность при малой загрузке"};};
  rows.forEach(r=>r.rec=rec(r));
  const sk=S.mdSort||"index",asc=S.mdAsc?1:-1;
  rows=rows.slice().sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*asc;});

  // ---- команда: приток vs раскешивание (найм?) ----
  const months=[...new Set(passed.flatMap(d=>[M(firstOffer(d)),M(d.closed)]).filter(Boolean))].sort();
  const last3=months.slice(-3);
  const inflow3=passed.filter(d=>last3.includes(M(firstOffer(d)))).length;
  const closed3=passed.filter(d=>(d.won||d.lost)&&last3.includes(M(d.closed))).length;
  const backlogGrows=inflow3>closed3*1.15;
  const overloaded=rows.filter(r=>r.load>=medLoad);
  const headroom=rows.filter(r=>r.load<medLoad&&r.index>=medIdx).sort((a,b)=>b.index-a.index).map(r=>r.mgr).slice(0,3);
  const redistN=overloaded.reduce((s,r)=>s+r.stuck,0),redistM=overloaded.reduce((s,r)=>s+r.stuckM,0);
  const overloadN=rows.filter(r=>r.load>=medLoad&&r.index<medIdx).length;
  const hire=backlogGrows&&overloadN>=Math.ceil(rows.length/3);
  const teamVerdict=hire
    ? {t:"Рассмотреть найм / жёсткое перераспределение",c:"#F43F5E",why:`приток офферов за 3 мес (${fmt(inflow3)}) обгоняет раскешивание (${fmt(closed3)}), и ${overloadN} менеджеров перегружены при слабом закрытии - ёмкости не хватает`}
    : {t:"Ёмкости хватает - фокус на перераспределение и обучение",c:"#2E9E74",why:`раскешивание успевает за притоком (приток ${fmt(inflow3)} / закрыто ${fmt(closed3)} за 3 мес); проблема в эффективности, а не в числе людей`};

  // ---- матрица Эффективность × Нагрузка ----
  const matrix=(()=>{
    const W=760,H=320,pad=46,xmax=Math.max(1,...rows.map(r=>r.load)),X=v=>pad+v/xmax*(W-2*pad),Y=v=>H-pad-v/100*(H-2*pad);
    const qx=X(medLoad),qy=Y(medIdx);
    const tint=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" opacity=".05"/>`;
    const bg=tint(pad,pad,qx-pad,qy-pad,"#22D3EE")+tint(qx,pad,W-pad-qx,qy-pad,"#F43F5E")+tint(pad,qy,qx-pad,H-pad-qy,"#C2873C")+tint(qx,qy,W-pad-qx,H-pad-qy,"#2E9E74").replace("#2E9E74","#2E9E74");
    const grid=`<line x1="${qx}" y1="${pad}" x2="${qx}" y2="${H-pad}" stroke="var(--border)" stroke-dasharray="3 3"/><line x1="${pad}" y1="${qy}" x2="${W-pad}" y2="${qy}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
    const qlab=`<text x="${pad+6}" y="${pad+12}" font-size="9" fill="#22D3EE">звёзды: дать больше</text><text x="${W-pad-6}" y="${pad+12}" text-anchor="end" font-size="9" fill="#F43F5E">перегруз + слабо: ограничить</text><text x="${pad+6}" y="${H-pad-6}" font-size="9" fill="#C2873C">мало и слабо: обучать</text><text x="${W-pad-6}" y="${H-pad-6}" text-anchor="end" font-size="9" fill="#2E9E74">эффективен, есть ёмкость</text>`;
    const dots=rows.map(r=>{const x=X(r.load),y=Y(r.index),ini=r.mgr.split(" ").map(w=>w[0]).slice(0,2).join("");
      const td=(r.mgr+' · индекс '+r.index+' · нагрузка '+r.load+' сделок · '+r.rec.t).replace(/"/g,'&quot;');
      return `<g data-tip="${td}"><circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="15" fill="${r.rec.c}" opacity=".85"/><text x="${x.toFixed(0)}" y="${(y+3.5).toFixed(0)}" text-anchor="middle" font-size="10" font-weight="800" fill="#06121a">${esc(ini)}</text></g>`;}).join("");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${bg}${grid}${qlab}<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-4)">Нагрузка (открытых + ранних сделок) →</text><text x="12" y="${H/2}" text-anchor="middle" font-size="9" fill="var(--ink-4)" transform="rotate(-90 12 ${H/2})">Индекс эффективности →</text>${dots}</svg>`;
  })();

  // ---- таблица индекса (клик - drill-down) ----
  const idxColor=v=>v>=66?"#2E9E74":v>=40?"#C2873C":"#CC5867";
  const th=(k,t,tip)=>`<th data-mdsort="${k}" class="${S.mdSort===k?'sorted'+(S.mdAsc?' asc':''):''}" style="cursor:pointer;text-align:center;white-space:nowrap">${t}${tip?info(tip):""}</th>`;
  const head=`<tr><th style="text-align:left">Менеджер</th>${th("index","Индекс","Композит 0-100: конверсия 40% + скорость 20% + раскешено за 90 дн 25% + низкий застой 15%. Нормировка внутри отдела - относительный рейтинг, не абсолют.")}${th("wr","Конв. %","Выигранные ÷ закрытые (прошедшие оффер)")}${th("cyc","Ср. срок","Медиана дней оффер→успех")}${th("cashRecM","Раскешено 90д","Сумма выигранных за последние 90 дней")}${th("openN","Открытых")}${th("load","Нагрузка","Открытые + ранние сделки - сколько на менеджере в работе")}${th("stuck","Застряло 60+","Открытые офферы старше 60 дней")}<th style="text-align:left">Рекомендация</th></tr>`;
  const body=rows.map(r=>{
    const opn=!!(S.mdOpen&&S.mdOpen[r.mgr]);
    const main=`<tr data-mdmgr="${esc(r.mgr)}" style="cursor:pointer"><td class="name" style="text-align:left">${opn?'<span style="color:#A78BFA">▾ </span>':'<span style="color:#A78BFA">▸ </span>'}${esc(r.mgr)}</td>
      <td style="text-align:center"><span style="display:inline-block;min-width:34px;font-family:'Manrope';font-weight:800;font-size:15px;color:${idxColor(r.index)}">${r.index}</span></td>
      <td style="text-align:center;font-weight:700;color:${idxColor((r.wr||0)*100*1.5)}">${r.wr==null?'—':pct(r.wr)}</td>
      <td style="text-align:center">${r.cyc!=null?fmt(r.cyc)+' дн':'—'}</td>
      <td style="text-align:center;font-weight:700">${r.cashRecM?fmtK(r.cashRecM):'·'}</td>
      <td style="text-align:center">${r.openN}</td>
      <td style="text-align:center;font-weight:700;color:${r.load>=medLoad?'#F8717A':'var(--ink-2)'}">${r.load}</td>
      <td style="text-align:center;color:${r.stuck?'#F8717A':'var(--ink-3)'};font-weight:${r.stuck?700:400}">${r.stuck||'·'}${r.stuckM?`<div style="font-size:9px;font-weight:400;color:var(--ink-4)">${fmtK(r.stuckM)}</div>`:''}</td>
      <td style="text-align:left"><span style="display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;color:${r.rec.c};background:${r.rec.c}22;border:1px solid ${r.rec.c}66;border-radius:6px;padding:2px 8px" data-tip="${esc(r.rec.why)}">${r.rec.t}</span></td></tr>`;
    if(!opn)return main;
    // drill-down: клиенты пайплайна + конверсия по месяцам
    const cliG={};r.op.forEach(d=>{const k=cliV(d);cliG[k]=(cliG[k]||0)+(d.budget||0);});
    const cliTop=Object.entries(cliG).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const cliMx=cliTop.length?cliTop[0][1]:1;
    const cliBars=cliTop.map(([n,v])=>`<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><div style="width:150px;font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</div><div style="flex:1;height:12px;background:var(--bg-base);border-radius:6px;overflow:hidden"><div style="height:100%;width:${(v/cliMx*100).toFixed(1)}%;background:#60A5FA"></div></div><div style="width:60px;font-size:11px;font-weight:700;color:var(--ink-2)">${fmtK(v)}</div></div>`).join("")||'<div class="card-sub">нет открытых</div>';
    const mm=[...new Set(r.ps.flatMap(d=>[M(firstOffer(d)),M(d.closed)]).filter(Boolean))].sort().slice(-6);
    const conv=mm.map(m=>{const w=r.ps.filter(d=>d.won&&M(d.closed)===m).length,l=r.ps.filter(d=>d.lost&&M(d.closed)===m).length,c=w+l;return {m,cr:c?w/c:null,w,l};});
    const cMx=Math.max(1,...conv.map(x=>x.w+x.l));
    const convBars=conv.map(x=>{const h=(x.w+x.l)/cMx*44,wh=(x.w+x.l)?x.w/(x.w+x.l)*h:0;return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" data-tip="${(MN[+x.m.split('-')[1]-1]+': '+(x.cr==null?'—':pct(x.cr)+' ('+x.w+'✓/'+x.l+'✗)')).replace(/"/g,'&quot;')}"><div style="font-size:8.5px;color:var(--ink-3)">${x.cr==null?'':pct(x.cr)}</div><div style="width:56%;height:${h.toFixed(0)}px;min-height:2px;background:#CC5867;border-radius:2px;display:flex;flex-direction:column-reverse"><div style="height:${wh.toFixed(0)}px;background:#2E9E74"></div></div><div style="font-size:8.5px;color:var(--ink-4)">${MN[+x.m.split('-')[1]-1]}</div></div>`;}).join("");
    const drill=`<tr style="background:var(--bg-base)"><td colspan="9" style="padding:12px 18px"><div class="grid2"><div><div class="card-sub" style="margin-bottom:4px">Открытый пайплайн по клиенту</div>${cliBars}</div><div><div class="card-sub" style="margin-bottom:4px">Конверсия по месяцам</div><div style="display:flex;gap:4px;align-items:flex-end;height:64px">${convBars}</div></div></div></td></tr>`;
    return main+drill;
  }).join("");
  const tbl=`<div class="scroll" style="max-height:560px"><table class="tbl" id="mdTbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;

  const teamCard=`<div style="margin-top:12px;padding:12px 14px;border-radius:10px;background:${teamVerdict.c}12;border:1px solid ${teamVerdict.c}55"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:16px">${hire?'⚠':'✓'}</span><b style="color:${teamVerdict.c};font-size:14px">${teamVerdict.t}</b></div><div class="card-sub" style="margin-top:5px">${teamVerdict.why}.</div><div class="card-sub" style="margin-top:4px">Разгрузить перегруженных: <b style="color:#F8717A">${fmt(redistN)}</b> застрявших 60+ сделок на <b style="color:#F8717A">${fmtK(redistM)} ₽</b> у менеджеров с нагрузкой выше медианы${headroom.length?` - передать эффективным с ёмкостью: <b style="color:#2E9E74">${headroom.map(esc).join(', ')}</b>`:''}.</div></div>`;

  return `<div class="card"><div class="card-h"><div><div class="card-title">Управленческие решения ${info('Синтез для решений по горячему пайплайну: кого ограничить в новых сделках, чьи сделки перераспределить, нужен ли найм. Индекс - относительный композит внутри отдела (конверсия/скорость/раскешено/застой), это ориентир, а не абсолютная оценка. Матрица делит на 4 зоны по эффективности и нагрузке. Клик по менеджеру - его портфель и конверсия. Вердикт по найму сравнивает приток офферов с раскешиванием за 3 месяца. Вопрос: кого ограничить в новых сделках, чьи перераспределить, нужен ли найм. Вывод: перегруженных разгружай, слабых по конверсии разбирай, при устойчивом притоке выше раскеша - думай о найме.')}</div><div class="card-sub">индекс эффективности · матрица нагрузки · авто-рекомендации</div></div></div>
    ${teamCard}
    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px"><div class="card-t" style="font-size:13px">Матрица: эффективность × нагрузка</div><div class="card-sub" style="margin-bottom:6px">каждый кружок - менеджер (инициалы) · цвет = рекомендация · пунктир = медианы отдела</div>${matrix}</div>
    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px"><div class="card-t" style="font-size:13px">Рейтинг эффективности <span class="card-sub" style="font-weight:400">клик по менеджеру - портфель и динамика</span></div>${tbl}</div></div>`;
}

// ===== ОЦЕНКА МЕНЕДЖЕРОВ: НАКОПЛЕНИЕ ↔ РАСКЕШИВАНИЕ (аналитика оффер-стадий) =====
// Пончики клиент/изделие + конверсия сегмента, поток по месяцам, динамика конверсии,
// возрастные когорты пайплайна. История берётся из hist по датам входа/закрытия.
function offerAnalytics(){
  const OSET=new Set(["C49:PREPAYMENT_INVOIC","C49:3","C49:UC_8JTBV2"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  if(!passed.length)return "";
  const firstOffer=d=>{for(const h of (d.hist||[]))if(OSET.has(h[0]))return h[1];return null;};
  const money=a=>a.reduce((s,d)=>s+(d.budget||0),0);
  const cliV=d=>{const c=d.client;return (!c||c==="нет данных")?"не указан":c;};
  const catV=d=>{const a=d.assort;return (!a||a==="нет данных"||a==="не указана")?"не указана":a;};
  const M=s=>String(s||"").slice(0,7);
  const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  const mLbl=m=>{const p=m.split("-");return MN[+p[1]-1]+" "+p[0].slice(2);};
  const months=(()=>{const set=new Set();passed.forEach(d=>{const f=firstOffer(d);if(f)set.add(M(f));if(d.closed)set.add(M(d.closed));});return [...set].filter(Boolean).sort().slice(-9);})();
  const PAL=["#22D3EE","#A78BFA","#60A5FA","#F59E0B","#2E9E74","#F43F5E","#818CF8","#C084FC","#2DD4BF"];

  // ---- 1) ПОНЧИКИ клиент / изделие ----
  const grp=(arr,kf)=>{const m={};arr.forEach(d=>{const k=kf(d);m[k]=(m[k]||0)+(d.budget||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const donutBlock=(data,dim,title)=>{
    const dd=data.slice(0,8).map((e,i)=>[e[0],e[1],PAL[i%PAL.length]]);
    const leg=dd.map(([n,v,c])=>{const sel=S.ocSeg&&S.ocSeg.dim===dim&&S.ocSeg.val===n;return `<div class="ro-lg" data-ocseg="${dim}|${esc(n)}" style="cursor:pointer;padding:2px 4px;border-radius:6px;${sel?'background:rgba(34,211,238,.12)':''}"><span class="dot" style="background:${c}"></span><span class="nm">${esc(n)}</span><span class="vl">${fmtK(v)}</span></div>`;}).join("");
    return `<div style="flex:1;min-width:290px"><div class="card-t" style="font-size:12.5px">${title}</div><div class="card-sub">клик по сегменту - конверсия в динамике</div><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><div style="flex:0 0 150px">${donut(dd,fmtK(money(open)),dim==="client"?"₽ КЛИЕНТЫ":"₽ ИЗДЕЛИЯ",true)}</div><div style="flex:1">${leg}</div></div></div>`;
  };
  const donuts=`<div style="display:flex;gap:20px;flex-wrap:wrap">${donutBlock(grp(open,cliV),"client","Пайплайн по типу клиента")}${donutBlock(grp(open,catV),"assort","Пайплайн по типу изделия")}</div>`;

  // конверсия выбранного сегмента в динамике
  const segDyn=(()=>{
    if(!S.ocSeg)return "";
    const kf=S.ocSeg.dim==="client"?cliV:catV,val=S.ocSeg.val;
    const seg=passed.filter(d=>kf(d)===val);
    const rows=months.map(m=>{const won=seg.filter(d=>d.won&&M(d.closed)===m).length,lost=seg.filter(d=>d.lost&&M(d.closed)===m).length,cl=won+lost;return {m,won,lost,cr:cl?won/cl:null};});
    const mx=Math.max(1,...rows.map(r=>r.won+r.lost));
    const bars=rows.map(r=>{const h=(r.won+r.lost)/mx*56,wh=(r.won+r.lost)?r.won/(r.won+r.lost)*h:0;return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" data-tip="${(mLbl(r.m)+': '+(r.cr==null?'нет закрытых':'конверсия '+pct(r.cr)+' · '+r.won+'✓/'+r.lost+'✗')).replace(/"/g,'&quot;')}"><div style="font-size:9px;color:${r.cr==null?'var(--ink-4)':'var(--ink-2)'};font-weight:700">${r.cr==null?'':pct(r.cr)}</div><div style="width:60%;height:${h.toFixed(0)}px;min-height:2px;background:#CC5867;border-radius:2px;display:flex;flex-direction:column-reverse"><div style="height:${wh.toFixed(0)}px;background:#2E9E74;border-radius:0 0 2px 2px"></div></div><div style="font-size:9px;color:var(--ink-4)">${MN[+r.m.split("-")[1]-1]}</div></div>`;}).join("");
    const tot=seg.filter(d=>d.won).length,totL=seg.filter(d=>d.lost).length;
    const portal=DATA.b24Portal||"",dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
    const segOpen=open.filter(d=>kf(d)===val);
    const dealsList=segOpen.length?`<div style="margin-top:10px"><div class="card-sub" style="margin-bottom:4px">Открытые сделки сегмента (${fmt(segOpen.length)} · ${fmtK(money(segOpen))} ₽):</div><div class="scroll" style="max-height:240px"><table class="tbl"><thead><tr><th>Сделка</th><th style="text-align:left">Менеджер</th><th style="text-align:left">Стадия</th><th>Бюджет</th></tr></thead><tbody>${segOpen.slice().sort((a,b)=>(b.budget||0)-(a.budget||0)).slice(0,80).map(d=>`<tr><td style="text-align:center">${dl(d.id)}</td><td class="name" style="text-align:left">${esc(d.mgr)}</td><td style="text-align:left;font-size:11px">${esc(d.stage||'')}</td><td style="text-align:center">${fmtK(d.budget||0)}</td></tr>`).join("")}</tbody></table></div></div>`:'<div class="card-sub" style="margin-top:8px">открытых сделок в сегменте нет</div>';
    return `<div style="margin-top:12px;border-top:1px dashed var(--border);padding-top:10px"><div class="card-t" style="font-size:12.5px">Конверсия сегмента: <span style="color:#22D3EE">${esc(val)}</span> <span class="card-sub" style="font-weight:400">всего ${tot}✓ / ${totL}✗ = ${pct(tot+totL?tot/(tot+totL):0)}</span> <button data-ocsegclose style="background:none;border:1px solid var(--border-soft);border-radius:6px;color:var(--ink-3);cursor:pointer;font-size:10px;padding:1px 7px;margin-left:6px">✕ закрыть</button></div><div class="card-sub">зелёное - выигранные, красное - проигранные, % сверху - конверсия месяца (по дате закрытия)</div><div style="display:flex;gap:5px;align-items:flex-end;height:84px;margin-top:8px">${bars}</div>${dealsList}</div>`;
  })();

  // ---- 2) ПОТОК накопление ↔ раскешивание по месяцам ----
  const flow=(()=>{
    const rows=months.map(m=>{const inn=passed.filter(d=>M(firstOffer(d))===m),won=passed.filter(d=>d.won&&M(d.closed)===m),lost=passed.filter(d=>d.lost&&M(d.closed)===m);return {m,in:inn.length,inM:money(inn),won:won.length,lost:lost.length};});
    const mx=Math.max(1,...rows.map(r=>Math.max(r.in,r.won+r.lost))),H=54;
    const cols=rows.map(r=>{const mig=r.m==="2026-03";const inH=r.in/mx*H,wH=r.won/mx*H,lH=r.lost/mx*H;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center" data-tip="${(mLbl(r.m)+' · приток '+r.in+' ('+fmtK(r.inM)+' ₽) · успех '+r.won+' · отказ '+r.lost).replace(/"/g,'&quot;')}"><div style="height:${H}px;display:flex;align-items:flex-end"><div style="width:16px;height:${inH.toFixed(0)}px;min-height:1px;background:#22D3EE;border-radius:2px 2px 0 0"></div></div><div style="width:70%;height:1px;background:var(--border)"></div><div style="width:16px;display:flex;flex-direction:column"><div style="height:${wH.toFixed(0)}px;background:#2E9E74"></div><div style="height:${lH.toFixed(0)}px;background:#CC5867;border-radius:0 0 2px 2px"></div></div><div style="font-size:9px;color:${mig?'#F59E0B':'var(--ink-4)'};margin-top:2px">${MN[+r.m.split("-")[1]-1]}${mig?'⚑':''}</div></div>`;}).join("");
    return `<div class="card-t" style="font-size:12.5px">Накопление ↔ раскешивание</div><div class="card-sub"><span style="color:#22D3EE">■</span> вверх - приток офферов · вниз <span style="color:#2E9E74">■</span> успех / <span style="color:#CC5867">■</span> отказ · ⚑ март = миграция CRM</div><div style="display:flex;gap:6px;align-items:center;margin-top:10px">${cols}</div>`;
  })();

  // ---- 3) ДИНАМИКА КОНВЕРСИИ (отдел) ----
  const convDyn=(()=>{
    const rows=months.map(m=>{const won=passed.filter(d=>d.won&&M(d.closed)===m).length,lost=passed.filter(d=>d.lost&&M(d.closed)===m).length,cl=won+lost;return {m,cr:cl?won/cl:null};});
    const W=Math.max(300,months.length*46),H=86,pad=16,span=(W-2*pad)/(months.length-1||1);
    const pts=rows.map((r,i)=>({x:pad+i*span,y:r.cr==null?null:H-20-(r.cr*(H-30)),r}));
    let path="";pts.forEach(p=>{if(p.y==null)return;path+=(path?"L":"M")+p.x.toFixed(0)+" "+p.y.toFixed(0)+" ";});
    const dots=pts.map(p=>p.y==null?"":`<circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="3.5" fill="#2E9E74" data-tip="${(mLbl(p.r.m)+': '+pct(p.r.cr)).replace(/"/g,'&quot;')}"/><text x="${p.x.toFixed(0)}" y="${(p.y-7).toFixed(0)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--ink-2)">${pct(p.r.cr)}</text>`).join("");
    const lbls=months.map((m,i)=>`<text x="${(pad+i*span).toFixed(0)}" y="${H-4}" text-anchor="middle" font-size="8" fill="var(--ink-4)">${MN[+m.split("-")[1]-1]}</text>`).join("");
    return `<div class="card-t" style="font-size:12.5px">Динамика конверсии оффер→успех</div><div class="card-sub">доля выигранных среди закрытых по месяцам (по дате закрытия)</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;margin-top:6px"><path d="${path}" fill="none" stroke="#2E9E74" stroke-width="2"/>${dots}${lbls}</svg>`;
  })();

  // ---- 4) ВОЗРАСТНЫЕ КОГОРТЫ (застой) ----
  const cohorts=(()=>{
    const age=d=>Math.max(0,Math.round((NOWD-new Date(String(d.created).slice(0,10)+"T12:00:00+03:00"))/DAYMS));
    const bk=[["≤14 дн",0,14,"#2E9E74"],["14-30",15,30,"#D9A441"],["30-60",31,60,"#C2873C"],["60+ дн",61,1e9,"#CC5867"]];
    const rows=bk.map(([l,a,b,c])=>{const ds=open.filter(d=>{const g=age(d);return g>=a&&g<=b;});return {l,c,n:ds.length,sum:money(ds)};});
    const tot=open.length||1;
    const bar=`<div style="display:flex;height:32px;border-radius:8px;overflow:hidden;background:var(--bg-base)">`+rows.map(r=>r.n?`<div data-tip="${(r.l+': '+r.n+' сделок · '+fmtK(r.sum)+' ₽').replace(/"/g,'&quot;')}" style="width:${(r.n/tot*100).toFixed(1)}%;background:${r.c};display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:800;color:#06121a;min-width:0"><span>${r.l}</span><span>${r.n}</span></div>`:"").join("")+`</div>`;
    return `<div class="card-t" style="font-size:12.5px">Возраст пайплайна (застой)</div><div class="card-sub">открытые офферы по возрасту с создания · в 60+ застряло <b style="color:#F8717A">${fmtK(rows[3].sum)} ₽</b> (${pct(rows[3].n/tot)} сделок)</div><div style="margin-top:8px">${bar}</div>`;
  })();

  return `<div class="card"><div class="card-h"><div><div class="card-title">Пайплайн по сегментам: клиент и изделие ${info('Структура открытого горячего пайплайна по типу клиента и типу изделия; клик по сегменту - его конверсия по месяцам и список сделок. Вопрос: где сосредоточены деньги и какое там качество закрытия. Вывод: крупный ₽-сегмент с низкой конверсией (Дилер, Лофт) - в разбор; «не указана» по изделию - чинить заполнение.')}</div><div class="card-sub">доли пайплайна по клиенту и изделию · клик по сегменту - конверсия и сделки${(()=>{const a=passed.filter(d=>d.created===MIGDATE).length;return a?` · <span style="color:#F59E0B;font-weight:700">из Amo: ${pct(a/passed.length)}</span>`:'';})()}</div></div></div>${donuts}${segDyn}</div>`;
}

// ===== СО СДЕЛАННЫМ ПРЕДЛОЖЕНИЕМ: КП отправлено / Принимают решение / Долгострой =====
// Горячий пайплайн: открытые сделки, где оффер уже у клиента. Полная картина по
// менеджеру + динамика закрытия + фокус «новые против горячих» + причины отказов.
function offerControlBlock(){
  const OFFER={ "C49:PREPAYMENT_INVOIC": { l: "КП отправлено", c: "#60A5FA" }, "C49:3": { l: "Принимают решение", c: "#C2873C" }, "C49:UC_8JTBV2": { l: "Долгострой", c: "#F43F5E" } };
  const OSET=new Set(Object.keys(OFFER));
  const EARLY=new Set(["C49:NEW","C49:UC_LRFLH9","C49:PREPARATION","C49:UC_OGZUU0","C49:UC_32UM3S","C49:PREPARATION"]);
  const dirOk=d=>!S.fDir||d.dir===S.fDir;
  const AD=(DATA.deals||[]).filter(dirOk);
  const open=AD.filter(d=>OSET.has(d.stageCode)&&!d.won&&!d.lost);
  if(!open.length)return "";
  const PD=s=>new Date(String(s).slice(0,10)+"T12:00:00+03:00");
  const enter=d=>{const h=d.hist||[];let dt=null;for(const e of h)if(e[0]===d.stageCode&&e[1])dt=e[1];return dt||d.created;};
  const loseDate=d=>{const h=d.hist||[];let dt=null;for(const e of h)if(/LOSE|APOLOGY/.test(e[0])&&e[1])dt=e[1];return dt||d.closed||"";};
  const age=d=>Math.max(0,Math.round((NOWD-PD(d.created))/DAYMS));
  const dwell=d=>Math.max(0,Math.round((NOWD-PD(enter(d)))/DAYMS));
  const money=a=>a.reduce((s,d)=>s+(d.budget||0),0);
  const checks=a=>a.map(d=>d.budget||0).filter(v=>v>0);
  const cat=d=>{const a=d.assort;return (!a||a==="нет данных"||a==="не указана")?"не указана":a;};
  const cli=d=>{const c=d.client;return (!c||c==="нет данных")?"не указан":c;};
  const portal=DATA.b24Portal||"";
  const dl=id=>portal?`<a href="${portal}/crm/deal/details/${id}/" target="_blank" rel="noopener" style="color:#3DAEC2">${id}</a>`:id;
  const isAmo=d=>d.created===MIGDATE; // перенос из AmoCRM (все залиты 05.03.2026)
  const amoBadge=d=>isAmo(d)?` <span data-tip="Перенос из AmoCRM 05.03.2026 - дата и стадия недостоверны" style="font-size:8.5px;font-weight:700;color:#F59E0B;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);border-radius:4px;padding:0 4px;white-space:nowrap">Amo</span>`:"";
  const ageC=v=>v>=60?"#B0414F":v>=30?"#CC5867":v>=14?"#C2873C":"#2E9E74";

  // ---- 1) KPI-строка ----
  const ch=checks(open),pipe=money(open),ages=open.map(age),avgAge=ages.length?Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):0;
  const stuck=open.filter(d=>dwell(d)>30).length;
  const amoOpen=open.filter(isAmo),amoN=amoOpen.length,amoM=money(amoOpen);
  const byStage=Object.keys(OFFER).map(k=>({k,...OFFER[k],n:open.filter(d=>d.stageCode===k).length,sum:money(open.filter(d=>d.stageCode===k))}));
  const kpiHTML=`<div style="margin-bottom:12px">`+kstrip([
    {k:"Открытых сделок",v:fmt(open.length),sub:"оффер уже у клиента",ac:"#22D3EE"},
    {k:"Пайплайн",v:fmtK(pipe),u:" ₽",sub:"сумма бюджетов открытых",ac:"#A78BFA"},
    {k:"Ср. чек",v:fmtK(ch.length?pipe/ch.length:0),u:" ₽",sub:"средний бюджет открытой",ac:"#60A5FA"},
    {k:"Медиана чека",v:fmtK(median(ch)||0),u:" ₽",sub:"типичный бюджет",ac:"#818CF8"},
    {k:"Ср. возраст",v:fmt(avgAge),u:" дн",sub:"дней с создания сделки",ac:"#C2873C"},
    {k:"Зависших >30 дн",v:fmt(stuck),sub:"лежат в стадии дольше 30 дней",ac:"#F43F5E"},
  ],6)+`</div>`;
  const splitBar=`<div style="display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--bg-base);margin-bottom:4px">`+byStage.map(s=>s.n?`<div data-tip="${(s.l+': '+fmt(s.n)+' сделок · '+fmtK(s.sum)+' ₽').replace(/"/g,'&quot;')}" style="width:${(s.n/open.length*100).toFixed(1)}%;background:${s.c};display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;color:#06121a;min-width:0"><span>${s.l}</span><span>${fmt(s.n)}</span></div>`:"").join("")+`</div><div class="card-sub" style="margin-bottom:12px">Долгострой (красный) - оффер завис: разбирать в первую очередь</div>`;

  // ---- исторические (прошедшие эти стадии) для «кто закрывает» и причин отказа ----
  const passed=AD.filter(d=>(d.hist||[]).some(h=>OSET.has(h[0])));
  const H={};passed.forEach(d=>{const h=H[d.mgr]||(H[d.mgr]={won:0,lost:0,wc:[]});if(d.won){h.won++;if(d.budget>0)h.wc.push(d.budget);}else if(d.lost)h.lost++;});
  const earlyN={};AD.filter(d=>!d.won&&!d.lost&&EARLY.has(d.stageCode)).forEach(d=>{earlyN[d.mgr]=(earlyN[d.mgr]||0)+1;});

  // ---- 2) таблица по менеджерам ----
  const G={};open.forEach(d=>{(G[d.mgr]=G[d.mgr]||[]).push(d);});
  let mrows=Object.entries(G).map(([mgr,ds])=>{
    const c=checks(ds),h=H[mgr]||{won:0,lost:0,wc:[]},cr=(h.won+h.lost)?h.won/(h.won+h.lost):null;
    return {mgr,ds,n:ds.length,kp:ds.filter(d=>d.stageCode==="C49:PREPAYMENT_INVOIC").length,dec:ds.filter(d=>d.stageCode==="C49:3").length,lng:ds.filter(d=>d.stageCode==="C49:UC_8JTBV2").length,
      pipe:money(ds),med:median(c)||0,medAge:median(ds.map(age))||0,medDw:median(ds.map(dwell))||0,stuck:ds.filter(d=>dwell(d)>30).length,early:earlyN[mgr]||0,cr,lr:(h.won+h.lost)?h.lost/(h.won+h.lost):null,closed:h.won+h.lost,won:h.won,lost:h.lost,wonMed:median(h.wc)||0};
  });
  const sk=S.ocSort||"pipe",asc=S.ocAsc?1:-1;
  mrows.sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*asc;});
  const crColor=r=>r==null?"var(--ink-4)":r>=0.4?"#2E9E74":r>=0.2?"#C2873C":"#CC5867";
  const lrColor=r=>r==null?"var(--ink-4)":r>=0.6?"#CC5867":r>=0.4?"#C2873C":"#2E9E74";
  const th=(k,t,tip)=>`<th data-ocsort="${k}" class="${S.ocSort===k?'sorted'+(S.ocAsc?' asc':''):''}" style="cursor:pointer;text-align:center;white-space:nowrap">${t}${tip?info(tip):""}</th>`;
  const head=`<tr><th style="text-align:left">Менеджер</th>${th("n","Горячих","Открытых сделок этого менеджера в 3 стадиях предложения")}<th style="text-align:center">КП·Реш·Долг</th>${th("pipe","Пайплайн ₽")}${th("med","Медиана чека")}${th("medAge","Ср. возраст","Медиана дней с создания сделки")}${th("medDw","В стадии, дн","Медиана дней в текущей стадии предложения - сколько оффер лежит без движения")}${th("stuck",">30 дн")}${th("early","Ранних","Открытые сделки этого менеджера в ранних стадиях (новая/квал/ТЗ/расчёт). Много ранних при зависших горячих = уводит фокус с тёплых.")}${th("cr","Выигр. %","Доля выигранных среди ЗАКРЫТЫХ сделок, прошедших предложение: выигранные ÷ (выигранные+проигранные). Открытые в базу не входят.")}${th("lr","Проигр. %","Доля проигранных среди закрытых, прошедших предложение: проигранные ÷ (выигранные+проигранные). Выигр.% + Проигр.% = 100%.")}${th("wonMed","Чек выигр.","Медиана чека выигранных сделок, прошедших предложение")}</tr>`;
  const body=mrows.map(r=>{
    const opn=!!(S.ocOpen&&S.ocOpen[r.mgr]);
    const neglect=r.medDw>=30&&r.early>r.n;

  document.addEventListener('click',e=>{if(S.calMgrOpen&&!e.target.closest('[data-calmgrdd]')){S.calMgrOpen=false;render();return;}const mb=e.target.closest('[data-calmgrbtn]');if(mb){S.calMgrOpen=!S.calMgrOpen;render();return;}const mo=e.target.closest('[data-calmgropt]');if(mo){S.calMgr=mo.dataset.calmgropt;S.calMgrOpen=false;S.calCell=null;S.calRowOpen={};S.calCupOpen=false;render();return;}const cu=e.target.closest('#calUnitSeg button');if(cu){S.calUnit=cu.dataset.cu;render();return;}const cm=e.target.closest('[data-calmgr]');if(cm){const k=cm.dataset.calmgr;S.calMgr=(S.calMgr===k)?'':k;S.calCell=null;S.calRowOpen={};render();return;}const wmm=e.target.closest('[data-calwipmode]');if(wmm){S.calWipMode=wmm.dataset.calwipmode;S.calRowOpen=S.calRowOpen||{};render();return;}const cr=e.target.closest('[data-calrow]');if(cr){const k=cr.dataset.calrow;S.calRowOpen=S.calRowOpen||{};S.calRowOpen[k]=!S.calRowOpen[k];render();return;}if(e.target.closest('[data-cupopen]')){S.calCupOpen=!S.calCupOpen;render();return;}const cc=e.target.closest('[data-calcell]');if(cc){const p=cc.dataset.calcell.split('|');S.calCell=(S.calCell&&S.calCell.s===p[0]&&S.calCell.k===p[1])?null:{s:p[0],k:p[1]};render();return;}if(e.target&&e.target.closest('[data-calcellclose]')){S.calCell=null;render();return;}});
  const _ac=document.getElementById('applyCustom');
  if(_ac)_ac.onclick=()=>{const a=document.getElementById('cf').value,b=document.getElementById('ct').value;if(a&&b&&a<=b){S.start=a;S.end=b;document.querySelectorAll('#period button').forEach(x=>x.classList.remove('on'));document.getElementById('periodLabel').textContent=S.start+' → '+S.end;render();}};
  document.getElementById('period').innerHTML=[['today','Сегодня'],['yest','Вчера'],['7','7 дн'],['30','30 дн'],['month','Месяц'],['60','60 дн'],['all','Всё']].map(p=>`<button data-p="${p[0]}" class="${p[0]==='month'?'on':''}">${p[1]}</button>`).join('');
  document.querySelectorAll('#period button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#period button').forEach(x=>x.classList.remove('on'));b.classList.add('on');setPeriod(b.dataset.p);render();});
  document.querySelectorAll('#gran button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#gran button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.gran=b.dataset.g;render();});
  const _dirSel=document.getElementById('dirSel');
  if(_dirSel){const _ord=['genglass','metal_gm','valonti','gentero','gen-group','не указано'];
    const _present=[...new Set([...AD,...AL].map(x=>x.dir).filter(Boolean))].sort((a,b)=>(_ord.indexOf(a)+1||99)-(_ord.indexOf(b)+1||99));
    _dirSel.innerHTML='<option value="">Все направления</option>'+_present.map(d=>`<option value="${d}"${S.fDir===d?' selected':''}>${DIRLAB[d]||d}</option>`).join('');
    _dirSel.onchange=()=>{S.fDir=_dirSel.value;render();};}
  // scroll-spy
  addEventListener('scroll',()=>{let cur=1;SECS.forEach((s,i)=>{const el=document.getElementById('sec'+(i+1));if(el&&el.getBoundingClientRect().top<160)cur=i+1;});document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));});
}
function fill(id,arr,allLabel,key){const el=document.getElementById(id);el.innerHTML=`<option value="">${allLabel}</option>`+arr.map(a=>`<option>${a}</option>`).join('');el.onchange=()=>{S[key]=el.value;render();};}
function setPeriod(p){
  if(p==='all'){S.start=DATA.from;S.end=DATA.to;}
  else if(p==='today'){S.start=S.end=DATA.to;}
  else if(p==='yest'){const e=new Date(DATA.to);e.setDate(e.getDate()-1);S.start=S.end=e.toISOString().slice(0,10);}
  else if(p==='month'){const t=DATA.to,y=+t.slice(0,4),m=+t.slice(5,7),pad=n=>String(n).padStart(2,'0'),ld=new Date(y,m,0).getDate();S.start=y+'-'+pad(m)+'-01';S.end=y+'-'+pad(m)+'-'+pad(ld);} // текущий месяц: 1-е -> последнее число (по DATA.to)
  else{const e=new Date(DATA.to);e.setDate(e.getDate()-(+p-1));S.start=e.toISOString().slice(0,10);S.end=DATA.to;} // n дней включая сегодня - окно совпадает с дашбордом производства
  document.getElementById('periodLabel').textContent=S.start+' → '+S.end;
  // Синхронизируем поля дат с выбранным периодом: на дефолтном «Месяце» сразу видны 1-е и последнее число.
  const _cf=document.getElementById('cf'),_ct=document.getElementById('ct');if(_cf)_cf.value=S.start;if(_ct)_ct.value=S.end;}
function freshStamp(){const el=document.getElementById('freshTag');if(!el)return;
  if(!DATA.generatedAt){el.textContent='';return;}
  const g=new Date(DATA.generatedAt),ageH=(new Date()-g)/36e5,p2=n=>String(n).padStart(2,'0');
  const m=new Date(g.getTime()+3*36e5); // показываем по Москве (UTC+3)
  const t=p2(m.getUTCDate())+'.'+p2(m.getUTCMonth()+1)+' '+p2(m.getUTCHours())+':'+p2(m.getUTCMinutes());
  let col='var(--accent)',pre='данные на';
  if(ageH>48){col='#F43F5E';pre='данные устарели, на';}else if(ageH>30){col='#F59E0B';pre='данные на';}
  // «сборка» показываем по времени ДАННЫХ (generatedAt), а не деплоя - чтобы метки были склеены
  // (сборка = данные) и не было «свежая сборка на старых данных». bakedAt остаётся для кэш-бастера.
  let bk='';if(DATA.generatedAt){const bb=new Date(new Date(DATA.generatedAt).getTime()+3*36e5);bk=' · сборка '+p2(bb.getUTCDate())+'.'+p2(bb.getUTCMonth()+1)+' '+p2(bb.getUTCHours())+':'+p2(bb.getUTCMinutes());}
  el.textContent=pre+' '+t+' МСК'+bk;el.style.color=col;}
function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9999;background:#0E2A22;color:#E6F0EA;border:1px solid #2E9E74;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:540px;text-align:center;opacity:0;transition:opacity .25s';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0';},6000);}
function parsePlanCSV(text){const num=s=>{s=(s||'').replace(/"/g,'').replace(/[^\d.,-]/g,'').replace(/\s/g,'');if(!s)return null;if(s.indexOf(',')>=0&&s.indexOf('.')<0)s=s.replace(',','.');else s=s.replace(/,/g,'');const v=parseFloat(s);return isNaN(v)?null:v;};
  const pc=s=>{const n=num(s);return n==null?null:(n>1.5?n/100:n);};
  const months=[];for(const line of text.split(/\r?\n/)){const c=line.split(',');const mm=(c[0]||'').replace(/"/g,'').trim();if(!/^\d{4}-\d{2}$/.test(mm))continue;const rev=num(c[1]);if(rev==null)continue;
    months.push({month:mm,rev:Math.round(rev),check:num(c[2])?Math.round(num(c[2])):null,cr2:pc(c[3]),cr1:pc(c[4]),leads:num(c[5])?Math.round(num(c[5])):null,deals:num(c[6])?Math.round(num(c[6])):null});}
  return months;}
async function refreshPlan(){const url=DATA.planCsv;if(!url){showToast('В сборке нет ссылки на таблицу плана');return;}
  showToast('Читаю таблицу плана...');
  try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
    const months=parsePlanCSV(await res.text());if(!months.length)throw new Error('строк-месяцев не найдено');
    DATA.plan=Object.assign({},DATA.plan||{},{months});render();
    showToast('План обновлён из таблицы: '+months.length+' мес');
  }catch(e){showToast('Не удалось прочитать таблицу онлайн ('+e.message+'). Нужно: файл сохранён как Google Таблица + доступ по ссылке. Иначе скажи мне - обновлю вручную.');}}
function wirePlanBtns(){const o=document.getElementById('planOpen');if(o)o.href=DATA.planUrl||'#';const r=document.getElementById('planRefresh');if(r)r.onclick=refreshPlan;}
setPeriod('month');buildShell();render();freshStamp();wirePlanBtns();
// Анти-кэш для боевого адреса /rop/: деплой кладёт рядом v.txt со штампом сборки.
// Проверяем при загрузке, при возврате на вкладку и раз в 15 минут: давно открытая
// вкладка тоже подтянет свежую сборку. Перезагрузка одна на версию (sessionStorage).
(function(){try{
  if(location.protocol==='file:'||!DATA.bakedAt)return;
  const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
    v=(v||'').trim();if(!v||v===DATA.bakedAt)return;
    if(v<DATA.bakedAt)return; // на сервере не новее нашей - не дёргаемся
    if(sessionStorage.getItem('_vchk')===v)return; // защита от цикла, если кэш упрямый
    sessionStorage.setItem('_vchk',v);location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }).catch(()=>{})};
  chk();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
  setInterval(chk,9e5);
}catch(e){}})();
</script></body></html>
