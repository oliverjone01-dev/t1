name: B24 calls result (менеджеры по 28 сделкам, read-only)

on:
  workflow_dispatch:
  push:
    branches: [rop-dashboard-v1]
    paths:
      - ".github/workflows/b24-calls-probe.yml"

permissions:
  contents: read

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ответственные по сделкам
        run: |
          set -uo pipefail
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then echo "::error::нет секрета"; exit 1; fi
          cat > /tmp/m.mjs <<'MJS'
          const base=(process.env.B24_WEBHOOK_URL||'').replace(/\/+$/,'');
          const call=async(m,p={})=>{const r=await fetch(`${base}/${m}.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j={};try{j=await r.json();}catch(e){j={error:'parse'};}return j;};
          const IDS=[72991,85573,90473,91033,96433,97309,97661,98029,98107,98141,82835,91047,96431,97017,97697,97751,97803,97825,98077,98087,85141,91433,95731,97483,92547,96763,97767,97115];
          (async()=>{
            const deals=(await call('crm.deal.list',{filter:{ID:IDS},select:['ID','ASSIGNED_BY_ID'],start:-1})).result||[];
            const uids=[...new Set(deals.map(d=>String(d.ASSIGNED_BY_ID)))];
            const users=(await call('user.get',{FILTER:{ID:uids}})).result||[];
            const nm={}; users.forEach(u=>nm[String(u.ID)]=[u.LAST_NAME,u.NAME].filter(Boolean).join(' ')||('id'+u.ID));
            const byId={}; deals.forEach(d=>byId[String(d.ID)]=nm[String(d.ASSIGNED_BY_ID)]||('id'+d.ASSIGNED_BY_ID));
            console.log('#сделка | ответственный');
            for(const id of IDS) console.log(`#${id} | ${byId[String(id)]||'не найдена'}`);
          })().catch(e=>console.log('FATAL',e&&e.message));
          MJS
          node /tmp/m.mjs
