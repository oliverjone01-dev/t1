<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENGLASS · Офис-менеджер · Квалификация лидов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0B0F15;--bg-card:#131820;--bg-elevated:#1A2029;--border:#1F2731;--border-soft:#161C24;--border-hot:#2B3441;
--ink:#F1F4F8;--ink-2:#A0AAB8;--ink-3:#6A7484;--ink-4:#3F4855;--accent:#22D3EE;--accent-deep:#0E7490;--accent-soft:rgba(34,211,238,.10);
--up:#10B981;--dn:#F43F5E;--warn:#F59E0B;--info:#A78BFA;--radius:10px;--radius-lg:14px;--ease-out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{background:radial-gradient(ellipse 60% 40% at 50% -8%,rgba(34,211,238,.05),transparent 70%),var(--bg-base);color:var(--ink);font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:clip}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.topbar{position:sticky;top:0;z-index:60;padding:11px 24px;border-bottom:1px solid var(--border-soft);background:rgba(11,15,21,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;color:#06121a;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.35)}
.brand b{font-family:'Manrope';font-weight:800;font-size:14px}.brand span{display:block;font-size:10.5px;color:var(--ink-3)}
.tb-spacer{flex:1}
.controls{position:sticky;top:55px;z-index:50;padding:10px 24px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(19,24,32,.92);backdrop-filter:blur(16px)}
.ctl-lbl{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;margin-right:-7px}
select{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;max-width:230px}
.seg{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-3);font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
input[type=date]{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:5px 8px;font:inherit;font-size:11.5px}
.plan-inp{background:var(--bg-elevated);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700;width:64px;font-variant-numeric:tabular-nums}
.plan-inp:focus{outline:none;border-color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:8px 24px 70px}
.sec-div{display:flex;align-items:center;gap:14px;margin:26px 0 14px}
.sec-div:first-child{margin-top:14px}
.sec-num{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:14px;flex-shrink:0}
.sec-div h2{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.sec-div .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border-hot),transparent)}
.sec-div .hint{font-size:11px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:14px;margin-bottom:14px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;animation:fadeUp .4s var(--ease-out) both;display:flex;flex-direction:column;align-items:center;text-align:center}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac,var(--accent)),transparent)}
.kpi .k{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.kpi .v{font-family:'Manrope';font-weight:800;font-size:25px;letter-spacing:-.025em;line-height:1}
.kpi .v .u{font-size:12px;color:var(--ink-3);font-weight:600;margin-left:3px}
.kpi .sub{font-size:10px;color:var(--ink-3);margin-top:6px;flex:1}
.kpi .trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;margin-top:8px;padding:2px 7px;border-radius:6px}
.trend.up{color:var(--up);background:rgba(16,185,129,.12)}.trend.dn{color:var(--dn);background:rgba(244,63,94,.12)}.trend.flat{color:var(--ink-3);background:var(--bg-elevated)}
.now-badge{font-size:8.5px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.5);color:var(--warn);border-radius:5px;padding:1px 5px;font-weight:700;margin-left:6px;vertical-align:2px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px;animation:fadeUp .45s var(--ease-out) both}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;gap:16px;flex-wrap:wrap}
.card-title{font-family:'Manrope';font-weight:700;font-size:15px;margin-bottom:2px}
.card-sub{font-size:11px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tbl tr:last-child td{border-bottom:none}
.fbar{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.fbar .fl{width:190px;font-size:11.5px;color:var(--ink-2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .ft{flex:1;height:24px;background:var(--bg-elevated);border-radius:6px;overflow:hidden}
.fbar .ff{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#06121a;transform-origin:left;animation:grow .8s var(--ease-out) both;white-space:nowrap}
.fbar .fv{width:150px;font-size:11px;color:var(--ink-3);flex-shrink:0}.fbar .fv b{color:var(--ink);font-weight:700}
.note{font-size:11.5px;color:var(--ink-2);background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 13px;margin-bottom:14px;line-height:1.5}
.reco{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;border:1px solid}
.qm{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-hot);color:var(--ink-3);font-size:9px;align-items:center;justify-content:center;cursor:help;vertical-align:1px;margin-left:5px}
#tip{position:fixed;z-index:99;background:#0d1219;border:1px solid var(--border-hot);border-radius:9px;padding:10px 13px;font-size:11.5px;color:var(--ink-2);pointer-events:none;opacity:0;transition:opacity .12s;max-width:340px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
#tip .tl{font-weight:700;color:var(--ink);margin-bottom:5px;font-size:12px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;margin:2px 0}#tip .tr span:last-child{font-weight:700;color:var(--ink);white-space:nowrap}
#tip .tn{margin-top:6px;padding-top:6px;border-top:1px solid var(--border-soft);color:var(--ink-3);line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:7px 13px;margin-top:10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.foot{text-align:center;color:var(--ink-4);font-size:11px;margin-top:28px}
.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#2e3947 var(--bg-base)}
.scroll::-webkit-scrollbar{width:9px;height:9px}.scroll::-webkit-scrollbar-track{background:var(--bg-base)}.scroll::-webkit-scrollbar-thumb{background:#2e3947;border-radius:5px}
.gauge-wrap{display:flex;gap:14px;flex-wrap:wrap}
.gauge{flex:1;min-width:210px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px 10px;text-align:center}
.gauge h4{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.gauge .gnote{font-size:10.5px;color:var(--ink-3);margin-top:2px}.gauge .gnote b{color:var(--ink-2)}
</style></head><body>
<div class="topbar"><div class="logo">GG</div><div class="brand"><b>GENGLASS · Офис-менеджер</b><span>личный дашборд квалификации лидов · воронка GG · <span id="fresh"></span></span></div>
<div class="tb-spacer"></div><span class="ctl-lbl">Менеджер</span><select id="mgrSel"></select></div>
<div class="controls">
  <span class="ctl-lbl">Период</span><div class="seg" id="presetSeg"><button data-p="1">Сегодня</button><button data-p="7">7 дн</button><button data-p="30" class="on">30 дн</button><button data-p="all">Всё</button></div>
  <input type="date" id="dFrom"><span style="color:var(--ink-4)">-</span><input type="date" id="dTo"><button id="applyCustom" class="seg" style="padding:6px 12px;color:var(--accent);cursor:pointer;border:1px solid var(--border);background:var(--bg-elevated);border-radius:8px;font:inherit;font-size:11.5px">OK</button>
  <span style="flex:1"></span>
  <span class="ctl-lbl">План/день: разбор</span><input type="number" min="1" class="plan-inp" id="planRz">
  <span class="ctl-lbl">квал-лиды</span><input type="number" min="1" class="plan-inp" id="planKv">
  <span class="qm" data-tip="Личный план на РАБОЧИЙ день: сколько лидов разобрать (закрыть: квалифицировать или отсеять) и сколько квал-лидов передать (лид дошёл до «Создание сделки»). План на период = план/день × рабочих дней (пн-пт). Сохраняется в этом браузере.">?</span>
  <span id="periodLabel" style="font-size:11.5px;color:var(--ink-3)"></span>
</div>
<div class="wrap" id="root"></div>
<div id="tip"></div>
<script>
const DATA={};
/* ===== базовые помощники ===== */
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const d1=n=>(Math.round(n*10)/10).toLocaleString('ru-RU');
const pct=x=>(x*100).toFixed(x*100>=10?0:1).replace('.',',')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const attr=s=>String(s).replace(/"/g,'&quot;');
const info=t=>`<span class="qm" data-tip="${attr(t)}">?</span>`;
const med=a=>{a=a.filter(x=>x!=null).sort((p,q)=>p-q);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const DAYMS=864e5;
const iso=d=>d.toISOString().slice(0,10);
const D=s=>s?new Date(s+'T00:00:00+03:00'):null;
const days=(a,b)=>a&&b?Math.round((D(b)-D(a))/DAYMS):null;
const dm=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
/* «сегодня» = дата снимка данных (МСК) - живём по данным, не по часам браузера */
const GEN=DATA.generatedAt?new Date(DATA.generatedAt):new Date();
const TODAY=iso(new Date(GEN.getTime()+3*36e5));
const YESTER=iso(new Date(GEN.getTime()+3*36e5-DAYMS));
/* ===== GG-поток: без GM ===== */
const GM_M=new Set(['Виктория Преснякова','Денис Белов','Юлия Мавлина','Системный пользователь MGM']);
const GG=DATA.leads.filter(l=>l.dir!=='metal_gm'&&!GM_M.has(l.mgr));
const OPEN=l=>!l.closed&&!l.conv&&!l.junk;
const MIND=GG.reduce((m,l)=>l.created&&l.created<m?l.created:m,TODAY);
/* менеджеры-разборщики: у кого есть закрытые лиды за последние 90 дней */
const _cut90=iso(new Date(D(TODAY)-90*DAYMS));
const _mc={};GG.forEach(l=>{if(l.closed&&l.closed>=_cut90)_mc[l.mgr]=(_mc[l.mgr]||0)+1});
const MGRS=Object.entries(_mc).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,20);
if(!MGRS.includes('Анна Турченко')&&GG.some(l=>l.mgr==='Анна Турченко'))MGRS.unshift('Анна Турченко');
/* ===== состояние ===== */
const PLANLS='officePlanGG';
let PLAN={rz:10,kv:3};try{PLAN=Object.assign(PLAN,JSON.parse(localStorage.getItem(PLANLS)||'{}'))}catch(e){}
let S={mgr:MGRS.includes('Анна Турченко')?'Анна Турченко':(MGRS[0]||'—'),from:'',to:'',preset:'30'};
function setPeriod(p){const e=D(TODAY);if(p==='all'){S.from=MIND;S.to=TODAY}else{const s=new Date(e.getTime());s.setDate(s.getDate()-(+p-1));S.from=iso(s);S.to=TODAY}S.preset=p}
const workdays=(a,b)=>{let n=0;for(let d=D(a);d<=D(b);d=new Date(d.getTime()+DAYMS)){const w=d.getDay();if(w!==0&&w!==6)n++}return Math.max(n,1)};
/* ===== графика ===== */
function chart(series,keys,opt){opt=opt||{};const w=opt.w||640,h=opt.h||200,pl=40,pr=10,pt=12,pb=24;
  let mx=0;series.forEach(s=>s.vals.forEach(v=>{if(v!=null&&v>mx)mx=v}));mx=mx*1.15||1;
  const n=keys.length,X=i=>pl+(w-pl-pr)*(n>1?i/(n-1):.5),Y=v=>h-pb-(h-pt-pb)*v/mx;
  let grid='';for(let g=0;g<=3;g++){const yy=pt+(h-pt-pb)*g/3;grid+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--border)"/><text x="${pl-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--ink-4)">${fmt(mx*(1-g/3))}</text>`}
  let xl='';const step=Math.ceil(n/9);keys.forEach((k,i)=>{if(i%step===0||i===n-1)xl+=`<text x="${X(i)}" y="${h-pb+14}" text-anchor="middle" font-size="9" fill="var(--ink-4)">${dm(k)}</text>`});
  let body='';const oneB=n===1;const bars=series.filter(s=>s.bar||oneB);
  series.forEach(s=>{
    if(s.bar||oneB){const nb=bars.length||1,bi=bars.indexOf(s),slot=oneB?Math.min(120,40*nb):Math.max(3,(w-pl-pr)/(n*1.4)),bw=Math.max(2.5,slot/nb);
      body+=s.vals.map((v,i)=>!v?'':`<rect x="${(X(i)-slot/2+bi*bw).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-pb-Y(v)).toFixed(1)}" rx="2" fill="${s.c}" opacity="${s.op!=null?s.op:.8}" pointer-events="none"/>`+(oneB?`<text x="${(X(i)-slot/2+bi*bw+bw/2).toFixed(1)}" y="${(Y(v)-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${s.c}">${fmt(v)}</text>`:'')).join('')}
    else{const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
      if(pts.length>1){let d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
        if(s.area)body+=`<path d="${d} L${pts[pts.length-1][0].toFixed(1)} ${h-pb} L${pts[0][0].toFixed(1)} ${h-pb} Z" fill="${s.c}" opacity=".08" pointer-events="none"/>`;
        body+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`}
      body+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${s.c}" pointer-events="none"/>`).join('')}});
  /* колонки-ховеры с подсказкой по дню */
  const bw2=(w-pl-pr)/(n-1||1);let cols='';
  keys.forEach((k,i)=>{const rows=series.map(s=>`<div class='tr'><span>${s.name}</span><span>${s.vals[i]!=null?fmt(s.vals[i]):'—'}</span></div>`).join('');
    const extra=opt.tipExtra?opt.tipExtra(i):'';
    cols+=`<rect x="${(X(i)-bw2/2).toFixed(1)}" y="${pt}" width="${bw2.toFixed(1)}" height="${h-pt-pb}" fill="transparent" data-tip="${attr(`<div class='tl'>${dm(k)}</div>${rows}${extra}`)}"/>`});
  const legend=`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.name}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${grid}${body}${cols}${xl}</svg>`+legend}
function donut(rows,center,label){const tot=rows.reduce((s,r)=>s+r[1],0)||1;let a0=-90,segs='';
  const R=52,C=64;rows.forEach(r=>{const frac=r[1]/tot;if(frac<=0)return;const an=Math.min(frac*360,359.98);
    const a1=a0+an,rad=x=>x*Math.PI/180,x0=C+R*Math.cos(rad(a0)),y0=C+R*Math.sin(rad(a0)),x1=C+R*Math.cos(rad(a1)),y1=C+R*Math.sin(rad(a1));
    segs+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${an>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${r[2]}" stroke-width="15" data-tip="${attr(`<div class='tl'>${esc(r[0])}</div><div class='tr'><span>Кол-во</span><span>${fmt(r[1])}</span></div><div class='tr'><span>Доля</span><span>${pct(r[1]/tot)}</span></div>`)}"/>`;a0=a1});
  return `<div style="display:flex;gap:16px;align-items:center"><svg viewBox="0 0 128 128" style="width:128px;flex-shrink:0">${segs}<text x="64" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Manrope">${center}</text><text x="64" y="76" text-anchor="middle" font-size="8" fill="var(--ink-3)" style="text-transform:uppercase;letter-spacing:.05em">${label}</text></svg>
  <div style="flex:1;min-width:0">${rows.map(r=>{const p=r[1]/tot;return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><i style="width:9px;height:9px;border-radius:2px;background:${r[2]};flex-shrink:0"></i><span style="flex:1;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r[0])}</span><b style="font-size:11.5px">${fmt(r[1])}</b><span style="width:40px;text-align:right;font-size:10.5px;color:var(--ink-3)">${pct(p)}</span></div>`}).join('')}</div></div>`}
function gauge(title,fact,plan,unit,noteTxt){const p=plan>0?fact/plan:null;const col=p==null?'#5a6672':p>=1?'var(--up)':p>=.7?'var(--warn)':'var(--dn)';
  const R=46,C=60,a=p==null?0:Math.min(p,1)*180,rad=x=>(x-180)*Math.PI/180;
  const x0=C+R*Math.cos(rad(0)),y0=C+R*Math.sin(rad(0)),x1=C+R*Math.cos(rad(a)),y1=C+R*Math.sin(rad(a));
  const arc=a>0?`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${a>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`:'';
  return `<div class="gauge"><h4>${title}</h4><svg viewBox="0 0 120 68" style="width:150px;max-width:100%">
    <path d="M14 60 A46 46 0 0 1 106 60" fill="none" stroke="var(--border)" stroke-width="11" stroke-linecap="round"/>${arc}
    <text x="60" y="52" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)" font-family="Manrope">${p==null?'—':pct(p)}</text></svg>
    <div class="gnote"><b>${fmt(fact)}</b> из <b>${fmt(plan)}</b> ${unit}${noteTxt?' · '+noteTxt:''}</div></div>`}
const trend=(cur,prev,inv)=>{if(prev==null||!isFinite(prev)||prev===0)return cur>0?`<span class="trend up">▲ новый</span>`:`<span class="trend flat">—</span>`;
