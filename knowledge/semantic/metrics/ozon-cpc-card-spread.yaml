# OZON: реклама за клик, разнесённая на объединённую карточку (новая вкладка, handoff v14).
id: ozon-cpc-card-spread
title: "Реклама за клик (CPC) по заказам с разнесением на всю объединённую карточку"
version: 1
status: superseded   # 01.10: Иван прислал отчёты продвижения с листом Union, база разнесения - атрибуция OZON, см. knowledge/semantic/probes/ozon-promo-union-report.md
owner: "Иван Раюшкин"
approved_at: ""
decision: >
  Видеть реальную рекламную нагрузку и прибыль заказа с учётом того, что клик по рекламируемому
  артикулу продаёт соседей по объединённой карточке. Решаем: какие карточки окупают рекламу за клик,
  где реклама кормит соседний артикул, а не тот, на который включена.
good_direction: "не применимо (разнесение расхода; итог расхода не меняется)"
entity: "заказ (posting) в периоде"
key: [order]
type: derived
formula_text: >
  Карточка товара = main из data/card_groups.json (снимок кабинета 23.09); товар вне карточек - сам себе карточка.
  Пул = расход CPC кампании по товарам карточки за дни периода [с, по] (data/ads_sku_daily.ndjson, поле sp).
  Окно пула (вопрос 1, рекомендую вариант Б) = дни действия кампании внутри периода: с первого по последний день с расходом.
  Пул делится на заказы ВСЕХ товаров карточки, оформленные в окне, пропорционально штукам (решение 1б);
  остаток копеек - на последний заказ (как функция spread на «Деньгах»).
  Нет штук в окне (вопрос 2, рекомендую) -> на заказы карточки за весь период по штукам; нет и их -> строка «Общие расходы», как на «Деньгах».
  Реклама заказа = CPO по номеру заказа (как на «Деньгах», не меняется) + сумма долей CPC.
  Остальные колонки таблицы - ровно как в «Аналитике по заказам» на «Деньгах»; «К выплате» и прибыль уменьшаются на разнесённую рекламу.
code_module: "analytics-mvp/src/scripts/build-katya.ts (функция spread блока «Аналитика по заказам», вариант с карточкой; модуль уточняется после подписи)"
ratio:
  numerator: "ДРР карточки = её реклама (CPC разнесённый + CPO)"
  denominator: "выручка заказов всех товаров той же карточки за тот же период по дате заказа"
  same_entity: true
  same_date_field: true
  invariant: "сумма CPC по заказам + CPC в «Общих» = сумма sp в ads_sku_daily за период"
filters:
  include_statuses: [delivered, delivering, awaiting_deliver, client_arbitration]
  exclude: ["отменённые заказы: в веса не входят (0 штук), строки с расходами - как на «Деньгах»"]
cancellations_returns:
  mode: "net по отменам (решение 2 да): заказано минус отмены"
  return_date_basis: order_date
date_field: "created (дата заказа, orders_daily.d); расход - дата клика (ads_sku_daily.d)"
mode: period
conversion_window_days: null
cohort_maturity_rule: ""
timezone: Europe/Moscow
interval: "[с, по] - фильтр периодов вкладки «Деньги» (решение 4)"
partial_period: mark
additive_over_time: false   # при варианте Б окно режется периодом: сумма по двум половинам месяца != месяц по заказу
accounting_basis: "order date"
empty_value: "null: кампания без расхода в периоде не даёт строк; заказ без доли CPC = 0 только если пул карточки в его окно пуст"
source:
  endpoint: "data/ads_sku_daily.ndjson (Performance API, sku x кампания x день), data/card_groups.json (кабинет, list-by-filter), data/orders_daily.ndjson (postings)"
  fields: [d, cid, sku, sp, "groups[].main", "groups[].skus[].sku", order, status, units]
  limits: "ads_sku_daily 03.07-29.09; состав карточек только на 23.09 (498 товаров в файле при declared 866 - часть товаров карточек в снимок не попала)"
  latency: "ads_sku_daily - ежедневный сборщик; card_groups - разовый снимок"
  lookback_days: null
reconciliation:
  against_family: "documents"
  document: "отчёт о расходах на продвижение из кабинета за закрытый месяц (сумма «Оплата за клик»), сверка итога CPC за месяц; разнесение по карточке сверке не подлежит - это модель, а не факт"
  tolerance: "0.01"
inference_rules:
  min_n: null
  mde: null
  causal_claims: "forbidden_without_control: разнесение не доказывает, что клик продал соседа"
