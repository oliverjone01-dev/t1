name: Update OZON snapshots

# Дёргает n8n-вебхуки (ключи OZON живут в n8n), обновляет фикстуры и дневную
# историю, пересобирает сайт и коммитит. Самодостаточен: историю тянет вебхуком,
# не зависит от sync.yml. Каждый снимок валидируется ДО замены фикстуры (FENIX G2/G3).

on:
  schedule:
    - cron: "30 5 * * *" # ~08:30 МСК
  workflow_dispatch: {}

concurrency:
  group: ozon-data # общий с sync.yml - не гонимся за push (FENIX G5)
  cancel-in-progress: false

permissions:
  contents: write

env:
  N8N: https://gen-group.app.n8n.cloud/webhook

jobs:
  snapshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-mvp
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      # Токен-заголовок готов под авторизацию вебхуков (FENIX G1). Пока вебхуки
      # открыты - заголовок безвреден; после включения header-auth заработает.
      - name: Snapshots (validate before replace)
        run: |
          set -euo pipefail
          AUTH=(-H "Content-Type: application/json" -H "X-Auth: ${N8N_TOKEN:-}")
          FROM=$(date -u -d "29 days ago" +%F); TO=$(date -u -d "yesterday" +%F); Y=$(date -u -d "yesterday" +%F)

          fetch () { # url, body, type, dest
            local url="$1" body="$2" type="$3" dest="$4" tmp; tmp=$(mktemp)
            curl -sS --fail-with-body --max-time 90 -X POST "$N8N/$url" "${AUTH[@]}" -d "$body" -o "$tmp" \
              || { echo "curl $url failed"; exit 1; }
            npx tsx src/scripts/validate-snapshot.ts "$type" "$tmp"
            mv "$tmp" "$dest"
          }

          fetch gengroup-ozon-skus '{"days":30}' skus fixtures/skus_live_30d.json
          fetch gengroup-ozon-ads  '{"days":30}' ads  fixtures/ads_30d.json
          fetch gengroup-ozon-pnl  "{\"dateFrom\":\"$FROM\",\"dateTo\":\"$TO\"}" pnl /tmp/pnl_raw.json
          npx tsx src/scripts/snapshot-pnl.ts /tmp/pnl_raw.json
          # per-SKU транзакции (маржа после сборов)
          curl -sS --fail-with-body --max-time 90 -X POST "$N8N/gengroup-ozon-pnl-sku" "${AUTH[@]}" \
            -d "{\"dateFrom\":\"$FROM\",\"dateTo\":\"$TO\"}" -o /tmp/pnlsku.json
          npx tsx src/scripts/validate-snapshot.ts pnlsku /tmp/pnlsku.json
          mv /tmp/pnlsku.json fixtures/pnl_sku_30d.json

          # Дневная история: догружаем ВСЕ недостающие дни от последнего в истории до вчера.
          # Самовосстановление после любого простоя синка (раньше тянули только вчера -> дыры).
          LAST=$(node -e "let m='';for(const l of require('fs').readFileSync('data/history.ndjson','utf8').trim().split('\n')){try{const d=JSON.parse(l).date;if(d>m)m=d;}catch(e){}}console.log(m||'2026-02-05');")
          cur=$(date -u -d "$LAST +1 day" +%F)
          BEFORE=$(wc -l < data/history.ndjson)
          while [ "${cur//-/}" -le "${Y//-/}" ]; do
            echo "догрузка дня $cur"
            curl -sS --fail-with-body --max-time 90 -X POST "$N8N/gengroup-ozon-daily" "${AUTH[@]}" \
              -d "{\"dateFrom\":\"$cur\",\"dateTo\":\"$cur\"}" -o /tmp/daily.json || { echo "curl daily $cur failed"; exit 1; }
            npx tsx src/scripts/validate-snapshot.ts daily /tmp/daily.json
            npm run ingest -- /tmp/daily.json
            cur=$(date -u -d "$cur +1 day" +%F)
          done
          AFTER=$(wc -l < data/history.ndjson)
          if [ "$AFTER" -lt "$BEFORE" ]; then echo "history сократилась $BEFORE->$AFTER"; exit 1; fi
        env:
          N8N_TOKEN: ${{ secrets.N8N_TOKEN }}

      - name: Rejoin cogs and rebuild
        run: |
          set -euo pipefail
          npm run join:cogs
          npm run build:site

      - name: Commit (pull --rebase, retry)
        working-directory: .
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Стейджим ВСЁ под analytics-mvp (сборка трогает файлы вне старого списка add;
          # *.db в .gitignore) - иначе остаются unstaged changes и pull --rebase падает.
          git add -A analytics-mvp
          if git diff --staged --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "data: ежедневное обновление снимков OZON $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((2**i))
          done
          echo "push не удался после ретраев"; exit 1
