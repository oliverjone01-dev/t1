# OZON: реклама за клик по атрибуции OZON (свой товар / соседи по объединённой карточке). Заменяет ozon-cpc-card-spread v1.
id: ozon-cpc-card-spread
title: "Реклама за клик, разнесённая по атрибуции OZON на рекламируемый товар и соседей по объединённой карточке"
version: 2.4
status: approved   # v2.4 (14.10, ФЕНИКС N8-N10, O3, G1-G5): Иван 14.10 «по всем да и мерж»; v2.3 - Иван 13.10 «все да»: подпись v2.2 + источник CPO во втором блоке как у «Отчета»; разнесение CPC то же, что в v2
owner: "Иван Раюшкин"
approved_at: "2026-10-14"   # v2: Иван 01.10 «1 отменённый 2 да 3 да»; v2.2 и v2.3: Иван 13.10 «все да»; v2.4: Иван 14.10 «по всем да и мерж» (decisions.md 13.10, 14.10)
decision: "Какие товары реально продаёт реклама за клик: сам рекламируемый или соседи по карточке; прибыль заказа с честной рекламой."
good_direction: "не применимо (итог расхода не меняется)"
entity: "заказ (posting) в периоде"
key: [order]
type: derived
formula_text: >
  1) Пара = рекламируемый товар x кампания x месяц. Расход пары по дням - data/ads_sku_daily.ndjson (sp), как на «Деньгах».
  2) Доли пары за месяц из атрибуции OZON (data/ads_attr_daily.ndjson): свои штуки (sold) и штуки соседей (soldM) по дням.
  3) Какой сосед: для дня с soldM ищем заказы товаров той же объединённой карточки (data/card_groups.json) в тот же день,
     у которых штуки = soldM и сумма = omM (допуск 1%). Проверка на отчётах кабинета март-июль (лист Union): 21 совпадение из 22.
  4) Расход пары делится по штукам (решение 1 шт): своя доля - на заказы рекламируемого товара за период по штукам (как на «Деньгах»),
     доля каждого найденного соседа - прямо на найденный заказ.
  5) Остаётся на рекламируемом товаре (решение 2): расход пары без продаж; доля соседа, которого не нашли; пары без атрибуции в API.
     Рекламируемый товар без заказов в периоде - строка «Общие расходы», как на «Деньгах».
  6) Доли месяца применяются к дневному расходу, поэтому фильтр периодов работает как на «Деньгах». «Деньги» не меняются (решение 3).
campaign_breakdown: >
  v2.2 (Иван 02.10 «1а» и правки 8730cf3; ФЕНИКС 13.10 G5): строка кампании CPC раскрывается на: основная карточка (свои шт и
  выручка атрибуции; расход = доля по штукам + дни с атрибуцией без продаж + остаток «итог кампании минус части», остаток кладётся
  в SKU с наибольшей своей долей); объединённая карточка по каждому найденному соседу; сосед не найден; одна жёлтая строка
  «Нет данных: продажи без разбивки на свою и соседа» (выручка и шт = итог кампании минус разложенное выше, расход = дни без
  атрибуции в сборе + кампании вне сбора, ДРР не считается). Отрицательный остаток (статистика кампании меньше отчётов по SKU)
  снимается сначала с жёлтой строки (сумма расхода дней без атрибуции и кампаний вне сбора по всем SKU кампании), потом с
  основной карточки: с SKU с наибольшей своей долей, если её хватает, иначе с любого SKU, чьей своей доли хватает; нет такого -
  с самой большой строки соседа, если её хватает; иначе остаток в основную карточку (итог важнее знака); инвариант:
  подстроки = итог кампании по расходу, выручке и шт, «Основная карточка» не отрицательна. «Маркетинг» не меняется.
  Эталон: 37007560 сентябрь - 3 своих, соседи 2+1+1, 1 не найден, выручка частей 471 198 = итог кампании; 37007560 01-12.10 -
  итог 15 703, соседи 7 854 + 7 850 (минус 4 снят с соседа), основная 0.
cpo_second_block: >
  Кампания «Оплата за заказ» (Иван 02.10, 13.10 «все да»): без раскрытия. Выручка и шт - функция cpoOrdersByDay
  (src/scripts/cpo-orders-rev.ts), одна на «Отчет» и эту вкладку: заказы из выгрузки кабинета data/cpo_orders.ndjson, выручка
  и шт = отправления этих заказов в orders_daily (Seller API) без отменённых, день = самая ранняя дата отправлений заказа (дата
  заказа; v2.4, ФЕНИКС O3: раньше - первое отправление по порядку файла, на данных 14.10 у всех 1009 заказов одно и то же). Июнь 16 068 798 / 301 шт, июль 13 146 239 / 221, август 14 072 386 / 214, сентябрь 14 073 867 / 178 - на обеих
  вкладках. Расход - из Performance API как был. ДРР = расход API только за дни окна выгрузки (cpo_sku_daily, сборка 14.10:
  выгрузка 2026-06-05..2026-09-30, окно 2026-06-01..2026-09-30) / выручка; период шире покрытия - «N из M дн.» в ячейке, за остальные дни выручка неизвестна.
  Своя xlsx-выгрузка вкладки и её конвертер (v2.2) убраны; присланные xlsx остаются в data/raw/ozon-cpo/.
  Кампания выгрузки (ФЕНИКС N5, N8; функция cpoExportCampaign, одна на «Отчет» и вкладку): при сборке - только среди
  кампаний «Оплата за заказ» по camp_meta (ads_30d, ads_periods) та, чей расход API за дни выгрузки ближе всего к списаниям
  выгрузки, считая ВСЕ списания выгрузки, в том числе заказы, которых ещё нет в orders_daily (G1). Ошибка выгрузки сборку не
  роняет (Иван 14.10, ФЕНИКС G3: падение сборки OZON останавливало публикацию всего сайта): выручка «за заказ» на вкладке и
  «Отчете» - «нет данных», красная плашка с причиной, строка ::error:: в логе CI. Ошибки: файл выгрузки или покрытия не
  разбирается; есть списания, а покрытие cpo_sku_daily пустое (G2); заказы выгрузки ещё не пришли в orders_daily (G1);
  нет кампании «за заказ» в допуске 1%. Сборка 14.10: 28753239, 4 323 199 против 4 323 199 за 05.06-30.09. Выручка ставится на неё; если её нет среди кампаний периода - на первую кампанию «за заказ»
  периода (запасной путь, cpoRevFix). Окно ДРР (N6, N9): с 1-го числа месяца начала выгрузки, если у кампании выгрузки нет
  расхода API с 1-го числа до начала выгрузки (июнь: 0 ₽ за 01-04.06), иначе с начала выгрузки; то же правило - покрытие
  на «Отчете» (cpoCov: период пересекает выгрузку и у кампании выгрузки нет расхода API в днях периода вне выгрузки).
  Обновление выгрузки (ФЕНИКС N7, v2.4): (1) xlsx кабинета «Оплата за заказ (все товары). Отчёт по заказам» со строкой
  «Период: дд.мм.гггг - дд.мм.гггг» положить в data/raw/ozon-cpo/ (решение 13.10) и копией в tools/cpo/raw/ (вне git) под
  именем YYYY-MM_cpo_orders.xlsx (G4): повтор месяца перезаписывает тот же файл; второе скачивание браузера «... (1).xlsx»
  читается после оригинала и побеждает его;
  (2) python3 tools/orders/build_order_joins.py --cpo-only -> data/cpo_orders.ndjson; (3) python3 tools/cpo/build_cpo_sku_daily.py
  -> data/cpo_sku_daily.ndjson (покрытие); (4) сборка build-katya: в логе «кампания выгрузки ... расход API против списаний» и
  «окно ...»; ошибка - красная плашка и ::error::. Оба сборщика читают выгрузки одним модулем tools/cpo/cpo_raw.py: внутри
  сырья каждый файл заменяет свой «Период:», при пересечении побеждает поздний по имени (повтор месяца не удваивает
  списания: tools/tests/cpo_raw_check.py, реальный сентябрь дважды - 818 149); файл без «Период:», строка вне периода или
  заказ без даты - отказ с кодом 1. С прошлым выходом оба сборщика сливаются по ОКНУ периода (G5): cpo_sku_daily - строки
  (SKU, день), cpo_orders - строки (заказ, день) с 14.10; строки окна новой выгрузки пишутся заново целиком, вне окна
  остаются. Заказ, пропавший из повторной выгрузки, уходит; заказ на стыке месяцев хранит обе части (80 за 31.08 + 20 за
  01.09). Строки cpo_orders, собранные до 14.10, дня не имеют: они заменяются по номеру заказа, если он есть в новом сырье.
note_vs_money: >
  Плашка #cpc-note называет сумму, на которую ИТОГО «Реклама» больше, а «Прочие» строки «Общие расходы» меньше, чем на «Деньгах»:
  CPC товаров без заказов в периоде, чья доля соседа села на заказ соседа (Иван 13.10, ФЕНИКС G3). «К выплате» = «Деньгам».
  Эталон: 01-15.09 8 352 ₽, июль 49 506 ₽, сентябрь целиком 0.
code_module: "analytics-mvp/src/scripts/build-katya.ts - новая страница; блок «Аналитика по заказам» на «Деньгах» побайтно тот же (инвариант сборки)"
filters:
  include_statuses: [delivered, delivering, awaiting_deliver, client_arbitration]
  exclude: ["в веса «своей» доли отменённые не входят; найденный сосед-заказ, который потом отменён, получает свою долю на строку отменённого заказа (Иван 01.10, п.1)"]
cancellations_returns:
  mode: "net по отменам (решение 2 да от 01.10)"
  return_date_basis: order_date
date_field: "расход - дата клика; доли - месяц атрибуции; сосед - дата заказа = дата атрибуции"
mode: period
timezone: Europe/Moscow
interval: "[с, по] - фильтр периодов как на «Деньгах»"
partial_period: mark
additive_over_time: true
empty_value: "нет атрибуции = расход на рекламируемом товаре с пометкой, не 0"
source:
  endpoint: "OZON Performance: statistics/daily/json по SKU (ads_sku_daily), attribution-отчёт по кампании (ads_attr_daily: sold, om, soldM, omM); orders_daily; card_groups"
  limits: "attribution-отчёт отдаёт соседей только итогом (проба 01.10, кампания 40047060, без разбивки по соседу); сборщик берёт не все кампании и не все дни: покрытие по парам август 80%, сентябрь 94%; покрытие ПО ДНЯМ (CPC в днях со строкой атрибуции) август 46,4%, сентябрь 86,8% - на странице показывается за период"
  coverage_display: "плашка #cpc-note: покрытие по дням в %, «без продаж» разделено на «без продаж в дни с атрибуцией» и «дни без атрибуции в нашем сборе», доля соседей в днях без атрибуции помечена оценкой; разнесение денег не меняется (решение 2)"
reconciliation:
  against_family: "documents (выгрузка кабинета с листом Union)"
  document: "отчёты продвижения март-июль 2026, присланы 01.10 (в репо не кладём, решение 5)"
  tolerance: "сосед: совпадение SKU; доли: штуки"
