id: ozon-cabinet-funnel-delivery
version: 1
title: Доставка разрешённых показателей кабинета в существующие расчёты
status: implementation_of_existing_contracts
authorization: 'Иван: «ты должен разнести данные по всему дашборду а не в одно место»; публичная публикация текущего среза и таких же плановых срезов разрешена 29.10.2026.'
scope: 'Перенос штатных счётчиков и позиции. Новые денежные определения и новые формулы экспериментов не вводятся.'
source: ozon-native-daily-product-report
public_file: analytics-mvp/data/cabinet_capture.json
key: [source_day, sku]
scheme: 'Схема сохраняется в исходном файле. Несколько схем одного SKU блокируют интеграцию до определения оценщика позиции.'
date_field: 'J: День штатного отчёта; не дата скачивания'
mode: period
timezone: Europe/Moscow
interval: '[from, to), интерфейс отображает включительные даты'
cancellations_returns: 'ordered_units — исходное «Заказано товаров», без вычитания отмен и возвратов; поля отмен, возвратов и денег остаются из прежнего API-контракта'
mapping:
  Q: views
  S: vsearch
  W: pdp
  AA: cart
  AC: units
  P: 'search_position; 0 и null означают отсутствие измеряемой позиции, не нулевой ранг'
priority: 'Последний по реальному времени снимок дня. В закрытые дни заменяет только наблюдённые поля SKU/day, отсутствующие SKU сохраняют наблюдение API за тот же день. Нет сложения фаз.'
empty_value: 'Пропуск не превращается в 0. В закрытый ряд допускаются только конечные счётчики по всем SKU затронутого дня; NULL допустим лишь при конечном API fallback того же SKU/day/поля, иначе сборка блокируется. Измеренные нули сохраняются в таблицах и шагах. Отсутствующий тестовый товар явно показан как нет данных.'
partial_period: 'День, наблюдённый до его завершения по Москве, не входит в графики и разницы закрытых дней. Доступен в существующей Воронке через выбор датированного среза и внутри карточек тестов. Выбор последнего среза доступен и для закрытого дня впереди календаря API; его деньги и постзаказные показатели не измерены, история финансов не продвигается. Данные этого режима не меняют массивы закрытого календаря.'
channel_totals: 'Для заменяемых закрытых дней счётчики канала и категорий используют одинаковый набор SKU/day; денежные и постзаказные итоги не заменяются. День без API итогов добавляется только со счётчиками; если денежный календарь истории уже включает его, сборка блокируется до получения API итогов. Даты с неполным покрытием постзаказных полей не показывают нулевой выкуп/возврат/отмену.'
tests: 'Роли берутся из текущих определений тестов с сохранением test_sibling; исторические роли используются для остальных наблюдавшихся артикулов. Устаревшие готовые агрегаты заменяемых дней исключаются, остаются существующие оценщики по артикулам и проверки охвата.'
surfaces:
  - 'Воронка: шаги, карточки, категории и подкатегории; закрытые периоды и неполный датированный срез'
  - 'Тесты: закрытые ряды, план карточек, позиции главных товаров и исходные наблюдения неполного дня по каждому товару'
  - 'Отчёт: показы по SKU и месяцам из того же общего слоя'
  - 'Другие страницы: прежние денежные/заказные источники и даты, общий статус доступности источников'
  - 'Вспомогательный подбор контроля: тот же закрытый ряд при следующем разрешённом ручном запуске'
not_measured: [prices, card_price, coinvest, boosting, fbs_tariff, advertising, revenue, delivered, cancellations, returns]
reconciliation: 'Проверка переноса против локального исходного XLSX и его итоговой строки. API и кабинет относятся к одному семейству; независимая финансовая сверка этим изменением не заявляется.'
golden_rows:
  - {date: '2026-10-28', sku: '3564832777', views: 120, vsearch: 27, pdp: 16, cart: 1, units: 2, position: 134}
  - {date: '2026-10-28', sku: '4865595688', views: 720, vsearch: 439, pdp: 30, cart: 0, units: 1, position: 114}
  - {date: '2026-10-28', sku: '3492791704', views: 216, vsearch: 40, pdp: 24, cart: 3, units: 1, position: 61}
golden_evidence: 'Строки разрешённого отчёта 28.10, проверены локальным OOXML reader; это не новая формула и не утверждение о новом ручном подтверждении заказчиком.'

partial_chart_display: "Current native snapshot is a separate marked point in plan funnel and main experiment charts, with Moscow capture time and coverage. It never enters historical means, growth, verdicts, goal gauges or API orders. Count tooltip stays a group sum; position uses the existing matched population and 80% guard, suppressing point and tooltip together. Index point applies the existing estimator to the observed population and its own base; no new aggregate-to-article bridge."
