    expected: "каждому заказу 6 967 ₽, последнему 6 968 ₽. Сейчас на «Деньгах»: 13 305 ₽ на заказ 0133310941-0071-1 (единственный заказ рекламируемого товара), 42 432 ₽ в «Общих расходах»"
