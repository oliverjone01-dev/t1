<script>
// Мгновенный редирект на чистый URL. В try/catch, чтобы не падать в jsdom (smoke-гейт),
// где базовый URL about:blank и относительный путь не резолвится - там сработает meta refresh.
try { if (location && /^https?:/.test(location.href)) location.replace("./dashboards/" + location.search + location.hash); } catch (e) {}
</script>
