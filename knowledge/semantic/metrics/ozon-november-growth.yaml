approval: Пользователь попросил перенести весь предложенный анализ и план ноября в дашборд, показывая цели и движение как в октябре.
inherits: [ozon-tests-november-forecast, ozon-tests-november-details, ozon-plan-15-10]
period: ['2026-11-01', '2026-11-30']
timezone: Europe/Moscow
targets: {units: 450, turnover_rub: 30600000, payout_scenario_rub: 11400000, net_profit_rub: 500000, net_payout_pct: 4.5}
stretch: {units: 480, turnover_rub: 32640000, net_profit_rub: 900000, net_payout_pct: 8}
orders: Без изменения определений и золотых строк предыдущей спецификации; по дате заказа, status != cancelled, без дополнительного вычитания возвратов. Только закрытые покрытые дни.
progress: Факт / цель; план к дате равномерный на 30 дней. Отклонение от плана и остаток не являются прогнозом спроса. Темп рассчитывается до конца месяца после последнего покрытого закрытого дня; устаревший срез явно подписан.
finance: Существующие periodTotals, skuAnalyticsData и anDerive страницы Деньги, без дублирования формул. Дата начисления; текущий месяц предварительный. Рентабельность net / payout, null при payout <= 0.
finance_coverage: Пересечение дней channel/account accrual и отчёта реализации; до вчера по МСК и не позже maxD/account/realization cutoff. Пропуск в ноябре блокирует итог, не становится нулём. Старая дата и пропуски показываются.
finance_quality: Незакрытая бухгалтерская сверка, неизвестная себестоимость и оценочная база налога видны. Числовое выполнение не означает подтверждённую прибыль или завершённый финансовый этап.
history: Замороженные выводы анализа 03.11 по снимку f5978abbbb33d526ca03a8ac8372b9c1495f6cb3; не меняются при ежедневном обновлении. Живой ноябрь отделён от истории.
cards: Ноябрьский факт из существующей novemberDetails; числовые пороги по карточкам не придуманы. Направления действий из принятого плана, без утверждения запуска изменений в кабинете.
milestones: Даты дают только календарный статус. Выполнение требует свидетельства, автоматических отметок готовности и фиктивных запусков нет.
