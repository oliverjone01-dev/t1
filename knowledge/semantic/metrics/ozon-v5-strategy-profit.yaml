    expected: "доплата ставки 33 862 ₽ за 2 недели (скрипт 33 862)"
    confirmed_by: ""
  - input: "KONUX, В1 средний: 4,25/нед, -10%, ε -2, переток 25%: 5,247 x 25 485 - 4,25 x 30 039 - 0,249 x 30 039, x 2"
    expected: "-2 862 ₽ за 2 недели (скрипт -2 873, округления)"
    confirmed_by: ""
