# Разовый экспорт контактов Wilstream (колл-центр, обзвон мастерских для GLASS-MEMORY) в .xlsx.
# Только ручной запуск. Результат - вложение к запуску (Artifacts), в репозиторий НЕ коммитится:
# репозиторий публичный, контакты в git попадать не должны.
# Данные из Bitrix24 (секрет B24_WEBHOOK_URL), только чтение.
name: Экспорт контактов Wilstream

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: export-wilstream
  cancel-in-progress: false

env:
  B24_WEBHOOK_URL: ${{ secrets.B24_WEBHOOK_URL }}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка секрета
        run: |
          echo "::add-mask::$B24_WEBHOOK_URL"
          if [ -z "${B24_WEBHOOK_URL:-}" ]; then
            echo "::error::Секрет B24_WEBHOOK_URL не задан."; exit 1
          fi

      - name: Экспорт из Bitrix -> xlsx
        working-directory: analytics-mvp
        run: node src/scripts/b24/export-wilstream.mjs

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: wilstream-contacts
          path: |
            analytics-mvp/exports/wilstream-contacts.xlsx
            analytics-mvp/exports/wilstream-log.txt
          if-no-files-found: error
