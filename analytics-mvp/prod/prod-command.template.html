    Object.entries(byDeal).forEach(([k,cards])=>{const mgr=cards[0].dealMgr||cards[0].sourceMgr||'—';const e=ent(mgr,depOf(mgr,k.startsWith('c')?null:k));
      e.tD++;e.tM+=cards[0].dealBudget||0;e.tPos+=cards.length;e.tPcs+=qtySum(cards)});
    // входящий пакет (сейчас)
    (PP0||[]).filter(d=>d.open&&/EXECUTING/.test(d.stage)).forEach(d=>{const e=ent(d.mgr,depOf(d.mgr,d.id));e.inN++;e.inM+=d.budget||0});
    // потенциал в расчётах (сейчас)
    QT.forEach(d=>{const e=ent(d.mgr,depOf(d.mgr,null));e.qN++;e.qM+=d.budget||0});
    // сортировка по клику на заголовок: применяется и к отделам, и к менеджерам внутри отдела
    const DS=S.dSort||{k:'qM',a:false};
    const _gv={nm:r=>r.mgr||r.dep||'',tD:r=>r.tD,tM:r=>r.tM,tPos:r=>r.tPos,tPcs:r=>r.tPcs,inM:r=>r.inM,qM:r=>r.qM}[DS.k]||(r=>r.qM);
    const srt=arr=>arr.slice().sort((a,b)=>{const x=_gv(a),y=_gv(b);const d=(typeof x==='string')?String(x).localeCompare(String(y),'ru'):((y||0)-(x||0));return DS.a?-d:d});
    const deps=srt(['GG','GM'].map(dep=>{const ms=Object.values(M).filter(m=>m.dep===dep);
      const agg={dep,tD:sum(ms,m=>m.tD),tM:sum(ms,m=>m.tM),tPos:sum(ms,m=>m.tPos),tPcs:sum(ms,m=>m.tPcs),inN:sum(ms,m=>m.inN),inM:sum(ms,m=>m.inM),qN:sum(ms,m=>m.qN),qM:sum(ms,m=>m.qM),ms:srt(ms)};
      return agg}).filter(a=>a.tD||a.inN||a.qN));
    if(!deps.length)return '';
    // прозрачные гистограммы в ячейках: объёмы видно с одного взгляда; отделы и менеджеры масштабируются каждый в своей группе
    const allM=Object.values(M);
    const mxOf=(arr,f)=>Math.max(1e-9,...arr.map(f));
    const mxDep={tD:mxOf(deps,r=>r.tD),tM:mxOf(deps,r=>r.tM),tPos:mxOf(deps,r=>r.tPos),tPcs:mxOf(deps,r=>r.tPcs),inM:mxOf(deps,r=>r.inM),qM:mxOf(deps,r=>r.qM)};
    const mxMgr={tD:mxOf(allM,r=>r.tD),tM:mxOf(allM,r=>r.tM),tPos:mxOf(allM,r=>r.tPos),tPcs:mxOf(allM,r=>r.tPcs),inM:mxOf(allM,r=>r.inM),qM:mxOf(allM,r=>r.qM)};
    const hg=(v,mx,col)=>{if(!v)return '';const w=Math.max(v/mx*100,3).toFixed(1);return `background:linear-gradient(90deg,${col} ${w}%,transparent ${w}%);`};
    const T='rgba(45,212,191,.14)',B='rgba(96,165,250,.14)',V='rgba(139,123,240,.14)',AMB='rgba(245,158,11,.12)',PU='rgba(167,139,250,.13)';
    const cell=(v,m,col,mx,bg)=>`<td style="text-align:center;${hg(m,mx,bg)}">${v?`<b style="color:${col}">${fmt(v)}</b><span style="color:var(--ink4)"> · ${fmtK(m)} ₽</span>`:'<span style="color:var(--ink4)">·</span>'}</td>`;
    const row=(r,isDep)=>{const nm=isDep?`<b>${r.dep==='GG'?'GENGLASS (GG)':'GLASS MEMORY (GM)'}</b>`:`<span style="padding-left:22px">${esc(r.mgr)}</span>`;
      const idle=!isDep&&!r.tD&&(r.qN||r.inN);
      const mx=isDep?mxDep:mxMgr;
      const canOpen=!isDep&&r.qN>0;
      return `<tr ${isDep?`data-dept="${r.dep}" style="cursor:pointer;background:rgba(34,211,238,.05);border-top:2px solid var(--border2)"`:(canOpen?`data-mgr="${r.dep}|${esc(r.mgr)}" style="cursor:pointer"`:'')}>
        <td class="nm">${isDep?(S.deptOpen&&S.deptOpen[r.dep]?'▾ ':'▸ '):(canOpen?(S.mgrOpen&&S.mgrOpen[r.dep+'|'+r.mgr]?'<span style="color:#A78BFA">▾ </span>':'<span style="color:#A78BFA">▸ </span>'):'')}${nm}${idle?' <span style="font-size:9px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.5);color:var(--amber);border-radius:5px;padding:1px 5px;font-weight:700">не передаёт</span>':''}</td>
        <td style="text-align:center;${hg(r.tD,mx.tD,T)}">${r.tD?`<b>${fmt(r.tD)}</b>`:'<span style="color:var(--ink4)">·</span>'}</td>
        <td style="text-align:center;${hg(r.tM,mx.tM,T)}">${r.tM?fmtK(r.tM)+' ₽':'<span style="color:var(--ink4)">·</span>'}</td>
        <td style="text-align:center;${hg(r.tPos,mx.tPos,B)}">${r.tPos||'<span style="color:var(--ink4)">·</span>'}</td>
        <td style="text-align:center;${hg(r.tPcs,mx.tPcs,V)}">${r.tPcs||'<span style="color:var(--ink4)">·</span>'}</td>
        ${cell(r.inN,r.inM,'var(--amber)',mx.inM,AMB)}
        ${cell(r.qN,r.qM,'#A78BFA',mx.qM,PU)}</tr>`};
    // второй уровень: сделки менеджера в просчёте (потенциал, лежащий у конкретного человека)
    const qtBy={};QT.forEach(d=>{const k=(d.mgr||'—');(qtBy[k]=qtBy[k]||[]).push(d)});
    const portal=DATA.b24Portal||'';
    const mgrDetail=m=>{const list=(qtBy[m.mgr]||[]).slice().sort((a,b)=>(b.budget||0)-(a.budget||0));
      if(!list.length)return '';
      const rowsQ=list.slice(0,40).map(d=>{const age=d.created?Math.max(0,Math.round(days(d.created,NOWS))):null;
        const idl=portal?`<a href="${portal}/crm/deal/details/${d.id}/" target="_blank" rel="noopener" style="color:#3DAEC2" onclick="event.stopPropagation()">${d.id}</a>`:d.id;
        return `<tr style="font-size:11px"><td style="padding-left:44px">${idl}</td><td>${esc(d.stage||'-')}</td><td style="text-align:right">${fmtK(d.budget||0)} ₽</td><td style="text-align:center;color:${age>30?'#CC5867':age>14?'#C2873C':'var(--ink3)'}">${age!=null?age+' дн в просчёте':'—'}</td></tr>`}).join('');
      return `<tr><td colspan="7" style="padding:0"><table class="tbl" style="margin:2px 0 8px"><tbody>${rowsQ}</tbody></table>${list.length>40?`<div class="card-s" style="padding-left:44px;margin-bottom:6px">показаны 40 из ${fmt(list.length)} (по сумме)</div>`:''}</td></tr>`};
    const dth=(k,l,left)=>`<th data-dsk="${k}" style="${left?'':'text-align:center;'}cursor:pointer;user-select:none${DS.k===k?';color:#22D3EE':''}">${l}${DS.k===k?(DS.a?' ▲':' ▼'):''}</th>`;
    let body='';deps.forEach(a=>{body+=row(a,true);if(S.deptOpen&&S.deptOpen[a.dep])a.ms.forEach(m=>{body+=row(m,false);if(S.mgrOpen&&S.mgrOpen[a.dep+'|'+m.mgr])body+=mgrDetail(m)})});
    const tot={dep:'Итого',tD:sum(deps,a=>a.tD),tM:sum(deps,a=>a.tM),tPos:sum(deps,a=>a.tPos),tPcs:sum(deps,a=>a.tPcs),inN:sum(deps,a=>a.inN),inM:sum(deps,a=>a.inM),qN:sum(deps,a=>a.qN),qM:sum(deps,a=>a.qM)};
    // Итого - первой строкой: на него смотрят чаще, чем на разбивку
    const foot=`<tr style="border-bottom:2px solid var(--border2);background:rgba(34,211,238,.05)"><td class="nm" style="font-weight:800">Итого</td><td style="text-align:center;font-weight:800;${hg(1,1,T)}">${fmt(tot.tD)}</td><td style="text-align:center;font-weight:800;${hg(1,1,T)}">${fmtK(tot.tM)} ₽</td><td style="text-align:center;font-weight:800;${hg(1,1,B)}">${fmt(tot.tPos)}</td><td style="text-align:center;font-weight:800;${hg(1,1,V)}">${fmt(tot.tPcs)}</td>${cell(tot.inN,tot.inM,'var(--amber)',tot.inM||1,AMB)}${cell(tot.qN,tot.qM,'#A78BFA',tot.qM||1,PU)}</tr>`;
    return `<div class="card"><div class="card-h"><div><div class="card-t">Отделы продаж: передачи и потенциал <span class="qm" data-tip="Точка совещания ОП и цеха. «Передано» = за выбранный период (когорта воронки). «Пакет» = открытые сделки на стадии «В производстве» сейчас. «Потенциал» = открытые сделки в просчёте сейчас. Бейдж «не передаёт» = потенциал/пакет есть, а передач в периоде нет. Сортировка кликом по заголовку колонки.">?</span></div><div class="card-s">клик по отделу - менеджеры, по менеджеру - его сделки в просчёте · Итого первой строкой</div></div></div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr>${dth('nm','Отдел / менеджер',true)}${dth('tD','Передано сделок')}${dth('tM','₽ передано')}${dth('tPos','Изделий')}${dth('tPcs','Штук')}${dth('inM','Пакет · сейчас')}${dth('qM','Потенциал · сейчас')}</tr></thead><tbody>${foot}${body}</tbody></table></div></div>`;
  })();

  // ===== МЕНЕДЖЕРЫ: ПЕРЕДАЧИ И ПОТЕНЦИАЛ (как в дашборде РОПа) =====
  const syncMgrCard=(()=>{
    const uniq=uniqByDeal(IT.filter(i=>inRange(startDate(i))));
    const M={};uniq.forEach(i=>{const n=mgrOf(i);(M[n]=M[n]||{n,c:0,m:0,q:0,qm:0});M[n].c++;M[n].m+=i.dealBudget||0});
    const QT=(DATA.quotes&&DATA.quotes.deals)||[];
    QT.forEach(d=>{const n=d.mgr||'—';(M[n]=M[n]||{n,c:0,m:0,q:0,qm:0});M[n].q++;M[n].qm+=d.budget||0});
    const rows=Object.values(M);
    sortRows(rows,S.smSort,{n:r=>r.n,c:r=>r.c,m:r=>r.m,q:r=>r.q,qm:r=>r.qm});
    const totC=sum(rows,r=>r.c),totM=sum(rows,r=>r.m),totQ=sum(rows,r=>r.q),totQM=sum(rows,r=>r.qm);
    const mxC=Math.max(1,...rows.map(r=>r.c)),mxM=Math.max(1,...rows.map(r=>r.m)),mxQ=Math.max(1,...rows.map(r=>r.q)),mxQM=Math.max(1,...rows.map(r=>r.qm));
    const bg=(v,mx,col)=>{if(!v)return '';const w=Math.max(v/mx*100,3).toFixed(1);return `background:linear-gradient(90deg,${col} ${w}%,transparent ${w}%);`};
    const T='rgba(45,212,191,.14)',Q='rgba(34,211,238,.12)';
    const body=rows.slice(0,14).map(r=>`<tr><td class="nm">${esc(r.n)}</td>
      <td style="${bg(r.c,mxC,T)}">${r.c||'·'}</td><td style="${bg(r.c,mxC,T)}">${totC?pct(r.c/totC):'·'}</td>
      <td style="${bg(r.m,mxM,T)}"><b>${r.m?fmtK(r.m):'·'}</b></td><td style="color:var(--ink3);${bg(r.m,mxM,T)}">${totM&&r.m?pct(r.m/totM):'·'}</td>
      <td style="color:var(--cyan);${bg(r.q,mxQ,Q)}">${r.q||'·'}</td><td style="color:var(--cyan);${bg(r.qm,mxQM,Q)}">${r.qm?fmtK(r.qm):'·'}</td></tr>`).join('');
    const foot=`<tr style="border-top:2px solid var(--border2)"><td class="nm" style="font-weight:800">Отдел</td>
      <td style="font-weight:800;${bg(1,1,T)}">${fmt(totC)}</td><td style="${bg(1,1,T)}">100%</td>
      <td style="font-weight:800;${bg(1,1,T)}">${fmtK(totM)}</td><td style="${bg(1,1,T)}">100%</td>
      <td style="font-weight:800;color:var(--cyan);${bg(1,1,Q)}">${fmt(totQ)}</td><td style="font-weight:800;color:var(--cyan);${bg(1,1,Q)}">${fmtK(totQM)}</td></tr>`;
    return `<div class="card"><div class="card-h"><div><div class="card-t">Менеджеры: передачи и потенциал</div><div class="card-s">передачи за период · «в расчётах» = снимок сейчас, будущий поток в цех</div></div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr>${thRow('sm',S.smSort,[['n','Менеджер'],['c','Передано'],[null,'Доля шт'],['m','₽'],[null,'Доля ₽'],['q','В расчётах'],['qm','Потенциал ₽']])}</tr></thead><tbody>${body}${foot}</tbody></table></div></div>`;
  })();

  // ===== ТРУБА ПРОИЗВОДСТВА (визуал РОПа): каких участков коснулись изделия когорты =====
  const prodTruba=(()=>{
    const base=cut; if(!base.length)return '<div class="card-s">нет заказов в выбранном периоде</div>';
    const doneBase=base.filter(isDone);
    // время на участке по когорте
    const stayOf=nm=>{const a=[];base.forEach(i=>{const h=i.hist||[];for(let j=0;j<h.length;j++){if(stationOf(h[j][0])!==nm)continue;const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);const d=end!=null?days(h[j][1],end):null;if(d!=null&&d>=0)a.push(d)}});return med(a)};
    const touch=nm=>base.filter(i=>(i.hist||[]).some(h=>stationOf(h[0])===nm));
    // единица тумблером: ИЗДЕЛИЯ = карточки-наряды (дефолт), ПО ШТУЧНО = штуки (изделия x количество из товарных строк)
    const PCS=S.trubaUnit==='pcs',mea=arr=>PCS?qtySum(arr):arr.length;
    const F=[{name:'Запущено',count:mea(base),pos:base.length,izd:qtySum(base),dwell:null,items:base}];
    STATIONS.filter(([nm])=>nm!=='Передано'&&nm!=='Готово').forEach(([nm])=>{const t=touch(nm);F.push({name:nm,count:mea(t),pos:t.length,izd:qtySum(t),dwell:stayOf(nm),items:t})});
    F.push({name:'Готово',count:mea(doneBase),pos:doneBase.length,izd:qtySum(doneBase),dwell:null,items:doneBase});
    const n=F.length,W=1380,H=330,bandH=190,midY=64+bandH/2,pillY=H-30,pctY=H-48;
    const colW=W/n,nodeW=colW*0.52,maxC=F[0].count||1;
    const COL=['#22D3EE','#38BDF8','#60A5FA','#818CF8','#A78BFA','#C084FC','#2DD4BF','#34D399','#10B981','#2E9E74'];
    const cx=i=>colW*i+colW/2,hOf=c=>Math.max(6,c/maxC*bandH),nodeX=i=>cx(i)-nodeW/2;
    const dwellCol=dl=>dl>=10?'#F43F5E':dl>=5?'#FB923C':'#10B981';
    let defs='',conns='',nodes='',labels='';
    for(let i=0;i<n-1;i++){const h0=hOf(F[i].count),h1=hOf(F[i+1].count),x0=nodeX(i)+nodeW,x1=nodeX(i+1);
      const t0=midY-h0/2,b0=midY+h0/2,t1=midY-h1/2,b1=midY+h1/2,gid='pc'+i;
      defs+=`<linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${COL[i%COL.length]}" stop-opacity=".4"/><stop offset="1" stop-color="${COL[(i+1)%COL.length]}" stop-opacity=".4"/></linearGradient>`;
      const bothArr=F[i+1].items.filter(x=>F[i].items.includes(x));
      const td=attr(`<div class='tl'>${F[i].name} → ${F[i+1].name}</div><div class='tr'><span>Прошли оба участка, изд.</span><span>${fmt(qtySum(bothArr))}</span></div><div class='tr'><span>Позиций</span><span>${fmt(bothArr.length)}</span></div>`);
      conns+=`<path d="M${x0} ${t0} L${x1} ${t1} L${x1} ${b1} L${x0} ${b0} Z" fill="url(#${gid})" data-tip="${td}"/>`}
    F.forEach((f,i)=>{const h=hOf(f.count),t=midY-h/2,c=COL[i%COL.length];
      const money=dealMoney(f.items);
      const td=attr(`<div class='tl'>${f.name}</div><div class='tr'><span>Изделий (карточек)</span><span>${fmt(f.pos)}</span></div><div class='tr'><span>Штук (с количеством)</span><span>${fmt(f.izd)}</span></div><div class='tr'><span>Доля от запущенных</span><span>${pct(f.count/(F[0].count||1))}</span></div><div class='tr'><span>Деньги (уник. сделки)</span><span>${fmtK(money)} ₽</span></div><div class='tr'><span>Медиана на участке</span><span>${f.dwell!=null?d1(f.dwell)+' дн':'—'}</span></div>`);
      nodes+=`<rect x="${nodeX(i)}" y="${t}" width="${nodeW}" height="${h}" rx="5" fill="${c}" data-tip="${td}" style="cursor:help"/>`;
      if(h>=22)nodes+=`<text x="${cx(i)}" y="${midY+5}" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="15" fill="#06121a" pointer-events="none">${fmt(f.count)}</text>`;
      else labels+=`<text x="${cx(i)}" y="${t-5}" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="12" fill="${c}">${fmt(f.count)}</text>`;
      labels+=`<text x="${cx(i)}" y="24" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink2)">${f.name}</text>`;
      labels+=`<text x="${cx(i)}" y="${pctY}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink3)">${pct0(f.count/(F[0].count||1))}</text>`;
      if(f.dwell!=null){const dc=dwellCol(f.dwell);labels+=`<rect x="${cx(i)-27}" y="${pillY}" width="54" height="16" rx="8" fill="${dc}22" stroke="${dc}" stroke-opacity=".5"/><text x="${cx(i)}" y="${pillY+11.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${dc}" pointer-events="none">${d1(f.dwell)} дн</text>`}});
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:1000px"><defs>${defs}</defs>${conns}${nodes}${labels}</svg></div><div class="note">Столбик = сколько ${PCS?'ШТУК (изделия × количество внутри карточек)':'ИЗДЕЛИЙ (карточек)'} когорты (${modeLbl}: <b>${fmt(base.length)}</b> изделий, <b>${fmt(qtySum(base))}</b> штук) коснулось участка за свой маршрут, % = доля от запущенных, пилюля = медиана времени на участке. Вторая единица - в подсказке столбика, тумблер сверху переключает. Производство - труба с ветками: изделие проходит только НУЖНЫЕ участки (зеркалу не нужна столярка), поэтому столбики не обязаны убывать слева направо, а «Готово» не равно сумме участков. Провала «мимо производства» нет: каждый готовый прошёл свой набор участков.</div>`;
  })();

  // ===== КОНВЕЙЕР: сейчас на участке + прошло за период =====
  const conv=(()=>{
    const wipBy={},passBy={},dwBy={};
    STATIONS.forEach(([nm])=>{wipBy[nm]=0;passBy[nm]=0;dwBy[nm]=[]});
    wip.forEach(i=>{const st=stationOf(i.stageCode);if(st){wipBy[st]++;const dw=dwellNow(i);if(dw!=null)dwBy[st].push(dw)}});
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{const st=stationOf(h[0]);if(st&&!seen.has(st)&&inRange(h[1])){seen.add(st);passBy[st]++}})});
    const nodes=STATIONS.map(([nm],idx)=>{
      const isFin=nm==='Готово';
      const c=isFin?passBy[nm]:wipBy[nm],mdw=med(dwBy[nm]);
      const col=isFin?'#2E9E74':(c?tone(mdw||0):'var(--ink4)');
      return `<div class="st"><div class="node" style="border-color:${c?col:'var(--border)'};background:${c?col+'22':'var(--elev)'}">
        <div class="cnt" style="color:${c?col:'var(--ink4)'}">${c}</div>
        <div class="nm">${nm}</div>
        <div class="dw" style="color:${c?col:'var(--ink4)'}">${isFin?'за период':c?(mdw!=null?d1(mdw)+' дн':''):'транзит'}</div>
        <div class="thru">${isFin?'всего готово '+fmt(done.length):'за период: '+fmt(passBy[nm])}</div>
      </div>${idx<STATIONS.length-1?'<div class="arrow">›</div>':''}</div>`}).join('');
    return `<div class="conv">${nodes}</div><div class="legend"><span><i style="background:#2E9E74"></i>до 5 дн</span><span><i style="background:#F59E0B"></i>5-10</span><span><i style="background:#FB923C"></i>10-21</span><span><i style="background:#F43F5E"></i>21+ дн (застряло)</span><span style="color:var(--ink4)">крупное число = заказы на участке СЕЙЧАС · «за период» = входы на участок в выбранных датах · 0 у транзитных участков = сейчас пусто, поток шёл (см. «за период»)</span></div>`;
  })();

  // ===== ДИНАМИКА: запуск vs выпуск (шт или ₽) =====
  const _money=S.dynUnit==='money';
  const dynFlow=chartSVG([
    {name:'Передано в производство',c:'#22D3EE',vals:seriesBy(all,startDate,keys,_money?moneyOf:null)},
    {name:'Готово (выпуск)',c:'#2E9E74',vals:seriesBy(done,successDate,keys,_money?moneyOf:null)},
  ],keys,_money?{money:true}:{fmtY:v=>fmt(v)});

  // ===== ДИНАМИКА: WIP и зависло на конец бакета =====
  const wipVals=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;
    return all.filter(i=>{const s=startDate(i);if(!s||s>t)return false;const f=successDate(i);return !(f&&f<=t)}).length});
  const stuckVals=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;
    return all.filter(i=>{const s=startDate(i);if(!s||s>t)return false;const f=successDate(i);if(f&&f<=t)return false;
      let last=s;(i.hist||[]).forEach(h=>{if(h[1]&&h[1]<=t&&h[1]>last)last=h[1]});return days(last,t)>14}).length});
  const dynWip=chartSVG([
    {name:'В производстве (на конец периода)',c:'#F59E0B',vals:wipVals,area:true},
    {name:'из них зависло >14 дн',c:'#F43F5E',vals:stuckVals},
  ],keys,{fmtY:v=>fmt(v)});

  // ===== ДИНАМИКА: средний срок готовых (группировка по дате среза) =====
  const cycVals=keys.map(k=>{const arr=done.filter(i=>bkey(isStart?startDate(i):successDate(i))===k).map(cycleOf).filter(x=>x!=null&&x>=0);return arr.length?med(arr):null});
  const dynCyc=chartSVG([{name:`Медиана срока готовых, дн · по дате ${isStart?'запуска':'готовности'}`,c:'#A78BFA',vals:cycVals,join:true}],keys,{fmtY:v=>d1(v)});

  // ===== ДИНАМИКА: деньги запуска =====
  const dynMoney=isStart
    ?chartSVG([{name:'Запущено в производство, ₽ (уникальные сделки)',c:'#22D3EE',vals:seriesBy(uniqByDeal(all),startDate,keys,moneyOf),type:'bar'}],keys,{money:true})
    :chartSVG([{name:'Выпущено (готово), ₽ (уникальные сделки)',c:'#2E9E74',vals:seriesBy(uniqByDeal(done),successDate,keys,moneyOf),type:'bar'}],keys,{money:true});

  // ===== ДВЕ ПЕДАЛИ ЦЕХА: вход vs мощность -> очередь или сроки =====
  const pedalsBlock=(()=>{
    if(!keys.length)return '';
    const ki={};keys.forEach((k,i)=>ki[k]=i);const mk=()=>keys.map(()=>0);
    const inP=mk(),outP=mk();
    IT.filter(dirOk).forEach(i=>{const k1=bkey(startDate(i));if(k1 in ki)inP[ki[k1]]+=qtyOf(i);
      if(isDone(i)&&successDate(i)){const k2=bkey(successDate(i));if(k2 in ki)outP[ki[k2]]+=qtyOf(i)}});
    // мощность: НЕ константа, а скользящая - средний выпуск шт/нед за 8 недель ДО начала бакета.
    // Чем больше цех реально выпускал в последнее время, тем выше риска; просел - риска съезжает.
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const w={};IT.forEach(i=>{if(!isDone(i)||!successDate(i))return;const k=wkOf(successDate(i));if(k)w[k]=(w[k]||0)+qtyOf(i)});
    const wkList=Object.keys(w).sort(),weeks=wkList.map(k=>w[k]),scale=S.gran==='d'?1/7:S.gran==='m'?30.4/7:1;
    const capAll=(weeks.length?weeks.reduce((a,b)=>a+b,0)/weeks.length:0)*scale;
    const capB=keys.map(k=>{const wkk=wkOf(k);const prev=wkList.filter(x=>x<wkk).slice(-8);
      return prev.length?prev.reduce((a,x)=>a+w[x],0)/prev.length*scale:(capAll||null)});
    const capI=i=>capB[i]!=null?capB[i]:capAll;
    const capMax=(weeks.length?Math.max(...weeks):0)*scale; // пик: лучшая неделя в истории - потолок цеха
    const cap=capAll;
    // следствия: незавершёнка (шт, конец бакета) и срок когорты запуска
    const wipP=keys.map(k=>{const t=bend(k);if(t>NOWS)return null;let q=0;IT.filter(dirOk).forEach(i=>{const st=startDate(i);if(!st||st>t)return;const f=successDate(i);if(f&&f<=t)return;q+=qtyOf(i)});return q});
    const cycB=keys.map(k=>{const arr=IT.filter(dirOk).filter(i=>isDone(i)&&bkey(startDate(i))===k).map(cycleOf).filter(x=>x!=null&&x>=0);return arr.length?med(arr):null});
    const gl=S.gran==='d'?'день':S.gran==='m'?'мес':'нед';
    const top=chartSVG([
      {name:'Вход в цех, штук',c:'#8B7BF0',vals:inP,type:'bar',op:.45},
      {name:'Выпуск, штук',c:'#2DD4BF',vals:outP}
    ],keys,{fmtY:v=>fmt(v),
      refSteps:{vals:capB,label:'мощность · скользящая 8 нед, шт/'+gl,c:'#F59E0B'},
      refLine:capMax>0?{v:capMax,label:'пик мощности ~'+d1(capMax)+' шт/'+gl,c:'#F43F5E'}:null});
    const nowK=bkey(NOWS);
    const lastCyc=i=>{let j=i-1;while(j>=0&&cycB[j]==null)j--;return j>=0?cycB[j]:null};
    const diag=keys.map((k,i)=>{
      if(k>nowK)return {c:'#232c38',t:'период ещё не наступил'};
      if(!inP[i]&&!outP[i])return {c:'#232c38',t:'событий не было'};
      const over=capI(i)>0&&inP[i]>capI(i)*1.05;
      if(!over)return {c:'#2E9E74',t:'штатный режим: вход в пределах мощности'};
      const dw=(wipP[i]!=null&&i>0&&wipP[i-1]!=null)?wipP[i]-wipP[i-1]:0;
      const pc=lastCyc(i),dc=(cycB[i]!=null&&pc!=null)?cycB[i]-pc:0;
      if(dc>1.5)return {c:'#F43F5E',t:'педаль «СРОКИ»: вход выше мощности, срок когорты растёт - двигаются обещания клиентам'};
      if(dw>0)return {c:'#F59E0B',t:'педаль «ОЧЕРЕДЬ»: вход выше мощности, темп держим - копится незавершёнка'};
      return {c:'#F59E0B',t:'вход выше мощности'};
    });
    const strip=`<div style="display:flex;gap:2px;margin:0 12px 10px 44px">`+diag.map((d,i)=>{const gap=capI(i)-inP[i];
      return `<div data-tip="${attr(`<div class='tl'>Диагноз · ${blabel(keys[i])}</div><div class='tr'><span>Вход, шт</span><span>${fmt(inP[i])}</span></div><div class='tr'><span>Мощность периода, шт/${gl}</span><span>${d1(capI(i))}</span></div><div class='tr'><span>${gap>=0?'Свободный запас':'Перегруз входа'}</span><span>${d1(Math.abs(gap))} шт</span></div><div class='tr'><span>Пик мощности, шт/${gl}</span><span>${d1(capMax)}</span></div><div class='tr'><span>Выпуск, шт</span><span>${fmt(outP[i])}</span></div><div class='tr'><span>Незавершёнка на конец, шт</span><span>${wipP[i]!=null?fmt(wipP[i]):'—'}</span></div><div class='tr'><span>Срок когорты запуска</span><span>${cycB[i]!=null?d1(cycB[i])+' дн':'ещё не готовы'}</span></div><div class='tn'>${d.t}</div>`)}" style="flex:1;height:11px;border-radius:3px;background:${d.c};cursor:help"></div>`}).join('')+`</div>`;
    const botWip=chartSVG([{name:'Незавершёнка на конец периода, штук',c:'#F59E0B',vals:wipP,area:true}],keys,{fmtY:v=>fmt(v),h:150});
    const botCyc=chartSVG([{name:'Срок когорты запуска, дн (готовые)',c:'#A78BFA',vals:cycB,join:true}],keys,{fmtY:v=>d1(v),h:150});
    // сводные плашки: мощность сейчас (скользящая), потолок цеха и средний срок производства за период
    const capNow=(()=>{const prev=wkList.slice(-8);return prev.length?prev.reduce((a,x)=>a+w[x],0)/prev.length*scale:capAll})();
    const cycPeriod=med(IT.filter(dirOk).filter(i=>isDone(i)&&inRange(successDate(i))).map(cycleOf).filter(x=>x!=null&&x>=0));
    const chip=(l,v,c,tip)=>`<div data-tip="${attr(tip)}" style="display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--border2);border-radius:8px;background:rgba(148,163,184,.04);cursor:help"><span style="width:8px;height:8px;border-radius:2px;background:${c}"></span><span style="font-size:10.5px;color:var(--ink3)">${l}</span><b style="font-size:12px;color:${c}">${v}</b></div>`;
    const chips=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">${chip('мощность сейчас','~'+d1(capNow)+' шт/'+gl,'#F59E0B','средний выпуск за последние 8 недель, приведённый к грануляции. Это реальный темп цеха: вход выше него = очередь или сдвиг сроков')}${chip('пик мощности','~'+d1(capMax)+' шт/'+gl,'#F43F5E','лучшая неделя цеха за всю историю. Потолок: грузить выше пика = гарантированный сдвиг по дням')}${chip('средний срок производства','' + (cycPeriod!=null?d1(cycPeriod)+' дн':'—'),'#A78BFA','медиана «запуск - готово» по заказам, выпущенным в выбранном периоде')}</div>`;
    return `<div class="card"><div class="card-h"><div><div class="card-t">Две педали цеха: очередь или сроки <span class="qm" data-tip="Оранжевый пунктир = мощность периода (скользящий средний выпуск за 8 недель до него, меняется во времени). Красный пунктир = пик мощности, лучшая неделя в истории - потолок цеха. Полоса-диагноз под графиком: зелёное = штатный режим, янтарное = педаль «очередь» (вход выше мощности, копится незавершёнка), красное = педаль «сроки» (растёт срок когорты), тёмное = не было событий или период не наступил. Наведи на сегмент - все цифры периода.">?</span></div><div class="card-s">вход штук против мощности · полоса-диагноз под графиком</div></div></div>${chips}<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center"><div>${top}${strip}</div><div>${botWip}${botCyc}</div></div><div class="note">Когда вход штук выше мощности, у цеха две педали: <b style="color:#F59E0B">держать темп на заказ</b> - тогда копится незавершёнка и растёт «на подходе», или <b style="color:#F43F5E">растягивать сроки</b> - тогда двигаются обещания клиентам и сделки зависают в «В производстве». Диагноз считается по факту: перегруз входа + рост незавершёнки = «очередь», перегруз + рост срока когорты = «сроки». Мощность не константа: это скользящий средний выпуск за 8 недель до периода, поэтому пунктир гуляет вместе с реальным темпом цеха.</div></div>`;
  })();

  // ===== ОЦЕНКА УЧАСТКОВ: загрузка сейчас × пропускная способность (из истории) × разгрузка =====
  const stationsBlock=(()=>{
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const wk={},stayAll={};STATIONS.forEach(([nm])=>{wk[nm]={};stayAll[nm]=[]});
    IT.forEach(i=>{const h=i.hist||[];const q=qtyOf(i);
      for(let j=0;j<h.length;j++){const st=stationOf(h[j][0]);if(!st)continue;
        const k=wkOf(h[j][1]);if(k)wk[st][k]=(wk[st][k]||0)+q;
        const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);
        const dur=end!=null?days(h[j][1],end):null;if(dur!=null&&dur>=0)stayAll[st].push(dur)}});
    const toneClear=c=>c==null?'#F43F5E':c>=14?'#F43F5E':c>=7?'#FB923C':c>=3?'#F59E0B':'#2E9E74';
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const weeks=Object.values(wk[nm]);
      const avgW=weeks.length?weeks.reduce((a,b)=>a+b,0)/weeks.length:0;
      const maxW=weeks.length?Math.max(...weeks):0;
      let queue=0,qPos=0;wip.forEach(i=>{if(stationOf(i.stageCode)===nm){queue+=qtyOf(i);qPos++}});
      const clear=queue?(avgW>0?queue/(avgW/7):null):0;
      return {nm,avgW,maxW,queue,qPos,stay:med(stayAll[nm]),clear,used:maxW>0};
    }); // порядок = как стадии в смарт-процессе (STATIONS), без пересортировки
    const mx=Math.max(1,...rows.map(r=>Math.max(r.avgW,r.queue)));
    const bar=(w,col,txt,tcol)=>`<div style="height:16px;border-radius:5px;background:${col};width:${Math.max(w,2).toFixed(1)}%;min-width:${txt?'54px':'2px'};display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:700;color:${tcol};white-space:nowrap">${txt}</div>`;
    const body=rows.map(r=>{
      if(!r.used)return `<div style="display:grid;grid-template-columns:110px 1fr 66px;gap:10px;align-items:center;margin:7px 0"><div style="text-align:right;font-size:11.5px;font-weight:700;color:var(--ink4)">${r.nm}</div><span style="color:var(--ink4);font-size:11px">участок не используется</span><span></span></div>`;
      const col=r.queue?toneClear(r.clear):'#3a4450';
      const over=r.avgW&&r.queue>r.avgW;
      const td=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Очередь сейчас</span><span>${fmt(r.queue)} шт (${fmt(r.qPos)} изделий)</span></div><div class='tr'><span>Мощность (средняя)</span><span>${d1(r.avgW)} шт/нед</span></div><div class='tr'><span>Мощность (пиковая)</span><span>${fmt(r.maxW)} шт/нед</span></div><div class='tr'><span>Разгрузка очереди</span><span>${r.clear!=null?'~'+d1(r.clear)+' дн':'нет данных о скорости'}</span></div><div class='tr'><span>Медиана времени на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div>`);
      return `<div data-tip="${td}" style="display:grid;grid-template-columns:110px 1fr 66px;gap:10px;align-items:center;margin:7px 0;cursor:help">
        <div style="text-align:right;font-size:11.5px;font-weight:700;color:var(--ink2)">${r.nm}</div>
        <div style="display:flex;flex-direction:column;gap:3px">
          ${bar(r.avgW/mx*100,'rgba(62,123,214,.30)','мощность: '+d1(r.avgW)+' шт/нед','#9db9dd')}
          ${bar(r.queue/mx*100,col+'40',r.queue?('очередь: '+fmt(r.queue)+' шт'+(over?' · выше мощности':'')):'очередь пуста',r.queue?col:'var(--ink4)')}
        </div>
        <b class="stx-pill" style="color:${col};background:${col}1c;border:1px solid ${col}55;justify-self:start">${r.clear!=null?'~'+d1(r.clear)+' дн':'?'}</b>
      </div>`}).join('');
    return `${body}<div class="legend"><span><i style="background:#2E9E74"></i>разгрузка до 3 дн</span><span><i style="background:#F59E0B"></i>3-7 дн</span><span><i style="background:#FB923C"></i>7-14 дн</span><span><i style="background:#F43F5E"></i>14+ дн (узкое горло)</span><span style="color:var(--ink4)">два стакана на участок: синий = мощность (шт/нед из истории), цветной = очередь сейчас (шт) · очередь длиннее мощности = копится больше, чем участок делает за неделю · бейдж = дней на разгрузку</span></div>`;
  })();

  // ===== ПРОХОДИМОСТЬ УЧАСТКОВ: центрированная воронка =====
  // ширина = доля заказов через участок · цвет = медиана времени НА участке (перегруз краснеет)
  const flowBlock=(()=>{
    const base=cut.length?cut:[];
    const total=base.length||1;
    const stayBy={};STATIONS.forEach(([nm])=>stayBy[nm]=[]);
    base.forEach(i=>{const h=i.hist||[];
      for(let j=0;j<h.length;j++){const st=stationOf(h[j][0]);if(!st)continue;
        const end=j+1<h.length?h[j+1][1]:(isWip(i)?NOWS:null);
        const dur=end!=null?days(h[j][1],end):null;
        if(dur!=null&&dur>=0)stayBy[st].push(dur)}});
    const rows=STATIONS.map(([nm])=>{
      const passed=base.filter(i=>(i.hist||[]).some(h=>stationOf(h[0])===nm)).length;
      let c=0,dws=[];wip.forEach(i=>{if(stationOf(i.stageCode)===nm){c++;const d=dwellNow(i);if(d!=null)dws.push(d)}});
      return {nm,passed,stay:med(stayBy[nm]),wc:c,wm:med(dws)}});
    const body=rows.map(r=>{
      const share=r.passed/total, isFin=r.nm==='Готово';
      const col=isFin?'#2E9E74':(r.passed?tone(r.stay||0):'#3a4450');
      const wpct=Math.max(share*100,r.passed?6:1.2).toFixed(1);
      const inTxt=share>=0.12?`${fmt(r.passed)} · ${pct0(share)}`:(r.passed?fmt(r.passed):'');
      // циферблат: сегмент = доля медианного времени участка от полного цикла производства
      const cycMed=med(finished.map(cycleOf).filter(x=>x!=null&&x>=0))||1;
      const frac=Math.max(0,Math.min(1,(r.stay||0)/cycMed));
      const RR=12,CC=2*Math.PI*RR,dcol=r.passed?tone(r.stay||0):'#3a4450';
      const dialTd=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Медиана на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Доля полного цикла (${d1(cycMed)} дн)</span><span>${pct(frac)}</span></div>`);
      const dial=`<svg width="30" height="30" viewBox="0 0 30 30" style="flex:none"><circle cx="15" cy="15" r="${RR}" fill="none" stroke="var(--elev)" stroke-width="5"/><circle cx="15" cy="15" r="${RR}" fill="none" stroke="${dcol}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(frac*CC).toFixed(1)} ${CC.toFixed(1)}" transform="rotate(-90 15 15)"/></svg>`;
      const stTxt=isFin?`<span style="color:var(--ink4);font-size:11px">выпуск за период</span>`:(r.passed
        ?`<span class="fun-dial" data-tip="${dialTd}">${dial}<b style="color:${dcol}">${d1(r.stay)} дн</b> <span style="color:var(--ink4)">· ${pct0(frac)} цикла</span></span>`
        :`<span style="color:var(--ink4);font-size:11px">не используется</span>`);
      const td=attr(`<div class='tl'>${r.nm}</div><div class='tr'><span>Прошло за период</span><span>${fmt(r.passed)} из ${fmt(total)} (${pct(share)})</span></div><div class='tr'><span>Медиана времени на участке</span><span>${r.stay!=null?d1(r.stay)+' дн':'—'}</span></div><div class='tr'><span>Сейчас на участке</span><span>${r.wc}${r.wm!=null?' · лежат '+d1(r.wm)+' дн':''}</span></div>`);
      return `<div class="fun-row">
        <div class="fun-nm">${r.nm}</div>
        <div class="fun-tr"><div class="fun-bar" data-tip="${td}" style="width:${wpct}%;background:${col}26;border:1px solid ${col};color:${col}">${inTxt}</div></div>
        <div class="fun-st">${stTxt}</div>
      </div>`}).join('');
    return `${body}<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 5 дн)</span><span><i style="background:#F59E0B"></i>5-10 дн</span><span><i style="background:#FB923C"></i>10-21 дн</span><span><i style="background:#F43F5E"></i>21+ дн (перегруз)</span></div><div class="note">Воронка по участкам: ширина = сколько заказов периода (${modeLbl}: <b>${fmt(total)}</b> шт) проходит через участок, цвет = медиана времени на участке. Широкая и красная = перегруз, время растёт. Узкая = недогруз, участок простаивает. Заказ идёт только по нужным участкам, поэтому ширины не обязаны убывать сверху вниз.</div>`;
  })();

  // ===== УЧАСТКИ таблица =====
  const stTable=(()=>{
    const rows=STATIONS.filter(([nm])=>nm!=='Готово').map(([nm])=>{
      const w=wip.filter(i=>stationOf(i.stageCode)===nm),dws=w.map(dwellNow).filter(x=>x!=null),m=med(dws),mx=dws.length?Math.max(...dws):0;
      let pass=0;all.forEach(i=>{if((i.hist||[]).some(h=>stationOf(h[0])===nm&&inRange(h[1])))pass++});
      return {nm,wip:w.length,m,mx,pass}}); // порядок = как стадии в смарт-процессе
    const body=rows.map(r=>`<tr><td class="nm">${r.nm}</td><td>${r.wip}</td><td style="color:${tone(r.m||0)};font-weight:700">${r.m!=null?d1(r.m)+' дн':'—'}</td><td>${r.mx?r.mx+' дн':'—'}</td><td>${fmt(r.pass)}</td></tr>`).join('');
    return `<table class="tbl"><thead><tr><th>Участок</th><th>В работе сейчас</th><th>Медиана срока</th><th>Макс</th><th>Прошло за период</th></tr></thead><tbody>${body}</tbody></table>`;
  })();

  // ===== ДОРАБОТКИ =====
  const reworkBlock=(()=>{
    const map={};STATIONS.forEach(([nm])=>map[nm]=0);let tot=0;
    all.forEach(i=>{const seen=new Set();(i.hist||[]).forEach(h=>{if(REWORK.has(h[0])&&inRange(h[1])){const st=stationOf(h[0]);if(st&&!seen.has(st)){seen.add(st);map[st]++;tot++}}})});
    const rows=Object.entries(map).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
    const mx=rows.length?rows[0][1]:1;
    const body=rows.map(([nm,c])=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><div style="width:110px;font-size:12px;color:var(--ink2);text-align:right">${nm}</div><div class="hbar" style="flex:1"><i style="width:${(c/mx*100).toFixed(0)}%;background:#FB923C"></i></div><div style="width:34px;font-weight:700;font-size:12px">${c}</div></div>`).join('')||'<div class="card-s">возвратов на доработку в выбранном периоде не зафиксировано</div>';
    return `<div>${body}</div><div class="note">Доработка/Перекрас = заказы, возвращавшиеся на участок повторно (в выбранном периоде). Всего событий: <b>${tot}</b>. Высокий столбец = проблемный участок по качеству.</div>`;
  })();

  // ===== МЕНЕДЖЕРЫ: запуски (шт и ₽) + просчёты (потенциал производства) =====
  const mgrBlock=(()=>{
    const m={};cut.forEach(i=>{const n=mgrOf(i);(m[n]=m[n]||{n,tot:0,done:0,wip:0,cyc:[],sum:0});
      m[n].tot++;if(isDone(i))m[n].done++;if(isWip(i))m[n].wip++;
      const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c)});
    uniqByDeal(cut).forEach(i=>{const n=mgrOf(i);(m[n]=m[n]||{n,tot:0,done:0,wip:0,cyc:[],sum:0});m[n].sum+=moneyOf(i)});
    // просчёты: открытые сделки на стадиях расчёта (снимок «сейчас», приходит из fetch-prod)
    const QT=(DATA.quotes&&DATA.quotes.deals)||null;
    const q={};let qTot=0,qSum=0;
    if(QT)QT.forEach(d=>{const n=d.mgr||'—';(q[n]=q[n]||{cnt:0,sum:0});q[n].cnt++;q[n].sum+=d.budget||0;qTot++;qSum+=d.budget||0;
      if(!m[n])m[n]={n,tot:0,done:0,wip:0,cyc:[],sum:0}});
    const rows=Object.values(m);
    rows.forEach(r=>{r.cycM=med(r.cyc);r.q=(q[r.n]||{}).cnt||0;r.qm=(q[r.n]||{}).sum||0});
    sortRows(rows,S.mgrSort,{n:r=>r.n,tot:r=>r.tot,sum:r=>r.sum,done:r=>r.done,cyc:r=>r.cycM,q:r=>r.q,qm:r=>r.qm});
    const totS=sum(rows,r=>r.sum);
    // три зоны: запуски - синий, выпуск - зелёный, потенциал - фиолетовый
    const LZ='rgba(34,211,238,.16)',LB='rgba(34,211,238,.05)';   // запуски
    const WZ='rgba(46,158,116,.18)',WB='rgba(46,158,116,.05)';   // выпуск
    const PZ='rgba(167,139,250,.16)',PB='rgba(167,139,250,.05)'; // потенциал
    const mxT=Math.max(1,...rows.map(r=>r.tot)),mxS=Math.max(1,...rows.map(r=>r.sum)),mxD=Math.max(1,...rows.map(r=>r.done)),mxQ=Math.max(1,...rows.map(r=>r.q)),mxQM=Math.max(1,...rows.map(r=>r.qm));
    const zb=(v,mx,col,base)=>{if(!v)return `background:${base};`;const w=Math.max(v/mx*100,3).toFixed(1);return `background:linear-gradient(90deg,${col} ${w}%,${base} ${w}%);`};
    const body=rows.slice(0,16).map(r=>{const qq=q[r.n];
      return `<tr><td class="nm">${esc(r.n)}</td>
      <td style="${zb(r.tot,mxT,LZ,LB)}"><b>${r.tot}</b></td><td style="${zb(r.sum,mxS,LZ,LB)}"><b>${fmtK(r.sum)} ₽</b></td><td style="color:var(--ink4);${zb(r.sum,mxS,LZ,LB)}">${totS?pct(r.sum/totS):'—'}</td>
      <td style="${zb(r.done,mxD,WZ,WB)}">${r.done}</td>
      <td style="color:${tone(r.cycM||0)};background:${WB}">${r.cycM!=null?d1(r.cycM)+' дн':'—'}</td>
      <td style="color:${r.q?'#A78BFA':'var(--ink4)'};${zb(r.q,mxQ,PZ,PB)}">${r.q||(QT?0:'—')}</td>
      <td style="color:${r.qm?'#A78BFA':'var(--ink4)'};font-weight:${r.qm?700:400};${zb(r.qm,mxQM,PZ,PB)}">${r.qm?fmtK(r.qm)+' ₽':QT?'0 ₽':'—'}</td></tr>`}).join('');
    const allCyc=med(rows.flatMap(r=>r.cyc));
    const foot=`<tr style="border-top:2px solid var(--border2)"><td class="nm" style="font-weight:800">Итого</td>
      <td style="font-weight:800;background:${LZ}">${fmt(sum(rows,r=>r.tot))}</td><td style="font-weight:800;background:${LZ}">${fmtK(totS)} ₽</td><td style="background:${LZ}">100%</td>
      <td style="font-weight:800;background:${WZ}">${fmt(sum(rows,r=>r.done))}</td>
      <td style="background:${WZ};color:${tone(allCyc||0)}">${allCyc!=null?d1(allCyc)+' дн':'—'}</td>
      <td style="font-weight:800;color:#A78BFA;background:${PZ}">${QT?fmt(qTot):'—'}</td>
      <td style="font-weight:800;color:#A78BFA;background:${PZ}">${QT?fmtK(qSum)+' ₽':'—'}</td></tr>`;
    const qNote=QT
      ?`Просчёты<span class="now-badge">сейчас</span> = открытые сделки на стадиях Расчёт / Формирование ТЗ / КП отправлено / Принимают решение / Долгострой: потенциал цеха <b>${fmt(qTot)}</b> сделок на <b>${fmtK(qSum)} ₽</b>. Снимок текущего момента, на фильтр периода не реагирует.`
      :`Просчёты появятся после ближайшего снимка данных (нужен ночной сбор с обновлённым коннектором).`;
    return `<table class="tbl"><thead><tr><th></th><th colspan="3" style="text-align:center;color:var(--cyan);background:rgba(34,211,238,.07);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ЗАПУСКИ · за период</th><th colspan="2" style="text-align:center;color:#2E9E74;background:rgba(46,158,116,.08);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ВЫПУСК</th><th colspan="2" style="text-align:center;color:#A78BFA;background:rgba(167,139,250,.08);font-size:10px;letter-spacing:.05em;border-radius:6px 6px 0 0">ПОТЕНЦИАЛ · сейчас</th></tr><tr>${thRow('mgr',S.mgrSort,[['n','Менеджер'],['tot','Запусков'],['sum','Запуски ₽'],[null,'Доля ₽'],['done','Выпущено'],['cyc','Ср.срок'],['q','Просчёты'],['qm','Потенциал ₽']])}</tr></thead><tbody>${body}${foot}</tbody></table><div class="note">Менеджер = ответственный связанной сделки (${modeLbl}). <b style="color:var(--cyan)">Запуски</b> = позиции, ушедшие в цех за период; <b style="color:#2E9E74">Выпуск</b>: «Выпущено» = из них уже ВЫШЛО из производства (дошло до «Успех»), Ср.срок = медиана их цикла; <b style="color:#A78BFA">Потенциал</b> = будущий поток: открытые сделки в просчёте (сейчас). Запуски ₽ = бюджеты уникальных сделок (изделия одной сделки не задваивают деньги). Без привязки к сделке: <b>${fmt(cut.filter(i=>!i.dealId).length)}</b> из ${fmt(cut.length)}. ${qNote}</div>`;
  })();

  // ===== ЧТО ПРОИЗВОДИМ: два бублика =====
  const mixBlock=(()=>{
    const base=cut;
    const by=(key)=>{const m={};base.forEach(i=>{const v=i[key]||'не указано';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    const PAL=['#22D3EE','#2E9E74','#A78BFA','#F59E0B','#F43F5E','#38BDF8','#10B981','#FB923C'];
    if(!base.length)return '<div class="card-s">нет заказов в выбранном периоде</div>';
    return `<div class="grid2"><div><div class="card-s" style="margin-bottom:8px">По ассортименту</div>${donut(by('assort'),base.length,PAL,'заказов')}</div><div><div class="card-s" style="margin-bottom:8px">По направлению бренда</div>${donut(by('dir'),base.length,PAL,'заказов')}</div></div>`;
  })();

  // ===== КОНСТРУКТОРЫ =====
  const consTable=(()=>{
    const m={};cut.forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].tot++;if(isDone(i))m[n].done++;const c=cycleOf(i);if(c!=null&&c>=0&&isDone(i))m[n].cyc.push(c);if((i.hist||[]).some(h=>REWORK.has(h[0])))m[n].rew++});
    uniqByDeal(cut).forEach(i=>{const n=i.constructor||'—';(m[n]=m[n]||{n,tot:0,done:0,cyc:[],sum:0,rew:0});m[n].sum+=moneyOf(i)});
    const rows=Object.values(m);
    rows.forEach(r=>{r.cycM=med(r.cyc);r.avg=r.tot?r.sum/r.tot:0});
    sortRows(rows,S.conSort,{n:r=>r.n,tot:r=>r.tot,done:r=>r.done,cyc:r=>r.cycM,rew:r=>r.rew,avg:r=>r.avg,sum:r=>r.sum});
    const body=rows.slice(0,12).map(r=>`<tr><td class="nm">${esc(r.n)}</td><td>${r.tot}</td><td>${r.done}</td><td style="color:${tone(r.cycM||0)}">${r.cycM!=null?d1(r.cycM)+' дн':'—'}</td><td>${r.rew}</td><td>${r.tot?fmtK(r.avg):'—'} ₽</td><td>${fmtK(r.sum)} ₽</td></tr>`).join('')||'<tr><td colspan="7" class="card-s">нет заказов в периоде</td></tr>';
    const tTot=sum(rows,r=>r.tot),tDone=sum(rows,r=>r.done),tRew=sum(rows,r=>r.rew),tSum=sum(rows,r=>r.sum),tCyc=med(rows.flatMap(r=>r.cyc));
    // Итого - первой строкой: на него смотрят чаще, чем на разбивку
    const foot=rows.length?`<tr style="border-bottom:2px solid var(--border2);background:rgba(34,211,238,.05)"><td class="nm" style="font-weight:800">Итого</td><td style="font-weight:800">${fmt(tTot)}</td><td style="font-weight:800">${fmt(tDone)}</td><td style="color:${tone(tCyc||0)};font-weight:800">${tCyc!=null?d1(tCyc)+' дн':'—'}</td><td style="font-weight:800">${fmt(tRew)}</td><td style="font-weight:800">${tTot?fmtK(tSum/tTot):'—'} ₽</td><td style="font-weight:800">${fmtK(tSum)} ₽</td></tr>`:'';
    return `<table class="tbl"><thead><tr>${thRow('con',S.conSort,[['n','Конструктор'],['tot','Позиций'],['done','Готово'],['cyc','Ср.срок'],['rew','Доработок'],['avg','Ср.чек'],['sum','Сумма']])}</tr></thead><tbody>${foot}${body}</tbody></table>`;
  })();

  // ===== КОНСТРУКТОРЫ: профиль по чекам, сортировка ₽/дни/шт =====
  const consScatter=(()=>{
    const pts=cut.filter(i=>isDone(i)&&moneyOf(i)>0).map(i=>({b:moneyOf(i),c:cycleOf(i),n:i.constructor||'—'})).filter(p=>p.c!=null&&p.c>=0);
    if(pts.length<5)return '<div class="card-s">мало готовых заказов с чеком в периоде</div>';
    const BK=[['Дешёвые · до 100 тыс',0,1e5],['Средние · 100-300 тыс',1e5,3e5],['Дорогие · от 300 тыс',3e5,Infinity]];
    const bkOf=b=>BK.findIndex(([,a,z])=>b>=a&&b<z);
    const m={};pts.forEach(p=>{(m[p.n]=m[p.n]||{n:p.n,tot:0,sum:0,cyc:[],bk:[[],[],[]]});m[p.n].tot++;m[p.n].sum+=p.b;m[p.n].cyc.push(p.c);m[p.n].bk[bkOf(p.b)].push(p)});
    const srt=S.consSort||'money';
    const keyF=srt==='days'?(r=>med(r.cyc)||0):srt==='cnt'?(r=>r.tot):(r=>r.sum);
    const rows=Object.values(m).sort((a,b)=>keyF(b)-keyF(a)).slice(0,10);
    const allRow={n:'Все конструкторы',tot:pts.length,sum:sum(pts,p=>p.b),cyc:pts.map(p=>p.c),bk:[[],[],[]]};
    pts.forEach(p=>allRow.bk[bkOf(p.b)].push(p));
    // выбранная метрика (₽/Дни/Шт) задаёт и ширину гистограммы, и главную цифру ячейки
    const cellVal=(arr)=>srt==='days'?(med(arr.map(p=>p.c))||0):srt==='cnt'?arr.length:sum(arr,p=>p.b);
    const colMax=[0,1,2].map(k=>Math.max(1e-9,...rows.concat([allRow]).map(r=>r.bk[k].length?cellVal(r.bk[k]):0)));
    const cell=(r,k)=>{const arr=r.bk[k];if(!arr.length)return `<div class="pr-cell"><span style="color:var(--ink4)">—</span></div>`;
      const share=arr.length/r.tot, mc=med(arr.map(p=>p.c)), col=toneC(mc||0), money=sum(arr,p=>p.b);
      const w=Math.max(cellVal(arr)/colMax[k]*100,4);
      const parts={money:`${fmtK(money)} ₽`,cnt:`${arr.length} шт`,days:`${d1(mc)} дн`};
      const main=srt==='days'?parts.days:srt==='cnt'?parts.cnt:parts.money;
      const rest=['money','cnt','days'].filter(x=>x!==(srt==='days'?'days':srt==='cnt'?'cnt':'money')).map(x=>parts[x]).join(' · ');
      const td=attr(`<div class='tl'>${esc(r.n)} · ${BK[k][0]}</div><div class='tr'><span>Деньги</span><span>${fmtK(money)} ₽</span></div><div class='tr'><span>Заказов</span><span>${fmt(arr.length)} (${pct(share)} его заказов)</span></div><div class='tr'><span>Медиана срока</span><span>${d1(mc)} дн</span></div>`);
      return `<div class="pr-cell" data-tip="${td}"><i style="width:${w.toFixed(1)}%;background:${col}30;border-right:2px solid ${col}"></i><span><b style="color:${col}">${main}</b>&nbsp;<span style="color:var(--ink3)">· ${rest}</span></span></div>`};
    const totCell=(r)=>{const md=med(r.cyc);const parts={money:`<b>${fmtK(r.sum)}</b> ₽`,cnt:`<b>${r.tot}</b> шт`,days:`<b style="color:${toneC(md||0)}">${d1(md)} дн</b>`};
      const key=srt==='days'?'days':srt==='cnt'?'cnt':'money';
      return `<div class="pr-tot">${parts[key]} · ${['money','cnt','days'].filter(x=>x!==key).map(x=>parts[x].replace(/<\/?b[^>]*>/g,'')).join(' · ')}</div>`};
    const row=(r,hl)=>`<div class="pr-row"${hl?' style="border-bottom:1px solid var(--border2);padding-bottom:10px;margin-bottom:4px"':''}>
      <div class="pr-nm"${hl?' style="color:var(--ink3)"':''}>${esc(r.n)}</div>${cell(r,0)}${cell(r,1)}${cell(r,2)}${totCell(r)}</div>`;
    const head=`<div class="pr-row" style="margin-bottom:2px"><div></div>${BK.map(([l])=>`<div class="pr-head">${l}</div>`).join('')}<div class="pr-head" style="text-align:right">Итого</div></div>`;
    return head+row(allRow,true)+rows.map(r=>row(r)).join('')+
      `<div class="legend"><span><i style="background:#2E9E74"></i>быстро (до 15 дн)</span><span><i style="background:#F59E0B"></i>15-25 дн</span><span><i style="background:#FB923C"></i>25-40 дн</span><span><i style="background:#F43F5E"></i>40+ дн (возится)</span></div>`+
      `<div class="note">Переключатель сверху (₽ / Дни / Шт) меняет и гистограммы, и главную цифру ячеек, и сортировку строк. <b>Длина полосы</b> = выбранная метрика относительно максимума колонки, <b>цвет</b> = медиана срока (краснее - дольше). Самая длинная и красная = приоритетная очередь. Первая строка - весь цех. Наведи на ячейку - детали.</div>`;
  })();

  // ===== ПРОИЗВОДСТВЕННЫЙ КАЛЕНДАРЬ: факт × пропускная способность (в ИЗДЕЛИЯХ) =====
  const calBlock=(()=>{
    if(!keys.length)return '<div class="card-s">нет периода</div>';
    const wkOf=ds=>{const dt=D(ds);if(!dt)return null;const w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w);return iso(dt)};
    const scale=S.gran==='d'?1/7:S.gran==='m'?30.4/7:1;
    const ki={};keys.forEach((k,i)=>ki[k]=i);
    // события: {d:дата, q:изделий, p:позиций}
    const mkRow=(nm,evts,primary)=>{
      const q=keys.map(()=>0),pp=keys.map(()=>0),wk={};
      evts.forEach(e=>{const k=bkey(e.d);if(k in ki){q[ki[k]]+=e.q;pp[ki[k]]++}const wkk=wkOf(e.d);if(wkk)wk[wkk]=(wk[wkk]||0)+e.q});
      const weeks=Object.values(wk);
      const norm=(weeks.length?weeks.reduce((a,b)=>a+b,0)/weeks.length:0)*scale;
      return {nm,q,pp,norm,sum:q.reduce((a,b)=>a+b,0),psum:pp.reduce((a,b)=>a+b,0),primary}};
    const rows=[];
    rows.push(mkRow('▶ Запуск в цех',IT.filter(dirOk).filter(i=>startDate(i)).map(i=>({d:startDate(i),q:qtyOf(i)})),true));
    // остаток «в работе» на конец каждого бакета: запущено <= конца и ещё не готово (в изделиях)
    rows.push((()=>{
      const q=keys.map(()=>null),pp=keys.map(()=>null);
      keys.forEach((k,ix)=>{const t=bend(k);if(t>NOWS)return;let qq=0,pc=0;
        IT.filter(dirOk).forEach(i=>{const s=startDate(i);if(!s||s>t)return;const f=successDate(i);if(f&&f<=t)return;qq+=qtyOf(i);pc++});
        q[ix]=qq;pp[ix]=pc});
      const vals=q.filter(v=>v!=null);
      const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
      let nowQ=0,nowP=0;IT.filter(dirOk).forEach(i=>{const s=startDate(i);if(!s||s>NOWS)return;const f=successDate(i);if(f&&f<=NOWS)return;nowQ+=qtyOf(i);nowP++});
      return {nm:'⏳ В работе',q,pp,norm:avg,sum:nowQ,psum:nowP,primary:true,stock:true};
    })());
    rows.push(mkRow('✔ Выпуск (готово)',done.filter(i=>successDate(i)).map(i=>({d:successDate(i),q:qtyOf(i)})),true));
    STATIONS.filter(([nm])=>nm!=='Передано'&&nm!=='Готово').forEach(([nm])=>{
      const evts=[];IT.filter(dirOk).forEach(i=>(i.hist||[]).forEach(h=>{if(stationOf(h[0])===nm&&h[1])evts.push({d:h[1],q:qtyOf(i)})}));
      if(evts.length)rows.push(mkRow(nm,evts,false))});
    const showN=keys.length<=14, showP=keys.length<=40, gap=keys.length>60?1:2;
    const gTone=r=>r>1.3?'#F43F5E':r>1?'#FB923C':'#2E9E74';
    const rowHtml=r=>{
      const H=r.primary?30:17, alpha=r.primary?1:0.62, fs=r.primary?10.5:9;
      const mx=Math.max(1,...r.q.filter(v=>v!=null)); // максимум строки за период - точка отсчёта теплоты
      const heat=t=>t>=.75?`rgba(244,63,94,${(Math.min(.3+t*.5,.85)*alpha).toFixed(2)})`:t>=.4?`rgba(251,146,60,${((.25+t*.5)*alpha).toFixed(2)})`:`rgba(46,158,116,${((.16+t*.9)*alpha).toFixed(2)})`;
      const cells=r.q.map((v,i)=>{
        if(v==null)return `<div class="cal-c" style="height:${H}px;background:var(--elev);opacity:.35"></div>`;
        const ratio=r.norm>0?v/r.norm:0, t=r.stock?Math.min(ratio/1.6,1):v/mx;
        const bg=v===0?'var(--elev)':r.stock?(ratio>1.3?`rgba(244,63,94,${(Math.min(.25+ratio*.2,.85)*alpha).toFixed(2)})`:ratio>1?`rgba(251,146,60,${(Math.min(.3+ratio*.3,.8)*alpha).toFixed(2)})`:`rgba(46,158,116,${((.18+ratio*.6)*alpha).toFixed(2)})`):heat(t);
        const td=r.stock
          ?attr(`<div class='tl'>${r.nm} · ${blabel(keys[i])}</div><div class='tr'><span>В работе, шт</span><span>${fmt(v)}</span></div><div class='tr'><span>Позиций (карточек)</span><span>${fmt(r.pp[i])}</span></div><div class='tr'><span>Средний уровень, шт</span><span>${d1(r.norm)}</span></div><div class='tr'><span>К среднему</span><span>${r.norm?pct(ratio):'—'}</span></div>`)
          :attr(`<div class='tl'>${r.nm} · ${blabel(keys[i])}</div><div class='tr'><span>Штук</span><span>${fmt(v)}</span></div><div class='tr'><span>Изделий (карточек)</span><span>${fmt(r.pp[i])}</span></div><div class='tr'><span>Максимум строки, шт</span><span>${fmt(mx)}</span></div><div class='tr'><span>Теплота (от макс.)</span><span>${pct(v/mx)}</span></div><div class='tr'><span>Ср. пропускная, изд.</span><span>${d1(r.norm)}</span></div>`);
        return `<div class="cal-c" data-tip="${td}" style="height:${H}px;background:${bg};color:${v&&t>.45?'#06121a':'var(--ink3)'};font-size:${fs}px">${(showN||(r.primary&&showP))&&v?v:''}</div>`}).join('');
      const load=r.stock?(r.norm>0?r.sum/r.norm:null):(r.norm>0?r.sum/(r.norm*keys.length):null);
      const lc=load==null?'#5a6672':gTone(load);
      return `<div class="cal-row"><div class="cal-nm" style="${r.primary?'font-size:12.5px;color:var(--ink)':'font-size:11px;color:var(--ink3)'}">${r.nm}</div><div class="cal-cells" style="gap:${gap}px">${cells}</div><div class="cal-sum" style="${r.primary?'':'font-weight:600;color:var(--ink3)'}">${fmt(r.sum)}${r.stock?'<span style="font-weight:400;color:var(--ink4);font-size:9px"> сейчас</span>':''}</div><div class="cal-norm">${d1(r.norm)}</div><div class="cal-pct" style="color:${lc};background:${lc}1c">${load!=null?pct0(load):'—'}</div></div>`};
    const step=Math.ceil(keys.length/12);
    const heads=keys.map((k,i)=>`<div class="cal-head" style="flex:1">${(i%step===0||i===keys.length-1)?blabel(k):''}</div>`).join('');
    const headRow=`<div class="cal-row" style="margin-bottom:0"><div></div><div class="cal-cells">${heads}</div><div class="cal-head" style="text-align:right">Σ шт.</div><div class="cal-head" style="text-align:right">норма</div><div class="cal-head">%</div></div>`;
    const primary=rows.filter(r=>r.primary).map(rowHtml).join('');
    const secondary=rows.filter(r=>!r.primary).map(rowHtml).join('');
    const divider=`<div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink4)">Участки · входы, шт (второстепенно)</span><div style="flex:1;height:1px;background:var(--border)"></div></div>`;
    return headRow+primary+divider+secondary+`<div class="legend"><span><i style="background:rgba(46,158,116,.6)"></i>тихие ${S.gran==='d'?'дни':'периоды'} (до 40% макс.)</span><span><i style="background:rgba(251,146,60,.6)"></i>40-75% макс.</span><span><i style="background:rgba(244,63,94,.6)"></i>пиковые (75%+ от максимума строки)</span><span style="color:var(--ink4)">цвет = теплота к МАКСИМУМУ своей строки за период (пиковый ${S.gran==='d'?'день':'период'} = красный, 1 штука при максимуме 5 = зелёная) · все цифры = ИЗДЕЛИЯ (карточка без товарных строк = 1), позиции - в подсказке · % справа = объём строки к средней пропускной из истории · строка «В работе» = остаток на конец периода: Σ = сейчас, краснее = выше среднего (копим)</span></div>`;
  })();

  const perLbl=`${S.from.split('-').reverse().join('.')} - ${S.to.split('-').reverse().join('.')}`;
  document.getElementById('root').innerHTML=
    `<div class="sec" id="sec1"><div class="n">1</div><h2>Производство</h2><div class="ln"></div><div class="hint">период: <b>${perLbl}</b>${S.dir?' · '+S.dir:''} · срез: <b style="color:#22D3EE">${modeLbl}</b> (влияет на состав, менеджеров, конструкторов; KPI запуска и выпуска всегда по своим датам) · «сейчас» = моментальный снимок</div></div>`+kpis+
    `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:9px 14px;background:var(--elev);border:1px solid var(--border);border-radius:10px;font-size:11.5px;color:var(--ink3)"><b style="color:#A78BFA">СДЕЛКА</b> - ей управляет отдел продаж (деньги, менеджер) <span style="color:var(--ink4)">→</span> <b style="color:#60A5FA">ИЗДЕЛИЕ (карточка)</b> - создаётся при передаче в цех, по одному на тип изделия в заказе, ходит по участкам <span style="color:var(--ink4)">→</span> <b style="color:#2DD4BF">ШТУКИ</b> - количество из товарных строк карточки (изделие × кол-во), именно штуки грузят участки</div>`+
    syncBlock+
    `<div class="card"><div class="card-h"><div><div class="card-t">Труба производства: каких участков коснулись изделия <span class="qm" data-tip="Как воронка сделок у РОПа, но для цеха: сколько изделий (карточек-нарядов) или штук (изделия × количество из товарных строк - по тумблеру) выбранного среза прошло через каждый участок за период. Изделие идёт только по НУЖНЫМ участкам, поэтому столбики не обязаны убывать. Очередь «сейчас» - в «Стаканах участков» ниже.">?</span></div><div class="card-s">${S.trubaUnit==='pcs'?'штуки':'изделия (карточки)'} через участки за период</div></div><div class="seg" id="trubaSeg"><button data-v="cards" class="${S.trubaUnit!=='pcs'?'on':''}">Изделия</button><button data-v="pcs" class="${S.trubaUnit==='pcs'?'on':''}">По штучно</button></div></div>${prodTruba}</div>`+
    `<div class="grid2">`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Запуск vs выпуск</div><div class="card-s">синяя = передано в производство, зелёная = готово${S.dynUnit==='money'?' (суммы сделок, ₽)':''}. Синяя стабильно выше - незавершёнка копится, цех не успевает.</div></div><div class="seg" id="dynUnitSeg"><button data-v="cnt" class="${S.dynUnit!=='money'?'on':''}">Шт</button><button data-v="money" class="${S.dynUnit==='money'?'on':''}">₽</button></div></div>${dynFlow}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Незавершёнка и заторы</div><div class="card-s">оранжевая = сколько заказов было в производстве на конец каждого периода, красная = из них без движения >14 дн. Рост красной = копятся заторы.</div></div></div>${dynWip}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Средний срок производства</div><div class="card-s">медиана «запуск → готово» по готовым заказам, сгруппированным по дате ${isStart?'запуска':'готовности'}. Рост = производим медленнее.</div></div></div>${dynCyc}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">${isStart?'Запуск':'Выпуск'} в деньгах</div><div class="card-s">суммы уникальных сделок по заказам, ${isStart?'переданным в производство':'ставшим готовыми'} в каждом периоде.</div></div></div>${dynMoney}</div>`+
    `</div>`+
    pedalsBlock+`<div class="card"><div class="card-h"><div><div class="card-t">Стаканы участков: мощность vs очередь</div><div class="card-s">на каждый участок два столбика: мощность (шт/нед из истории) и очередь сейчас (шт) · бейдж = за сколько дней разгребётся · порядок участков = как в смарт-процессе</div></div></div>${stationsBlock}</div>`+
    `<div class="sec" id="sec2"><div class="n">2</div><h2>Участки</h2><div class="ln"></div><div class="hint">где заказы лежат дольше всего и где страдает качество</div></div>`+
    `<div class="grid2"><div class="card"><div class="card-h"><div><div class="card-t">Скорость по участкам</div><div class="card-s">в работе сейчас + медиана/макс срока лежания · красное = застряли · порядок = как в смарт-процессе</div></div></div>${stTable}</div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Доработки и перекрас (качество)</div><div class="card-s">возвраты на участок повторно в выбранном периоде - индикатор брака</div></div></div>${reworkBlock}</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Что производим</div><div class="card-s">структура заказов (${modeLbl}) · «не указано» = дыра в заполнении карточек</div></div></div>${mixBlock}</div>`+
    `<div class="sec" id="sec3"><div class="n">3</div><h2>Подготовка к производству</h2><div class="ln"></div><div class="hint">потенциал цеха: слева - что отдел продаж передал и держит в расчётах, справа - что конструкторы уже проектируют</div></div>`+
    `<div class="grid2" style="align-items:start">`+deptBlock+
    `<div class="card"><div class="card-h"><div><div class="card-t">Конструкторы</div><div class="card-s">позиции, готово, срок, доработки, средний чек, сумма (${modeLbl})</div></div></div>${consTable}</div></div>`+
    
    `<div class="sec" id="sec4"><div class="n">4</div><h2>Производственный календарь</h2><div class="ln"></div><div class="hint">факт против пропускной способности: где и когда цех был загружен, перегружен или простаивал</div></div>`+
    `<div class="card"><div class="card-h"><div><div class="card-t">Запуск, в работе и выпуск по ${S.gran==='d'?'дням':S.gran==='m'?'месяцам':'неделям'} · в штуках <span class="qm" data-tip="Завели → накопили → выдали: запуск в цех, остаток в работе и выпуск (крупные строки), ниже участки как второстепенные. Ячейка = ШТУК, изделия (карточки) в подсказке. Цвет = теплота к максимуму своей строки за период: пиковый день красный, тихий зелёный. Справа Σ за период, норма (средняя пропускная из истории) и % к ней. Строка «В работе» - остаток на конец периода: Σ = сейчас, краснее = выше среднего.">?</span></div><div class="card-s">завели → накопили → выдали · Σ / норма / % справа</div></div></div>${calBlock}</div>`;
  document.getElementById('periodLabel').textContent=perLbl;
  wireCharts();

  // freshness
  const fr=document.getElementById('fresh');
  if(DATA.generatedAt){const g=new Date(DATA.generatedAt),m=new Date(g.getTime()+3*36e5),p=n=>String(n).padStart(2,'0');
    const ageH=(new Date()-g)/36e5,col=ageH>48?'#F43F5E':ageH>30?'#F59E0B':'#2E9E74';
    fr.textContent='данные на '+p(m.getUTCDate())+'.'+p(m.getUTCMonth()+1)+' '+p(m.getUTCHours())+':'+p(m.getUTCMinutes())+' МСК';fr.style.color=col;
    if(DATA.bakedAt){const bkd=new Date(new Date(DATA.bakedAt).getTime()+3*36e5);fr.textContent+=' · сборка '+p(bkd.getUTCDate())+'.'+p(bkd.getUTCMonth()+1)+' '+p(bkd.getUTCHours())+':'+p(bkd.getUTCMinutes())}}
}

// ===== подсказки (как в РОП): плавающий тултип + вертикальный пунктир на графиках =====
const tipEl=document.getElementById('tip');
function tipShow(html,x,y){tipEl.innerHTML=html;tipEl.style.opacity=1;let nx=x+14,ny=y+14;
  if(nx+tipEl.offsetWidth>innerWidth)nx=x-tipEl.offsetWidth-14;if(ny+tipEl.offsetHeight>innerHeight)ny=y-tipEl.offsetHeight-14;
  tipEl.style.left=nx+'px';tipEl.style.top=ny+'px'}
function tipHide(){tipEl.style.opacity=0}
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t)tipShow(t.getAttribute('data-tip'),e.clientX,e.clientY);else tipHide()});
function wireCharts(){document.querySelectorAll('svg.xh-chart').forEach(svg=>{const xh=svg.querySelector('.xhair');if(!xh)return;
  svg.querySelectorAll('rect[data-cx]').forEach(r=>r.addEventListener('mousemove',()=>{const cx=r.getAttribute('data-cx');xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity','0.5')}));
  svg.addEventListener('mouseleave',()=>xh.setAttribute('opacity','0'))})}

// ===== контролы =====
function segWire(id,key){const seg=document.getElementById(id);seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));S[key]=b.dataset.v;
  if(key==='preset'){applyPreset(b.dataset.v)}render()})}
function applyPreset(v){if(v==='all'){S.from=MIND;S.to=NOWS}
  else if(v==='y'){const y=iso(new Date(NOW-864e5));S.from=y;S.to=y}
  else{const n=+v;const a=new Date(NOW-(n-1)*864e5);S.from=iso(a);S.to=NOWS}
  document.getElementById('dFrom').value=S.from;document.getElementById('dTo').value=S.to}
(function init(){
  // направления из данных
  const dirs=[...new Set(IT.map(i=>i.dir).filter(v=>v&&v!=='не указано'))].sort();
  const sel=document.getElementById('dirSel');
  dirs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});
  sel.addEventListener('change',()=>{S.dir=sel.value;render()});
  segWire('modeSeg','mode');segWire('granSeg','gran');segWire('presetSeg','preset');
  const SECS=['Производство','Участки','Подготовка','Календарь'];
  const nav=document.getElementById('nav');
  if(nav){nav.innerHTML=SECS.map((t,i)=>`<button data-i="${i+1}" class="${i===0?'on':''}">${t}</button>`).join('');
    nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const t=document.getElementById('sec'+b.dataset.i);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});}
  document.addEventListener('click',e=>{const b=e.target.closest('#consSortSeg button');if(b){S.consSort=b.dataset.v;render();return}
    const u=e.target.closest('#dynUnitSeg button');if(u){S.dynUnit=u.dataset.v;render();return}
    const tu=e.target.closest('#trubaSeg button');if(tu){S.trubaUnit=tu.dataset.v;render();return}
    const sd=e.target.closest('#syncDirSeg button');if(sd){S.syncDir=sd.dataset.v;render();return}
    const dr=e.target.closest('tr[data-dept]');if(dr){const k=dr.dataset.dept;S.deptOpen[k]=!S.deptOpen[k];render();return}
    const mr=e.target.closest('tr[data-mgr]');if(mr&&!e.target.closest('a')){const k=mr.dataset.mgr;S.mgrOpen[k]=!S.mgrOpen[k];render();return}
    const dh=e.target.closest('th[data-dsk]');if(dh){const st=S.dSort;if(st.k===dh.dataset.dsk)st.a=!st.a;else{st.k=dh.dataset.dsk;st.a=false}render();return}
    const th=e.target.closest('th[data-sk]');if(th){const st=th.dataset.tbl==='mgr'?S.mgrSort:th.dataset.tbl==='sm'?S.smSort:S.conSort;
      if(st.k===th.dataset.sk)st.a=!st.a;else{st.k=th.dataset.sk;st.a=false}render()}});
  applyPreset('30');S.preset='30'; // дефолт: 30 дней (решение Ивана, как у РОПа)
  const df=document.getElementById('dFrom'),dt=document.getElementById('dTo');
  df.value=S.from;dt.value=S.to;
  document.getElementById('applyCustom').addEventListener('click',()=>{
    if(df.value)S.from=df.value;if(dt.value)S.to=dt.value;
    if(S.from>S.to){const t=S.from;S.from=S.to;S.to=t;df.value=S.from;dt.value=S.to}
    document.querySelectorAll('#presetSeg button').forEach(x=>x.classList.remove('on'));render()});
  render();
  // Анти-кэш для боевого адреса /prod/: деплой кладёт рядом v.txt со штампом сборки.
  // Проверяем при загрузке, при возврате на вкладку и раз в 15 минут: давно открытая
  // вкладка тоже подтянет свежую сборку. Перезагрузка одна на версию (sessionStorage).
  (function(){try{
    if(location.protocol==='file:'||!DATA.bakedAt)return;
    const chk=()=>{fetch('v.txt?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(v=>{
      v=(v||'').trim();if(!v||v===DATA.bakedAt)return;
      if(v<DATA.bakedAt)return; // на сервере не новее нашей - не дёргаемся
      if(sessionStorage.getItem('_vchk')===v)return; // защита от цикла, если кэш упрямый
      sessionStorage.setItem('_vchk',v);location.replace(location.pathname+'?v='+encodeURIComponent(v));
    }).catch(()=>{})};
    chk();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
    setInterval(chk,9e5);
  }catch(e){}})();
})();
</script></body></html>
