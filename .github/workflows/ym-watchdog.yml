name: Market automatic recovery

on:
  schedule:
    - cron: '17 8,12,16 * * *' # 11:17, 15:17, 19:17 MSK; GitHub may delay these too.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ym-watchdog
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check sources and recover a missing Market collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B analytics-mvp/tools/ym/watchdog.py
